<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory | Luxury Wrist Brand ERP</title>
  <script src="erp-date.js"></script><script src="erp-recent.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="party-list.js" defer></script>
  <script src="brand-filter.js"></script>
  <link rel="stylesheet" href="erp-shell.css">
  <script src="erp-shell.js"></script>
  <style>
    .status{text-align:center;padding:80px 20px;font-size:15px;color:#555}
    .inv-sub{margin:-8px 0 14px;color:var(--erp-muted);font-size:13px}
    .inv-filters{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:14px}
    .inv-filters label{display:block;font-size:12px;font-weight:600;color:#4b5763;margin-bottom:4px}
    .inv-filters input,.inv-filters select{height:38px;border:1.5px solid var(--erp-line);border-radius:6px;padding:0 10px;font:inherit;background:#fff;color:var(--erp-ink)}
    .inv-filters select{min-width:170px;cursor:pointer}
    .inv-filters select.on{border-color:var(--erp-red);font-weight:600}
    .inv-filters input:focus,.inv-filters select:focus{outline:none;border-color:var(--erp-red)}
    .inv-filters .grow{flex:1;min-width:200px}.inv-filters .grow input{width:100%}
    .inv-filters button{height:38px;border-radius:6px;padding:0 16px;font-weight:600;cursor:pointer;border:1px solid var(--erp-red);background:var(--erp-red);color:#fff}
    .inv-filters button.ghost{background:#fff;color:var(--erp-ink);border-color:var(--erp-line)}
    .inv-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}
    .inv-kpi{background:#fff;border:1px solid var(--erp-line);border-radius:8px;padding:14px 16px;cursor:pointer;text-align:left;font:inherit;color:inherit}
    .inv-kpi:hover{border-color:var(--erp-red)}
    .inv-kpi span{display:block;font-size:12.5px;color:var(--erp-muted)}
    .inv-kpi b{display:block;font-size:22px;font-weight:600;margin-top:4px}
    .inv-kpi b .nw{display:inline;white-space:nowrap;font-size:inherit;color:inherit;margin:0}
    .inv-sku small{display:block;color:var(--erp-muted);font-size:11.5px;margin-top:1px}
    .inv-kpi small{display:block;font-size:12px;color:var(--erp-muted);margin-top:2px}
    .inv-kpi.green b{color:var(--erp-green)}.inv-kpi.red b{color:var(--erp-red)}.inv-kpi.blue b{color:var(--erp-blue)}
    .inv-scroll{overflow:auto}
    .inv-scroll .erp-table{min-width:760px}
    .erp-table tfoot td{font-weight:700;border-top:2px solid var(--erp-line);background:#fafbfc}
    .inv-note{font-size:12.5px;color:var(--erp-muted);margin:10px 2px 0}
    .inv-msg{padding:16px;color:var(--erp-red);font-weight:600;white-space:pre-wrap}
    @media(max-width:1100px){.inv-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:640px){.inv-scroll .erp-table{min-width:0;font-size:12.5px}body .inv-scroll .erp-table th,body .inv-scroll .erp-table td{padding:7px 5px;font-size:12.5px}body .inv-scroll .erp-table td.num{white-space:normal}.inv-t-stock .erp-badge{padding:2px 6px;font-size:11px}.inv-t-moves tr>:nth-child(4),.inv-t-moves tr>:nth-child(6),.inv-t-in tr>:nth-child(2),.inv-t-in tr>:nth-child(3),.inv-t-out tr>:nth-child(3),.inv-t-out tr>:nth-child(4){display:none}.inv-kpi b{font-size:16px!important}.inv-filters button{flex:1 1 40%}.inv-kpis{grid-template-columns:1fr 1fr}.inv-kpi b{font-size:19px}.inv-filters>div:not(.grow){flex:1 1 40%}.inv-filters input,.inv-filters select{width:100%}}
    .inv-warn{background:#fff4e5;border:1px solid #f0b45a;color:#7a4a00;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px}
    .inv-warn b{color:#a35a00}
    .inv-bad{display:block;color:#c0392b!important;font-weight:600;font-size:11.5px;margin-top:1px}
    .inv-bk{color:#a35a00;font-weight:600}
    .inv-st{font-size:11px;padding:1px 7px;margin-top:3px;display:inline-block}
    .inv-t-stock th:last-child,.inv-t-stock td:last-child{background:#eef6f4}
    .inv-t-stock td:last-child b{font-size:15px}.inv-neg{color:#c0392b}
    .inv-sub2{display:block;color:var(--erp-muted);font-size:11.5px;margin-top:1px}
    @media(max-width:640px){
      /* Phone: one card per SKU — name on top, then Opening / In / Other / Out / Closing in one row */
      .inv-t-stock thead{display:none}
      .inv-t-stock tr{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0 4px;padding:7px 4px;border-bottom:1px solid var(--erp-line)}
      body .inv-scroll .inv-t-stock td{display:block;border:0;padding:2px 2px!important;text-align:left}
      .inv-t-stock td:first-child{grid-column:1/-1;font-weight:600}
      .inv-t-stock .inv-bad{font-size:10.5px}
      .inv-t-stock td[data-l]:not(:first-child)::before{content:attr(data-l);display:block;font-size:10.5px;color:var(--erp-muted);font-weight:500}
      .inv-t-stock tfoot tr{background:#fafbfc}
      .inv-t-stock .inv-sub2{display:none}
    }
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <div id="loading" class="status">Checking account access...</div>
  <main id="page" class="erp-main" hidden>
    <div class="erp-pagehead"><h1>Inventory</h1><span class="grow"></span><span class="erp-badge blue">Read only</span></div>

    <div class="inv-filters">
      <div><label for="from">From</label><input id="from" type="date"></div>
      <div><label for="to">To</label><input id="to" type="date"></div>
      <div><label for="brand">Brand</label><select id="brand"><option value="">All brands</option></select></div>
      <div class="grow"><label for="q">Search SKU / Invoice / Party</label><input id="q" data-party-list type="search" placeholder="Type to filter the table..." autocomplete="off"></div>
      <button id="refresh" type="button">Refresh</button>
      <button id="excel" type="button" class="ghost">Excel</button>
    </div>

    <div class="inv-warn" id="warn" hidden></div>
    <div class="inv-kpis" id="kpis"></div>
    <div class="erp-pills" id="tabs"></div>

    <section class="erp-card">
      <div class="erp-card-head"><h2 id="tabTitle">Saleable Stock</h2><small id="tabCount" style="color:var(--erp-muted)"></small></div>
      <div class="inv-scroll" id="tableBox"></div>
    </section>
    <p class="inv-note" id="tabNote"></p>
  </main>
  <script>
    const client=supabase.createClient("https://txkbhadzdbxpieunfvox.supabase.co","sb_publishable_W4I3Q5ODf0g17sq5uDml2Q_sLolXYEk");
    const el=id=>document.getElementById(id);
    async function logout(){await client.auth.signOut();location.replace("login.html")}
    async function start(allowed){
      const {data:{session}}=await client.auth.getSession();
      if(!session){location.replace("login.html");return null}
      const {data:p}=await client.from("user_profiles").select("full_name,role,active").eq("id",session.user.id).single();
      const realRole=String((p&&p.role)||"").toLowerCase().trim(),role=p?await ERPShell.pageRoleFresh(realRole):realRole;
      if(!p||p.active!==true||!allowed.includes(role)){location.replace("dashboard.html");return null}
      return {user:session.user,role,realRole,name:p.full_name||session.user.email};
    }

    const fmt=n=>Number(n||0).toLocaleString("en-IN");
    const rupees=n=>"₹"+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
    const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
    const isoDay=d=>d.toLocaleDateString("en-CA",{timeZone:"Asia/Kolkata"});
    const shortDate=v=>LWBDate.d(v,"—");
    const nameKey=v=>String(v||"").toUpperCase().replace(/\s+/g," ").trim();
    const pick=(row,keys)=>{for(const k of keys)if(row&&row[k]!=null&&row[k]!=="")return row[k];return null};
    // Quantities in the unit the SKU is sold in: Rajnigandha IC, Coca-Cola CS, loose pcs after "+" (brand-filter.js).
    const packText=(pcs,s)=>LWBBrand.pack(pcs,s.pack,s.unit);
    const unitOf=s=>LWBBrand.short(s.unit);
    let allCompanies=[];

    const LOW_CASES=5;
    let skus=new Map(),skuByName=new Map(),live=[],inLines=[],outLines=[],moves=[];
    let errors={},tab="stock",ledger=null,ledgerBy=new Map();
    let all={live:[],inLines:[],outLines:[],moves:[]},brands=[],brand="";

    function skuInfo(id,name){
      const s=(id!=null&&skus.get(String(id)))||skuByName.get(nameKey(name));
      return s||{id:id!=null?String(id):"name:"+nameKey(name),name:name||"Unknown SKU",pack:1,unit:"CASE"};
    }

    async function loadAll(){
      const from=el("from").value,to=el("to").value;
      if(!from||!to||from>to){await ERPShell.alert("Select a valid From and To date.");return}
      const start=from+"T00:00:00+05:30",end=to+"T23:59:59.999+05:30";
      el("refresh").disabled=true;el("tableBox").innerHTML='<div class="erp-empty">Loading inventory...</div>';
      errors={};
      try{
        const [skuRes,liveRes]=await Promise.all([
          client.from("sku_master").select("id,sku_name,pcs_per_case,company_id,pack_unit").order("sku_name").then(r=>r.error?client.from("sku_master").select("id,sku_name,pcs_per_case,company_id").order("sku_name"):r).then(r=>r.error?client.from("sku_master").select("id,sku_name,pcs_per_case").order("sku_name"):r),
          client.from("lwb_live_stock").select("sku_id,sku_name,pcs_per_case,saleable_pcs,damaged_pcs").order("sku_name")
        ]);
        skus=new Map();skuByName=new Map();
        for(const s of (skuRes.data||[])){const x={id:String(s.id),name:s.sku_name,pack:Math.max(1,num(s.pcs_per_case)),company:s.company_id||"",unit:LWBBrand.unitOf(s,allCompanies)};skus.set(x.id,x);skuByName.set(nameKey(s.sku_name),x)}
        for(const s of (liveRes.data||[]))if(!skus.has(String(s.sku_id))){const x={id:String(s.sku_id),name:s.sku_name,pack:Math.max(1,num(s.pcs_per_case)),unit:"CASE"};skus.set(x.id,x);skuByName.set(nameKey(s.sku_name),x)}
        if(liveRes.error)errors.stock=liveRes.error.message;
        live=liveRes.data||[];
      }catch(e){errors.stock=e.message||String(e)}

      await Promise.all([loadIn(start,end),loadLedger(from,to),loadMoves(start,end)]);
      if(!ledger)await loadOut(start,end);
      all={live,inLines,outLines,moves};
      el("refresh").disabled=false;
      applyBrand();
      render();
    }

    // Brand = company tagged on the SKU in SKU Master (sku_master.company_id).
    function applyBrand(){
      const ok=s=>!brand||(s&&s.company)===brand;
      live=all.live.filter(b=>ok(skuInfo(b.sku_id,b.sku_name)));
      inLines=all.inLines.filter(x=>ok(x.sku));
      outLines=all.outLines.filter(x=>ok(x.sku));
      moves=all.moves.filter(x=>ok(x.sku));
    }
    const brandName=()=>{const c=brands.find(x=>x.id===brand);return c?c.name:""};
    async function loadBrands(){
      const sel=el("brand");
      try{
        const r=await LWBBrand.load(client);
        brands=r.companies||[];allCompanies=r.all||brands;
      }catch(e){brands=[]}
      if(!brands.length){sel.parentElement.hidden=true;brand="";return}
      brand=LWBBrand.get(brands);
      sel.innerHTML='<option value="">All brands</option>'+brands.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+"</option>").join("");
      sel.value=brand;sel.classList.toggle("on",!!brand);
      sel.addEventListener("change",()=>{brand=sel.value;LWBBrand.set(brand);sel.classList.toggle("on",!!brand);applyBrand();render()});
    }

    async function loadIn(start,end){
      inLines=[];
      try{
        const h=await client.from("lwb_goods_inward").select("*")
          .gte("received_date",start.slice(0,10)).lte("received_date",end.slice(0,10)).order("received_date",{ascending:false}).limit(1000);
        if(h.error)throw h.error;
        const heads=new Map((h.data||[]).map(x=>[x.id,x]));
        const ids=[...heads.keys()];
        for(let i=0;i<ids.length;i+=100){
          const r=await client.from("lwb_goods_inward_items").select("*").in("inward_id",ids.slice(i,i+100));
          if(r.error)throw r.error;
          for(const it of r.data||[]){
            const head=heads.get(it.inward_id)||{},s=skuInfo(pick(it,["sku_id"]),pick(it,["sku_name"]));
            inLines.push({at:Math.max(ERPRecent.time(head),ERPRecent.time(it)),date:head.received_date,ref:head.invoice_no,party:head.supplier_name,sku:s,pcs:num(pick(it,["quantity_pcs","total_pcs","qty_pcs"])),taxable:num(it.taxable_amount)});
          }
        }
        inLines.sort((a,b)=>(b.at-a.at)||String(b.date).localeCompare(String(a.date))); // latest added / edited bill first
      }catch(e){errors.in=e.message||String(e)}
    }

    // lwb_inventory_ledger_setup.sql: opening / in / out / closing per SKU and every loaded PO line,
    // worked out in the database from the same rows live stock uses. Missing (SQL not run) = old way below.
    async function loadLedger(from,to){
      ledger=null;ledgerBy=new Map();outLines=[];
      try{
        const r=await client.rpc("lwb_inventory_ledger",{p_from:from,p_to:to});
        if(r.error)throw r.error;
        ledger=r.data||{};
        for(const x of ledger.rows||[])ledgerBy.set(String(x.sku_id),x);
        outLines=(ledger.out_lines||[]).map(x=>{const s=skuInfo(x.sku_id,x.sku_name);return {date:x.at,ref:x.order_no,party:x.party,status:x.status,sku:s,cases:num(x.cases),pcs:num(x.cases)*s.pack}});
      }catch(e){ledger=null;errors.ledger=[e.message||String(e),e.details,e.hint,e.code].filter(Boolean).join(" · ");console.warn("Inventory ledger not available:",e)}
    }

    // Old way (until lwb_inventory_ledger_setup.sql runs): loaded POs from Loading & Dispatch only.
    const OUT_STATUS=["loaded","invoiced","dispatched","delivered","partially_delivered","closed","completed"];
    async function loadOut(start,end){
      outLines=[];
      try{
        const a=await client.from("dispatch_assignments").select("order_id,loading_completed_at")
          .gte("loading_completed_at",start).lte("loading_completed_at",end).limit(2000);
        if(a.error)throw a.error;
        const when=new Map();for(const x of a.data||[])if(x.order_id)when.set(x.order_id,x.loading_completed_at);
        const ids=[...when.keys()];
        for(let i=0;i<ids.length;i+=100){
          const part=ids.slice(i,i+100);
          const [o,it]=await Promise.all([
            client.from("orders").select("id,order_no,customer_name,status").in("id",part),
            client.from("order_items").select("*").in("order_id",part)
          ]);
          if(o.error)throw o.error;if(it.error)throw it.error;
          const orders=new Map((o.data||[]).filter(x=>OUT_STATUS.includes(String(x.status||"").toLowerCase().trim())).map(x=>[x.id,x]));
          for(const line of it.data||[]){
            const ord=orders.get(line.order_id);if(!ord)continue;
            const cases=num(line.loaded_qty);if(!cases)continue;
            const s=skuInfo(pick(line,["sku_id"]),line.sku_name);
            outLines.push({date:when.get(line.order_id),ref:ord.order_no,party:ord.customer_name,status:ord.status,sku:s,cases,pcs:cases*s.pack});
          }
        }
        outLines.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
      }catch(e){errors.out=e.message||String(e)}
    }

    async function loadMoves(start,end){
      moves=[];
      try{
        let r=await client.from("lwb_inventory_movements").select("*").gte("created_at",start).lte("created_at",end).order("created_at",{ascending:false}).limit(1000);
        if(r.error){
          // Fall back if the table uses another date column name.
          r=await client.from("lwb_inventory_movements").select("*").limit(1000);
          if(r.error)throw r.error;
        }
        moves=(r.data||[]).map(m=>{
          const s=skuInfo(pick(m,["sku_id"]),pick(m,["sku_name"]));
          return {date:pick(m,["created_at","movement_date","movement_at"]),sku:s,type:String(pick(m,["movement_type"])||"—"),bucket:String(pick(m,["stock_bucket"])||"—"),
            pcs:num(pick(m,["quantity_pcs","qty_pcs","pcs_qty","pcs","quantity","qty"])),ref:pick(m,["reference_no","reference","ref_no","reference_type","note","remarks"])||""};
        });
      }catch(e){errors.moves=e.message||String(e)}
    }

    function sums(){
      const inBy=new Map(),outBy=new Map();
      for(const x of inLines)inBy.set(x.sku.id,(inBy.get(x.sku.id)||0)+x.pcs);
      for(const x of outLines)outBy.set(x.sku.id,(outBy.get(x.sku.id)||0)+x.pcs);
      return {inBy,outBy};
    }

    // Each tab returns {head, rows (export values), cells (display), num (right-aligned columns), foot}
    function view(){
      const {inBy,outBy}=sums();
      // pk: columns that hold PCS, footer adds them per unit (IC and CS never mixed).
      if(tab==="stock"){
        const T=v=>v?esc(packText(v,cur)):"—";let cur=null;
        const rows=live.map(b=>{
          const s0=skuInfo(b.sku_id,b.sku_name),s={...s0,pack:Math.max(1,num(b.pcs_per_case)||s0.pack)},sale=Math.max(0,num(b.saleable_pcs)),full=Math.floor(sale/s.pack);
          const state=num(b.saleable_pcs)<=0?["Out of stock","red"]:full<LOW_CASES?["Low","amber"]:["In stock","green"];
          const L=ledgerBy.get(String(b.sku_id))||null;cur=s;
          const sku='<span class="inv-sku">'+esc(b.sku_name)+"<small>"+fmt(s.pack)+" pcs / "+unitOf(s)+"</small></span>",badge=' <span class="erp-badge inv-st '+state[1]+'">'+state[0]+"</span>";
          if(!ledger){
            const inP=inBy.get(s.id)||0,outP=outBy.get(s.id)||0;
            return {key:b.sku_name,pk:{1:[0,s],2:[inP,s],3:[0,s],4:[outP,s],7:[sale,s]},
              data:[b.sku_name,fmt(s.pack)+" pcs / "+unitOf(s),unitOf(s),"",LWBBrand.packNum(inP,s.pack),"",LWBBrand.packNum(outP,s.pack),LWBBrand.packNum(sale,s.pack),"","","","",state[0]],
              show:[sku+badge,"—",T(inP),"—",T(outP),"—","—","<b>"+esc(packText(sale,s))+"</b>"],html:[0,1,2,3,4,5,6,7]};
          }
          const open=num(L&&L.opening_pcs)+num(L&&L.opening_entry),inP=num(L&&L.in_pcs),oth=num(L&&L.return_pcs)+num(L&&L.other_pcs),outP=num(L&&L.out_pcs);
          const book=L?num(L.book_pcs):sale,sys=L?num(L.system_pcs):sale,diff=Math.round(sys-book);
          const openCell=T(open)+(L&&num(L.opening_entry)?"<small class=\"inv-sub2\">Opening entry "+esc(packText(num(L.opening_entry),s))+"</small>":"");
          const closeCell="<b>"+esc(packText(book,s))+"</b>"+(diff?'<small class="inv-bad">System '+esc(packText(sys,s))+" ("+(diff>0?"+":"")+esc(packText(diff,s))+")</small>":"");
          const bkd=num(L&&L.booked_pcs),free=book-bkd;
          return {key:b.sku_name,diff,pk:{1:[open,s],2:[inP,s],3:[oth,s],4:[outP,s],5:[bkd,s],6:[free,s],7:[book,s]},
            data:[b.sku_name,fmt(s.pack)+" pcs / "+unitOf(s),unitOf(s),LWBBrand.packNum(open,s.pack),LWBBrand.packNum(inP,s.pack),LWBBrand.packNum(oth,s.pack),LWBBrand.packNum(outP,s.pack),LWBBrand.packNum(book,s.pack),LWBBrand.packNum(sys,s.pack),diff?LWBBrand.packNum(diff,s.pack):0,LWBBrand.packNum(bkd,s.pack),LWBBrand.packNum(free,s.pack),state[0]],
            show:[sku+badge,openCell,T(inP),oth?esc(LWBBrand.pack(oth,s.pack,s.unit,{plus:true})):"—",T(outP),bkd?'<span class="inv-bk">'+esc(packText(bkd,s))+"</span>":"—",'<b'+(free<0?' class="inv-neg"':"")+">"+esc(packText(free,s))+"</b>",closeCell],html:[0,1,2,3,4,5,6,7]};
        });
        const head=["SKU","Opening","+ Stock In","± Return / Other","− Stock Out","Booked","Free","= Closing Stock"];
        return {title:"Saleable Stock",head,
          xhead:["SKU","Pack","Unit","Opening (IC / CS)","Stock In (IC / CS)","Return / Other (IC / CS)","Stock Out (IC / CS)","Closing (IC / CS)","System stock (IC / CS)","Difference (IC / CS)","Booked (IC / CS)","Free (IC / CS)","Status"],num:[1,2,3,4,5,6,7],rows,
          err:errors.stock,note:ledger
            ?"Opening = stock on the morning of From (plus Opening Stock entries made in the dates). Closing = Opening + Stock In ± Return / Other − Stock Out, at the end of To. Stock Out = every PO loaded on a vehicle (or marked Loaded by Admin). Return / Other = approved Driver Return to saleable, Stock Transfer / Damage / Loss. Booked = POs given (pending approval, approved, loading) but not loaded yet; drafts do not count. Free = Closing − Booked, what can still be sold. Red System line = what the system shows when it does not match. In IC (Rajnigandha) or CS (Coca-Cola)."
            :"Closing = saleable stock now. Opening is shown after lwb_inventory_ledger_setup.sql runs. Stock In and Stock Out are for the selected dates."};
      }
      if(tab==="in"){
        const rows=inLines.map(x=>({key:x.ref+" "+x.party+" "+x.sku.name,pk:{4:[x.pcs,x.sku]},data:[shortDate(x.date),x.ref,x.party,x.sku.name,unitOf(x.sku),Math.floor(x.pcs/x.sku.pack),x.pcs%x.sku.pack,x.taxable],
          show:[shortDate(x.date),x.ref||"—",x.party||"—",x.sku.name,packText(x.pcs,x.sku),rupees(x.taxable)]}));
        return {title:"Stock In — Purchase",head:["Received","Invoice No.","Supplier","SKU","Quantity","Taxable ₹"],xhead:["Received","Invoice No.","Supplier","SKU","Unit","IC / CS","Loose PCS","Taxable ₹"],num:[4,5],rows,sum:[5],xsum:{5:7},money:[5],err:errors.in,
          note:"Every SKU line received through Goods Inward in the selected dates, in IC (Rajnigandha) or CS (Coca-Cola). Invoice-wise list: Goods Inward page, Purchase Report."};
      }
      if(tab==="out"){
        const rows=outLines.map(x=>({key:x.ref+" "+x.party+" "+x.sku.name,pk:{5:[x.pcs,x.sku]},data:[shortDate(x.date),x.ref,x.party,x.status,x.sku.name,unitOf(x.sku),x.cases],
          show:[shortDate(x.date),x.ref||"—",x.party||"—",x.status||"—",x.sku.name,fmt(x.cases)+" "+unitOf(x.sku)]}));
        return {title:"Stock Out — Dispatch",head:["Loaded On","PO No.","Party","Status","SKU","Loaded"],xhead:["Loaded On","PO No.","Party","Status","SKU","Unit","Loaded"],num:[5],rows,err:errors.out,
          note:"IC / CS actually loaded on vehicles in the selected dates: Loading & Dispatch, self pickup and POs marked Loaded by Admin. Every status after loading counts (loaded, billed, dispatched, delivered); cancelled POs do not. This report does not change stock."};
      }
      const rows=moves.map(m=>({key:m.sku.name+" "+m.type+" "+m.bucket+" "+m.ref,data:[shortDate(m.date),m.sku.name,m.type,m.bucket,unitOf(m.sku),m.pcs<0?-Math.floor(-m.pcs/m.sku.pack):Math.floor(m.pcs/m.sku.pack),(m.pcs<0?-1:1)*(Math.abs(m.pcs)%m.sku.pack),m.ref],
        show:[shortDate(m.date),m.sku.name,m.type,m.bucket,packText(m.pcs,m.sku),m.ref||"—"]}));
      return {title:"Stock Movements",head:["Date","SKU","Type","Bucket","Quantity","Reference"],xhead:["Date","SKU","Type","Bucket","Unit","IC / CS","Loose PCS","Reference"],num:[4],rows,err:errors.moves,
        note:"Audit trail of every stock entry (opening, inward and others) saved in the system, newest first. Quantity in IC (Rajnigandha) or CS (Coca-Cola)."};
    }

    const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    let current=null;
    function render(){
      renderKpis();renderTabs();renderWarn();
      const v=view(),q=nameKey(el("q").value);
      const rows=q?v.rows.filter(r=>nameKey(r.key).includes(q)):v.rows;
      current={...v,rows};
      el("tabTitle").textContent=v.title+(brand?" · "+brandName():"");
      el("tabCount").textContent=v.err?"":rows.length+" rows";
      el("tabNote").textContent=v.note;
      const box=el("tableBox");
      if(v.err){box.innerHTML='<div class="inv-msg">Could not load this report: '+esc(v.err)+"</div>";return}
      if(!rows.length){box.innerHTML='<div class="erp-empty">'+(q?"No rows match your search.":brand?"No entries for "+brandName()+" in the selected dates.":"No entries for the selected dates.")+"</div>";return}
      const numCls=i=>v.num.includes(i)?' class="num"':"";
      let h="<table class=\"erp-table inv-t-"+tab+"\"><thead><tr>"+v.head.map((x,i)=>"<th"+numCls(i)+">"+esc(x)+"</th>").join("")+"</tr></thead><tbody>";
      const isHtml=(r,i)=>Array.isArray(r.html)?r.html.includes(i):r.html===i;
      const lab=i=>' data-l="'+esc(String(v.head[i]).replace(/^[+−±=] /,"").replace("Return / Other","Other"))+'"';
      for(const r of rows)h+="<tr>"+r.show.map((c,i)=>"<td"+numCls(i)+lab(i)+">"+(isHtml(r,i)?c:esc(c))+"</td>").join("")+"</tr>";
      h+="</tbody>";
      const pkCols=rows.length&&rows[0].pk?Object.keys(rows[0].pk).map(Number):[];
      if(v.sum||pkCols.length){
        h+="<tfoot><tr>"+v.head.map((x,i)=>{
          if(i===0)return "<td>Total</td>";
          if(pkCols.includes(i))return '<td class="num"'+lab(i)+'>'+esc(LWBBrand.packSum(rows.map(r=>({pcs:r.pk[i][0],per:r.pk[i][1].pack,unit:r.pk[i][1].unit}))))+"</td>";
          if(!(v.sum||[]).includes(i))return "<td></td>";
          const t=rows.reduce((a,r)=>a+num(r.data[(v.xsum&&v.xsum[i])??i]),0);
          return '<td class="num">'+((v.money||[]).includes(i)?rupees(t):fmt(t))+"</td>";
        }).join("")+"</tr></tfoot>";
      }
      box.innerHTML=h+"</table>";
    }

    // SKUs whose system stock is not Opening + In ± Other − Out (e.g. a loaded PO not taken out of godown stock).
    function renderWarn(){
      const w=el("warn");
      if(!ledger){
        if(!errors.ledger){w.hidden=true;return}
        w.innerHTML="<b>⚠ Opening / Closing could not load, old view shown.</b> Send this line to support: "+esc(errors.ledger);w.hidden=false;return;
      }
      const bad=live.map(b=>{const L=ledgerBy.get(String(b.sku_id));return L?{b,d:Math.round(num(L.system_pcs)-num(L.book_pcs))}:null}).filter(x=>x&&x.d);
      if(!bad.length){w.hidden=true;return}
      const f=ledger.link||{},list=bad.slice(0,4).map(x=>{const s=skuInfo(x.b.sku_id,x.b.sku_name),p={...s,pack:Math.max(1,num(x.b.pcs_per_case)||s.pack)};return esc(x.b.sku_name)+" "+(x.d>0?"+":"")+esc(packText(x.d,p))}).join(", ");
      w.innerHTML="<b>⚠ Stock does not match for "+fmt(bad.length)+" SKU"+(bad.length>1?"s":"")+":</b> "+list+(bad.length>4?" …":"")+
        ". System stock should be Opening + Stock In ± Return / Other − Stock Out."+(f.follows_loading===false?" Loaded POs are not taken out of godown stock by the system (plus = more in the system than in the godown).":"");
      w.hidden=false;
    }

    function renderKpis(){
      let low=0;const saleL=[],dmgL=[],bookL=[];
      for(const b of live){const s=skuInfo(b.sku_id,b.sku_name),pack=Math.max(1,num(b.pcs_per_case)||s.pack),sale=Math.max(0,num(b.saleable_pcs));
        const L=ledger&&ledgerBy.get(String(b.sku_id)),bk=L?Math.max(0,num(L.book_pcs)):sale;
        if(L&&num(L.booked_pcs))bookL.push({pcs:num(L.booked_pcs),per:pack,unit:s.unit});
        saleL.push({pcs:bk-bk%pack,per:pack,unit:s.unit});if(num(b.damaged_pcs))dmgL.push({pcs:num(b.damaged_pcs),per:pack,unit:s.unit});if(sale/pack<LOW_CASES)low++}
      const inTxt=LWBBrand.packSum(inLines.map(x=>({pcs:x.pcs,per:x.sku.pack,unit:x.sku.unit}))),outTxt=LWBBrand.packSum(outLines.map(x=>({pcs:x.cases,per:1,unit:x.sku.unit})));
      const invoices=new Set(inLines.map(x=>x.ref+"|"+x.party)).size,pos=new Set(outLines.map(x=>x.ref)).size;
      const k=[
        ["stock","","SKUs in Stock",fmt(live.filter(b=>num(b.saleable_pcs)>0).length),fmt(live.length)+" SKUs total"],
        ["stock","green","Saleable Stock",LWBBrand.packSum(saleL),ledger?(bookL.length?"Booked "+LWBBrand.packSum(bookL)+" (POs not loaded)":"Closing, full IC / CS"):"Full IC / CS in Main Godown"],
        ["stock","red","Low / Out of Stock",fmt(low),"Under "+LOW_CASES+" IC / CS"],
        ["in","blue","Stock In (period)",inTxt,fmt(invoices)+" purchase invoices"],
        ["out","","Stock Out (period)",outTxt,fmt(pos)+" POs loaded"]
      ];
      if(dmgL.length)k[2][4]+=" · "+LWBBrand.packSum(dmgL)+" damaged";
      el("kpis").innerHTML=k.map(x=>'<button type="button" class="inv-kpi '+x[1]+'" data-tab="'+x[0]+'"><span>'+esc(x[2])+"</span><b>"+String(x[3]).split(" · ").map(t=>'<span class="nw">'+esc(t)+"</span>").join(" · ")+"</b><small>"+esc(x[4])+"</small></button>").join("");
    }

    const TABS=[["stock","Saleable Stock",()=>live.length],["in","Stock In (Purchase)",()=>inLines.length],["out","Stock Out (Dispatch)",()=>outLines.length],["moves","Stock Movements",()=>moves.length]];
    function renderTabs(){
      el("tabs").innerHTML=TABS.map(([id,label,n])=>'<button type="button" class="erp-pill'+(id===tab?" active":"")+'" data-tab="'+id+'">'+esc(label)+'<span class="n">'+fmt(n())+"</span></button>").join("");
    }
    function setTab(id){tab=id;try{localStorage.setItem("lwb_inventory_tab",id)}catch(e){}render()}

    function loadScript(src){return new Promise((ok,fail)=>{const t=document.createElement("script");t.src=src;t.onload=ok;t.onerror=()=>fail(Error("Could not load Excel tool. Check internet."));document.head.appendChild(t)})}
    async function exportExcel(){
      try{
        if(!current||current.err||!current.rows.length){await ERPShell.alert("Nothing to export for this report.");return}
        if(!window.XLSX)await loadScript("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js");
        const range=shortDate(el("from").value)+" to "+shortDate(el("to").value);
        const sheet=XLSX.utils.aoa_to_sheet(LWBDate.rows([["LUXURY WRIST BRAND — "+current.title+(brand?" — "+brandName():"")],[range],[],current.xhead||current.head,...current.rows.map(r=>r.data)]));
        sheet["!cols"]=(current.xhead||current.head).map(h=>({wch:/SKU|Supplier|Party|Reference/.test(h)?30:15}));
        const book=XLSX.utils.book_new();XLSX.utils.book_append_sheet(book,sheet,"Inventory");
        XLSX.writeFile(book,"Inventory-"+tab+(brand?"-"+brandName().replace(/[^A-Za-z0-9]+/g,"_"):"")+"-"+el("to").value+".xlsx");
      }catch(e){await ERPShell.alert("Excel export failed: "+e.message)}
    }

    (async()=>{
      const me=await start(["admin","manager","warehouse","accounts"]);if(!me)return;
      ERPShell.mount({role:me.realRole||me.role,name:me.name,onLogout:logout,group:"Inventory",title:"Inventory"});
      const now=new Date(),past=new Date(now.getTime()-29*864e5);
      el("to").value=isoDay(now);el("from").value=isoDay(past);
      try{const t=localStorage.getItem("lwb_inventory_tab");if(TABS.some(x=>x[0]===t))tab=t}catch(e){}
      const p=new URLSearchParams(location.search).get("tab");if(TABS.some(x=>x[0]===p))tab=p;
      document.addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b)setTab(b.dataset.tab)});
      el("q").addEventListener("input",render);
      el("refresh").onclick=loadAll;
      el("excel").onclick=exportExcel;
      el("from").addEventListener("change",loadAll);el("to").addEventListener("change",loadAll);
      el("loading").hidden=true;el("page").hidden=false;
      await loadBrands();
      await loadAll();
    })();
  </script>
</body>
</html>
