<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP Login | Luxury Wrist Brand</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #080808, #252525);
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 18px;
      padding: 42px 36px;
      box-shadow: 0 25px 70px rgba(0,0,0,.35);
    }

    .brand {
      text-align: center;
      margin-bottom: 34px;
    }

    .brand h1 {
      font-size: 25px;
      letter-spacing: 2px;
      color: #111;
    }

    .brand p {
      margin-top: 8px;
      color: #9a741e;
      font-size: 12px;
      letter-spacing: 2px;
      font-weight: bold;
    }

    h2 {
      font-size: 21px;
      margin-bottom: 7px;
      color: #111;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      margin-bottom: 26px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #c99b35;
    }

    button {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #c99b35;
      color: #111;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 17px;
      text-align: center;
      font-size: 14px;
      min-height: 18px;
    }

    .form-note{font-size:12px;color:#777;line-height:1.6;margin:-4px 0 18px}
    .login-box .secondary{background:#eef0f3;color:#222;margin:9px 0 0}
    .login-box .secondary:hover{background:#ead39e}
    #message{white-space:pre-wrap;line-height:1.5}
    .security-note{font-size:12px;line-height:1.6;color:#767676;margin-top:18px;text-align:center}
    @media(max-width:420px){.login-box{padding:30px 22px}}

    .footer {
      text-align: center;
      margin-top: 30px;
      font-size: 12px;
      color: #999;
    }
  </style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c8102e">
<link rel="apple-touch-icon" href="app-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>

<body>

<div class="login-box">

  <div class="brand">
    <h1>LUXURY WRIST BRAND</h1>
    <p>BUSINESS ERP</p>
  </div>

  <h2>Welcome Back</h2>
  <p class="subtitle">Sign in to access your business dashboard.</p>


  <form id="loginForm">
    <label for="login">Mobile Number or Email</label>
    <input type="text" id="login" placeholder="10-digit mobile or email"
      autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter your password"
      autocomplete="current-password" required>
    <button type="submit" id="loginButton">Sign In</button>
  </form>
  <div id="message" role="status" aria-live="polite"></div>
  <p class="security-note">Only active users created by LWB Admin may enter the ERP.
  Forgot your password? Ask Admin to set a new one.</p>

  <div class="footer">
    © Luxury Wrist Brand • Authorized Access Only
  </div>

</div>

<script>

"use strict";
const SUPABASE_URL="https://txkbhadzdbxpieunfvox.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_W4I3Q5ODf0g17sq5uDml2Q_sLolXYEk";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const el=id=>document.getElementById(id);
let busy=false;

function showMessage(text,error=false){
  el("message").textContent=text;
  el("message").style.color=error?"#c62828":"#198754";
}
function setBusy(working){
  busy=working;
  el("loginButton").disabled=working;
  el("loginButton").textContent=working?"Signing In...":"Sign In";
}
function validIndianMobile(raw){
  let d=String(raw||"").replace(/\D/g,"");
  if(d.length===12&&d.startsWith("91"))d=d.slice(2);
  if(d.length===11&&d.startsWith("0"))d=d.slice(1);
  return /^[6-9]\d{9}$/.test(d)?d:null;
}
async function finishAuthorizedLogin(user){
  if(!user?.id)throw Error("Login session could not be verified.");
  const {data:profile,error}=await client.from("user_profiles")
    .select("role,active").eq("id",user.id).maybeSingle();
  if(error||!profile||profile.active!==true||
     !["admin","manager","sales","warehouse","transport","accounts","driver"]
        .includes(String(profile.role||"").trim().toLowerCase())){
    await client.auth.signOut();
    throw Error("This Login is not yet approved by LWB Admin. Ask Admin to assign an active ERP Role.");
  }
  showMessage("Login successful. Opening your ERP Dashboard...");
  window.location.assign("dashboard.html");
}
async function checkExistingLogin(){
  const {data,error}=await client.auth.getSession();
  if(error||!data?.session)return;
  // Verify current auth session, not merely cached session metadata.
  const result=await client.auth.getUser();
  if(result.error||!result.data?.user){
    await client.auth.signOut();
    return;
  }
  try{await finishAuthorizedLogin(result.data.user);}
  catch(e){showMessage(e.message,true);}
}
// Email signs in directly. A mobile number is turned into its login email by
// the database, which answers only when the password is correct.
el("loginForm").addEventListener("submit",async event=>{
  event.preventDefault();
  if(busy)return;
  const login=el("login").value.trim();
  const password=el("password").value;
  if(!login||!password){showMessage("Enter Mobile Number or Email, and Password.",true);return;}
  const isEmail=login.includes("@");
  const mobile=isEmail?null:validIndianMobile(login);
  if(!isEmail&&!mobile){showMessage("Enter a valid 10-digit mobile number or an email.",true);return;}
  setBusy(true);showMessage("");
  try{
    let email=login;
    if(mobile){
      const {data,error}=await client.rpc("lwb_login_email",{p_login:mobile,p_password:password});
      if(error)throw Error(/Too many/.test(error.message)?error.message:"Mobile login is not set up yet. Use your email, or ask Admin.");
      if(!data)throw Error("Invalid Mobile Number or Password.");
      email=data;
    }
    const {data,error}=await client.auth.signInWithPassword({email,password});
    if(error)throw Error(isEmail?"Invalid Email or Password.":"Invalid Mobile Number or Password.");
    await finishAuthorizedLogin(data.user);
  }catch(e){showMessage(e.message,true);}
  finally{setBusy(false);}
});
checkExistingLogin();

</script>

</body>
</html>
