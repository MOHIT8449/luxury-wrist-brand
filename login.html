<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP Login | Luxury Wrist Brand</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #080808, #252525);
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 18px;
      padding: 42px 36px;
      box-shadow: 0 25px 70px rgba(0,0,0,.35);
    }

    .brand {
      text-align: center;
      margin-bottom: 34px;
    }

    .brand h1 {
      font-size: 25px;
      letter-spacing: 2px;
      color: #111;
    }

    .brand p {
      margin-top: 8px;
      color: #9a741e;
      font-size: 12px;
      letter-spacing: 2px;
      font-weight: bold;
    }

    h2 {
      font-size: 21px;
      margin-bottom: 7px;
      color: #111;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      margin-bottom: 26px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #c99b35;
    }

    button {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #c99b35;
      color: #111;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 17px;
      text-align: center;
      font-size: 14px;
      min-height: 18px;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>

<div class="login-box">

  <div class="brand">
    <h1>LUXURY WRIST BRAND</h1>
    <p>BUSINESS ERP</p>
  </div>

  <h2>Welcome Back</h2>
  <p class="subtitle">Sign in to access your business dashboard.</p>

  <form id="loginForm">

    <label>Email Address</label>
    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      autocomplete="email"
      required
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      required
    >

    <button type="submit" id="loginButton">
      Sign In
    </button>

  </form>

  <div id="message"></div>

  <div class="footer">
    © Luxury Wrist Brand • Authorized Access Only
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://txkbhadzdbxpieunfvox.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_W4I3Q5ODf0g17sq5uDml2Q_sLolXYEk";

const client = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginButton");

async function checkExistingLogin() {

  const { data } = await client.auth.getSession();

  if (data.session) {
    window.location.href = "dashboard.html";
  }

}

checkExistingLogin();

form.addEventListener("submit", async (event) => {

  event.preventDefault();

  message.textContent = "";
  button.disabled = true;
  button.textContent = "Signing In...";

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const { data, error } =
    await client.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {

    message.style.color = "#c62828";
    message.textContent =
      "Invalid email address or password.";

    button.disabled = false;
    button.textContent = "Sign In";

    return;
  }

  const { data: profile, error: profileError } =
  await client
    .from("user_profiles")
    .select("full_name, role, active")
    .eq("id", data.user.id)
    .maybeSingle();

console.log("Logged user ID:", data.user.id);
console.log("Profile:", profile);
console.log("Profile error:", profileError);

  if (profileError || !profile || profile.active !== true) {

    await client.auth.signOut();

    message.style.color = "#c62828";
    message.textContent =
      "Your account is not authorized.";

    button.disabled = false;
    button.textContent = "Sign In";

    return;
  }

  message.style.color = "#198754";
  message.textContent =
    "Login successful. Opening dashboard...";

  window.location.href = "dashboard.html";

});

</script>

</body>
</html>
