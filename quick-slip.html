<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rajnigandha Slips | Luxury Wrist Brand ERP</title>
  <script src="erp-date.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="erp-shell.css">
  <link rel="stylesheet" href="sales.css">
  <script src="erp-shell.js"></script>
  <script src="sales-common.js"></script>
  <style id="pageSize">@page{size:3in 4in;margin:0}</style>
  <style>
    /* Rajnigandha quick slip (kachcha parchi): printed on a 3 inch (80 mm) or 2 inch (58 mm) thermal roll. */
    .qs-wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}
    .qs-card{background:#fff;border:1px solid var(--erp-line,#dfe4ea);border-radius:8px;padding:10px 12px;min-width:0}
    .qs-card h2{font-size:14px;margin:0 0 8px;display:flex;gap:8px;align-items:center}
    .qs-card h2 small{font-weight:500;color:#667;font-size:12px}
    .qs-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
    .qs-tools input[type=date]{height:32px;border:1px solid var(--erp-line,#d6dde6);border-radius:6px;padding:0 6px;font:inherit;font-size:13px}
    .qs-list{width:100%;border-collapse:collapse;font-size:13px}
    .qs-list th{font-size:11.5px;text-align:left;color:#556;font-weight:600;padding:5px 6px;border-bottom:1px solid #e3e7ec;white-space:nowrap}
    .qs-list td{padding:6px;border-bottom:1px solid #eef1f4;vertical-align:middle}
    .qs-list td.n,.qs-list th.n{text-align:right;white-space:nowrap}
    .qs-list tr.on,.qs-list tr.on td{background:#fff6e5}
    a.sl-btn,a.sl-btn:visited{display:inline-flex;align-items:center;text-decoration:none!important;color:#fff!important}
    .qs-list .party{font-weight:600;overflow-wrap:anywhere}
    .qs-list .sub{display:block;color:#667;font-size:11.5px}
    .qs-act{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap}
    .qs-empty{color:#667;font-size:13px;padding:8px 2px}
    .qs-side{position:sticky;top:76px;display:flex;flex-direction:column;gap:8px;align-items:center}
    .qs-size{display:inline-flex;border:1px solid var(--erp-line,#d6dde6);border-radius:6px;overflow:hidden}
    .qs-size button{height:30px;padding:0 10px;border:0;background:#fff;color:#22303f;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
    .qs-size button[aria-pressed=true]{background:#9a5b00;color:#fff}
    .qs-side .qs-act{justify-content:center;flex-wrap:wrap}
    /* The slip itself: black on white, sized in inches so the screen preview matches the paper. */
    #slip{background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;line-height:1.25;box-shadow:0 1px 6px rgba(0,0,0,.18);box-sizing:border-box}
    #slip.w3{width:3in;padding:.08in .1in;font-size:11px}
    #slip.w2{width:2in;padding:.06in .07in;font-size:10px}
    #slip .c{text-align:center}
    #slip .hd{font-weight:800;font-size:13px;letter-spacing:.5px}
    #slip.w2 .hd{font-size:11.5px}
    #slip .dash{border-top:1px dashed #000;margin:4px 0}
    #slip .row{display:flex;justify-content:space-between;gap:6px}
    #slip .k{font-size:.85em}
    #slip b{font-weight:700}
    #slip .party{font-weight:800;font-size:1.12em}
    #slip .addr{overflow-wrap:anywhere}
    #slip table{width:100%;border-collapse:collapse}
    #slip th{background:none!important;color:#000!important;font-size:.88em;text-align:left;border-bottom:1px solid #000;padding:1px 0}
    #slip td{padding:2px 0;vertical-align:top}
    #slip td.r,#slip th.r{text-align:right;padding-left:4px;white-space:nowrap}
    #slip .item{margin-top:3px}
    #slip .tot{display:flex;justify-content:space-between;font-weight:800;font-size:1.3em;border-top:2px solid #000;border-bottom:2px solid #000;padding:3px 0;margin-top:4px}
    #slip .sign{display:flex;justify-content:flex-end;margin-top:.28in;font-size:.82em}
    #slip .sign span{border-top:1px solid #000;padding-top:2px;width:55%;text-align:center}
    #slip .foot{margin-top:4px;font-size:.78em;text-align:center}
    .qs-dlg{border:0;border-radius:10px;padding:14px;width:min(380px,calc(100vw - 32px));box-sizing:border-box}
    .qs-dlg h3{margin:0 0 4px;font-size:16px}.qs-dlg p{margin:0 0 10px;color:#556;font-size:12.5px}
    .qs-dlg label{display:block;font-size:12.5px;font-weight:600;margin-bottom:8px}
    .qs-dlg input{display:block;width:100%;box-sizing:border-box;height:38px;margin-top:3px;border:1px solid #cfd6de;border-radius:6px;padding:0 8px;font:inherit;font-size:15px}
    .qs-dlg .err{color:#b3263f;font-weight:600;min-height:16px;margin:0 0 6px}
    .qs-dlg .qs-act{justify-content:flex-end}
    @media(max-width:900px){.qs-wrap{grid-template-columns:minmax(0,1fr)}.qs-side{position:static;order:-1}}
    @media(max-width:640px){
      .qs-list thead{display:none}.qs-list tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 8px;padding:8px 4px;border-bottom:1px solid #eef1f4;align-items:center}
      .qs-list td{border:0;padding:0!important;height:auto!important;background:none!important}.qs-list td.hide-m{display:none}
      .qs-list td.po{grid-row:1;grid-column:1}.qs-list td.n{grid-row:1;grid-column:2;font-weight:700}
      .qs-list td.party,.qs-list td.drv{grid-column:1/-1}
      .qs-list td.qs-act-td{grid-column:1/-1}.qs-list .qs-act{justify-content:flex-start}
      .qs-tools .grow{display:none}.qs-tools h2{width:100%}.qs-tools input[type=date]{flex:1;min-width:0}
      .erp-pagehead h1{font-size:19px}
    }
    @media print{
      .erp-top,.erp-side,.erp-bnav,.erp-pagehead,#listCard,.qs-side>*:not(#slip),#status{display:none!important}
      body,.erp-main{margin:0!important;padding:0!important;background:#fff!important}
      .qs-wrap{display:block}.qs-side{position:static;display:block}
      #slip{box-shadow:none}
    }
  </style>
</head>
<body>
  <div id="loading" class="status">Checking account access...</div>
  <main id="page" class="erp-main" hidden>
    <div class="erp-pagehead"><h1>Rajnigandha Slips<button type="button" class="erp-i" aria-label="Info" title="Info" data-tip="Rajnigandha PO: the Sales Head types the driver name and vehicle number when saving the PO. A small slip prints on the thermal printer and the PO goes straight to Accounts for the Tally bill (no approval, transport or loading). Reprint any slip from here.">i</button></h1><span class="grow"></span><a class="sl-btn small" href="order-entry.html" id="newPo">+ New Rajnigandha PO</a></div>
    <div id="status" class="sl-msg" hidden></div>
    <div class="qs-wrap">
      <div id="listCard">
        <div class="qs-card" id="waitCard" hidden>
          <h2>Waiting for driver &amp; vehicle <small id="waitN"></small></h2>
          <table class="qs-list"><thead><tr><th>PO</th><th>Party</th><th class="n">Amount</th><th></th></tr></thead><tbody id="waitBody"></tbody></table>
        </div>
        <div class="qs-card" style="margin-top:10px">
          <div class="qs-tools"><h2 style="margin:0">Slips</h2><span class="grow" style="flex:1"></span>
            <input type="date" id="from" aria-label="From"><input type="date" id="to" aria-label="To">
            <button type="button" class="sl-btn ghost small" id="reload">Show</button></div>
          <table class="qs-list"><thead><tr><th>PO / Date</th><th>Party</th><th>Driver · Vehicle</th><th class="n">Qty</th><th class="n">Amount</th><th></th></tr></thead><tbody id="slipBody"></tbody></table>
          <div id="slipEmpty" class="qs-empty" hidden>No slip in these dates.</div>
        </div>
      </div>
      <div class="qs-side" id="side" hidden>
        <div class="qs-size" role="group" aria-label="Paper width">
          <button type="button" data-w="3" aria-pressed="true">3 inch</button><button type="button" data-w="2" aria-pressed="false">2 inch</button>
        </div>
        <div id="slip" class="w3"></div>
        <div class="qs-act">
          <button type="button" class="sl-btn" id="printBtn">🖨 Print slip</button>
          <button type="button" class="sl-btn ghost" id="editBtn" hidden>Edit driver / vehicle</button>
        </div>
      </div>
    </div>
  </main>

  <dialog id="dlg" class="qs-dlg" aria-labelledby="dlgT">
    <form id="dlgForm" novalidate>
      <h3 id="dlgT">Driver &amp; vehicle</h3>
      <p id="dlgSub"></p>
      <label>Driver Name *<input id="dName" maxlength="80" autocomplete="off" placeholder="e.g. Ramesh Patel"></label>
      <label>Vehicle Number *<input id="dVeh" maxlength="20" autocomplete="off" placeholder="e.g. GJ01AB1234" oninput="this.value=this.value.toUpperCase()"></label>
      <p class="err" id="dErr"></p>
      <div class="qs-act"><button type="button" class="sl-btn ghost" onclick="document.getElementById('dlg').close()">Back</button><button type="submit" class="sl-btn" id="dSave">Save &amp; Print</button></div>
    </form>
  </dialog>

  <script>
    const S=LWBSales,{client,el,esc,fmt}=S;
    const setupMsg="Run lwb_quick_slip_setup.sql first (it runs by itself when the PR is merged).";
    const errText=e=>/lwb_quick_slip/.test(e.message||"")&&/function|schema cache/.test(e.message||"")?setupMsg:(e.message||String(e));
    const qs=new URLSearchParams(location.search);
    const inFrame=window.parent!==window;
    const tell=t=>{try{if(inFrame)window.parent.postMessage({lwbPoPrint:t},location.origin)}catch(e){}};
    const money=n=>Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:0,maximumFractionDigits:2});
    const unitWord=(u,n)=>u==="BOX"?(Number(n)===1?"box":"boxes"):(Number(n)===1?"case":"cases");
    let me=null,head=false,cur=null,width="3";
    try{width=localStorage.getItem("lwbSlipWidth")==="2"?"2":"3"}catch(e){}

    function slipHtml(s){
      const when=LWBDate.dt(s.slip_at||s.order_date);
      const u=s.unit||"CASE";
      const lines=s.lines||[];
      // Mohit (2 Nov 2026): no heading, no driver / vehicle lines, one Receiver sign.
      const head='<div class="row"><span>PO <b>'+esc(s.order_no)+'</b></span><span>'+esc(when)+'</span></div>'+
        '<div class="party">'+esc(s.party)+'</div>'+
        (s.party_mobile?'<div>Mobile: <b>'+esc(s.party_mobile)+'</b></div>':"")+
        (s.party_address?'<div class="addr">'+esc(s.party_address)+'</div>':"")+
        '<div class="dash"></div>';
      const body=width==="3"
        ? '<table><thead><tr><th>SKU</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead><tbody>'+
          lines.map(l=>'<tr><td>'+esc(l.sku)+'</td><td class="r">'+fmt(l.qty)+'</td><td class="r">'+money(l.rate)+'</td><td class="r">'+money(l.amount)+'</td></tr>').join("")+'</tbody></table>'
        : lines.map(l=>'<div class="item"><b>'+esc(l.sku)+'</b><div class="row"><span>'+fmt(l.qty)+' × '+money(l.rate)+'</span><b>'+money(l.amount)+'</b></div></div>').join("");
      return head+body+
        '<div class="tot"><span>TOTAL · '+fmt(s.total_qty)+' '+unitWord(u,s.total_qty)+'</span><span>₹'+money(s.total_amount)+'</span></div>'+
        '<div class="sign"><span>Receiver sign</span></div>'+
        (Number(s.print_count)>0?'<div class="foot">Reprint '+fmt(s.print_count)+'</div>':"");
    }
    // Page height follows the slip, so a long SKU list still prints as one strip.
    function fitPage(){
      const h=Math.max(width==="3"?4:4,Math.ceil(el("slip").getBoundingClientRect().height/96*10)/10+.1);
      el("pageSize").textContent="@page{size:"+width+"in "+h+"in;margin:0}";
    }
    function render(){
      if(!cur)return;
      el("slip").className="w"+width;el("slip").innerHTML=slipHtml(cur);
      document.querySelectorAll(".qs-size button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.w===width)));
      el("editBtn").hidden=!head||["delivered","cancelled","canceled"].includes(String(cur.status||"").toLowerCase());
      el("side").hidden=false;fitPage();
      document.querySelectorAll("#slipBody tr").forEach(tr=>tr.classList.toggle("on",tr.dataset.id===cur.order_id));
    }
    async function show(id,andPrint){
      const {data,error}=await client.rpc("lwb_quick_slip_get",{p_order_id:id});
      if(error){msg(errText(error));tell("done");return false}
      cur=data;render();
      const u=new URL(location.href);u.searchParams.set("order",id);u.searchParams.delete("print");history.replaceState(null,"",u);
      if(andPrint)await doPrint();
      return true;
    }
    async function doPrint(){
      if(!cur)return;
      tell("ready");
      const after=()=>{window.removeEventListener("afterprint",after);tell("done")};
      window.addEventListener("afterprint",after);
      fitPage();window.print();
      const r=await client.rpc("lwb_quick_slip_printed",{p_order_id:cur.order_id});
      if(!r.error){cur.print_count=r.data;loadList()}
    }
    function msg(t){el("status").hidden=!t;el("status").textContent=t||""}

    async function loadList(){
      const {data,error}=await client.rpc("lwb_quick_slip_list",{p_from:el("from").value||null,p_to:el("to").value||null});
      if(error){msg(errText(error));return}
      const slips=data.slips||[],wait=data.waiting||[];
      el("slipBody").innerHTML=slips.map(s=>'<tr data-id="'+esc(s.order_id)+'"'+(cur&&cur.order_id===s.order_id?' class="on"':"")+'><td class="po"><b>'+esc(s.order_no)+'</b><span class="sub">'+esc(LWBDate.dt(s.slip_at))+'</span></td>'+
        '<td class="party">'+esc(s.party)+'</td><td class="drv">'+esc(s.driver_name)+'<span class="sub">'+esc(s.vehicle_no)+'</span></td>'+
        '<td class="hide-m" style="text-align:right">'+fmt(s.total_qty)+'</td><td class="n">₹'+money(s.total_amount)+'</td>'+
        '<td class="qs-act-td"><div class="qs-act"><button type="button" class="sl-btn ghost small" data-view="'+esc(s.order_id)+'">View</button><button type="button" class="sl-btn small" data-print="'+esc(s.order_id)+'">🖨 '+(Number(s.print_count)?"Reprint":"Print")+'</button></div></td></tr>').join("");
      el("slipEmpty").hidden=slips.length>0;
      el("waitCard").hidden=!wait.length||!head;el("waitN").textContent=wait.length?"("+wait.length+")":"";
      el("waitBody").innerHTML=wait.map(w=>'<tr><td class="po"><b>'+esc(w.order_no)+'</b><span class="sub">'+esc(S.shortDate(w.order_date))+'</span></td><td class="party">'+esc(w.party)+'</td>'+
        '<td class="n">₹'+money(w.total_amount)+'</td><td class="qs-act-td"><div class="qs-act"><button type="button" class="sl-btn small" data-make="'+esc(w.order_id)+'" data-no="'+esc(w.order_no)+'" data-party="'+esc(w.party)+'">Driver &amp; slip</button></div></td></tr>').join("");
    }

    function askDriver(id,title,prev){
      el("dlgSub").textContent=title;el("dErr").textContent="";
      el("dName").value=prev?prev.driver_name||"":"";el("dVeh").value=prev?prev.vehicle_no||"":"";
      el("dSave").textContent=prev?"Save":"Save & Print";
      el("dlgForm").onsubmit=async e=>{
        e.preventDefault();
        const n=el("dName").value.trim(),v=el("dVeh").value.trim();
        if(!n){el("dErr").textContent="Enter the driver name.";el("dName").focus();return}
        if(v.replace(/[^A-Z0-9]/gi,"").length<4){el("dErr").textContent="Enter the vehicle number.";el("dVeh").focus();return}
        el("dSave").disabled=true;
        const {error}=await client.rpc("lwb_quick_slip_dispatch",{p_order_id:id,p:{driver_name:n,vehicle_no:v}});
        el("dSave").disabled=false;
        if(error){el("dErr").textContent=errText(error);return}
        el("dlg").close();await loadList();await show(id,!prev);
      };
      el("dlg").showModal();setTimeout(()=>el("dName").focus(),30);
    }

    document.addEventListener("click",e=>{
      const b=e.target.closest("button");if(!b)return;
      if(b.dataset.view)show(b.dataset.view,false);
      else if(b.dataset.print)show(b.dataset.print,true);
      else if(b.dataset.make)askDriver(b.dataset.make,b.dataset.no+" · "+b.dataset.party,null);
      else if(b.dataset.w){width=b.dataset.w;try{localStorage.setItem("lwbSlipWidth",width)}catch(x){}render()}
    });
    el("printBtn").onclick=doPrint;
    el("editBtn").onclick=()=>cur&&askDriver(cur.order_id,cur.order_no+" · "+cur.party,cur);
    el("reload").onclick=loadList;

    (async()=>{
      me=await S.start(["admin","manager","accounts","warehouse"]);if(!me){tell("done");return}
      head=["admin","manager"].includes(me.role);el("newPo").hidden=!head;
      el("loading").hidden=true;el("page").hidden=false;
      const t=S.isoDay(new Date());el("to").value=t;el("from").value=S.isoDay(new Date(Date.now()-6*864e5));
      if(inFrame)document.body.classList.add("in-frame");
      const id=qs.get("order");
      await loadList();
      if(id)await show(id,qs.get("print")==="1");
    })();
  </script>
</body>
</html>
