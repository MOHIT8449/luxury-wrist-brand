<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Godown Report | Luxury Wrist Brand ERP</title>
  <script src="erp-date.js"></script><script src="erp-recent.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="erp-shell.css">
  <link rel="stylesheet" href="sales.css">
  <script src="erp-shell.js"></script>
<script src="erp-list.js"></script>
  <script src="sales-common.js"></script>
  <style>
    .gd-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
    .gd-act{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:8px;border:1px solid var(--erp-line);background:#fff;cursor:pointer;font:inherit;text-align:left;color:var(--erp-ink)}
    .gd-act b{font-size:15px}.gd-act small{color:var(--erp-muted);font-size:12px}
    .gd-act .ic{font-size:22px;line-height:1}
    .gd-act.on{border-color:var(--erp-red);background:var(--erp-red-soft)}
    .gd-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .gd-form label{display:block;font-size:12px;font-weight:600;color:#4b5763;margin-bottom:4px}
    .gd-form input,.gd-form select,.gd-form textarea{width:100%;box-sizing:border-box;height:40px;border:1.5px solid var(--erp-line);border-radius:6px;padding:0 10px;font:inherit;background:#fff}
    .gd-form textarea{height:70px;padding:8px 10px;resize:vertical}
    .gd-form .wide{grid-column:1/-1}
    .gd-form .row-end{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .gd-form .urgent{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--erp-red)}
    .gd-form .urgent input{width:auto;height:auto}
    .gd-list{display:grid;gap:10px}
    .gd-item{background:#fff;border:1px solid var(--erp-line);border-radius:8px;padding:12px 14px;display:grid;gap:6px}
    .gd-item.urgent{border-left:4px solid var(--erp-red)}
    .gd-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .gd-top b{font-size:14.5px}.gd-top .grow{flex:1}
    .gd-meta{font-size:12.5px;color:var(--erp-muted)}
    .gd-note{font-size:13.5px;white-space:pre-wrap}
    .gd-btns{display:flex;gap:8px;flex-wrap:wrap}
    .gd-photo{max-width:160px;max-height:120px;border-radius:6px;border:1px solid var(--erp-line);cursor:pointer;object-fit:cover}
    .gd-review{font-size:12.5px;background:#f6f7f9;border-radius:6px;padding:6px 8px}
    @media(max-width:760px){.gd-actions{grid-template-columns:1fr 1fr}.gd-form{grid-template-columns:1fr 1fr}}
    @media(max-width:460px){.gd-form{grid-template-columns:1fr}.gd-act{padding:12px}}
  </style>
</head>
<body>
  <div id="loading" class="status">Checking account access...</div>
  <main id="page" class="erp-main" hidden>
    <div class="erp-pagehead"><h1>Godown Report</h1><span class="grow"></span><span class="erp-badge blue" id="who"></span></div>
    <p class="sl-sub">Vehicles in and out, damage or leakage, staff absent and any other godown issue. Every report goes to Admin and the Sales Head at once. Reports do not change stock.</p>

    <div class="gd-actions" id="actions">
      <button type="button" class="gd-act" data-kind="VEHICLE"><span class="ic">🚚</span><b>Vehicle Arrived</b><small>Loading / unloading</small></button>
      <button type="button" class="gd-act" data-kind="DAMAGE"><span class="ic">💧</span><b>Damage / Leakage</b><small>With photo</small></button>
      <button type="button" class="gd-act" data-kind="ABSENT"><span class="ic">🙋</span><b>Staff Absent</b><small>Driver / labour</small></button>
      <button type="button" class="gd-act" data-kind="ISSUE"><span class="ic">📝</span><b>Other Issue</b><small>Anything else</small></button>
    </div>

    <section class="erp-card" id="formCard" hidden style="margin-bottom:14px">
      <div class="erp-card-head"><h2 id="formTitle"></h2><button type="button" class="sl-btn ghost small" id="cancel">Close</button></div>
      <form class="erp-card-body gd-form" id="form" autocomplete="off"></form>
    </section>

    <div class="sl-filters">
      <div><label for="day">Date</label><input id="day" type="date"></div>
      <div><label for="kind">Show</label><select id="kind"><option value="">All reports</option><option value="VEHICLE">Vehicles</option><option value="DAMAGE">Damage / Leakage</option><option value="ABSENT">Staff Absent</option><option value="ISSUE">Other Issues</option></select></div>
      <div><label for="state">Status</label><select id="state"><option value="">All</option><option value="OPEN">Not seen by office</option><option value="SEEN">Seen</option><option value="ACTION_TAKEN">Action taken</option></select></div>
      <button type="button" class="sl-btn ghost" id="refresh">Refresh</button>
    </div>
    <div class="sl-kpis" id="kpis" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))"></div>
    <div class="gd-list" id="list"></div>
  </main>
  <datalist id="skuList"></datalist>
  <script>
    const S=LWBSales,{client,el,esc,fmt}=S;
    let me=null,rows=[],names=new Map(),kind="",photos=new Map();
    const reviewer=()=>["admin","manager"].includes(me.role);
    const LABEL={VEHICLE:"Vehicle",DAMAGE:"Damage / Leakage",ABSENT:"Staff Absent",ISSUE:"Other Issue"};
    const ICON={VEHICLE:"🚚",DAMAGE:"💧",ABSENT:"🙋",ISSUE:"📝"};
    const VSTATE={ARRIVED:["Arrived","amber"],WORKING:["Loading / unloading","blue"],DONE:["Done","green"],LEFT:["Left","" ]};
    const RSTATE={OPEN:["Not seen","red"],SEEN:["Seen","blue"],ACTION_TAKEN:["Action taken","green"]};
    const time=v=>v?new Date(v).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:true,timeZone:"Asia/Kolkata"}):"";
    const cap=v=>{v=String(v||"").toLowerCase();return v.charAt(0).toUpperCase()+v.slice(1)};
    const opt=(list,sel)=>list.map(([v,t])=>'<option value="'+v+'"'+(v===sel?" selected":"")+">"+t+"</option>").join("");

    const FORMS={
      VEHICLE:'<div><label for="f_vehicle_no">Vehicle No. *</label><input id="f_vehicle_no" placeholder="GJ05AB1234" style="text-transform:uppercase" required></div>'+
        '<div><label for="f_purpose">For</label><select id="f_purpose">'+opt([["LOADING","Loading (sale)"],["UNLOADING","Unloading (company stock)"],["RETURN","Return"],["OTHER","Other"]])+'</select></div>'+
        '<div><label for="f_driver_name">Driver Name</label><input id="f_driver_name"></div>'+
        '<div><label for="f_driver_mobile">Driver Mobile</label><input id="f_driver_mobile" type="tel" inputmode="numeric" maxlength="14"></div>',
      DAMAGE:'<div class="wide"><label for="f_sku_name">SKU *</label><input id="f_sku_name" list="skuList" placeholder="Search SKU" required></div>'+
        '<div><label for="f_damage_type">Type</label><select id="f_damage_type">'+opt([["LEAKAGE","Leakage"],["DAMAGE","Damage"],["BREAKAGE","Breakage"],["SHORTAGE","Shortage"],["EXPIRY","Expiry"],["OTHER","Other"]])+'</select></div>'+
        '<div><label for="f_cases">Cases</label><input id="f_cases" type="number" min="0" step="1" inputmode="numeric"></div>'+
        '<div><label for="f_pcs">Loose Pieces</label><input id="f_pcs" type="number" min="0" step="1" inputmode="numeric"></div>'+
        '<div class="wide"><label for="f_photo">Photo</label><input id="f_photo" type="file" accept="image/*" capture="environment" style="height:auto;padding:8px"></div>',
      ABSENT:'<div><label for="f_person_type">Who</label><select id="f_person_type">'+opt([["LABOUR","Labour"],["DRIVER","Driver"],["LOADER","Loader"],["OTHER","Other staff"]])+'</select></div>'+
        '<div class="wide" style="grid-column:span 2"><label for="f_person_name">Name *</label><input id="f_person_name" required></div>',
      ISSUE:'<div class="wide"><label for="f_photo">Photo (optional)</label><input id="f_photo" type="file" accept="image/*" capture="environment" style="height:auto;padding:8px"></div>'
    };
    function openForm(k){
      kind=k;
      document.querySelectorAll(".gd-act").forEach(b=>b.classList.toggle("on",b.dataset.kind===k));
      el("formTitle").textContent=ICON[k]+" "+LABEL[k];
      el("form").innerHTML=FORMS[k]+'<div class="wide"><label for="f_note">'+(k==="ISSUE"?"What happened? *":"Note")+'</label><textarea id="f_note" maxlength="1000" placeholder="'+(k==="DAMAGE"?"Where, how it happened":k==="VEHICLE"?"Anything to tell the office":"Details")+'"></textarea></div>'+
        '<div class="row-end"><label class="urgent"><input type="checkbox" id="f_urgent"> Urgent</label><span class="grow" style="flex:1"></span><button type="submit" class="sl-btn" id="send">Send Report</button></div>';
      el("formCard").hidden=false;
      const first=el("form").querySelector("input,select,textarea");if(first)first.focus();
      el("formCard").scrollIntoView({behavior:"smooth",block:"start"});
    }
    function closeForm(){kind="";el("formCard").hidden=true;document.querySelectorAll(".gd-act").forEach(b=>b.classList.remove("on"))}

    // Phone photos are large: resize to 1280px JPEG before upload.
    function shrink(file){
      return new Promise((ok,bad)=>{
        const img=new Image(),url=URL.createObjectURL(file);
        img.onload=()=>{const s=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement("canvas");
          c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
          URL.revokeObjectURL(url);c.toBlob(b=>b?ok(b):bad(Error("Photo could not be read")),"image/jpeg",0.8)};
        img.onerror=()=>bad(Error("Photo could not be read"));img.src=url;
      });
    }
    async function send(e){
      e.preventDefault();
      const v=id=>{const x=el("f_"+id);return x?String(x.value||"").trim():""};
      const p={kind,vehicle_no:v("vehicle_no"),purpose:v("purpose"),driver_name:v("driver_name"),driver_mobile:v("driver_mobile"),sku_name:v("sku_name"),
        damage_type:v("damage_type"),cases:v("cases"),pcs:v("pcs"),person_type:v("person_type"),person_name:v("person_name"),note:v("note"),urgent:el("f_urgent").checked};
      if(kind==="DAMAGE"&&!(Number(p.cases)>0||Number(p.pcs)>0)){await alert("Enter the cases or loose pieces.");return}
      const btn=el("send");btn.disabled=true;btn.textContent="Sending...";
      try{
        const f=el("f_photo")&&el("f_photo").files[0];
        if(f){
          const path=me.user.id+"/"+Date.now()+".jpg";
          const up=await client.storage.from("lwb-godown-photos").upload(path,await shrink(f),{contentType:"image/jpeg"});
          if(up.error)throw Error("Photo upload failed: "+up.error.message);
          p.photo_path=path;
        }
        const {error}=await client.rpc("lwb_godown_add",{p});
        if(error)throw Error(/lwb_godown_add/.test(error.message)?"Run lwb_godown_report_setup.sql in Supabase first.":error.message);
        ERPShell.toast("Report sent to Admin and Sales Head.");
        closeForm();el("day").value=S.isoDay(new Date());await load();
      }catch(err){await alert("Could not send: "+err.message)}
      finally{if(el("send")){btn.disabled=false;btn.textContent="Send Report"}}
    }

    async function load(){
      const r=await client.from("lwb_godown_reports").select("*").eq("report_date",el("day").value).order("created_at",{ascending:false});
      if(r.error){el("list").innerHTML='<div class="sl-msg">'+esc(/lwb_godown_reports/.test(r.error.message)?"Run lwb_godown_report_setup.sql in Supabase first.":r.error.message)+"</div>";el("kpis").innerHTML="";return}
      rows=ERPRecent.sort(r.data||[]);
      const ids=[...new Set(rows.flatMap(x=>[x.created_by,x.reviewed_by]).filter(id=>id&&!names.has(id)))];
      if(ids.length){const u=await client.from("user_profiles").select("id,full_name").in("id",ids);for(const x of u.data||[])names.set(x.id,x.full_name)}
      render();
    }
    function render(){
      const k=el("kind").value,st=el("state").value,list=rows.filter(x=>(!k||x.kind===k)&&(!st||x.review_status===st));
      const n=t=>rows.filter(x=>x.kind===t).length,inside=rows.filter(x=>x.kind==="VEHICLE"&&["ARRIVED","WORKING"].includes(x.vehicle_status)).length;
      el("kpis").innerHTML=[["","Vehicles",fmt(n("VEHICLE")),inside+" in godown now"],["red","Damage / Leakage",fmt(n("DAMAGE")),fmt(rows.filter(x=>x.kind==="DAMAGE").reduce((a,x)=>a+Number(x.cases||0),0))+" cases"],
        ["","Staff Absent",fmt(n("ABSENT")),""],[rows.some(x=>x.review_status==="OPEN")?"red":"green","Not Seen by Office",fmt(rows.filter(x=>x.review_status==="OPEN").length),fmt(n("ISSUE"))+" other issues"]]
        .map(x=>'<div class="sl-kpi '+x[0]+'"><span>'+esc(x[1])+"</span><b>"+x[2]+"</b><small>"+esc(x[3])+"</small></div>").join("");
      // Count card → list of those reports (erp-list.js)
      if(window.ERPList){const KL=[["Vehicles",x=>x.kind==="VEHICLE"],["Damage / Leakage",x=>x.kind==="DAMAGE"],["Staff Absent",x=>x.kind==="ABSENT"],["Not Seen by Office",x=>x.review_status==="OPEN"]];
        const GC=[{t:"Time",v:x=>time(x.created_at)},{t:"Type",v:x=>cap(x.kind)},{t:"Detail",v:x=>[x.vehicle_no,x.purpose&&cap(x.purpose),x.damage_type&&cap(x.damage_type),x.sku_name,x.person_name,x.driver_name].filter(Boolean).join(" · ")},
          {t:"Cases",v:"cases",num:true,sum:true,dec:0},{t:"Pcs",v:"pcs",num:true,sum:true,dec:0},{t:"Vehicle status",v:x=>x.vehicle_status?cap(x.vehicle_status):""},{t:"Office",v:x=>cap(x.review_status||"")},{t:"By",v:x=>names.get(x.created_by)||""},{t:"Note",v:"note"}];
        el("kpis").querySelectorAll(".sl-kpi").forEach((c,i)=>ERPList.card(c,()=>({title:KL[i][0],sub:"Godown report · "+el("day").value,rows:rows.filter(KL[i][1]),cols:GC})))}
      if(!list.length){el("list").innerHTML='<div class="erp-empty">No report for this date.</div>';return}
      el("list").innerHTML=list.map(x=>{
        let head="",body="";
        if(x.kind==="VEHICLE"){head=esc(x.vehicle_no)+" · "+esc(cap(x.purpose));
          body=[x.driver_name&&"Driver "+esc(x.driver_name)+(x.driver_mobile?" ("+esc(x.driver_mobile)+")":""),"In "+time(x.arrived_at),x.started_at&&"Started "+time(x.started_at),x.done_at&&(x.vehicle_status==="LEFT"?"Left ":"Done ")+time(x.done_at)].filter(Boolean).join(" · ")}
        else if(x.kind==="DAMAGE"){head=esc(cap(x.damage_type))+" · "+esc(x.sku_name);body=fmt(x.cases||0)+" cases, "+fmt(x.pcs||0)+" pcs"}
        else if(x.kind==="ABSENT"){head=esc(cap(x.person_type))+" absent · "+esc(x.person_name)}
        else head="Issue";
        const vs=x.kind==="VEHICLE"&&VSTATE[x.vehicle_status],rs=RSTATE[x.review_status]||["",""];
        let btns="";
        if(x.kind==="VEHICLE"&&x.vehicle_status==="ARRIVED")btns+='<button type="button" class="sl-btn small" data-v="WORKING" data-id="'+x.id+'">Start '+(x.purpose==="UNLOADING"?"unloading":"loading")+'</button><button type="button" class="sl-btn ghost small" data-v="LEFT" data-id="'+x.id+'">Left without work</button>';
        if(x.kind==="VEHICLE"&&x.vehicle_status==="WORKING")btns+='<button type="button" class="sl-btn small" data-v="DONE" data-id="'+x.id+'">Mark done</button>';
        if(reviewer()&&x.review_status!=="ACTION_TAKEN")btns+=(x.review_status==="OPEN"?'<button type="button" class="sl-btn ghost small" data-r="SEEN" data-id="'+x.id+'">Mark seen</button>':"")+'<button type="button" class="sl-btn ghost small" data-r="ACTION_TAKEN" data-id="'+x.id+'">Action taken…</button>';
        return '<div class="gd-item'+(x.urgent?" urgent":"")+'"><div class="gd-top"><span>'+ICON[x.kind]+'</span><b>'+head+"</b>"+(x.urgent?'<span class="erp-badge red">Urgent</span>':"")+'<span class="grow"></span>'+
          (vs?'<span class="erp-badge '+vs[1]+'">'+vs[0]+"</span>":"")+'<span class="erp-badge '+rs[1]+'">'+rs[0]+"</span></div>"+
          (body?'<div class="gd-meta">'+body+"</div>":"")+(x.note?'<div class="gd-note">'+esc(x.note)+"</div>":"")+
          (x.photo_path?'<div><img class="gd-photo" data-photo="'+esc(x.photo_path)+'" alt="Report photo"></div>':"")+
          '<div class="gd-meta">GDN-'+x.id+" · "+esc(names.get(x.created_by)||"Godown")+" · "+time(x.created_at)+"</div>"+
          (x.review_status!=="OPEN"?'<div class="gd-review">'+esc(rs[0])+" by "+esc(names.get(x.reviewed_by)||"Office")+" at "+time(x.reviewed_at)+(x.review_note?": "+esc(x.review_note):"")+"</div>":"")+
          (btns?'<div class="gd-btns">'+btns+"</div>":"")+"</div>";
      }).join("");
      showPhotos();
    }
    async function showPhotos(){
      for(const img of document.querySelectorAll("img[data-photo]")){
        const p=img.dataset.photo;
        if(!photos.has(p)){const r=await client.storage.from("lwb-godown-photos").createSignedUrl(p,3600);photos.set(p,r.data?r.data.signedUrl:"")}
        if(photos.get(p))img.src=photos.get(p);else img.replaceWith(document.createTextNode("Photo not available"));
      }
    }

    (async()=>{
      me=await S.start(["admin","manager","warehouse"]);if(!me)return;
      el("who").textContent=reviewer()?"Admin / Sales Head":"Godown team";
      el("day").value=S.isoDay(new Date());
      const sk=await client.from("sku_master").select("sku_name").eq("is_active",true).order("sku_name");
      el("skuList").innerHTML=(sk.data||[]).map(s=>'<option value="'+esc(s.sku_name)+'">').join("");
      if(reviewer())el("state").value="";
      document.addEventListener("click",async e=>{
        const a=e.target.closest(".gd-act");if(a){openForm(a.dataset.kind);return}
        if(e.target.id==="cancel"){closeForm();return}
        const im=e.target.closest("img[data-photo]");if(im&&im.src){window.open(im.src,"_blank","noopener");return}
        const v=e.target.closest("[data-v]");
        if(v){v.disabled=true;const {error}=await client.rpc("lwb_godown_vehicle_status",{p_id:Number(v.dataset.id),p_status:v.dataset.v});if(error){await alert(error.message);v.disabled=false;return}await load();return}
        const r=e.target.closest("[data-r]");
        if(r){
          let note="";
          if(r.dataset.r==="ACTION_TAKEN"){note=await prompt("What action was taken? The godown team will see this.","",{placeholder:"e.g. Claim raised with company; new labour sent"});if(note===null)return}
          const {error}=await client.rpc("lwb_godown_review",{p_id:Number(r.dataset.id),p_status:r.dataset.r,p_note:note});
          if(error){await alert(error.message);return}await load();
        }
      });
      el("form").addEventListener("submit",send);
      ["day"].forEach(id=>el(id).addEventListener("change",load));
      ["kind","state"].forEach(id=>el(id).addEventListener("change",render));
      el("refresh").onclick=load;
      const q=new URLSearchParams(location.search).get("new");if(FORMS[q])openForm(q);
      el("loading").hidden=true;el("page").hidden=false;
      await load();
    })();
  </script>
</body>
</html>
