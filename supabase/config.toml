project_id = "qstgwhbgbznxemajtave"

# Database webhook authenticates with a dedicated secret. User actions also verify their JWT in the function.
[functions.lwb-web-push]
verify_jwt = false

# Public share link for company documents (share.html). The random link token is the only key.
[functions.lwb-doc-share]
verify_jwt = false

# Login with MPIN when the phone has no login session any more. The MPIN (checked by the database,
# 5 wrong tries delete it) on the user's own phone is the check, so there is no JWT yet.
[functions.lwb-mpin-login]
verify_jwt = false

# Forgot password with a WhatsApp code: the user cannot log in yet, so there is no JWT.
# The 6-digit code sent to the Login Mobile is the check (hashed, 10 minutes, 5 tries, 5 sends/hour).
[functions.lwb-forgot-password-wa]
verify_jwt = false

# Daily WhatsApp reports: called only by the database (Close Day trigger / cron / Admin buttons)
# with the secret in lwb_daily_wa_config, so there is no user JWT.
[functions.lwb-daily-whatsapp]
verify_jwt = false

# Dial Book -> Gmail contacts sync: the nightly cron call has no user JWT (it sends the secret from
# lwb_gsync_config). Every Admin action checks the Admin JWT inside the function.
[functions.lwb-google-contacts]
verify_jwt = false
