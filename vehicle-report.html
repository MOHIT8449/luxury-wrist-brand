<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="erp-fit.js"></script>
  <title>Vehicle Report | Luxury Wrist Brand ERP</title>
  <script src="erp-date.js"></script><script src="erp-recent.js"></script>
  <script src="vendor/supabase-js-2.119.0.js"></script>
  <script src="erp-period.js"></script>
  <link rel="stylesheet" href="erp-shell.css">
  <link rel="stylesheet" href="sales.css">
  <script src="erp-shell.js"></script>
  <script src="erp-list.js"></script>
  <script src="sales-common.js"></script>
  <!-- Vehicle / Driver report (Mohit, 23 Nov 2026): per vehicle for the chosen day(s): fixed driver (Employee Master
       default vehicle), who drove, tons loaded, cases delivered, parties. Data: lwb_vehicle_day (lwb_vehicle_day_setup.sql). -->
  <style>
    .vr-kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
    .vr-kpi-sub b{color:var(--erp-ink)}
    .vr-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
    .vr-bar .grow{flex:1}
    .vr-tab{border:1.5px solid var(--erp-line);border-radius:99px;padding:4px 12px;font:inherit;font-size:13px;font-weight:600;background:#fff;color:var(--erp-ink);cursor:pointer}
    .vr-tab.on{background:#002f37;border-color:#002f37;color:#fff}
    .vr-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
    .vr-card{background:#fff;border:1px solid var(--erp-line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr);gap:7px;min-width:0}
    .vr-card.warn{border-left:4px solid var(--erp-amber)}
    .vr-card.ok{border-left:4px solid var(--erp-green)}
    .vr-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
    .vr-top b{font-size:15.5px;letter-spacing:.3px}
    .vr-top .grow{flex:1}
    .vr-drv{font-size:13px;color:var(--erp-muted);min-width:0;overflow-wrap:anywhere}
    .vr-drv b{color:var(--erp-ink);font-weight:600}
    .vr-drv .alt{color:var(--erp-amber);font-weight:600}
    .vr-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
    .vr-num{background:#f6f7f9;border-radius:6px;padding:6px 8px;min-width:0}
    .vr-num span{display:block;font-size:11px;color:var(--erp-muted);text-transform:uppercase;letter-spacing:.3px}
    .vr-num b{display:block;font-size:18px;font-weight:700;line-height:1.25;white-space:nowrap}
    .vr-num small{display:block;font-size:11.5px;color:var(--erp-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .vr-num.t b{color:var(--erp-blue)}.vr-num.c b{color:var(--erp-green)}.vr-num.p b{color:var(--erp-ink)}
    .vr-cap{height:5px;border-radius:4px;background:#e4e7eb;overflow:hidden;margin-top:4px}
    .vr-cap i{display:block;height:100%;background:var(--erp-blue)}.vr-cap i.over{background:var(--erp-red)}
    .vr-btns{display:flex;gap:6px;align-items:center}
    .vr-btns .grow{flex:1;font-size:12px;color:var(--erp-muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .vr-pos{display:none;border-top:1px dashed var(--erp-line);padding-top:6px}
    .vr-card.open .vr-pos{display:block}
    .vr-po{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:2px 10px;align-items:center;padding:5px 0;border-bottom:1px solid #f0f2f5;font-size:13px}
    .vr-po:last-child{border-bottom:0}
    .vr-po .pt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .vr-po .pt b{font-weight:600}
    .vr-po .pt small{color:var(--erp-muted);margin-left:4px}
    .vr-po .q{font-weight:700;white-space:nowrap;text-align:right}
    .vr-po .q small{display:block;font-weight:400;color:var(--erp-muted);font-size:11.5px}
    .vr-idle{margin-top:12px;background:#fff;border:1px solid var(--erp-line);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--erp-muted)}
    .vr-idle b{color:var(--erp-ink);font-weight:600}
    .vr-idle .chip{display:inline-block;margin:3px 4px 0 0;padding:2px 8px;border-radius:99px;background:#f1f3f6;color:#4b5763;font-size:12px;white-space:nowrap}
    .vr-idle .chip.nod{background:#fff2dc;color:var(--erp-amber)}
    .vr-help{font-size:12px;color:var(--erp-muted);margin:8px 2px 0}
    @media(max-width:1000px){.vr-kpis{grid-template-columns:1fr 1fr}}
    @media(max-width:640px){.vr-list{grid-template-columns:1fr}.vr-num b{font-size:16px}.sl-kpi{padding:9px 11px}}
  </style>
</head>
<body>
  <div id="loading" class="status">Checking account access...</div>
  <main id="page" class="erp-main" hidden>
    <div class="erp-pagehead"><h1>Vehicle Report</h1><span class="erp-badge blue" id="range"></span><span class="grow"></span>
      <a class="sl-btn ghost small" href="fleet-master.html" style="display:inline-flex;align-items:center;text-decoration:none">Set fixed driver</a></div>
    <div class="sl-kpis vr-kpis" id="kpis"></div>
    <div class="vr-bar">
      <button type="button" class="vr-tab on" data-view="veh">Vehicle-wise</button>
      <button type="button" class="vr-tab" data-view="drv">Driver-wise</button>
      <span class="grow"></span>
      <button type="button" class="sl-btn ghost small" id="refresh">Refresh</button>
    </div>
    <div class="vr-list" id="list"></div>
    <div id="idle"></div>
    <p class="vr-help">Day = delivered day (else loading done, else the day the vehicle was given). Tons = PO weight. Delivered cases = delivered POs minus driver returns.</p>
  </main>
  <script>
    const S=LWBSales,{client,el,esc,fmt}=S;
    let me=null,data={vehicles:[],rows:[]},view="veh";
    const LOADED=["loaded","invoiced","dispatched","out_for_delivery","delivered","billed"];
    const n=v=>Number(v)||0;
    const ton=kg=>(n(kg)/1000).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
    const cs=v=>n(v).toLocaleString("en-IN",{maximumFractionDigits:1});
    const key=v=>String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
    const phone=v=>{const d=String(v||"").replace(/\D/g,"");return d.length>10?d.slice(-10):d};
    const delivered=r=>["DELIVERED","PARTIAL"].includes(r.report)||!!r.mark_delivered||r.status==="delivered";
    const notDel=r=>r.report==="NOT_DELIVERED";
    const loaded=r=>delivered(r)||!!r.loaded_at||LOADED.includes(r.status);
    const delCases=r=>delivered(r)?Math.max(0,n(r.cases)-n(r.ret_cases)):0;
    function state(r){
      if(delivered(r))return r.report==="PARTIAL"||n(r.ret_cases)>0?["Part delivered","amber"]:["Delivered","green"];
      if(notDel(r))return ["Not delivered","red"];
      if(loaded(r))return ["On the way","blue"];
      return ["To load",""];
    }
    function sum(rows){
      const o={pos:rows.length,parties:new Set(rows.map(r=>String(r.party||"").trim().toUpperCase())).size,
        kgLoaded:0,kgAll:0,cases:0,casesDel:0,ret:0,del:0,pend:0,drivers:new Map()};
      for(const r of rows){o.kgAll+=n(r.kg);if(loaded(r))o.kgLoaded+=n(r.kg);o.cases+=n(r.cases);o.casesDel+=delCases(r);
        if(delivered(r)){o.del++;o.ret+=n(r.ret_cases)}else o.pend++;
        const nm=String(r.driver_name||"").trim();if(nm)o.drivers.set(phone(r.driver_mobile)||nm.toUpperCase(),nm)}
      return o;
    }
    async function load(){
      const P=window.LWBPeriod?LWBPeriod.get():{from:S.isoDay(new Date()),to:S.isoDay(new Date()),label:"Today"};
      el("range").textContent=P.label+(P.from===P.to?" · "+LWBDate.d(P.from):"");
      const r=await client.rpc("lwb_vehicle_day",{p_from:P.from,p_to:P.to});
      if(r.error){el("list").innerHTML='<div class="sl-msg">'+esc(/lwb_vehicle_day/.test(r.error.message)?"Vehicle report is being set up. Try again in a few minutes.":r.error.message)+"</div>";el("kpis").innerHTML="";el("idle").innerHTML="";return}
      data=r.data||{vehicles:[],rows:[]};render();
    }
    function kpis(){
      const t=sum(data.rows),used=new Set(data.rows.map(r=>r.vehicle_key).filter(Boolean)).size;
      const k=[["blue","Tons loaded",ton(t.kgLoaded)+" T",t.kgAll>t.kgLoaded?ton(t.kgAll-t.kgLoaded)+" T still to load":fmt(t.pos)+" POs"],
        ["green","Cases delivered",cs(t.casesDel),"of "+cs(t.cases)+" cases"+(t.ret?" · "+cs(t.ret)+" returned":"")],
        ["","Vehicles out",fmt(used),"of "+fmt(data.vehicles.length)+" vehicles · "+fmt(t.drivers.size)+" drivers"],
        [t.pend?"red":"green","Pending delivery",fmt(t.pend)+" PO",fmt(t.del)+" delivered · "+fmt(t.parties)+" parties"]];
      el("kpis").innerHTML=k.map(x=>'<div class="sl-kpi '+x[0]+'"><span>'+esc(x[1])+"</span><b>"+esc(x[2])+'</b><small class="vr-kpi-sub">'+esc(x[3])+"</small></div>").join("");
      if(window.ERPList){const KL=[r=>loaded(r),r=>delivered(r),()=>true,r=>!delivered(r)];
        const cols=[{t:"Vehicle",v:x=>x.vehicle_no||"No vehicle"},{t:"Driver",v:"driver_name"},{t:"PO",v:"order_no"},{t:"Party",v:"party"},{t:"Cases",v:x=>n(x.cases),num:true,sum:true,dec:0},{t:"KG",v:x=>n(x.kg),num:true,sum:true,dec:0},{t:"Status",v:x=>state(x)[0]}];
        el("kpis").querySelectorAll(".sl-kpi").forEach((c,i)=>ERPList.card(c,()=>({title:k[i][1],sub:"Vehicle report · "+el("range").textContent,rows:data.rows.filter(KL[i]),cols})))}
    }
    function card(title,badges,driverLine,rows,cap,id){
      const t=sum(rows),pct=cap>0?Math.round(t.kgLoaded/cap*100):null;
      const cls=t.pend?"warn":"ok";
      const pos=rows.map(r=>{const s=state(r);return '<div class="vr-po"><div class="pt"><b>'+esc(r.party||"-")+"</b><small>"+esc(r.order_no||"")+(r.trip_no?" · "+esc(r.trip_no):"")+(view==="drv"?" · "+esc(r.vehicle_no||""):"")+"</small></div>"+
        '<div class="q">'+cs(delivered(r)?delCases(r):r.cases)+" cs<small>"+ton(r.kg)+" T</small></div>"+'<span class="erp-badge '+s[1]+'">'+s[0]+"</span></div>"}).join("");
      return '<div class="vr-card '+cls+'" data-id="'+esc(id)+'"><div class="vr-top"><b>'+esc(title)+"</b>"+badges+'<span class="grow"></span>'+
        (t.pend?'<span class="erp-badge amber">'+t.pend+" pending</span>":'<span class="erp-badge green">All delivered</span>')+"</div>"+
        '<div class="vr-drv">'+driverLine+"</div>"+
        '<div class="vr-nums"><div class="vr-num t"><span>Loaded</span><b>'+ton(t.kgLoaded)+" T</b>"+(t.kgLoaded===0&&rows.some(r=>loaded(r))?'<small style="color:var(--erp-amber)">PO weight not entered</small>':pct!=null?'<div class="vr-cap"><i class="'+(pct>100?"over":"")+'" style="width:'+Math.min(100,pct)+'%"></i></div><small>'+pct+"% of "+ton(cap)+" T</small>":"<small>"+fmt(t.kgLoaded)+" kg</small>")+"</div>"+
        '<div class="vr-num c"><span>Delivered</span><b>'+cs(t.casesDel)+" cs</b><small>of "+cs(t.cases)+(t.ret?" · "+cs(t.ret)+" ret":"")+"</small></div>"+
        '<div class="vr-num p"><span>Parties</span><b>'+fmt(t.parties)+"</b><small>"+fmt(t.pos)+" PO · "+fmt(t.del)+" done</small></div></div>"+
        '<div class="vr-btns"><span class="grow">'+esc(rows.map(r=>r.party).filter(Boolean).slice(0,3).join(", ")+(t.parties>3?" +"+(t.parties-3):""))+'</span><button type="button" class="sl-btn ghost small" data-open>POs ▾</button></div>'+
        '<div class="vr-pos">'+pos+"</div></div>";
    }
    function render(){
      kpis();
      const vmap=new Map(data.vehicles.map(v=>[key(v.vehicle_no),v])),groups=new Map();
      const gk=r=>view==="veh"?r.vehicle_key:(phone(r.driver_mobile)||String(r.driver_name||"No driver").trim().toUpperCase());
      for(const r of data.rows){const k=gk(r);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)}
      const list=[...groups.entries()].sort((a,b)=>sum(b[1]).kgAll-sum(a[1]).kgAll);
      let html="";
      for(const [k,rows] of list){
        if(view==="veh"){
          const v=vmap.get(k),fixed=v?v.drivers||[]:[],t=sum(rows),drove=[...t.drivers.values()];
          const fixedNames=fixed.map(d=>d.name.trim().toUpperCase()),other=drove.filter(d=>!fixedNames.includes(d.trim().toUpperCase()));
          const badges=(v&&v.size_ton?'<span class="erp-badge">'+esc(v.size_ton)+" T</span>":"")+(v&&v.vehicle_type?'<span class="erp-badge">'+esc(v.vehicle_type)+"</span>":"")+
            (!v?'<span class="erp-badge amber">Not in Vehicle Master</span>':v.ownership==="TRANSPORTER"?'<span class="erp-badge blue">Hired</span>':"");
          const line=(fixed.length?"Fixed: <b>"+esc(fixed.map(d=>d.name).join(", "))+"</b>":'<span class="alt">Fixed driver not set</span>')+
            (other.length?' · Drove: <span class="alt">'+esc(other.join(", "))+"</span>":drove.length&&!fixed.length?" · Drove: <b>"+esc(drove.join(", "))+"</b>":"");
          const cap=v?(n(v.capacity_kg)||n(v.size_ton)*1000):0;
          if(!k){html+=card("No vehicle given",'<span class="erp-badge red">Vehicle not entered</span>','<span class="alt">Delivered / loaded without a vehicle on Transport Assignment. Open the PO → 🚚 Transport to add it.</span>',rows,0,"none");continue}
          html+=card(rows[0].vehicle_no||k,badges,line,rows,cap,k);
        }else{
          const t=sum(rows),vs=[...new Set(rows.map(r=>r.vehicle_no))],nm=rows[0].driver_name||"No driver";
          html+=card(nm,rows[0].driver_mobile?'<span class="erp-badge">'+esc(phone(rows[0].driver_mobile))+"</span>":"","Vehicle: <b>"+esc(vs.join(", "))+"</b>",rows,0,k);
        }
      }
      el("list").innerHTML=html||'<div class="erp-empty" style="grid-column:1/-1">No vehicle was given a PO on these days.</div>';
      // Vehicles with no PO in the range, and vehicles with no fixed driver.
      const used=new Set(data.rows.map(r=>r.vehicle_key)),idle=data.vehicles.filter(v=>!used.has(key(v.vehicle_no)));
      el("idle").innerHTML=view==="veh"&&idle.length?'<div class="vr-idle"><b>No trip: '+idle.length+" vehicles</b><br>"+idle.map(v=>'<span class="chip'+((v.drivers||[]).length?"":" nod")+'">'+esc(v.vehicle_no)+" · "+esc((v.drivers||[]).map(d=>d.name).join(", ")||"no fixed driver")+"</span>").join("")+"</div>":"";
    }
    (async()=>{
      me=await S.start(["admin","manager","transport","accounts"]);if(!me)return;
      el("loading").hidden=true;el("page").hidden=false;
      if(window.LWBPeriod)LWBPeriod.on(()=>load());
      document.querySelectorAll(".vr-tab").forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll(".vr-tab").forEach(x=>x.classList.toggle("on",x===b));render()});
      el("refresh").onclick=load;
      el("list").addEventListener("click",e=>{const b=e.target.closest("[data-open]");if(!b)return;const c=b.closest(".vr-card");c.classList.toggle("open");b.textContent=c.classList.contains("open")?"POs ▴":"POs ▾"});
      await load();
    })();
  </script>
</body>
</html>
