<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks | Luxury Wrist Brand ERP</title>
  <script src="erp-date.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="erp-shell.css">
  <link rel="stylesheet" href="sales.css">
  <script src="erp-shell.js"></script>
  <script src="sales-common.js"></script>
  <style>
    .tk-new{margin-bottom:14px;height:44px;font-size:15px}
    .tk-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .tk-form label.lb{display:block;font-size:12px;font-weight:600;color:#4b5763;margin-bottom:4px}
    .tk-form input[type=text],.tk-form input[type=date],.tk-form input[type=search],.tk-form textarea{width:100%;box-sizing:border-box;height:42px;border:1.5px solid var(--erp-line);border-radius:6px;padding:0 10px;font:inherit;font-size:16px;background:#fff}
    .tk-form textarea{height:76px;padding:8px 10px;resize:vertical}
    .tk-form .wide{grid-column:1/-1}
    .tk-due{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
    .tk-chip{border:1px solid var(--erp-line);background:#fff;border-radius:16px;padding:5px 11px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--erp-ink)}
    .tk-chip.on{border-color:var(--erp-red);background:var(--erp-red);color:#fff}
    .tk-urgent{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--erp-danger,#c62828);margin-top:26px}
    .tk-urgent input{width:auto;height:auto}
    .tk-people{border:1.5px solid var(--erp-line);border-radius:8px;background:#fff;max-height:330px;overflow:auto}
    .tk-grp{border-bottom:1px solid var(--erp-line);padding:8px 10px}
    .tk-grp:last-child{border-bottom:0}
    .tk-grp-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
    .tk-grp-h b{font-size:12.5px;letter-spacing:.3px;text-transform:uppercase;color:var(--erp-muted)}
    .tk-grp-h button{margin-left:auto;border:0;background:none;color:var(--erp-red);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;padding:2px 4px}
    .tk-ppl{display:flex;flex-wrap:wrap;gap:6px}
    .tk-p{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--erp-line);border-radius:18px;padding:5px 11px 5px 8px;font-size:13.5px;cursor:pointer;user-select:none;background:#fff}
    .tk-p input{width:16px;height:16px;margin:0}
    .tk-p.on{border-color:var(--erp-red);background:var(--erp-red-soft)}
    .tk-sel{font-size:12.5px;color:var(--erp-muted);margin-top:6px}
    .tk-actions{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .tk-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .tk-tab{border:1px solid var(--erp-line);background:#fff;border-radius:18px;padding:7px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--erp-ink)}
    .tk-tab span{margin-left:6px;background:#eef0f3;border-radius:10px;padding:1px 7px;font-size:12px}
    .tk-tab.on{border-color:var(--erp-red);background:var(--erp-red);color:#fff}.tk-tab.on span{background:#fff3;color:#fff}
    .tk-list{display:grid;gap:10px}
    .tk-item{background:#fff;border:1px solid var(--erp-line);border-radius:8px;overflow:hidden}
    .tk-item.late{border-left:4px solid var(--erp-danger,#c62828)}
    .tk-item.today{border-left:4px solid var(--erp-amber)}
    .tk-item.closed{opacity:.8}
    .tk-head{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:12px 14px;cursor:pointer}
    .tk-head:hover{background:#fafbfc}
    .tk-head .ic{font-size:19px;grid-row:span 2}
    .tk-head b{font-size:14.5px;overflow-wrap:anywhere}
    .tk-item.closed .tk-head b{text-decoration:line-through;text-decoration-color:#9aa5a8}
    .tk-head .badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
    .tk-meta{font-size:12.5px;color:var(--erp-muted);grid-column:2/-1}
    .tk-body{border-top:1px solid var(--erp-line);padding:12px 14px;display:grid;gap:10px;background:#fcfcfd}
    .tk-details{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
    .tk-thread{display:grid;gap:6px}
    .tk-msg{font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;border:1px solid var(--erp-line);border-radius:8px;padding:7px 10px}
    .tk-msg small{display:block;font-size:11.5px;color:var(--erp-muted);margin-bottom:2px;white-space:normal}
    .tk-reply textarea{width:100%;box-sizing:border-box;min-height:58px;border:1.5px solid var(--erp-line);border-radius:6px;padding:8px 10px;font:inherit;font-size:16px;resize:vertical}
    .tk-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
    .tk-btns input[type=date]{height:36px;border:1.5px solid var(--erp-line);border-radius:6px;padding:0 8px;font:inherit;font-size:14px}
    .tk-closed{font-size:13px;background:#e3f4ea;color:var(--erp-green);border-radius:6px;padding:7px 10px;font-weight:600}
    .tk-closed.cancel{background:#eef0f3;color:#4b5763}
    @media(max-width:560px){
      .tk-form{grid-template-columns:1fr}.tk-urgent{margin-top:0}
      .tk-new{width:100%}
      .tk-head{grid-template-columns:auto 1fr}.tk-head .badges{grid-column:2;justify-content:flex-start}
      .tk-btns .sl-btn{flex:1 1 auto;height:40px}
      .tk-actions .sl-btn{flex:1}
    }
  </style>
</head>
<body>
  <div id="loading" class="status">Checking account access...</div>
  <main id="page" class="erp-main" hidden>
    <div class="erp-pagehead"><h1>✅ Tasks</h1><span class="grow"></span><span class="erp-badge blue" id="who"></span></div>
    <p class="sl-sub" id="sub"></p>

    <button type="button" class="sl-btn tk-new" id="newBtn">+ Give a Task</button>

    <section class="erp-card" id="formCard" hidden style="margin-bottom:14px">
      <div class="erp-card-head"><h2>Give a Task</h2><button type="button" class="sl-btn ghost small" id="cancel">Close</button></div>
      <form class="erp-card-body tk-form" id="form" autocomplete="off">
        <div class="wide"><label class="lb" for="f_title">Task *</label><input type="text" id="f_title" maxlength="150" placeholder="e.g. Godown must be cleaned today" required></div>
        <div class="wide"><label class="lb" for="f_details">Details</label><textarea id="f_details" maxlength="2000" placeholder="What exactly, where, how"></textarea></div>
        <div>
          <label class="lb" for="f_due">Due date *</label><input type="date" id="f_due" required>
          <div class="tk-due" id="dueChips"></div>
        </div>
        <div><label class="tk-urgent"><input type="checkbox" id="f_urgent"> Urgent</label></div>
        <div class="wide">
          <label class="lb" for="f_find">Give to * <small style="font-weight:400;color:var(--erp-muted)" id="chainNote"></small></label>
          <input type="search" id="f_find" placeholder="Search name" style="margin-bottom:8px">
          <div class="tk-people" id="people"><div class="tk-grp">Loading staff...</div></div>
          <div class="tk-sel" id="selCount">Nobody selected</div>
        </div>
        <div class="tk-actions"><span style="flex:1"></span><button type="submit" class="sl-btn" id="send">Give Task</button></div>
      </form>
    </section>

    <div class="tk-tabs" id="tabs"></div>
    <div class="sl-filters">
      <div><label for="st">Status</label><select id="st"><option value="OPEN">Pending</option><option value="DONE">Done</option><option value="CANCELLED">Cancelled</option><option value="">All</option></select></div>
      <div id="personBox" hidden><label for="person">Person</label><select id="person"><option value="">Everyone</option></select></div>
      <div class="grow"><label for="q">Search</label><input id="q" type="search" placeholder="Task no., words, name"></div>
      <button type="button" class="sl-btn ghost" id="refresh">Refresh</button>
    </div>
    <div class="tk-list" id="list"></div>
  </main>
  <script>
    const S=LWBSales,{client,el,esc}=S;
    let me=null,rows=[],people=[],tab="ME",openId=0;
    const picked=new Set(),updates=new Map(),drafts=new Map();
    const ROLE={admin:"Admin",manager:"Sales Head",warehouse:"Godown Manager",accounts:"Accounts",sales:"Salesman",driver:"Driver",transport:"Transport"};
    const RANK={admin:1,manager:2,warehouse:3,accounts:4,sales:5,driver:5,transport:5};
    const roleName=r=>ROLE[String(r||"").toLowerCase()]||String(r||"").toUpperCase();
    const isAdmin=()=>me.realRole==="admin";
    const pending=x=>x.status==="OPEN"||x.status==="IN_PROGRESS";
    const toMe=x=>x.assigned_to===me.user.id;
    const byMe=x=>x.assigned_by===me.user.id;
    const giver=x=>byMe(x)||isAdmin();
    const setupMsg=m=>/lwb_task/.test(m||"")?"Run lwb_task_management_setup.sql in Supabase first.":m;
    const today=()=>S.isoDay(new Date());
    const addDays=n=>{const d=new Date(today()+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
    const lateDays=x=>S.daysBetween(x.due_date,today());
    const when=v=>{if(!v)return "";const s=(Date.now()-new Date(v))/1000;
      if(s<60)return "just now";if(s<3600)return Math.floor(s/60)+" min ago";if(s<86400)return Math.floor(s/3600)+" hr ago";return LWBDate.dt(new Date(v))};
    function dueBadge(x){
      if(!pending(x))return "";
      const d=lateDays(x);
      if(d>0)return '<span class="erp-badge red">Overdue '+d+(d===1?" day":" days")+"</span>";
      if(d===0)return '<span class="erp-badge amber">Due today</span>';
      if(d===-1)return '<span class="erp-badge blue">Due tomorrow</span>';
      return '<span class="erp-badge">Due '+esc(LWBDate.d(x.due_date))+"</span>";
    }
    const STATE={OPEN:["To do",""],IN_PROGRESS:["Started","blue"],DONE:["Done","green"],CANCELLED:["Cancelled",""]};

    // ---------- Give a task ----------
    const DUES=[["Today",0],["Tomorrow",1],["In 3 days",3],["In 1 week",7]];
    function drawDue(){
      const v=el("f_due").value;
      el("dueChips").innerHTML=DUES.map(([t,n])=>'<button type="button" class="tk-chip'+(v===addDays(n)?" on":"")+'" data-due="'+n+'">'+t+"</button>").join("");
    }
    function drawPeople(){
      const q=el("f_find").value.trim().toLowerCase();
      const groups=new Map();
      people.filter(p=>!q||p.name.toLowerCase().includes(q)||p.role_label.toLowerCase().includes(q)).forEach(p=>{
        const k=p.role_label;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(p)});
      if(!people.length){el("people").innerHTML='<div class="tk-grp">No staff found.</div>';return}
      if(!groups.size){el("people").innerHTML='<div class="tk-grp">No name matches.</div>';return}
      el("people").innerHTML=[...groups].map(([k,list])=>{
        const all=list.every(p=>picked.has(p.id));
        return '<div class="tk-grp"><div class="tk-grp-h"><b>'+esc(k)+" ("+list.length+')</b><button type="button" data-grp="'+esc(k)+'">'+(all?"Clear":"Select all")+'</button></div><div class="tk-ppl">'+
          list.map(p=>'<label class="tk-p'+(picked.has(p.id)?" on":"")+'"><input type="checkbox" data-pid="'+p.id+'"'+(picked.has(p.id)?" checked":"")+">"+esc(p.name)+(p.is_me?" (me)":"")+"</label>").join("")+"</div></div>";
      }).join("");
      const n=picked.size,names=people.filter(p=>picked.has(p.id)).map(p=>p.name);
      el("selCount").textContent=n?n+" selected: "+names.slice(0,6).join(", ")+(n>6?" +"+(n-6)+" more":""):"Nobody selected";
      el("send").textContent=n>1?"Give Task to "+n+" people":"Give Task";
    }
    async function loadPeople(){
      const {data,error}=await client.rpc("lwb_task_people");
      if(error){el("people").innerHTML='<div class="tk-grp">'+esc(setupMsg(error.message))+"</div>";return}
      people=data||[];drawPeople();
    }
    function openForm(){
      el("formCard").hidden=false;el("newBtn").hidden=true;
      if(!el("f_due").value)el("f_due").value=today();
      el("f_due").min=today();drawDue();
      if(!people.length)loadPeople();
      el("formCard").scrollIntoView({behavior:"smooth",block:"start"});
      el("f_title").focus();
    }
    function closeForm(){el("form").reset();picked.clear();el("f_due").value="";drawPeople();el("formCard").hidden=true;el("newBtn").hidden=false}
    async function send(e){
      e.preventDefault();
      const title=el("f_title").value.trim(),due=el("f_due").value;
      if(!title){await alert("Please enter the task.");return}
      if(!due){await alert("Please select the due date.");return}
      if(!picked.size){await alert("Please select who gets the task.");return}
      const btn=el("send");btn.disabled=true;btn.textContent="Giving...";
      try{
        const p={title,details:el("f_details").value.trim(),due_date:due,priority:el("f_urgent").checked?"URGENT":"NORMAL",assignees:[...picked]};
        const {data,error}=await client.rpc("lwb_task_add",{p});
        if(error)throw Error(setupMsg(error.message));
        const n=(data||[]).length;
        ERPShell.toast(n>1?"Task given to "+n+" people. Each one gets a 🔔.":"Task TSK-"+data[0]+" given. 🔔 sent.");
        closeForm();tab=(data||[]).length===1&&p.assignees[0]===me.user.id?"ME":"BY";el("st").value="OPEN";
        await load();
      }catch(err){await alert("Could not give the task: "+err.message)}
      finally{btn.disabled=false;drawPeople()}
    }

    // ---------- List ----------
    async function load(){
      const r=await client.from("lwb_tasks").select("*").order("last_activity_at",{ascending:false}).limit(1000);
      if(r.error){el("list").innerHTML='<div class="sl-msg">'+esc(setupMsg(r.error.message))+"</div>";el("tabs").innerHTML="";return}
      rows=r.data||[];
      if(openId)await loadUpdates(openId);
      render();
    }
    async function loadUpdates(id){
      const r=await client.from("lwb_task_updates").select("*").eq("task_id",id).order("created_at");
      updates.set(id,r.error?[]:r.data||[]);
    }
    const TABS=[["ME","My tasks",toMe],["BY","Given by me",x=>byMe(x)&&!toMe(x)],["TEAM","Team",x=>!toMe(x)&&!byMe(x)]];
    function render(){
      const st=el("st").value,q=el("q").value.trim().toLowerCase(),who=el("person").value;
      const stHit=x=>!st||(st==="OPEN"?pending(x):x.status===st);
      const tabs=TABS.filter(([k,,f])=>k!=="TEAM"||rows.some(f));
      if(!tabs.some(t=>t[0]===tab))tab="ME";
      el("tabs").innerHTML=tabs.map(([k,t,f])=>'<button type="button" class="tk-tab'+(tab===k?" on":"")+'" data-tab="'+k+'">'+esc(t)+"<span>"+rows.filter(x=>f(x)&&pending(x)).length+"</span></button>").join("");
      const f=TABS.find(t=>t[0]===tab)[2];
      // Person filter: who got it (Given by me / Team).
      const box=el("personBox");box.hidden=tab==="ME";
      if(tab!=="ME"){
        const names=[...new Map(rows.filter(f).map(x=>[x.assigned_to,x.assigned_to_name+" ("+roleName(x.assigned_to_role)+")"])).entries()].sort((a,b)=>a[1].localeCompare(b[1]));
        const sel=el("person"),keep=sel.value;
        sel.innerHTML='<option value="">Everyone</option>'+names.map(([id,n])=>'<option value="'+id+'">'+esc(n)+"</option>").join("");
        sel.value=names.some(n=>n[0]===keep)?keep:"";
      }
      const list=rows.filter(x=>f(x)&&stHit(x)&&(tab==="ME"||!el("person").value||x.assigned_to===el("person").value)&&
        (!q||["TSK-"+x.id,x.title,x.details,x.assigned_to_name,x.assigned_by_name].join(" ").toLowerCase().includes(q)));
      // Pending: most late first, then due date, urgent first. Closed: latest first.
      list.sort((a,b)=>pending(b)-pending(a)||(pending(a)?(a.due_date<b.due_date?-1:a.due_date>b.due_date?1:(b.priority==="URGENT")-(a.priority==="URGENT")):0)||(a.last_activity_at<b.last_activity_at?1:-1));
      if(!list.length){
        el("list").innerHTML='<div class="erp-empty">'+(tab==="ME"&&st==="OPEN"?"✓ No pending task for you.":tab==="BY"&&!rows.some(f)?"You have not given any task yet. Tap “+ Give a Task”.":"No task here.")+"</div>";return}
      el("list").innerHTML=list.map(item).join("");
    }
    function item(x){
      const isOpen=openId===x.id,d=lateDays(x);
      const cls=pending(x)?(d>0?" late":d===0?" today":""):" closed";
      const st=STATE[x.status]||["",""];
      const to=toMe(x)?"You":esc(x.assigned_to_name||"Staff")+" ("+esc(roleName(x.assigned_to_role))+")";
      const by=byMe(x)?"you":esc(x.assigned_by_name||"Staff")+" ("+esc(roleName(x.assigned_by_role))+")";
      let h='<div class="tk-item'+cls+'" id="t'+x.id+'"><div class="tk-head" data-open="'+x.id+'" role="button" tabindex="0" aria-expanded="'+isOpen+'">'+
        '<span class="ic">'+(x.status==="DONE"?"✅":x.status==="CANCELLED"?"✖":x.status==="IN_PROGRESS"?"⏳":"📋")+"</span><b>"+esc(x.title)+'</b><span class="badges">'+
        (x.priority==="URGENT"&&pending(x)?'<span class="erp-badge red">Urgent</span>':"")+dueBadge(x)+
        (x.status!=="OPEN"?'<span class="erp-badge '+st[1]+'">'+st[0]+"</span>":"")+"</span>"+
        '<span class="tk-meta">TSK-'+x.id+" · "+(toMe(x)?"From "+by:"To "+to+(byMe(x)?"":" · from "+by))+" · Due "+esc(LWBDate.d(x.due_date))+" · "+when(x.created_at)+(x.update_count?" · 💬 "+x.update_count:"")+"</span></div>";
      if(isOpen)h+=body(x);
      return h+"</div>";
    }
    function body(x){
      let h='<div class="tk-body">'+(x.details?'<div class="tk-details">'+esc(x.details)+"</div>":"");
      const list=updates.get(x.id);
      if(!list)h+='<div class="tk-meta">Loading...</div>';
      else if(list.length)h+='<div class="tk-thread">'+list.map(u=>'<div class="tk-msg"><small>'+esc(u.by_user===me.user.id?"You":u.by_name||"Staff")+" · "+when(u.created_at)+"</small>"+esc(u.body)+"</div>").join("")+"</div>";
      if(x.status==="DONE")h+='<div class="tk-closed">✅ Done'+(x.closed_by_name?" · marked by "+esc(x.closed_by===me.user.id?"you":x.closed_by_name):"")+" · "+when(x.done_at)+"</div>";
      if(x.status==="CANCELLED")h+='<div class="tk-closed cancel">✖ Cancelled'+(x.closed_by_name?" by "+esc(x.closed_by===me.user.id?"you":x.closed_by_name):"")+"</div>";
      const d=esc(drafts.get(x.id)||"");
      h+='<div class="tk-reply"><textarea id="n'+x.id+'" maxlength="2000" placeholder="'+(toMe(x)?"Write what you did / a problem":"Write a note")+'">'+d+'</textarea><div class="tk-btns">';
      const B=(act,t,ghost)=>'<button type="button" class="sl-btn'+(ghost?" ghost":"")+'" data-act="'+act+'" data-id="'+x.id+'">'+t+"</button>";
      if(pending(x)){
        if(toMe(x)||giver(x))h+=B("DONE","✅ Mark done");
        if(toMe(x)&&x.status==="OPEN")h+=B("IN_PROGRESS","▶ Started",1);
      }
      h+=B("NOTE","Send note",1);
      if(giver(x)){
        if(pending(x)){
          h+='<input type="date" id="d'+x.id+'" value="'+esc(x.due_date)+'" min="'+today()+'" aria-label="New due date">'+B("DUE","Change due date",1)+B("CANCELLED","Cancel task",1);
        }else h+=B("OPEN","↺ Open again",1);
      }
      return h+"</div></div></div>";
    }
    async function act(b){
      const id=Number(b.dataset.id),x=rows.find(r=>r.id===id),a=b.dataset.act,box=el("n"+id),note=box?box.value.trim():"";
      let status=a,due=null;
      if(a==="NOTE"){status=null;if(!note){await alert("Please write a note.");box&&box.focus();return}}
      if(a==="DUE"){status=null;due=el("d"+id).value;if(!due||due===x.due_date){await alert("Please pick a new due date.");return}}
      if(a==="DONE"&&!await confirm("Mark TSK-"+id+" as done?\n\n"+(note?"Your note is sent with it.":"Tip: write what was done, so "+(toMe(x)?(x.assigned_by_name||"the giver"):"everyone")+" knows."),{ok:"Yes, done"}))return;
      if(a==="CANCELLED"&&!await confirm("Cancel TSK-"+id+"?\n\n"+(x.assigned_to_name||"The person")+" is told.",{ok:"Yes, cancel"}))return;
      b.disabled=true;
      const {error}=await client.rpc("lwb_task_update",{p_id:id,p_status:status,p_note:note||null,p_due:due});
      b.disabled=false;
      if(error){await alert("Could not save: "+setupMsg(error.message));return}
      drafts.delete(id);
      ERPShell.toast({DONE:"TSK-"+id+" done. 🔔 sent.",IN_PROGRESS:"Marked as started.",OPEN:"Task opened again.",CANCELLED:"Task cancelled.",DUE:"Due date changed.",NOTE:"Note sent."}[a]);
      await load();
    }
    async function toggle(id){
      openId=openId===id?0:id;render();
      if(openId){await loadUpdates(id);render();const n=el("t"+id);if(n)n.scrollIntoView({behavior:"smooth",block:"nearest"})}
    }

    (async()=>{
      me=await S.start(["admin","manager","warehouse","accounts","sales","driver","transport"]);if(!me)return;
      const rank=RANK[me.realRole]||99;
      el("who").textContent=roleName(me.realRole);
      el("sub").textContent=rank===1?"Give a task to anyone. You see every task and its progress; the person gets a 🔔 at once."
        :rank<5?"Give a task to your level or below. You also see the tasks of everyone below you (Team).":"Your tasks with due date. Mark them done; the giver gets a 🔔. You can also give a task to your own level.";
      el("chainNote").textContent="Admin › Sales Head › Godown Manager › Accounts › Salesman / Driver / Transport. You can give to your level or below.";
      const qs=new URLSearchParams(location.search),qid=Number(qs.get("id"));
      document.addEventListener("click",e=>{
        const c=e.target.closest("[data-due]");if(c){el("f_due").value=addDays(Number(c.dataset.due));drawDue();return}
        const g=e.target.closest("[data-grp]");if(g){const list=people.filter(p=>p.role_label===g.dataset.grp),all=list.every(p=>picked.has(p.id));
          list.forEach(p=>all?picked.delete(p.id):picked.add(p.id));drawPeople();return}
        const t=e.target.closest("[data-tab]");if(t){tab=t.dataset.tab;render();return}
        const a=e.target.closest("[data-act]");if(a){act(a);return}
        const o=e.target.closest("[data-open]");if(o){toggle(Number(o.dataset.open));return}
      });
      document.addEventListener("change",e=>{const p=e.target.closest("[data-pid]");if(p){p.checked?picked.add(p.dataset.pid):picked.delete(p.dataset.pid);drawPeople()}});
      document.addEventListener("keydown",e=>{const o=e.target.closest&&e.target.closest("[data-open]");if(o&&(e.key==="Enter"||e.key===" ")){e.preventDefault();toggle(Number(o.dataset.open))}});
      document.addEventListener("input",e=>{if(/^n\d+$/.test(e.target.id))drafts.set(Number(e.target.id.slice(1)),e.target.value)});
      el("f_due").addEventListener("change",drawDue);el("f_find").addEventListener("input",drawPeople);
      el("newBtn").onclick=openForm;el("cancel").onclick=closeForm;
      el("form").addEventListener("submit",send);
      ["st","person"].forEach(id=>el(id).addEventListener("change",render));el("q").addEventListener("input",render);
      el("refresh").onclick=load;
      document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!document.activeElement.matches("textarea,input"))load()});
      el("loading").hidden=true;el("page").hidden=false;
      await load();
      if(qid){
        const x=rows.find(r=>r.id===qid);
        if(x){tab=toMe(x)?"ME":byMe(x)?"BY":"TEAM";el("st").value="";await toggle(qid);const n=el("t"+qid);if(n)n.scrollIntoView({block:"center"})}
      }else if(!rows.some(x=>toMe(x)&&pending(x))&&rows.some(x=>byMe(x)&&!toMe(x)))tab="BY",render();
      if(qs.get("new")==="1")openForm();
    })();
  </script>
</body>
</html>
