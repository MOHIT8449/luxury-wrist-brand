<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Sales | Luxury Wrist Brand ERP</title>
  <script src="erp-date.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="erp-shell.css">
  <link rel="stylesheet" href="sales.css">
  <script src="erp-shell.js"></script>
  <script src="sales-common.js"></script>
  <style>
    .mo-filter{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px 0}
    .mo-list{padding:8px 16px 16px}
    .mo-card{border:1px solid var(--erp-line);border-radius:8px;padding:11px 13px;margin-top:8px;background:#fff}
    .mo-top{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
    .mo-top .who{flex:1;min-width:180px}
    .mo-top .who b{font-size:14px}
    .mo-top .who small{display:block;color:var(--erp-muted);font-size:12px;margin-top:2px}
    .mo-amt{text-align:right;font-size:13px;white-space:nowrap}
    .mo-amt b{display:block;font-size:14px}
    .mo-stage{margin-top:7px;font-size:12.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .mo-stage .why{color:var(--erp-red)}
    .mo-acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
    .mo-items{margin-top:9px;border-top:1px dashed var(--erp-line);padding-top:8px}
    .mo-line{display:flex;gap:10px;align-items:center;padding:4px 0;font-size:13px}
    .mo-line span{flex:1;min-width:0;overflow-wrap:anywhere}
    .mo-line .q{width:70px;text-align:right;color:var(--erp-muted)}
    .mo-line.gone span{text-decoration:line-through;color:#9aa4ae}
  </style>
</head>
<body>
  <div id="loading" class="status">Checking account access...</div>
  <main id="page" class="erp-main" hidden>
    <div class="erp-pagehead"><h1>My Sales</h1><span class="grow"></span><a class="sl-btn" href="order-entry.html" style="display:inline-flex;align-items:center;text-decoration:none">+ New PO</a></div>
    <p class="sl-sub" id="sub">Today's plan, your target and your parties.</p>
    <div class="sl-kpis" id="kpis" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))"></div>
    <section class="erp-card" style="margin-bottom:14px">
      <div class="erp-card-head"><h2>Today's Plan</h2><small id="planInfo" style="color:var(--erp-muted)"></small></div>
      <div class="erp-card-body" id="plan">Loading...</div>
    </section>
    <div class="erp-pills" id="tabs"></div>
    <section class="erp-card">
      <div class="erp-card-head"><h2 id="tabTitle"></h2><input id="q" class="sl-in" type="search" placeholder="Search..." autocomplete="off" style="width:220px"></div>
      <div class="sl-scroll" id="box"></div>
    </section>
    <p class="sl-note" id="note"></p>
  </main>
  <script>
    const S=LWBSales,{client,el,esc,fmt,short,num,key,pct}=S;
    let me=null,plan=null,parties=[],orders=[],lines=[],target=null,tab=location.hash==="#orders"?"orders":"parties",err="";
    let myOrders=null,moErr="",moFilter="pending",openId=null,busy=false;
    const TABS=[["parties","My Parties"],["orders","My Orders"],["skus","My SKUs"]];

    async function load(){
      const today=S.isoDay(new Date()),m=S.monthRange(today.slice(0,7));
      const pl=await client.rpc("lwb_my_sales_plan");
      if(pl.error){err=/lwb_my_sales_plan/.test(pl.error.message)?"Sales Team setup is not installed yet. Ask Admin.":pl.error.message;render();return}
      plan=pl.data||{};
      const [pa,ta]=await Promise.all([client.rpc("lwb_party_activity"),client.from("lwb_sales_targets").select("*").eq("month",m.from).eq("salesman_id",me.user.id).maybeSingle()]);
      parties=pa.data||[];target=ta.data||null;
      await loadMyOrders();
      try{
        let list=await S.orders(m.from,today);
        // Office salesman sees every order; his own work is the orders he took.
        if(plan.kind!=="FIELD")list=list.filter(o=>o.created_by===me.user.id);
        orders=list.map(o=>({...o,day:S.istDay(o.order_date||o.created_at)}));
        const items=await S.inChunks("order_items","order_id",orders.map(o=>o.id),"order_id,sku_name,ordered_qty,approved_qty,loaded_qty,rate");
        const by=new Map(orders.map(o=>[o.id,o]));
        lines=items.map(it=>{const o=by.get(it.order_id),q=S.lineQty(it,o,"booked");return {o,sku:String(it.sku_name||"").trim(),q,amt:q*num(it.rate)}}).filter(l=>l.q);
      }catch(e){err=e.message}
      render();
    }

    function render(){
      if(err&&!plan){el("plan").innerHTML='<div class="sl-msg">'+esc(err)+"</div>";return}
      const today=S.isoDay(new Date()),m=S.monthRange(today.slice(0,7));
      if(plan&&plan.setup===false)el("sub").textContent="Admin or Sales Head has not set you up as a Field or Office salesman yet.";
      const val=orders.reduce((a,o)=>a+num(o.total_amount),0),cases=orders.reduce((a,o)=>a+num(o.total_qty),0);
      const tgt=target?num(target.target_amount):0,p=pct(val,tgt),left=S.daysBetween(today,m.end)+1,bal=Math.max(0,tgt-val);
      const t=orders.filter(o=>o.day===today);
      el("kpis").innerHTML=[
        ["blue","My Target ("+today.slice(0,7)+")",tgt?short(tgt):"Not set",tgt?(p+"% achieved")+S.bar(p):"Ask Sales Head"],
        [p>=100?"green":"","Achieved This Month",short(val),fmt(orders.length)+" orders · "+fmt(cases)+" cases"],
        [bal?"red":"green","Balance",tgt?short(bal):"—",tgt&&bal?short(bal/left)+" needed per day":tgt?"Target done":""],
        ["","Today",short(t.reduce((a,o)=>a+num(o.total_amount),0)),fmt(t.length)+" orders · "+fmt(t.reduce((a,o)=>a+num(o.total_qty),0))+" cases"],
        ...(myOrders?[(()=>{const pend=myOrders.filter(isPendingDelivery),wait=pend.filter(o=>o.can_edit||isWaiting(o)).length;
          return [pend.length?"blue":"green","Orders Not Yet Delivered",fmt(pend.length),wait?fmt(wait)+" waiting for approval":"All delivered"]})()]:[])
      ].map(x=>'<div class="sl-kpi '+x[0]+'"><span>'+esc(x[1])+"</span><b>"+x[2]+"</b><small>"+x[3]+"</small></div>").join("");
      const pp=(plan&&plan.parties)||[],notes=(plan&&plan.notes)||[];
      el("planInfo").textContent=plan&&plan.setup!==false?pp.length+(pp.length===1?" party":" parties")+" due (no order for "+(plan.due_after_days||3)+"+ days)":"";
      el("plan").innerHTML=(notes.length?'<p style="margin:0 0 10px"><b>Sales Head:</b> '+notes.map(esc).join(" · ")+"</p>":"")+
        (pp.length?'<ol class="sl-plan" style="margin:0;padding-left:20px">'+pp.map(x=>"<li><b>"+esc(x.name)+"</b>"+(x.city?" · "+esc(x.city):"")+" — "+(x.days==null?"no order yet":x.days+" days since last order")+' <a href="order-entry.html?party='+encodeURIComponent(x.name)+'">Take order</a></li>').join("")+"</ol>":
          '<p style="margin:0;color:var(--erp-muted)">'+(plan&&plan.setup===false?"No plan until you are set up.":"Every party has ordered recently. Good work!")+"</p>");
      el("tabs").innerHTML=TABS.map(([id,l])=>'<button type="button" class="erp-pill'+(id===tab?" active":"")+'" data-tab="'+id+'">'+esc(l)+"</button>").join("");
      const q=key(el("q").value),hit=s=>!q||key(s).includes(q);
      let head,rows,numCols,note="";
      if(tab==="parties"){
        const list=parties.map(x=>({...x,days:x.last_order_date?S.daysBetween(x.last_order_date,today):null})).filter(x=>hit(x.customer_name+" "+(x.city||"")))
          .sort((a,b)=>(b.days==null?1e9:b.days)-(a.days==null?1e9:a.days));
        head=["Party","City","Last Order","No Order For","Orders (30 days)",""];numCols=[4];
        rows=list.slice(0,300).map(x=>[esc(x.customer_name),esc(x.city||"—"),S.shortDate(x.last_order_date),x.days==null?'<span class="sl-age never">Never</span>':'<span class="sl-age '+(x.days>=10?"a10":x.days>=5?"a5":x.days>=2?"a2":"")+'">'+(x.days===0?"Today":x.days+" days")+"</span>",fmt(x.orders_30d),'<a href="order-entry.html?party='+encodeURIComponent(x.customer_name)+'">Take order</a>']);
        note=plan&&plan.kind==="FIELD"?"Only your assigned parties are shown. Ask the Sales Head to add a party to your list.":"";
      }else if(tab==="orders"){
        el("tabTitle").textContent="My Orders";
        el("box").innerHTML=renderOrders(hit);
        el("note").textContent=(moErr?"Orders could not load: "+moErr+". ":"")+"Last 45 days"+(plan&&plan.kind==="FIELD"?", your orders and orders of your parties.":", orders you took.")+" You can change or cancel your own order only until the Sales Head approves it.";
        return;
      }else{
        const g=new Map();for(const l of lines){const k=key(l.sku);if(!g.has(k))g.set(k,{sku:l.sku,q:0,amt:0,p:new Set()});const x=g.get(k);x.q+=l.q;x.amt+=l.amt;x.p.add(key(l.o.customer_name))}
        head=["SKU","Cases","Amount","Parties"];numCols=[1,2,3];
        rows=[...g.values()].filter(x=>hit(x.sku)).sort((a,b)=>b.amt-a.amt).map(x=>[esc(x.sku),fmt(x.q),short(x.amt),fmt(x.p.size)]);
        note="SKUs you sold this month.";
      }
      el("tabTitle").textContent=TABS.find(x=>x[0]===tab)[1];
      el("box").innerHTML=rows.length?S.table(head,rows,numCols):'<div class="erp-empty">Nothing to show.</div>';
      el("note").textContent=(err?"Some data could not load: "+err+". ":"")+note;
    }

    // ---- My Orders: stage, delivery, edit / cancel before approval ----
    async function loadMyOrders(){
      const r=await client.rpc("lwb_my_orders",{p_days:45});
      if(r.error){myOrders=null;moErr=/lwb_my_orders/.test(r.error.message)?"Order follow-up setup is not installed yet. Ask Admin to run lwb_sales_order_followup_setup.sql":r.error.message;return}
      moErr="";myOrders=Array.isArray(r.data)?r.data:[];
    }
    const isCancelled=o=>["cancelled","canceled","rejected"].includes(S.status(o));
    const isWaiting=o=>["","pending","submitted","pending_manager","pending_approval","pending_review","new"].includes(S.status(o));
    const isDelivered=o=>o.delivery_status==="DELIVERED"||o.delivery_status==="PARTIAL";
    const isPendingDelivery=o=>!isCancelled(o)&&!isDelivered(o);
    function stage(o){
      const when=v=>LWBDate.dt(v);
      const veh=[o.driver_name,o.vehicle_no].filter(Boolean).map(esc).join(" · ");
      if(isCancelled(o))return ["red","Cancelled",o.cancel_reason?'<span class="why">Reason: '+esc(o.cancel_reason)+"</span>":""];
      if(o.delivery_status==="DELIVERED")return ["green","Delivered",esc(when(o.delivered_at))+(o.received_by?" · Received by "+esc(o.received_by):"")];
      if(o.delivery_status==="PARTIAL")return ["amber","Part delivered",esc(when(o.delivered_at))+(o.delivery_note?" · "+esc(o.delivery_note):"")];
      if(o.delivery_status==="NOT_DELIVERED")return ["red","Not delivered",esc(o.delivery_note||"Driver could not deliver")];
      const st=S.status(o);
      if(isWaiting(o))return ["amber","Waiting for approval",""];
      if(st==="approved")return ["blue","Approved","Driver not assigned yet"];
      if(st==="transport_allocated")return ["blue","Driver assigned",veh];
      if(st==="loading")return ["blue","Loading",veh];
      if(st==="loaded")return ["blue","Loaded · on the way",veh];
      if(st==="invoiced")return ["blue","Billed · on the way",veh];
      return ["",esc(st.replace(/_/g," ")||"—"),""];
    }
    function renderOrders(hit){
      if(!myOrders)return '<div class="sl-msg">'+esc(moErr||"Loading...")+"</div>";
      const groups={pending:myOrders.filter(isPendingDelivery),delivered:myOrders.filter(o=>!isCancelled(o)&&isDelivered(o)),cancelled:myOrders.filter(isCancelled),all:myOrders};
      const F=[["pending","Not delivered yet"],["delivered","Delivered"],["cancelled","Cancelled"],["all","All"]];
      let h='<div class="mo-filter">'+F.map(([k,l])=>'<button type="button" class="erp-pill'+(k===moFilter?" active":"")+'" data-mof="'+k+'">'+esc(l)+' <span class="n">'+groups[k].length+"</span></button>").join("")+"</div>";
      const list=groups[moFilter].filter(o=>hit(o.order_no+" "+o.customer_name));
      if(!list.length)return h+'<div class="erp-empty">'+(moFilter==="pending"?"No pending orders. Everything is delivered.":"Nothing to show.")+"</div>";
      h+='<div class="mo-list">';
      for(const o of list.slice(0,200)){
        const [c,label,extra]=stage(o),open=openId===o.id;
        h+='<div class="mo-card" data-id="'+esc(o.id)+'"><div class="mo-top"><div class="who"><b>'+esc(o.order_no||"—")+"</b> · "+esc(o.customer_name||"")+
          "<small>"+S.shortDate(o.order_date)+(o.mine?"":" · taken by office")+'</small></div><div class="mo-amt"><b>'+short(o.total_amount)+"</b>"+fmt(o.total_qty)+" cases</div></div>"+
          '<div class="mo-stage"><span class="erp-badge '+c+'">'+label+"</span>"+(extra?"<span>"+extra+"</span>":"")+"</div>";
        h+='<div class="mo-acts">'+(o.can_edit?'<button type="button" class="sl-btn small" data-act="edit">Modify Order</button><button type="button" class="sl-btn small ghost" data-act="cancel">Cancel Order</button>':"")+
          '<button type="button" class="sl-btn small ghost" data-act="view">'+(open?"Hide SKUs":"View SKUs")+"</button></div>";
        if(open){
          h+='<div class="mo-items">'+(o.items||[]).map(i=>{const q=i.approved_qty!=null?i.approved_qty:i.ordered_qty;
            return '<div class="mo-line"><span>'+esc(i.sku_name)+(i.entry_uom==="PALLET"&&i.ordered_pallet_qty?" ("+fmt(i.ordered_pallet_qty)+" pallet)":"")+"</span>"+
              '<b class="q">'+fmt(q)+" cs</b></div>"}).join("");
          h+="</div>";
        }
        h+="</div>";
      }
      return h+"</div>";
    }
    async function orderAction(card,act){
      const o=(myOrders||[]).find(x=>String(x.id)===card.dataset.id);if(!o||busy)return;
      if(act==="view"){openId=openId===o.id?null:o.id;render();return}
      // The whole order opens in PO Entry: add / remove SKUs, change cases, save to the same order.
      if(act==="edit"){location.href="order-entry.html?edit="+encodeURIComponent(o.id);return}
      if(act==="cancel"){
        const reason=await prompt("Why are you cancelling "+(o.order_no||"this order")+" ("+(o.customer_name||"")+")?\nThe reason goes to the Sales Head.","",{ok:"Next",cancel:"Back",placeholder:"Reason for cancelling"});
        if(reason===null)return;
        if(reason.trim().length<3){await alert("Please write the reason for cancelling.");return}
        if(!await confirm("Cancel order "+(o.order_no||"")+"?\n\nReason: "+reason.trim(),{danger:true,ok:"Yes, cancel order",cancel:"Keep order"}))return;
        busy=true;
        const r=await client.rpc("lwb_sales_cancel_order",{p_order_id:o.id,p_reason:reason.trim()});
        busy=false;
        if(r.error){await alert("Could not cancel: "+r.error.message);await loadMyOrders();render();return}
        await loadMyOrders();render();ERPShell.toast&&ERPShell.toast("Order "+(o.order_no||"")+" cancelled.","success");
      }
    }

    (async()=>{
      me=await S.start(["sales"]);if(!me)return;
      document.addEventListener("click",e=>{const f=e.target.closest("[data-mof]");if(f){moFilter=f.dataset.mof;render();return}
        const a=e.target.closest("[data-act]");if(a&&a.closest(".mo-card"))orderAction(a.closest(".mo-card"),a.dataset.act)});
      document.addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b){tab=b.dataset.tab;history.replaceState(null,"",tab==="orders"?"#orders":location.pathname);render()}});
      el("q").addEventListener("input",render);
      // Bottom bar "My Orders" / "My Sales" on the same page switch the tab.
      window.addEventListener("hashchange",()=>{tab=location.hash==="#orders"?"orders":"parties";render();window.scrollTo({top:0})});
      el("loading").hidden=true;el("page").hidden=false;
      await load();
    })();
  </script>
</body>
</html>
