<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rate &amp; Scheme | Luxury Wrist Brand ERP</title>
  <script src="erp-date.js"></script><script src="erp-recent.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="erp-shell.css">
  <script src="erp-shell.js"></script>
  <script src="pack-match.js"></script>
  <script src="mepd-scheme.js"></script>
  <script src="slab-image.js"></script>
  <style>
    .status{text-align:center;padding:80px 20px;font-size:15px;color:#555}
    .rt-sub{margin:-8px 0 14px;color:var(--erp-muted);font-size:15px}
    .rt-bar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:14px}
    .rt-bar label{display:block;font-size:14px;font-weight:600;color:#4b5763;margin-bottom:4px}
    .rt-bar input{height:42px;font-size:15px;border:1.5px solid var(--erp-line);border-radius:6px;padding:0 10px;font:inherit;background:#fff;color:var(--erp-ink)}
    .rt-bar input[type=number]{width:110px}
    .rt-bar .grow{flex:1;min-width:200px}.rt-bar .grow input{width:100%}
    .rt-bar button,.rt-file{height:42px;border-radius:6px;padding:0 18px;font-weight:600;cursor:pointer;border:1px solid var(--erp-red);background:var(--erp-red);color:#fff;display:inline-flex;align-items:center;font-size:15px}
    .rt-bar button:disabled{opacity:.45;cursor:not-allowed}
    .rt-bar label.rt-file{display:inline-flex;margin:0;background:#fff;color:var(--erp-ink);border-color:var(--erp-line);font-size:15px}
    .rt-state{font-size:15px;font-weight:600}
    .rt-state.dirty{color:var(--erp-amber)}.rt-state.ok{color:var(--erp-green)}
    .rt-scroll{overflow:auto;max-height:calc(100vh - 230px)}
    .rt-table{border-collapse:collapse;width:100%;font-size:15px}
    .rt-table th,.rt-table td{border:1px solid var(--erp-line);padding:7px 10px;text-align:right;white-space:nowrap}
    .rt-table th{background:#f6f7f9;position:sticky;top:0;z-index:1;font-weight:700;text-align:center;font-size:14px;color:#2b3440}
    .rt-table th small{display:block;font-weight:500;color:var(--erp-muted);font-size:12.5px}
    .rt-table tbody tr:nth-child(even) td{background:#fafbfc}
    .rt-table tbody tr:hover td{background:#f1f5fb}
    .rt-table td.l,.rt-table th.l{text-align:left}
    .rt-table td.strong{font-weight:700}.rt-table td.red{color:var(--erp-red);font-weight:700}
    .rt-table input{width:88px;height:34px;text-align:right;border:1px solid var(--erp-line);border-radius:5px;padding:0 6px;font:inherit;background:#fffbe6;color:var(--erp-ink)}
    .rt-table input.name{width:250px;font-weight:600;text-align:left}
    .rt-table input[type=checkbox]{width:auto;height:auto}
    .rt-table tr.off td{opacity:.45}
    .rt-table tbody tr td.chg{background:#fff3c4;font-weight:700}
    .rt-table td.wrap{white-space:normal;text-align:left;min-width:320px}
    .rt-note{font-size:14px;color:var(--erp-muted);margin:10px 2px 0}
    .rt-add{margin:10px 0 0;border:1px dashed var(--erp-line);background:#fff;color:var(--erp-ink);border-radius:6px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:15px}
    .rt-hist-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .rt-table select{height:34px;border:1px solid var(--erp-line);border-radius:5px;font:inherit;min-width:220px;background:#fff}
    .rt-add:disabled{opacity:.45;cursor:not-allowed}
    .rt-hist-head select{height:40px;font-size:15px;border:1.5px solid var(--erp-line);border-radius:6px;padding:0 8px;font:inherit}
    @media(max-width:640px){.rt-bar>div:not(.grow){flex:1 1 40%}.rt-bar input[type=number]{width:100%}.rt-bar button,.rt-file{flex:1 1 40%;justify-content:center}}
    #tabs .erp-pill{font-size:15px;padding:9px 18px}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <div id="loading" class="status">Checking account access...</div>
  <main id="page" class="erp-main" hidden>
    <div class="erp-pagehead"><h1>Rate &amp; Scheme</h1><span class="grow"></span><span id="state" class="rt-state"></span></div>
    <p class="rt-sub">Company GR, MEPD, OMS, QPS, ROI and slab rates. Every save records the changes with the date in the Rate Ledger. Visible to Admin and Manager only.</p>

    <div class="rt-bar">
      <div><label for="mepd">MEPD % (when no scheme)</label><input id="mepd" type="number" step="0.01"></div>
      <div><label for="roi">ROI (per case, main)</label><input id="roi" type="number" step="0.01"></div>
      <div><label for="roi5">Landing with ROI</label><input id="roi5" type="number" step="0.01"></div>
      <div class="grow"><label for="note">Note (e.g. "Company budget 24 Oct")</label><input id="note" maxlength="200" placeholder="What changed and who informed"></div>
      <button id="save" type="button" disabled>Save</button>
      <label class="rt-file" id="importWrap" title="Backup from the old CC PO Maker (.json)">PO Maker backup import<input id="importFile" type="file" accept=".json,application/json" hidden></label>
    </div>

    <div class="erp-pills" id="tabs"></div>
    <section class="erp-card">
      <div class="erp-card-head"><h2 id="tabTitle"></h2><small id="tabInfo" style="color:var(--erp-muted)"></small></div>
      <div class="rt-scroll" id="box"></div>
    </section>
    <p class="rt-note" id="tabNote"></p>
  </main>
  <script>
    const client=supabase.createClient("https://txkbhadzdbxpieunfvox.supabase.co","sb_publishable_W4I3Q5ODf0g17sq5uDml2Q_sLolXYEk");
    const el=id=>document.getElementById(id);
    const SLAB_NAMES=["BELOW 3 TONE","SELF PICKUP","3 & 4 TONE","SHREE JAGDISH TRADERS"];
    const SLAB_CH=["SELF PICKUP","DIRECT VEHICLE","12 PALLET","HIGH VOLUME PARTY","MARKET RATE"];
    const SNAP_KEYS=["gr","mepd","fb","oms","qps","roi","land","s1","s2","s3","s4"];

    let schemes=[],schemeErr="",skuCat=new Map(),cats=[],schemeForm={cats:[],pct:"",from:"",to:"",note:""};
    let skus=[],links=new Map(),linksSaved="",linkErr="",backupLinks=null;
    let me=null,settings={mepd_pct:1.25,roi_main:0,roi_landing:5},packs=[],history=[],saved="",tab="landing",busy=false,importedLedger=null;

    const n=v=>(v===""||v==null||isNaN(+v))?0:+v;
    const blank=v=>v===""||v==null;
    const r2=v=>Math.round(+(v*100).toFixed(6))/100;
    const fmt=(v,d=0)=>(v===""||v==null)?"":Number(v).toLocaleString("en-IN",{minimumFractionDigits:d,maximumFractionDigits:d});
    const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const dtTxt=v=>LWBDate.dt(v);
    const numOrBlank=v=>v===""||v==null?"":+v;

    async function logout(){await client.auth.signOut();location.replace("login.html")}
    async function start(allowed){
      const {data:{session}}=await client.auth.getSession();
      if(!session){location.replace("login.html");return null}
      const {data:p}=await client.from("user_profiles").select("full_name,role,active").eq("id",session.user.id).single();
      const realRole=String((p&&p.role)||"").toLowerCase().trim(),role=p?await ERPShell.pageRoleFresh(realRole):realRole;
      if(!p||p.active!==true||!allowed.includes(role)){location.replace("dashboard.html");return null}
      return {user:session.user,role,realRole,name:p.full_name||session.user.email};
    }

    /* Same formulas as the CC PO Maker LANDING sheet */
    function calcLanding(r,roi){
      const C=n(r.case_config),D=n(r.gr),F=n(r.free_bottle),H=n(r.qps),I=n(roi!=null?roi:settings.roi_main);
      const sc=packScheme(r);
      const E=D*(sc?n(sc.mepd_pct):blank(r.mepd_pct)?n(settings.mepd_pct):n(r.mepd_pct))/100;
      const base=D-E-H-I-((C?D/C:0)-1)*F;
      const P=n(r.slab3_rate),L=P+5,N=P-5,R=P-5;
      let G,J,mg;
      if(F>0&&C){
        mg=rate=>r2((rate-base)/(1+F/C));
        const O=mg(P);
        G=(((D/C)-1)*F)-((O/C)*F);
        J=D-E-G-H-I;
      }else{
        G=n(r.oms);J=D-E-G-H-I;mg=rate=>r2(rate-J);
      }
      return {E,G,J,K:mg(L),L,M:mg(N),N,O:mg(P),P,Q:R-J,R};
    }
    // Today's MEPD scheme for the categories of the SKUs linked to this pack.
    function packScheme(r){
      if(!r.id||!schemes.length)return null;let best=null;
      for(const [k,id] of links)if(id===r.id){const s=LWBMepd.find(schemes,skuCat.get(k));if(s&&(!best||String(s.created_at)>String(best.created_at)))best=s}
      return best;
    }
    function snapRows(){
      return packs.filter(p=>p.active!==false).map(r=>{const c=calcLanding(r);
        return {name:r.pack_name,gr:n(r.gr),mepd:r2(c.E),fb:n(r.free_bottle),oms:r2(c.G),qps:n(r.qps),roi:n(settings.roi_main),land:r2(c.J),s1:c.L,s2:c.N,s3:c.P,s4:c.R}});
    }
    const snapSig=rows=>rows.map(r=>[r.name].concat(SNAP_KEYS.map(k=>r[k])).join(",")).join("|");
    function ratesChanged(){const last=history[0];return !last||snapSig(last.rows||[])!==snapSig(snapRows())}

    const stateNow=()=>JSON.stringify({settings,packs});
    function isDirty(){return stateNow()!==saved}
    function showState(){
      const d=isDirty();
      el("save").disabled=busy||!d;
      const sb=el("saveBelow");if(sb)sb.disabled=busy||!d;
      const s=el("state");
      if(d){s.textContent="Unsaved changes";s.className="rt-state dirty"}
      else{const h=history[0];s.textContent=h?"Last save: "+dtTxt(h.created_at):"";s.className="rt-state ok"}
    }
    window.addEventListener("beforeunload",e=>{if(isDirty()||linksDirty()){e.preventDefault();e.returnValue=""}});

    async function load(){
      const [s,p,h]=await Promise.all([
        client.from("lwb_rate_settings").select("mepd_pct,roi_main,roi_landing").eq("id",1).maybeSingle(),
        client.from("lwb_rate_packs").select("*").order("sort_no").order("pack_name"),
        client.from("lwb_rate_history").select("id,created_at,note,settings,rows").order("created_at",{ascending:false}).limit(500)
      ]);
      const err=s.error||p.error||h.error;
      if(err){el("box").innerHTML='<div class="erp-empty">Rate tables are not set up yet, or you do not have access: '+esc(err.message)+'<br>Run lwb_rate_scheme_setup.sql in Supabase.</div>';throw err}
      if(s.data)settings={mepd_pct:+s.data.mepd_pct,roi_main:+s.data.roi_main,roi_landing:+s.data.roi_landing};
      packs=(p.data||[]).map(x=>({id:x.id,sort_no:x.sort_no,pack_name:x.pack_name,case_config:+x.case_config,gr:+x.gr,mepd_pct:numOrBlank(x.mepd_pct),
        free_bottle:+x.free_bottle,oms:numOrBlank(x.oms),qps:+x.qps,slab3_rate:+x.slab3_rate,unit_weight:numOrBlank(x.unit_weight),bottle:numOrBlank(x.bottle),
        slab_landing:numOrBlank(x.slab_landing),slab_margins:[0,1,2,3,4].map(i=>numOrBlank((x.slab_margins||[])[i])),active:x.active!==false})).sort((a,b)=>a.sort_no-b.sort_no||a.pack_name.localeCompare(b.pack_name));
      history=h.data||[];
      saved=stateNow();
      await loadLinks();await loadSchemes();
      el("mepd").value=settings.mepd_pct;el("roi").value=settings.roi_main;el("roi5").value=settings.roi_landing;
      render();
    }

    /* ---------- MEPD scheme: % for chosen categories for a period ---------- */
    async function loadSchemes(){
      const [sc,cm]=await Promise.all([
        client.from("lwb_mepd_schemes").select("*").order("valid_from",{ascending:false}),
        client.from("sku_master").select("sku_name,category").eq("is_active",true)
      ]);
      schemeErr=sc.error?sc.error.message:"";schemes=ERPRecent.sort(sc.data||[]);
      skuCat=new Map((cm.data||[]).filter(x=>x.category).map(x=>[skuKey(x.sku_name),LWBMepd.up(x.category)]));
      cats=[...new Set(skuCat.values())].sort();
    }
    const ymd=d=>d.toLocaleDateString("en-CA",{timeZone:"Asia/Kolkata"});
    function quickRange(kind){
      const t=new Date(LWBMepd.day()+"T00:00:00");let a=new Date(t),b=new Date(t);
      if(kind==="week"){const dow=(t.getDay()+6)%7;a.setDate(t.getDate()-dow);b=new Date(a);b.setDate(a.getDate()+6)}
      if(kind==="month"){a=new Date(t.getFullYear(),t.getMonth(),1);b=new Date(t.getFullYear(),t.getMonth()+1,0)}
      const f=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
      schemeForm.from=f(a);schemeForm.to=f(b);
    }
    function renderSchemes(){
      el("tabTitle").textContent="MEPD Scheme";
      const today=LWBMepd.day(),live=schemes.filter(s=>s.valid_from<=today&&today<=s.valid_to);
      el("tabInfo").textContent=live.length+" schemes active today";
      el("tabNote").textContent="Enter the MEPD % the company gives for a category and period. Landing for SKUs in that category (here and on PO Entry) uses this %. Without a scheme, the pack MEPD % or the default MEPD % above applies. If a category has two schemes, the most recent one applies.";
      if(schemeErr){el("box").innerHTML='<div class="erp-empty">The MEPD scheme table is not set up yet: '+esc(schemeErr)+'<br>Run lwb_mepd_scheme_setup.sql in Supabase.</div>';return}
      const F=schemeForm;
      let h='<div class="erp-card-body"><div style="font-weight:600;margin-bottom:6px">Select categories</div>';
      h+=cats.length?'<div style="display:flex;flex-wrap:wrap;gap:6px 14px">'+cats.map(c=>'<label style="display:flex;gap:5px;align-items:center;font-size:13px"><input type="checkbox" data-scat="'+esc(c)+'"'+(F.cats.includes(c)?" checked":"")+">"+esc(c)+"</label>").join("")+
        '</div><div style="margin:6px 0"><button type="button" class="rt-add" style="margin:0" id="scAll">Select all</button> <button type="button" class="rt-add" style="margin:0" id="scNone">Clear</button></div>'
        :'<div class="erp-empty">No SKU in SKU Master has a category. Add categories in SKU Master first.</div>';
      h+='<div class="rt-bar" style="margin-top:8px"><div><label for="scPct">MEPD %</label><input id="scPct" type="number" step="0.01" min="0" max="100" value="'+esc(F.pct)+'"></div>'+
        '<div><label for="scFrom">Valid from</label><input id="scFrom" type="date" value="'+esc(F.from)+'"></div><div><label for="scTo">Valid to</label><input id="scTo" type="date" value="'+esc(F.to)+'"></div>'+
        '<div style="align-self:flex-end"><button type="button" class="rt-add" style="margin:0" data-range="day">Today</button> <button type="button" class="rt-add" style="margin:0" data-range="week">This week</button> <button type="button" class="rt-add" style="margin:0" data-range="month">This month</button></div>'+
        '<div class="grow"><label for="scNote">Note</label><input id="scNote" maxlength="200" value="'+esc(F.note)+'" placeholder="Company message / circular"></div>'+
        '<button type="button" id="scAdd">Add scheme</button></div></div>';
      h+='<table class="rt-table"><thead><tr><th class="l">CATEGORY</th><th>MEPD %</th><th>FROM</th><th>TO</th><th class="l">NOTE</th><th>STATUS</th><th></th></tr></thead><tbody>';
      for(const s of schemes){const st=s.valid_to<today?"Expired":s.valid_from>today?"Upcoming":"Active";
        h+='<tr class="'+(st==="Expired"?"off":"")+'"><td class="l">'+esc((s.categories||[]).join(", "))+"</td><td>"+fmt(s.mepd_pct,2)+"</td><td>"+esc(s.valid_from)+"</td><td>"+esc(s.valid_to)+'</td><td class="l">'+esc(s.note||"")+"</td><td"+(st==="Active"?' class="strong"':"")+">"+st+'</td><td><button type="button" class="rt-add" style="margin:0" data-scdel="'+esc(s.id)+'">Remove</button></td></tr>'}
      if(!schemes.length)h+='<tr><td colspan="7" class="l">No MEPD schemes yet.</td></tr>';
      el("box").innerHTML=h+"</tbody></table>";
    }
    async function addScheme(){
      const F=schemeForm,pct=+F.pct;
      if(!F.cats.length){await ERPShell.alert("Select at least one category.");return}
      if(F.pct===""||!(pct>=0&&pct<=100)){await ERPShell.alert("Enter an MEPD % between 0 and 100.");return}
      if(!F.from||!F.to||F.to<F.from){await ERPShell.alert("Enter valid From / To dates.");return}
      const {error}=await client.from("lwb_mepd_schemes").insert({categories:F.cats,mepd_pct:pct,valid_from:F.from,valid_to:F.to,note:F.note.trim()||null});
      if(error){await ERPShell.alert("Scheme not saved: "+error.message);return}
      schemeForm={cats:[],pct:"",from:"",to:"",note:""};await loadSchemes();render();ERPShell.toast("MEPD scheme saved.","success");
    }
    async function delScheme(id){
      const s=schemes.find(x=>x.id===id);if(!s)return;
      if(!await ERPShell.confirm("Remove this scheme? "+(s.categories||[]).join(", ")+" · "+s.mepd_pct+"% · "+s.valid_from+" to "+s.valid_to))return;
      const {error}=await client.from("lwb_mepd_schemes").delete().eq("id",id);
      if(error){await ERPShell.alert("Scheme not removed: "+error.message);return}
      await loadSchemes();render();
    }

    /* ---------- SKU link: which pack each ERP SKU uses on the PO page ---------- */
    const skuKey=v=>String(v||"").trim().toUpperCase();
    const loose=v=>skuKey(v).replace(/[^A-Z0-9]/g,"");
    async function loadLinks(){
      linkErr="";
      const [m,l]=await Promise.all([
        client.from("sku_master").select("sku_name,is_active").eq("is_active",true),
        client.from("lwb_rate_pack_skus").select("sku_key,pack_id")
      ]);
      skus=[...new Set((m.data||[]).map(x=>String(x.sku_name||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
      if(l.error){linkErr=l.error.message;links=new Map()}
      else links=new Map((l.data||[]).map(x=>[x.sku_key,x.pack_id]));
      linksSaved=linkSig();
    }
    const linkSig=()=>JSON.stringify([...links].sort());
    const linksDirty=()=>linkSig()!==linksSaved;
    function suggestPack(name){
      const k=loose(name);if(!k)return null;
      if(backupLinks&&backupLinks.has(skuKey(name))){const p=packs.find(x=>x.id&&skuKey(x.pack_name)===backupLinks.get(skuKey(name)));if(p)return p}
      return packs.find(x=>x.id&&loose(x.pack_name)===k)||packByShape(name);
    }
    const packByShape=name=>LWBPackMatch.match(name,packs.filter(p=>p.id));
    function renderLinks(){
      el("tabTitle").textContent="SKU Link";
      const done=skus.filter(x=>links.has(skuKey(x))).length;
      el("tabInfo").textContent=done+" / "+skus.length+" SKU linked";
      el("tabNote").textContent="When an SKU is selected on PO / Sales Order Entry, the slab rate of its linked pack is filled in. For unlinked SKUs the salesperson enters the rate manually. Save a new pack in the Landing tab first, then link it here.";
      if(linkErr){el("box").innerHTML='<div class="erp-empty">The SKU link table is not set up yet: '+esc(linkErr)+'<br>Run lwb_order_rates_setup.sql in Supabase.</div>';return}
      const opts=packs.filter(p=>p.id&&p.active!==false);
      let h='<div class="erp-card-body rt-hist-head"><button type="button" class="rt-add" style="margin:0" id="linkAuto">Auto-match by name (unlinked only)</button>'+
        '<button type="button" class="rt-add" style="margin:0;border-style:solid;background:var(--erp-red);color:#fff;border-color:var(--erp-red)" id="linkSave"'+(linksDirty()?"":" disabled")+'>Save links</button>'+
        '<span class="rt-state '+(linksDirty()?"dirty":"ok")+'">'+(linksDirty()?"Links changed, not saved":"")+"</span></div>";
      h+='<table class="rt-table"><thead><tr><th>#</th><th class="l">ERP SKU (SKU Master)</th><th class="l">RATE PACK</th><th>SLAB 3 RATE</th></tr></thead><tbody>';
      skus.forEach((x,i)=>{
        const id=links.get(skuKey(x))||"",p=packs.find(q=>q.id===id);
        h+="<tr"+(id?"":' class="off"')+"><td>"+(i+1)+'</td><td class="l">'+esc(x)+'</td><td class="l"><select data-link="'+esc(x)+'"><option value="">— Not linked —</option>'+
          opts.map(q=>'<option value="'+q.id+'"'+(q.id===id?" selected":"")+">"+esc(q.pack_name)+"</option>").join("")+"</select></td><td>"+(p?fmt(p.slab3_rate):"")+"</td></tr>";
      });
      if(!skus.length)h+='<tr><td colspan="4" class="l">No active SKUs in SKU Master.</td></tr>';
      el("box").innerHTML=h+"</tbody></table>";
    }
    async function saveLinks(){
      const before=new Map(JSON.parse(linksSaved||"[]"));
      const keys=new Set([...before.keys(),...links.keys()]);
      const payload=[...keys].filter(k=>before.get(k)!==links.get(k)).map(k=>({sku_name:k,pack_id:links.get(k)||null}));
      if(!payload.length)return;
      const {error}=await client.rpc("lwb_link_rate_skus",{p_links:payload});
      if(error){await ERPShell.alert("Links not saved: "+error.message);return}
      await loadLinks();render();
      ERPShell.toast(payload.length+" SKU links saved.","success");
    }

    /* ---------- tabs ---------- */
    const TABS=[["landing","Landing"],["slabrate","Slab Rate"],["mepd","MEPD Scheme"],["slab","Slab (weight)"],["links","SKU Link"],["ledger","Rate Ledger"]];
    function renderTabs(){el("tabs").innerHTML=TABS.map(([id,l])=>'<button type="button" class="erp-pill'+(id===tab?" active":"")+'" data-tab="'+id+'">'+esc(l)+"</button>").join("")}
    function render(){
      renderTabs();

      if(me.edit&&pasteOpen)h+='<div class="erp-card-body"><div style="font-size:12px;color:#555;margin-bottom:6px">Copy rows from the rate sheet and paste them here (the heading row is fine too). Columns: # · PACK · CASE CONFIG · GR · MEPD · FREE BOTTLE · OMS · QPS · ROI · LANDING · Slab 1-4 margin / MGR rate. The Slab 3 MGR rate is used. A pack with the same name is updated; a new name creates a new pack.</div>'+

    let slabPasteOpen=false;
    async function applySlabPaste(text){
      let done=0;const miss=[];
      for(const line of String(text||"").split(/\r?\n/)){
        const c=line.split("\t").map(x=>x.trim()),name=c[0]||"";
        if(!name||num(name)!=null||num(c[1])==null)continue;
        const p=packs.find(q=>loose(q.pack_name)===loose(name));
        if(!p){miss.push(name);continue}
        p.unit_weight=num(c[1]);p.bottle=num(c[2])??"";p.slab_landing=num(c[3])==null?"":r2(num(c[3]));
        p.slab_margins=[0,1,2,3,4].map(j=>num(c[4+j*2])??"");done++;
      }
      if(!done&&!miss.length){await ERPShell.alert("No slab rows found. Copy the rows with SKU and WEIGHT from the SLAB sheet and paste them.");return}

    let ledSku=0;

      const asc=history.slice().reverse();let prev=null;const lines=[];

        lines.unshift('<tr><td class="l">'+esc(dtTxt(e.created_at))+'</td><td class="l">'+esc(e.note||"")+"</td>"+SNAP_KEYS.map(k=>"<td"+(prev&&prev[k]!==r[k]?' class="chg" title="previously '+esc(prev[k])+'"':"")+">"+fmt(r[k],["mepd","oms","land"].includes(k)?2:0)+"</td>").join("")+"</tr>");

      history.forEach((e,idx)=>{const P=history[idx+1];
        const ch=P?(e.rows||[]).map(r=>{const o=(P.rows||[]).find(x=>x.name===r.name);if(!o)return r.name+": new";const ks=SNAP_KEYS.filter(k=>o[k]!==r[k]);return ks.length?r.name+": "+ks.map(k=>k.toUpperCase()+" "+fmt(o[k],2)+"→"+fmt(r[k],2)).join(", "):""}).filter(Boolean):["First entry"];
        h+="<tr><td>"+(history.length-idx)+'</td><td class="l">'+esc(dtTxt(e.created_at))+'</td><td class="l">'+esc(e.note||"")+'</td><td class="wrap">'+esc(ch.slice(0,8).join(" | ")+(ch.length>8?" | +"+(ch.length-8)+" more":""))+"</td></tr>";});
      if(!history.length)h+='<tr><td colspan="4" class="l">No entries yet.</td></tr>';
      el("box").innerHTML=h+"</tbody></table>";

    /* ---------- edits ---------- */
    document.addEventListener("input",e=>{
      const t=e.target;
      if(["mepd","roi","roi5"].includes(t.id)){

      else if(/^m\d$/.test(f))r.slab_margins[+f.slice(1)]=v===""?"":(isNaN(+v)?r.slab_margins[+f.slice(1)]:+v);
      else if(["mepd_pct","oms","unit_weight","bottle","slab_landing"].includes(f))r[f]=v===""?"":(isNaN(+v)?r[f]:+v);

    document.addEventListener("change",e=>{
      const t=e.target;
      if(t.type==="checkbox"&&t.dataset.f==="active"){packs[+t.dataset.i].active=t.checked;render();return}
      if(t.dataset.scat!=null){const c=t.dataset.scat;schemeForm.cats=t.checked?[...new Set([...schemeForm.cats,c])]:schemeForm.cats.filter(x=>x!==c);return}
      if(t.id==="ledSku"){ledSku=+t.value;renderLedger();return}
      if(t.dataset.link!=null){const k=skuKey(t.dataset.link);if(t.value)links.set(k,t.value);else links.delete(k);renderLinks();return}
      if(t.id==="importFile"){importBackup(t.files[0]);t.value=""}
    });
    document.addEventListener("click",e=>{
      const b=e.target.closest("[data-tab]");if(b){tab=b.dataset.tab;render();return}
      if(e.target.id==="linkSave"){saveLinks();return}
      if(e.target.id==="saveBelow"){el("save").click();return}
      if(e.target.id==="imgCopy"||e.target.id==="imgSave"){const copy=e.target.id==="imgCopy";
        (async()=>{try{const cv=slabImage();if(isDirty())ERPShell.toast("Note: changes are not saved yet; the image shows the new rates.","info");
          if(copy){await LWBSlabImage.copy(cv);ERPShell.toast("Image copied. Press Ctrl+V in the WhatsApp chat.","success")}
          else{await LWBSlabImage.download(cv,"Slab-Rate-"+imgDate);ERPShell.toast("Image downloaded.","success")}
        }catch(err){ERPShell.toast(err.message,"error")}})();return}
      if(e.target.id==="scAdd"){addScheme();return}
      if(e.target.id==="scAll"||e.target.id==="scNone"){schemeForm.cats=e.target.id==="scAll"?cats.slice():[];renderSchemes();return}
      if(e.target.dataset.range){quickRange(e.target.dataset.range);renderSchemes();return}
      if(e.target.dataset.scdel){delScheme(e.target.dataset.scdel);return}
      if(e.target.id==="linkAuto"){let c=0;for(const x of skus){if(links.has(skuKey(x)))continue;const p=suggestPack(x);if(p){links.set(skuKey(x),p.id);c++}}
        renderLinks();ERPShell.toast(c?c+" SKUs matched. Review them, then click \"Save links\".":"No new SKUs matched by name.",c?"success":"info");return}
      if(e.target.id==="packsFromSku"){packsFromSku();return}
      if(e.target.id==="slabPasteOpen"){slabPasteOpen=true;render();const t=el("slabPasteBox");if(t)t.focus();return}
      if(e.target.id==="slabPasteClose"){slabPasteOpen=false;render();return}
      if(e.target.id==="slabPasteApply"){applySlabPaste(el("slabPasteBox").value);return}
      if(e.target.id==="pasteOpen"){pasteOpen=true;render();const t=el("pasteBox");if(t)t.focus();return}
      if(e.target.id==="pasteClose"){pasteOpen=false;render();return}
      if(e.target.id==="pasteApply"){applyPaste(el("pasteBox").value);return}
      if(e.target.id==="addPack"){packs.push({pack_name:"",sort_no:packs.length,case_config:0,gr:0,mepd_pct:"",free_bottle:0,oms:"",qps:0,slab3_rate:0,unit_weight:"",bottle:"",slab_landing:"",slab_margins:["","","","",""],active:true});render();
        const ins=document.querySelectorAll('input[data-f="pack_name"]');if(ins.length)ins[ins.length-1].focus()}
    });
    // Re-rendering replaces inputs; keep the cursor in the same box.
    function keepFocus(fn){
      const a=document.activeElement,key=a&&a.dataset&&a.dataset.i!=null?a.dataset.i+"|"+a.dataset.f:(a&&a.id),sel=a&&a.selectionStart!=null&&a.type!=="number"?[a.selectionStart,a.selectionEnd]:null,y=el("box").scrollTop,x=el("box").scrollLeft;
      fn();
      el("box").scrollTop=y;el("box").scrollLeft=x;
      if(!key)return;
      const [i,f]=String(key).split("|");
      const t=f!=null?document.querySelector('[data-i="'+i+'"][data-f="'+f+'"]'):el(i);
      if(t){t.focus({preventScroll:true});if(sel&&t.setSelectionRange)try{t.setSelectionRange(sel[0],sel[1])}catch(e){}}
    }

    /* ---------- packs from SKU Master: one pack per size / case / MRP ----------
       "250ML COKE 1X28 MRP 20" and "250ML THUMS UP 1X28 MRP 20" share the pack
       "250ML 1X28 MRP 20" (brand words dropped). After Save the SKUs are linked. */
    const PACK_WORDS=new Set(["MRP","PET","CAN","RGB","GLASS","TETRA","ASEPTIC","SLEEK","NRGB","RTD","POUCH","BIB"]);
    const packKey=name=>skuKey(name).split(/\s+/).filter(t=>/\d/.test(t)||PACK_WORDS.has(t)).join(" ");
    let autoLinkAfterSave=false;
    async function packsFromSku(){
      const groups=new Map();
      for(const x of skus){if(links.has(skuKey(x)))continue;const k=packKey(x);if(!k)continue;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)}
      if(!groups.size){await ERPShell.alert("No new SKUs found: all SKUs are already linked, or their names have no size (e.g. 250ML).");return}
      backupLinks=backupLinks||new Map();let added=0;
      for(const [k,list] of groups){
        let p=packs.find(q=>loose(q.pack_name)===loose(k));
        if(!p){const cc=(k.match(/\b\d+\s*X\s*(\d+)\b/)||[])[1];
          p={pack_name:k,sort_no:packs.length,case_config:cc?+cc:0,gr:0,mepd_pct:"",free_bottle:0,oms:"",qps:0,slab3_rate:0,unit_weight:"",bottle:"",slab_landing:"",slab_margins:["","","","",""],active:true};
          packs.push(p);added++}
        list.forEach(x=>backupLinks.set(skuKey(x),skuKey(p.pack_name)));
      }
      autoLinkAfterSave=true;tab="landing";render();
      const linked=[...groups.values()].reduce((a,l)=>a+l.length,0);
      ERPShell.toast(added+" new packs created; "+linked+" SKUs will be linked to them. Enter GR / Slab 3 rates, then click Save.","success");
    }
    /* ---------- paste the rate sheet from Excel ---------- */
    let pasteOpen=false;
    const num=v=>{v=String(v??"").replace(/[,₹\s]/g,"");return v===""||isNaN(+v)?null:+v};
    async function applyPaste(text){
      const rows=[];
      for(const line of String(text||"").split(/\r?\n/)){
        const c=line.split("\t").map(x=>x.trim());
        // "1 <tab> 300ML CSD MRP.20 <tab> 28 ..." or "300ML CSD MRP.20 <tab> 28 ..."
        const o=(/^\d+$/.test(c[0]||"")&&c[1]&&num(c[1])==null)?1:0;
        const name=c[o]||"",cc=num(c[o+1]),gr=num(c[o+2]);
        if(!name||num(name)!=null||cc==null||gr==null)continue;
        rows.push({name:name.replace(/\s+/g," "),cc,gr,mepd:num(c[o+3]),fb:num(c[o+4])||0,oms:num(c[o+5]),qps:num(c[o+6])||0,land:num(c[o+8]),s3:num(c[o+14])});
      }
      if(!rows.length){await ERPShell.alert("No pack rows found. Copy the PACK rows (with CASE CONFIG and GR) from Excel and paste them.");return}
      packs=packs.filter(p=>p.id||String(p.pack_name||"").trim());
      let added=0,updated=0;const off=[];
      for(const r of rows){
        let p=packs.find(q=>loose(q.pack_name)===loose(r.name));
        if(!p){p={pack_name:r.name,sort_no:packs.length,case_config:0,gr:0,mepd_pct:"",free_bottle:0,oms:"",qps:0,slab3_rate:0,unit_weight:"",bottle:"",slab_landing:"",slab_margins:["","","","",""],active:true};packs.push(p);added++}else updated++;
        p.case_config=r.cc;p.gr=r.gr;p.free_bottle=r.fb;p.qps=r.qps;
        const pct=r.gr&&r.mepd!=null?r.mepd/r.gr*100:null;
        p.mepd_pct=pct==null||Math.abs(pct-n(settings.mepd_pct))<0.02?"":r2(pct*100)/100;
        p.oms=r.fb>0?"":(r.oms==null?"":r.oms);
        if(r.s3!=null)p.slab3_rate=r.s3;
        if(r.land!=null&&Math.abs(calcLanding(p).J-r.land)>1)off.push(r.name);
      }
      pasteOpen=false;autoLinkAfterSave=true;render();
      ERPShell.toast(added+" new packs, "+updated+" updated. Review them, then click Save; SKUs are linked automatically after saving.","success");
      if(off.length)await ERPShell.alert("Landing for these packs differs from Excel by more than ₹1. Please check:\n"+off.join("\n"));
    }
    async function linkPendingSkus(){
      autoLinkAfterSave=false;let c=0;
      for(const x of skus){if(links.has(skuKey(x)))continue;const p=suggestPack(x);if(p){links.set(skuKey(x),p.id);c++}}
      if(c)await saveLinks();
    }

    /* ---------- save ---------- */
    async function save(){
      if(busy||!isDirty())return;
      const bad=packs.findIndex(p=>!String(p.pack_name||"").trim());
      if(bad>=0){await ERPShell.alert("Enter a name for pack "+(bad+1)+".");return}
      const names=packs.map(p=>p.pack_name.trim().toUpperCase());
      const dup=names.find((x,i)=>names.indexOf(x)!==i);
      if(dup){await ERPShell.alert("Duplicate pack name: "+dup);return}
      const changed=ratesChanged(),note=el("note").value.trim();
      if(!await ERPShell.confirm("Save rates?\n\n"+(changed?"Rates / schemes changed: a new Rate Ledger entry will be created"+(note?" (\""+note+"\")":"")+".":"Only names / weights / slab sheet changed; no ledger entry will be created.")))return;
      busy=true;showState();
      try{
        if(importedLedger&&importedLedger.length&&!history.length&&me.role==="admin"){
          const {error}=await client.rpc("lwb_import_rate_history",{p_entries:importedLedger});
          if(error)throw error;
        }
        const payload=packs.map((p,i)=>({id:p.id||null,sort_no:i,pack_name:p.pack_name.trim(),case_config:n(p.case_config),gr:n(p.gr),mepd_pct:p.mepd_pct===""?null:n(p.mepd_pct),
          free_bottle:n(p.free_bottle),oms:p.oms===""?null:n(p.oms),qps:n(p.qps),slab3_rate:n(p.slab3_rate),unit_weight:p.unit_weight===""?null:n(p.unit_weight),
          bottle:p.bottle===""?null:n(p.bottle),slab_landing:p.slab_landing===""?null:n(p.slab_landing),slab_margins:p.slab_margins.map(m=>m===""?null:n(m)),active:p.active!==false}));
        const {error}=await client.rpc("lwb_save_rates",{p_settings:settings,p_packs:payload,p_note:note||(changed?"Rate update":null),p_snapshot:changed?snapRows():null});
        if(error)throw error;
        importedLedger=null;el("note").value="";
        await load();
        ERPShell.toast("Rates saved"+(changed?", ledger entry created.":"."),"success");
        if(autoLinkAfterSave)await linkPendingSkus();
      }catch(e){await ERPShell.alert("Save failed: "+(e.message||e))}
      finally{busy=false;showState()}
    }

    /* ---------- one-time import from the old CC PO Maker backup ---------- */
    async function importBackup(file){
      if(!file)return;
      let S;
      try{S=JSON.parse(await file.text());if(!Array.isArray(S.landing))throw 0}catch(e){await ERPShell.alert("This does not look like a CC PO Maker backup file.");return}
      if(!await ERPShell.confirm("Import "+S.landing.length+" packs and MEPD / ROI from the backup?\n\nPacks with the same name are updated and new ones are added. Nothing is written to the database until you click Save."))return;
      if(S.mepd!=null)settings.mepd_pct=n(S.mepd);
      if(S.roi!=null)settings.roi_main=n(S.roi);
      if(S.roi5!=null)settings.roi_landing=n(S.roi5);
      S.landing.forEach((r,i)=>{
        const sl=(S.slab||[])[i]||{};
        const key=String(r.name||"").trim().toUpperCase();if(!key)return;
        let p=packs.find(x=>x.pack_name.trim().toUpperCase()===key);
        if(!p){p={pack_name:String(r.name).trim(),active:true,slab_margins:["","","","",""]};packs.push(p)}
        Object.assign(p,{sort_no:i,case_config:n(r.cs),gr:n(r.gr),mepd_pct:(r.mepd===""||r.mepd==null||r.mepd==="g")?"":n(r.mepd),free_bottle:n(r.fb),oms:(r.oms===""||r.oms==null)?"":n(r.oms),
          qps:n(r.qps),slab3_rate:n(r.s3),unit_weight:numOrBlank(sl.wt),bottle:numOrBlank(sl.bt),slab_landing:numOrBlank(sl.land),slab_margins:[0,1,2,3,4].map(j=>numOrBlank((sl.m||[])[j]))});
      });
      packs.sort((a,b)=>n(a.sort_no)-n(b.sort_no));
      // PO Maker's Party PO SKU list says which landing pack each SKU uses.
      if(Array.isArray(S.poDef))backupLinks=new Map(S.poDef.filter(d=>d&&d.name&&S.landing[d.li]).map(d=>[skuKey(d.name),skuKey(S.landing[d.li].name)]));
      importedLedger=!history.length&&Array.isArray(S.ledger)&&S.ledger.length?S.ledger.map(L=>({dt:L.dt,note:L.note,rows:L.rows||[],settings:{}})):null;
      el("mepd").value=settings.mepd_pct;el("roi").value=settings.roi_main;el("roi5").value=settings.roi_landing;
      if(!el("note").value)el("note").value="Imported from PO Maker";
      render();
      ERPShell.toast(importedLedger?"Backup loaded (including "+importedLedger.length+" past ledger entries). Now click Save.":"Backup loaded. Now click Save.","success");
    }

    (async()=>{
      const u=await start(["admin","manager"]);if(!u)return;
      me={...u,edit:true};
      ERPShell.mount({role:u.realRole||u.role,name:u.name,onLogout:logout,group:"Settings",title:"Rate & Scheme"});
      el("loading").hidden=true;el("page").hidden=false;
      el("save").onclick=save;
      try{await load()}catch(e){}
    })();
  </script>
</body>
</html>
