      if(!list.length){el("body").innerHTML='<div class="pb-empty">No return '+(GPER?"in these dates":"yet")+'. Use ↩ Return above (any party, any SKU) or ↩ Return on a bill.</div>';return}
      el("body").innerHTML=`<div class="pb-scroll"><table class="pb-t resp chg"><thead><tr><th>Return / party</th><th class="hide-ph">Against</th><th class="n">Amount</th><th></th></tr></thead><tbody>${list.map(r=>
        `<tr class="pr"${r.cancelled?' style="opacity:.55"':""}><td><b>${esc(r.return_no)}</b> · ${esc(r.party)}${!fb&&BR().length&&r.company_id?" "+btag(r.company_id):""}<small>${dmy(r.return_date)}${r.by?" · "+esc(r.by):""} · ${esc(it(r))}${r.note?" · "+esc(r.note):""}</small><small class="ph-only">${r.order_no?esc(r.order_no)+(r.invoice_no?" · bill "+esc(r.invoice_no):" · no Tally bill yet"):"Not against a bill"}</small></td>
          <td class="hide-ph">${r.order_no?`<b>${esc(r.order_no)}</b><small>${r.invoice_no?"Bill "+esc(r.invoice_no)+(r.credit_note?" · CN "+esc(r.credit_note):""):"No Tally bill yet"}</small>`:'<span class="tag t-blu">New return</span><small>off the party balance</small>'}</td>
          <td class="n"><b class="${r.cancelled?"":"adv"}">− ${rs(r.amount)}</b>${r.cancelled?'<small><span class="tag t-gry">Cancelled</span></small>':""}</td>
          <td class="n">${r.cancelled?"":`<button type="button" class="pb-btn sm" data-rx="${esc(r.id)}" title="Cancel this return" aria-label="Cancel ${esc(r.return_no)}">×</button>`}</td></tr>`).join("")}</tbody>
        <tfoot><tr><td>${list.filter(r=>!r.cancelled).length} returns</td><td class="hide-ph"></td><td class="n">− ${rs(list.filter(r=>!r.cancelled).reduce((a,r)=>a+Number(r.amount),0))}</td><td></td></tr></tfoot></table></div>`;
      el("body").querySelectorAll("[data-rx]").forEach(b=>b.onclick=async()=>{const r=list.find(x=>x.id===b.dataset.rx);
        if(!await ERPShell.confirm("Cancel return "+r.return_no+" of "+rs(r.amount)+" from "+r.party+"?"+(r.credit_note?"\n\nIts credit note "+r.credit_note+" is cancelled too, so Due goes up again.":"")))return;
        b.disabled=true;const {error}=await client.rpc("lwb_party_return_cancel",{p_id:r.id});if(error){b.disabled=false;return ERPShell.alert(errText(error))}toast(r.return_no+" cancelled");load()});
    }
    /* ---------- GST (Accounts · Tally) ---------- */
    function renderGst(){
      if(!gst){el("body").innerHTML='<div class="pb-empty">Loading GST… (needs lwb_gst_register_setup.sql)</div>';sheet=[];return}
      const rs=v=>LWBPartyPay.rs(Math.round(Number(v)||0)),R=gst.rows||[],q=el("q").value.trim().toLowerCase(),H=LWBAccHub,mn=H.monName;
      const r0=GPER?LWBPeriod.get():null,inMon=m=>!r0||(String(m).slice(0,7)>=r0.from.slice(0,7)&&String(m).slice(0,7)<=r0.to.slice(0,7));
      const list=R.filter(r=>inMon(r.month)).filter(r=>!q||mn(r.month).toLowerCase().includes(q)||String(r.challan||"").toLowerCase().includes(q));
      const net=r=>r2(Number(r.sales_gst)-Number(r.pur_gst));
      const fl=(t,d)=>d?'<span class="fl ok">✓ '+t+" "+dmy(d).slice(0,5)+"</span>":'<span class="fl no">'+t+" not filed</span>";
      sheet=[["Month","Tally bills","Sales ₹","Sales GST (ERP) ₹","Purchase ₹","Purchase GST (ERP) ₹","Net GST (ERP) ₹","GSTR-1 filed","GSTR-3B filed","Tax as per 3B ₹","ITC used ₹","Paid ₹","Paid on","Challan","Status","Note"],
        ...list.map(r=>{const st=H.gstState(r,gst.today);return [mn(r.month),r.sales_bills,r2(r.sales_amount),r2(r.sales_gst),r2(r.pur_amount),r2(r.pur_gst),net(r),r.gstr1_on?dmy(r.gstr1_on):"",r.gstr3b_on?dmy(r.gstr3b_on):"",
          r.tax_3b==null?"":r2(r.tax_3b),r.itc_used==null?"":r2(r.itc_used),r.paid==null?"":r2(r.paid),r.paid_on?dmy(r.paid_on):"",r.challan||"",st.t,r.note||""]})];
      if(!list.length){el("body").innerHTML='<div class="pb-empty">No month found'+(GPER?" in these dates":"")+'.</div>';return}
      const form=r=>{const v=k=>r[k]==null?"":esc(r[k]);return `<tr class="sub"><td colspan="7"><div class="gst-f" data-gm="${esc(r.month)}">
        <div><label>GSTR-1 filed on</label><input type="date" data-k="gstr1_on" value="${v("gstr1_on")}" max="${gst.today}"></div>
        <div><label>GSTR-3B filed on</label><input type="date" data-k="gstr3b_on" value="${v("gstr3b_on")}" max="${gst.today}"></div>
        <div><label>Tax as per 3B ₹</label><input type="text" inputmode="decimal" data-k="tax_3b" value="${v("tax_3b")}" placeholder="ERP ${Math.round(r.sales_gst)}"></div>
        <div><label>ITC used ₹</label><input type="text" inputmode="decimal" data-k="itc_used" value="${v("itc_used")}" placeholder="ERP ${Math.round(r.pur_gst)}"></div>
        <div><label>Paid in cash ₹</label><input type="text" inputmode="decimal" data-k="paid" value="${v("paid")}"></div>
        <div><label>Paid on</label><input type="date" data-k="paid_on" value="${v("paid_on")}" max="${gst.today}"></div>
        <div><label>Challan / CPIN</label><input type="text" data-k="challan" value="${v("challan")}" maxlength="60" data-nocaps></div>
        <div><label>Note</label><input type="text" data-k="note" value="${v("note")}" maxlength="300"></div>
        <div class="calc" data-calc></div>
        <div class="acts w2" style="grid-column:-3 / -1"><button type="button" class="pb-btn sm" data-gx>Cancel</button><button type="button" class="pb-btn sm grn" data-gs>Save</button></div></div></td></tr>`};
      el("body").innerHTML=`<div class="pb-scroll"><table class="pb-t resp gst-t"><thead><tr><th>Month</th><th class="n hide-ph">Sales GST</th><th class="n hide-ph">Purchase GST</th><th class="n">Net (ERP)</th><th class="hide-ph">Filed</th><th class="n hide-ph">Paid</th><th class="st">Status</th></tr></thead><tbody>${list.map(r=>{
        const st=H.gstState(r,gst.today),cur=String(gst.today).slice(0,7)===String(r.month).slice(0,7);
        return `<tr class="pr${cur?" cur":""}${gstEdit===r.month?" open":""}" data-gr="${esc(r.month)}"><td><b>${esc(mn(r.month))}</b><small>${r.sales_bills} Tally bill${r.sales_bills===1?"":"s"} · ${rs(r.sales_amount)}${r.no_rate?" · ⚠ "+r.no_rate+" SKU no GST %":""}</small>
            <small class="ph-only"><b class="net">Net ${rs(net(r))}</b> = GST ${rs(r.sales_gst)} − ITC ${rs(r.pur_gst)} · ${r.gstr3b_on?"3B ✓ "+dmy(r.gstr3b_on).slice(0,5):"3B not filed"}${r.paid?" · paid "+rs(r.paid):""}</small></td>
          <td class="n hide-ph">${rs(r.sales_gst)}</td><td class="n hide-ph">${rs(r.pur_gst)}<small>${r.pur_bills} purchase bill${r.pur_bills===1?"":"s"}</small></td>
          <td class="n hide-ph"><b class="net">${rs(net(r))}</b>${r.tax_3b!=null?`<small>3B ${rs(r.tax_3b)}</small>`:""}</td>
          <td class="hide-ph">${fl("GSTR-1",r.gstr1_on)}${fl("GSTR-3B",r.gstr3b_on)}</td>
          <td class="n hide-ph">${r.paid?`<b>${rs(r.paid)}</b><small>${r.paid_on?dmy(r.paid_on):""}${r.challan?" · "+esc(r.challan):""}</small>`:'<span class="fl no">—</span>'}</td>
          <td class="st"><span class="tag ${st.c}">${esc(st.t)}</span></td></tr>`+(gstEdit===r.month?form(r):"")}).join("")}</tbody></table></div>`;
      el("body").querySelectorAll("tr[data-gr]").forEach(t=>t.onclick=()=>{gstEdit=gstEdit===t.dataset.gr?"":t.dataset.gr;renderGst();
        const f=el("body").querySelector(".gst-f");if(f){f.querySelector("input").focus();calcGst(f)}});
      const f=el("body").querySelector(".gst-f");if(!f)return;
      f.addEventListener("input",()=>calcGst(f));calcGst(f);
      f.querySelector("[data-gx]").onclick=()=>{gstEdit="";renderGst()};
      f.querySelector("[data-gs]").onclick=async e=>{
        const p={month:f.dataset.gm};f.querySelectorAll("[data-k]").forEach(i=>{const k=i.dataset.k,v=i.value.trim();p[k]=["tax_3b","itc_used","paid"].includes(k)?(v===""?null:num(v)):(v||null)});
        e.target.disabled=true;const {error}=await client.rpc("lwb_gst_save",{p});e.target.disabled=false;
        if(error)return ERPShell.alert(errText(error));
        toast("GST "+mn(p.month)+" saved");gstEdit="";gst=await LWBAccHub.loadGst(client);render()};
    }
    function calcGst(f){const g=k=>num(f.querySelector('[data-k="'+k+'"]').value),c=f.querySelector("[data-calc]");if(!c)return;
      const left=r2(g("tax_3b")-g("itc_used")-g("paid"));
      c.innerHTML=f.querySelector('[data-k="tax_3b"]').value.trim()?"Tax "+rs(g("tax_3b"))+" − ITC "+rs(g("itc_used"))+" − paid "+rs(g("paid"))+" = "+(left>1?'<b class="due">'+rs(left)+" still to pay</b>":'<b class="adv">nothing to pay ✓</b>'):"Fill Tax as per 3B from the GST portal / Tally; the ERP figures are shown as a guide."}
    function renderChg(){
      const q=el("q").value.trim().toLowerCase(),ST={WAITING:["t-amb","Waiting Admin"],APPROVED:["t-grn","Approved"],SENT_BACK:["t-red","Sent back"]};
      const list=changes.filter(c=>(c.status==="WAITING"||inPer(c.requested_at))&&match(q,c.order_no,c.party,c.by,c.reason,c.note));
      sheet=[["Date","PO","Party","By","Reason","Old ₹","New ₹","Difference ₹","Status","Admin reply"],...list.map(c=>[dmy(String(c.requested_at).slice(0,10)),c.order_no,c.party,c.by||"",c.reason||"",r2(c.old_value),r2(c.new_value),r2(c.diff),(ST[c.status]||[,c.status])[1],c.reply||""])];
      if(!list.length){el("body").innerHTML='<div class="pb-empty">No PO change '+(GPER?"in these dates":"in the last 30 days")+'. Use ⓘ Items / Edit on a bill to change qty, rate or SKU.</div>';return}
      el("body").innerHTML=`<div class="pb-scroll"><table class="pb-t resp chg"><thead><tr><th>PO / party</th><th class="hide-ph">By</th><th class="n hide-ph">Old → New</th><th class="n">Difference</th><th>Status</th><th></th></tr></thead><tbody>${list.map(c=>{const st=ST[c.status]||["t-gry",c.status];
        return `<tr class="pr" data-wv="${esc(c.id)}"><td><b>${esc(c.order_no)}</b> · ${esc(c.party)}<small>${(c.lines||[]).length} line${(c.lines||[]).length===1?"":"s"}${c.reason?" · "+esc(c.reason):""}</small></td>
          <td class="hide-ph">${esc(c.by||"")}<small>${dmy(String(c.requested_at).slice(0,10))}</small></td><td class="n hide-ph">${rs(c.old_value)} → ${rs(c.new_value)}</td>
          <td class="n"><b class="${c.diff>=0?"adv":"due"}">${LWBBillChange.sg(Number(c.diff))}</b></td><td><span class="tag ${st[0]}">${st[1]}</span>${c.reply?`<small>${esc(c.reply)}</small>`:""}</td>
          <td class="n"><button type="button" class="pb-btn sm${admin&&c.status==="WAITING"?" grn":""}" data-wv="${esc(c.id)}">${admin&&c.status==="WAITING"?"Check & approve":"View"}</button></td></tr>`}).join("")}</tbody></table></div>`;
    }

    /* ---------- Party groups ---------- */
    function renderGroups(){
      const q=el("q").value.trim().toLowerCase();
      const by=new Map();for(const g of info.raw.groups||[]){const k=key(g.parent);if(!by.has(k))by.set(k,{parent:g.parent,m:[]});by.get(k).m.push(g.member)}
      const list=[...by.values()].filter(g=>match(q,g.parent,...g.m)).sort((a,b)=>a.parent.localeCompare(b.parent));
      sheet=[["Bill name","Main party"],...list.flatMap(g=>g.m.map(m=>[m,g.parent]))];
      const all=[...new Set([...(info.raw.parties||[]),...orders().map(o=>o.party)])].sort();
      el("body").innerHTML=`<div class="pb-gform"><div><label for="gP">Main party (Party Master)</label><input id="gP" list="gPl" autocomplete="off" placeholder="e.g. SHREE JAGDISH TRADERS"><datalist id="gPl">${all.map(n=>`<option value="${esc(n)}">`).join("")}</datalist></div>
        <div><label for="gM">Bill names under it (one per line or comma)</label><textarea id="gM" placeholder="PRIYA TRADERS, ROHIT TRADERS, AARTI TRADERS"></textarea></div>
        <button type="button" class="pb-btn grn" id="gSave">Save</button></div>
        ${list.length?`<div class="pb-groups">${list.map(g=>`<div class="pb-group"><h4><span>${esc(g.parent)}</span><button type="button" class="lnk" data-addto="${esc(g.parent)}">+ name</button></h4><div class="chips">${g.m.sort().map(m=>`<span class="chip">${esc(m)}<button type="button" data-rm="${esc(m)}" aria-label="Remove ${esc(m)}">×</button></span>`).join("")}</div></div>`).join("")}</div>`:'<div class="pb-empty">No group yet. Choose the main party, type the names its bills are made in, Save.</div>'}`;
      el("gSave").onclick=saveGroup;
      el("body").querySelectorAll("[data-addto]").forEach(b=>b.onclick=()=>{el("gP").value=b.dataset.addto;el("gM").focus()});
      el("body").querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{
        const m=b.dataset.rm;if(!await ERPShell.confirm("Take "+m+" out of its group?\n\nIts bills then count on their own PO party again."))return;
        const {error}=await client.rpc("lwb_party_group_set",{p_member:m,p_parent:null});if(error)return ERPShell.alert(errText(error));toast(m+" removed");load()});
    }
    async function saveGroup(){
      const parent=el("gP").value.trim(),names=[...new Set(el("gM").value.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean))];
      if(!parent)return ERPShell.alert("Choose the main party.");
      if(!names.length)return ERPShell.alert("Type at least one bill name.");
      const moved=names.filter(n=>{const p=info.parentOf(n);return key(p)!==key(n)&&key(p)!==key(parent)});
      if(moved.length&&!await ERPShell.confirm(moved.map(n=>n+" is now under "+info.parentOf(n)).join("\n")+"\n\nMove "+(moved.length>1?"them":"it")+" to "+parent+"?"))return;
      el("gSave").disabled=true;const bad=[];
      for(const n of names){const {error}=await client.rpc("lwb_party_group_set",{p_member:n,p_parent:parent});if(error)bad.push(n+": "+errText(error))}
      el("gSave").disabled=false;
      if(bad.length)await ERPShell.alert(bad.join("\n"));
      if(bad.length<names.length){toast((names.length-bad.length)+" name(s) saved under "+parent);el("gM").value="";await load()}
    }

    el("q").oninput=()=>{const k=el("q").value;render();el("q").value=k};
    el("reload").onclick=load;
    // Accounts header (acc-hub.js): Billing tabs open here, Cash & Bank tabs open accounts-dashboard.html
    el("xl").onclick=()=>LWBExcel.write("billing-"+tab+"-"+info.today,[{name:{make:"Bills to make",made:"Bills made",due:"To collect",led:"Ledger",pay:"Payments",ret:"Returns",grp:"Party groups",chg:"PO changes",gst:"GST",bt:"GST Cash check"}[tab]||"Sheet",rows:sheet.length?sheet:[["Nothing"]]}]).catch(e=>say(e.message,true));

    (async()=>{
      const {data:{session}}=await client.auth.getSession();
      if(!session){location.replace("login.html");return}
      const {data:p}=await client.from("user_profiles").select("full_name,role,active").eq("id",session.user.id).single();
      const realRole=String((p&&p.role)||"").toLowerCase().trim(),role=p?await ERPShell.pageRoleFresh(realRole):realRole;
      if(!p||p.active!==true||!["admin","accounts"].includes(role)){location.replace("dashboard.html");return}
      admin=realRole==="admin";
      ERPShell.mount({role:realRole||role,name:p.full_name||session.user.email,onLogout:async()=>{await client.auth.signOut();location.replace("login.html")}});
      // Accounts header (acc-hub.js): view Tally / Party (Admin also Cashier) from the URL hash; Billing tabs open here,
      // Cash & Bank tabs open accounts-dashboard.html. Party & Collections = Admin, or Accounts when Admin ticked it.
      const mine=h=>ERPShell.menuForMe(realRole).some(g=>g.items.some(i=>i.h===h));
      const qt=new URLSearchParams(location.search).get("tab");
      // old Ledger links (?tab=led, ?party=) open Ledger & Outstanding
      if(qt==="led"||(!qt&&ledParty)){location.replace("accounts-books.html?v=led"+(ledParty?"&party="+encodeURIComponent(ledParty):""));return}
      const hv=LWBAccHub.mount({page:"bill",role:realRole==="admin"?"admin":role,canParty:mine("party-billing.html#party"),acrs:mine("ecrs.html"),
        tab:["make","made","due","led","pay","ret","grp","chg","gst","out","bt"].includes(qt)?qt:ledParty?"led":"",
        onTab:t=>{tab=t;el("q").value="";if(info)render()},
        onAct:a=>{if(!info)return;if(a==="pay")payNow("");else if(a==="ret")newReturn(null,"")}});
      if(hv.away)return;
      tab=hv.tab;
      el("loading").hidden=true;el("page").hidden=false;
      await load();
      // Return button of the cash half: ?tab=ret&new=ret opens the Return form here
      if(info&&new URLSearchParams(location.search).get("new")==="ret"){history.replaceState(null,"",location.pathname+"?tab=ret"+location.hash);newReturn(null,"")}
    })();
  </script>
</body>
</html>
