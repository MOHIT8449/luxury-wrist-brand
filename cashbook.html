<style>
[hidden] { display: none !important }
/* Layout: two screens like a ledger app. Book list, then one book with summary strip, filters, and an entries table. */
:root {
  --bg: #f6f5f1;
  --surface: #ffffff;
  --surface-2: #eef1f9;
  --fg: #172036;
  --muted: #5d6781;
  --line: #dde2ee;
  --brand: #00434d;
  --brand-fg: #ffffff;
  --in: #0d8a52;
  --in-soft: #e3f5ec;
  --out: #d23a3a;
  --out-soft: #fbe9e9;
  --warn: #a15c00; --warn-soft: #fdf0dc;
  --shadow: 0 1px 2px rgba(23,32,54,.06), 0 4px 16px rgba(23,32,54,.06);
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1320; --surface: #171c2c; --surface-2: #1f2538; --fg: #e8ebf5; --muted: #98a1bb; --line: #2b3249;
  --brand: #c9b26a; --brand-fg: #0f1320; --in: #3fcf8e; --in-soft: #13301f; --out: #f27474; --out-soft: #3a1a1d; --warn: #f0b45a; --warn-soft: #3a2a12;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1320; --surface: #171c2c; --surface-2: #1f2538; --fg: #e8ebf5; --muted: #98a1bb; --line: #2b3249;
  --brand: #c9b26a; --brand-fg: #0f1320; --in: #3fcf8e; --in-soft: #13301f; --out: #f27474; --out-soft: #3a1a1d; --warn: #f0b45a; --warn-soft: #3a2a12;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45 }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
/* full screen width at every zoom level (Ctrl + / Ctrl −); only very wide screens get a limit */
.wrap { max-width: 2400px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.topbar .wrap { display: flex; align-items: center; gap: 12px; min-height: 60px }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: -.01em }
.logo-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--brand); color: var(--brand-fg); display: grid; place-items: center; font-weight: 800; font-size: 15px }
.crumb { color: var(--muted); font-weight: 500; display: flex; gap: 8px; align-items: center; min-width: 0 }
.crumb b { color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.spacer { flex: 1 }

main.wrap { padding-block: 24px 120px; display: grid; gap: 20px }
@media (min-width: 900px) { .wrap { padding-left: 28px; padding-right: 28px } }
h1 { font-size: 24px; margin: 0; letter-spacing: -.015em; text-wrap: balance }
.head-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px }
.sub { color: var(--muted); margin: 2px 0 0 }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap }
.btn:hover { background: var(--surface-2) }
.btn.primary { background: var(--brand); color: var(--brand-fg); border-color: var(--brand) }
.btn.primary:hover { filter: brightness(1.07) }
.btn.in { background: var(--in); border-color: var(--in); color: #fff }
.btn.out { background: var(--out); border-color: var(--out); color: #fff }
.btn.ghost { border-color: transparent; background: transparent }
.btn.danger { color: var(--out) }
.btn.sm { padding: 6px 10px; font-size: 13px }
.icon-btn { border: none; background: transparent; border-radius: 6px; padding: 6px; color: var(--muted); line-height: 0 }
.icon-btn:hover { background: var(--surface-2); color: var(--fg) }

/* Books list */
.book-list { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
.book-row { display: grid; grid-template-columns: 40px 1fr auto auto; gap: 14px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); cursor: pointer }
.book-row:last-child { border-bottom: none }
.book-row:hover { background: var(--surface-2) }
.book-ic { width: 40px; height: 40px; border-radius: 10px; background: var(--surface-2); color: var(--brand); display: grid; place-items: center }
.book-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.book-meta { color: var(--muted); font-size: 13px }
.book-bal { text-align: right; font-weight: 600 }
.book-row > div { min-width: 0 }
.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: var(--surface-2); color: var(--muted); margin-left: 6px; vertical-align: 2px }

/* Summary */
.summary { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow) }
.sum { padding: 16px 18px; display: flex; gap: 12px; align-items: center; border-right: 1px solid var(--line); min-width: 0 }
.sum:last-child { border-right: none }
.sum-ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; font-weight: 800; font-size: 18px }
.sum.in .sum-ic { background: var(--in-soft); color: var(--in) }
.sum.out .sum-ic { background: var(--out-soft); color: var(--out) }
.sum.net .sum-ic { background: var(--surface-2); color: var(--brand) }
.sum-label { color: var(--muted); font-size: 13px; font-weight: 500 }
.sum-val { font-size: 20px; font-weight: 600; overflow-wrap: anywhere }

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.field { display: grid; gap: 4px }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .03em }
select, input[type=text], input[type=number], input[type=date], input[type=time], input[type=search] { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0 }
.filters select { padding-right: 6px }
.search { flex: 1 1 220px; min-width: 0 }
.search input { width: 100% }

.actions { display: flex; gap: 10px; flex-wrap: wrap }

/* Entries */
.table-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
.table-scroll { overflow-x: auto }
table { width: 100%; border-collapse: collapse; min-width: 980px }
th { text-align: left; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; padding: 10px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap }
td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top }
tr:last-child td { border-bottom: none }
tbody tr { cursor: pointer }
tbody tr:hover td { background: var(--surface-2) }
th.r, td.r { text-align: right }
.when { white-space: nowrap }
.when small { display: block; color: var(--muted); font-size: 12px }
.remark { max-width: 280px; overflow-wrap: anywhere }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap }
.amt-in { color: var(--in); font-weight: 600 }
.amt-out { color: var(--out); font-weight: 600 }
.count-line { padding: 10px 14px; color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--line) }

/* Phone list for entries */
.cards { display: none }
@media (max-width: 640px) {
  .pw-badge span { display: none }
  .crumb { display: none }
  .summary { grid-template-columns: 1fr }
  .sum { border-right: none; border-bottom: 1px solid var(--line) }
  .sum:last-child { border-bottom: none }
  .table-scroll { display: none }
  .cards { display: block }
  .book-row { grid-template-columns: 40px 1fr auto; }
  .book-row .book-more { display: none }
  .filters .field { flex: 1 1 140px }
  .filters select { width: 100% }
  .head-row .actions { width: 100% }
}
.ecard { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer }
.ecard:last-child { border-bottom: none }
.ecard .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted) }
.ecard .bal { font-size: 12px; color: var(--muted); text-align: right }
.ecard .rm { overflow-wrap: anywhere; min-width: 0 }

.empty { padding: 40px 20px; text-align: center; color: var(--muted) }
.empty b { display: block; color: var(--fg); font-size: 16px; margin-bottom: 4px }

/* Sticky bottom bar for in/out */
.bottom-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px) }
.bottom-bar .wrap { display: flex; gap: 10px; padding-block: 12px }
.bottom-bar .btn { flex: 1; justify-content: center; padding: 12px }

/* Modal */
/* amount boxes: no up/down arrows */
input[type=number] { -moz-appearance: textfield; appearance: textfield }
input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0 }
.cf-ov { z-index: 25 }
.req-ch { font-size: 13px; white-space: nowrap }
.req-ch span { color: var(--muted) }
.lock-note .cf-tbl { margin-top: 6px; color: var(--fg) }
.cf { max-width: 440px }
.cf-tbl { min-width: 0; width: 100%; font-size: 14px }
.cf-tbl td { padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top }
.cf-tbl td:first-child { color: var(--muted); white-space: nowrap }
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(10,14,28,.5); display: grid; place-items: center; padding: 16px }
.modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 480px; max-height: calc(100% - 16px); overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3) }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line) }

.modal-body { padding: 18px; display: grid; gap: 14px }
.modal-body .field input, .modal-body .field select { width: 100% }
.modal-foot { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--line); flex-wrap: wrap }
.modal-foot .spacer { flex: 1 }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 10px; padding: 4px; gap: 4px }
.seg button { border: none; border-radius: 7px; padding: 9px; font-weight: 700; background: transparent; color: var(--muted) }
.seg button[aria-pressed=true].in { background: var(--in); color: #fff }
.seg button[aria-pressed=true].out { background: var(--out); color: #fff }
.amount-input { font-family: var(--font-num); font-size: 22px !important; font-weight: 600 }
.err { color: var(--out); font-size: 13px; min-height: 1em }
.tl-file { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px }
.tl-box { margin-top: 2px }
.tl-in { padding: 12px 16px; display: grid; gap: 10px }

@media (max-width: 640px) { .tl-add { grid-template-columns: 1fr } }
.tl-map { table-layout: fixed }
.tl-map td { vertical-align: middle }
.tl-map tr.tl-need td { background: var(--warn-soft) }
.tl-pick { width: 100% }
.tl-upd-note { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 10px; font-size: 14px }
td.tl-chg { background: var(--warn-soft) }
.led-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.led-top .tl-pickbtn { width: auto; min-width: 240px; flex: 0 1 420px }
#printArea { display: none }

}

.tl-pickbtn span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }

.pk-list { max-height: 50vh; overflow: auto; border: 1px solid var(--line); border-radius: 10px }

      $("#hoNotesChk").innerHTML = cnt.total ? (Math.abs(cnt.total - tot) < 0.005 ? `<span class="diff-ok">Notes ₹${inr.format(cnt.total)} match the lines.</span>` : `<span class="diff-short">Notes counted ₹${inr.format(cnt.total)}, lines total ₹${inr.format(tot)}.</span>`) : "";

      $("#hoRows").querySelectorAll("tr").forEach((tr, i) => { tr.firstElementChild.textContent = i + 1; });

      $("#hoRows").querySelectorAll("[data-sdel]").forEach(btn => btn.onclick = () => { btn.closest("tr").remove(); bindRows(); upd(); });
    };
    const addRow = x => { $("#hoRows").insertAdjacentHTML("beforeend", rowHtml($("#hoRows").children.length + 1, x)); bindRows(); };
    // starts with the people used last time, and the drawer line that stays
    const last = (b.handovers || []).slice(-1)[0];
    const start = last && last.splits && last.splits.length ? last.splits.map(x => ({ name: x.name, stay: x.stay })) : [{ name: "OFFICE DRAWER", stay: true }, { name: "" }];
    start.forEach(addRow);
    $("#hoAdd").onclick = () => { addRow({}); const ins = $("#hoRows").querySelectorAll("[data-sname]"); ins[ins.length - 1].focus(); };
    bindNotes($("#hoNotes"), c => { cnt = c; upd(); });
    $("#hoCountBtn").onclick = () => { $("#hoNotes").hidden = !$("#hoNotes").hidden; };
    upd();

      ev.preventDefault();
      const l = rows().filter(x => x.name || x.amount);
      if (!l.length) { $("#hoErr").textContent = "Add at least one line with a name and amount."; return; }
      if (l.some(x => !x.name)) { $("#hoErr").textContent = "Every line needs a name."; return; }
      if (l.some(x => !x.amount)) { $("#hoErr").textContent = "Enter the amount on every line, or remove the empty line."; return; }
      const tot = r2(l.reduce((a, x) => a + x.amount, 0)), diff = r2(tot - expected), id = uid();
      const home = r2(l.filter(x => !x.stay).reduce((a, x) => a + x.amount, 0));
      const h = { id, ts: Date.now(), date: today(), time: nowTime(), expected, splits: l, notes: cnt.total ? cnt.notes : undefined, counted: tot, home, godown: r2(tot - home), diff, status: diff ? "pending" : "ok", by: whoNow(), remark: $("#hoRemark").value.trim() };
      // the cash handed over comes back the next day, so it stays in the book; only an approved diff changes the balance
      for (const x of l) if (!names.includes(x.name)) names.push(x.name);

      save(); closeModal(); render();
      toast(diff ? `Handover saved. ${diff < 0 ? "Short" : "Extra"} ₹${inr.format(Math.abs(diff))} sent to admin` : "Handover saved. Cash matches");
    };
  }

  function confirmDiff(id, approve) {
    const { b, h } = findHandover(id);
    if (!h || !isAdmin() || h.status !== "pending") return;
    showModal(`
      <div class="modal-head"><h2>${approve ? "Approve" : "Reject"} this cash difference?</h2>${closeX}</div>
      <div class="modal-body">

          <div><span>Cash as per book</span><b class="num">₹${inr.format(h.expected)}</b></div>
          <div><span>Total of lines</span><b class="num">₹${inr.format(h.counted)}</b></div>
          <div><span>Difference</span><b class="num big ${h.diff < 0 ? "diff-short" : "diff-extra"}">${h.diff < 0 ? "Short" : "Extra"} ₹${inr.format(Math.abs(h.diff))}</b></div>
          ${(h.splits || []).map(x => `<div><span>${esc(x.name)}${x.stay ? " (stays)" : ""}</span><span class="num">₹${inr.format(x.amount)}</span></div>`).join("")}
          ${notesText(h.notes) ? `<div class="hint" style="display:block">Notes: ${esc(notesText(h.notes))}</div>` : ""}
        </div>
        <p class="hint" style="margin:0">${approve ? `Yes adds a ${h.diff < 0 ? "Cash Out" : "Cash In"} of ₹${inr.format(Math.abs(h.diff))} in category Cash Diff, so the book cash becomes the counted cash.` : "Reject keeps the book as it is. Count again and make a new handover if needed."}</p>
      </div>
      <div class="modal-foot"><div class="spacer"></div><button class="btn" type="button" id="vNo">No</button><button class="btn ${approve ? "in" : "out"}" type="button" id="vYes">${approve ? "Yes, approve" : "Yes, reject"}</button></div>`);

  function daysOld(iso) {
    if (!iso) return 0;
    const [y, m, d] = iso.split("-").map(Number), [ty, tm, td] = today().split("-").map(Number);
    return Math.max(0, Math.round((Date.UTC(ty, tm - 1, td) - Date.UTC(y, m - 1, d)) / 864e5));
  }
  function ageCls(n) { return n > 60 ? "a4" : n > 2 ? "a3" : "a1"; }
  function ageChip(n) { return `<span class="age ${ageCls(n)}">${n} ${n === 1 ? "day" : "days"}</span>`; }
  const AGE_KEY = `<div class="age-key">Days: ${ageChip(0).replace("0 days", "0–2 on time")} ${ageChip(3).replace("3 days", "3–60 late")} ${ageChip(61).replace("61 days", "60+")}</div>`;

  function outstandingDashboard() {
    const groups = new Map();
    for (const bl of bills().values()) if (bl.due > 0) {
      const n = daysOld(bl.invDate || bl.date);
      const g = groups.get(bl.party) || { p: bl.party, t: 0, c: 0, max: 0, oldest: "" };
      g.t = r2(g.t + bl.due); g.c++;
      if (n >= g.max) { g.max = n; g.oldest = bl; }
      groups.set(bl.party, g);
    }
    const list = [...groups.values()].sort((a, b) => b.max - a.max || b.t - a.t);
    const tot = r2(list.reduce((a, g) => a + g.t, 0));
    return `<section class="dash od" aria-label="Outstanding all parties">
      <div class="dash-head"><span>Outstanding · all parties · ${list.length}</span><span class="spacer"></span><span class="num">₹${inr.format(tot)}</span></div>

  // admin dashboard: what waits for verify, split by reason
  const VTABS = [["all", "All"], ["bank", "Bank / UPI"], ["dep", "Bank deposit"], ["old", "Old date bill"], ["list", "Party / Category / Mode"], ["mismatch", "Entry mismatch"], ["wrong", "Wrong data"], ["diff", "Cash diff"], ["req", "Change request"]];
  const inVtab = (x, t) => t === "all" ? true : t === "bank" ? !x.verified && isNonCash(x) : t === "dep" ? !x.verified && isDeposit(x) : t === "old" ? !x.verified && isOldDate(x) : t === "mismatch" || t === "wrong" ? flagOpen(x) && x.flag.type === t : false;
  function verifyDashboard() {

    const entriesTable = list.length ? `<div class="rscroll"><table><thead><tr><th>Date</th><th>Book</th><th>Party</th><th>Reason</th><th class="r">Cash In</th><th class="r">Cash Out</th><th></th></tr></thead><tbody>

        <td>${x.req.type === "delete" ? `<span class="chip vchip wait">Delete entry</span>` : reqChanges(x, x.req.data).map(([l, a, c]) => `<div class="req-ch"><span>${esc(l)}:</span> ${esc(a)} → <b>${esc(c)}</b></div>`).join("")}</td>
        <td class="r" style="white-space:nowrap"><button type="button" class="btn sm vbtn" data-reqok="${x.id}">Approve</button> <button type="button" class="btn sm danger" data-reqno="${x.id}">Reject</button></td></tr>`).join("")}</tbody></table></div>` : "";
    const listTable = reqTable + ((tab === "list" || tab === "all") ? listVerifyTable() : "") + ((tab === "diff" || tab === "all") && hp.length ? `<div class="lv-title">Cash diff at handover · ${hp.length}</div>
      <div class="rscroll"><table><thead><tr><th>Date</th><th>Book</th><th class="r">Total balance</th><th class="r">Total of lines</th><th class="r">Difference</th><th>By</th><th></th></tr></thead><tbody>
      ${hp.map(h => `<tr><td class="when">${fmtDate(h.date)}<small>${fmtTime(h.time)}</small></td><td>${esc(h.bookName)}${splitText(h) ? `<small style="display:block;color:var(--muted)">${esc(splitText(h))}</small>` : ""}</td><td class="r num">${inr.format(h.expected)}</td><td class="r num">${inr.format(h.counted)}</td>

  function openBook(id) {

  function goHome() {

  /* ---------- Book screen ---------- */
  function inRange(d) { return rangeOk(d, ui.duration, ui.from, ui.to); }
  function rangeOk(d, dur, from, to) {
    const t = today();
    switch (dur) {
      case "today": return d === t;
      case "yesterday": return d === daysAgo(1);
      case "7": return d >= daysAgo(6) && d <= t;
      case "30": return d >= daysAgo(29) && d <= t;
      case "month": return d.slice(0, 7) === t.slice(0, 7);
      case "lastmonth": { const x = new Date(); x.setDate(1); x.setMonth(x.getMonth() - 1); return d.slice(0, 7) === ymd(x).slice(0, 7); }
      case "custom": return (!from || d >= from) && (!to || d <= to);
      case "day": return d === from;
      default: return true;
    }
  }

  // amount in words, Indian style (lakh, crore): 1000000 -> Ten Lakh Rupees Only
  function inWords(n) {
    n = Math.round((Number(n) || 0) * 100) / 100;
    if (!(n > 0)) return "";
    const ones = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
    const tens = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];
    const two = x => x < 20 ? ones[x] : tens[Math.floor(x / 10)] + (x % 10 ? " " + ones[x % 10] : "");
    const three = x => (x >= 100 ? ones[Math.floor(x / 100)] + " Hundred" + (x % 100 ? " " : "") : "") + (x % 100 ? two(x % 100) : "");
    const words = r => {
      if (r === 0) return "";
      const parts = [];
      const crore = Math.floor(r / 1e7); r %= 1e7;
      if (crore) parts.push((crore >= 100 ? words(crore) : two(crore)) + " Crore");
      const lakh = Math.floor(r / 1e5); r %= 1e5;
      if (lakh) parts.push(two(lakh) + " Lakh");
      const th = Math.floor(r / 1000); r %= 1000;
      if (th) parts.push(two(th) + " Thousand");
      if (r) parts.push(three(r));
      return parts.join(" ");
    };
    const rs = Math.floor(n), ps = Math.round((n - rs) * 100);
    return (rs ? words(rs) + " Rupees" : "") + (ps ? (rs ? " and " : "") + two(ps) + " Paise" : "") + " Only";
  }
  const DMG_TYPES = ["Damage", "Leakage", "Breakage", "Gasless"];
  const r2 = n => Math.round(n * 100) / 100;
  const billKey = x => x.party + "|" + String(x.invoice).trim().toLowerCase();
  // a bill = every Cash In with the same party and invoice no.; due = invoice - deductions - discount - received. Locked books are left out.
  function bills(excludeId) {
    const map = new Map();
    const feed = [...tallyFeed().map(x => ({ ...x, type: "in", amount: 0 }))];
    for (const b of state.books) if (!isLocked(b)) feed.push(...b.entries);
    {
      for (const x of feed) {
        if (x.type !== "in" || !x.party || !x.invoice || x.id === excludeId) continue;
        const k = billKey(x);
        let bl = map.get(k);
        if (!bl) map.set(k, bl = { key: k, party: x.party, invoice: x.invoice, date: x.date, invDate: "", invAmt: 0, damage: 0, kasar: 0, advUsed: 0, recd: 0, time: x.time || "" });
        if (x.date < bl.date) { bl.date = x.date; bl.time = x.time || ""; }
        if (x.invDate && (!bl.invDate || x.invDate < bl.invDate)) bl.invDate = x.invDate;
        bl.invAmt += x.invAmt || 0; bl.damage += x.damage || 0; bl.kasar += x.kasar || 0; bl.advUsed += x.advUsed || 0; bl.recd += x.amount || 0;
      }
    }
    for (const bl of map.values()) bl.due = r2(bl.invAmt - bl.damage - bl.kasar - bl.advUsed - bl.recd);
    return map;
  }
  // advance per party = advance payments + extra paid on bills - advance already adjusted in bills
  function advances(excludeId) {
    const map = new Map();
    const get = p => { if (!map.has(p)) map.set(p, { party: p, recd: 0, used: 0, bal: 0 }); return map.get(p); };
    for (const b of state.books) {
      if (isLocked(b)) continue;
      for (const x of b.entries) {
        if (x.type !== "in" || !x.party || x.id === excludeId) continue;
        if (x.advance) get(x.party).recd += x.amount || 0;
        if (x.advUsed) get(x.party).used += x.advUsed;
      }
    }
    for (const bl of bills(excludeId).values()) if (bl.due < 0) get(bl.party).recd += -bl.due;
    for (const a of map.values()) { a.recd = r2(a.recd); a.used = r2(a.used); a.bal = r2(a.recd - a.used); }
    return map;
  }
  const invCell = (x, bm) => {
    if (x.advance) return `<span class="chip">Advance</span>`;

    if (x.advUsed) parts.push("Advance " + inr.format(x.advUsed));

  /* ---------- Modals ---------- */
  function closeModal() { $("#modalRoot").innerHTML = ""; document.removeEventListener("keydown", escClose); }
  function escClose(ev) { if (ev.key === "Escape") closeModal(); }
  function showModal(html) {
    $("#modalRoot").innerHTML = `<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
    $("#ov").onclick = ev => { if (ev.target.id === "ov") closeModal(); };
    document.addEventListener("keydown", escClose);
    const c = $("[data-close]"); if (c) c.onclick = closeModal;
  }
  // every change asks first: Yes, confirm / Cancel (Enter = yes, Esc = cancel); it opens above any open window
  // the mouse wheel or arrow keys must never change an amount by mistake
  document.addEventListener("wheel", ev => { const t = ev.target; if (t && t.type === "number" && t === document.activeElement) t.blur(); }, { passive: true });
  document.addEventListener("keydown", ev => { const t = ev.target; if (t && t.type === "number" && (ev.key === "ArrowUp" || ev.key === "ArrowDown")) ev.preventDefault(); });
  function confirmPop(o, onYes) {
    let r = $("#confirmRoot");
    if (!r) { r = document.createElement("div"); r.id = "confirmRoot"; document.body.appendChild(r); }
    const back = document.activeElement;
    r.innerHTML = `<div class="overlay cf-ov"><div class="modal cf" role="alertdialog" aria-modal="true" aria-labelledby="cfT">
      <div class="modal-head"><h2 id="cfT">${esc(o.title)}</h2></div>
      <div class="modal-body">${o.html || `<p style="margin:0">${esc(o.msg || "")}</p>`}</div>
      <div class="modal-foot"><div class="spacer"></div><button class="btn" type="button" id="cfNo">Cancel</button><button class="btn ${o.danger ? "out" : "primary"}" type="button" id="cfYes">${esc(o.yes || "Yes, confirm")}</button></div></div></div>`;
    const close = () => { r.innerHTML = ""; document.removeEventListener("keydown", key, true); };
    const no = () => { close(); if (back && back.isConnected) back.focus(); };
    const yes = () => { close(); onYes(); };
    const key = ev => {
      if (ev.key === "Escape") { ev.preventDefault(); ev.stopPropagation(); no(); }
      else if (ev.key === "Enter" && document.activeElement.id !== "cfNo") { ev.preventDefault(); ev.stopPropagation(); yes(); }
    };
    document.addEventListener("keydown", key, true);
    $("#cfNo").onclick = no; $("#cfYes").onclick = yes;
    r.querySelector(".cf-ov").onclick = ev => { if (ev.target.classList.contains("cf-ov")) no(); };
    $("#cfYes").focus();
  }
  const cfList = rows => `<table class="cf-tbl"><tbody>${rows.map(([k, a, b]) => `<tr><td>${esc(k)}</td><td>${esc(a)}</td><td aria-hidden="true">→</td><td><b>${esc(b)}</b></td></tr>`).join("")}</tbody></table>`;
  const closeX = '<button class="icon-btn" data-close type="button" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';

  function unlockModal(book, then) {
    showModal(`
      <div class="modal-head"><h2>${lockIcon} Enter password</h2>${closeX}</div>
      <form id="uf">
        <div class="modal-body">
          <p class="hint" style="margin:0">“${esc(book.name)}” is password protected.</p>
          <div class="field"><label for="uPw">Password</label><input type="password" id="uPw" autocomplete="current-password"></div>
          <div class="err" id="uErr"></div>
        </div>

      </form>`);
    $("#uPw").focus();
    $("#uCancel").onclick = closeModal;
    $("#uf").onsubmit = async ev => {
      ev.preventDefault();
      const pw = $("#uPw").value;
      if (pw && await hashPw(book.id, pw) === book.lock) { unlocked.add(book.id); closeModal(); then(); }
      else { $("#uErr").textContent = "Wrong password. Try again."; $("#uPw").select(); }
    };
  }

  function passwordModal(book) {
    const has = !!book.lock;
    showModal(`
      <div class="modal-head"><h2>${has ? "Change password" : "Set password"}</h2>${closeX}</div>
      <form id="pf">
        <div class="modal-body">
          <p class="hint" style="margin:0">Anyone opening “${esc(book.name)}” must enter this password. There is no way to recover a forgotten password, so keep it safe.</p>
          ${has ? `<div class="field"><label for="pOld">Current password</label><input type="password" id="pOld" autocomplete="current-password"></div>` : ""}
          <div class="field"><label for="pNew">New password</label><input type="password" id="pNew" autocomplete="new-password" placeholder="At least 4 characters"></div>
          <div class="field"><label for="pNew2">Confirm new password</label><input type="password" id="pNew2" autocomplete="new-password"></div>
          <div class="err" id="pErr"></div>
        </div>
        <div class="modal-foot">
          ${has ? `<button class="btn danger" type="button" id="pRemove">Remove password</button>` : ""}
          <div class="spacer"></div>
          <button class="btn primary" type="submit">Save password</button>
        </div>
      </form>`);
    (has ? $("#pOld") : $("#pNew")).focus();
    const checkOld = async () => {
      if (!has) return true;
      if (await hashPw(book.id, $("#pOld").value) === book.lock) return true;
      $("#pErr").textContent = "Current password is wrong."; $("#pOld").select(); return false;
    };
    $("#pf").onsubmit = async ev => {
      ev.preventDefault();
      const a = $("#pNew").value, c = $("#pNew2").value;
      if (!(await checkOld())) return;
      if (a.length < 4) { $("#pErr").textContent = "Use at least 4 characters."; return; }
      if (a !== c) { $("#pErr").textContent = "The two new passwords do not match."; return; }
      const h = await hashPw(book.id, a);
      confirmPop({ title: has ? "Change this book's password?" : "Lock this book with a password?", msg: "There is no way to recover a forgotten password.", yes: has ? "Yes, change" : "Yes, lock" }, () => {
      book.lock = h; unlocked.add(book.id); save();
      closeModal(); render(); toast(has ? "Password changed" : "Password set. Book is now locked");
      });
    };
    const rm = $("#pRemove");
    if (rm) rm.onclick = async () => {
      if (!(await checkOld())) return;
      confirmPop({ title: "Remove this book's password?", msg: "Anyone with the app password can then open this book.", yes: "Yes, remove", danger: true }, () => { delete book.lock; unlocked.delete(book.id); save(); closeModal(); render(); toast("Password removed"); });
    };
  }

  function addParty(name, side) {
    const n = name.replace(/\s+/g, " ").trim().toUpperCase();

    return p;
  }

  function bindMulti() {

  function renderReports() {
    $("#crumb").innerHTML = `<span>/</span><b>Reports</b>`;
    $("#bottomBar").hidden = true;
    const q = (ui.rq || "").trim().toLowerCase();
    const partyOk = id => !q || (partyById(id) && partyMatches(partyById(id), q));
    // general search: party name or code, invoice no., amount, book, type
    const anyOk = (x, ...more) => hit(x, q, ...more);
    const pl = id => esc(partyLabel(id) || "No party");
    const pcls = isFull() ? "" : " code";
    const rows = [];

    let body = "";

      const groups = new Map();

      const sorted = [...groups.entries()].map(([p, l]) => ({ p, l: l.sort((a, b) => a.date.localeCompare(b.date)), t: r2(l.reduce((a, x) => a + x.due, 0)) })).sort((a, b) => b.t - a.t);

          <td class="r num">${inr.format(r2(bl.damage + bl.kasar))}</td><td class="r num">${inr.format(r2(bl.advUsed))}</td><td class="r num">${inr.format(r2(bl.recd))}</td><td>${ageChip(daysOld(bl.invDate || bl.date))}</td><td class="r num due">${inr.format(bl.due)}</td></tr>`).join("")).join("")}

    } else if (ui.rtab === "ledger") {

      if (ui.rparty !== "__all" && (!ui.rparty || !used.some(p => p.id === ui.rparty))) ui.rparty = used[0] ? used[0].id : "";

        const D = r2(all.reduce((a, x) => a + x.d, 0)), C = r2(all.reduce((a, x) => a + x.c, 0)), R = r2(all.reduce((a, x) => a + x.run, 0));

  /* ---------- Backup and restore (password 1 only) ---------- */
  // the backup file is locked (AES-GCM) with password 1, so a copied file is unreadable without it
  const b64 = buf => { let x = ""; new Uint8Array(buf).forEach(c => x += String.fromCharCode(c)); return btoa(x); };
  const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
  async function backupKey(pw, salt) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 200000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  }
  async function makeBackup(pw) {
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const data = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await backupKey(pw, salt), new TextEncoder().encode(JSON.stringify(state)));
    return JSON.stringify({ app: "cashbook-backup", v: 1, salt: b64(salt), iv: b64(iv), data: b64(data) });
  }
  async function readBackup(text, pw) {
    const f = JSON.parse(text);
    if (f.app !== "cashbook-backup") throw new Error("not a backup");
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(f.iv) }, await backupKey(pw, unb64(f.salt)), unb64(f.data));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  async function saveFile(name, text) {
    // inside claude.ai: the viewer's save prompt; offline in Chrome/Edge: choose the folder (e.g. the hidden drive); else a normal download
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (dl) {
      try { await dl.save({ filename: name, data: text }); return; }
      catch (e) { const err = new Error(e && e.message); err.name = e && e.code === "declined" ? "AbortError" : "SaveError"; throw err; }
    }
    if (window.showSaveFilePicker) {
      const h = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: "Cashbook backup", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(text); await w.close(); return;
    }
    const url = URL.createObjectURL(new Blob([text], { type: "application/octet-stream" }));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

    };
  }

      const a = $("#ap1").value, b = $("#ap2").value;

  }

  /* ---------- Calendar picker: shows the year as 2006, keeps the real date in data-real ---------- */
  const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const dateOf = (input, baseYear) => {
    const r = input.dataset.real, v = input.value.trim();
    return r && fmtDate(r) === v ? r : parseShown(v, baseYear);
  };
  function attachCal(input) {
    const wrap = input.parentElement; wrap.style.position = "relative";
    let pop = null;
    const close = () => { if (pop) { pop.remove(); pop = null; document.removeEventListener("mousedown", outside, true); } };
    const outside = ev => { if (pop && !pop.contains(ev.target) && ev.target !== input) close(); };
    const pick = iso => {
      input.value = fmtDate(iso); input.dataset.real = iso; input.setCustomValidity("");
      input.dispatchEvent(new Event("input", { bubbles: true })); input.dispatchEvent(new Event("change", { bubbles: true }));
      close();
    };
    const draw = (y, m) => {
      const start = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
      const sel = dateOf(input, 0), t = today();
      let cells = "S M T W T F S".split(" ").map(d => `<span class="cal-dow">${d}</span>`).join("") + "<span></span>".repeat(start);
      for (let d = 1; d <= days; d++) { const iso = ymd(new Date(y, m, d)); cells += `<button type="button" data-d="${iso}" class="${iso === sel ? "sel" : ""}${iso === t ? " today" : ""}">${d}</button>`; }
      pop.innerHTML = `<div class="cal-head"><button type="button" data-nav="-1" aria-label="Previous month">‹</button><b>${MONTHS[m]} ${SHOWN_YEAR}</b><button type="button" data-nav="1" aria-label="Next month">›</button></div>
        <div class="cal-grid">${cells}</div><div class="cal-foot"><button type="button" data-today>Today</button><button type="button" data-close>Close</button></div>`;
      pop.querySelectorAll("[data-d]").forEach(b => b.onclick = () => pick(b.dataset.d));
      pop.querySelectorAll("[data-nav]").forEach(b => b.onclick = () => { const d = new Date(y, m + Number(b.dataset.nav), 1); draw(d.getFullYear(), d.getMonth()); });
      pop.querySelector("[data-today]").onclick = () => pick(today());
      pop.querySelector("[data-close]").onclick = close;
    };
    const open = () => {
      if (pop || input.readOnly || input.disabled) return;
      pop = document.createElement("div"); pop.className = "cal";
      wrap.appendChild(pop);
      const r = dateOf(input, 0) || today();
      draw(Number(r.slice(0, 4)), Number(r.slice(5, 7)) - 1);
      // keep the calendar inside the dialog (or screen) when the field is on the right
      const box = (input.closest(".modal") || document.body).getBoundingClientRect();
      if (pop.getBoundingClientRect().right > Math.min(box.right, window.innerWidth) - 8) { pop.style.left = "auto"; pop.style.right = "0"; }
      document.addEventListener("mousedown", outside, true);
    };
    input.addEventListener("click", open);
    input.addEventListener("keydown", ev => {
      if (ev.key === "Escape" && pop) { ev.stopPropagation(); close(); }
      else if (ev.key === "Tab") close();
      else if (ev.key === "ArrowDown" && !pop) { ev.preventDefault(); open(); }
    });
  }

  // an invoice no. can be used for only one bill; later payments go through Pending bills
  function findInvoice(no, excludeId) {
    const k = String(no || "").trim().toLowerCase();
    if (!k) return null;
    for (const b of state.books) for (const x of b.entries)
      if (x.id !== excludeId && !x.follow && x.invoice && x.invoice.trim().toLowerCase() === k) return { x, book: b };
    const tb = ((state.tally || {}).bills || []).find(x => x.vno.trim().toLowerCase() === k);
    if (tb) return { x: { invoice: tb.vno, party: tb.party, date: tb.date, invDate: tb.date }, book: { name: "Tally import" }, tally: true };
    return null;
  }

            <div class="field"><label for="eCat">Category</label><select id="eCat">${opts(catList(cur), e.category, "None")}</select></div>

          </div>
          <div class="field" id="eBankWrap" hidden><label for="eBankSel">Bank</label>
            <select id="eBankSel"></select>
            <div id="eBankNewWrap" style="display:flex;gap:8px;margin-top:6px" hidden><input type="text" id="eBankNew" maxlength="80" placeholder="e.g. HDFC BANK (RING ROAD)" style="flex:1;text-transform:uppercase"><button class="btn sm" type="button" id="eBankNewOk">Add bank</button></div></div>

          <div class="err" id="eErr"></div>
          ${entry && isAdmin() ? `<div id="eDelZone"><button class="btn danger sm" type="button" id="eDel">Delete entry</button></div>` : entry && !entry.req ? `<div id="eDelZone"><button class="btn danger sm" type="button" id="eReqDel">Request delete</button></div>` : ""}
        </div>

          <div class="spacer"></div>

    const ehi = $("#eHist"); if (ehi) ehi.onclick = () => historyPop(entry);
    if (!entry && e.date !== today()) $("#ef .modal-body").insertAdjacentHTML("afterbegin", `<div class="lock-note">Handover is done till ${fmtDate(closedTill(book))}, so this entry goes to ${fmtDate(e.date)}.</div>`);
    // bank deposit: the party box becomes a dropdown of banks
    const bankList = () => state.parties.filter(p => p.bank || /\bbank\b/i.test(p.name)).sort((a, b) => a.name.localeCompare(b.name));
    const fillBanks = () => {
      const l = bankList();
      $("#eBankSel").innerHTML = `<option value="">Select bank…</option>` + l.map(p => `<option value="${p.id}"${p.id === partyId ? " selected" : ""}>${esc(isFull() ? p.name : p.code)}</option>`).join("") + (isFull() ? `<option value="__new">+ Add new bank…</option>` : "");
      if (!l.some(p => p.id === partyId)) $("#eBankSel").value = "";
    };
    const depCheck = () => {
      const dep = cur === "out" && /deposit/i.test($("#eCat").value);
      $("#eDepWrap").hidden = !dep; $("#eBankWrap").hidden = !dep;
      document.querySelector("#ef .field.combo").hidden = dep;
      if (dep) { fillBanks(); if (!bankList().some(p => p.id === partyId)) { partyId = ""; $("#eParty").value = ""; } }
    };
    $("#eBankSel").onchange = () => {
      const v = $("#eBankSel").value;
      if (v === "__new") { $("#eBankSel").value = partyId && bankList().some(p => p.id === partyId) ? partyId : ""; $("#eBankNewWrap").hidden = false; $("#eBankNew").focus(); return; }
      partyId = v; $("#eParty").value = partyLabel(v);
    };
    $("#eBankNewOk").onclick = () => {
      const n = $("#eBankNew").value.trim(); if (!n) return;
      const ex = state.parties.find(p => p.name.toLowerCase() === n.toLowerCase());
      const p = ex || addParty(n, "out"); p.bank = true; save();
      partyId = p.id; $("#eParty").value = partyLabel(p.id); $("#eBankNewWrap").hidden = true; fillBanks(); toast("Bank added");
    };
    $("#eBankNew").onkeydown = ev => { if (ev.key === "Enter") { ev.preventDefault(); $("#eBankNewOk").click(); } };
    $("#eCat").addEventListener("change", depCheck);
    const setType = t => {
      cur = t; document.querySelectorAll(".seg button").forEach(btn => btn.setAttribute("aria-pressed", btn.dataset.t === t));
      // Cash In and Cash Out have their own category, mode and party lists; a new Cash In starts with Sales
      const c = $("#eCat"), m = $("#eMode");
      const keepC = catList(t).includes(c.value) ? c.value : (!entry && t === "in" ? salesCat() : "");
      const keepM = modeList(t).includes(m.value) ? m.value : (modeList(t)[0] || "");
      c.innerHTML = opts(catList(t), keepC, "None"); c.value = keepC;
      m.innerHTML = opts(modeList(t), keepM); m.value = keepM;
      if (partyId && (partyById(partyId) || {}).side !== t && !(entry && entry.party === partyId)) { partyId = ""; $("#eParty").value = ""; }

    document.querySelectorAll(".seg button").forEach(btn => btn.onclick = () => setType(btn.dataset.t));
    attachCal($("#eDate")); attachCal($("#eInvDate")); depCheck();
    $("#eParty").focus();

    // bill: payable = invoice amount (or the pending due) - deduction - kasar; whatever is not received stays outstanding
    const num = id => { const v = parseFloat($(id).value); return v > 0 ? r2(v) : 0; };
    let amtTouched = !!entry, advTouched = !!entry, advAvail = 0, follow = null;
    const refreshAdv = () => {
      const a = partyId && cur === "in" ? advances(entry && entry.id).get(partyId) : null;
      advAvail = a && a.bal > 0 ? a.bal : 0;
      const noBill = !follow && !$("#eInv").value.trim() && !num("#eInvAmt");
      $("#eAdvWrap").hidden = !(cur === "in" && partyId && noBill);
    }; // follow = { key, invoice, due } when paying a pending bill
    if (entry && entry.follow) { const bl = bills(entry.id).get(billKey(entry)); follow = { key: billKey(entry), invoice: entry.invoice, invDate: entry.invDate || "", due: bl ? r2(bl.invAmt - bl.damage - bl.kasar - bl.recd) : 0 }; }
    const recalc = () => {
      $("#eAmtWords").textContent = inWords($("#eAmt").value);
      $("#eInvWords").textContent = inWords($("#eInvAmt").value);
      const isAdv = $("#eAdv").checked && !$("#eAdvWrap").hidden;
      $("#eBill").hidden = isAdv || cur === "out";
      const base = isAdv || cur === "out" ? 0 : follow ? follow.due : num("#eInvAmt"), dmg = num("#eDmg"), ks = num("#eKasar");
      const a = $("#eAmt"), left = $("#eLeft");
      // advance adjust: shown when the party has advance left; filled automatically on a new bill
      $("#eAdvUseWrap").hidden = !(advAvail > 0 || num("#eAdvUse") > 0) || !base;
      $("#eAdvAvail").textContent = advAvail > 0 ? `available ₹${inr.format(advAvail)}` : "";
      if (base && !advTouched) $("#eAdvUse").value = Math.min(advAvail, Math.max(0, r2(base - dmg - ks))) || "";
      if (!base) { $("#eCalc").hidden = true; left.className = "left-note" + (isAdv ? " ok" : ""); left.textContent = isAdv ? "Saved as advance for this party" : ""; return; }
      const adv = $("#eAdvUseWrap").hidden ? 0 : num("#eAdvUse");
      const net = r2(base - dmg - ks - adv);
      if (!amtTouched) a.value = net > 0 ? net : 0; $("#eAmtWords").textContent = inWords(a.value);
      $("#eCalc").hidden = false;
      $("#eCalc").innerHTML = `${follow ? "Due " : ""}${inr.format(base)} − ${inr.format(dmg)} − ${inr.format(ks)}${adv ? ` − <span class="adv-chip">${inr.format(adv)} advance</span>` : ""} = <b>${inr.format(net)}</b>`;
      const rest = r2(net - num("#eAmt"));
      left.className = "left-note " + (rest > 0 ? "warn" : "ok");
      left.textContent = rest > 0 ? `₹${inr.format(rest)} will stay pending (outstanding) for this bill` : rest < 0 ? `₹${inr.format(-rest)} more than the bill, it will be kept as advance` : "Bill fully paid";
    };
    const setFollow = f => {

    const showPending = () => {

      const box = $("#ePending");

    const setCat = v => { const c = $("#eCat"); if (v && ![...c.options].some(o => o.value === v)) { const o = document.createElement("option"); o.textContent = v; c.insertBefore(o, c.lastElementChild); } c.value = v; };
    $("#eAdv").onchange = () => {
      const advCat = ensureCat("in", "Advance");

      save(); recalc();
    };
    $("#eAmt").oninput = () => { amtTouched = true; recalc(); };
    // optional note count (cash deposit, cash payment): the total fills the amount

    bindNotes($("#eNotesBox"), c => { noteCount = c.total ? c.notes : null; if (c.total) { $("#eAmt").value = c.total; amtTouched = true; recalc(); } });
    $("#eCountBtn").onclick = () => { $("#eNotesBox").hidden = !$("#eNotesBox").hidden; if (!$("#eNotesBox").hidden) $("#eNotesBox input").focus(); };
    if (follow) { const keep = $("#eAmt").value; setFollow(follow); $("#eAmt").value = keep; amtTouched = true; recalc(); } else recalc();

    // party picker: search matches the full name or the short code, but in short-code mode only codes are shown
    const pIn = $("#eParty"), pList = $("#ePartyList");
    const showParties = () => {
      const q = pIn.value.trim().toLowerCase();

      const score = p => { const n = p.name.toLowerCase(), c = p.code.toLowerCase(); return n.startsWith(q) || c.startsWith(q) ? 0 : (" " + n).includes(" " + q) ? 1 : 2; };
      const hits = (q ? partiesFor(cur).filter(p => partyMatches(p, q)).sort((a, b) => score(a) - score(b) || a.name.localeCompare(b.name)) : partiesFor(cur)).slice(0, 60);

      pList.innerHTML = hits.map(p => `<button type="button" data-pid="${p.id}"><span${isFull() ? "" : ' class="code"'}>${esc(isFull() ? p.name : p.code)}</span>${isFull() ? `<span class="chip code">${esc(p.code)}</span>` : ""}</button>`).join("")
        + (isFull() && q && !exact ? `<button type="button" data-newparty="1"><span>+ Add “${esc(pIn.value.trim().toUpperCase())}” as new party</span></button>` : "")
        + (!hits.length && !(isFull() && q) ? `<div class="none">No party found</div>` : "");
      pList.hidden = false;

  const isGuess = (name, v) => v && v !== "__skip" && v !== "__new" && !tallyState().map[tNorm(name)] && !erpPartyMap[tNorm(name)] && !state.parties.some(p => p.id === v && tNorm(p.name) === tNorm(name));

  async function tallyLoad(file, kind) {
    let rows;
    try { rows = await readSheet(file); } catch (_) { return { err: "Could not read this file. Save it from Tally as Excel (.xlsx) or CSV and try again." }; }
    rows = rows.filter(r => Array.isArray(r) && r.some(c => String(c).trim() !== ""));
    const need = kind === "sales" ? [/date/, /particular|party|ledger|name|customer/] : [/particular|party|ledger|name/, /closing|balance|debit|credit|amount|dr/];
    let h = findHeader(rows, need);
    if (h < 0) h = 0;
    // Tally puts Debit / Credit on a second heading row under "Closing Balance"
    let skip = 1;
    const sub = rows[h + 1] || [];
    if (sub.some(c => /^(debit|credit|dr|cr)$/i.test(String(c).trim())) && !tDate(sub[0])) skip = 2;
    const hdr = rows[h].map((c, i) => { const a = String(c).trim(), b = skip === 2 ? String(sub[i] ?? "").trim() : ""; return [a, b].filter(Boolean).join(" ") || "Column " + (i + 1); });
    const cols = kind === "sales"
      ? { date: guessCol(hdr, [/^date$/, /date/]), party: guessCol(hdr, [/^particulars?$/, /party/, /particular|ledger|customer|name/]), vno: guessCol(hdr, [/vch\.? ?no|voucher no|^voucher$/, /bill no|invoice no|inv no|ref/]), amt: guessCol(hdr, [/gross total/, /^value$/, /total|amount|debit/]), vtype: guessCol(hdr, [/vch\.? ?type|voucher type/]) }
      : { party: guessCol(hdr, [/^particulars?$/, /party|ledger|name/]), dr: guessCol(hdr, [/closing.*(debit|dr)|^debit$|^dr$/, /debit/]), cr: guessCol(hdr, [/closing.*(credit|cr)|^credit$|^cr$/, /credit/]), amt: guessCol(hdr, [/closing balance/, /closing/, /balance|amount/]) };
    if (kind === "bal" && cols.dr >= 0 && cols.cr >= 0) cols.amt = -1;
    return { file: file.name, rows: rows.slice(h + skip), hdr, cols, kind };
  }
  // Sales Register rows -> bills to import
  function salesPlan(tl) {
    const t = tallyState(), c = tl.cols, out = [], skipped = { party: 0, dup: 0, bad: 0, ob: 0 };
    if (c.date < 0 || c.party < 0 || c.amt < 0) return { list: [], updates: [], names: [], skipped };
    const names = new Map();
    const have = new Set(t.bills.map(b => b.party + "|" + b.vno.toLowerCase() + "|" + b.date));
    tl.rows.forEach((r, i) => {
      const name = String(r[c.party] ?? "").trim(), date = tDate(r[c.date]);
      let amt = tAmt(r[c.amt]);
      if (!name || /^(grand )?total\b/i.test(name)) return;
      if (!date || !amt) { skipped.bad++; return; }
      const vtype = c.vtype >= 0 ? String(r[c.vtype] ?? "").trim() : "";
      if (/credit note|return/i.test(vtype)) amt = -Math.abs(amt);
      const vno = (c.vno >= 0 ? String(r[c.vno] ?? "").trim() : "") || "T" + date.replace(/-/g, "").slice(2) + "-" + (i + 1);
      const n = names.get(name) || { name, count: 0, total: 0 };
      n.count++; n.total = r2(n.total + amt); names.set(name, n);
      out.push({ name, date, vno, amt: r2(amt), vtype });
    });
    const pick = tl.pick || {};
    const list = [], updates = [];
    // same voucher no. in the same financial year = the same Tally bill; a changed party, date or amount waits for admin verify
    const fy = d => { const y = Number(d.slice(0, 4)), m = Number(d.slice(5, 7)); return m >= 4 ? y : y - 1; };
    const byVno = new Map();
    for (const b of t.bills) byVno.set(b.vno.toLowerCase() + "|" + fy(b.date), b);
    const waiting = new Map((t.pending || []).map(u => [u.billId, u]));
    for (const x of out) {
      const p = pick[x.name] !== undefined ? pick[x.name] : tallyMatch(x.name);
      if (!p || p === "__skip") { skipped.party++; continue; }
      const old = byVno.get(x.vno.toLowerCase() + "|" + fy(x.date));
      if (old) {
        if (old.party === p && old.date === x.date && old.amt === x.amt) { skipped.dup++; continue; }
        const w = waiting.get(old.id);
        if (w && w.new.party === p && w.new.date === x.date && w.new.amt === x.amt) { skipped.wait = (skipped.wait || 0) + 1; continue; }
        updates.push({ bill: old, x: { ...x, party: p } });
        continue;
      }
      if (p !== "__new") {
        if (have.has(p + "|" + x.vno.toLowerCase() + "|" + x.date)) { skipped.dup++; continue; }
        const d = findInvoice(x.vno);
        if (d && d.x.party === p && !d.tally) { skipped.dup++; continue; }
        const o = t.ob[p];
        if (o && o.amt && x.date <= o.date) skipped.ob++;

      list.push({ ...x, party: p });
    }
    return { list, updates, names: [...names.values()].sort((a, b) => a.name.localeCompare(b.name)), skipped };
  }
  // Group Summary / ledger list rows -> one closing balance per party (Dr = party owes us)
  function balPlan(tl) {
    const c = tl.cols, names = [];
    if (c.party < 0 || (c.amt < 0 && c.dr < 0 && c.cr < 0)) return names;
    for (const r of tl.rows) {
      const name = String(r[c.party] ?? "").trim();
      if (!name || /^(grand )?total\b/i.test(name)) continue;
      const amt = c.amt >= 0 ? tAmt(r[c.amt]) : r2(Math.abs(tAmt(c.dr >= 0 ? r[c.dr] : 0)) - Math.abs(tAmt(c.cr >= 0 ? r[c.cr] : 0)));
      if (!amt) continue;

  }

    const close = () => { r.innerHTML = ""; document.removeEventListener("keydown", key, true); };
    const key = ev => { if (ev.key === "Escape") { ev.preventDefault(); ev.stopPropagation(); close(); } };
    r.innerHTML = `<div class="overlay cf-ov"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="hpT" style="max-width:860px">
      <div class="modal-head"><h2 id="hpT">History of this entry</h2><button class="icon-btn" id="hpX" type="button" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="modal-body" id="hpBody"><p class="hint">Loading…</p></div></div></div>`;
    document.addEventListener("keydown", key, true);
    $("#hpX").onclick = close;
    r.querySelector(".cf-ov").onclick = ev => { if (ev.target.classList.contains("cf-ov")) close(); };
    CB.history(null, entry.id).then(rows => {
      const b = $("#hpBody"); if (!b) return;
      b.innerHTML = rows.length ? hTable(rows) : `<p class="hint" style="margin:0">No changes kept for this entry yet. History is kept from the day it was set up; entries made before that show from their first change.</p>`;
    }, e => { const b = $("#hpBody"); if (b) b.innerHTML = `<p class="err">Could not load: ${esc(e.message)}</p>`; });
  }

  // Admin: the code word (e.g. 401); without it the Cashbook shows nothing to anyone
  function linkModal() {
    showModal(`
      <div class="modal-head"><h2>Code word</h2>${closeX}</div>
      <form id="lkForm">
        <div class="modal-body">
          <p style="margin:0">${CB.hasLink ? "A code word is on. Type a new one to change it; the old one stops working at once." : "Set a code word and the Cashbook opens only after it is typed, even for Admin."} To open: type the code in the ERP <b>Module Search</b> and press Enter, or type it on the Cashbook page. Each browser asks once and then remembers it.</p>
          <div class="row2">
            <div class="field"><label for="lk1">New code word</label><input type="password" id="lk1" autocomplete="off" maxlength="64" placeholder="e.g. 4017"></div>
            <div class="field"><label for="lk2">Code word again</label><input type="password" id="lk2" autocomplete="off" maxlength="64"></div>
          </div>
          <p class="hint" style="margin:0">3 to 64 letters or numbers. A longer code is safer. Keep it to yourself.</p>
          <div class="err" id="lkErr"></div>
        </div>
        <div class="modal-foot"><div class="spacer"></div><button class="btn" type="button" data-close>Close</button><button class="btn primary" type="submit">Save code word</button></div>
      </form>`);
    $("#lk1").focus();
    $("#lkForm").onsubmit = ev => {
      ev.preventDefault();
      const a = $("#lk1").value.trim(), b = $("#lk2").value.trim();
      if (!/^[A-Za-z0-9_-]{3,64}$/.test(a)) { $("#lkErr").textContent = "Use 3 to 64 letters or numbers (no spaces)."; return; }
      if (a !== b) { $("#lkErr").textContent = "The two code words are not the same."; return; }
      confirmPop({ title: "Save this code word?", msg: CB.hasLink ? "The old code word stops working for everyone." : "After this, the Cashbook opens only with the code word.", yes: "Yes, save" }, async () => {
        try { await CB.newLink(a); closeModal(); render(); toast("Code word saved"); }
        catch (e) { $("#lkErr").textContent = /too short|3 to 64|function/.test(e.message) ? "Run lwb_cashbook_code_setup.sql in Supabase first. (" + e.message + ")" : e.message; }
      });
    };
  }

  // locks itself after 5 minutes without a touch or key; the password is needed again
  let lastUse = Date.now();
  ["pointerdown", "keydown", "touchstart", "wheel"].forEach(t => document.addEventListener(t, () => { lastUse = Date.now(); }, { passive: true, capture: true }));
  setInterval(() => {
    if (session.mode && Date.now() - lastUse > 5 * 60000 && !$("#cbSaveBar")) {
      const n = $("#cfNo"), x = $("#hpX"); if (n) n.click(); if (x) x.click();
      $("#logout").click(); toast("Locked after 5 minutes without use");
    }
  }, 15000);

  function renderTally() {
    if (!isAdmin()) { ui.view = null; return renderView(); }
    const t = tallyState(), tab = ui.ttab || "sales";
    $("#crumb").innerHTML = `<span>/</span><b>Tally import</b>`;
    $("#bottomBar").hidden = true;
    let body = "";
    const fileBox = (id, label, help) => `<div class="tl-file"><div class="field"><label for="${id}">${label}</label><input type="file" id="${id}" accept=".xlsx,.xls,.csv,.ods"></div><p class="hint" style="margin:6px 0 0">${help}</p></div>`;
    const colSel = (tl, key, label, optional) => `<div class="field"><label>${label}</label><select data-col="${key}">${optional ? `<option value="-1">— none —</option>` : ""}${tl.hdr.map((h, i) => `<option value="${i}"${tl.cols[key] === i ? " selected" : ""}>${esc(h)}</option>`).join("")}</select></div>`;
    if (tab === "sales") {
      const tl = ui.tls;
      body = fileBox("tlFile", "Sales Register file", "In Tally open Display More Reports → Account Books → Sales Register, choose the months, then Export (Alt+E) as Excel. Choose that file here.");
      if (tl && tl.err) body += `<p class="err">${esc(tl.err)}</p>`;
      if (tl && !tl.err) {
        const plan = salesPlan(tl), sum = r2(plan.list.reduce((a, x) => a + x.amt, 0));
        const need = plan.names.filter(n => { const v = (tl.pick || {})[n.name] !== undefined ? tl.pick[n.name] : tallyMatch(n.name); return !v; }).length;
        body += `<section class="dash od tl-box"><div class="dash-head"><span>${esc(tl.file)} · ${tl.rows.length} rows</span></div>
          <div class="tl-in"><p class="hint" style="margin:0">Check the columns. They were picked from the file headings.</p>
          <div class="tl-cols">${colSel(tl, "date", "Date")}${colSel(tl, "party", "Party (Particulars)")}${colSel(tl, "vno", "Voucher / invoice no.", true)}${colSel(tl, "amt", "Bill amount (Gross Total)")}${colSel(tl, "vtype", "Voucher type", true)}</div></div></section>
          <section class="dash od tl-box"><div class="dash-head"><span>Party mapping · ${plan.names.length} parties</span><span class="spacer"></span><span id="tlNeed">${needText(need)}</span></div>
          <div class="tl-in"><p class="hint" style="margin:0"><button type="button" class="erp-i" aria-label="Info" title="Info" data-tip="Where the Tally name is different, choose the Cashbook party once. It is remembered for every next import.">i</button></p></div>
          ${mapTable(plan.names, tl.pick || {}, { head: `<th class="r">Bills</th><th class="r">Amount</th>`, cells: n => `<td class="r num">${n.count}</td><td class="r num">${inr.format(n.total)}</td>` })}</section>
          <div class="tl-sum" id="tlSum">${salesSum(plan)}</div>`;
      }
    } else if (tab === "bal") {
      const tl = ui.tlb;
      const asOn = ui.tlDate || today();
      body = `<div class="tl-file"><div class="field" style="max-width:220px"><label for="tlAsOn">Balance as on date</label><input type="text" id="tlAsOn" value="${fmtDate(asOn)}" placeholder="DD/MM/${SHOWN_YEAR}"></div></div>`;
      body += fileBox("tlbFile", "Closing balance file", "In Tally open Group Summary of Sundry Debtors (or any ledger list) with Closing Balance, then Export as Excel. Dr = party has to pay, Cr = advance.");
      if (tl && tl.err) body += `<p class="err">${esc(tl.err)}</p>`;
      if (tl && !tl.err) {
        const names = balPlan(tl), sum = r2(names.reduce((a, x) => a + x.amt, 0));
        body += `<section class="dash od tl-box"><div class="dash-head"><span>${esc(tl.file)} · ${names.length} parties</span><span class="spacer"></span><span class="num">${drcr(sum)}</span></div>
          <div class="tl-in"><div class="tl-cols">${colSel(tl, "party", "Party (Particulars)")}${colSel(tl, "amt", "Closing balance (with Dr/Cr)", true)}${colSel(tl, "dr", "Debit column", true)}${colSel(tl, "cr", "Credit column", true)}</div>
          <p class="hint" style="margin:0"><button type="button" class="erp-i" aria-label="Info" title="Info" data-tip="Use one Closing balance column, or Debit + Credit columns. Choose the Cashbook party where names differ.">i</button></p></div>
          ${mapTable(names, tl.pick || {}, { head: `<th class="r">Closing balance</th>`, cells: n => `<td class="r num">${drcr(n.amt)}</td>` })}</section>
          <div class="tl-sum"><div>Each chosen party’s pending amount will start from this balance on ${fmtDate(asOn)}. Old Tally bills up to that date are not counted again. A party’s old balance is replaced.</div>
            <p class="err" id="tlErr"></p>
            <div class="actions"><button class="btn" id="tlCancel" type="button">Cancel</button><button class="btn primary" id="tlbGo" type="button"${names.length ? "" : " disabled"}>Save balances</button></div></div>`;
      }
      const obs = Object.entries(t.ob).filter(([p, o]) => partyById(p) && o.amt).sort((a, b) => partyById(a[0]).name.localeCompare(partyById(b[0]).name));
      body += `<section class="dash od tl-box"><div class="dash-head"><span>Saved closing balances · ${obs.length}</span></div>
        <div class="tl-in tl-add"><div class="field"><label for="obP">Party</label><input type="text" id="obP" class="tl-pick" list="tlPL" placeholder="Type to search party" autocomplete="off"></div>
          <div class="field"><label>Amount</label><input type="number" id="obA" min="0" step="0.01" placeholder="0.00"></div>
          <div class="field"><label>Dr / Cr</label><select id="obS"><option value="dr">Dr (to receive)</option><option value="cr">Cr (advance)</option></select></div>
          <button class="btn" id="obAdd" type="button">Add / change</button></div>
        ${obs.length ? `<div class="rscroll"><table><thead><tr><th>Party</th><th>As on</th><th class="r">Balance</th><th></th></tr></thead><tbody>${obs.map(([p, o]) => `<tr><td class="party-cell">${esc(partyLabel(p))}</td><td class="when">${fmtDate(o.date)}</td><td class="r num">${drcr(o.amt)}</td><td class="r"><button class="btn sm danger" type="button" data-obdel="${p}">Remove</button></td></tr>`).join("")}</tbody></table></div>` : `<div class="empty"><b>No closing balance yet</b>Import a file above or add one by hand.</div>`}</section>`;
    } else if (tab === "map") {
      const rows = Object.entries(t.map).sort((a, b) => a[0].localeCompare(b[0]));
      body = `<section class="dash od tl-box"><div class="dash-head"><span>Saved party mapping · ${rows.length}</span></div>
        ${rows.length ? `<div class="rscroll"><table><thead><tr><th>Tally party</th><th>Cashbook party</th><th></th></tr></thead><tbody>${rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${partySelect(k, v === "__skip" || partyById(v) ? v : "", "data-remap")}</td><td class="r"><button class="btn sm danger" type="button" data-unmap="${esc(k)}">Remove</button></td></tr>`).join("")}</tbody></table></div>` : `<div class="empty"><b>No mapping yet</b>It is saved when you import a Tally file.</div>`}</section>`;
    } else {
      const bs = t.batches.slice().reverse();
      body = `<section class="dash od tl-box"><div class="dash-head"><span>Imported from Tally · ${t.bills.length} bills</span></div>
        ${bs.length ? `<div class="rscroll"><table><thead><tr><th>When</th><th>File</th><th class="r">Bills</th><th class="r">Amount</th><th></th></tr></thead><tbody>${bs.map(b => { const n = t.bills.filter(x => x.batch === b.id); return `<tr><td class="when">${fmtTs(b.ts)}</td><td>${esc(b.file)}</td><td class="r num">${n.length}</td><td class="r num">${inr.format(r2(n.reduce((a, x) => a + x.amt, 0)))}</td><td class="r">${n.length ? `<button class="btn sm danger" type="button" data-undo="${b.id}">Undo import</button>` : `<span class="hint">removed</span>`}</td></tr>`; }).join("")}</tbody></table></div>` : `<div class="empty"><b>Nothing imported yet</b></div>`}</section>`;
    }
    $("#app").innerHTML = `
      <div class="head-row"><button class="btn ghost sm" id="back" type="button">← All books</button></div>
      <div class="head-row"><div><h1>Tally import</h1><p class="sub"><button type="button" class="erp-i" aria-label="Info" title="Info" data-tip="Sales bills from Tally go into Outstanding and Pending bills. Cash In and Net Balance do not change. Payments are still taken in the cashbook.">i</button></p></div></div>
      ${updBox()}
      <div class="tabs" role="group" aria-label="Tally import">
        <button type="button" data-ttab="sales" aria-pressed="${tab === "sales"}">Sales Register</button>
        <button type="button" data-ttab="bal" aria-pressed="${tab === "bal"}">Closing balance</button>
        <button type="button" data-ttab="map" aria-pressed="${tab === "map"}">Party mapping</button>
        <button type="button" data-ttab="log" aria-pressed="${tab === "log"}">Imported</button>
      </div>
      ${body}${partyList()}`;
    $("#back").onclick = () => { ui.view = null; render(); };
    const updOne = (id, ok) => {
      const u = (t.pending || []).find(w => w.id === id); if (!u) return;
      const bl = t.bills.find(b => b.id === u.billId) || {};
      const ch = [u.old.party !== u.new.party && ["Party", partyLabel(u.old.party), partyLabel(u.new.party)], u.old.date !== u.new.date && ["Date", fmtDate(u.old.date), fmtDate(u.new.date)], u.old.amt !== u.new.amt && ["Amount", inr.format(u.old.amt), inr.format(u.new.amt)]].filter(Boolean);
      confirmPop(ok ? { title: `Update Inv ${bl.vno}?`, html: cfList(ch), yes: "Yes, update" } : { title: `Reject change of Inv ${bl.vno}?`, msg: "The bill stays as it is now.", yes: "Yes, reject", danger: true },
        () => { applyUpd(u, ok); save(); render(); toast(ok ? "Bill updated" : "Change rejected"); });
    };
    document.querySelectorAll("[data-updok]").forEach(b => b.onclick = () => updOne(b.dataset.updok, true));
    document.querySelectorAll("[data-updno]").forEach(b => b.onclick = () => updOne(b.dataset.updno, false));
    const ua = $("#updAll");
    if (ua) ua.onclick = () => {
      const n = t.pending.length;
      confirmPop({ title: `Update all ${n} bills?`, msg: "Every change in the list is applied to its bill.", yes: "Yes, verify all" }, () => { for (const u of t.pending.slice()) applyUpd(u, true); save(); render(); toast(n + " bills updated"); });
    };
    document.querySelectorAll("[data-ttab]").forEach(b => b.onclick = () => { ui.ttab = b.dataset.ttab; render(); });
    const cur = tab === "sales" ? "tls" : "tlb";
    const fi = $("#tlFile") || $("#tlbFile");
    if (fi) fi.onchange = async () => { const f = fi.files[0]; if (!f) return; ui[cur] = await tallyLoad(f, tab === "sales" ? "sales" : "bal"); render(); };
    document.querySelectorAll("[data-col]").forEach(s => s.onchange = () => { ui[cur].cols[s.dataset.col] = Number(s.value); render(); });
    // choosing a party changes only that row and the totals, so the page does not jump and Tab keeps working
    document.querySelectorAll(".tl-map").forEach(tbl => tbl.onclick = ev => {
      const btn = ev.target.closest("[data-pick]");
      if (!btn) return;
      const tl = ui[cur], name = btn.dataset.pick, now = (tl.pick || {})[name] !== undefined ? tl.pick[name] : tallyMatch(name);
      pickerModal(name, now, true, v => {
        (tl.pick = tl.pick || {})[name] = v;
        const tr = btn.closest("tr");
        btn.outerHTML = partySelect(name, v);
        tr.classList.toggle("tl-need", !v);
        const ch = tr.querySelector(".tl-name .chip"); if (ch) ch.remove();
        if (tab === "sales") { const plan = salesPlan(tl); $("#tlNeed").textContent = needText(needCount(tl, plan.names)); $("#tlSum").innerHTML = salesSum(plan); }
        else if ($("#tlNeed")) $("#tlNeed").textContent = needText(needCount(tl, balPlan(tl)));
        tr.querySelector("[data-pick]").focus();
      });
    });
    const sumEl = $("#tlSum");
    if (sumEl) sumEl.onclick = ev => { if (ev.target.closest("#tlGo")) goSales(); else if (ev.target.closest("#tlCancel")) { ui.tls = null; render(); } };
    const cn = !sumEl && $("#tlCancel"); if (cn) cn.onclick = () => { ui[cur] = null; render(); };
    const ao = $("#tlAsOn");
    if (ao) ao.onchange = () => { let d = parseShown(ao.value); if (d && d > today()) d = parseShown(ao.value, new Date().getFullYear() - 1); if (d) ui.tlDate = d; else toast("Enter the date as DD/MM/" + SHOWN_YEAR); render(); };
    const goSales = () => {
      const tl = ui.tls, plan = salesPlan(tl);
      if (plan.list.some(x => !x.party)) { $("#tlErr").textContent = "Choose a party for every row."; return; }
      confirmPop({ title: "Import from Tally?", html: cfList([["File", "", tl.file], ["New bills", "", plan.list.length + " · ₹" + inr.format(r2(plan.list.reduce((a, x) => a + x.amt, 0)))], ...(plan.updates.length ? [["Changes to verify", "", String(plan.updates.length)]] : [])]).replace(/<td aria-hidden="true">→<\/td>/g, "<td></td>"), yes: "Yes, import" }, () => goSalesNow(tl, plan));
    };
    const goSalesNow = (tl, plan) => {
      const ids = applyPicks(plan.names, tl.pick || {});
      const batch = { id: uid(), ts: Date.now(), file: tl.file, kind: "sales" };
      let n = 0;
      for (const x of plan.list) {
        const p = x.party === "__new" ? ids[x.name] : x.party;
        if (!p || p === "__skip" || t.bills.some(b => b.party === p && b.vno.toLowerCase() === x.vno.toLowerCase() && b.date === x.date)) continue;
        t.bills.push({ id: uid(), party: p, tname: x.name, vno: x.vno, date: x.date, amt: x.amt, vtype: x.vtype, batch: batch.id }); n++;
      }
      batch.n = n; t.batches.push(batch);
      t.pending = t.pending || [];
      for (const u of plan.updates) {
        const p = u.x.party === "__new" ? ids[u.x.name] : u.x.party;
        if (!p || p === "__skip") continue;
        t.pending = t.pending.filter(w => w.billId !== u.bill.id);
        t.pending.push({ id: uid(), billId: u.bill.id, ts: Date.now(), file: tl.file, old: { party: u.bill.party, date: u.bill.date, amt: u.bill.amt }, new: { party: p, date: u.x.date, amt: u.x.amt, vtype: u.x.vtype, tname: u.x.name } });
      }
      const nu = plan.updates.length;
      listLog("Tally import", "party", "in", tl.file, n + " bills");
      save(); ui.tls = null; ui.ttab = nu ? "sales" : "log"; render(); window.scrollTo(0, 0); toast(n + " bills imported" + (nu ? ` · ${nu} changes to verify` : ""));
    };
    const bgo = $("#tlbGo");
    if (bgo) bgo.onclick = () => confirmPop({ title: "Save closing balances?", msg: `${balPlan(ui.tlb).length} parties as on ${fmtDate(ui.tlDate || today())}. A party's old balance is replaced.`, yes: "Yes, save" }, () => {
      const tl = ui.tlb, names = balPlan(tl), asOn = ui.tlDate || today();
      const ids = applyPicks(names, tl.pick || {});
      let n = 0;
      const sums = {};
      for (const x of names) { const p = ids[x.name]; if (!p || p === "__skip") continue; sums[p] = r2((sums[p] || 0) + x.amt); }
      for (const [p, amt] of Object.entries(sums)) { t.ob[p] = { amt, date: asOn }; n++; }
      listLog("Tally balance", "party", "in", tl.file, n + " parties");
      save(); ui.tlb = null; render(); toast(n + " closing balances saved");
    });
    const oa = $("#obAdd");
    if (oa) oa.onclick = () => {
      const p = pickValue($("#obP").value), a = Number($("#obA").value);
      if (p && !partyById(p)) return toast("Choose a party from the list");
      if (!p || !(a > 0)) return toast("Choose a party and enter the amount");
      const amt = $("#obS").value === "cr" ? -a : a, old = t.ob[p];
      return confirmPop({ title: "Save closing balance?", html: cfList([[partyLabel(p), old ? drcr(old.amt) : "—", drcr(amt)]]), yes: "Yes, save" }, () => {
      t.ob[p] = { amt, date: ui.tlDate || today() };
      listLog("Closing balance", "party", "in", partyById(p).name, drcr(t.ob[p].amt));
      save(); render(); toast("Balance saved");
      });
    };
    document.querySelectorAll("[data-obdel]").forEach(b => b.onclick = () => confirmPop({ title: "Remove closing balance?", msg: partyLabel(b.dataset.obdel) + " · " + drcr(t.ob[b.dataset.obdel].amt), yes: "Yes, remove", danger: true }, () => { delete t.ob[b.dataset.obdel]; save(); render(); toast("Balance removed"); }));
    // change a saved mapping later: bills already imported under that Tally name move to the new party
    document.querySelectorAll("[data-remap]").forEach(btn => btn.onclick = () => {
      const k = btn.dataset.remap;
      pickerModal(k, t.map[k], false, v => {
        if (v === "__new") return toast("Choose an existing party or Skip");
        if (v === t.map[k]) return;
        const n = v === "__skip" ? 0 : t.bills.filter(x => x.tname && tNorm(x.tname) === k && x.party !== v).length;
        confirmPop({ title: "Change this mapping?", html: cfList([[k, pickText(t.map[k]) || "—", pickText(v)]]) + (n ? `<p class="hint" style="margin:8px 0 0">${n} imported bills move to the new party.</p>` : ""), yes: "Yes, change" }, () => {
        t.map[k] = v;
        let moved = 0;
        if (v !== "__skip") for (const x of t.bills) if (x.tname && tNorm(x.tname) === k && x.party !== v) { x.party = v; moved++; }
        listLog("Tally mapping", "party", "in", k, pickText(v));
        save(); render(); toast(moved ? `Mapping saved · ${moved} bills moved to the new party` : "Mapping saved");
        });
      });
    });
    document.querySelectorAll("[data-unmap]").forEach(b => b.onclick = () => confirmPop({ title: "Remove this mapping?", msg: b.dataset.unmap, yes: "Yes, remove", danger: true }, () => { delete t.map[b.dataset.unmap]; save(); render(); }));
    document.querySelectorAll("[data-undo]").forEach(b => b.onclick = () => {
      const z = b.closest("td");
      z.innerHTML = `<span class="hint">Remove these bills?</span> <button class="btn sm" type="button" data-n>No</button> <button class="btn sm out" type="button" data-y>Yes, remove</button>`;
      z.querySelector("[data-n]").onclick = render;
      z.querySelector("[data-y]").onclick = () => { const id = b.dataset.undo; t.bills = t.bills.filter(x => x.batch !== id); listLog("Tally undo", "party", "in", (t.batches.find(x => x.id === id) || {}).file || "", ""); save(); render(); toast("Import removed"); };
    });
  }

  function render() {
    renderView();
    enhanceTables();
  }
  function renderView() {
    if (!state.auth) return renderSetup();
    if (!session.mode) return renderLogin();
    $("#logout").hidden = false;
    const bd = $("#pwBadge"), lv = session.admin ? "A" : session.level;
    bd.className = "pw-badge l" + lv; bd.hidden = false;
    bd.innerHTML = `<b>${lv}</b>`;
    if (ui.view === "parties" && isFull()) return renderParties();
    if (ui.view === "reports") return renderReports();
    if (ui.view === "tally") return renderTally();
    if (ui.view === "history") return renderHistory();
    ui.bookId ? renderBook() : renderBooks();
  }
  render();

  // Tally bills from Accounts (invoice no. + amount) become pending bills here
  CB.erpBills().then(rows => { erpBillRows = rows; if (session.mode && !CB.isBusy()) render(); }).catch(() => {});
  CB.partyMaps().then(rows => { erpPartyMap = Object.fromEntries(rows.map(r => [tNorm(r.tally_key), r.customer_name])); if (session.mode && !CB.isBusy()) render(); }).catch(() => {});

  // new ERP Party Master parties join the Cash In party list (Mohit, 26 Oct 2026).
  // state.erpParties remembers the names already handled, so a party deleted here is not added again.
  CB.erpParties().then(names => {
    const key = n => String(n).toUpperCase().replace(/[^A-Z0-9]+/g, " ").trim();
    const seen = new Set(state.erpParties || []), have = new Set(state.parties.map(p => key(p.name)));
    const codes = new Set(state.parties.map(p => p.code));
    let added = 0, fresh = 0;
    for (const n of names) {
      const k = key(n);
      if (!k || seen.has(k)) continue;
      seen.add(k); fresh++;
      if (have.has(k)) continue;
      have.add(k);
      const name = n.replace(/\s+/g, " ").trim(), p = { id: uid(), name, code: shortCode(name, codes), side: "in", erp: true };
      codes.add(p.code); state.parties.push(p); added++;
    }
    if (!fresh) return;
    state.erpParties = [...seen];
    save();
    if (added && session.mode && !CB.isBusy()) { render(); toast(added + " new part" + (added > 1 ? "ies" : "y") + " added from the ERP Party Master"); }
  }).catch(() => {});
}
CashbookERP.start(cashbookApp);
</script>
