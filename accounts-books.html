<body>

  <div id="pop" data-cf-off></div>
  <script>
  (function(){
    "use strict";
    const S=LWBSales,{client,el,esc}=S;
    const r2=n=>Math.round((Number(n)||0)*100)/100;
    const rs=v=>(r2(v)<0?"−":"")+"₹"+Math.abs(Math.round(Number(v)||0)).toLocaleString("en-IN");
    const rs2=v=>"₹"+Math.abs(r2(v)).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
    const dmy=d=>d?String(d).slice(8,10)+"/"+String(d).slice(5,7)+"/"+String(d).slice(0,4):"";
    const key=v=>String(v==null?"":v).toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();   // same key as party-pay.js
    const PHONE=()=>matchMedia("(max-width:760px)").matches;
    const SECS=[["out","Outstanding","Outst.","O"],["led","Ledger","Ledger","L"],["rec","Receipts","Receipts","R"],["sum","Party payments","Party pay","P"],["day","Day book","Day book","D"]];
    // Voucher type of every ledger row (Tally names): [name, colour class, short word for the row]
    const VT={OPENING:["Opening","op"],ERP_BILL:["Sales","dr","ERP bill"],TALLY_BILL:["Sales","dr","Tally bill"],OLD_INVOICE:["Sales","dr","Old invoice"],DEBIT_NOTE:["Debit Note","dr"],
      PAYMENT:["Receipt","cr","Payment collection"],OFFICE_PAYMENT:["Receipt","cr","Payment collection"],DRIVER_PAYMENT:["Receipt","cr","Driver money"],PARTY_PAYMENT:["Receipt","cr","Party payment"],
      DRIVER_RETURN:["Return","rt","Driver return"],SALES_RETURN:["Return","rt","Sales return"],PARTY_RETURN:["Return","rt","Goods return"],CREDIT_NOTE:["Credit Note","rt"]};
    const isKasar=x=>/^KASAR\b/i.test(String(x.ref_no||""))||/\bkasar\b/i.test(String(x.note||""));
    const vt=x=>x.entry_kind==="CANCELLED"?["Cancelled","cx",x.cx_label]:isKasar(x)?["Kasar","ks","Kasar"]:VT[x.entry_kind]||[x.entry_kind,"op"];
    const PAYK=new Set(["PAYMENT","OFFICE_PAYMENT","DRIVER_PAYMENT","PARTY_PAYMENT"]);
    const BILLK=new Set(["ERP_BILL","TALLY_BILL","OLD_INVOICE"]);
    const MODE={CASH:"💵 Cash",UPI:"📱 UPI",BANK:"🏦 Bank",RTGS:"🏦 Bank",NEFT:"🏦 Bank",CHEQUE:"🧾 Cheque",ONLINE:"📱 Online"};
    const modeOf=x=>{const m=String(x.ref_no||"").trim().split(/\s+/)[0].toUpperCase();return m.split("+").filter(Boolean)};
    const modeTxt=m=>m.map(k=>(MODE[k]||k).replace(/^\S+\s/,"")).join(" + ");
    const modeChips=m=>m.map(k=>'<span class="ab-mode">'+esc(MODE[k]||k)+'</span>').join("");
    const refOf=x=>String(x.ref_no||"").trim().split(/\s+/).slice(1).join(" ");

    let DUPS=[],me=null,info=null,led=null,byNo=new Map(),fb="",sec="out",outMode="party",outShow="due",outPk="",ledPk="",ledFy=true,shown=300,cur=null,loadedAt=0;
    const CF=LWBCol.create({onChange:()=>draw()});

    /* ---------- data ---------- */
    async function load(){
      el("err").innerHTML="";
      try{
        const dupQ=window.LWBDup&&!VIEW()?LWBDup.pending(client,true):Promise.resolve([]);
        // Sales Head (Mohit, 27 Nov 2026): same page, fed from his read-only call (lwb_sales_outstanding), same numbers as Accounts.
        if(VIEW()){const r=await client.rpc("lwb_sales_outstanding",{p_days:400});if(r.error)throw r.error;const raw=r.data||{};
          info=await LWBPartyPay.load({rpc:n=>Promise.resolve(n==="lwb_party_return_list"?{data:raw.returns||[]}:n==="lwb_party_billing"?{data:raw}:{data:[]})})}
        else info=await LWBPartyPay.load(client);
        DUPS=await dupQ;
        const cxq=VIEW()?Promise.resolve({data:[]}):client.rpc("lwb_ledger_cancelled",{p_days:400});
        const a=await LWBLedgerRows(client);   // all rows (no 1000-row cut)
        if(a.error)throw a.error;
        // Goods returns without a bill are not in the ledger SQL (same as Party & Collections).
        const nr=(info.returns||[]).filter(r=>!r.cancelled&&!r.order_id).map(r=>({entry_date:r.return_date,entry_kind:"PARTY_RETURN",rid:r.id,customer_name:r.parent||r.party,ref_no:r.return_no,order_no:null,
          debit:0,credit:Number(r.amount)||0,note:(r.items||[]).map(i=>i.sku+" "+(i.cases||0)+" CS"+(Number(i.pcs)?" "+i.pcs+" PCS":"")).join(", ")+(r.note?" · "+r.note:""),created_at:r.created_at,company_id:r.company_id}));
        // Tally style: a cancelled entry stays in the ledger with ₹0 (lwb_ledger_cancel)
        let cxr=[];try{const c=await cxq;if(!c.error&&Array.isArray(c.data))cxr=c.data.filter(z=>z.date).map(z=>({entry_date:z.date,entry_kind:"CANCELLED",cx:z,customer_name:z.party,ref_no:z.no||"",order_no:null,debit:0,credit:0,
          note:z.reason||"",created_at:z.at,company_id:z.company_id||null,cx_label:({RECEIPT:"Receipt",TALLY_BILL:"Tally bill",RETURN:"Goods return"}[z.kind]||z.kind)+" "+rs(z.amount)}))}catch(_){}
        led=(a.data||[]).concat(nr,cxr).map((x,i)=>({...x,i,pk:key(info.parentOf(x.customer_name)),debit:Number(x.debit)||0,credit:Number(x.credit)||0,d:String(x.entry_date||"").slice(0,10)}))
          .sort((x,y)=>x.d.localeCompare(y.d)||(x.entry_kind==="OPENING"?-1:y.entry_kind==="OPENING"?1:0)||String(x.created_at||"").localeCompare(String(y.created_at||"")));
        led.forEach((x,i)=>x.i=i);
        byNo=new Map();for(const o of info.raw.orders||[])byNo.set(String(o.order_no),o);
        fb=curBrand();loadedAt=Date.now();

      }catch(e){

        el("err").innerHTML='<div class="ab-err">'+esc(/Admin \/ Accounts|role required/i.test(m)?"Ledger & Outstanding is for Admin, Accounts and Sales Head logins.":m)+"</div>";

    }
    function curBrand(){let v="";try{v=localStorage.getItem("lwbBrand")||""}catch(e){}return (info&&info.companies||[]).some(c=>c.id===v)?v:""}
    const inB=c=>!fb||(c||"")===fb;
    const multi=()=>(info&&info.companies||[]).length>1;
    const btag=id=>{const c=info&&info.brandOf(id);return c?'<span class="ab-btag" style="--bc:'+esc(c.color||"#2362a4")+'"><i></i>'+esc(c.name)+"</span>":""};
    const V=p=>fb?LWBPartyPay.slice(p,fb):p;
    const today=()=>info&&info.today||S.isoDay(new Date());
    const per=()=>{const r=window.LWBPeriod?LWBPeriod.get():{from:today().slice(0,8)+"01",to:today()};return {from:r.from,to:r.to,label:r.label||""}};
    const fyStart=t=>{const y=Number(t.slice(0,4)),m=Number(t.slice(5,7));return (m>=4?y:y-1)+"-04-01"};
    const ledPer=()=>{const p=per();return ledFy?{from:fyStart(today()),to:today(),label:"This FY"}:p};
    const inPer=(d,p)=>{p=p||per();return d>=p.from&&d<=p.to};
    const daysOld=d=>d?Math.max(0,Math.round((Date.parse(today()+"T00:00:00Z")-Date.parse(String(d).slice(0,10)+"T00:00:00Z"))/864e5)):0;
    const dcls=d=>d>90?"ab-d4":d>60?"ab-d3":d>30?"ab-d2":"ab-d1";
    const nameOf=pk=>{const p=info.parties.get(pk);if(p)return p.party;const x=led&&led.find(y=>y.pk===pk);return x?String(x.customer_name).trim():pk};
    const membersOf=pk=>{const p=info.parties.get(pk);return p?(p.members||[]).filter(m=>key(m)!==pk):[]};
    const bal=v=>{v=r2(v);return '<span class="'+(v>0.5?"ab-due":v<-0.5?"ab-adv":"ab-zero")+'">'+rs(Math.abs(v))+'</span><i class="ab-dc">'+(v>0.5?"Dr":v<-0.5?"Cr":"")+"</i>"};
    const balTxt=v=>{v=r2(v);return Math.abs(v)<0.5?"0":(v>0?"":"-")+Math.abs(v)};

    // every party with its bills due (brand of the top bar), ageing buckets
    function outParties(){
      const out=[];
      for(const [pk,p0] of info.parties){const p=V(p0);if(!p)continue;
        const b=[0,0,0,0];let oldest=0;
        for(const o of p.bills||[]){const d=daysOld(o.invoice_date),due=r2(o.due);b[d>90?3:d>60?2:d>30?1:0]+=due;oldest=Math.max(oldest,d)}
        const net=r2(p.net!=null?p.net:p.due+(p.opening||0)-p.advance-(p.ret||0));
        if(Math.abs(net)<0.5&&!(p.bills||[]).length)continue;
        out.push({pk,party:p0.party,members:membersOf(pk),bills:(p.bills||[]).length,due:r2(p.due),opening:r2(p.opening||0),advance:r2(p.advance||0),ret:r2(p.ret||0),net,b,oldest})}
      return out;
    }
    function dueBills(){
      const out=[];
      for(const [pk,p0] of info.parties){const p=V(p0);for(const o of (p&&p.bills)||[])out.push({...o,pk,mainParty:p0.party,days:daysOld(o.invoice_date),got:r2((Number(o.driver)||0)+(Number(o.office)||0)),cn:r2((Number(o.credit_notes)||0)+(Number(o.approved_return)||0)-(Number(o.debit_notes)||0))})}
      return out;
    }
    // one party's ledger in a period: opening (before From) + rows From..To with running balance
    function ledOf(pk,p){
      p=p||ledPer();let open=0;const rows=[];
      for(const x of led)if(x.pk===pk&&inB(x.company_id)){if(x.d<p.from)open+=x.debit-x.credit;else if(x.d<=p.to)rows.push(x)}
      let run=open;const out=rows.map(x=>{run+=x.debit-x.credit;return {...x,bal:r2(run)}});
      return {open:r2(open),rows:out,dr:r2(rows.reduce((a,x)=>a+x.debit,0)),cr:r2(rows.reduce((a,x)=>a+x.credit,0)),close:r2(run)};
    }

    /* ---------- KPIs ---------- */
    function drawKpis(){
      if(!info)return;
      const P=outParties(),B=dueBills(),p=per();

      const R=led.filter(x=>PAYK.has(x.entry_kind)&&inB(x.company_id)&&inPer(x.d,p)),Bl=led.filter(x=>(BILLK.has(x.entry_kind))&&inB(x.company_id)&&inPer(x.d,p));
      const mm={};for(const x of R){const m=modeOf(x)[0]||"OTHER";const k=m==="RTGS"||m==="NEFT"?"BANK":m;mm[k]=(mm[k]||0)+x.credit}
      const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0),pl=(n,w)=>n+" "+(n===1?w:w==="party"?"parties":w+"s");
      const K=[
        ["out:due","#c62828","#c62828","To collect (Outstanding)",rs(sum(coll,x=>x.net)),pl(coll.length,"party")+" · "+pl(B.length,"bill")+" due"],
        ["out:60","#b26b00","#b26b00","Over 60 days",rs(sum(o60,b=>b.due)),pl(o60.length,"bill")+" · "+pl(new Set(o60.map(b=>b.pk)).size,"party")],

        ["rec","#1d5fbf","#13824a","Received · "+(p.label||""),rs(sum(R,x=>x.credit)),Object.entries(mm).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>(MODE[k]||k).replace(/^\S+\s/,"")+" "+rs(v).replace("₹","")).join(" · ")||"no payment"],
        ["day:bill","#002f37","","Billed · "+(p.label||""),rs(sum(Bl,x=>x.debit)),pl(Bl.length,"bill")]];
      el("kpis").innerHTML=K.map(([go,c,v,h,b,s])=>'<button type="button" class="ab-k" data-go="'+go+'" style="--c:'+c+(v?";--v:"+v:"")+'"><h3>'+esc(h)+'</h3><b>'+b+'</b><small>'+esc(s)+'</small></button>').join("");
    }

    /* ---------- generic table with Excel-style column filters ---------- */
    // cols: {h, v(x) value for filter / sort / Excel, html(x) cell, n:number, hp:hide on phone, sum:true}
    function table(k,cols,items,onRow,opt){
      opt=opt||{};
      const head=cols.map(c=>c.h),rows=items.map(x=>({data:cols.map(c=>c.v(x)),x}));
      const list=CF.apply(k,head,rows,opt.cf);
      cur={k,cols,list,onRow,title:opt.title||""};
      const cl=c=>(c.n?"n ":"")+(c.hp?"hp":"");
      const tot=cols.some(c=>c.sum)?'<tfoot><tr>'+cols.map((c,i)=>'<td class="'+cl(c)+'">'+(i===0?(list.length+" row"+(list.length===1?"":"s")):c.sum?(c.money===false?r2(list.reduce((a,r)=>a+(Number(r.data[i])||0),0)):rs(list.reduce((a,r)=>a+(Number(r.data[i])||0),0))):"")+"</td>").join("")+"</tr></tfoot>":"";
      return '<div class="ab-cfph">'+CF.chips(k,head)+'</div><table class="ab-t"><thead><tr>'+cols.map((c,i)=>'<th class="'+cl(c)+'">'+CF.th(k,head,i,c.h)+"</th>").join("")+'</tr></thead><tbody>'+
        (list.slice(0,shown).map((r,i)=>'<tr tabindex="0" data-r="'+i+'">'+cols.map(c=>'<td class="'+cl(c)+(c.p?" p":"")+'">'+(c.html?c.html(r.x):esc(c.v(r.x)))+"</td>").join("")+"</tr>").join("")||'<tr class="ob"><td colspan="'+cols.length+'" class="ab-empty">'+esc(opt.empty||"Nothing to show")+"</td></tr>")+
        "</tbody>"+tot+"</table>"+(list.length>shown?'<div class="ab-more"><button type="button" class="ab-b" id="more">Show more ('+(list.length-shown)+")</button></div>":"");
    }
    const match=(q,...v)=>{if(!q)return true;const t=v.join(" ").toLowerCase();return q.split(/\s+/).every(w=>t.includes(w))};

      function drawList(){const v=key(inp.value);hits=all.filter(([pk,n])=>!v||pk.includes(v)||membersOf(pk).some(m=>key(m).includes(v))).slice(0,60);hi=0;

        const hl=ref.hl&&!BILLK.has(ref.hl.entry_kind)?ref.hl:null;
        const rows=led.filter(y=>String(y.order_no)===String(no));let run=0;
        b.innerHTML=(hl?'<div class="ab-this"><b>This entry:</b> <span class="ab-vt '+vt(hl)[1]+'">'+esc(vt(hl)[0])+"</span>"+esc(vt(hl)[2]||"")+" "+modeChips(PAYK.has(hl.entry_kind)?modeOf(hl):[])+" · "+dmy(hl.d)+" · <b>"+rs2(hl.debit||hl.credit)+"</b>"+(hl.note?" · "+esc(hl.note):"")+"</div>":"")+
          '<div class="ab-sum"><div><small>Bill amount</small><b>'+rs2(billAmt)+'</b></div><div><small>Credit note / return</small><b>'+rs2(cn)+'</b></div><div><small>Received</small><b class="ab-adv">'+rs2(got)+'</b></div><div class="big"><small>Due now</small><b class="'+(due>0.5?"ab-due":"ab-adv")+'">'+(due==null?"—":rs2(due))+"</b></div></div>"+
          ((o.bills||[]).length>1?"<h4>Tally bills</h4>"+'<table class="ab-t"><tbody>'+o.bills.map(x=>'<tr class="ob"><td>'+esc(x.firm||o.party)+"</td><td>"+esc(x.no)+'</td><td class="n">'+rs2(x.amount)+"</td></tr>").join("")+"</tbody></table>":"")+
          "<h4>Items ("+items.length+")</h4>"+
          '<table class="ab-t"><thead><tr><th>SKU</th><th class="n hp">Ordered</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Amount</th></tr></thead><tbody>'+
          (items.map(i=>'<tr class="ob"><td>'+esc(i.sku_name||i.sku||"")+'</td><td class="n hp">'+(Number(i.ordered_qty)||0)+'</td><td class="n"><b>'+i.q+'</b></td><td class="n">'+rs2(i.rate)+'</td><td class="n">'+rs2(i.amt)+"</td></tr>").join("")||'<tr class="ob"><td colspan="5" class="ab-empty">No item line</td></tr>')+
          '</tbody><tfoot><tr><td>Total</td><td class="n hp"></td><td class="n">'+items.reduce((a,i)=>a+i.q,0)+'</td><td class="n"></td><td class="n">'+rs2(items.reduce((a,i)=>a+i.amt,0))+"</td></tr></tfoot></table>"+
          "<h4>Payments on this bill ("+pays.length+")</h4>"+
          (pays.length?'<table class="ab-t"><thead><tr><th>Date</th><th>Mode</th><th class="hp">Ref</th><th class="hp">By</th><th>Status</th><th class="n">Amount</th></tr></thead><tbody>'+pays.map((y,i)=>{const s=PST[y.status]||[y.status||"",""];
            return '<tr tabindex="0" data-py="'+i+'"><td>'+dmy(y.pay_date)+"</td><td>"+modeChips(String(y.mode||"").toUpperCase().split("+"))+'<small class="ab-ph">'+esc(y.ref||"")+'</small></td><td class="hp">'+esc(y.ref||"")+'</td><td class="hp">'+esc(y.by_name||"")+'</td><td><span class="ab-bd '+s[1]+'">'+esc(s[0])+'</span></td><td class="n">'+rs2(y.amount)+"</td></tr>"}).join("")+"</tbody></table>":'<div class="ab-empty">No payment yet</div>')+
          "<h4>Ledger entries of this PO</h4>"+
          '<table class="ab-t"><tbody>'+rows.map(y=>{run+=y.debit-y.credit;return '<tr class="ob'+(ref.hl&&y.i===ref.hl.i?" hl":"")+'"><td>'+dmy(y.d)+'</td><td><span class="ab-vt '+vt(y)[1]+'">'+esc(vt(y)[0])+"</span>"+esc(y.ref_no||"")+'</td><td class="n">'+(y.debit?rs2(y.debit):"")+'</td><td class="n ab-adv">'+(y.credit?rs2(y.credit):"")+'</td><td class="n">'+bal(run)+"</td></tr>"}).join("")+"</tbody></table>";
        // a party payment row opens its receipt
        b.querySelectorAll("[data-py]").forEach(t=>t.onclick=()=>{const y=pays[Number(t.dataset.py)];
          const r=(info.raw.receipts||[]).find(r=>!r.cancelled&&(r.allocs||[]).some(a=>a.order_id===id&&Math.abs(Number(a.amount)-Number(y.amount))<0.01))||(info.raw.receipts||[]).find(r=>!r.cancelled&&(r.allocs||[]).some(a=>a.order_id===id));
          if(r&&/PARTY|OFFICE|ACC/i.test(String(y.src||"PARTY")))openReceipt(r);else if(window.ERPShell&&ERPShell.toast)ERPShell.toast(String(y.src||"Payment")+" · "+rs2(y.amount)+(y.by_name?" · "+y.by_name:""),"info")});
        f.innerHTML='<button type="button" class="ab-b t" data-led="'+esc(pk)+'">📒 Party ledger</button>'+(due>0.5?'<button type="button" class="ab-b g" data-pay="'+esc(pk)+'">💰 Receive</button>':"")+
          (id?'<a class="ab-b" href="accounts-invoice.html?order='+encodeURIComponent(id)+'#tally">Bill page ↗</a><a class="ab-b" href="warehouse-orders.html?order='+encodeURIComponent(id)+'">Open PO ↗</a>':"")+(window.LWBLedgerShare&&items.length?'<button type="button" class="ab-b" data-bshare title="Bill image + text: items, payments, due">🖼 Share</button>':"")+
          (canDate()&&id&&o.invoice_no?'<button type="button" class="ab-b" data-bedit>✏️ Edit bill</button><button type="button" class="ab-b ab-del" data-bcx>⛔ Cancel bill</button><button type="button" class="ab-b ab-del" data-bdel>🗑 Delete bill</button>':"")+'<span class="sp"></span><button type="button" class="ab-b" data-close>Close</button>';
        // Share bill (Mohit 28 Nov 2026): goods, qty, rate, amount + payments set to it + due. Invoice no.: GST = Tally no., Cash = PO no.
        const bs=f.querySelector("[data-bshare]");
        if(bs)bs.onclick=async()=>{
          let t=null;if(window.LWBBillType&&id)try{t=LWBBillType.kindOf((await LWBBillType.load(client,[id])).get(id))}catch(_){}
          const tno=String(billNo(o)||o.invoice_no||"").trim(),pno=String(no).replace(/^PO\s*/i,"").trim();
          LWBLedgerShare.showBill({party:o.party||O.customer_name||"",inv:(t==="CASH"?pno||tno:tno||pno)||"-",date:dmy(o.invoice_date||O.order_date||""),brand:o.company_id&&info.brandOf(o.company_id)?info.brandOf(o.company_id).name:"",
            items:items.map(i=>({sku:i.sku_name||i.sku||"",qty:i.q,rate:Number(i.rate)||0,amt:i.amt})),bill:billAmt,cn,got,due,
            pays:pays.filter(y=>!/REJECT|CANCEL|BOUNCE/i.test(String(y.status||""))).map(y=>({date:dmy(y.pay_date),mode:modeTxt(String(y.mode||"").toUpperCase().split("+").filter(Boolean))||"-",amount:Number(y.amount)||0}))})};
        const be=f.querySelector("[data-bedit]"),bx=f.querySelector("[data-bdel]");
        if(be)be.onclick=()=>billEdit(b,o,id);
        const bc=f.querySelector("[data-bcx]");
        if(bc)bc.onclick=()=>cxBox(b,"Cancel Tally bill <b>"+esc(billNo(o)||o.invoice_no)+"</b> ("+rs2(billAmt)+")? It stays in the ledger as <b>Cancelled</b> with ₹0; the PO goes back to Bills to make; party money set to it goes back to advance.","TALLY_BILL",id,"Tally bill cancelled");
        if(bx)bx.onclick=()=>delBox(b,"Delete Tally bill <b>"+esc(billNo(o)||o.invoice_no)+"</b> ("+rs2(billAmt)+")? The PO goes back to Bills to make; party money set to it goes back to advance.",
          reason=>client.rpc("lwb_tally_bill_delete",{p_order_id:id,p_reason:reason}),"Tally bill deleted");
        if(id)histInto(b,[id]);
      }});
    }

    /* ---------- Copy / image of the open ledger (Mohit 28 Nov 2026) ----------
       Only Date, Invoice no., Debit, Credit + closing. Bill: GST (pakka) = Tally bill no., Cash (kachha) = PO no. */
    async function ledShare(){
      if(!cur||!cur.ledger)return null;
      const {name,L,p}=cur.ledger,po=v=>String(v||"").replace(/^PO\s*/i,"").trim();
      const bills=L.rows.filter(x=>BILLK.has(x.entry_kind)),oid=x=>{const o=byNo.get(String(x.order_no));return o?(o.order_id||o.id):null};
      let kinds=new Map();
      if(window.LWBBillType){const ids=[...new Set(bills.map(oid).filter(Boolean))];if(ids.length)try{kinds=await LWBBillType.load(client,ids)}catch(_){}}
      const inv=x=>{const k=x.entry_kind,ref=String(x.ref_no||"").trim();
        if(BILLK.has(k)){const t=window.LWBBillType?LWBBillType.kindOf(kinds.get(oid(x))):null;
          if(t==="CASH")return po(x.order_no)||ref;if(t==="GST")return ref||po(x.order_no);
          return k==="ERP_BILL"?po(x.order_no)||ref:ref||po(x.order_no)}
        if(isKasar(x))return "Kasar";
        if(PAYK.has(k))return "Payment";
        if(k==="CREDIT_NOTE")return "Credit note"+(ref?" "+ref:"");
        if(k==="DEBIT_NOTE")return "Debit note"+(ref?" "+ref:"");
        if(k==="OPENING")return "Opening";
        return "Return"+(ref?" "+ref:"")};
      return {party:name,from:dmy(p.from),period:dmy(p.from)+" to "+dmy(p.to),brand:fb&&info.brandOf(fb)?info.brandOf(fb).name:"",open:L.open,dr:L.dr,cr:L.cr,close:L.close,
        rows:L.rows.filter(x=>x.entry_kind!=="CANCELLED"&&(x.debit||x.credit)).map(x=>({date:dmy(x.d),inv:inv(x),dr:x.debit,cr:x.credit}))};
    }

    /* ---------- Excel / Print ---------- */
    async function excel(){
      if(!cur)return;
      if(cur.ledger){const {name,L,p}=cur.ledger;
        return S.excel("Ledger-"+name.replace(/[^A-Za-z0-9]+/g,"_"),[{name:"Ledger",title:"Ledger "+name+bLab()+" · "+dmy(p.from)+" to "+dmy(p.to),head:["Date","Vch type","Particulars","Vch no. / Ref","PO","Debit","Credit","Balance (+Dr / -Cr)"],
          rows:[["","","Opening balance","","","","",L.open],...L.rows.map(x=>[x.d,vt(x)[0],vt(x)[2]||"",x.ref_no||"",x.order_no||"",x.debit||"",x.credit||"",x.bal]),["","","Closing balance","","",L.dr,L.cr,L.close]]}])}
      return S.excel((cur.title||"Accounts").replace(/[^A-Za-z0-9]+/g,"_"),[{name:cur.title||"Sheet",title:(cur.title||"")+bLab(),head:cur.cols.map(c=>c.h),rows:cur.list.map(r=>r.data)}]);
    }
    function print(){
      const w=window.open("","_blank");if(!w)return ERPShell.alert("Allow pop-ups for this site to print.");
      const t=el("crumb").textContent,tb=el("box").querySelector(".ab-t");
      w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>'+esc(t)+'</title><style>body{font:12px Arial,sans-serif;color:#142841;margin:20px}h1{font-size:15px;margin:0 0 10px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccd;padding:4px 6px;text-align:left;vertical-align:top}th{background:#eef2f7}.n{text-align:right;white-space:nowrap}small{display:block;color:#667}.lwb-cf,.ab-ph{display:none}tfoot td{font-weight:bold}</style></head><body><h1>LUXURY WRIST BRAND · '+esc(t)+"</h1>"+
        (el("box").querySelector(".ab-sum")?el("box").querySelector(".ab-sum").outerHTML.replace(/<div/g,"<span").replace(/<\/div>/g,"</span> &nbsp; "):"")+(tb?tb.outerHTML:"")+"<p><small>Printed "+dmy(today())+"</small></p></body></html>");
      w.document.close();w.focus();setTimeout(()=>w.print(),300);
    }

    /* ---------- Sales Head: tell Accounts about a party's payment ---------- */
    async function tell(pk){
      if(!pk){ERPShell.alert("Open a party first, then press Tell Accounts.");return}
      const name=nameOf(pk),note=await ERPShell.prompt("📣 Tell Accounts about "+name+"\nMessage (optional), e.g. party will pay on Monday by cheque. Accounts, Cashier and Admin get a notification.","",{placeholder:"e.g. Party will pay on Monday by cheque",ok:"📣 Send"});
      if(note==null||note===false)return;
      const {error}=await client.rpc("lwb_payment_followup",{p_order_id:null,p_party:name,p_note:String(note).trim()||null});
      if(error)return ERPShell.alert(String(error.message||error).replace(/^.*?ERROR:\s*/,""));
      ERPShell.toast("Accounts told · "+name);
    }

    /* ---------- receive payment ---------- */
    function pay(pk){
      if(!info)return;
      if(VIEW())return tell(pk);
      LWBPartyPay.open({client,info,party:pk?nameOf(pk):undefined,brand:fb||undefined,onSaved:r=>{if(window.ERPShell&&ERPShell.toast)(r.kasarOnly?ERPShell.toast("Kasar "+rs(r.kasar)+" saved on bill "+r.bill+" · "+r.party,"success"):ERPShell.toast(rs(r.amount)+" received from "+r.party,"success"));popClose();load()}});
    }

    /* ---------- wiring ---------- */
    function goSec(s,extra){popClose();sec=s;shown=300;if(extra)extra();draw();window.scrollTo(0,0)}
    (async()=>{
      me=await S.start(["admin","accounts","manager"]);
      if(!me)return;
      if(VIEW()){document.body.classList.add("ab-view");el("payBtn").hidden=true;
        // Sales Head only looks: every "Receive" button becomes "📣 Tell Accounts" (lwb_payment_followup).
        const relabel=()=>document.querySelectorAll("[data-pay]:not([data-tl])").forEach(b=>{b.dataset.tl="1";b.classList.remove("g");b.classList.add("t");b.innerHTML="📣 Tell Accounts"});
        new MutationObserver(relabel).observe(document.body,{childList:true,subtree:true});}
      el("loading").hidden=true;el("page").hidden=false;
      const U=new URLSearchParams(location.search);
      const v=U.get("v");if(SECS.some(s=>s[0]===v))sec=v;
      el("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-sec]");if(b)goSec(b.dataset.sec)});
      el("kpis").addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(!b)return;const [s,x]=b.dataset.go.split(":");
        goSec(s,()=>{if(s==="out"){outPk="";if(x==="60"){outMode="bill";outShow="60"}else{outMode="party";outShow=x||"due"}}if(s==="day")dayKind=x==="bill"?"bill":"";if(s==="led")ledPk=""})});
      el("rfBtn").onclick=()=>load();el("xlBtn").onclick=()=>excel().catch(e=>ERPShell.alert(e.message));el("prBtn").onclick=print;el("payBtn").onclick=()=>pay(sec==="led"?ledPk:sec==="out"?outPk:"");
      // rows: click / Enter opens
      const rowGo=tr=>{if(!cur||!tr||!tr.dataset.r)return;const r=cur.list[Number(tr.dataset.r)];if(r&&cur.onRow){lastFocus=tr;cur.onRow(r.x)}};
      el("box").addEventListener("click",e=>{if(e.target.closest("[data-cf],a,button:not(#more)"))return;rowGo(e.target.closest("tr[data-r]"))});
      document.addEventListener("click",e=>{
        const t=e.target.closest("#more,[data-led],[data-out],[data-pay],[data-back],[data-close],[data-lcopy],[data-limg]");if(!t)return;
        if(t.id==="more"){shown+=300;draw();return}
        if(t.hasAttribute("data-back"))return popBack();
        if(t.hasAttribute("data-close"))return popClose();
        if(t.dataset.led!=null){popClose();sec="led";ledPk=t.dataset.led;shown=300;draw();window.scrollTo(0,0);return}
        if(t.dataset.out!=null){popClose();sec="out";outPk=t.dataset.out;shown=300;draw();return}
        if(t.dataset.pay!=null)return pay(t.dataset.pay);
        if(t.hasAttribute("data-lcopy")||t.hasAttribute("data-limg"))return ledShare().then(d=>{if(!d)return;
          if(t.hasAttribute("data-limg"))return LWBLedgerShare.show(d);
          // more than 25 entries: WhatsApp shows them badly in one go, so open the pages (copy page by page, or PDF)
          if(d.rows.length>LWBLedgerShare.MAX){ERPShell.toast(d.rows.length+" entries: more than "+LWBLedgerShare.MAX+" lines, so the ledger is made in pages. Copy page by page or take the PDF.","info");return LWBLedgerShare.show(d)}
          return LWBLedgerShare.copyText(d).then(()=>ERPShell.toast("Ledger copied: "+d.rows.length+" entries + closing. Paste in WhatsApp.","success"))}).catch(e=>ERPShell.alert("Could not copy: "+(e.message||e)));
      });
      el("pop").addEventListener("click",e=>{if(e.target.classList.contains("ab-ov"))popClose()});
      // Tally keys: Ctrl+Alt+L / O / R / P / D, Esc = one step back, Enter on a row = open, L in a party = its ledger
      window.addEventListener("keydown",e=>{
        const k=(e.code||"").replace(/^Key/,"");
        if(e.ctrlKey&&e.altKey&&!e.metaKey){
          const m={L:()=>findLedger(),O:()=>goSec("out",()=>{outPk=""}),R:()=>goSec("rec"),P:()=>goSec("sum"),D:()=>goSec("day")}[k];
          if(m){e.preventDefault();e.stopPropagation();m();return}}
        if(e.key==="Escape"){
          if(document.querySelector(".lwbk-back,.lwb-cf-pop,.lpp-back"))return;
          if(stack.length){e.preventDefault();e.stopPropagation();stack.length>1?popBack():popClose();return}
          const a=document.activeElement,typing=a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName);
          if(typing&&a.value){return}
          if(sec==="out"&&outPk){e.preventDefault();outPk="";draw();return}
          if(sec==="led"&&ledPk){e.preventDefault();ledPk="";draw();return}
          return}
        if(e.key==="Enter"&&!e.ctrlKey&&!e.altKey){const tr=e.target.closest&&e.target.closest("tr[data-r],tr[data-al],tr[data-py]");
          if(tr){e.preventDefault();if(tr.closest("#pop"))tr.click();else rowGo(tr);return}}
        const a=document.activeElement,typing=a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName);
        if(!typing&&!stack.length&&!e.ctrlKey&&!e.altKey&&!e.metaKey&&(e.key==="l"||e.key==="L")&&sec==="out"&&outPk){e.preventDefault();sec="led";ledPk=outPk;draw()}
      },true);
      document.addEventListener("lwb:brand",()=>{if(!info)return;fb=curBrand();drawKpis();draw()});
      document.addEventListener("lwb:period",()=>{if(!info)return;drawKpis();if(!stack.length)draw()});
      await load();
      const P=U.get("party");
      if(P&&info){const pk=key(info.parentOf(P));if(sec==="out")outPk=pk;else{sec=sec==="out"?"out":"led";ledPk=pk}draw()}
      if(U.get("find")==="1")findLedger();
    })().catch(e=>{el("loading").textContent=e.message||String(e)});
  })();
  </script>
