    .sp-mhead h3{margin:0;font-size:16px}.sp-x{border:0;background:none;font-size:18px;cursor:pointer;color:var(--erp-muted)}
    .sp-mbody{padding:10px 14px}.sp-mbody h4{margin:12px 0 6px;font-size:14px}

    .fx-cmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
    .fx-cmp>div{border:1px solid var(--erp-line);border-radius:8px;padding:6px 8px}.fx-cmp b{display:block;font-size:15px}.fx-cmp small{display:block;color:var(--erp-muted);font-size:12px}
    .fx-cmp .bad{background:#fff3f4;border-color:#f3c2ca;color:#a1122a}.fx-cmp .ok{background:#f2faf5;border-color:#bfe5cc}
    .fx-ent{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px dashed var(--erp-line);font-size:14px}
    .fx-ent button{height:28px;padding:0 9px;border-radius:5px;border:1px solid var(--erp-line);background:#fff;font:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-left:4px}
    .fx-ent button.del{color:var(--erp-red);border-color:#f3c2ca}
    .fx-warn{margin:4px 0;padding:6px 8px;border-radius:6px;background:#fff1d1;color:#8a5a00;font-weight:700;font-size:13.5px}
    .fx-add{height:34px!important;font-size:14px!important;margin-top:6px}
    .fx-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1.4fr;gap:8px}.fx-grid .full{grid-column:1/-1}.fx-grid .wide2{grid-column:span 2}
    .fx-grid>div,.fx-cmp>div{min-width:0}.fx-grid input,.fx-grid select{min-width:0;max-width:100%}
    .fx-grid label{display:block;font-size:12.5px;font-weight:700;color:#4b5763;margin-bottom:3px}
    .fx-grid input,.fx-grid select{width:100%;height:36px;border:1.5px solid var(--erp-line);border-radius:6px;padding:0 8px;font:inherit;font-size:14px;box-sizing:border-box}
    .ml-list{max-height:200px;overflow:auto;border:1px solid var(--erp-line);border-radius:8px}
    .ml-it{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-bottom:1px solid var(--erp-line);font-size:13.5px;cursor:pointer}.ml-it .q-badge{margin:2px 4px 0 0}
    .ml-sub,.ml-body{width:100%;box-sizing:border-box;border:1.5px solid var(--erp-line);border-radius:6px;padding:7px 8px;font:inherit;font-size:13.5px}
    .ml-sub{height:36px;margin-bottom:6px}.ml-body{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;resize:vertical}
    @media(max-width:560px){.sp-modal{padding:0}.sp-mbox{border-radius:0;min-height:100%}.fx-grid{grid-template-columns:1fr 1fr}.fx-grid>div:first-child,.fx-grid .wide2{grid-column:1/-1}.fx-cmp{grid-template-columns:1fr 1fr}}
    [hidden]{display:none!important}
  </style>

<body>
  <div id="loading" class="status">Checking account access...</div>
  <main id="page" class="erp-main" hidden>
    <div class="erp-pagehead"><h1>Sheet &amp; Pallet Ledger<button type="button" class="erp-i" aria-label="Info" title="Info" data-tip="Returnable sheets and pallets (quantity only, no money value): received from and returned to the company, given to and returned by market parties on direct vehicle bills.">i</button></h1></div>
    <div id="err" class="sp-err" hidden></div>
    <div class="sp-kpis" id="kpis"></div>
    <div class="erp-pills" id="tabs">
      <a class="erp-pill" data-tab="entry" href="#entry">New Entry</a>
      <a class="erp-pill" data-tab="company" href="#company">Company Ledger</a>
      <a class="erp-pill" data-tab="match" href="#match">Company Match <span class="n" id="qCount" hidden></span></a>
      <a class="erp-pill" data-tab="parties" href="#parties">Party Ledger</a>
      <a class="erp-pill" data-tab="letter" href="#letter">Return Letter</a>
      <a class="erp-pill" data-tab="summary" href="#summary">Summary Print</a>
      <a class="erp-pill" data-tab="opening" href="#opening">Opening Balance</a>
      <a class="erp-pill" data-tab="history" href="#history">History</a>
    </div>
    <div id="view"></div>
  </main>
  <div id="printArea"></div>
  <script>
    'use strict';
    const client=supabase.createClient("https://qstgwhbgbznxemajtave.supabase.co","sb_publishable_YA2Pow327REqgrWPzVCZiA_nw1F32_o");
    const el=id=>document.getElementById(id);
    const esc=v=>String(v==null?"":v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    const num=v=>Number(v||0).toLocaleString("en-IN");
    const today=()=>new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Kolkata"});
    const dmy=(d,sep="/")=>d?d.slice(8,10)+sep+d.slice(5,7)+sep+d.slice(0,4):"";
    const dtTxt=v=>LWBDate.dt(v);
    const key=v=>String(v||"").trim().toUpperCase().replace(/\s+/g," ");
    const TYPES={
      COMPANY_IN:{l:"Received from Company",short:"From Company",cls:"in",ref:"Purchase Bill No."},
      COMPANY_OUT:{l:"Returned to Company",short:"To Company",cls:"out",ref:"LR No."},
      PARTY_OUT:{l:"Given to Party (Direct Vehicle)",short:"Given to Party",cls:"p-out",ref:"Bill / Order No."},
      PARTY_IN:{l:"Returned by Party",short:"Returned by Party",cls:"p-in",ref:"Ref No."}
    };
    const OPENING="OPENING BALANCE";
    const isParty=t=>t==="PARTY_OUT"||t==="PARTY_IN";
    const pS=(p,s)=>num(p)+" pallets · "+num(s)+" sheets";
    const addDays=(d,n)=>{const x=new Date(d+"T00:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
    const dayGap=(a,b)=>Math.round((new Date(a+"T00:00:00Z")-new Date(b+"T00:00:00Z"))/864e5);
    const dig=v=>String(v||"").replace(/\D/g,"").replace(/^0+/,"");
    const vno=v=>String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
    const sgn=n=>(n>0?"+":"")+num(n);

    let me=null,tab="entry",rows=[],allRows=[],stmt=[],upl=null,bills=[],stmtMissing=false,matchFilter="query",remarks=new Map(),pending=null,showOld=false,mcache=null,settings={},customers=[],dvOrders=[],vehicles=[],history=[],historyMissing=false,missing=false,busy=false,partyPick="",letterId="",editId="";
    const canEdit=()=>me&&["admin","manager"].includes(me.role);
    // Accounts only looks at this ledger (Mohit, 4 Nov 2026): no New Entry, no return letter save.
    const ro=()=>!!me&&!!window.ERPShell&&ERPShell.viewOnly(me.role,"sheet-pallet.html");

    async function start(){
      const {data:{session}}=await client.auth.getSession();
      if(!session){location.replace("login.html");return null}
      const {data:p}=await client.from("user_profiles").select("full_name,role,active").eq("id",session.user.id).single();
      const realRole=String((p&&p.role)||"").toLowerCase().trim(),role=p?await ERPShell.pageRoleFresh(realRole):realRole;
      if(!p||p.active!==true||!["admin","manager","accounts","warehouse"].includes(role)){location.replace("dashboard.html");return null}
      return {id:session.user.id,role,realRole,name:p.full_name||session.user.email};
    }
    async function load(){
      const [e,s,c,o,v,hi,su,sl,rk]=await Promise.all([
        client.from("lwb_sp_entries").select("*").order("entry_date").order("created_at"),
        client.from("lwb_sp_settings").select("*").eq("id",1).maybeSingle(),
        client.from("lwb_customer_master").select("customer_name").eq("is_active",true).order("customer_name"),
        client.from("orders").select("id,order_no,order_date,customer_name,status").eq("transportation","DIRECT VEHICLE").order("order_date",{ascending:false}).limit(200),
        client.from("lwb_vehicles").select("vehicle_no,transporter_name").eq("is_active",true).order("vehicle_no"),
        client.from("lwb_sp_history").select("*").order("changed_at",{ascending:false}).limit(300),
        client.from("lwb_sp_stmt_uploads").select("*").order("uploaded_at",{ascending:false}).limit(1),
        client.from("lwb_sp_stmt").select("*").order("line_date").order("id").limit(5000),
        client.from("lwb_sp_stmt_remarks").select("*").limit(5000)]);
      history=hi.data||[];historyMissing=!!hi.error;
      missing=!!(e.error||s.error);
      el("err").hidden=!missing;
      if(missing)el("err").textContent="Sheet & Pallet tables are not set up in Supabase yet. Run lwb_sheet_pallet_setup.sql once in the Supabase SQL Editor, then refresh this page.\n("+((e.error||s.error).message||"")+")";
      allRows=(e.data||[]).sort((x,y)=>x.entry_date.localeCompare(y.entry_date)||(y.ref_no===OPENING)-(x.ref_no===OPENING));settings=s.data||{};
      // Ledger start date (Mohit, 19 Nov 2026): older entries stay in the table but are not counted or shown.
      rows=settings.start_date?allRows.filter(r=>r.entry_date>=settings.start_date):allRows;
      stmtMissing=!!(su.error||sl.error);upl=(su.data||[])[0]||null;stmt=sl.data||[];remarks=new Map((rk.data||[]).map(x=>[x.item_key,x]));mcache=null;
      const bFrom=settings.start_date||(upl&&upl.from_date)||new Date(Date.now()-90*864e5).toISOString().slice(0,10);
      const bq=await client.from("lwb_goods_inward").select("id,invoice_no,supplier_name,received_date,invoice_date,vehicle_no").gte("received_date",addDays(bFrom,-5)).order("received_date").limit(2000);
      bills=bq.data||[];customers=(c.data||[]).map(x=>x.customer_name);vehicles=v.data||[];
      dvOrders=o.data||[];
      if(dvOrders.length){
        const a=await client.from("dispatch_assignments").select("order_id,vehicle_no,driver_mobile,transporter_name").in("order_id",dvOrders.map(x=>x.id));
        const by=new Map((a.data||[]).map(x=>[x.order_id,x]));dvOrders.forEach(x=>x.da=by.get(x.id)||{});
      }
    }

    /* ---------- balances ---------- */
    function totals(list){
      const t={ci:[0,0],co:[0,0],po:[0,0],pi:[0,0]};
      for(const r of list){const k={COMPANY_IN:"ci",COMPANY_OUT:"co",PARTY_OUT:"po",PARTY_IN:"pi"}[r.entry_type];t[k][0]+=r.pallets;t[k][1]+=r.sheets}
      t.due=[t.ci[0]-t.co[0],t.ci[1]-t.co[1]];t.market=[t.po[0]-t.pi[0],t.po[1]-t.pi[1]];
      t.hand=[t.due[0]-t.market[0],t.due[1]-t.market[1]];return t;
    }
    function partyTotals(list=rows){
      const m=new Map();
      for(const r of list){if(!isParty(r.entry_type))continue;const k=key(r.party_name);
        if(!m.has(k))m.set(k,{name:r.party_name.trim(),g:[0,0],r:[0,0],last:""});const x=m.get(k);
        const t=r.entry_type==="PARTY_OUT"?x.g:x.r;t[0]+=r.pallets;t[1]+=r.sheets;if(r.entry_date>x.last)x.last=r.entry_date}
      return [...m.values()].map(x=>({...x,p:[x.g[0]-x.r[0],x.g[1]-x.r[1]]})).sort((a,b)=>(b.p[0]+b.p[1])-(a.p[0]+a.p[1])||a.name.localeCompare(b.name));
    }
    function kpiCo(t){
      const m=matchData();if(m.none)return "";
      const dp=t.due[0]-m.coBal[0],ds=t.due[1]-m.coBal[1];
      return '<br>Company statement: <b>'+pS(m.coBal[0],m.coBal[1])+"</b> "+(dp||ds?'<span class="q-badge bad">Diff '+sgn(dp)+" P · "+sgn(ds)+" S</span>":'<span class="q-badge ok">✓ Same</span>')+(m.q?' <span class="q-badge bad">'+m.q+" query</span>":"");
    }

        k("#b26b00","🚚 Pending in Market",pS(t.market[0],t.market[1]),pt+" parties · Given "+pS(t.po[0],t.po[1])+" · Returned "+pS(t.pi[0],t.pi[1]))+

    async function saveEntry(){
      if(busy||missing||ro())return;
      const t=el("fType").value,val=id=>el(id).value.trim(),int=id=>val(id)===""?0:Number(val(id));
      const o={entry_date:val("fDate"),entry_type:t,party_name:isParty(t)?key(val("fParty")):null,pallets:int("fPallets"),sheets:int("fSheets"),
        order_id:t==="PARTY_OUT"&&(val("fOrder")||(editId&&(rows.find(x=>x.id===editId)||{}).order_id))||null,ref_no:val("fRef")||null,vehicle_no:val("fVehicle").toUpperCase().replace(/[^A-Z0-9]/g,"")||null,
        transporter_name:val("fTransporter")||null,driver_mobile:val("fDriver")||null,note:val("fNote")||null};
      if(!/^\d{4}-\d{2}-\d{2}$/.test(o.entry_date))return ERPShell.toast("Select a date.","error");
      if(![o.pallets,o.sheets].every(n=>Number.isInteger(n)&&n>=0))return ERPShell.toast("Pallets and sheets must be whole numbers (0 or more).","error");
      if(o.pallets+o.sheets<=0)return ERPShell.toast("Enter pallets or sheets.","error");
      if(isParty(t)&&!o.party_name)return ERPShell.toast("Select the party.","error");
      // One invoice = one "Received from Company" entry (Mohit, 19 Nov 2026)
      const ik=v=>String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
      if(t==="COMPANY_IN"&&ik(o.ref_no)&&ik(o.ref_no)!=="OPENINGBALANCE"){const dup=allRows.find(x=>x.id!==editId&&x.entry_type==="COMPANY_IN"&&ik(x.ref_no)===ik(o.ref_no));
        if(dup)return ERPShell.toast("Invoice "+o.ref_no+" is already in the ledger (received "+dmy(dup.entry_date)+"). Edit that entry instead.","error")}
      const others=rows.filter(x=>x.id!==editId);
      let warn="";const tt=totals(others);
      if(t==="PARTY_IN"){const p=partyTotals(others).find(x=>key(x.name)===key(o.party_name))||{p:[0,0]};if(o.pallets>p.p[0]||o.sheets>p.p[1])warn="\n\nThis is more than the party's pending balance ("+pS(p.p[0],p.p[1])+").";}
      if(t==="COMPANY_OUT"&&(o.pallets>tt.due[0]||o.sheets>tt.due[1]))warn="\n\nThis is more than the balance due to the company ("+pS(tt.due[0],tt.due[1])+").";
      const verb=(editId?"UPDATE ":t==="COMPANY_OUT"?"SUBMIT ":"SAVE ")+TYPES[t].l.toUpperCase()+(t==="COMPANY_OUT"?" AND PRINT LETTER":"");
      if(!await confirm(verb+"?\n\n"+(o.party_name?o.party_name+"\n":"")+dmy(o.entry_date)+" · "+pS(o.pallets,o.sheets)+(o.vehicle_no?" · "+o.vehicle_no:"")+(o.ref_no?" · "+TYPES[t].ref+" "+o.ref_no:"")+warn))return;
      busy=true;el("fSave").disabled=true;
      const q=client.from("lwb_sp_entries"),r=await (editId?q.update(o).eq("id",editId):q.insert(o)).select().single();
      busy=false;
      if(r.error){el("fSave").disabled=false;return ERPShell.toast((editId&&/permission|policy/i.test(r.error.message)?"Run the updated lwb_sheet_pallet_setup.sql in Supabase first. ":"")+"Save failed: "+r.error.message,"error")}
      ERPShell.toast(editId?"Entry updated.":"Entry saved.","success");
      editId="";el("fType").value=t;
      await load();render();
      if(t==="COMPANY_OUT")printReturn(r.data);
    }
    async function remove(id){
      const r=rows.find(x=>x.id===id);if(!r||!canEdit())return;
      if(!await confirm("DELETE this entry? (A copy is kept on the History tab.)\n\n"+TYPES[r.entry_type].l+" · "+(r.party_name||"Company")+" · "+dmy(r.entry_date)+" · "+pS(r.pallets,r.sheets)))return;
      const res=await client.from("lwb_sp_entries").delete().eq("id",id);
      if(res.error)return ERPShell.toast("Delete failed: "+res.error.message,"error");
      if(editId===id)editId="";
      ERPShell.toast("Entry deleted.","success");await load();render();
    }

    /* ---------- company statement match (Mohit, 19 Nov 2026) ---------- */
    // Company pallets = Leap + Chep + Own. Issue / Issue_Rev of one invoice are added together.
    // Our "Received from Company" rows are matched by invoice no. (Purchase Bill No.), else by vehicle within 4 days.
    // Company Receipt lines are matched to our returns by vehicle (else same count) within 15 days before the receipt.
    function matchData(){
      if(mcache)return mcache;
      if(!upl||!stmt.length)return mcache={none:true,flags:new Map(),q:0};
      const from=upl.from_date,to=upl.to_date,start=settings.start_date||from;
      const lines=stmt.filter(l=>l.line_date>=from&&l.line_date<=to);
      const last=lines.reduce((m,l)=>l.line_date>m?l.line_date:m,from);
      const groups=new Map(),receipts=[];
      for(const l of lines){
        const P=(l.leap||0)+(l.chep||0)+(l.own||0);
        if(/receipt|return/i.test(l.entry_type)){receipts.push({date:l.line_date,veh:vno(l.vehicle_no),inv:l.inv_no||"",doc:l.ref_doc||"",p:-P,s:-(l.sheets||0),leap:-(l.leap||0),own:-(l.own||0),chep:-(l.chep||0)});continue}
        const k=dig(l.inv_no)||("D"+(l.ref_doc||l.id));
        if(!groups.has(k))groups.set(k,{date:l.line_date,veh:vno(l.vehicle_no),inv:l.inv_no||"",doc:l.ref_doc||"",p:0,s:0,leap:0,own:0,chep:0,rev:false});
        const g=groups.get(k);g.p+=P;g.s+=(l.sheets||0);g.leap+=(l.leap||0);g.own+=(l.own||0);g.chep+=(l.chep||0);
        if(/rev/i.test(l.entry_type))g.rev=true;if(l.line_date<g.date)g.date=l.line_date;
      }
      const ours=rows.filter(r=>!isParty(r.entry_type)&&r.ref_no!==OPENING&&r.entry_date>=start&&r.entry_date<=addDays(to,0));
      const ins=ours.filter(r=>r.entry_type==="COMPANY_IN"),outs=ours.filter(r=>r.entry_type==="COMPANY_OUT");
      const used=new Set(),flags=new Map(),items=[];
      const billOf=inv=>{const d=dig(inv);return d?bills.find(b=>dig(b.invoice_no)===d):null};
      const add=(arr)=>arr.reduce((a,r)=>[a[0]+r.pallets,a[1]+r.sheets],[0,0]);
      for(const g of [...groups.values()].sort((a,b)=>a.date.localeCompare(b.date))){
        const d=dig(g.inv);let m=d?ins.filter(r=>!used.has(r.id)&&dig(r.ref_no)===d):[],how="inv";
        if(!m.length&&g.veh){const c=ins.filter(r=>!used.has(r.id)&&vno(r.vehicle_no)===g.veh&&Math.abs(dayGap(r.entry_date,g.date))<=4).sort((a,b)=>Math.abs(dayGap(a.entry_date,g.date))-Math.abs(dayGap(b.entry_date,g.date)));if(c.length){m=[c[0]];how="veh"}}
        m.forEach(r=>used.add(r.id));
        const o=add(m),bill=billOf(g.inv)||(m[0]&&billOf(m[0].ref_no))||null,dp=o[0]-g.p,ds=o[1]-g.s;
        let st;
        if(!m.length)st={c:"bad",t:bill?"Query · pallets not entered on purchase bill":"Query · purchase bill not entered"};
        else if(dp||ds)st={c:"bad",t:"Query · difference "+(dp?sgn(dp)+" P ":"")+(ds?sgn(ds)+" S":"")};
        else st={c:"ok",t:"✓ Match"};
        if(m.length&&how==="veh")st.x="Invoice no. on our entry: "+(m[0].ref_no||"blank");
        const it={key:"IN:"+(dig(g.inv)||g.doc),kind:"in",date:g.date,inv:g.inv,veh:g.veh,co:[g.p,g.s],coTxt:"Leap "+num(g.leap)+(g.own?" · Own "+num(g.own):"")+(g.chep?" · Chep "+num(g.chep):"")+(g.rev?" · has reversal":""),
          our:m.length?o:null,ourTxt:m.length?m.map(r=>dmy(r.entry_date)+(r.ref_no?" · "+r.ref_no:"")).join(", "):(bill?"Bill "+bill.invoice_no+" · "+dmy(bill.received_date):"No entry"),st,ids:m.map(r=>r.id)};
        items.push(it);m.forEach(r=>flags.set(r.id,st));
      }
      for(const r of ins.filter(r=>!used.has(r.id))){
        const st=r.entry_date>last?{c:"warn",t:"After statement date"}:{c:"bad",t:"Query · not in company statement"};
        items.push({key:"INE:"+r.id,kind:"in",date:r.entry_date,inv:r.ref_no||"",veh:vno(r.vehicle_no),co:null,coTxt:"Not in statement",our:[r.pallets,r.sheets],ourTxt:dmy(r.entry_date)+(r.note?" · "+r.note:""),st,ids:[r.id]});flags.set(r.id,st);
      }
      const usedO=new Set();
      for(const c of receipts.sort((a,b)=>a.date.localeCompare(b.date))){
        const cand=outs.filter(r=>!usedO.has(r.id)&&dayGap(c.date,r.entry_date)>=-2&&dayGap(c.date,r.entry_date)<=15);
        const m=cand.find(r=>c.veh&&vno(r.vehicle_no)===c.veh)||cand.find(r=>r.pallets===c.p&&r.sheets===c.s)||null;
        if(m)usedO.add(m.id);
        const dp=m?m.pallets-c.p:0,ds=m?m.sheets-c.s:0;
        const st=!m?{c:"bad",t:"Query · return not in our ledger"}:(dp||ds)?{c:"bad",t:"Query · company got "+(dp?num(c.p)+" P ":"")+(ds?num(c.s)+" S":"")+" (we sent "+num(m.pallets)+" P · "+num(m.sheets)+" S)"}:{c:"ok",t:"✓ Match"};
        items.push({key:"OUT:"+(c.doc||c.date+c.veh),kind:"out",date:c.date,inv:c.doc,veh:c.veh,co:[c.p,c.s],coTxt:"Receipt · Leap "+num(c.leap)+(c.own?" · Own "+num(c.own):""),our:m?[m.pallets,m.sheets]:null,ourTxt:m?dmy(m.entry_date)+(m.vehicle_no?" · "+m.vehicle_no:""):"No return entry",st,ids:m?[m.id]:[]});
        if(m)flags.set(m.id,st);
      }
      for(const r of outs.filter(r=>!usedO.has(r.id))){
        const st=dayGap(last,r.entry_date)<=10?{c:"warn",t:"Company receipt pending"}:{c:"bad",t:"Query · company has not shown this return"};
        items.push({key:"OUTE:"+r.id,kind:"out",date:r.entry_date,inv:r.ref_no||"",veh:vno(r.vehicle_no),co:null,coTxt:"Not in statement",our:[r.pallets,r.sheets],ourTxt:dmy(r.entry_date)+(r.vehicle_no?" · "+r.vehicle_no:""),st,ids:[r.id]});flags.set(r.id,st);
      }
      // Purchase bills of the same supplier(s) that the company statement does not show
      const sup=new Set(items.filter(i=>i.kind==="in"&&i.co).map(i=>{const b=bills.find(b=>dig(b.invoice_no)===dig(i.inv));return b?key(b.supplier_name):""}).filter(Boolean));
      const shown=new Set(items.map(i=>dig(i.inv)).filter(Boolean));ins.forEach(r=>shown.add(dig(r.ref_no)));
      for(const b of bills.filter(b=>sup.has(key(b.supplier_name))&&b.received_date>=start&&b.received_date<=last&&!shown.has(dig(b.invoice_no))))
        items.push({key:"BILL:"+(dig(b.invoice_no)||b.id),kind:"in",date:b.received_date,inv:b.invoice_no,veh:vno(b.vehicle_no),co:null,coTxt:"Not in statement",our:null,ourTxt:"Purchase bill · no pallets entered",st:{c:"warn",t:"Bill not in company statement"},ids:[]});
      items.sort((a,b)=>a.date.localeCompare(b.date)||a.kind.localeCompare(b.kind));
      for(const it of items){const rm=remarks.get(it.key);if(rm&&rm.status==="CLOSED"&&it.st.c!=="ok"){it.st={c:"ok",t:"✓ Closed",was:it.st.t};it.ids.forEach(id=>flags.set(id,it.st))}}
      // Balances: company = statement; ours = this ledger from the start date (opening row + in − out)
      const op=upl.opening||{},cl=upl.closing||{};
      const coOpen=[(+op.leap||0)+(+op.chep||0)+(+op.own||0),+op.sheets||0];
      const coIn=[...groups.values()].reduce((a,g)=>[a[0]+g.p,a[1]+g.s],[0,0]),coOut=receipts.reduce((a,c)=>[a[0]+c.p,a[1]+c.s],[0,0]);
      const coBal=[coOpen[0]+coIn[0]-coOut[0],coOpen[1]+coIn[1]-coOut[1]];
      const ourOpen=add(rows.filter(r=>r.entry_type==="COMPANY_IN"&&r.ref_no===OPENING&&r.entry_date<=from)),ourIn=add(ins),ourOut=add(outs);
      const ourBal=[ourOpen[0]+ourIn[0]-ourOut[0],ourOpen[1]+ourIn[1]-ourOut[1]];
      const q=items.filter(i=>i.st.c==="bad").length;
      return mcache={from,to,last,items,flags,q,coOpen,coIn,coOut,coBal,coClose:[(+cl.leap||0)+(+cl.chep||0)+(+cl.own||0),+cl.sheets||0],ourOpen,ourIn,ourOut,ourBal,op,startOk:settings.start_date===from};
    }

    function loadXlsx(){
      if(window.XLSX)return Promise.resolve();
      return new Promise((ok,bad)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";s.onload=ok;s.onerror=()=>bad(Error("Could not load the Excel reader. Check the internet."));document.head.appendChild(s)});

    // Reads the company ILS Excel: header row with "Entry Type"; Opening / Closing Balance rows; period from "From dd/mm/yyyy to dd/mm/yyyy".
    function parseStmt(aoa){
      const N=v=>String(v==null?"":v).toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();
      const toDate=v=>{if(typeof v==="number"&&v>20000&&v<80000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
        const x=String(v||"").trim().match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);return x?x[3]+"-"+x[2].padStart(2,"0")+"-"+x[1].padStart(2,"0"):null};
      const int=v=>{const n=Number(String(v==null?"":v).replace(/,/g,"").trim()||0);return Number.isFinite(n)?Math.round(n):0};
      const hi=aoa.findIndex(r=>r.some(v=>N(v)==="ENTRY TYPE"));
      if(hi<0)throw Error("This does not look like the company ILS statement (no 'Entry Type' column).");
      const H=aoa[hi].map(N),col=f=>H.findIndex(f);
      const c={plant:col(h=>h==="PLANT"),date:col(h=>h==="DATE"),doc:col(h=>h.startsWith("REFERENCE")),type:col(h=>h==="ENTRY TYPE"),sheets:col(h=>h.includes("SHEET")),
        leap:col(h=>h.includes("LEAP")),chep:col(h=>h.includes("CHEP")),own:col(h=>h.includes("OWN")),veh:col(h=>h.includes("VEHICLE")),inv:col(h=>h.startsWith("INV"))};
      if([c.date,c.type,c.sheets,c.leap].some(i=>i<0))throw Error("Columns Date / Entry Type / Inter Layer Sheets / Leap Pallet not found.");
      const g=(r,i)=>i<0?"":r[i];let from=null,to=null;
      for(const r of aoa.slice(0,hi))for(const v of r){const x=String(v||"").match(/from\s+(\d{1,2}\/\d{1,2}\/\d{4})\s+to\s+(\d{1,2}\/\d{1,2}\/\d{4})/i);if(x){from=toDate(x[1]);to=toDate(x[2])}}
      let opening=null,closing=null;const lines=[];
      for(const r of aoa.slice(hi+1)){
        const t=String(g(r,c.type)||"").trim(),T=N(t);if(!t)continue;
        const bal={sheets:int(g(r,c.sheets)),leap:int(g(r,c.leap)),chep:int(g(r,c.chep)),own:int(g(r,c.own))};
        if(T.startsWith("OPENING")){opening=bal;if(!from)from=toDate(g(r,c.date));continue}
        if(T.startsWith("CLOSING")){closing=bal;if(!to)to=toDate(g(r,c.date));continue}
        if(T==="TOTAL")continue;
        const d=toDate(g(r,c.date));if(!d)continue;
        lines.push({line_date:d,plant:String(g(r,c.plant)||""),ref_doc:String(g(r,c.doc)||""),entry_type:t,...bal,vehicle_no:String(g(r,c.veh)||""),inv_no:String(g(r,c.inv)||"")});
      }
      if(!lines.length&&!opening)throw Error("No lines found in the statement.");
      if(!from)from=lines.reduce((m,l)=>!m||l.line_date<m?l.line_date:m,null);
      if(!to)to=lines.reduce((m,l)=>!m||l.line_date>m?l.line_date:m,null);
      if(lines.some(l=>l.line_date<from||l.line_date>to))throw Error("Some lines are outside the statement dates "+dmy(from)+" – "+dmy(to)+".");
      return {from_date:from,to_date:to,opening:opening||{},closing:closing||{},lines};
    }

        busy=true;msg("Uploading…");

      if(!mailSel.size)items.filter(i=>i.st.c==="bad"&&!remarks.get(i.key)).forEach(i=>mailSel.add(i.key));
      let h='<div class="sp-mhead"><h3>✉ Mail queries to company</h3><button type="button" class="sp-x" data-mclose="1" aria-label="Close">✕</button></div><div class="sp-mbody">'+
        '<div class="fx-grid"><div class="wide2"><label for="mTo">To (company email)</label><input id="mTo" type="email" value="'+esc(settings.company_email||"")+'" placeholder="ils@company.com"></div><div class="wide2"><label for="mCc">Cc</label><input id="mCc" value="'+esc(settings.company_cc||"")+'"></div></div>'+
        '<h4>Queries in the mail</h4><div class="ml-list">'+(items.map(i=>{const rm=remarks.get(i.key);return '<label class="ml-it"><input type="checkbox" data-msel="'+esc(i.key)+'"'+(mailSel.has(i.key)?" checked":"")+'><span><b>'+dmy(i.date)+" · "+esc(i.inv||"-")+"</b> "+badge(i.st)+rmBadge(rm)+(rm?"":'<small class="sp-hint"> no remark</small>')+"</span></label>"}).join("")||'<p class="sp-hint">No queries.</p>')+"</div>"+
        '<h4>Mail text <small class="sp-hint">(you can change it)</small></h4><input id="mSub" class="ml-sub"><textarea id="mBody" class="ml-body" rows="12"></textarea></div>'+
        '<div class="sp-mfoot"><button type="button" class="sp-btn" data-mgo="gmail">Open in Gmail</button><button type="button" class="sp-btn light" data-mgo="app">Email app</button><button type="button" class="sp-btn light" data-mgo="copy">Copy</button><button type="button" class="sp-btn light" data-mgo="xl">⬇ Excel</button><button type="button" class="sp-btn light" data-mgo="mark">✓ Mark mailed</button></div>';
      modal(h);fillMail();
    }
    function fillMail(){const t=mailText(mailSel);el("mSub").value=t.subject;el("mBody").value=t.body}
    async function mailGo(kind){
      const to=el("mTo").value.trim(),cc=el("mCc").value.trim(),sub=el("mSub").value,body=el("mBody").value;
      if(!mailSel.size&&kind!=="copy")return ERPShell.toast("Tick at least one query.","error");
      if((to!==(settings.company_email||"")||cc!==(settings.company_cc||""))&&canEdit()){const r=await client.from("lwb_sp_settings").update({company_email:to||null,company_cc:cc||null}).eq("id",1);if(!r.error){settings.company_email=to;settings.company_cc=cc}}
      if(kind==="gmail")window.open("https://mail.google.com/mail/?view=cm&fs=1&to="+encodeURIComponent(to)+"&cc="+encodeURIComponent(cc)+"&su="+encodeURIComponent(sub)+"&body="+encodeURIComponent(body),"_blank");
      else if(kind==="app")location.href="mailto:"+encodeURIComponent(to)+"?cc="+encodeURIComponent(cc)+"&subject="+encodeURIComponent(sub)+"&body="+encodeURIComponent(body);
      else if(kind==="copy"){try{await navigator.clipboard.writeText(sub+"\n\n"+body);ERPShell.toast("Mail text copied.","success")}catch(e){el("mBody").select();ERPShell.toast("Press Ctrl+C to copy.","error")}return}
      else if(kind==="xl"){
        try{await loadXlsx();const {list}=mailText(mailSel);
          const aoa=[["Date","Type","Invoice / Ref","Vehicle","Statement Pallets","Statement Sheets","Our Pallets","Our Sheets","Remark","Remark Pallets","Remark Sheets","Note"]].concat(list.map(i=>{const rm=remarks.get(i.key)||{};
            return [dmy(i.date),i.kind==="in"?"Received":"Returned",i.inv||"",i.veh||"",i.co?i.co[0]:"",i.co?i.co[1]:"",i.our?i.our[0]:"",i.our?i.our[1]:"",RK[rm.kind]||i.st.t,rm.pallets||"",rm.sheets||"",rm.note||""]}));
          const wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(aoa);ws["!cols"]=aoa[0].map(()=>({wch:16}));XLSX.utils.book_append_sheet(wb,ws,"ILS Query");XLSX.writeFile(wb,"ILS-Query-"+today()+".xlsx")}catch(e){ERPShell.toast(e.message,"error")}
        return}
      if(kind!=="mark"&&!await confirm("Mail sent? Mark the "+mailSel.size+" ticked queries as mailed?"))return;
      if(kind==="mark"&&!await confirm("MARK "+mailSel.size+" QUERIES AS MAILED?"))return;
      if(!canEdit())return;
      const keys=[...mailSel],need=keys.filter(k=>!remarks.get(k));
      for(const k of need){const i=matchData().items.find(x=>x.key===k);const r=await client.rpc("lwb_sp_remark_save",{p:{item_key:k,kind:"OTHER",pallets:0,sheets:0,note:i?i.st.t.replace(/^Query · /,""):null,status:"MAILED"}});if(r.error)return ERPShell.toast("Failed: "+r.error.message,"error")}
      const r=await client.rpc("lwb_sp_remark_status",{p_keys:keys,p_status:"MAILED"});
      if(r.error)return ERPShell.toast("Failed: "+r.error.message,"error");
      ERPShell.toast(keys.length+" queries marked as mailed.","success");closeModal();await load();render();
    }

    /* ---------- history ---------- */
    const FIELDS={entry_date:"Date",entry_type:"Type",party_name:"Party",pallets:"Pallets",sheets:"Sheets",ref_no:"Ref No.",vehicle_no:"Vehicle",transporter_name:"Transporter",driver_mobile:"Driver Mobile",note:"Note"};
    const fv=(k,v)=>v==null||v===""?"—":k==="entry_date"?dmy(v):k==="entry_type"?(TYPES[v]||{l:v}).l:String(v);
    function renderHistory(){
      let h='<section class="erp-card"><div class="erp-card-head"><h2>History: Edits and Deletes</h2><small class="sp-hint">Every changed or deleted entry is kept here. Latest 300.</small></div><div style="overflow:auto">';
      if(historyMissing)h+='<p class="sp-hint" style="padding:16px">History is not set up yet. Run the latest lwb_sheet_pallet_setup.sql in Supabase.</p>';
      else h+='<table class="sp-table"><thead><tr><th>When</th><th>Action</th><th>By</th><th>Entry</th><th>Changes</th></tr></thead><tbody>'+
        (history.map(x=>{const o=x.old_row||{},n=x.new_row||{};
          const changes=x.action==="EDIT"?Object.keys(FIELDS).filter(k=>String(o[k]??"")!==String(n[k]??"")).map(k=>FIELDS[k]+": "+esc(fv(k,o[k]))+" → <b>"+esc(fv(k,n[k]))+"</b>").join("<br>"):"Entry deleted";
          return "<tr><td>"+esc(dtTxt(x.changed_at))+'</td><td><span class="tagx '+(x.action==="DELETE"?"out":"p-out")+'">'+(x.action==="DELETE"?"Deleted":"Edited")+"</span></td><td>"+esc(x.changed_by_name||"-")+"</td><td>"+
            esc((TYPES[o.entry_type]||{short:o.entry_type}).short)+" · "+esc(o.party_name||"Company")+"<small>"+dmy(o.entry_date)+" · "+pS(o.pallets,o.sheets)+(o.ref_no?" · "+esc(o.ref_no):"")+"</small></td><td style='white-space:normal;min-width:220px'>"+changes+"</td></tr>"}).join("")||
         '<tr><td colspan="5" class="erp-empty">No edits or deletes yet.</td></tr>')+"</tbody></table>";
      h+="</div></section>";
      const old=allRows.filter(r=>settings.start_date&&r.entry_date<settings.start_date);
      if(old.length)h+='<section class="erp-card" style="margin-top:14px"><div class="erp-card-head"><h2>Old entries before '+dmy(settings.start_date)+' (hidden)</h2><button type="button" class="sp-btn light" id="oldToggle" style="height:34px">'+(showOld?"Hide":"Show "+old.length)+"</button></div>"+
        (showOld?'<div style="overflow:auto">'+entryTable(old.slice().reverse(),false)+"</div>":'<p class="mt-info">Not counted in any balance. Kept for reference only.</p>')+"</section>";
      el("view").innerHTML=h;
    }

    /* ---------- A4 statements ---------- */
    function docHead(title){
      return '<div class="doc"><h1 class="lh" style="font-size:28pt;margin:0 0 2mm">'+esc(settings.distributor_name||"LUXURY WRIST BRAND")+'</h1><div class="rule"></div><h2>'+esc(title)+'</h2><div style="font-size:10pt;color:#444;margin-bottom:3mm">As of '+dmy(today(),"/")+"</div>";
    }
    const docFoot=()=>'<div class="foot">'+lines(settings.letter_footer)+"</div></div>";
    const ptable=html=>html.replace('class="sp-table grid"','class="grid"');
    function summaryHtml(){
      const t=totals(rows),list=partyTotals().filter(x=>x.p[0]||x.p[1]);
      const line=(l,a)=>"<tr><td>"+l+'</td><td class="n">'+num(a[0])+'</td><td class="n">'+num(a[1])+"</td></tr>";
      return docHead("Sheet & Pallet Statement")+
        '<h3>Company</h3><table class="grid"><thead><tr><th></th><th class="n">Pallets</th><th class="n">Sheets</th></tr></thead><tbody>'+line("Received from company",t.ci)+line("Returned to company",t.co)+'</tbody><tfoot>'+line("Balance due to company",t.due)+"</tfoot></table>"+
        '<h3>Market (direct vehicle parties)</h3><table class="grid"><thead><tr><th></th><th class="n">Pallets</th><th class="n">Sheets</th></tr></thead><tbody>'+line("Given to parties",t.po)+line("Returned by parties",t.pi)+'</tbody><tfoot>'+line("Pending in market",t.market)+"</tfoot></table>"+
        '<h3>In warehouse (calculated)</h3><table class="grid"><tbody>'+line("Balance due to company − pending in market",t.hand)+"</tbody></table>"+
        '<h3>Party-wise pending</h3><table class="grid"><thead><tr><th>#</th><th>Party</th><th class="n">Given P / S</th><th class="n">Returned P / S</th><th class="n">Pending Pallets</th><th class="n">Pending Sheets</th></tr></thead><tbody>'+
        (list.map((x,i)=>"<tr><td>"+(i+1)+"</td><td>"+esc(x.name)+'</td><td class="n">'+num(x.g[0])+" / "+num(x.g[1])+'</td><td class="n">'+num(x.r[0])+" / "+num(x.r[1])+'</td><td class="n"><b>'+num(x.p[0])+'</b></td><td class="n"><b>'+num(x.p[1])+"</b></td></tr>").join("")||'<tr><td colspan="6">No party has a pending balance.</td></tr>')+
        '</tbody><tfoot><tr><td></td><td>Total</td><td></td><td></td><td class="n">'+num(t.market[0])+'</td><td class="n">'+num(t.market[1])+"</td></tr></tfoot></table>"+docFoot();
    }
    function renderSummary(){
      el("view").innerHTML='<section class="erp-card"><div class="erp-card-head"><h2>Summary Print (A4)</h2><button type="button" class="sp-btn" id="printSummary">Print Summary</button></div><div class="sp-letter-wrap"><div class="sp-paper">'+summaryHtml()+"</div></div></section>";
    }
    function printDoc(html){el("printArea").innerHTML=html;setTimeout(()=>window.print(),50)}

    function render(){
      document.querySelectorAll("#tabs .erp-pill").forEach(a=>a.classList.toggle("active",a.dataset.tab===tab));
      renderKpis();
      ({entry:renderEntry,company:renderCompany,match:renderMatch,parties:renderParties,letter:renderLetter,summary:renderSummary,opening:renderOpening,history:renderHistory})[tab]();
      if(tab==="entry")el("fSave").disabled=missing;
    }
    function setTab(){const t=location.hash.replace("#","");tab=["entry","company","match","parties","letter","summary","opening","history"].includes(t)?t:"entry";if(ro()&&tab==="entry")tab="company";render()}
    document.addEventListener("change",e=>{
      const id=e.target.id;
      if(id==="fType")syncForm();else if(id==="fOrder")pickOrder();else if(id==="fParty")partyInfo();
      else if(id==="pFilter")renderParties();
      else if(e.target.dataset.msel!=null){const k=e.target.dataset.msel;e.target.checked?mailSel.add(k):mailSel.delete(k);fillMail()}
      else if(id==="mFile"&&e.target.files[0]){const f=e.target.files[0];e.target.value="";uploadStmt(f)}
    });
    document.addEventListener("input",e=>{if(e.target.id==="fParty")partyInfo()});
    document.addEventListener("click",e=>{
      const t=e.target,id=t.id;
      if(id==="fSave")return saveEntry();
      if(t.dataset.mf){matchFilter=t.dataset.mf;return renderMatch()}
      if(t.dataset.query)return toggleQuery(t.dataset.query);
      if(t.dataset.fix)return openFix(t.dataset.fix);
      if(t.dataset.mclose||t.id==="spModal")return closeModal();
      if(t.dataset.rksave)return saveRemark(false);
      if(t.dataset.rkdel)return saveRemark(true);
      if(t.dataset.fxadd)return fixAdd();
      if(t.dataset.fxedit){const id=t.dataset.fxedit;closeModal();return startEdit(id)}
      if(t.dataset.fxdel){const id=t.dataset.fxdel;closeModal();return remove(id)}
      if(id==="mMail")return openMail();
      if(t.dataset.mgo)return mailGo(t.dataset.mgo);
      if(id==="mStart"){const m=matchData();return startFrom(m.from,m.coOpen[0],m.coOpen[1])}
      if(id==="stSave"){const d=el("stDate").value,p=Number(el("stP").value||0),s2=Number(el("stS").value||0);
        if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return ERPShell.toast("Select the start date.","error");
        if(![p,s2].every(n=>Number.isInteger(n)&&n>=0))return ERPShell.toast("Pallets and sheets must be whole numbers.","error");
        return startFrom(d,p,s2)}
      if(id==="stClear")return (async()=>{if(!await confirm("SHOW ALL OLD ENTRIES AGAIN?\n\nBalances will count every entry from the beginning."))return;const r=await client.rpc("lwb_sp_start_from",{p_date:null,p_pallets:0,p_sheets:0});if(r.error)return ERPShell.toast("Failed: "+r.error.message,"error");await load();render()})();
      if(id==="oldToggle"){showOld=!showOld;return renderHistory()}
      if(id==="sSave")return saveSettings();
      if(id==="opSave")return saveOpening();
      if(id==="opAdd"){el("opBody").insertAdjacentHTML("beforeend",openRow());return}
      if(t.dataset.oprm){t.closest("tr").remove();return}
      if(id==="fCancel"){editId="";return renderEntry()}
      if(t.dataset.del)return remove(t.dataset.del);
      if(t.dataset.edit)return startEdit(t.dataset.edit);
      const pr=t.closest("tr[data-party]");if(pr){partyPick=pr.dataset.party;renderParties();return}
      if(id==="rSubmit")return submitReturn();
      if(t.dataset.verify)return verify(t.dataset.verify);
      if(t.dataset.view){letterId=t.dataset.view;renderLetter();return}
      if(t.dataset.print){const r=rows.find(x=>x.id===t.dataset.print);if(r)printDoc(letterHtml(r));return}
      if(id==="printSummary")return printDoc(summaryHtml());
      if(id==="printCompany")return printDoc(docHead("Company Sheet & Pallet Ledger")+ptable(runningTable(companyRows(),"COMPANY_IN","Received","Returned","Balance Due"))+docFoot());
      if(id==="printParty")return printDoc(docHead("Sheet & Pallet Ledger: "+partyPick)+ptable(runningTable(rows.filter(r=>isParty(r.entry_type)&&key(r.party_name)===key(partyPick)),"PARTY_OUT","Given","Returned","Pending"))+docFoot());
    });
    window.addEventListener("hashchange",setTab);
    document.addEventListener("keydown",e=>{if(e.key==="Escape"&&el("spModal")&&!el("spModal").hidden)closeModal()});
    window.addEventListener("afterprint",()=>{el("printArea").innerHTML=""});
    (async()=>{
      me=await start();if(!me)return;
      ERPShell.mount({role:me.realRole||me.role,name:me.name,onLogout:async()=>{await client.auth.signOut();location.replace("login.html")},group:"Dispatch"});
      el("loading").hidden=true;el("page").hidden=false;
      if(ro()){const a=document.querySelector('#tabs [data-tab="entry"]');if(a)a.remove()}
      await load();setTab();
    })();
  </script>
</body>
</html>
