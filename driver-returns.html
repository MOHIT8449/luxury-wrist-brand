<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Driver Returns Approval | Luxury Wrist Brand ERP</title>
<script src="erp-date.js"></script><script src="erp-recent.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="brand-filter.js"></script><script src="page-role.js"></script>
<script src="party-list.js" defer></script>
<script src="tally-note.js" defer></script>
<style>
:root{--navy:#132843;--blue:#1569dc;--line:#dde5f0;--bg:#f1f5fb}
*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:var(--bg);color:#142841}
header{background:var(--navy);color:white;padding:16px max(20px,calc((100vw - 1300px)/2));display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:20px;letter-spacing:1px;margin:0}header small{display:block;color:#c0d3e9;margin-top:7px}
nav{display:flex;gap:10px;flex-wrap:wrap}nav a{border:1px solid #8599b3;color:white;border-radius:8px;padding:9px 12px;text-decoration:none}
main{max-width:1300px;margin:auto;padding:22px}
#message{margin-bottom:14px;padding:12px;border-radius:8px;background:#e3edfb}
#message.error{background:#fde4e4;color:#9c2020}#message.success{background:#e1f6e8;color:#11643c}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.tab{background:white;border:2px solid var(--line);border-radius:12px;padding:12px;text-align:left;cursor:pointer;color:#142841;font:inherit}
.tab small{display:block;color:#58708b;font-size:12px}.tab strong{display:block;font-size:22px;margin-top:4px}
.tab.active{border-color:var(--blue);background:#eef4fe}
.tools{display:flex;gap:10px;margin-bottom:14px}
.only{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding:10px 12px;border:1px solid #f0c36d;background:#fff8e0;border-radius:8px;font-weight:700}.only[hidden]{display:none}
.tools input{flex:1;padding:11px;border:1px solid #bbcbdd;border-radius:8px;font:14px Arial}
button{background:var(--blue);color:white;border:0;border-radius:8px;padding:11px 16px;font-weight:bold;cursor:pointer;font-size:14px}
button.secondary{background:#e8edf4;color:#183450}button.approve{background:#138342}button.reject{background:#b62e2e}
button:disabled{opacity:.5;cursor:not-allowed}
.card{background:white;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;display:grid;grid-template-columns:1fr auto;grid-template-areas:"info amt" "lines lines" "act act";column-gap:12px}
.info{grid-area:info;min-width:0}.amount{grid-area:amt}.lines{grid-area:lines}.actions{grid-area:act}
.party{font-size:16px;font-weight:bold}.meta{color:#58708b;font-size:12px;margin-top:5px;line-height:1.5}
.amount{font-size:20px;font-weight:bold;color:#ae3434;white-space:nowrap;text-align:right}
.amount small{display:block;font-size:11px;color:#58708b;font-weight:normal}
.lines{width:100%;border-collapse:collapse;margin:12px 0 0}
.lines th{background:#eaf0f8;text-align:left;font-size:11px;padding:8px}.lines td{padding:8px;border-bottom:1px solid #edf0f4}
.num{text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:bold;border-radius:12px;padding:3px 8px;background:#fde9d6;color:#7a3a00}
.note{background:#f6f8fb;border-radius:8px;padding:9px;margin-top:8px;font-size:13px}
.actions{display:flex;gap:10px;margin-top:12px}.actions button{flex:1}
.empty{background:white;border:1px dashed #bbcbdd;border-radius:12px;padding:30px;text-align:center;color:#58708b}
.muted{color:#60758b;font-size:12px;line-height:1.5}
.photos{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.photos img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:#eef2f7}
.photos .nophoto{font-size:12px;color:#a05a00}
.viewer{position:fixed;inset:0;z-index:5000;background:#0b1422e6;display:flex;align-items:center;justify-content:center;padding:12px}
.viewer[hidden]{display:none}
.viewer img{max-width:100%;max-height:100%;border-radius:8px}
.viewer button{position:fixed;top:12px;right:12px}
.rcv-bg{position:fixed;inset:0;z-index:4000;background:#0b142299;display:flex;align-items:center;justify-content:center;padding:12px}.rcv-bg[hidden]{display:none}
.rcv-box{background:#fff;border-radius:12px;width:min(520px,100%);max-height:92vh;overflow:auto;padding:14px}
.rcv-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}.rcv-head button{padding:6px 10px}
.rcv-line{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px}
.rcv-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.rcv-chips{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.rcv-chip{background:#fff;color:#142841;border:1px solid #c9d3df;padding:7px 4px;font-size:12.5px;font-weight:600}
.rcv-chip.on{background:#e6f0f0;border-color:#00434d;color:#00434d}
.rcv-warn{color:#a05a00;font-size:12px}
.rcv-sum{background:#f6f8fb;border-radius:8px;padding:8px;font-size:13px;line-height:1.6}.rcv-sum .g{color:#13824a;font-weight:700}.rcv-sum .a{color:#b26b00;font-weight:700}
.rcv-note{width:100%;margin:8px 0;padding:9px;border:1px solid #bbcbdd;border-radius:8px;font:14px Arial}
.rcv-btns{display:flex;gap:8px}.rcv-btns button{flex:1;padding:10px 8px}
@media(min-width:600px){.rcv-chips{grid-template-columns:1fr 2fr 1fr 1fr}}
@media(min-width:900px){
 .tabs{grid-template-columns:repeat(3,200px)}.tab strong{font-size:20px}
 .card{grid-template-columns:270px 1fr 150px;grid-template-areas:"info lines amt" "info lines act";column-gap:20px;padding:14px 18px}
 .lines{margin:0;font-size:13px}.lines th,.lines td{padding:6px 8px}
 .actions{flex-direction:column;gap:8px;margin-top:10px}.actions button{padding:8px 12px;font-size:13px}
 .amount{font-size:18px}
}
@media(max-width:640px){main{padding:12px}.tab{padding:9px}.tab strong{font-size:18px}.lines th,.lines td{padding:6px 4px;font-size:12px}.amount{font-size:17px}}
</style>
<link rel="stylesheet" href="erp-shell.css">
<script src="erp-shell.js" data-auto defer></script>
</head>
<body>
<header><div><h1>LUXURY WRIST BRAND</h1><small>OFFICE / DRIVER RETURN APPROVAL</small></div>
<nav><a href="dashboard.html">Dashboard</a><a href="party-ledger.html">Party Ledger</a></nav></header>
<main>
<div id="message">Connecting to ERP...</div>
<div class="tabs">
<button class="tab active" type="button" data-status="PENDING_OFFICE"><small>Pending</small><strong id="countPENDING_OFFICE">—</strong></button>
<button class="tab" type="button" data-status="APPROVED"><small>Approved</small><strong id="countAPPROVED">—</strong></button>
<button class="tab" type="button" data-status="REJECTED"><small>Rejected</small><strong id="countREJECTED">—</strong></button>
</div>
<div class="only" id="only" hidden><span id="onlyText"></span><button id="onlyAll" class="secondary" type="button">Show all</button></div>
<div class="tools"><input id="search" data-party-list placeholder="Party, PO No, Driver or Vehicle"><button id="refresh" class="secondary" type="button">Refresh</button></div>
<div id="list"></div>
<div class="rcv-bg" id="rcvDlg" hidden role="dialog" aria-modal="true" aria-labelledby="rcvTitle"><div class="rcv-box">
<div class="rcv-head"><b id="rcvTitle">Receive goods</b><button type="button" class="secondary" id="rcvX" aria-label="Close">✕</button></div>
<div class="muted" style="margin:0 0 8px">Where does each SKU go in the godown?</div>
<div id="rcvBody"></div>
<input id="rcvNote" maxlength="300" placeholder="Note (optional)" class="rcv-note">
<div class="rcv-btns"><button type="button" class="secondary" id="rcvCancel">Cancel</button><button type="button" class="approve" id="rcvOk">📦 Receive &amp; update stock</button></div>
</div></div>
<div class="viewer" id="viewer" hidden><img id="viewerImg" alt="Return photo"><button type="button" class="secondary" id="viewerClose">✕ Close</button></div>
<button type="button" class="erp-i" aria-label="Info" title="Info" data-tip="Approve only after checking the damaged goods. Approved amount reduces the party&#x27;s ERP outstanding. Rejected return frees the quantity so the driver can record it again. When the godown receives the goods, each SKU goes into Saleable, Damage / Leakage / Breakage (OLN), Gasless or Expiry stock. GST and Tally are not changed here.">i</button>
</main>
<script>
const SUPABASE_URL="https://txkbhadzdbxpieunfvox.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_W4I3Q5ODf0g17sq5uDml2Q_sLolXYEk";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const el=id=>document.getElementById(id);
const fmt=n=>"₹"+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const REASON={LEAKAGE:"Damage / Leakage / Breakage",BREAKAGE:"Damage / Leakage / Breakage",DAMAGE:"Damage / Leakage / Breakage",GASLESS:"Gasless",LOW_FILL:"Low Fill"};
const STATUSES=["PENDING_OFFICE","APPROVED","REJECTED"];
let role="",status="PENDING_OFFICE",lists={},busy=false,photos=new Map(),photoUrls=new Map(),receipts=new Map();
let BB={get:()=>""},OB=new Map();
const inBrand=r=>!BB.get()||LWBBrand.has(OB.get(r.order_id),BB.get());
const canReceive=()=>role==="warehouse"||role==="manager"||role==="admin";
// Opened from a notification: driver-returns.html?order=<order id> shows only that order's returns.
let onlyOrder=new URLSearchParams(location.search).get("order")||"";
// Returned goods are checked by the Godown Manager (or Sales Head / Admin); Accounts only view them.
const canReview=()=>role==="admin"||role==="warehouse"||role==="manager";
function message(text,type){el("message").textContent=text;el("message").className=type||"";el("message").hidden=!text}
function node(tag,text,cls){const n=document.createElement(tag);if(text!=null)n.textContent=String(text);if(cls)n.className=cls;return n}
function when(v){return LWBDate.dt(v,"—")}
async function init(){
 try{
  const {data,error}=await db.auth.getUser();
  if(error||!data.user){location.href="login.html";return}
  const p=await db.from("user_profiles").select("role,active").eq("id",data.user.id).single();
  if(p.error)throw p.error;
  role=await lwbPageRole(String(p.data.role||"").toLowerCase().trim());
  if(p.data.active!==true||!["admin","accounts","manager","warehouse"].includes(role))throw Error("Only office staff can open Driver Return Approval.");
  if(window.LWBBrand)try{BB=await LWBBrand.mount(db,{into:"main",onChange:render})}catch(e){}
  if(window.LWBBrand)try{U=await LWBBrand.units(db)}catch(e){}
  await load();
 }catch(e){message("Could not start: "+e.message,"error")}
}
async function load(){
 try{
  message("Loading driver returns...");
  const results=await Promise.all(STATUSES.map(s=>db.rpc("lwb_office_list_driver_returns",{p_status:s})));
  results.forEach((r,i)=>{if(r.error)throw r.error;lists[STATUSES[i]]=ERPRecent.sort(Array.isArray(r.data)?r.data:[])});
  if(BB.companies&&BB.companies.length>1)OB=await LWBBrand.orderBrands(db,STATUSES.flatMap(s=>lists[s]).map(r=>r.order_id));
  await Promise.all([loadPhotos(),loadReceipts()]);
  let note=canReview()?"":"View only. Godown Manager, Sales Head or Admin approve / reject returns.";
  if(onlyOrder){
   const s=STATUSES.find(x=>lists[x].some(r=>r.order_id===onlyOrder));
   if(s&&!lists[status].some(r=>r.order_id===onlyOrder))status=s;
   if(canReceive()&&!canReview()&&lists.APPROVED.some(r=>r.order_id===onlyOrder&&!receipts.get(r.id)))status="APPROVED";
   if(!s){onlyOrder="";note="That return was changed or cancelled by the driver. Showing all returns.";history.replaceState(null,"",location.pathname)}
  }
  render();
  message(note);
 }catch(e){message("Unable to load returns: "+e.message+". Run lwb_driver_return_review_setup.sql in Supabase.","error")}
}
// Godown "Goods received" on approved returns (lwb_driver_payment_setup.sql).
async function loadReceipts(){
 receipts=new Map();
 const ids=(lists.APPROVED||[]).map(r=>r.id);
 if(!ids.length)return;
 const {data,error}=await db.rpc("lwb_office_return_receipts",{p_return_ids:ids});
 if(error){receipts=null;return}
 for(const x of data||[])receipts.set(x.return_id,x);
}
// Receive the goods and put each SKU line into stock (lwb_return_stock_setup.sql):
// Saleable / Damage-Leakage-Breakage (one option, OLN; saved as Damage) / Gasless / Expiry, default = the driver's reason.
const PLACES=[["SALEABLE","Saleable"],["DAMAGE","Damage / Leakage / Breakage (OLN)"],["GASLESS","Gasless"],["EXPIRY","Expiry"]];
// In the unit the SKU is sold in: Rajnigandha IC, Coca-Cola CS (+ loose pcs). U = SKU name -> unit.
let U=()=>"CASE";
const csTxt=(pcs,ppc,name)=>LWBBrand.pack(pcs,ppc,U(name));
async function receive(r){
 if(busy||!canReceive())return;
 let lines=null;
 const {data,error}=await db.rpc("lwb_return_receive_lines",{p_return_id:r.id});
 if(!error)lines=data||[];
 if(!lines){ // stock SQL not run yet: old receive (time only)
  const note=await prompt("Goods of "+r.order_no+" received at the godown. Note (optional):","");
  if(note===null)return;
  return doReceive(r,null,note,"lwb_receive_return_goods");
 }
 const oln=b=>b==="LEAKAGE"||b==="BREAKAGE"?"DAMAGE":b;
 const pick=new Map(lines.map(l=>[l.item_id,oln(l.default_bucket)]));
 const dlg=el("rcvDlg"),body=el("rcvBody");
 el("rcvTitle").textContent="Receive goods · "+(r.order_no||"")+" · "+(r.party_name||"");
 const draw=()=>{
  body.replaceChildren();
  for(const l of lines){
   const box=node("div",null,"rcv-line");
   const top=node("div",null,"rcv-top");top.append(node("b",l.sku_name),node("span",csTxt(l.qty_pcs,l.pcs_per_case,l.sku_name)+" · "+(REASON[l.reason]||l.reason),"muted"));
   box.append(top);
   if(!l.sku_id){box.append(node("div","Not in SKU Master: stock will not change for this line.","rcv-warn"));body.append(box);continue}
   const ch=node("div",null,"rcv-chips");
   for(const [k,t] of PLACES){const b=node("button",(pick.get(l.item_id)===k?"✓ ":"")+t,"rcv-chip"+(pick.get(l.item_id)===k?" on":""));b.type="button";b.onclick=()=>{pick.set(l.item_id,k);draw()};ch.append(b)}
   box.append(ch);body.append(box);
  }
  const sale=lines.filter(l=>l.sku_id&&pick.get(l.item_id)==="SALEABLE"),held=lines.filter(l=>l.sku_id&&pick.get(l.item_id)!=="SALEABLE");
  const sum=node("div",null,"rcv-sum");
  sum.append(node("div","Saleable stock: "+(sale.length?sale.map(l=>"+"+csTxt(l.qty_pcs,l.pcs_per_case,l.sku_name)).join(", "):"—"),"g"),
   node("div","Damage / Leakage / Breakage etc.: "+(held.length?held.map(l=>csTxt(l.qty_pcs,l.pcs_per_case,l.sku_name)).join(", "):"—"),"a"));
  body.append(sum);
 };
 draw();el("rcvNote").value="";dlg.hidden=false;setTimeout(()=>{const f=body.querySelector(".rcv-chip.on");if(f)f.focus()},30);
 el("rcvOk").onclick=()=>{dlg.hidden=true;doReceive(r,[...pick].map(([item_id,bucket])=>({item_id,bucket})),el("rcvNote").value,"lwb_receive_return_goods2")};
}
async function doReceive(r,lines,note,fn){
 busy=true;document.querySelectorAll(".actions button").forEach(b=>b.disabled=true);
 try{
  const args=fn==="lwb_receive_return_goods2"?{p_return_id:r.id,p_lines:lines,p_note:String(note||"").trim()||null}:{p_return_id:r.id,p_note:String(note||"").trim()||null};
  const {data,error}=await db.rpc(fn,args);
  if(error)throw error;
  await load();
  const sk=data&&data.skipped&&data.skipped.length?" Not in SKU Master (stock not changed): "+data.skipped.join(", ")+".":"";
  message("Goods received for "+r.order_no+(data&&data.lines?". Stock updated ("+data.lines+" line"+(data.lines>1?"s":"")+").":".")+sk,sk?"error":"success");
 }catch(e){message("Failed: "+e.message,"error");render()}
 finally{busy=false}
}
// Photos the driver took with the phone (lwb_driver_return_photos_setup.sql). Older returns have none.
async function loadPhotos(){
 const ids=STATUSES.flatMap(s=>lists[s].map(r=>r.id));
 photos=new Map();
 if(!ids.length)return;
 const {data,error}=await db.rpc("lwb_office_driver_return_photos",{p_return_ids:ids});
 if(error)return;
 for(const r of data||[])photos.set(r.return_id,r.photo_paths||[]);
 const need=[...photos.values()].flat().filter(p=>!photoUrls.has(p));
 if(!need.length)return;
 const signed=await db.storage.from("lwb-return-photos").createSignedUrls(need,3600);
 for(const x of signed.data||[])if(x.signedUrl)photoUrls.set(x.path,x.signedUrl);
}
function photoStrip(r){
 const paths=photos.get(r.id)||[],box=node("div",null,"photos");
 if(!paths.length){box.append(node("span","No photo attached","nophoto"));return box}
 paths.forEach((p,i)=>{
  const url=photoUrls.get(p);
  if(!url){box.append(node("span","Photo "+(i+1)+" not available","nophoto"));return}
  const img=document.createElement("img");img.src=url;img.alt="Return photo "+(i+1);img.loading="lazy";
  img.onclick=()=>{el("viewerImg").src=url;el("viewer").hidden=false};
  box.append(img);
 });
 return box;
}
el("rcvX").onclick=el("rcvCancel").onclick=()=>{el("rcvDlg").hidden=true};
el("rcvDlg").onclick=e=>{if(e.target===el("rcvDlg"))el("rcvDlg").hidden=true};
el("viewer").onclick=e=>{if(e.target!==el("viewerImg"))el("viewer").hidden=true};
function render(){
 document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.status===status));
 STATUSES.forEach(s=>el("count"+s).textContent=(lists[s]||[]).filter(inBrand).length);
 const q=el("search").value.toLowerCase().trim().split(/\s+/).filter(Boolean);
 const all=(lists[status]||[]).filter(r=>(!onlyOrder||r.order_id===onlyOrder)&&(onlyOrder||inBrand(r)));
 el("only").hidden=!onlyOrder;
 if(onlyOrder){const o=STATUSES.flatMap(x=>lists[x]).find(r=>r.order_id===onlyOrder);el("onlyText").textContent="From notification: "+(o?.order_no||"order")+" · "+(o?.party_name||"")}
 const rows=all.filter(r=>q.every(w=>[r.party_name,r.order_no,r.driver_name,r.vehicle_no].join(" ").toLowerCase().includes(w)));
 const list=el("list");list.replaceChildren();
 if(!rows.length){list.append(node("div",status==="PENDING_OFFICE"?"No pending driver returns.":"No returns here.","empty"));return}
 for(const r of rows){
  const card=node("div",null,"card");
  const info=node("div",null,"info");info.append(node("div",r.party_name||"—","party"),
   node("div",(r.order_no||"")+" · "+when(r.created_at),"meta"),
   node("div","Driver: "+(r.driver_name||"—")+(r.vehicle_no?" · "+r.vehicle_no:""),"meta"));
  const amt=node("div",fmt(r.total_return_amount),"amount");amt.append(node("small","Return value"));
  card.append(info,amt);
  const t=node("table",null,"lines");
  t.innerHTML='<thead><tr><th>SKU</th><th>Reason</th><th class="num">Qty</th><th class="num">₹</th></tr></thead>';
  const body=t.createTBody();
  for(const i of r.items||[]){
   const tr=body.insertRow();
   tr.insertCell().textContent=i.sku;
   const c=tr.insertCell();c.append(node("span",REASON[i.reason]||i.reason,"tag"));
   const q=tr.insertCell();q.className="num";const su=LWBBrand.short(U(i.sku));q.textContent=i.qty+" "+(i.uom==="PCS"?"pcs ("+Number(i.qty_cases).toFixed(2)+" "+su+")":su);
   const a=tr.insertCell();a.className="num";a.textContent=fmt(i.return_amount);
  }
  card.append(t);
  if(r.note)info.append(node("div","Driver note: "+r.note,"note"));
  info.append(photoStrip(r));
  if(status!=="PENDING_OFFICE")info.append(node("div",(status==="APPROVED"?"Approved":"Rejected")+" by "+(r.reviewed_by_name||"—")+" · "+when(r.reviewed_at)+(r.review_note?" · "+r.review_note:""),"meta"));
  if(status==="APPROVED"&&receipts){
   const got=receipts.get(r.id);
   if(got)info.append(node("div","📦 Goods received by "+(got.received_by_name||"—")+" · "+when(got.received_at)+(got.received_note?" · "+got.received_note:""),"meta"));
   else if(canReceive()){const act=node("div",null,"actions"),b=node("button","📦 Receive goods → stock","approve");b.type="button";b.onclick=()=>receive(r);act.append(b);card.append(act)}
   else info.append(node("div","📦 Godown has not received the goods yet","meta"));
  }
  if(status==="PENDING_OFFICE"&&canReview()){
   const act=node("div",null,"actions");
   const ok=node("button","Approve","approve");ok.type="button";ok.onclick=()=>review(r,"APPROVE");
   const no=node("button","Reject","reject");no.type="button";no.onclick=()=>review(r,"REJECT");
   act.append(ok,no);card.append(act);
  }
  list.append(card);
 }
}
async function review(r,action){
 if(!canReview()||busy)return;
 let note="";
 if(action==="APPROVE"){
  if(!await confirm("Approve return of "+fmt(r.total_return_amount)+" for "+r.party_name+" ("+r.order_no+")?\nThis amount will reduce the party's ERP outstanding."))return;
 }else{
  const reason=await prompt("Reason to REJECT this return:");
  if(reason===null)return;
  note=reason.trim();
  if(note.length<3){message("Rejection reason is required.","error");return}
 }
 busy=true;document.querySelectorAll(".actions button").forEach(b=>b.disabled=true);
 try{
  const {error}=await db.rpc("lwb_review_driver_return",{p_return_id:r.id,p_action:action,p_note:note||null});
  if(error)throw error;
  await load();
  message(action==="APPROVE"?"Return APPROVED. Party outstanding reduced by "+fmt(r.total_return_amount)+".":"Return REJECTED. Driver can record it again.","success");
  // Admin also keeps the books: ask for the Tally credit note now (Accounts see it under "Credit note pending")
  if(action==="APPROVE"&&role==="admin"&&window.LWBNote){
   const ok=(lists.APPROVED||[]).filter(x=>x.order_id===r.order_id).reduce((a,x)=>a+Number(x.total_return_amount||0),0);
   LWBNote.check({db,order:{id:r.order_id,order_no:r.order_no,party:r.party_name},approvedReturn:ok||r.total_return_amount,reason:"Return approved",
    say:t=>message(t,"error"),onSaved:x=>message("Credit note "+x.no+" saved for "+r.order_no+".","success")});
  }
 }catch(e){message("Review failed: "+e.message,"error");render()}
 finally{busy=false}
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{status=t.dataset.status;render()});
el("search").addEventListener("input",render);
el("refresh").onclick=load;
el("onlyAll").onclick=()=>{onlyOrder="";history.replaceState(null,"",location.pathname);render()};
init();
</script>
</body>
</html>
