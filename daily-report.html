<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Summary | Luxury Wrist Brand ERP</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="erp-shell.css">
  <script src="erp-shell.js"></script>
  <style>
    .status{text-align:center;padding:80px 20px;font-size:15px;color:#555}
    .ds-sub{margin:-8px 0 14px;color:var(--erp-muted);font-size:15px}
    .ds-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
    .ds-bar input{height:42px;border:1.5px solid var(--erp-line);border-radius:6px;padding:0 10px;font:inherit;font-size:15px}
    .ds-bar button{height:42px;border-radius:6px;padding:0 16px;font-weight:600;font-size:15px;cursor:pointer;border:1px solid var(--erp-line);background:#fff;color:var(--erp-ink)}
    .ds-bar button.main{background:var(--erp-red);border-color:var(--erp-red);color:#fff}
    .ds-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
    .ds-kpi{background:#fff;border:1px solid var(--erp-line);border-radius:8px;padding:16px;border-top:4px solid var(--c,#c8102e)}
    .ds-kpi h3{margin:0 0 6px;font-size:15px;color:#4b5763;font-weight:600}
    .ds-kpi .big{font-size:30px;font-weight:800;color:var(--erp-ink);line-height:1.15}
    .ds-kpi .money{font-size:20px;font-weight:700;margin-top:2px}
    .ds-kpi small{display:block;color:var(--erp-muted);font-size:14px;margin-top:6px}
    .ds-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
    .ds-table{border-collapse:collapse;width:100%;font-size:15px}
    .ds-table th,.ds-table td{border-bottom:1px solid var(--erp-line);padding:10px 12px;text-align:left}
    .ds-table th{background:#f6f7f9;font-size:14px;font-weight:700;color:#2b3440}
    .ds-table td.n,.ds-table th.n{text-align:right;white-space:nowrap}
    .ds-table td small{display:block;color:var(--erp-muted);font-size:13px}
    .ds-table tfoot td{font-weight:800;background:#fafbfc}
    .ds-note{font-size:14px;color:var(--erp-muted);margin:10px 2px 0}
    .ds-err{background:#ffebeb;color:#9b2020;padding:14px 16px;border-radius:8px;margin-bottom:14px;white-space:pre-wrap}
    @media(max-width:1000px){.ds-kpis{grid-template-columns:1fr 1fr}.ds-grid{grid-template-columns:1fr}}
    @media(max-width:520px){.ds-kpis{grid-template-columns:1fr}}
    @media print{.erp-top,.erp-side,.ds-bar{display:none!important}.erp-main{margin:0!important;padding:0!important}}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <div id="loading" class="status">Checking account access...</div>
  <main id="page" class="erp-main" hidden>
    <div class="erp-pagehead"><h1>Daily Summary</h1></div>
    <p class="ds-sub">Ek din me kitne order aaye, kitni delivery hui, kitna paisa aaya aur kitna baki hai. Date badal kar koi bhi din dekh sakte ho.</p>
    <div class="ds-bar">
      <button type="button" id="prev" title="Pichla din">◀</button>
      <input type="date" id="day">
      <button type="button" id="next" title="Agla din">▶</button>
      <button type="button" id="today">Aaj</button>
      <button type="button" class="main" id="reload">Refresh</button>
      <button type="button" id="print">Print</button>
    </div>
    <div id="err" class="ds-err" hidden></div>
    <div id="out"></div>
  </main>
  <script>
    'use strict';
    const client=supabase.createClient("https://txkbhadzdbxpieunfvox.supabase.co","sb_publishable_W4I3Q5ODf0g17sq5uDml2Q_sLolXYEk");
    const el=id=>document.getElementById(id);
    const esc=v=>String(v==null?"":v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    const rs=v=>"₹"+Number(v||0).toLocaleString("en-IN",{maximumFractionDigits:0});
    const num=v=>Number(v||0).toLocaleString("en-IN");
    const today=()=>new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Kolkata"});
    const shift=(d,n)=>{const x=new Date(d+"T12:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
    const nice=d=>new Date(d+"T12:00:00Z").toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

    async function start(){
      const {data:{session}}=await client.auth.getSession();
      if(!session){location.replace("login.html");return null}
      const {data:p}=await client.from("user_profiles").select("full_name,role,active").eq("id",session.user.id).single();
      const role=String((p&&p.role)||"").toLowerCase().trim();
      if(!p||p.active!==true||!["admin","manager","accounts"].includes(role)){location.replace("dashboard.html");return null}
      return {role,name:p.full_name||session.user.email};
    }
    const kpi=(color,title,big,money,small)=>'<div class="ds-kpi" style="--c:'+color+'"><h3>'+title+'</h3><div class="big">'+big+'</div>'+(money?'<div class="money">'+money+"</div>":"")+"<small>"+small+"</small></div>";
    function table(head,rows,foot,empty){
      return '<div style="overflow:auto"><table class="ds-table"><thead><tr>'+head.map(h=>"<th"+(h.n?' class="n"':"")+">"+h.t+"</th>").join("")+"</tr></thead><tbody>"+
        (rows.length?rows.join(""):'<tr><td colspan="'+head.length+'" class="erp-empty">'+empty+"</td></tr>")+"</tbody>"+(foot&&rows.length?"<tfoot>"+foot+"</tfoot>":"")+"</table></div>";
    }
    function render(s){
      const o=s.orders,d=s.delivery,p=s.payments,u=s.outstanding;
      const done=d.delivered+d.partial;
      let h='<div class="ds-kpis">'+
        kpi("#1d5fbf","📥 Order aaye",num(o.count),rs(o.amount),num(o.cases)+" case")+
        kpi("#13824a","🚚 Delivery hui",num(done),rs(d.amount),(d.partial?d.partial+" partial · ":"")+(d.not_delivered?d.not_delivered+" nahi hui · ":"")+num(d.pending_count)+" order delivery baki ("+rs(d.pending_amount)+")")+
        kpi("#b26b00","💰 Paisa aaya",rs(p.verified+p.pending),"",rs(p.verified)+" verified · "+rs(p.pending)+" verify baki"+(d.driver_cash?" · Driver ne liya "+rs(d.driver_cash):""))+
        kpi("#c8102e","📌 Outstanding",rs(u.total),"",num(u.parties)+" party ka baki (is din tak)")+
        "</div>";
      const dr=d.by_driver||[];
      h+='<section class="erp-card"><div class="erp-card-head"><h2>Driver ke hisab se delivery</h2><small style="color:var(--erp-muted)">'+esc(nice(s.date))+'</small></div>'+
        table([{t:"Driver"},{t:"Delivered",n:1},{t:"Partial",n:1},{t:"Nahi hui",n:1},{t:"Order amount",n:1},{t:"Driver ne paisa liya",n:1},{t:"Orders"}],
          dr.map(x=>"<tr><td><b>"+esc(x.driver)+"</b><small>"+esc(x.mobile||"")+'</small></td><td class="n">'+x.delivered+'</td><td class="n">'+x.partial+'</td><td class="n">'+x.not_delivered+'</td><td class="n">'+rs(x.amount)+'</td><td class="n">'+rs(x.cash)+"</td><td style='white-space:normal'>"+esc(x.orders)+"</td></tr>"),
          '<tr><td>Total</td><td class="n">'+d.delivered+'</td><td class="n">'+d.partial+'</td><td class="n">'+d.not_delivered+'</td><td class="n">'+rs(d.amount)+'</td><td class="n">'+rs(d.driver_cash)+"</td><td></td></tr>",
          "Is din koi delivery report nahi aayi.")+"</section>";
      h+='<div class="ds-grid"><section class="erp-card"><div class="erp-card-head"><h2>Paisa aaya (mode)</h2></div>'+
        table([{t:"Mode"},{t:"Entry",n:1},{t:"Amount",n:1}],(p.by_mode||[]).map(x=>"<tr><td>"+esc(x.mode)+'</td><td class="n">'+x.count+'</td><td class="n">'+rs(x.amount)+"</td></tr>"),
          '<tr><td>Total</td><td class="n">'+p.count+'</td><td class="n">'+rs(p.verified+p.pending)+"</td></tr>","Is din koi payment entry nahi.")+"</section>"+
        '<section class="erp-card"><div class="erp-card-head"><h2>Order aaye (sales person)</h2></div>'+
        table([{t:"Sales person"},{t:"Order",n:1},{t:"Amount",n:1}],(o.by_sales||[]).map(x=>"<tr><td>"+esc(x.name)+'</td><td class="n">'+x.count+'</td><td class="n">'+rs(x.amount)+"</td></tr>"),
          '<tr><td>Total</td><td class="n">'+o.count+'</td><td class="n">'+rs(o.amount)+"</td></tr>","Is din koi order nahi aaya.")+"</section></div>";
      h+='<section class="erp-card" style="margin-top:14px"><div class="erp-card-head"><h2>Sabse zyada baki (Top 10 party)</h2><small style="color:var(--erp-muted)"><a href="party-ledger.html">Party Ledger kholo</a></small></div>'+
        table([{t:"#"},{t:"Party"},{t:"Baki",n:1}],(u.top||[]).map((x,i)=>"<tr><td>"+(i+1)+"</td><td>"+esc(x.party)+'</td><td class="n"><b>'+rs(x.amount)+"</b></td></tr>"),"","Koi outstanding nahi.")+"</section>";
      h+='<p class="ds-note">Driver ne jo paisa liya wo sirf report hai; office verify karega tab ledger me aayega. "Paisa aaya" me Payment Collection ki entries hain (verified + verify baki). Outstanding = bill − return − verified payment + opening balance, chuni date tak.</p>';
      el("out").innerHTML=h;
    }
    async function load(){
      const d=el("day").value||today();
      el("err").hidden=true;el("out").innerHTML='<p class="status" style="padding:30px">Load ho raha hai...</p>';
      const {data,error}=await client.rpc("lwb_daily_summary",{p_date:d});
      if(error){el("out").innerHTML="";el("err").hidden=false;
        el("err").textContent=/lwb_daily_summary|function|schema cache/i.test(error.message)?"Daily Summary abhi Supabase me setup nahi hai. Supabase SQL Editor me lwb_daily_summary_setup.sql ek baar chalao, phir Refresh dabao.\n("+error.message+")":error.message;return}
      render(data);
    }
    const go=n=>{el("day").value=shift(el("day").value||today(),n);load()};
    el("prev").onclick=()=>go(-1);el("next").onclick=()=>go(1);
    el("today").onclick=()=>{el("day").value=today();load()};
    el("reload").onclick=load;el("day").onchange=load;el("print").onclick=()=>window.print();
    (async()=>{
      const me=await start();if(!me)return;
      ERPShell.mount({role:me.role,name:me.name,onLogout:async()=>{await client.auth.signOut();location.replace("login.html")}});
      el("loading").hidden=true;el("page").hidden=false;
      el("day").value=today();load();
    })();
  </script>
</body>
</html>
