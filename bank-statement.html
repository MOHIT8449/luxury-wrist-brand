<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank Statement | Luxury Wrist Brand ERP</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="erp-date.js"></script>
  <link rel="stylesheet" href="erp-shell.css">
  <script src="erp-shell.js"></script>
  <script src="excel-io.js"></script>
  <script src="party-pay.js"></script>
  <style>
    .status{text-align:center;padding:80px 20px;font-size:15px;color:#555}
    [hidden]{display:none!important}
    .bs-msg{padding:10px 12px;border-radius:8px;margin:0 0 10px;background:#fdf0dc;color:#7a4700;white-space:pre-wrap;font-size:14px}
    .bs-msg.ok{background:#e3f5ec;color:#0f5f37}.bs-msg.bad{background:#ffebeb;color:#9b2020}
    .bs-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}
    .bs-top h1{margin:0;font-size:20px;flex:1 1 auto}
    .bs-top select{height:38px;border:1.5px solid var(--erp-line);border-radius:8px;padding:0 8px;font:inherit;font-size:14px;background:#fff;max-width:230px;min-width:0}
    .bs-btn{height:38px;border-radius:8px;padding:0 13px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;border:1px solid var(--erp-line);background:#fff;color:var(--erp-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
    .bs-btn.pri{background:#1769d8;border-color:#1769d8;color:#fff}
    .bs-btn.grn{background:#13824a;border-color:#13824a;color:#fff}
    .bs-btn.sm{height:30px;padding:0 9px;font-size:13px}
    .bs-btn:disabled{opacity:.55;cursor:default}
    .bs-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 10px}
    .bs-kpi{background:#fff;border:1px solid var(--erp-line);border-radius:10px;padding:9px 12px;min-width:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
    .bs-kpi h3{margin:0 0 2px;font-size:12.5px;color:#4b5763;font-weight:600}
    .bs-kpi .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
    .bs-kpi small{display:block;color:var(--erp-muted);font-size:12px}
    .bs-kpi.amb{background:#fff7e8;border-color:#f3d79c}
    .bs-card{background:#fff;border:1px solid var(--erp-line);border-radius:10px;padding:10px 12px;min-width:0;margin:0 0 10px}
    .bs-card h2{margin:0 0 8px;font-size:15.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .bs-card h2 small{font-weight:400;color:var(--erp-muted);font-size:12.5px}
    .bs-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 8px;margin:0 0 8px}
    .bs-map label{font-size:12px;font-weight:700;color:#3b4652;display:flex;flex-direction:column;gap:3px;min-width:0}
    .bs-map select{height:34px;border:1.5px solid var(--erp-line);border-radius:8px;padding:0 6px;font:inherit;font-size:13.5px;background:#fff;min-width:0}
    .bs-row1{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .bs-row1 .grow{flex:1 1 200px;min-width:0;font-size:13.5px;color:#3b4652}
    .bs-tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 8px;scrollbar-width:none}
    .bs-tabs button{height:34px;border-radius:8px;border:1.5px solid var(--erp-line);background:#fff;font:inherit;font-size:14px;padding:0 11px;cursor:pointer;white-space:nowrap;color:var(--erp-ink);flex:0 0 auto}
    .bs-tabs button[aria-pressed=true]{background:#13283f;border-color:#13283f;color:#fff;font-weight:700}
    .bs-tabs .cnt{display:inline-block;margin-left:5px;background:#c8102e;color:#fff;border-radius:99px;font-size:11.5px;padding:0 6px;line-height:18px}
    .bs-filter{display:flex;gap:6px;align-items:center;margin:0 0 6px;flex-wrap:wrap}
    .bs-filter input[type=search]{flex:1 1 160px;min-width:0;height:34px;border:1.5px solid var(--erp-line);border-radius:8px;padding:0 9px;font:inherit;font-size:15px}
    .bs-filter select{height:34px;border:1.5px solid var(--erp-line);border-radius:8px;padding:0 6px;font:inherit;font-size:13.5px;background:#fff}
    .bs-list{display:flex;flex-direction:column}
    .bs-r{display:grid;grid-template-columns:24px 82px minmax(0,1fr) 116px auto;gap:4px 10px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--erp-line);font-size:13.5px}
    .bs-r.head{font-size:12px;font-weight:700;color:#4b5763;padding:4px 2px;background:#f6f8fb;border-radius:6px}
    .bs-r.sel{background:#eef5ff}
    .bs-r input[type=checkbox]{width:18px;height:18px;margin:0;cursor:pointer}
    .bs-r .d{white-space:nowrap;font-variant-numeric:tabular-nums}
    .bs-r .n{min-width:0;overflow-wrap:anywhere;line-height:1.35}
    .bs-r .n small{display:block;color:var(--erp-muted);font-size:12px}
    .bs-r .n .pd{display:none}
    .bs-r .n small.lk{color:#1d4f9a;font-weight:600}
    .bs-r .x{align-items:center}
    .bs-r .a{text-align:right;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
    .bs-r .a.in{color:#13824a}.bs-r .a.out{color:#b3122b}
    .bs-r .x{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
    .tag{display:inline-block;border-radius:99px;padding:0 7px;font-size:11.5px;font-weight:700;line-height:19px;white-space:nowrap}
    .t-grn{background:#e3f5ec;color:#13824a}.t-blu{background:#e8f0fd;color:#1d4f9a}.t-amb{background:#fff1d6;color:#8a5300}.t-gry{background:#eef0f3;color:#4b5763}
    .bs-empty{color:var(--erp-muted);font-size:14px;padding:12px 2px}
    .bs-more{text-align:center;padding:8px}
    .bs-bar{position:sticky;bottom:0;z-index:20;background:#13283f;color:#fff;border-radius:10px;padding:8px 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;box-shadow:0 -6px 20px rgba(0,0,0,.15)}
    .bs-bar .sum{font-size:13.5px;font-weight:700;flex:0 0 auto;white-space:nowrap}
    .bs-bar select,.bs-bar input{height:36px;border:0;border-radius:8px;padding:0 8px;font:inherit;font-size:14px;background:#fff;color:var(--erp-ink);min-width:0}
    .bs-bar select{flex:0 1 170px}.bs-bar input{flex:1 1 150px}
    .bs-bar .bs-btn{height:36px}
    .bs-pv{width:100%;border-collapse:collapse;font-size:12.5px}
    .bs-pv th,.bs-pv td{padding:4px 5px;border-bottom:1px solid var(--erp-line);text-align:left;vertical-align:top}
    .bs-pv td.n{text-align:right;white-space:nowrap}
    .bs-pv td:nth-child(2){overflow-wrap:anywhere}
    .bs-cols{margin:0 0 8px}.bs-cols summary{cursor:pointer;font-size:13.5px;font-weight:700;color:#3b4652;padding:2px 0 6px}.bs-cols summary small{font-weight:400;color:var(--erp-muted)}
    .bs-back{position:fixed;inset:0;background:rgba(15,23,35,.5);z-index:4000;display:flex;align-items:center;justify-content:center;padding:12px}
    .bs-sheet{background:#fff;border-radius:14px;width:min(520px,100%);max-height:calc(100dvh - 24px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25)}
    .bs-sheet header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--erp-line)}
    .bs-sheet header h3{margin:0;font-size:16px;flex:1}
    .bs-sheet header button{border:0;background:#f1f3f6;border-radius:8px;width:34px;height:34px;font-size:17px;cursor:pointer}
    .bs-sheet .body{padding:12px 14px;overflow:auto;display:flex;flex-direction:column;gap:8px}
    .bs-cand{border:1px solid var(--erp-line);border-radius:9px;padding:8px 10px;display:flex;gap:8px;align-items:center}
    .bs-cand div{flex:1;min-width:0;font-size:13.5px}.bs-cand small{display:block;color:var(--erp-muted);font-size:12px}
    .bs-hint{font-size:13px;color:var(--erp-muted);margin:0 0 6px}
    .bs-types{display:flex;flex-wrap:wrap;gap:6px}
    .bs-types button{height:34px;border-radius:8px;border:1.5px solid var(--erp-line);background:#fff;font:inherit;font-size:13.5px;padding:0 10px;cursor:pointer;color:var(--erp-ink)}
    .bs-types button[aria-pressed=true]{background:#13283f;border-color:#13283f;color:#fff;font-weight:700}
    .bs-bk label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;font-weight:700;color:#3b4652}
    .bs-bk label[hidden]{display:none}
    .bs-bk input,.bs-bk select{height:38px;border:1.5px solid var(--erp-line);border-radius:8px;padding:0 9px;font:inherit;font-size:15px;font-weight:400;background:#fff;color:var(--erp-ink);min-width:0;width:100%}
    .bs-bk .amt{font-size:20px;font-weight:800}.bs-bk .amt.in{color:#13824a}.bs-bk .amt.out{color:#b3122b}
    .bs-bk .acts{display:flex;gap:6px;justify-content:flex-end}
    .bs-bk .cap{font-size:12.5px;font-weight:700;color:#3b4652;margin:0 0 3px}
    .bs-bk .note{font-size:12.5px;color:var(--erp-muted)}
    .bs-bk label{position:relative}
    .bs-ta{position:absolute;left:0;right:0;top:100%;z-index:5;margin-top:2px;background:#fff;border:1.5px solid var(--erp-line);border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.14);max-height:240px;overflow:auto}
    .bs-ta button{display:block;width:100%;text-align:left;border:0;background:#fff;padding:7px 10px;font:inherit;font-size:14px;font-weight:400;cursor:pointer;color:var(--erp-ink)}
    .bs-ta button small{display:block;font-size:11.5px;color:var(--erp-muted)}
    .bs-ta button.on,.bs-ta button:hover{background:#e8f0fd}
    @media(max-width:760px){
      .bs-kpis{grid-template-columns:1fr 1fr}
      .bs-r{grid-template-columns:22px minmax(0,1fr) auto;gap:2px 8px}
      .bs-r.head{display:none}
      .bs-r .d{display:none}
      .bs-r .n .pd{display:inline}
      .bs-r .x{grid-column:2/-1;justify-content:flex-start}
      .bs-r .x:empty{display:none}
      .bs-row1 .grow{flex:1 1 100%}
      body.has-bnav .bs-bar{bottom:calc(66px + env(safe-area-inset-bottom))}
      body.has-bnav.kb-open .bs-bar{bottom:0}
      .bs-bar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto auto;gap:6px}
      .bs-bar .sum{grid-column:1/3;white-space:normal;font-size:13px}
      .bs-bar #bSave{grid-column:3;grid-row:1}.bs-bar #bClear{grid-column:4;grid-row:1}
      .bs-bar select,.bs-bar input{grid-row:2;width:100%}
      .bs-bar #bType{grid-column:1}.bs-bar #bParty,.bs-bar #bHead{grid-column:2/-1}
      .bs-bar #bParty:not([hidden])+#bHead:not([hidden]){grid-column:1/-1;grid-row:3}
    }
  </style>
</head>
<body>
  <div id="loading" class="status">Loading…</div>
  <main id="page" class="erp-main" hidden>
    <div class="bs-top">
      <h1>Bank Statement</h1>
      <select id="bank" aria-label="Bank"></select>
      <label class="bs-btn pri" id="upBtn" hidden>⬆ Upload statement<input type="file" id="file" accept=".xlsx,.xls,.csv" hidden></label>
      <a class="bs-btn" href="accounts-dashboard.html">Accounts</a>
    </div>
    <div id="msg" class="bs-msg" hidden></div>
    <section id="preview" class="bs-card" hidden></section>
    <div class="bs-kpis" id="kpis"></div>
    <section class="bs-card">
      <div class="bs-tabs" id="tabs">
        <button type="button" data-t="OPEN">Suspense<span class="cnt" id="cOpen" hidden></span></button>
        <button type="button" data-t="MATCHED">Matched</button>
        <button type="button" data-t="ASSIGNED">Booked</button>
        <button type="button" data-t="IGNORED">Ignored</button>
        <button type="button" data-t="UP">Uploads</button>
      </div>
      <div id="body"></div>
    </section>
  </main>
  <script>
    'use strict';
    const client=supabase.createClient("https://txkbhadzdbxpieunfvox.supabase.co","sb_publishable_W4I3Q5ODf0g17sq5uDml2Q_sLolXYEk");
    const el=id=>document.getElementById(id);
    const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const r2=n=>Math.round((Number(n)||0)*100)/100;
    const rs=v=>(r2(v)<0?"−":"")+"₹"+Math.abs(r2(v)).toLocaleString("en-IN",{maximumFractionDigits:2});
    const dmy=d=>d?String(d).slice(8,10)+"/"+String(d).slice(5,7)+"/"+String(d).slice(0,4):"";
    const key=s=>String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
    const errText=e=>{const m=String(e&&e.message||e||"Something went wrong");
      if(/lwb_bank_stmt|schema cache|does not exist/i.test(m))return "Bank Statement database is not set up yet. It sets itself up when this change is merged (lwb_bank_statement_setup.sql).";
      return m.replace(/^.*?ERROR:\s*/,"")};
    const HOW={CONTRA:"Contra (bank transfer)",AUTO:"Matched by itself",MATCH:"Matched",PARTY:"Party payment",DEPOSIT:"Cash deposit",WITHDRAW:"Cash withdrawn",IN:"Other income",OUT:"Expense",IGNORE:"Ignored"};
    const SRC={ENTRY:"Accounts entry",PAYMENT:"Party payment",DRIVER_ONLINE:"Driver money",DRIVER_CASH:"Driver money",OLD:"Old payment"};
    let D=null,bankId=null,tab="OPEN",dir="all",q="",days=90,sel=new Set(),parties=[],suppliers=[],pending=null,shown=200;

    function say(t,kind){el("msg").hidden=!t;el("msg").textContent=t||"";el("msg").className="bs-msg"+(kind?" "+kind:"")}
    async function rpc(name,args){const {data,error}=await client.rpc(name,args);if(error)throw Error(errText(error));return data}
    const shift=(d,n)=>{const x=new Date(d+"T12:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
    const today=()=>new Date(Date.now()+330*60e3).toISOString().slice(0,10);

    async function load(){
      try{D=await rpc("lwb_bank_stmt_list",{p_bank_id:bankId,p_from:shift(today(),-days),p_to:today()})}
      catch(e){say(errText(e),"bad");return}
      if(D.banks.length&&!D.banks.some(b=>b.id===D.bank_id)){bankId=D.banks[0].id;return load()}
      if(!bankId){const busy=D.banks.filter(b=>b.open>0).sort((x,y)=>y.open-x.open)[0];if(busy&&busy.id!==D.bank_id){bankId=busy.id;return load()}}
      bankId=D.bank_id;
      const ids=new Set(D.lines.filter(l=>l.status==="OPEN").map(l=>l.id));sel.forEach(i=>{if(!ids.has(i))sel.delete(i)});
      render();
    }
    function render(){
      el("bank").innerHTML=D.banks.length?D.banks.map(b=>'<option value="'+b.id+'"'+(b.id===bankId?" selected":"")+'>'+esc(b.name)+(b.account_no&&!String(b.name).includes(String(b.account_no).slice(-4))?" · "+esc(String(b.account_no).slice(-4)):"")+(b.open?" ("+b.open+")":"")+'</option>').join(""):'<option value="">No bank added</option>';
      el("upBtn").hidden=!D.is_admin||!D.banks.length;
      if(!D.banks.length)say("Add your bank account first on Accounts Dashboard > Heads & Banks.","");
      const L=D.lines,open=L.filter(l=>l.status==="OPEN"),oi=open.filter(l=>+l.credit>0),oo=open.filter(l=>+l.debit>0);
      const sum=a=>a.reduce((s,l)=>s+Number(l.credit)+Number(l.debit),0);
      const b=D.banks.find(x=>x.id===bankId)||{};
      el("kpis").innerHTML=
        '<button type="button" class="bs-kpi'+(oi.length?" amb":"")+'" data-go="OPEN" data-dir="in"><h3>Suspense · money in</h3><div class="v">'+rs(sum(oi))+'</div><small>'+oi.length+' lines not booked</small></button>'+
        '<button type="button" class="bs-kpi'+(oo.length?" amb":"")+'" data-go="OPEN" data-dir="out"><h3>Suspense · money out</h3><div class="v">'+rs(sum(oo))+'</div><small>'+oo.length+' lines not booked</small></button>'+
        '<button type="button" class="bs-kpi" data-go="MATCHED"><h3>Matched with ERP</h3><div class="v">'+L.filter(l=>l.status==="MATCHED").length+'</div><small>Last '+days+' days</small></button>'+
        '<button type="button" class="bs-kpi" data-go="UP"><h3>Statement up to</h3><div class="v">'+(b.last_date?dmy(b.last_date):"—")+'</div><small>'+(D.imports.length?D.imports.length+" uploads":"Nothing uploaded yet")+'</small></button>';
      el("cOpen").hidden=!open.length;el("cOpen").textContent=open.length;
      renderTab();
    }
    function renderTab(){
      el("tabs").querySelectorAll("[data-t]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.t===tab)));
      if(tab==="UP")return renderUploads();
      const words=key(q)?q.toUpperCase().split(/\s+/).filter(Boolean):[];
      let list=D.lines.filter(l=>l.status===tab&&(dir==="all"||(dir==="in"?+l.credit>0:+l.debit>0))&&
        (!words.length||words.every(w=>(String(l.narration||"")+" "+(l.ref||"")+" "+(l.party||"")+" "+(+l.credit||+l.debit)).toUpperCase().includes(w))));
      const admin=D.is_admin&&tab==="OPEN";
      const vis=list.slice(0,shown);
      el("body").innerHTML='<div class="bs-filter"><input type="search" id="q" placeholder="Search narration, ref, party, amount" value="'+esc(q)+'" autocomplete="off">'+
        '<select id="dir" aria-label="In or out"><option value="all">In + Out</option><option value="in"'+(dir==="in"?" selected":"")+'>Money in</option><option value="out"'+(dir==="out"?" selected":"")+'>Money out</option></select>'+
        (tab==="OPEN"?"":'<select id="days" aria-label="Days">'+[30,90,180,365].map(n=>'<option value="'+n+'"'+(n===days?" selected":"")+'>Last '+n+' days</option>').join("")+'</select>')+'</div>'+
        (admin&&list.length?'<div class="bs-hint">Press <b>✍ Book</b> on a line to say whose payment or which expense it is. To book many lines the same way, tick them and use the bar below.</div>':"")+
        (list.length?'<div class="bs-list"><div class="bs-r head">'+(admin?'<input type="checkbox" id="all" aria-label="Tick all shown"'+(vis.length&&vis.every(l=>sel.has(l.id))?" checked":"")+'>':"<span></span>")+'<span>Date</span><span>Narration</span><span style="text-align:right">Amount</span><span></span></div>'+
          vis.map(l=>row(l,admin)).join("")+'</div>'+(list.length>shown?'<div class="bs-more"><button type="button" class="bs-btn sm" id="more">Show '+Math.min(200,list.length-shown)+' more of '+(list.length-shown)+'</button></div>':"")
        :'<div class="bs-empty">'+(tab==="OPEN"?(D.lines.length?"Suspense is empty. Every line is booked.":"Upload the bank statement (Excel / CSV) to start."):"Nothing here.")+'</div>')+
        (admin?'<div id="bar"></div>':"");
      el("q").oninput=e=>{q=e.target.value;const p=e.target.selectionStart;renderTab();const n=el("q");n.focus();n.setSelectionRange(p,p)};
      el("dir").onchange=e=>{dir=e.target.value;renderTab()};
      if(el("days"))el("days").onchange=e=>{days=Number(e.target.value);load()};
      if(el("more"))el("more").onclick=()=>{shown+=200;renderTab()};
      if(el("all"))el("all").onchange=e=>{vis.forEach(l=>e.target.checked?sel.add(l.id):sel.delete(l.id));renderTab()};
      el("body").querySelectorAll("[data-ck]").forEach(c=>c.onchange=()=>{c.checked?sel.add(c.dataset.ck):sel.delete(c.dataset.ck);c.closest(".bs-r").classList.toggle("sel",c.checked);drawBar()});
      el("body").querySelectorAll("[data-bk]").forEach(b=>b.onclick=()=>bookOne(D.lines.find(l=>l.id===b.dataset.bk)));
      el("body").querySelectorAll("[data-sg]").forEach(b=>b.onclick=()=>suggest(D.lines.find(l=>l.id===b.dataset.sg)));
      el("body").querySelectorAll("[data-undo]").forEach(b=>b.onclick=()=>undo(D.lines.find(l=>l.id===b.dataset.undo),b));
      if(admin)drawBar();
    }
    function guessParty(l){const n=key(l.narration);if(n.length<5)return "";
      let best="";for(const p of parties){const k=key(p);if(k.length>=5&&n.includes(k.slice(0,Math.min(14,k.length)))&&k.length>key(best).length)best=p}return best}
    function row(l,admin){
      const amt=+l.credit>0?'<span class="a in">+'+rs(l.credit)+'</span>':'<span class="a out">−'+rs(l.debit)+'</span>';
      const sub=[l.ref?"Ref "+esc(l.ref):"",l.balance!=null?"Bal "+rs(l.balance):""].filter(Boolean).join(" · ");
      let x="",info="";
      if(l.status==="OPEN"){
        if(D.is_admin)x+='<button type="button" class="bs-btn sm pri" data-bk="'+l.id+'">✍ Book</button>';
        if(l.sugg&&l.sugg.length)x+='<button type="button" class="bs-btn sm" data-sg="'+l.id+'">🔗 Match'+(l.sugg.length>1?" ("+l.sugg.length+")":"")+'</button>';
        const g=+l.credit>0&&guessParty(l);if(g)x+='<span class="tag t-blu" title="Party name found in the narration">👤 '+esc(g)+'</span>';
      }else{
        const k=l.linked||{};
        x='<span class="tag '+(l.status==="MATCHED"?"t-grn":l.status==="IGNORED"?"t-gry":"t-blu")+'">'+esc(HOW[l.how]||l.status)+'</span>';

    function guessSupplier(l){const n=key(l.narration);if(n.length<5)return null;let best=null;
      for(const x of suppliers){const k=key(x.name);if(k.length>=5&&n.includes(k.slice(0,Math.min(12,k.length)))&&(!best||k.length>key(best.name).length))best=x}return best}
    // small list under the box, only the names that match what is typed (not the whole list)
    function typeahead(inp,items,o={}){
      const box=document.createElement("div");box.className="bs-ta";box.hidden=true;inp.after(box);
      let hits=[],hi=-1;
      const draw=()=>{const words=String(inp.value||"").toUpperCase().split(/\s+/).filter(Boolean),all=words.length||o.empty?items():[];
        hits=all.filter(x=>{const k=x.label.toUpperCase();return words.every(w=>k.includes(w))})
          .sort((x,y)=>(y.label.toUpperCase().startsWith(words[0]||"")-x.label.toUpperCase().startsWith(words[0]||""))||x.label.localeCompare(y.label)).slice(0,o.max||6);
        if(hits.length===1&&key(hits[0].label)===key(inp.value))hits=[];
        hi=hits.length?0:-1;
        box.innerHTML=hits.map((x,i)=>'<button type="button" tabindex="-1" data-h="'+i+'"'+(i===hi?' class="on"':"")+'>'+esc(x.label)+(x.sub?'<small>'+esc(x.sub)+'</small>':"")+'</button>').join("");
        box.hidden=!hits.length||document.activeElement!==inp};
      const pick=i=>{inp.value=hits[i].label;box.hidden=true;hits=[];inp.dispatchEvent(new Event("change"))};
      inp.addEventListener("input",draw);inp.addEventListener("focus",draw);
      inp.addEventListener("blur",()=>setTimeout(()=>{box.hidden=true},150));
      box.addEventListener("mousedown",e=>{const b=e.target.closest("[data-h]");if(b){e.preventDefault();pick(Number(b.dataset.h))}});
      inp.addEventListener("keydown",e=>{if(box.hidden)return;
        if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();hi=(hi+(e.key==="ArrowDown"?1:-1)+hits.length)%hits.length;
          box.querySelectorAll("[data-h]").forEach((b,i)=>b.classList.toggle("on",i===hi))}
        else if(e.key==="Enter"&&hi>=0){e.preventDefault();e.stopPropagation();pick(hi)}
        else if(e.key==="Escape"){e.stopPropagation();box.hidden=true}});
      return {open:()=>!box.hidden};
    }

    async function save(L,type,party,head,btn,one){

      if(!one&&!await ERPShell.confirm("Book "+L.length+" line"+(L.length>1?"s":"")+" ("+rs(sum)+") as "+what+"?"))return;
      const p={type};if(type==="PARTY"||type==="IN"||type==="OUT")p.party=party||null;if(type==="IGNORE")p.note=party||null;if(head)p.category_id=Number(head);
      btn.disabled=true;

        else ERPShell.toast&&ERPShell.toast(r.done+" line"+(r.done>1?"s":"")+" booked");

    const F=[
      {k:"date",t:"Date",req:1,syn:["TXNDATE","TRANSACTIONDATE","TRANDATE","TRANSDATE","DATE","POSTDATE","POSTINGDATE","TXNPOSTEDDATE","BOOKINGDATE","VALUEDATE","VALUEDT"]},
      {k:"narration",t:"Narration",syn:["NARRATION","DESCRIPTION","PARTICULARS","TRANSACTIONREMARKS","TRANSACTIONDESCRIPTION","TRANSACTIONDETAILS","TRANSACTIONPARTICULARS","REMARKS","DETAILS"]},
      {k:"ref",t:"Ref / Cheque no.",syn:["CHQREFNO","CHQREFNUMBER","REFNOCHEQUENO","CHEQUENO","CHEQUENUMBER","CHQNO","CHQNUMBER","REFNO","REFERENCENO","REFERENCENUMBER","REFERENCE","UTRNO","UTR","CHEQUEREFNO","TRANSACTIONID","TRANID"]},

      {k:"credit",t:"Deposit / Credit",syn:["DEPOSITAMT","DEPOSITAMOUNT","DEPOSITAMOUNTINR","DEPOSIT","DEPOSITS","DEPOSITCR","CREDIT","CREDITAMOUNT","CREDITINR","CR","CRAMOUNT"]},
      {k:"amount",t:"Amount (one column)",syn:["AMOUNT","TRANSACTIONAMOUNT","TXNAMOUNT","AMOUNTINR","AMT"]},
      {k:"type",t:"Dr / Cr column",syn:["DRCR","CRDR","DEBITCREDIT","TYPE","TRANSACTIONTYPE","TXNTYPE"]},
      {k:"balance",t:"Balance",syn:["BALANCE","CLOSINGBALANCE","BALANCEINR","AVAILABLEBALANCE","RUNNINGBALANCE","BAL","BALANCEAMT"]}];
    function detect(aoa){
      let best=null;
      for(let r=0;r<Math.min(aoa.length,60);r++){
        const row=aoa[r]||[],map={},used=new Set();
        for(const f of F){let hit=-1,rank=99;
          row.forEach((v,c)=>{if(used.has(c))return;const h=key(v);if(!h||h.length>40)return;
            const i=f.syn.indexOf(h);if(i>=0&&i<rank){hit=c;rank=i}
            else if(rank===99&&hit<0&&f.syn.some(s=>s.length>=5&&h.startsWith(s)))hit=c});
          if(hit>=0){map[f.k]=hit;used.add(hit)}}
        const ok=map.date!=null&&((map.debit!=null&&map.credit!=null)||map.amount!=null);
        const score=Object.keys(map).length+(ok?10:0);
        if(!best||score>best.score)best={row:r,map,score,ok};
      }
      return best;
    }
    const MON={JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
    function toDate(v){
      if(v==null||v==="")return "";
      const iso=(y,m,d)=>{y=Number(y);if(y<100)y+=2000;const s=y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0"),x=new Date(s+"T12:00:00Z");return isNaN(x)||x.toISOString().slice(0,10)!==s?"":s};
      if(v instanceof Date){if(isNaN(v))return "";const x=new Date(v.getTime()+12*36e5);return iso(x.getFullYear(),x.getMonth()+1,x.getDate())}
      if(typeof v==="number"){if(v<20000||v>80000)return "";const x=new Date(Math.round((v-25569)*864e5));return iso(x.getUTCFullYear(),x.getUTCMonth()+1,x.getUTCDate())}
      const s=String(v).trim();let m;
      if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)))return iso(m[1],m[2],m[3]);
      if((m=s.match(/^(\d{1,2})[-\/. ](\d{1,2})[-\/. ](\d{2,4})\b/)))return iso(m[3],m[2],m[1]);
      if((m=s.match(/^(\d{1,2})[-\/ ]?([A-Za-z]{3})[A-Za-z]*[-\/ ,]*(\d{2,4})\b/))&&MON[m[2].toUpperCase()])return iso(m[3],MON[m[2].toUpperCase()],m[1]);
      return "";
    }
    function toAmt(v){
      if(v==null||v==="")return {n:0,s:""};
      if(typeof v==="number")return {n:v,s:""};
      let s=String(v).trim().toUpperCase(),side="";
      if(/\bCR\.?$/.test(s))side="C";else if(/\bDR\.?$/.test(s))side="D";
      const neg=/^\(.*\)$/.test(s)||/^-/.test(s)||/-$/.test(s);
      const n=Number(s.replace(/[^0-9.]/g,""));
      return {n:isFinite(n)?(neg?-n:n):0,s:side};
    }
    function build(aoa,det){
      const m=det.map,rows=[];let bad=0;
      for(let r=det.row+1;r<aoa.length;r++){
        const a=aoa[r]||[],g=k=>m[k]==null?"":a[m[k]];
        const d=toDate(g("date"));
        const narr=String(g("narration")||"").replace(/\s+/g," ").trim();
        if(!d){ // a long narration may go on in the next row without a date
          if(narr&&rows.length&&!toAmt(g("debit")).n&&!toAmt(g("credit")).n&&!toAmt(g("amount")).n&&!/^(TOTAL|OPENING|CLOSING|BALANCE)/i.test(narr))rows[rows.length-1].narration=(rows[rows.length-1].narration+" "+narr).slice(0,500);
          continue}
        let debit=0,credit=0;
        if(m.debit!=null||m.credit!=null){const x=toAmt(g("debit")),y=toAmt(g("credit"));debit=Math.abs(x.n);credit=Math.abs(y.n)}
        if(!debit&&!credit&&m.amount!=null){const x=toAmt(g("amount")),t=key(g("type"));
          const side=/^(D|DR|DEBIT|W)/.test(t)?"D":/^(C|CR|CREDIT)/.test(t)?"C":x.s||(x.n<0?"D":"C");
          if(side==="D")debit=Math.abs(x.n);else credit=Math.abs(x.n)}
        if(debit&&credit){if(debit>credit){debit-=credit;credit=0}else{credit-=debit;debit=0}}
        if(!debit&&!credit){bad++;continue}
        const bal=m.balance!=null?toAmt(g("balance")):null;
        rows.push({date:d,narration:narr,ref:String(g("ref")||"").trim().replace(/^0+$/,"")||"",debit:r2(debit),credit:r2(credit),balance:bal&&String(g("balance")).trim()!==""?r2(bal.s==="D"?-Math.abs(bal.n):bal.n):null});
      }
      return {rows,bad};
    }
    async function readFile(f){
      await LWBExcel.lib();
      const book=XLSX.read(await f.arrayBuffer(),{cellDates:true,raw:false,dateNF:"dd/mm/yyyy"});
      let pick=null;
      for(const name of book.SheetNames){const aoa=XLSX.utils.sheet_to_json(book.Sheets[name],{header:1,defval:"",raw:true});
        const det=detect(aoa);if(det&&(!pick||det.score>pick.det.score))pick={aoa,det}}
      if(!pick)throw Error("This file is empty.");
      return pick;
    }
    const mapKey=()=>"lwbBankMap:"+bankId;
    async function onFile(f){
      say("");el("preview").hidden=true;pending=null;
      try{const {aoa,det}=await readFile(f);
        try{const saved=JSON.parse(localStorage.getItem(mapKey())||"null");
          if(saved&&!det.ok&&saved.sig===key((aoa[saved.row]||[]).join("|")))Object.assign(det,{row:saved.row,map:saved.map,ok:true})}catch(_){}
        pending={file:f.name,aoa,det};drawPreview()}
      catch(e){say(errText(e),"bad")}
    }
    function drawPreview(){
      const {aoa,det,file}=pending,head=aoa[det.row]||[];
      const ok=det.map.date!=null&&((det.map.debit!=null||det.map.credit!=null)||det.map.amount!=null);
      const {rows,bad}=ok?build(aoa,det):{rows:[],bad:0};
      pending.rows=rows;
      const ins=rows.filter(r=>r.credit),outs=rows.filter(r=>r.debit),sum=(a,k)=>a.reduce((s,r)=>s+r[k],0);
      const ds=rows.map(r=>r.date).sort(),bank=D.banks.find(b=>b.id===bankId)||{};
      const opt=k=>'<option value="">—</option>'+head.map((h,i)=>'<option value="'+i+'"'+(det.map[k]===i?" selected":"")+'>'+esc(String(h).trim()||("Column "+(i+1)))+'</option>').join("");
      el("preview").hidden=false;
      el("preview").innerHTML='<h2>📄 '+esc(file)+' <small>into '+esc(bank.name||"")+'</small></h2>'+
        '<details class="bs-cols"'+(ok&&rows.length&&!pending.openCols?"":" open")+'><summary>Columns '+(ok&&rows.length?"found by themselves ✓ <small>(change if wrong)</small>":"— choose them")+'</summary><div class="bs-map">'+F.map(f=>'<label>'+f.t+'<select data-map="'+f.k+'">'+opt(f.k)+'</select></label>').join("")+
          '<label>Header row<select data-hrow>'+aoa.slice(0,60).map((r,i)=>'<option value="'+i+'"'+(i===det.row?" selected":"")+'>Row '+(i+1)+': '+esc((r||[]).filter(Boolean).slice(0,3).join(" | ").slice(0,40))+'</option>').join("")+'</select></label></div></details>'+
        (ok&&rows.length?'<table class="bs-pv"><thead><tr><th>Date</th><th>Narration</th><th style="text-align:right">Amount</th></tr></thead><tbody>'+
          rows.slice(0,5).map(r=>'<tr><td>'+dmy(r.date)+'</td><td>'+esc(r.narration.slice(0,70))+(r.ref?'<small style="display:block;color:var(--erp-muted)">Ref '+esc(r.ref)+'</small>':"")+'</td><td class="n" style="color:'+(r.credit?"#13824a":"#b3122b")+'">'+(r.credit?"+"+rs(r.credit):"−"+rs(r.debit))+'</td></tr>').join("")+'</tbody></table>'
          :'<div class="bs-msg bad">'+(ok?"No line with a date and amount found. Check the columns.":"Choose the Date column and the Withdrawal / Deposit (or Amount) columns.")+'</div>')+
        '<div class="bs-row1" style="margin-top:8px"><span class="grow">'+(rows.length?'<b>'+rows.length+' lines</b> · '+dmy(ds[0])+' – '+dmy(ds[ds.length-1])+' · In '+rs(sum(ins,"credit"))+' ('+ins.length+') · Out '+rs(sum(outs,"debit"))+' ('+outs.length+')'+(bad?' · '+bad+' rows without amount left out':""):"")+'</span>'+
        '<button type="button" class="bs-btn" id="pvX">Cancel</button><button type="button" class="bs-btn pri" id="pvGo"'+(rows.length?"":" disabled")+'>Import '+rows.length+' lines</button></div>';
      el("preview").querySelector(".bs-cols").ontoggle=e=>{pending.openCols=e.target.open};
      el("preview").querySelectorAll("[data-map]").forEach(s=>s.onchange=()=>{pending.openCols=1;const v=s.value;Object.keys(det.map).forEach(k=>{if(det.map[k]===Number(v))delete det.map[k]});if(v==="")delete det.map[s.dataset.map];else det.map[s.dataset.map]=Number(v);drawPreview()});
      el("preview").querySelector("[data-hrow]").onchange=e=>{pending.openCols=1;det.row=Number(e.target.value);const d2=detect([aoa[det.row]]);det.map=d2?d2.map:{};drawPreview()};
      el("pvX").onclick=()=>{pending=null;el("preview").hidden=true};
      if(!pending.shown){pending.shown=1;el("preview").scrollIntoView({block:"start"})}
      el("pvGo").onclick=()=>doImport(el("pvGo"));
    }
    async function doImport(btn){
      const {rows,file,aoa,det}=pending;btn.disabled=true;say("Uploading "+rows.length+" lines…");
      try{const r=await rpc("lwb_bank_stmt_import",{p_bank_id:bankId,p_file:file,p_rows:rows});
        try{localStorage.setItem(mapKey(),JSON.stringify({row:det.row,map:det.map,sig:key((aoa[det.row]||[]).join("|"))}))}catch(_){}
        pending=null;el("preview").hidden=true;tab="OPEN";dir="all";
        await load();
        const left=D.lines.filter(l=>l.status==="OPEN").length;
        say("Uploaded "+dmy(r.from)+" – "+dmy(r.to)+": "+r.new+" new line"+(r.new===1?"":"s")+", "+r.skipped+" already there (skipped), "+r.matched+" matched with ERP by itself. "+left+" in Suspense.","ok")}
      catch(e){btn.disabled=false;say(errText(e),"bad")}
    }

    el("tabs").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;shown=200;renderTab()});
    el("kpis").addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(!b)return;tab=b.dataset.go;dir=b.dataset.dir||"all";renderTab();el("tabs").scrollIntoView({behavior:"smooth",block:"start"})});
    el("bank").onchange=e=>{bankId=Number(e.target.value)||null;sel.clear();pending=null;el("preview").hidden=true;say("");try{localStorage.setItem("lwbBankStmtBank",String(bankId))}catch(_){}load()};
    el("file").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)onFile(f)};

    (async()=>{
      const {data:{session}}=await client.auth.getSession();
      if(!session){location.replace("login.html");return}
      const {data:p}=await client.from("user_profiles").select("full_name,role,active").eq("id",session.user.id).single();
      const realRole=String((p&&p.role)||"").toLowerCase().trim(),role=p?await ERPShell.pageRoleFresh(realRole):realRole;
      if(!p||p.active!==true||!["admin","accounts"].includes(role)){location.replace("dashboard.html");return}
      ERPShell.mount({role:realRole||role,name:p.full_name||session.user.email,onLogout:async()=>{await client.auth.signOut();location.replace("login.html")}});
      el("loading").hidden=true;el("page").hidden=false;
      try{bankId=Number(localStorage.getItem("lwbBankStmtBank"))||null}catch(_){}
      await load();
      if(D&&D.bank_id!==bankId){bankId=D.bank_id}
      Promise.all([client.from("lwb_supplier_master").select("*"),client.from("lwb_companies").select("id,name,active")]).then(([sp,co])=>{
        const cos=co.error?[]:(co.data||[]).filter(c=>c.active!==false),coName=id=>(cos.find(c=>c.id===id)||{}).name||"";
        const m=new Map();for(const x of sp.error?[]:sp.data||[])if(x.is_active!==false&&x.supplier_name)m.set(key(x.supplier_name),{name:x.supplier_name,coId:x.company_id||null,coName:coName(x.company_id)});
        for(const c of cos)if(!m.has(key(c.name)))m.set(key(c.name),{name:c.name,coId:c.id,coName:c.name});
        suppliers=[...m.values()].sort((a,b)=>a.name.localeCompare(b.name))}).catch(()=>{});
      LWBPartyPay.load(client).then(i=>{const m=new Map();for(const x of i.parties.values())m.set(key(x.party),x.party);for(const n of i.raw.parties||[]){const pp=i.parentOf(n);if(!m.has(key(pp)))m.set(key(pp),pp)}
        parties=[...m.values()].sort();const dl=document.createElement("datalist");dl.id="bsParties";dl.innerHTML=parties.map(n=>'<option value="'+esc(n)+'">').join("");document.body.append(dl);if(D)renderTab()}).catch(()=>{});
    })();
  </script>
