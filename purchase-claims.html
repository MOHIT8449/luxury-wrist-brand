  <style>
    .status{text-align:center;padding:80px 20px;font-size:15px;color:#555}
    .pc-sub{margin:-8px 0 14px;color:var(--erp-muted);font-size:15px}
    .pc-err{background:#ffebeb;color:#9b2020;padding:14px 16px;border-radius:8px;margin-bottom:14px;white-space:pre-wrap}
    .pc-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
    .pc-kpi{background:#fff;border:1px solid var(--erp-line);border-radius:8px;padding:14px;border-top:4px solid var(--c,#c8102e)}
    .pc-kpi span{display:block;font-size:14px;color:#4b5763}.pc-kpi b{font-size:22px}.pc-kpi small{display:block;color:var(--erp-muted);font-size:13px}
    .pc-kpis{grid-template-columns:repeat(5,minmax(0,1fr))}
    .pc-table{border-collapse:collapse;width:100%;font-size:15px}
    .pc-table th,.pc-table td{border-bottom:1px solid var(--erp-line);padding:9px 12px;text-align:left;white-space:nowrap;vertical-align:top}
    .pc-table th{background:#f6f7f9;font-size:14px;font-weight:700;color:#2b3440}
    .pc-table .n{text-align:right}
    .pc-table td small{display:block;color:var(--erp-muted);font-size:13px}
    .pc-table tr.sel td{background:#fff8e6}
    .pc-table button,.act button,.bulk button{height:32px;padding:0 11px;border-radius:5px;border:1px solid var(--erp-line);background:#fff;color:var(--erp-ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer;margin:0 4px 4px 0}
    .pc-table button.pri,.act button.pri,.bulk button.pri{background:var(--erp-red);border-color:var(--erp-red);color:#fff}
    .pc-table td small.next{color:#8a5300;font-weight:600;white-space:normal}
    .pc-table .files{margin-top:2px}.pc-table .files button{height:30px;font-size:13px;padding:0 9px}
    .st{display:inline-block;padding:3px 9px;border-radius:5px;font-size:13px;font-weight:700}
    .st.mail{background:#fff3d6;color:#8a5a00}.st.approval{background:#e8f1ff;color:#194c85}.st.return{background:#f3e8ff;color:#5b2a86}.st.due{background:#ffe9d6;color:#8a3b00}.st.RECEIVED{background:#e4f6e9;color:#0d6b36}.st.REJECTED{background:#fee8e8;color:#9e2525}
    .norm{font-size:12.5px;font-weight:700}.norm.lo{color:#0d6b36}.norm.hi{color:#9e2525}
    #tabs .erp-pill{font-size:15px;padding:9px 16px}
    .bulk{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px}
    .bulk span{color:var(--erp-muted);font-size:14px}
    .act{border:2px solid var(--erp-red);margin-bottom:14px;padding:16px 18px}
    .act a.mb{display:inline-flex;align-items:center;height:32px;padding:0 11px;border-radius:5px;border:1px solid var(--erp-line);background:#fff;color:var(--erp-ink);font-size:14px;font-weight:600;text-decoration:none;margin:0 4px 4px 0}
    .act h2{margin:0 0 4px;font-size:18px}.act .sub{margin:0 0 12px;color:var(--erp-muted);font-size:14px}
    .act .g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 14px;margin-bottom:12px}
    .act label{display:block;font-size:13px;font-weight:700;color:#4b5763;margin-bottom:4px}
    .act input,.act select,.act textarea{width:100%;box-sizing:border-box;height:38px;border:1px solid var(--erp-line);border-radius:6px;padding:0 10px;font:inherit;font-size:15px;color:var(--erp-ink);background:#fff}
    .act textarea{height:260px;padding:8px 10px;font-family:Consolas,Menlo,monospace;font-size:13.5px;line-height:1.45;resize:vertical}
    .act .cp{display:flex;gap:8px;align-items:center}.act .cp input{flex:1}.act .cp button{margin:0;flex:none}
    .act .hint{font-size:13px;color:var(--erp-muted);margin-top:4px}
    .act .btns{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
    .act button.dl{border-color:#13824a;color:#0d6b36;background:#e4f6e9}.act button.dl:disabled{opacity:.6;cursor:wait}
    @media(max-width:600px){.act .btns{gap:6px}.act .btns>*{flex:1 1 calc(50% - 6px);justify-content:center;margin:0!important}
      .act .btns>span:empty{display:none}.act .btns>button.dl{flex-basis:100%}.act .btns>label{flex:0 0 auto}.act .btns>input[type=date]{flex:1 1 calc(100% - 90px);width:auto!important;min-width:0}}
    @media(max-width:900px){.act .g{grid-template-columns:1fr 1fr}}
    #printArea{display:none}
    /* Claim mail in Mohit's Gmail format (19 Nov 2026) */
    .mh{border:1px solid var(--erp-line);border-radius:8px;padding:10px 12px;background:#fff;overflow-x:auto;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#111;max-height:520px;overflow-y:auto}
    .mh table{border-collapse:collapse}.mh td{border:1px solid #111;padding:6px 8px;text-align:center;white-space:nowrap}.mh td.k{text-align:left}
    .mh td.y{background:#ffff00;font-weight:700}.mh input.bt{width:96px;height:28px;border:1.5px solid #e9a5b0;background:#fff4f5;border-radius:4px;text-align:center;font:inherit;font-size:13px;text-transform:uppercase}
    .mh input.bt.ok{border-color:#9fd3b4;background:#f1fbf4}
    .dchk{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}.dchk span{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:700}
    .dchk .ok{background:#e4f6e9;color:#0d6b36}.dchk .bad{background:#fdecef;color:#9e1528}.dchk .warn{background:#fff2dc;color:#8a5300}
    .seg{display:inline-flex;border:1px solid var(--erp-line);border-radius:999px;overflow:hidden;margin:0 0 10px;background:#fff}
    .seg a{padding:6px 14px;font-size:13.5px;font-weight:700;color:var(--erp-ink);text-decoration:none;white-space:nowrap}.seg a.on{background:#002f37;color:#fff}
    .seg a b{display:inline-block;min-width:20px;margin-left:5px;padding:0 6px;border-radius:999px;background:#fdecef;color:#c8102e;font-size:12px;text-align:center}
    .doc{box-sizing:border-box;width:210mm;min-height:295mm;padding:12mm 18mm 10mm;font-family:Arial,Helvetica,sans-serif;color:#111;font-size:11.5pt;line-height:1.35;display:flex;flex-direction:column}
    .doc h1.lh{font-family:Anton,Impact,"Arial Narrow Bold","Arial Narrow",Arial,sans-serif;font-size:44pt;letter-spacing:.5px;text-align:center;margin:4mm 0 3mm;font-weight:400;color:#222}
    .doc .rule{border-top:2.5px solid #555;margin:0 0 5mm}
    .doc .row{display:flex;justify-content:space-between;gap:10mm}
    .doc .subj{text-align:center;font-weight:700;text-decoration:underline;margin:4mm 0 2mm}
    .doc table.kv{border-collapse:collapse;margin:2mm 0 3mm 6mm}
    .doc table.kv td{padding:.6mm 3mm .6mm 0;vertical-align:top}
    .doc table.kv td:first-child{width:40mm}
    .doc table.grid{border-collapse:collapse;width:100%;font-size:10.5pt;margin:2mm 0 3mm}
    .doc table.grid th,.doc table.grid td{border:1px solid #999;padding:1.4mm 2.2mm;text-align:left}
    .doc table.grid th{background:#f0f0f0}.doc table.grid .n{text-align:right}.doc table.grid tfoot td{font-weight:700}
    .doc .sign{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14mm}
    .doc .foot{margin-top:auto;border-top:1.5px solid #777;padding-top:2mm;text-align:center;font-size:9pt;line-height:1.6}
    @media(max-width:1100px){.pc-kpis{grid-template-columns:1fr 1fr}}
    @page{size:A4;margin:0}
    @media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}body{background:#fff!important;margin:0}}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <div id="loading" class="status">Checking account access...</div>
  <main id="page" class="erp-main" hidden>
    <div class="erp-pagehead"><h1>Purchase Claims<button type="button" class="erp-i" aria-label="Info" title="Info" data-tip="Damage / leakage / breakage, gasless and shortage from purchase vehicles. Enter it in Goods Inward when you submit the bill, or later in Purchase Register → Verify. Chain: mail to company → company approval → return goods (if asked) → claim amount received. Live stock is not changed here.">i</button></h1></div>
    <nav class="seg" aria-label="Purchase"><a href="purchase-register.html">📋 Purchase List</a><a href="purchase-claims.html" class="on" aria-current="page">⚠ Claims<b id="segN"></b></a></nav>
    <div id="err" class="pc-err" hidden></div>
    <div class="pc-kpis" id="kpis"></div>
    <div class="erp-pills" id="tabs">
      <a class="erp-pill" data-f="open" href="#open">Open</a>
      <a class="erp-pill" data-f="mail" href="#mail">Mail not sent</a>
      <a class="erp-pill" data-f="approval" href="#approval">Awaiting approval</a>
      <a class="erp-pill" data-f="return" href="#return">Return goods</a>
      <a class="erp-pill" data-f="due" href="#due">Amount due</a>
      <a class="erp-pill" data-f="RECEIVED" href="#RECEIVED">Received</a>
      <a class="erp-pill" data-f="REJECTED" href="#REJECTED">Rejected</a>
      <a class="erp-pill" data-f="all" href="#all">All</a>
    </div>
    <div class="bulk" id="bulk"></div>
    <section class="erp-card act" id="act" hidden></section>
    <section class="erp-card"><div style="overflow:auto" id="box"></div></section>
  </main>
  <div id="printArea"></div>
  <script>
    'use strict';
    const client=supabase.createClient("https://qstgwhbgbznxemajtave.supabase.co","sb_publishable_YA2Pow327REqgrWPzVCZiA_nw1F32_o");
    const el=id=>document.getElementById(id);
    const esc=v=>String(v==null?"":v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    const num=v=>Number(v||0);
    const fmt=v=>num(v).toLocaleString("en-IN",{maximumFractionDigits:1});
    const dmy=(d,sep="/")=>d?String(d).slice(8,10)+sep+String(d).slice(5,7)+sep+String(d).slice(0,4):"—";
    const today=()=>new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Kolkata"});
    // Damage / Leakage / Breakage is one type; old LEAKAGE lines are counted in it. Gasless is separate (18 Nov 2026).
    const ISSUE={DAMAGE:"Damage / Leakage / Breakage",LEAKAGE:"Leakage",GASLESS:"Gasless",SHORTAGE:"Shortage"};
    // Where a claim is in the chain.
    const STAGE={mail:"Mail not sent",approval:"Awaiting company approval",return:"Return goods pending",due:"Claim amount due",RECEIVED:"Amount received",REJECTED:"Rejected"};
    // What to press next, shown under the status (Mohit, 18 Nov 2026: "update kaise karein").
    const NEXT={mail:"Next: Copy Mail, then Mark Mail Sent",approval:"Next: press Approved or Rejected",return:"Next: press Goods Returned",due:"Next: press Amount Received"};
    const stage=ch=>ch.claim_status==="PENDING"?"mail":ch.claim_status==="SENT"?"approval":ch.claim_status==="APPROVED"?(ch.return_required&&!ch.returned_on?"return":"due"):ch.claim_status;
    const OPEN=["mail","approval","return","due"];
    // Company norm: claims below this many cases are passed without returning the goods.
    const NORM_CASES=20;
    // Cases = the unit the SKU is sold in: IC (Rajnigandha) or CS (Coca-Cola). U = SKU name -> unit.
    let U=()=>"CASE";
    const sh=u=>u==="BOX"?"IC":u==="MIX"?"IC/CS":"CS";
    const qtyTxt=(c,p,u)=>(c?fmt(c)+" "+sh(u):"")+(c&&p?" + ":"")+(p?fmt(p)+" pcs":"")||"0";
    const sumTxt=l=>window.LWBBrand?LWBBrand.packSum(l):fmt(l.reduce((a,x)=>a+x.pcs/x.per,0))+" CS";
    const rs=v=>"₹"+num(v).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
    const lines=t=>String(t||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>l[0]==="*"?"<b>"+esc(l.slice(1).trim())+"</b>":esc(l)).join("<br>");

    // Brand filter: a claim is of a brand when one of its SKUs is.
    let BB={get:()=>""},SM=null,allClaims=[];
    const inB=x=>{const c=BB.get();if(!c||!SM)return true;return (x.lwb_purchase_check_items||[]).some(i=>SM.get(LWBBrand.skuKey(i.sku_name))===c)||(billItems.get(x.inward_id)||[]).some(i=>SM.get(LWBBrand.skuKey(i.sku_name))===c)};
    const pickBrand=()=>{claims=allClaims.filter(inB)};
    let me=null,claims=[],bills=new Map(),billItems=new Map(),settings={},filter="open",busy=false,act=null,docSum=null;

    async function start(){
      const {data:{session}}=await client.auth.getSession();
      if(!session){location.replace("login.html");return null}
      const {data:p}=await client.from("user_profiles").select("full_name,role,active").eq("id",session.user.id).single();
      const realRole=String((p&&p.role)||"").toLowerCase().trim(),role=p?await ERPShell.pageRoleFresh(realRole):realRole;
      if(!p||p.active!==true||!["admin","manager"].includes(role)){location.replace("dashboard.html");return null}
      return {id:session.user.id,role,realRole,name:p.full_name||session.user.email};
    }
    async function load(){
      el("err").hidden=true;
      const [c,s]=await Promise.all([
        client.from("lwb_purchase_checks").select("*,lwb_purchase_check_items(*)").eq("has_damage",true).order("verified_on",{ascending:false}),
        client.from("lwb_sp_settings").select("*").eq("id",1).maybeSingle()]);
      if(c.error){el("err").hidden=false;el("err").textContent="Purchase claims are not set up yet. Run lwb_purchase_claim_setup.sql once in the Supabase SQL Editor, then refresh.\n("+c.error.message+")";claims=[]}
      else claims=c.data||[];
      settings=s.data||{};
      const ids=[...new Set(claims.map(x=>x.inward_id))];bills=new Map();billItems=new Map();
      for(let i=0;i<ids.length;i+=100){
        const [r,it]=await Promise.all([client.from("lwb_goods_inward").select("*").in("id",ids.slice(i,i+100)),
          client.from("lwb_goods_inward_items").select("*").in("inward_id",ids.slice(i,i+100))]);
        for(const b of r.data||[])bills.set(b.id,b);
        for(const x of it.data||[]){if(!billItems.has(x.inward_id))billItems.set(x.inward_id,[]);billItems.get(x.inward_id).push(x)}
      }
      if(window.ERPDocs)try{docSum=await ERPDocs.summary(client,"PURCHASE_BILL")}catch(e){}
      allClaims=claims;pickBrand();
    }
    function tot(ch){
      const t={DAMAGE:[0,0],GASLESS:[0,0],SHORTAGE:[0,0],cases:0,list:[],u:""};
      for(const i of ch.lwb_purchase_check_items||[]){const per=Math.max(1,i.pcs_per_case),u=U(i.sku_name),k=t[i.issue]?i.issue:"DAMAGE";t[k][0]+=i.cases;t[k][1]+=i.pcs;t.cases+=i.cases+i.pcs/per;
        t.list.push({pcs:i.cases*per+i.pcs,per,unit:u});t.u=!t.u||t.u===u?u:"MIX"}
      t.txt=sumTxt(t.list);
      return t;
    }
    // Estimated claim value from the purchase bill: claimed PCS × (bill line total ÷ bill line PCS).
    function estimate(ch){
      const rate=new Map();
      for(const x of billItems.get(ch.inward_id)||[]){
        const pcs=num(x.quantity_pcs??x.total_pcs??x.qty_pcs),amt=num(x.total_amount);
        if(pcs>0&&amt>0){const r=rate.get(String(x.sku_id))||[0,0];r[0]+=amt;r[1]+=pcs;rate.set(String(x.sku_id),r)}
      }
      let v=0,miss=0;
      for(const i of ch.lwb_purchase_check_items||[]){
        const r=rate.get(String(i.sku_id)),pcs=i.cases*Math.max(1,i.pcs_per_case)+i.pcs;
        if(r)v+=pcs*r[0]/r[1];else miss++;
      }
      return {value:Math.round(v*100)/100,miss};
    }
    const billOf=ch=>bills.get(ch.inward_id)||{};
    function chainTxt(ch){
      return [ch.claim_no?"Claim "+ch.claim_no:"",ch.sent_on?"Mail "+dmy(ch.sent_on):"",ch.approved_on?"Approved "+dmy(ch.approved_on):"",
        ch.claim_status==="APPROVED"||ch.claim_status==="RECEIVED"?(ch.return_required?(ch.returned_on?"Returned "+dmy(ch.returned_on)+(ch.return_vehicle_no?" · "+ch.return_vehicle_no:"")+(ch.return_lr_no?" · LR "+ch.return_lr_no:""):"Goods to return"):"No return"):"",
        ch.claim_amount!=null?"Claim amount "+rs(ch.claim_amount):"",ch.claim_status==="RECEIVED"?"Received "+rs(ch.received_amount)+" on "+dmy(ch.settled_on):"",
        ch.claim_status==="REJECTED"&&ch.settled_on?"Rejected "+dmy(ch.settled_on):""].filter(Boolean);
    }
    function render(){
      document.querySelectorAll("#tabs .erp-pill").forEach(a=>a.classList.toggle("active",a.dataset.f===filter));
      const by=g=>claims.filter(x=>stage(x)===g),sumC=l=>sumTxt(l.flatMap(x=>tot(x).list)),sumA=(l,f)=>l.reduce((a,x)=>a+num(x[f]),0);
      el("kpis").innerHTML=[
        ["#b26b00","Mail not sent",by("mail").length,sumC(by("mail"))],
        ["#194c85","Awaiting approval",by("approval").length,sumC(by("approval"))],
        ["#5b2a86","Return goods pending",by("return").length,sumC(by("return"))],
        ["#c8102e","Claim amount due",rs(sumA(by("due"),"claim_amount")),by("due").length+" approved, to receive"],
        ["#13824a","Received",rs(sumA(by("RECEIVED"),"received_amount")),by("RECEIVED").length+" closed"]]
        .map(([c,l,b,s])=>'<div class="pc-kpi" style="--c:'+c+'"><span>'+l+"</span><b>"+b+"</b><small>"+s+"</small></div>").join("");
      // Count card → list of those claims (erp-list.js)
      if(window.ERPList){const KL=[["mail","Mail not sent"],["approval","Awaiting approval"],["return","Return goods pending"],["due","Claim amount due"],["RECEIVED","Received"]];
        const CC=[{t:"Checked",v:"verified_on",date:true},{t:"Invoice",v:ch=>billOf(ch).invoice_no||""},{t:"Supplier",v:ch=>billOf(ch).supplier_name||""},{t:"Vehicle",v:ch=>billOf(ch).vehicle_no||""},
          {t:"Qty",v:ch=>tot(ch).txt,num:true},{t:"Claim no.",v:"claim_no"},{t:"Claim amount",v:"claim_amount",money:true,sum:true},{t:"Received",v:"received_amount",money:true,sum:true},{t:"Status",v:ch=>STAGE[stage(ch)]||stage(ch)}];
        el("kpis").querySelectorAll(".pc-kpi").forEach((c,i)=>ERPList.card(c,()=>({title:KL[i][1],sub:"Purchase claims",rows:by(KL[i][0]),cols:CC})))}
      el("segN").textContent=claims.filter(x=>OPEN.includes(stage(x))).length||"";
      const mails=by("mail");
      el("bulk").innerHTML=mails.length?"<span>"+mails.length+" claim"+(mails.length>1?"s":"")+" not mailed yet:</span>"+
        '<button type="button" class="pri" data-act="mailall">Today\'s Mail (all '+mails.length+')</button>':"";
      const list=claims.filter(x=>filter==="all"||(filter==="open"?OPEN.includes(stage(x)):stage(x)===filter));
      let h='<table class="pc-table"><thead><tr><th>Checked</th><th>Invoice</th><th>Supplier</th><th>Vehicle</th><th>Damage / Leakage / Breakage</th><th>Gasless</th><th>Shortage</th><th class="n">Total</th><th>Status</th><th></th></tr></thead><tbody>';
      for(const ch of list){
        const b=billOf(ch),t=tot(ch),lo=t.cases<NORM_CASES,g=stage(ch),id=ch.id,B=(a,l,c)=>'<button type="button"'+(c?' class="pri"':"")+' data-act="'+a+'" data-id="'+id+'">'+l+"</button>";
        h+='<tr'+(act&&act.id===id?' class="sel"':"")+"><td>"+dmy(ch.verified_on)+"</td><td><b>"+esc(b.invoice_no||"—")+"</b><small>"+dmy(b.invoice_date)+"</small></td><td style='white-space:normal;min-width:180px'>"+esc(b.supplier_name||"")+"</td><td>"+esc(b.vehicle_no||"—")+"<small>"+esc(b.lr_no?"LR "+b.lr_no:"")+"</small></td>"+
          ["DAMAGE","GASLESS","SHORTAGE"].map(x=>"<td>"+qtyTxt(t[x][0],t[x][1],t.u)+"</td>").join("")+
          '<td class="n"><b>'+esc(t.txt)+'</b><small class="norm '+(lo?"lo":"hi")+'">'+(lo?"Below "+NORM_CASES+": no return":NORM_CASES+"+ cases: return may be asked")+"</small></td>"+
          '<td style="white-space:normal;min-width:190px"><span class="st '+g+'">'+esc(STAGE[g]||g)+"</span>"+chainTxt(ch).map(x=>"<small>"+esc(x)+"</small>").join("")+(ch.note?"<small>Note: "+esc(ch.note)+"</small>":"")+(NEXT[g]?'<small class="next">'+esc(NEXT[g])+"</small>":"")+"</td><td>"+
          (g==="mail"?B("mail","Copy Mail",1)+B("print","Letter PDF"):"")+
          (g==="approval"?B("approve","✓ Approved",1)+B("reject","✕ Rejected")+"<br>"+B("mail","Copy Mail")+B("print","Letter PDF"):"")+
          (g==="return"?B("return","Goods Returned",1)+B("approve","Edit Approval"):"")+
          (g==="due"?B("receive","Amount Received",1)+B("approve","Edit Approval")+(ch.return_required?B("return","Edit Return"):""):"")+
          (g==="RECEIVED"||g==="REJECTED"?B("reopen","Reopen")+B("print","Letter PDF"):"")+
          // Photos / bill / company approval PDF of this claim (erp-docs.js).
          (window.ERPDocs?'<div class="files">'+B("files","📎 Photos & PDF")+B("dlzip","⬇ Download all")+"</div>":"")+"</td></tr>";
      }

    /* ---------- action card (mail / approve / return / receive) ---------- */

          (window.ERPDocs?'<button type="button" class="dl" data-act="dlphotos" title="Bill PDF, damage photos and videos of '+(list.length>1?"these invoices":"this invoice")+' in one ZIP">⬇ Download Photos</button>':"")+
          (canMark?'<span style="margin-left:12px"></span><label for="mDate" style="margin:0 6px 0 0">Sent on</label><input id="mDate" type="date" value="'+today()+'" style="width:160px;margin-right:8px"><button type="button" class="pri" data-act="marksent">Mark Mail Sent'+(list.length>1?" (all "+list.length+")":"")+"</button>":"")+

    function openAct(kind,id){act={kind,id};render();el("act").scrollIntoView({behavior:"smooth",block:"start"})}

        const inv=new Map(list.map(x=>[String(x.inward_id),String(billOf(x).invoice_no||"bill").replace(/[^A-Za-z0-9-]/g,"")]));
        btn.disabled=true;const old=btn.textContent;btn.textContent="⏳ Preparing ZIP…";

          claim_amount:amt===""?null:Math.round(Number(amt)*100)/100,...(ret?{}:{returned_on:null,return_vehicle_no:null,return_lr_no:null})},
          ret&&!ch.returned_on?"Approved. Next: return the goods and record the vehicle / LR.":"Approved. Claim amount is now due from the company.");
      }
      if(a==="savereturn"){
        if(!val("rDate"))return ERPShell.toast("Enter the return date.","error");

        return update([ch.id],{returned_on:val("rDate"),return_vehicle_no:val("rVeh").toUpperCase().replace(/\s+/g,"")||null,return_lr_no:val("rLr")||null},"Goods return saved. Claim amount is now due from the company.");

      }

      const N=cols.length,T='style="border:1px solid #000;padding:6px 8px;text-align:center;white-space:nowrap"',TK='style="border:1px solid #000;padding:6px 8px;text-align:left;white-space:nowrap"',TY='style="border:1px solid #000;padding:6px 8px;text-align:center;white-space:nowrap;background:#ffff00;font-weight:bold"';

      const total=sumTxt(list.flatMap(x=>tot(x).list)).replace(/\bCS\b/g,"CASES");
      const html='<div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#111">'+
        "<p>Dear Sir / Team,</p><p>Greetings from "+esc(S.distributor_name?S.distributor_name.replace(/\b\w+/g,w=>w[0]+w.slice(1).toLowerCase()):"Luxury Wrist Brand")+", Surat.</p>"+
        "<p>This is to inform you that we have found "+esc(what)+" in the stock received against the below invoice"+(invs.length>1?"s":"")+". Details are as under:</p>"+
        '<table style="border-collapse:collapse" cellpadding="0" cellspacing="0">'+one("DISTRIBUTOR NAME",esc(name),1)+one("SAP CODE",esc(sap),1)+one("LOCATION",esc(loc))+
        row("SKU",cols.map(c=>esc(c.i.sku_name)))+row("QTY",cols.map(c=>casesTxt(c.i.cases,c.i.pcs,U(c.i.sku_name))),1)+
        row("INVOICE DATE",cols.map(c=>dmy(c.b.invoice_date,".")))+row("INVOICE NO.",cols.map(c=>esc(c.b.invoice_no||"")))+
        row("BATCH NO",cols.map(c=>edit?'<input class="bt'+(c.i.batch_no?" ok":"")+'" data-bid="'+esc(c.i.id)+'" data-inw="'+esc(c.ch.inward_id)+'" maxlength="30" placeholder="Batch" value="'+esc(c.i.batch_no||"")+'">':esc(c.i.batch_no||"")))+
        (same?"<tr><td "+TK+"></td><td "+TY+' class="y" colspan="'+N+'">'+esc(types[0]||"")+"</td></tr>":row("",types.map(esc),1))+
        "</table><p>TOTAL QTY : <b>"+esc(total)+"</b></p>"+
        "<p>The invoice "+(invs.length>1?"copies":"copy")+(nonS.length?" and photos are":" is")+" attached. Kindly approve our claim and share the claim reference number.</p></div>";
      const text="Dear Sir / Team,\n\nGreetings from Luxury Wrist Brand, Surat.\n\nThis is to inform you that we have found "+what+" in the stock received against the below invoices. Details are as under:\n\n"+
        "DISTRIBUTOR NAME: "+name+"\nSAP CODE: "+sap+"\nLOCATION: "+loc+"\n\n"+
        cols.map(c=>c.i.sku_name+" | "+casesTxt(c.i.cases,c.i.pcs,U(c.i.sku_name))+" | Inv "+(c.b.invoice_no||"")+" dt. "+dmy(c.b.invoice_date,".")+" | Batch "+(c.i.batch_no||"-")+" | "+(TYPE_T[c.i.issue]||c.i.issue)).join("\n")+
        "\n\nTOTAL QTY : "+total+"\n\nThe invoice copies and photos are attached. Kindly approve our claim and share the claim reference number.";
      return {subject,html,text};
    }
    // Batch no. typed in the mail table: saved at once on that line (lwb_purchase_claim_batch_setup.sql).
    document.addEventListener("change",async e=>{const t=e.target;if(!t.matches||!t.matches("input.bt[data-bid]"))return;
      const v=t.value.trim().toUpperCase();t.value=v;
      const r=await client.rpc("lwb_purchase_check_batches",{p_inward:t.dataset.inw,p_items:[{id:t.dataset.bid,batch_no:v}]});
      if(r.error)return ERPShell.toast("Batch no. not saved: "+r.error.message,"error");
      for(const ch of claims)for(const i of ch.lwb_purchase_check_items||[])if(String(i.id)===t.dataset.bid)i.batch_no=v||null;
      t.classList.toggle("ok",!!v);ERPShell.toast("Batch no. saved.","success");
      const sc=el("mBody").scrollLeft;renderAct();el("mBody").scrollLeft=sc});
    function printDoc(html,name){el("printArea").innerHTML=html;const t=document.title;if(name)document.title=name;setTimeout(()=>{window.print();document.title=t},50)}
    document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(t)doAct(t.dataset.act,t.dataset.id)});
    function setTab(){const f=location.hash.replace("#","");filter=["open","mail","approval","return","due","RECEIVED","REJECTED","all"].includes(f)?f:"open";render()}
    window.addEventListener("hashchange",setTab);
    window.addEventListener("afterprint",()=>{el("printArea").innerHTML=""});
    (async()=>{
      me=await start();if(!me)return;
      ERPShell.mount({role:me.realRole||me.role,name:me.name,onLogout:async()=>{await client.auth.signOut();location.replace("login.html")},group:"Purchase"});
      el("loading").hidden=true;el("page").hidden=false;
      if(window.LWBBrand)try{BB=await LWBBrand.mount(client,{into:"#page .erp-pagehead",after:true,onChange:()=>{pickBrand();render()}});if(BB.companies.length>1)SM=await LWBBrand.skuMap(client)}catch(e){}
      if(window.LWBBrand)try{U=await LWBBrand.units(client)}catch(e){}
      await load();setTab();
      const cq=new URLSearchParams(location.search).get("claim");
      if(cq){history.replaceState(null,"",location.pathname+location.hash);const c=claims.find(x=>x.id===cq||x.inward_id===cq);if(c)openAct(stage(c)==="mail"||stage(c)==="approval"?"mail":"approve",c.id)}
    })();
  </script>
</body>
</html>
