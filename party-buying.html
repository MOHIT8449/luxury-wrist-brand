  <style>
    /* Party Buying (Mohit, 17 Nov 2026): who bought what, how many times, and who stopped / never bought. */
    .pb-chip{display:inline-block;border-radius:10px;padding:1px 7px;margin:1px 3px 1px 0;font-size:11.5px;font-weight:600;white-space:nowrap}
    .pb-chip.never{background:#fdecec;color:var(--erp-red)}.pb-chip.gap{background:#fff4e0;color:#a35a00}
    .pb-chip.ok{background:#e8f6ee;color:var(--erp-green)}
    .pb-party{display:inline-flex;align-items:center;gap:6px;background:var(--erp-red-soft);border:1px solid var(--erp-red);border-radius:14px;padding:2px 4px 2px 10px;font-size:12.5px;font-weight:600}
    .pb-party button{border:0;background:transparent;font-size:15px;line-height:1;cursor:pointer;color:var(--erp-red);padding:0 4px}
    .pb-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
    .pb-tools .erp-pill{padding:4px 6px 4px 10px;font-size:13px}

    #box tr[data-party],#box tr[data-sku]{cursor:pointer}
    .pb-rlink{display:inline-block;font-size:11px;font-weight:700;color:#7a4a00;background:#fff3c4;border-radius:8px;padding:0 6px;margin-left:4px;white-space:nowrap}
    .pb-rng{white-space:nowrap;font-size:12.5px;color:var(--erp-muted)}
    #box tr.pb-low td{background:#fff5f5}#box tr.pb-low td:first-child{box-shadow:inset 3px 0 0 #c0392b}
    .sl-filters{gap:8px;margin-bottom:10px}
    .sl-filters .grow{min-width:130px}
    @media(max-width:640px){.sl-filters .grow{max-width:none!important}}
    .sl-kpis{gap:8px;margin-bottom:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
    .sl-kpi{padding:9px 12px}
    @media(max-width:640px){
      .sl-filters{gap:6px}
      .sl-filters>div{flex:1 1 30%}.sl-filters>div.grow{flex:1 1 45%;min-width:0}
      .sl-filters label{font-size:11px;margin-bottom:2px}
      .sl-filters select,.sl-filters input{font-size:13px;padding:0 6px!important;height:34px}
      .sl-filters .sl-btn{flex:1 1 0}
      .sl-kpis{grid-template-columns:1fr 1fr}
      .sl-kpi{padding:7px 10px}
      .erp-card-head{flex-wrap:wrap;gap:6px}
      .erp-card-head h2{width:100%}
      .pb-tools{width:100%}
      .pb-party{font-size:12px!important;padding:1px 2px 1px 8px!important}
      .pb-tools .sl-in{height:28px!important;width:56px!important;font-size:13px}
      .pb-tools .erp-pill{width:auto!important;flex:0 0 auto!important;min-height:0!important;padding:4px 10px!important;font-size:12.5px!important}
    }
    /* Give task to salesmen (Mohit, 17 Nov 2026) */
    .pb-give{background:#002f37;color:#fff;border:0;border-radius:6px;height:30px;padding:0 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
    .tk-back[hidden]{display:none!important}
    .tk-back{position:fixed;inset:0;z-index:3000;background:rgba(10,20,30,.45);display:grid;place-items:center;padding:8px}
    .tk-dlg{background:#fff;border-radius:12px;width:min(680px,100%);max-height:calc(100dvh - 16px);box-shadow:0 20px 50px rgba(0,0,0,.3);color:var(--erp-ink,#172b48);overflow:hidden;display:flex}
    .tk-dlg form{flex:1;min-width:0}
    .tk-dlg form{display:flex;flex-direction:column;max-height:calc(100vh - 16px)}
    .tk-dlg .hd{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--erp-line);background:#f7f9fb}
    .tk-dlg .hd b{font-size:16px;flex:1}.tk-dlg .hd button{border:0;background:transparent;font-size:22px;cursor:pointer;line-height:1;color:#6b7280}
    .tk-dlg .bd{padding:10px 14px;overflow:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 10px}
    .tk-dlg .bd>div{min-width:0}.tk-dlg .w2{grid-column:span 2}.tk-dlg .w4{grid-column:1/-1}
    .tk-dlg label.lb{display:block;font-size:12px;font-weight:600;color:#4b5763;margin-bottom:3px}
    .tk-dlg input:not([type=checkbox]):not([type=radio]),.tk-dlg select,.tk-dlg textarea{width:100%;height:36px;border:1.5px solid var(--erp-line);border-radius:6px;padding:0 8px;font:inherit;font-size:14px;background:#fff;color:inherit;min-width:0}
    .tk-dlg textarea{height:54px;padding:6px 8px;resize:vertical}
    .tk-dlg .seg{display:flex;gap:6px;flex-wrap:wrap}.tk-dlg .seg label{display:flex;align-items:center;gap:5px;border:1.5px solid var(--erp-line);border-radius:6px;padding:0 10px;height:36px;font-size:13px;font-weight:600;cursor:pointer}
    .tk-dlg .seg label:has(input:checked){border-color:#002f37;background:#e6f0f1}
    .tk-dlg .plist{border:1px solid var(--erp-line);border-radius:8px;max-height:230px;overflow:auto}
    .tk-dlg .plist .ph{display:flex;gap:8px;align-items:center;padding:5px 8px;background:#f7f9fb;border-bottom:1px solid var(--erp-line);font-size:12.5px;position:sticky;top:0}
    .tk-dlg .plist .ph button{border:1px solid var(--erp-line);background:#fff;border-radius:6px;padding:2px 8px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
    .tk-dlg .plist label{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:5px 8px;border-bottom:1px solid #eef1f4;cursor:pointer;font-size:13px}
    .tk-dlg .plist label small{grid-column:2/-1;color:var(--erp-muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .tk-dlg .plist label i{font-style:normal;font-size:11.5px;color:#6b7280;white-space:nowrap}
    .tk-dlg .plist label i.off{color:#b45309;font-weight:600}
    .tk-dlg .sum{grid-column:1/-1;background:#fffbea;border:1px solid #f3d27a;border-radius:8px;padding:7px 10px;font-size:13px}
    .tk-dlg .sum b{color:#7a4a00}
    .tk-dlg .ft{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--erp-line)}
    .tk-dlg .ft button{flex:1;height:40px;border-radius:6px;font:inherit;font-weight:700;cursor:pointer;border:1px solid var(--erp-line);background:#fff}
    .tk-dlg .ft button.go{background:#002f37;border-color:#002f37;color:#fff}
    @media(max-width:640px){.tk-dlg .bd{grid-template-columns:1fr 1fr;padding:8px 10px}.tk-dlg .w2{grid-column:1/-1}.tk-dlg .plist{max-height:190px}}
  </style>
</head>
<body>
  <div id="loading" class="status">Checking account access...</div>
  <main id="page" class="erp-main" hidden>
    <div class="erp-pagehead"><h1>Party Buying</h1><span class="grow"></span><span class="erp-badge blue">Admin &amp; Sales Head</span></div>

    <div class="sl-filters">
      <div><label for="from">From</label><input id="from" type="date"></div>
      <div><label for="to">To</label><input id="to" type="date"></div>
      <div><label for="basis">Count as</label><select id="basis"><option value="booked">Booked</option><option value="loaded">Loaded</option></select></div>
      <div><label for="catBtn">Category</label><div id="cat"></div></div>
      <div><label for="scope">Parties</label><select id="scope"><option value="buyers">Brand buyers</option><option value="all">All active</option></select></div>
      <div><label for="smBtn">Salesman</label><div id="sm"></div></div>
      <div class="grow" style="max-width:240px"><label for="partyBtn">Party</label><div id="party"></div></div>
      <div class="grow"><label for="q">Search SKU / party</label><input id="q" type="search" autocomplete="off" placeholder="Type to filter..."></div>
      <button id="refresh" type="button" class="sl-btn">Refresh</button>
      <button id="excel" type="button" class="sl-btn ghost">Excel</button>
    </div>

    <div class="sl-kpis" id="kpis"></div>
    <div class="erp-pills" id="tabs"></div>
    <section class="erp-card">
      <div class="erp-card-head"><h2 id="tabTitle"></h2><div id="tabTools" class="pb-tools"></div></div>
      <div class="sl-scroll" id="box"></div>
    </section>
    <p class="sl-note" id="note"></p>
  </main>
  <div class="tk-back" id="tkDlg" hidden><div class="tk-dlg" role="dialog" aria-modal="true" aria-labelledby="tkHd"><form id="tkForm" onsubmit="return false">
    <div class="hd"><b id="tkHd">📋 Give follow-up task</b><button type="button" id="tkX" aria-label="Close">×</button></div>
    <div class="bd">
      <div class="w4"><label class="lb">Give to</label><div class="seg">
        <label><input type="radio" name="tkTo" value="own" checked> Each party's own salesman</label>
        <label><input type="radio" name="tkTo" value="pick"> Chosen people</label></div></div>
      <div class="w2" id="tkPickBox" hidden><label class="lb" for="tkPickBtn">People (each gets all ticked parties)</label><div id="tkPick"></div></div>
      <div class="w2" id="tkOffBox" hidden><label class="lb" for="tkOff">Office parties (no salesman) go to</label><select id="tkOff"></select></div>
      <div><label class="lb" for="tkOrders">Orders to bring (each)</label><input id="tkOrders" type="number" min="0" max="999" inputmode="numeric" placeholder="e.g. 5"></div>
      <div><label class="lb" for="tkDue">Due date</label><input id="tkDue" type="date"></div>
      <div><label class="lb" for="tkPri">Priority</label><select id="tkPri"><option value="NORMAL">Normal</option><option value="URGENT">Urgent</option></select></div>
      <div><label class="lb" for="tkPushBtn">⭐ Items to push</label><div id="tkPush"></div></div>
      <div class="w4"><label class="lb" for="tkNote">Note for the salesman</label><textarea id="tkNote" maxlength="500" placeholder="e.g. Take scheme sheet, collect old payment"></textarea></div>
      <div class="w4"><label class="lb">Parties to follow up</label><div class="plist" id="tkParties"></div></div>
      <div class="sum" id="tkSum"></div>
    </div>
    <div class="ft"><button type="button" id="tkCancel">Cancel</button><button type="button" class="go" id="tkGo">Give task</button></div>
  </form></div></div>
  <script>
    const S=LWBSales,{client,el,esc,fmt,short,num,key}=S;
    const TABS=[["party","Party-wise"],["sku","SKU-wise"],["cat","Category-wise"],["psku","Party × SKU"],["rate","Rate Check"],["gap","Not Buying"],["stop","Stopped Buying"]];
    let rateSku="",rateMode="all",setBrands=new Map(),parties=[],skus=[],orders=[],lines=[],err="",tab="party",gapMode="all",gapDays=30,BB={get:()=>""};
    const today=()=>S.isoDay(new Date());
    const since=d=>d?S.daysBetween(d,today()):null;
    const UNCAT="No category";

    async function loadAll(){
      const from=el("from").value,to=el("to").value;
      if(!from||!to||from>to){await alert("Select a valid From and To date.");return}
      el("refresh").disabled=true;el("box").innerHTML='<div class="erp-empty">Loading...</div>';err="";
      try{
        const [pa,sk]=await Promise.all([client.rpc("lwb_party_activity"),client.from("sku_master").select("*"),window.LWBBrand&&LWBBrand.aliases?LWBBrand.aliases(client):null]);
        if(pa.error)throw Error(/lwb_party_activity/.test(pa.error.message)?"Run lwb_sales_team_setup.sql in Supabase first.":pa.error.message);
        parties=pa.data||[];
        // Brands ticked in Party Master (lwb_party_brands_setup.sql); a party with none goes by what it bought.
        const pb=await client.from("lwb_customer_master").select("customer_name,brand_ids");
        setBrands=new Map(pb.error?[]:(pb.data||[]).filter(x=>x.brand_ids&&x.brand_ids.length).map(x=>[key(x.customer_name),new Set(x.brand_ids)]));
        skus=(sk.data||[]).map(s=>({name:String(s.sku_name||"").trim(),k:S.skuKey(s.sku_name),cat:String(s.category||"").trim()||UNCAT,co:s.company_id||"",active:s.is_active!==false}));
        orders=await S.orders(from,to);
        const items=await S.inChunks("order_items","order_id",orders.map(o=>o.id),"order_id,sku_name,ordered_qty,approved_qty,loaded_qty,rate");
        build(items);fillLists();
      }catch(e){err=e.message||String(e)}
      el("refresh").disabled=false;render();
    }

    // One line per SKU per PO: party, SKU (current name), category, qty, amount, day.
    function build(items){
      const basis=el("basis").value,bySku=new Map(skus.map(s=>[s.k,s])),pBy=new Map(parties.map(p=>[key(p.customer_name),p])),oBy=new Map();
      for(const o of orders){const p=pBy.get(key(o.customer_name));o.day=S.istDay(o.order_date||o.created_at);o.pk=key(o.customer_name);o.sm=p&&p.salesman_name||"Office";o.smId=p&&p.salesman_id||"";oBy.set(o.id,o)}
      lines=[];
      for(const it of items){
        const o=oBy.get(it.order_id);if(!o)continue;
        const q=S.lineQty(it,o,basis);if(!q)continue;
        const k=S.skuKey(it.sku_name),s=bySku.get(k);
        lines.push({o,pk:o.pk,party:String(o.customer_name||"").trim(),sk:k,sku:s?s.name:String(it.sku_name||"Unknown SKU").trim(),cat:s?s.cat:UNCAT,co:s?s.co:"",q,amt:q*num(it.rate),rate:num(it.rate),day:o.day});
      }
    }
    // Lists follow the brand on top (Mohit, 17 Nov 2026): Coca-Cola shows only Coca-Cola categories, and
    // (with "Brand buyers") only that brand's parties and their salesmen.
    function fillLists(){
      MS.cat.items([...new Set(skus.filter(s=>!BB.get()||s.co===BB.get()).map(s=>s.cat))].sort().map(c=>({v:c,t:c})));
      const b=el("scope").value==="all"?null:buyers(),ps=parties.filter(p=>!b||b.has(key(p.customer_name)));
      const sms=new Map();for(const p of ps)if(p.salesman_id)sms.set(p.salesman_id,p.salesman_name);
      MS.sm.items([{v:"none",t:"Office (no salesman)"},...[...sms].sort((a,b)=>String(a[1]).localeCompare(b[1])).map(([id,n])=>({v:id,t:n}))]);
      MS.party.items(ps.map(p=>({v:key(p.customer_name),t:String(p.customer_name||"").trim()})));
    }

    // Filters shared by every tab.
    const match=s=>{const q=key(el("q").value);return !q||key(s).includes(q)};
    // Tick-box filters (Mohit, 17 Nov 2026): nothing ticked = All; several salesmen / parties / categories at once.
    const MS={};
    const partySet=()=>MS.party.get(),partyOk=k=>{const s=partySet();return !s.size||s.has(k)};
    const partyPick=()=>{const s=partySet();return s.size===1?[...s][0]:""};
    const partyName=()=>MS.party.names()[0]||"";
    const smOk=id=>{const s=MS.sm.get();return !s.size||s.has(id||"none")};
    const skuOk=s=>{const c=MS.cat.get();return (!BB.get()||s.co===BB.get())&&(!c.size||c.has(s.cat))};
    const L=()=>lines.filter(l=>skuOk(l)&&smOk(l.o.smId)&&partyOk(l.pk));
    // Brand buyers (Mohit, 17 Nov 2026): a Rajnigandha-only party is not "not buying" Coca-Cola. With "Brand buyers",
    // only parties that bought any SKU of the chosen brand (all brands = anything) in these dates are counted.
    const buyers=()=>{const b=new Set(lines.filter(l=>!setBrands.has(l.pk)&&(!BB.get()||l.co===BB.get())).map(l=>l.pk));
      for(const [k,v] of setBrands)if(!BB.get()||v.has(BB.get()))b.add(k);return b};
    const P=()=>{const b=el("scope").value==="all"?null:buyers();return parties.filter(p=>smOk(p.salesman_id)&&partyOk(key(p.customer_name))&&(!b||b.has(key(p.customer_name))))};
    // Brands each party buys: with "Brand buyers", a party is only checked against SKUs of brands it buys.
    const brandsOf=()=>{const m=new Map(setBrands);for(const l of lines){if(setBrands.has(l.pk))continue;if(!m.has(l.pk))m.set(l.pk,new Set());m.get(l.pk).add(l.co)}return m};
    const skuFor=(bm,pk,co)=>el("scope").value==="all"||!!(bm.get(pk)&&bm.get(pk).has(co));
    const scopeWord=()=>el("scope").value==="all"?"active parties":(BB.get()&&BB.name?BB.name(BB.get())+" ":"")+"buyers";
    function group(list,keyOf,init,add){const m=new Map();for(const x of list){const k=keyOf(x);if(!m.has(k))m.set(k,init(x));add(m.get(k),x)}return [...m.values()]}
    const ageTag=d=>d==null?'<span class="sl-age never">Never</span>':'<span class="sl-age '+(d>=30?"a10":d>=15?"a5":d>=7?"a2":"")+'">'+d+" d</span>";
    // Selling rate (Mohit, 17 Nov 2026): average = amount ÷ qty of lines with a rate (free / zero-rate lines left out).
    function rateOf(list){let q=0,a=0,mn=Infinity,mx=0,ld="",lr=0;for(const l of list){if(!(l.rate>0))continue;q+=l.q;a+=l.q*l.rate;if(l.rate<mn)mn=l.rate;if(l.rate>mx)mx=l.rate;if(l.day>=ld){ld=l.day;lr=l.rate}}
      return q?{avg:Math.round(a/q*100)/100,min:mn,max:mx,last:lr}:null}
    const rs=n=>n==null?"—":"₹"+Number(n).toLocaleString("en-IN",{maximumFractionDigits:2});
    const rangeTxt=r=>!r?"—":r.min===r.max?rs(r.min):rs(r.min)+" – "+rs(r.max);
    // Party × SKU stats: times (POs), qty, amount, first / last day, usual gap.
    function pairs(list){
      return group(list,l=>l.pk+"|"+l.sk,l=>({pk:l.pk,party:l.party,sm:l.o.sm,sk:l.sk,sku:l.sku,cat:l.cat,ords:new Set(),days:new Set(),q:0,amt:0,first:l.day,last:l.day,ls:[]}),
        (x,l)=>{x.ls.push(l);x.ords.add(l.o.id);x.days.add(l.day);x.q+=l.q;x.amt+=l.amt;if(l.day<x.first)x.first=l.day;if(l.day>x.last)x.last=l.day})
        .map(x=>({...x,r:rateOf(x.ls),times:x.ords.size,gap:x.days.size>1?Math.round(S.daysBetween(x.first,x.last)/(x.days.size-1)):null,ago:since(x.last)}));
    }

    function view(){
      const ls=L(),range=S.shortDate(el("from").value)+" – "+S.shortDate(el("to").value);
      if(tab==="party"){
        const g=group(ls,l=>l.pk,l=>({pk:l.pk,name:l.party,sm:l.o.sm,ords:new Set(),q:0,amt:0,sk:new Set(),cat:new Set(),last:""}),(x,l)=>{x.ords.add(l.o.id);x.q+=l.q;x.amt+=l.amt;x.sk.add(l.sk);x.cat.add(l.cat);if(l.day>x.last)x.last=l.day});
        const city=new Map(parties.map(p=>[key(p.customer_name),p.city||""]));
        const rows=g.filter(x=>match(x.name+" "+x.sm)).sort((a,b)=>b.amt-a.amt).map(x=>({attr:' data-party="'+esc(x.name)+'"',tk:{pk:x.pk,name:x.name,miss:[]},
          data:[x.name,city.get(x.pk)||"",x.sm,x.ords.size,x.q,x.amt,x.sk.size,x.cat.size,x.last,since(x.last)],
          show:[esc(x.name),esc(city.get(x.pk)||"—"),esc(x.sm),fmt(x.ords.size),fmt(x.q),short(x.amt),fmt(x.sk.size),fmt(x.cat.size),S.shortDate(x.last),ageTag(since(x.last))]}));
        return {title:"Party-wise buying · "+range,head:["Party","City","Salesman","Times (POs)","Qty","Amount","SKUs","Categories","Last Buy","Days Ago"],num:[3,4,5,6,7],rows,sum:[3,4,5],
          note:"Tap a party to see each SKU it bought (Party × SKU). Times = POs in these dates."};
      }
      if(tab==="sku"){
        const nP=P().length,bm=brandsOf(),pl=P().map(p=>key(p.customer_name));
        const g=group(ls,l=>l.sk,l=>({sk:l.sk,name:l.sku,cat:l.cat,co:l.co,ords:new Set(),pk:new Set(),q:0,amt:0,last:"",ls:[]}),(x,l)=>{x.ls.push(l);x.ords.add(l.o.id);x.pk.add(l.pk);x.q+=l.q;x.amt+=l.amt;if(l.day>x.last)x.last=l.day});
        for(const x of g){x.r=rateOf(x.ls);x.below=x.r?pairs(x.ls).filter(p=>p.r&&p.r.avg<x.r.avg*0.995).length:0}
        for(const x of g)x.notB=pl.filter(k=>skuFor(bm,k,x.co)&&!x.pk.has(k)).length;
        const rows=g.filter(x=>match(x.name+" "+x.cat)).sort((a,b)=>b.q-a.q).map(x=>({attr:' data-sku="'+esc(x.sk)+'"',data:[x.name,x.cat,x.ords.size,x.pk.size,x.notB,x.q,x.amt,x.r?x.r.avg:"",rangeTxt(x.r),x.below,x.last,since(x.last)],
          show:[esc(x.name)+' <span class="pb-rlink">₹ rates ›</span>',esc(x.cat),fmt(x.ords.size),fmt(x.pk.size),'<b style="color:var(--erp-red)">'+fmt(x.notB)+"</b>",fmt(x.q),short(x.amt),"<b>"+rs(x.r&&x.r.avg)+"</b>",'<span class="pb-rng">'+rangeTxt(x.r)+"</span>",x.below?'<span class="pb-chip never">'+fmt(x.below)+"</span>":"0",S.shortDate(x.last),ageTag(since(x.last))]}));
        return {title:"SKU-wise sales · "+range,head:["SKU","Category","Times (POs)","Parties Bought","Parties Not Bought","Qty","Amount","Avg Rate","Low – High","Below Avg","Last Sold","Days Ago"],num:[2,3,4,5,6,7,9],rows,sum:[2,5,6],
          note:"Parties Not Bought = "+scopeWord()+" ("+fmt(nP)+" with these filters) that did not buy this SKU in these dates. Avg Rate = amount ÷ qty (selling rate on the PO; free / zero-rate lines left out). Below Avg = parties whose own average rate is under the SKU average. Tap an SKU to see every party's rate (Rate Check)."};
      }
      if(tab==="cat"){
        const tot=ls.reduce((a,l)=>a+l.amt,0);
        const g=group(ls,l=>l.cat,l=>({name:l.cat,ords:new Set(),pk:new Set(),sk:new Set(),q:0,amt:0}),(x,l)=>{x.ords.add(l.o.id);x.pk.add(l.pk);x.sk.add(l.sk);x.q+=l.q;x.amt+=l.amt});
        const rows=g.filter(x=>match(x.name)).sort((a,b)=>b.amt-a.amt).map(x=>({data:[x.name,x.ords.size,x.pk.size,x.sk.size,x.q,x.amt,tot?Math.round(x.amt/tot*1000)/10:0],
          show:[esc(x.name),fmt(x.ords.size),fmt(x.pk.size),fmt(x.sk.size),fmt(x.q),short(x.amt),(tot?(x.amt/tot*100).toFixed(1):"0")+"%"+S.bar(tot?x.amt/tot*100:0)]}));
        return {title:"Category-wise sales · "+range,head:["Category","Times (POs)","Parties","SKUs","Qty","Amount","Share"],num:[1,2,3,4,5],rows,sum:[4,5],note:"Category comes from SKU Master."};
      }
      if(tab==="psku"){
        const rows=pairs(ls).filter(x=>match(x.party+" "+x.sku+" "+x.cat)).sort((a,b)=>a.party.localeCompare(b.party)||b.q-a.q).map(x=>({tk:{pk:x.pk,name:x.party,miss:[]},
          data:[x.party,x.sku,x.cat,x.times,x.q,x.amt,x.r?x.r.avg:"",x.first,x.last,x.ago,x.gap==null?"":x.gap],
          show:[esc(x.party),esc(x.sku),esc(x.cat),fmt(x.times),fmt(x.q),short(x.amt),rs(x.r&&x.r.avg),S.shortDate(x.first),S.shortDate(x.last),ageTag(x.ago),x.gap==null?"—":"every "+x.gap+" d"]}));
        return {title:(partyPick()?partyName():"Party × SKU")+" · "+range,head:["Party","SKU","Category","Times","Qty","Amount","Avg Rate","First Buy","Last Buy","Days Ago","Usual Gap"],num:[3,4,5,6],rows,sum:[3,4,5],
          note:"Usual gap = on average how many days between two buys of this SKU by this party."};
      }
      if(tab==="rate"){
        // Rate Check: each party's average selling rate for an SKU vs the SKU's average (all parties, these filters).
        const skuAvg=new Map();for(const x of group(ls,l=>l.sk,l=>({sk:l.sk,ls:[]}),(x,l)=>x.ls.push(l)))skuAvg.set(x.sk,rateOf(x.ls));
        const rName=rateSku?(ls.find(l=>l.sk===rateSku)||lines.find(l=>l.sk===rateSku)||{}).sku||"":"";
        let ps=pairs(rateSku?ls.filter(l=>l.sk===rateSku):ls).filter(x=>x.r&&skuAvg.get(x.sk)&&match(x.party+" "+x.sku+" "+x.sm));
        for(const x of ps){const a=skuAvg.get(x.sk).avg;x.avgAll=a;x.diff=Math.round((x.r.avg-a)*100)/100;x.pct=a?Math.round((x.r.avg-a)/a*1000)/10:0}
        if(rateMode==="below")ps=ps.filter(x=>x.pct<=-0.5);else if(rateMode==="above")ps=ps.filter(x=>x.pct>=0.5);
        ps.sort((a,b)=>a.pct-b.pct||b.q-a.q);
        const tag=x=>x.pct<=-0.5?'<span class="pb-chip never">'+rs(-x.diff)+" below · "+x.pct+"%</span>":x.pct>=0.5?'<span class="pb-chip ok">'+rs(x.diff)+" above · +"+x.pct+"%</span>":'<span class="pb-chip">At avg</span>';
        const one=!!rateSku,cut=a=>one?a.filter((_,i)=>i!==2):a;
        const rows=ps.map(x=>({attr:' data-party="'+esc(x.party)+'"',tk:{pk:x.pk,name:x.party,miss:[]},cls:x.pct<=-0.5?"pb-low":"",
          data:cut([x.party,x.sm,x.sku,x.times,x.q,x.amt,x.r.avg,x.avgAll,x.pct,rangeTxt(x.r),x.r.last,x.last]),
          show:cut([esc(x.party),esc(x.sm),esc(x.sku),fmt(x.times),fmt(x.q),short(x.amt),"<b>"+rs(x.r.avg)+"</b>",rs(x.avgAll),tag(x),'<span class="pb-rng">'+rangeTxt(x.r)+"</span>",rs(x.r.last),S.shortDate(x.last)])}));
        const all=skuAvg.get(rateSku);
        return {title:"Rate check · "+(rateSku?rName+" · avg "+rs(all&&all.avg)+" · "+rangeTxt(all):"every SKU")+" · "+range,
          tools:(rateSku?'<span class="pb-party">'+esc(rName)+'<button type="button" id="clearSku" aria-label="All SKUs">×</button></span>':"")+[["all","All"],["below","Below avg"],["above","Above avg"]].map(([k,l])=>'<button type="button" class="erp-pill'+(rateMode===k?" active":"")+'" data-rate="'+k+'">'+esc(l)+"</button>").join(""),
          head:cut(["Party","Salesman","SKU","Times","Qty","Amount","Party Avg","SKU Avg","Gap vs Avg %","Low – High","Last Rate","Last Buy"]),num:one?[2,3,4,5,6,9]:[3,4,5,6,7,10],rows,sum:one?[2,3,4]:[3,4,5],
          note:"Party Avg Rate = this party's amount ÷ qty for the SKU. SKU Avg Rate = all parties in these filters. Red = party pays less than average (rate gap), lowest first. Rate is the selling rate on the PO; free / zero-rate lines are left out."};
      }
      const tools=[["all","All"],["never","Never bought"],["days","Not in "+gapDays+"+ days"]].map(([k,l])=>'<button type="button" class="erp-pill'+(gapMode===k?" active":"")+'" data-gap="'+k+'">'+esc(l)+"</button>").join("")+
        '<label for="gapDays" style="font-size:12px;font-weight:600">Days</label><input id="gapDays" class="sl-in" type="number" min="1" max="365" value="'+gapDays+'">';
      if(tab==="stop"){
        const rows=pairs(ls).filter(x=>x.times>=3&&x.gap!=null&&x.ago>=Math.max(7,x.gap*2)&&x.ago>=Math.min(gapDays,x.gap*2)&&match(x.party+" "+x.sku+" "+x.sm)).sort((a,b)=>b.amt-a.amt).map(x=>({attr:' data-party="'+esc(x.party)+'"',tk:{pk:x.pk,name:x.party,miss:[x.sku]},
          data:[x.party,x.sm,x.sku,x.times,x.gap,x.last,x.ago,Math.round(x.ago/Math.max(1,x.gap)*10)/10,x.amt],
          show:[esc(x.party),esc(x.sm),esc(x.sku),fmt(x.times),"every "+x.gap+" d",S.shortDate(x.last),ageTag(x.ago),'<b style="color:var(--erp-red)">'+(x.ago/Math.max(1,x.gap)).toFixed(1)+"× late</b>",short(x.amt)]}));
        return {title:"Regular parties that stopped an SKU",tools:'<label for="gapDays" style="font-size:12px;font-weight:600">At least</label><input id="gapDays" class="sl-in" type="number" min="1" max="365" value="'+gapDays+'"><span style="font-size:12px">days</span>',
          head:["Party","Salesman","SKU","Times Bought","Usual Gap","Last Buy","Days Ago","Late","Amount Before"],num:[3,8],rows,
          note:"Regular = bought this SKU 3+ times in these dates. Shown when the days since the last buy are at least 2× its usual gap (and the days above). Use a longer From date (90–180 days) for a better picture."};
      }
      // Not Buying: active parties × SKUs that sold to anyone in these dates.
      const sold=group(lines.filter(l=>skuOk(l)),l=>l.sk,l=>({sk:l.sk,sku:l.sku,cat:l.cat,co:l.co,pk:new Set()}),(x,l)=>x.pk.add(l.pk)).sort((a,b)=>b.pk.size-a.pk.size);
      const last=new Map(),times=new Map();
      for(const x of pairs(lines.filter(l=>skuOk(l)))){last.set(x.pk+"|"+x.sk,x.last);times.set(x.pk+"|"+x.sk,x.times)}
      const st=(pk,sk)=>{const d=last.get(pk+"|"+sk);if(!d)return "never";return since(d)>=gapDays?"days":"ok"};
      const bm=brandsOf(),mine=pk=>sold.filter(s=>skuFor(bm,pk,s.co));
      const want=s=>gapMode==="all"?s!=="ok":s===gapMode;
      if(partyPick()){
        const pk=partyPick();
        const rows=mine(pk).map(s=>({s,st:st(pk,s.sk),d:last.get(pk+"|"+s.sk)})).filter(x=>want(x.st)&&match(x.s.sku+" "+x.s.cat)).map(({s,st:t,d})=>({tk:{pk,name:partyName(),miss:[s.sku]},
          data:[s.sku,s.cat,t==="never"?"Never bought":"Not in "+gapDays+"+ days",d||"",d?since(d):"",times.get(pk+"|"+s.sk)||0,s.pk.size],
          show:[esc(s.sku),esc(s.cat),t==="never"?'<span class="pb-chip never">Never bought</span>':'<span class="pb-chip gap">Not in '+gapDays+'+ days</span>',S.shortDate(d),d?ageTag(since(d)):"—",fmt(times.get(pk+"|"+s.sk)||0),fmt(s.pk.size)]}));
        return {title:"Not buying · "+partyName(),tools,head:["SKU","Category","Status","Last Buy","Days Ago","Times Bought","Other Parties Buying"],num:[5,6],rows,
          note:"SKUs that sold to at least one party in these dates. Top rows are bought by the most parties, so they are the easiest to push to this party."};
      }
      const rows=[];
      for(const p of P()){
        const pk=key(p.customer_name);if(!match(p.customer_name+" "+(p.salesman_name||"")))continue;
        const my=mine(pk),miss=my.map(s=>({s,t:st(pk,s.sk)})).filter(x=>want(x.t));if(!miss.length)continue;
        const nev=miss.filter(x=>x.t==="never").length,gp=miss.length-nev,bought=my.length-my.filter(s=>st(pk,s.sk)==="never").length;
        const chips=miss.slice(0,8).map(x=>'<span class="pb-chip '+(x.t==="never"?"never":"gap")+'">'+esc(x.s.sku)+"</span>").join("")+(miss.length>8?'<span class="pb-chip">+'+(miss.length-8)+" more</span>":"");
        rows.push({attr:' data-party="'+esc(p.customer_name)+'"',miss:miss.length,tk:{pk,name:String(p.customer_name||"").trim(),miss:miss.map(x=>x.s.sku)},
          data:[p.customer_name,p.salesman_name||"Office",p.last_order_date||"",bought,nev,gp,miss.map(x=>x.s.sku).join(", ")],
          show:[esc(p.customer_name),esc(p.salesman_name||"Office"),ageTag(since(p.last_order_date)),fmt(bought)+" / "+fmt(my.length),fmt(nev),fmt(gp),chips]});
      }
      rows.sort((a,b)=>b.miss-a.miss);
      return {title:"SKUs each party is not buying",tools,head:["Party","Salesman","Last Order","SKUs Bought","Never","Not in "+gapDays+"+ d","Not buying (most-sold first)"],num:[4,5],rows,wide:[6],
        note:"Parties: "+scopeWord()+" (change in the Parties filter). Brands come from Party Master when ticked there, else from what the party bought. Red = never bought in these dates, orange = bought before but not in "+gapDays+"+ days. Only SKUs that sold to someone in these dates, of the brands this party buys. Tap a party for its full list."};
    }

    // Table: header labels repeat on phone cards (sl-stack), no side scroll.
    function table(v){
      const c=i=>[(v.num||[]).includes(i)?"num":"",i===0?"sl-first":"",(v.wide||[]).includes(i)?"sl-wide":""].filter(Boolean).join(" ");
      let h=CF.chips(tab,v.head)+'<table class="erp-table sl-stack"><thead><tr>'+v.head.map((x,i)=>'<th class="'+c(i)+'">'+esc(x)+"</th>").join("")+"</tr>"+CF.row(tab,v.head)+"</thead><tbody>";
      for(const r of v.rows)h+="<tr"+(r.attr||"")+(r.cls?' class="'+r.cls+'"':"")+">"+r.show.map((x,i)=>'<td class="'+c(i)+'" data-label="'+esc(v.head[i])+'">'+x+"</td>").join("")+"</tr>";
      h+="</tbody>";
      if(v.sum&&v.rows.length)h+="<tfoot><tr>"+v.head.map((x,i)=>'<td class="'+c(i)+'" data-label="'+esc(x)+'">'+(i===0?"Total":v.sum.includes(i)?(/Amount/.test(x)?short:fmt)(v.rows.reduce((a,r)=>a+num(r.data[i]),0)):"")+"</td>").join("")+"</tr></tfoot>";
      return h+"</table>";
    }
    let current=null;
    // Excel-style ▾ filter / sort on every column (erp-colfilter.js), per tab.
    const CF=LWBCol.create({onChange:()=>render()});
    const colFilter=v=>{const all=v.rows.length;v.rows=CF.apply(tab,v.head,v.rows,{split:v.wide});v.all=all;return v};
    function render(){
      el("tabs").innerHTML=TABS.map(([id,l])=>'<button type="button" class="erp-pill'+(id===tab?" active":"")+'" data-tab="'+id+'">'+esc(l)+"</button>").join("");
      if(err){el("kpis").innerHTML="";el("box").innerHTML='<div class="sl-msg">Could not load: '+esc(err)+"</div>";el("tabTitle").textContent="";el("tabTools").innerHTML="";return}
      renderKpis();
      const v=colFilter(view());current=v;
      el("tabTitle").textContent=v.title;
      const nc=CF.count(tab);
      el("tabTools").innerHTML=(nc?'<span class="pb-party">'+fmt(v.rows.length)+" of "+fmt(v.all)+" rows · "+nc+' column filter'+(nc>1?"s":"")+'<button type="button" data-cf="x" data-cfk="'+esc(tab)+'" aria-label="Clear column filters">×</button></span>':"")+(partySet().size?'<span class="pb-party">'+esc(MS.party.label())+'<button type="button" id="clearParty" aria-label="Clear party">×</button></span>':"")+(v.tools||"")+(tkTabs.includes(tab)&&v.rows.some(r=>r.tk)?'<button type="button" class="pb-give" id="giveTask" title="Give these parties as a follow-up task to the salesmen">📋 Give task</button>':"");
      el("note").textContent=v.note||"";
      el("box").innerHTML=v.rows.length||!v.all?(v.rows.length?table(v):'<div class="erp-empty">Nothing to show for these filters.</div>'):CF.chips(tab,v.head)+'<div class="erp-empty">No rows match the column filters. <button type="button" class="erp-pill" data-cf="x" data-cfk="'+esc(tab)+'">Clear column filters</button></div>';
    }
    function renderKpis(){
      const ls=L(),pk=new Set(ls.map(l=>l.pk)),sk=new Set(ls.map(l=>l.sk)),ords=new Set(ls.map(l=>l.o.id)),nP=P().length;
      const stop=pairs(ls).filter(x=>x.times>=3&&x.gap!=null&&x.ago>=Math.max(7,x.gap*2)&&x.ago>=Math.min(gapDays,x.gap*2)).length;
      const k=[["green","Parties Bought",fmt(pk.size),"of "+fmt(nP)+" "+scopeWord()+" · "+fmt(Math.max(0,nP-pk.size))+" bought nothing"],
        ["blue","SKUs Sold",fmt(sk.size),fmt(ords.size)+" POs"],
        ["","Qty · Amount",fmt(ls.reduce((a,l)=>a+l.q,0)),short(ls.reduce((a,l)=>a+l.amt,0))],
        [stop?"red":"","Stopped Buying",fmt(stop),"regular party + SKU, 2× late"]];
      el("kpis").innerHTML=k.map(x=>'<div class="sl-kpi '+x[0]+'"><span>'+esc(x[1])+"</span><b>"+x[2]+"</b><small>"+x[3]+"</small></div>").join("");
    }
    async function exportExcel(){
      try{
        if(err)return;
        const keep=tab,sheets=[];
        for(const [id,l] of TABS){tab=id;const v=colFilter(view());sheets.push({name:l.replace("×","x"),title:"LUXURY WRIST BRAND — "+v.title+" — "+el("from").value+" to "+el("to").value,head:v.head,rows:v.rows.map(r=>r.data)})}
        tab=keep;
        await S.excel("Party-Buying-"+el("from").value+"-to-"+el("to").value,sheets);
      }catch(e){await alert("Excel export failed: "+e.message)}
    }

    // ---------- Give task to salesmen (Mohit, 17 Nov 2026) ----------
    // From the parties on screen (after every filter): one task per person via lwb_task_add
    // (lwb_task_management_setup.sql). The salesman sees it as a popup on his Dashboard.
    const TK={parties:[],people:null,pick:null,push:null,sel:new Set()};
    const tkTabs=["party","psku","rate","gap","stop"];
    function tkCollect(){
      const pBy=new Map(parties.map(p=>[key(p.customer_name),p])),m=new Map();
      for(const r of (current&&current.rows)||[]){const t=r.tk;if(!t)continue;
        if(!m.has(t.pk)){const p=pBy.get(t.pk)||{};m.set(t.pk,{pk:t.pk,name:t.name,smId:p.salesman_id||"",sm:p.salesman_name||"",last:p.last_order_date||"",miss:[]})}
        const x=m.get(t.pk);for(const k of t.miss)if(!x.miss.includes(k))x.miss.push(k)}
      return [...m.values()];
    }
    async function tkPeople(){
      if(TK.people)return TK.people;
      const r=await client.rpc("lwb_task_people");
      if(r.error)throw Error(/lwb_task_people/.test(r.error.message)?"Task Management is not set up (lwb_task_management_setup.sql).":r.error.message);
      return TK.people=r.data||[];
    }
    // Who gets which parties. own: party's salesman (if he has a login here), else the Office pick.
    function tkPlan(){
      const ok=new Set((TK.people||[]).map(p=>p.id)),list=TK.parties.filter(p=>TK.sel.has(p.pk)),plan=new Map(),skip=[];
      const add=(id,p)=>{if(!plan.has(id))plan.set(id,[]);plan.get(id).push(p)};
      if(document.querySelector('input[name=tkTo]:checked').value==="pick"){const ids=[...TK.pick.get()];for(const id of ids)for(const p of list)add(id,p);return {plan,skip,needOff:false}}
      const off=el("tkOff").value;let needOff=false;
      for(const p of list){if(p.smId&&ok.has(p.smId))add(p.smId,p);else{needOff=true;off?add(off,p):skip.push(p)}}
      return {plan,skip,needOff};
    }
    const tkName=id=>{const p=(TK.people||[]).find(x=>x.id===id);return p?p.name:"?"};
    function tkTitle(n){
      const o=Math.max(0,Math.round(num(el("tkOrders").value))),push=TK.push.get().size;
      return ("Follow up "+n+" part"+(n===1?"y":"ies")+(o?" · bring "+o+" order"+(o>1?"s":""):"")+(push?" · push "+push+" item"+(push>1?"s":""):"")).slice(0,150);
    }
    function tkDetails(list){
      const o=Math.max(0,Math.round(num(el("tkOrders").value))),push=[...TK.push.get()],note=el("tkNote").value.trim();
      const head=["Target for "+S.shortDate(el("tkDue").value)+": follow up "+list.length+" part"+(list.length===1?"y":"ies")+(o?", bring "+o+" order"+(o>1?"s":""):"")+"."];
      if(push.length)head.push("⭐ Push items: "+push.join(", "));
      if(note)head.push("Note: "+note);
      head.push("","Parties:");
      let out=head.join("\n");
      for(let i=0;i<list.length;i++){
        const p=list[i],d=since(p.last),line="\n"+(i+1)+". "+p.name+" · "+(d==null?"no order yet":"last order "+d+" d ago")+(p.miss.length?" · not buying: "+p.miss.slice(0,5).join(", ")+(p.miss.length>5?" +"+(p.miss.length-5):""):"");
        const tail="\n+"+(list.length-i)+" more parties (open Party Buying)";
        if(out.length+line.length+tail.length>1990){out+=tail;break}
        out+=line;
      }
      return out;
    }
    function tkDraw(){
      const ps=TK.parties,pick=document.querySelector('input[name=tkTo]:checked').value==="pick";
      el("tkPickBox").hidden=!pick;
      const ok=new Set((TK.people||[]).map(p=>p.id));
      el("tkParties").innerHTML='<div class="ph"><b>'+fmt(TK.sel.size)+" of "+fmt(ps.length)+' ticked</b><span style="flex:1"></span><button type="button" data-tka="all">Tick all</button><button type="button" data-tka="none">Untick all</button></div>'+
        ps.map(p=>{const d=since(p.last),own=p.smId&&ok.has(p.smId);return '<label><input type="checkbox" value="'+esc(p.pk)+'"'+(TK.sel.has(p.pk)?" checked":"")+"><span>"+esc(p.name)+'</span><i class="'+(own||pick?"":"off")+'">'+esc(own?p.sm:"Office")+"</i><small>"+(d==null?"No order yet":"Last order "+d+" d ago")+(p.miss.length?" · not buying "+esc(p.miss.slice(0,4).join(", "))+(p.miss.length>4?" +"+(p.miss.length-4):""):"")+"</small></label>"}).join("");
      const {plan,skip,needOff}=tkPlan();
      el("tkOffBox").hidden=pick||!needOff;
      const who=[...plan].map(([id,l])=>"<b>"+esc(tkName(id))+"</b> "+l.length).join(" · ");
      el("tkSum").innerHTML=plan.size?"Will give <b>"+plan.size+" task"+(plan.size>1?"s":"")+"</b>: "+who+(skip.length?' · <span style="color:#c0392b">'+skip.length+" Office parties left out (pick who gets them)</span>":"")+'<br><small>Title like: '+esc(tkTitle([...plan.values()][0].length))+"</small>":(pick?"Pick the people who get the task.":skip.length?"Pick who gets the Office parties.":"Tick at least one party.");
      el("tkGo").disabled=!plan.size;el("tkGo").textContent=plan.size>1?"Give "+plan.size+" tasks":"Give task";
    }
    async function tkOpen(){
      TK.parties=tkCollect();
      if(!TK.parties.length){await alert("No party on screen. Open Party-wise, Not Buying or Stopped Buying first.");return}
      try{await tkPeople()}catch(e){await alert(e.message);return}
      if(!TK.pick){
        TK.pick=LWBMulti.mount(el("tkPick"),{all:"Nobody",onChange:tkDraw});
        TK.push=LWBMulti.mount(el("tkPush"),{all:"None",onChange:tkDraw});
        el("tkForm").addEventListener("change",e=>{const c=e.target;if(c.closest("#tkParties")&&c.type==="checkbox"){c.checked?TK.sel.add(c.value):TK.sel.delete(c.value)}tkDraw()});
        el("tkForm").addEventListener("input",e=>{if(e.target.id==="tkOrders")tkDraw()});
        el("tkParties").addEventListener("click",e=>{const b=e.target.closest("[data-tka]");if(!b)return;if(b.dataset.tka==="all")TK.parties.forEach(p=>TK.sel.add(p.pk));else TK.sel.clear();tkDraw()});
        el("tkX").onclick=tkShut;el("tkCancel").onclick=tkShut;
        document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!el("tkDlg").hidden&&!document.querySelector(".lwb-ms-pop,.erp-dlg-back"))tkShut()});el("tkGo").onclick=tkSend;
      }
      const ppl=TK.people.filter(p=>!p.is_me);
      const sales=ppl.filter(p=>p.role==="sales"),rest=ppl.filter(p=>p.role!=="sales");
      TK.pick.items([...sales,...rest].map(p=>({v:p.id,t:p.name+" · "+p.role_label})));
      el("tkOff").innerHTML='<option value="">— Leave them out —</option>'+[...sales,...rest].map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name+" · "+p.role_label)+"</option>").join("");
      // ⭐ items: SKUs of the chosen brand; the ones these parties are not buying come first.
      const cnt=new Map();for(const p of TK.parties)for(const k of p.miss)cnt.set(k,(cnt.get(k)||0)+1);
      const names=[...new Set(skus.filter(s=>s.active&&(!BB.get()||s.co===BB.get())).map(s=>s.name))];
      names.sort((a,b)=>(cnt.get(b)||0)-(cnt.get(a)||0)||a.localeCompare(b));
      TK.push.items(names.map(n=>({v:n,t:n+(cnt.get(n)?" ("+cnt.get(n)+" not buying)":"")})));
      TK.sel=new Set(TK.parties.map(p=>p.pk));
      el("tkDue").value=today();el("tkDue").min=today();
      tkDraw();el("tkDlg").hidden=false;document.body.style.overflow="hidden";
    }
    function tkShut(){el("tkDlg").hidden=true;document.body.style.overflow=""}
    async function tkSend(){
      const {plan,skip}=tkPlan();if(!plan.size)return;
      if(skip.length&&!await confirm(skip.length+" Office parties have nobody to follow up and will be left out. Give the task anyway?"))return;
      const b=el("tkGo");b.disabled=true;b.textContent="Giving...";
      const done=[],fail=[];
      for(const [id,list] of plan){
        const p={title:tkTitle(list.length),details:tkDetails(list),due_date:el("tkDue").value||today(),priority:el("tkPri").value,assignees:[id]};
        const r=await client.rpc("lwb_task_add",{p});
        if(r.error)fail.push(tkName(id)+": "+r.error.message);else done.push(tkName(id));
      }
      b.disabled=false;tkDraw();
      if(fail.length){await alert((done.length?"Given to "+done.join(", ")+".\n\n":"")+"Could not give:\n"+fail.join("\n"));if(!done.length)return}
      tkShut();
      const msg="Task given to "+done.join(", ")+". They get a 🔔 and a popup on the Dashboard.";
      window.ERPShell&&ERPShell.toast?ERPShell.toast(msg):alert(msg);
    }
    function setParty(name){MS.party.set([key(name)]);if(tab==="party"||tab==="stop")tab="psku";render()}

    (async()=>{
      const me=await S.start(["admin","manager"]);if(!me)return;
      const t=today();el("to").value=t;el("from").value=S.isoDay(new Date(Date.now()-89*864e5));
      try{const x=localStorage.getItem("lwb_party_buying_tab");if(TABS.some(y=>y[0]===x))tab=x}catch(e){}
      for(const [id,all] of [["cat","All categories"],["sm","All salesmen"],["party","All parties"]])MS[id]=LWBMulti.mount(el(id),{all,onChange:render});
      const qs=new URLSearchParams(location.search);if(TABS.some(y=>y[0]===qs.get("tab")))tab=qs.get("tab");if(qs.get("party"))MS.party.set([key(qs.get("party"))]);
      document.addEventListener("click",e=>{
        const b=e.target.closest("[data-tab]");if(b){tab=b.dataset.tab;try{localStorage.setItem("lwb_party_buying_tab",tab)}catch(x){}render();return}
        const g=e.target.closest("[data-gap]");if(g){gapMode=g.dataset.gap;render();return}
        if(e.target.id==="clearParty"){MS.party.set([]);render();return}
        if(e.target.id==="giveTask"){tkOpen();return}
        const rg=e.target.closest("[data-rate]");if(rg){rateMode=rg.dataset.rate;render();return}
        if(e.target.id==="clearSku"){rateSku="";render();return}
        const sr=e.target.closest("tr[data-sku]");if(sr){rateSku=sr.dataset.sku;rateMode="all";tab="rate";render();window.scrollTo({top:el("tabs").offsetTop-70,behavior:"smooth"});return}
        const r=e.target.closest("tr[data-party]");if(r&&partySet().size!==1)setParty(r.dataset.party);
      });
      document.addEventListener("change",e=>{if(e.target.id==="gapDays"){gapDays=Math.max(1,Math.min(365,Math.round(num(e.target.value))||30));render()}});
      el("q").addEventListener("input",render);el("scope").addEventListener("change",()=>{fillLists();render()});
      el("refresh").onclick=loadAll;el("excel").onclick=exportExcel;
      el("from").addEventListener("change",loadAll);el("to").addEventListener("change",loadAll);el("basis").addEventListener("change",loadAll);
      // Dates = the ONE date filter in the top bar (erp-period.js, Mohit 20 Nov 2026); page From / To hidden.
      if(window.LWBPeriod)LWBPeriod.bind("from","to",{hide:[el("from").parentElement,el("to").parentElement],run:loadAll});
      el("loading").hidden=true;el("page").hidden=false;
      if(window.LWBBrand)try{BB=await LWBBrand.mount(client,{into:"#page .erp-pagehead",after:true,onChange:()=>{fillLists();render()}})}catch(e){}
      await loadAll();
    })();
  </script>
</body>
</html>
