<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documents | Luxury Wrist Brand ERP</title>
  <script src="erp-date.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="erp-shell.css">
  <script src="erp-shell.js"></script>
  <script src="erp-docs.js"></script>
  <style>
    /* Company documents (Mohit, 11 Nov 2026): compact, no side scroll, buttons in one row. */
    .status{text-align:center;padding:80px 20px;font-size:15px;color:#555}
    [hidden]{display:none!important}
    .dv-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
    .dv-bar h1{font-size:20px;margin:0 4px 0 0;font-weight:600}
    .dv-sp{flex:1}
    .dv-seg{display:inline-flex;background:#fff;border:1px solid var(--erp-line);border-radius:8px;overflow:hidden;max-width:100%}
    .dv-seg button{border:0;background:none;padding:7px 11px;font:inherit;font-size:13px;color:var(--erp-muted);font-weight:600;cursor:pointer;white-space:nowrap}
    .dv-seg button.on{background:var(--erp-red-dark,#002f37);color:#fff}
    .dv-in{height:36px;border:1.5px solid var(--erp-line);border-radius:7px;padding:0 10px;font:inherit;font-size:14px;background:#fff;color:var(--erp-ink);box-sizing:border-box;min-width:0}
    .dv-btn{height:36px;border-radius:7px;border:1px solid var(--erp-line);background:#fff;color:var(--erp-red-dark,#002f37);font:inherit;font-size:13.5px;font-weight:600;padding:0 12px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:4px}
    .dv-btn.pri{background:var(--erp-red-dark,#002f37);border-color:var(--erp-red-dark,#002f37);color:#fff}
    .dv-btn.wa{background:#1f9d55;border-color:#1f9d55;color:#fff}
    .dv-btn.sm{height:30px;padding:0 9px;font-size:12.5px}
    .dv-btn.bad{color:#b42318}
    .dv-btn:disabled{opacity:.45;cursor:not-allowed}
    .dv-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:10px}
    .dv-k{background:#fff;border:1px solid var(--erp-line);border-top:3px solid #00434d;border-radius:9px;padding:6px 10px;cursor:pointer;text-align:left;font:inherit;color:inherit;min-width:0}
    .dv-k span{display:block;font-size:11px;font-weight:700;color:var(--erp-muted);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .dv-k b{font-size:19px;display:block}.dv-k small{display:block;font-size:11.5px;color:var(--erp-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .dv-k.r{border-top-color:#c62828}.dv-k.r b{color:#c62828}.dv-k.a{border-top-color:#b26b00}.dv-k.a b{color:#b26b00}.dv-k.y{border-top-color:#c9b26a}.dv-k.g{border-top-color:#13824a}
    .dv-k.on{box-shadow:0 0 0 2px #00434d inset}
    .dv-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px;align-items:start}
    .dv-card{background:#fff;border:1px solid var(--erp-line);border-radius:10px;min-width:0}
    .dv-card h3{margin:0;padding:9px 12px;font-size:14px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--erp-line)}
    .dv-card h3 .r{margin-left:auto;font-weight:500;font-size:12px;color:var(--erp-muted)}
    .dv-card .body{padding:6px 12px 10px}
    table.dv-t{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed}
    .dv-t th{font-size:11px;text-transform:uppercase;color:var(--erp-muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--erp-line);background:#fafaf7;white-space:nowrap}
    .dv-t td{padding:6px 8px;border-bottom:1px solid #f0f1ee;vertical-align:middle;min-width:0}
    .dv-t tr.grp td{background:#e6f0f0;font-weight:700;font-size:11.5px;color:#00434d;letter-spacing:.04em;text-transform:uppercase;padding:5px 8px}
    .dv-t tr[data-id]{cursor:pointer}.dv-t tr[data-id]:hover td{background:#fbfbf8}
    .dv-name{display:flex;gap:8px;align-items:center;min-width:0}
    .dv-name>div{min-width:0}.dv-name b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .dv-name small{display:block;font-size:11.5px;color:var(--erp-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .dv-ic{width:28px;height:28px;border-radius:7px;background:#e6f0f0;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none}
    .dv-acts{display:flex;gap:4px;justify-content:flex-end;flex-wrap:nowrap}
    .dv-chk{width:17px;height:17px;accent-color:#00434d;cursor:pointer;margin:0}
    .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:9px;font-weight:700;white-space:nowrap}
    .pill.g{background:#e7f5ec;color:#13824a}.pill.r{background:#fdecec;color:#c62828}.pill.a{background:#fff4e0;color:#b26b00}.pill.m{background:#eef0ec;color:#55686c}
    .dv-rm{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #f0f1ee;font-size:13px}.dv-rm:last-child{border:0}
    .dv-rm>div{flex:1;min-width:0}.dv-rm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dv-rm small{display:block;color:var(--erp-muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .dv-d{width:40px;text-align:center;border-radius:7px;padding:3px 0;font-weight:800;font-size:15px;line-height:1;flex:none}.dv-d small{display:block;font-size:9px;font-weight:700;color:inherit!important}
    .dv-d.r{background:#fdecec;color:#c62828}.dv-d.a{background:#fff4e0;color:#b26b00}.dv-d.g{background:#e7f5ec;color:#13824a}
    .dv-mon{display:grid;grid-template-columns:64px repeat(12,minmax(0,1fr));gap:2px;font-size:11px}
    .dv-mon div,.dv-mon button{padding:4px 0;text-align:center;border-radius:4px;border:0;font:inherit;font-size:10.5px;min-width:0}
    .dv-mon .h{color:var(--erp-muted);font-weight:700}.dv-mon .n{text-align:left;font-weight:700;padding-left:2px}
    .dv-mon button{cursor:pointer;background:#f3f4f1;color:#8a9496}
    .dv-mon .ok{background:#e7f5ec;color:#13824a;font-weight:700}.dv-mon .due{background:#fff4e0;color:#b26b00;font-weight:700}.dv-mon .late{background:#fdecec;color:#c62828;font-weight:700}
    .dv-note{font-size:12px;color:var(--erp-muted);margin-top:6px}
    .dv-empty{padding:22px 12px;text-align:center;color:var(--erp-muted)}
    .dv-msg{padding:12px 14px;margin-bottom:10px;color:#9b2020;background:#ffebeb;border-radius:8px}
    /* phone cards */
    .dv-cards{display:none}
    .dv-mc{border-bottom:1px solid #f0f1ee;padding:8px 10px}
    .dv-mc .t{display:flex;gap:8px;align-items:center}
    .dv-mc .t .dv-name{flex:1}
    .dv-mc .dv-acts{margin-top:6px}.dv-mc .dv-acts .dv-btn{flex:1}
    .dv-gh{font-size:11.5px;font-weight:700;color:#00434d;letter-spacing:.05em;text-transform:uppercase;padding:7px 10px;background:#e6f0f0}
    /* popups */
    .dv-back{position:fixed;inset:0;z-index:4700;background:rgba(0,30,35,.45);display:flex;align-items:center;justify-content:center;padding:12px}
    .dv-pop{background:#fff;border-radius:12px;width:600px;max-width:100%;max-height:92vh;overflow:auto;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);box-sizing:border-box}
    .dv-pop h2{font-size:16px;margin:0 0 6px;display:flex;align-items:center;gap:8px}.dv-pop h2 .x{margin-left:auto;border:0;background:none;font-size:18px;cursor:pointer;color:var(--erp-muted)}
    .dv-f{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .dv-f .w2{grid-column:span 2}.dv-f .w3{grid-column:span 3}
    .dv-f label,.dv-lbl{display:block;font-size:11px;font-weight:700;color:var(--erp-muted);margin:6px 0 3px;text-transform:uppercase;letter-spacing:.03em}
    .dv-f .dv-in{width:100%}
    .dv-chips{display:flex;gap:5px;flex-wrap:wrap}
    .dv-chip{border:1px solid var(--erp-line);border-radius:14px;padding:4px 10px;font:inherit;font-size:12.5px;background:#fff;cursor:pointer;white-space:nowrap;color:var(--erp-ink)}
    .dv-chip.on{background:var(--erp-red-dark,#002f37);color:#fff;border-color:var(--erp-red-dark,#002f37)}
    .dv-tick{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:6px}
    .dv-row1{display:flex;gap:6px;margin-top:12px}.dv-row1 .dv-btn{flex:1;height:40px}
    .dv-sel{border:1px solid var(--erp-line);border-radius:8px;padding:5px 8px;display:flex;gap:8px;align-items:center;margin-bottom:4px;font-size:13px}
    .dv-sel b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .dv-sel button{border:0;background:none;cursor:pointer;color:var(--erp-muted);font-size:14px}
    .dv-hint{font-size:12px;color:var(--erp-muted);margin-top:6px}
    .dv-files{margin-top:8px}
    @media(max-width:1100px){.dv-grid{grid-template-columns:minmax(0,1fr)}}
    @media(max-width:700px){
      .dv-bar h1{display:none}.dv-bar .dv-in{flex:1}
      .dv-kpis{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.dv-k small{display:none}.dv-k b{font-size:17px}.dv-k.hm{display:none}
      .dv-tabs{order:5;width:100%;overflow:hidden}.dv-tabs button{padding:6px 8px;font-size:12.5px}
      table.dv-t{display:none}.dv-cards{display:block}
      .dv-back{align-items:flex-end;padding:0}.dv-pop{border-radius:14px 14px 0 0;width:100%;max-height:94vh}
      .dv-f{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.dv-f .w2,.dv-f .w3{grid-column:span 2}.dv-f .wm2{grid-column:span 2}
      .dv-mon{grid-template-columns:52px repeat(12,minmax(0,1fr))}.dv-mon div,.dv-mon button{font-size:9.5px}
    }
  </style>
</head>
<body>
  <div id="loading" class="status">Checking account access...</div>
  <main id="page" class="erp-main" hidden>
    <div id="setupMsg" class="dv-msg" hidden></div>
    <div class="dv-bar">
      <h1>📁 Documents</h1>
      <span class="dv-seg dv-tabs" id="tabs"></span>
      <span class="dv-sp"></span>
      <input class="dv-in" id="search" type="search" placeholder="Search document…" style="width:200px">
      <button type="button" class="dv-btn wa" id="shareSel" hidden>⤴ Share</button>
      <button type="button" class="dv-btn pri" id="addBtn">+ Add</button>
    </div>
    <div class="dv-kpis" id="kpis"></div>
    <div class="dv-grid">
      <div class="dv-card" style="overflow:hidden">
        <table class="dv-t"><colgroup><col style="width:34px"><col><col style="width:96px"><col style="width:124px"><col style="width:178px"></colgroup>
          <thead><tr><th></th><th>Document</th><th>Expiry</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead><tbody id="rows"></tbody></table>
        <div class="dv-cards" id="cards"></div>
      </div>
      <div>
        <div class="dv-card" style="margin-bottom:10px"><h3>⏰ Renewal reminders <span class="r">next 60 days</span></h3><div class="body" id="remind"></div></div>
        <div class="dv-card" style="margin-bottom:10px"><h3>📊 GST return tracker <span class="r" id="fyName"></span></h3><div class="body" id="gst"></div></div>
        <div class="dv-card"><h3>🕘 Recent shares <span class="r">last 90 days</span></h3><div class="body" id="shares"></div></div>
      </div>
    </div>
  </main>
  <script>
  'use strict';
  const client=supabase.createClient("https://txkbhadzdbxpieunfvox.supabase.co","sb_publishable_W4I3Q5ODf0g17sq5uDml2Q_sLolXYEk");
  const el=id=>document.getElementById(id);
  const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const showDate=d=>d?(window.LWBDate&&LWBDate.d?LWBDate.d(d):String(d).slice(0,10).split("-").reverse().join("/")):"";
  const toast=(t,k)=>ERPShell.toast(t,k);
  const GROUPS=[["COMPANY","Company KYC","🏢"],["OWNER","Owner / Partner KYC","🪪"],["LICENSE","Licences & Agreements","📜"],["GST","GST Returns","📊"],["BANK","Bank","🏦"],["OTHER","Other","📄"]];
  const GNAME=Object.fromEntries(GROUPS.map(g=>[g[0],g[1]])),GICON=Object.fromEntries(GROUPS.map(g=>[g[0],g[2]]));
  const SUGGEST={COMPANY:["GST Registration Certificate","Company PAN Card","Udyam (MSME) Certificate","Partnership Deed","Incorporation Certificate","Cancelled Cheque","Electricity Bill (address proof)","Rent Agreement"],
    OWNER:["Aadhaar Card","PAN Card","Passport Photo","Driving Licence","Voter ID"],
    LICENSE:["FSSAI License","Shop & Establishment (Gumasta)","Trade License","Tobacco License","Distributor Agreement","Fire NOC","Weights & Measures Certificate","Vehicle Insurance"],
    GST:["GSTR-1","GSTR-3B","GSTR-9 (Annual)"],BANK:["Cancelled Cheque","Bank Statement","Bank Letter"],OTHER:[]};
  const GST_LABEL={GSTR1:"GSTR-1",GSTR3B:"GSTR-3B",GSTR9:"GSTR-9",OTHER:"Other"};
  const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  let me=null,data={docs:[],packs:[],shares:[],today:"",admin:false},tab="ALL",kfilter="",sel=new Set(),missing=false,parties=null;

  async function start(){
    const {data:{session}}=await client.auth.getSession();
    if(!session){location.replace("login.html");return null}
    const {data:p}=await client.from("user_profiles").select("full_name,role,active").eq("id",session.user.id).single();
    const realRole=String((p&&p.role)||"").toLowerCase().trim(),role=p?await ERPShell.pageRoleFresh(realRole):realRole;
    if(!p||p.active!==true||!["admin","accounts"].includes(role)){location.replace("dashboard.html");return null}
    return {role,realRole,uid:session.user.id,name:p.full_name||session.user.email};
  }
  async function load(){
    const r=await client.rpc("lwb_cdoc_list");
    missing=!!r.error;el("setupMsg").hidden=!missing;
    if(missing){el("setupMsg").textContent="Documents are not set up in Supabase yet (lwb_company_docs_setup.sql). ("+(r.error.message||"")+")";return}
    data=r.data||data;
  }

  // ---------- status ----------
  function state(d){
    if(d.grp==="GST"&&(d.gst_type==="GSTR1"||d.gst_type==="GSTR3B")){
      if(d.filed_on)return ["g","Filed "+showDate(d.filed_on).slice(0,5)];
      const due=gstDue(d.gst_type,d.gst_period),left=days(due);
      return left<0?["r","Late "+(-left)+" d"]:["a","Due in "+left+" d"];
    }
    if(d.days_left==null)return ["m","No expiry"];
    const n=d.days_left;
    if(n<0)return ["r","Expired "+(-n)+" d ago"];
    if(n===0)return ["r","Expires today"];
    if(n<=30)return ["r",n+" days left"];
    if(n<=60)return ["a",n+" days left"];
    return ["g",n+" days left"];
  }
  const dt=s=>new Date(String(s).slice(0,10)+"T00:00:00Z");
  const days=s=>Math.round((dt(s)-dt(data.today))/864e5);
  const ymd=d=>d.toISOString().slice(0,10);
  function gstDue(type,period){const p=dt(period);p.setUTCMonth(p.getUTCMonth()+1);p.setUTCDate(type==="GSTR1"?11:20);return ymd(p)}
  const needsRenew=d=>d.days_left!=null&&d.days_left<=60;
  const sub=d=>[d.doc_no,d.holder,d.grp==="GST"&&d.gst_period?MON[dt(d.gst_period).getUTCMonth()]+" "+dt(d.gst_period).getUTCFullYear():"",
    d.files?"":"no file yet",d.shares?"shared "+d.shares+"×":"",d.admin_only?"🔒 Only Admin":""].filter(Boolean).join(" · ");

  // ---------- render ----------
  function visible(){
    const q=el("search").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    return data.docs.filter(d=>(tab==="ALL"||d.grp===tab)&&
      (!kfilter||(kfilter==="exp"&&d.days_left!=null&&d.days_left<0)||(kfilter==="soon"&&d.days_left!=null&&d.days_left>=0&&d.days_left<=30)||
       (kfilter==="gst"&&d.grp==="GST"&&!d.filed_on&&(d.gst_type==="GSTR1"||d.gst_type==="GSTR3B"))||(kfilter==="nofile"&&!d.files))&&
      q.every(w=>(d.name+" "+(d.doc_no||"")+" "+(d.holder||"")+" "+GNAME[d.grp]).toLowerCase().includes(w)));
  }
  function renderTabs(){
    const n=g=>data.docs.filter(d=>d.grp===g).length;
    el("tabs").innerHTML=[["ALL","All"],...GROUPS.filter(g=>g[0]!=="OTHER"&&g[0]!=="BANK"||n(g[0])).map(g=>[g[0],g[1].replace(" / Partner","").replace(" & Agreements","")])]
      .map(([k,t])=>'<button type="button" data-tab="'+k+'" class="'+(tab===k?"on":"")+'">'+esc(t)+"</button>").join("");
  }
  function renderKpis(){
    const d=data.docs,exp=d.filter(x=>x.days_left!=null&&x.days_left<0),soon=d.filter(x=>x.days_left!=null&&x.days_left>=0&&x.days_left<=30);
    const gst=gstMissing(),month=data.shares.filter(s=>String(s.created_at).slice(0,7)===String(data.today).slice(0,7));
    const parties=new Set(month.map(s=>s.party_name||s.mobile||"?")).size,nof=d.filter(x=>!x.files).length;
    const K=[["","","Total documents",d.length,nof?nof+" without file":GROUPS.length+" groups"],["exp","r","Expired",exp.length,exp[0]?exp[0].name:"none"],
      ["soon","a","Expiring 30 days",soon.length,soon[0]?soon[0].name+" · "+showDate(soon[0].expiry_date).slice(0,5):"none"],
      ["gst","y hm","GST due",gst.length,gst[0]?gst[0].label+" by "+showDate(gst[0].due).slice(0,5):"all filed"],
      ["share","g hm","Shared this month",month.length,parties?"to "+parties+" part"+(parties>1?"ies":"y"):"—"]];
    el("kpis").innerHTML=K.map(k=>'<button type="button" class="dv-k '+k[1]+(kfilter&&kfilter===k[0]?" on":"")+'" data-k="'+k[0]+'"><span>'+esc(k[2])+"</span><b>"+esc(k[3])+"</b><small>"+esc(k[4])+"</small></button>").join("");
  }
  function actions(d,phone){
    const can=!!d.files&&d.shareable;
    return (needsRenew(d)?'<button type="button" class="dv-btn sm pri" data-renew="'+d.id+'">↻ Renew</button>':"")+
      '<button type="button" class="dv-btn sm" data-view="'+d.id+'" title="View / add files">'+(phone?"👁 View":"👁")+"</button>"+
      (can?'<button type="button" class="dv-btn sm wa" data-share="'+d.id+'">⤴ '+(phone?"WhatsApp":"Share")+"</button>":
        '<button type="button" class="dv-btn sm" data-view="'+d.id+'" title="'+(d.shareable?"Add the file first":"Not for sharing")+'">'+(d.shareable?"⬆ File":"🔒")+"</button>");
  }
  function renderList(){
    const list=visible();let t="",c="";
    for(const [g] of GROUPS){
      const rows=list.filter(d=>d.grp===g).sort((a,b)=>g==="GST"?String(b.gst_period||"").localeCompare(String(a.gst_period||""))||String(a.gst_type).localeCompare(String(b.gst_type)):(a.days_left==null)-(b.days_left==null)||(a.days_left||0)-(b.days_left||0)||a.name.localeCompare(b.name));
      if(!rows.length)continue;
      // All tab: only the latest GST months; the GST Returns tab shows every month.
      const more=g==="GST"&&tab==="ALL"&&!kfilter&&!el("search").value.trim()&&rows.length>4?rows.length-4:0;if(more)rows.length=4;
      t+='<tr class="grp"><td colspan="5">'+esc(GNAME[g])+" · "+rows.length+"</td></tr>";
      c+='<div class="dv-gh">'+esc(GNAME[g])+" · "+rows.length+"</div>";
      for(const d of rows){const [k,s]=state(d);
        const name='<div class="dv-name"><span class="dv-ic">'+GICON[d.grp]+'</span><div><b>'+esc(d.name)+"</b><small>"+esc(sub(d)||"—")+"</small></div></div>";
        t+='<tr data-id="'+d.id+'"><td><input type="checkbox" class="dv-chk" data-sel="'+d.id+'"'+(sel.has(d.id)?" checked":"")+(d.files&&d.shareable?"":" disabled")+' aria-label="Select '+esc(d.name)+'"></td><td>'+name+"</td><td>"+(d.expiry_date?showDate(d.expiry_date):d.filed_on?showDate(d.filed_on):"—")+'</td><td><span class="pill '+k+'">'+esc(s)+'</span></td><td><div class="dv-acts">'+actions(d,false)+"</div></td></tr>";
        c+='<div class="dv-mc" data-id="'+d.id+'"><div class="t">'+name+'<span class="pill '+k+'">'+esc(s)+'</span></div><div class="dv-acts">'+actions(d,true)+"</div></div>";
      }
      if(more){const m='<button type="button" class="dv-btn sm" data-tab="GST">Show all '+(more+4)+' GST returns</button>';t+='<tr><td></td><td colspan="4">'+m+"</td></tr>";c+='<div class="dv-mc">'+m+"</div>"}
    }
    const empty='<div class="dv-empty">'+(missing?"Not set up yet.":data.docs.length?"Nothing matches.":"No documents yet. Tap + Add to save your GST certificate, PAN, licences …")+"</div>";
    el("rows").innerHTML=t||'<tr><td colspan="5">'+empty+"</td></tr>";el("cards").innerHTML=c||empty;
    el("shareSel").hidden=!sel.size;el("shareSel").textContent="⤴ Share "+sel.size+" selected";

  // Watermark: the text repeated across the whole page, light red, at an angle.
  async function markImage(blob,text){
    const url=URL.createObjectURL(blob);
    try{
      const img=await new Promise((ok,bad)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>bad(Error("A photo could not be read"));i.src=url});
      const s=Math.min(1,2200/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
      const fs=Math.max(16,Math.round(Math.min(c.width,c.height)/22));g.font="bold "+fs+"px Arial, sans-serif";g.fillStyle="rgba(198,40,40,0.28)";
      g.translate(c.width/2,c.height/2);g.rotate(-Math.PI/7);const w=g.measureText(text).width+fs*2,R=Math.hypot(c.width,c.height);
      for(let y=-R;y<R;y+=fs*3.2)for(let x=-R+((y/(fs*3.2))%2?w/2:0);x<R;x+=w)g.fillText(text,x,y);
      return await new Promise((ok,bad)=>c.toBlob(b=>b?ok(b):bad(Error("Photo could not be made")),"image/jpeg",0.85));
    }finally{URL.revokeObjectURL(url)}
  }
  async function markPdf(blob,text){
    text=String(text).replace(/[^\x20-\x7E\u00B7]/g,"").trim()||"SHARED COPY"; // PDF standard font: English letters only
    const L=await loadPdfLib(),doc=await L.PDFDocument.load(await blob.arrayBuffer(),{ignoreEncryption:true}),font=await doc.embedFont(L.StandardFonts.HelveticaBold);
    for(const pg of doc.getPages()){const {width,height}=pg.getSize(),fs=Math.max(12,Math.min(width,height)/24),w=font.widthOfTextAtSize(text,fs)+fs*2;
      for(let y=-height;y<height*2;y+=fs*4)for(let x=-width;x<width*2;x+=w)pg.drawText(text,{x,y,size:fs,font,color:L.rgb(0.78,0.16,0.16),opacity:0.22,rotate:L.degrees(25)})}
    return new Blob([await doc.save()],{type:"application/pdf"});
  }

        const s=await client.storage.from(BUCKET).download(f.path);if(s.error)throw Error("Could not read "+d.name+": "+s.error.message);

    const paint=()=>{
      $("#sSel").innerHTML=docsOf().map(d=>'<div class="dv-sel"><span class="dv-ic">'+GICON[d.grp]+"</span><b>"+esc(d.name)+'</b><span class="dv-note" style="margin:0">'+d.files+" file"+(d.files>1?"s":"")+'</span><button type="button" data-un="'+d.id+'" aria-label="Remove">✕</button></div>').join("")||'<div class="dv-hint">Choose a pack or close and tick documents.</div>';
      $("#sPacks").innerHTML=data.packs.map(k=>{const ok=k.doc_ids.length&&k.doc_ids.every(i=>pick.has(Number(i)));return '<button type="button" class="dv-chip'+(ok?" on":"")+'" data-pack="'+k.id+'">'+esc(k.name)+(k.doc_ids.length?" ("+k.doc_ids.length+")":" (empty)")+"</button>"}).join("")+
        '<button type="button" class="dv-chip" data-savepack="1">+ Save as pack</button>';
      if(!wmEdited)$("#sWmT").value=wmText();
      $("#sWmT").disabled=!$("#sWm").checked;made=null;
    };
    paint();
    loadParties().then(list=>{$("#sPartyL").innerHTML=list.map(x=>'<option value="'+esc(x.customer_name)+'">').join("")});
    $("#sParty").addEventListener("input",()=>{const n=$("#sParty").value.trim().toUpperCase(),hit=(parties||[]).find(x=>String(x.customer_name).toUpperCase()===n);
      if(hit&&hit.mobile&&!$("#sMob").value)$("#sMob").value=String(hit.mobile).replace(/\D/g,"").slice(-10);paint()});
    $("#sMob").oninput=()=>{made=null};
    $("#sWm").onchange=paint;$("#sWmT").oninput=()=>{wmEdited=true;made=null};
    p.el.addEventListener("click",async e=>{
      const b=e.target.closest("button");if(!b)return;
      if(b.dataset.un){pick.delete(Number(b.dataset.un));paint();return}
      if(b.dataset.d){days=+b.dataset.d;$("#sDays").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));made=null;return}
      if(b.dataset.pack){const k=data.packs.find(x=>String(x.id)===b.dataset.pack);
        if(!k.doc_ids.length){if(!pick.size){toast("Pack is empty. Tick documents, then tap + Save as pack.","error");return}
          if(!await confirm("Put the "+pick.size+" selected document(s) in “"+k.name+"”?"))return;
          const r=await client.rpc("lwb_cdoc_pack_save",{p_id:k.id,p_name:k.name,p_doc_ids:[...pick]});if(r.error){toast(r.error.message,"error");return}
          k.doc_ids=[...pick];paint();return}
        const ok=k.doc_ids.map(Number).filter(i=>{const d=data.docs.find(x=>x.id===i);return d&&d.files&&d.shareable});
        pick.clear();ok.forEach(i=>pick.add(i));if(ok.length<k.doc_ids.length)toast("Some documents of the pack have no file or are not for sharing.","info");paint();return}
      if(b.dataset.savepack){if(!pick.size){toast("Choose documents first.","error");return}
        const name=await prompt("Pack name (e.g. KYC Pack, Tender Pack):");if(!name)return;
        const r=await client.rpc("lwb_cdoc_pack_save",{p_id:null,p_name:name,p_doc_ids:[...pick]});if(r.error){toast(r.error.message,"error");return}
        data.packs.push({id:r.data,name:name.toUpperCase(),doc_ids:[...pick]});paint();return}
      if(b.dataset.go)go(b.dataset.go,b);
    });
    async function make(channel){
      const docs=docsOf();if(!docs.length)throw Error("Choose at least one document.");
      const mob=$("#sMob").value.replace(/\D/g,"").slice(-10);if(mob&&!/^[6-9]\d{9}$/.test(mob))throw Error("Mobile number must be 10 digits.");
      const wm=$("#sWm").checked?$("#sWmT").value.trim().slice(0,80):"";
      const key=JSON.stringify([[...pick],mob,wm,days,$("#sParty").value.trim()]);
      if(made&&madeKey===key)return made;
      const msg=$("#sMsg");msg.textContent="Preparing files…";
      const files=await buildFiles(docs,wm,(i,n)=>{msg.textContent="Preparing file "+i+" of "+n+(wm?" (adding watermark)…":"…")});
      const r=await client.rpc("lwb_cdoc_share_create",{p:{doc_ids:docs.map(d=>d.id),files:files.map(f=>({path:f.path,name:f.name})),party_name:$("#sParty").value.trim(),
        party_code:((parties||[]).find(x=>String(x.customer_name).toUpperCase()===$("#sParty").value.trim().toUpperCase())||{}).customer_code||null,mobile:mob||null,watermark:wm||null,days,channel}});
      if(r.error)throw Error(r.error.message);
      made={...r.data,files,mob,docs,link:location.origin+"/share.html?t="+r.data.token};madeKey=key;
      msg.textContent="Link ready · valid till "+showDate(r.data.expires_at)+".";
      return made;
    }
    const text=m=>"Dear "+($("#sParty").value.trim()||"Sir")+",\nPlease find our documents: "+m.docs.map(d=>d.name).join(", ")+".\n"+m.link+"\n(Link valid till "+showDate(m.expires_at)+")\n- Luxury Wrist Brand";
    async function go(ch,btn){
      const w=ch==="WHATSAPP"&&!/Android|iPhone|iPad/i.test(navigator.userAgent)?window.open("about:blank","_blank"):null;
      p.el.querySelectorAll("[data-go]").forEach(x=>x.disabled=true);
      try{
        const m=await make(ch);
        if(ch==="WHATSAPP"){const url="https://wa.me/"+(m.mob?"91"+m.mob:"")+"?text="+encodeURIComponent(text(m));if(w)w.location.href=url;else location.href=url}
        else if(ch==="LINK"){try{await navigator.clipboard.writeText(text(m));toast("Link copied. Paste it in WhatsApp / SMS.","success")}catch(e){await prompt("Copy this link:",m.link)}}
        else if(ch==="EMAIL"){location.href="mailto:?subject="+encodeURIComponent("Documents - Luxury Wrist Brand")+"&body="+encodeURIComponent(text(m))}
        else if(ch==="FILES"){
          const files=[];for(const f of m.files){let blob=f.blob;if(!blob){const s=await client.storage.from(BUCKET).download(f.path);if(s.error)throw Error(s.error.message);blob=s.data}
            files.push(new File([blob],cleanName(f.name)+(f.mime==="application/pdf"?".pdf":".jpg"),{type:f.mime}))}
          await navigator.share({files,text:text(m)});
        }
        await load();renderList();renderKpis();renderShares();
      }catch(e){if(w)w.close();if(e&&e.name!=="AbortError")toast(e.message||String(e),"error");$("#sMsg").textContent="Not sent. "+(e&&e.message||"")}
      finally{p.el.querySelectorAll("[data-go]").forEach(x=>x.disabled=false)}
    }
  }

  // ---------- events ----------
  document.addEventListener("click",async e=>{
    if(e.target.closest(".dv-back"))return;
    const b=e.target.closest("button,input,[data-id]");if(!b)return;
    const doc=id=>data.docs.find(d=>String(d.id)===String(id));
    if(b.dataset.tab){tab=b.dataset.tab;render();return}
    if(b.dataset.k!==undefined){kfilter=kfilter===b.dataset.k||b.dataset.k==="share"?"":b.dataset.k;if(b.dataset.k==="share")el("shares").scrollIntoView({behavior:"smooth"});tab="ALL";render();return}
    if(b.dataset.sel){const id=Number(b.dataset.sel);b.checked?sel.add(id):sel.delete(id);renderList();return}
    if(b.dataset.renew){editDoc(doc(b.dataset.renew),{renew:true});return}
    if(b.dataset.view){const d=doc(b.dataset.view);ERPDocs.open({client,entity:"COMPANY",id:d.id,title:d.name,slots:["FILE"],canEdit:true}).then(async()=>{await load();render()});return}
    if(b.dataset.share){openShare([Number(b.dataset.share)]);return}
    if(b.dataset.stop){if(!await confirm("Stop this link now?\n\nThe party will not be able to open the documents any more."))return;
      const r=await client.rpc("lwb_cdoc_share_revoke",{p_id:Number(b.dataset.stop)});if(r.error){toast(r.error.message,"error");return}toast("Link stopped.","success");await load();renderShares();return}
    if(b.dataset.gst){const [code,m]=b.dataset.gst.split("|"),d=data.docs.find(x=>x.gst_type===code&&String(x.gst_period).slice(0,10)===m);
      editDoc(d||null,d?{}:{grp:"GST",gst_type:code,gst_period:m});return}
    if(b.dataset.filed){const [code,m]=b.dataset.filed.split("|"),d=data.docs.find(x=>x.gst_type===code&&String(x.gst_period).slice(0,10)===m);
      editDoc(d||null,{grp:"GST",gst_type:code,gst_period:m});setTimeout(()=>{const f=document.getElementById("fFiled");if(f&&!f.value){f.value=data.today;f.focus()}},60);return}
    if(b.id==="remindNow"){b.disabled=true;const r=await client.rpc("lwb_cdoc_remind_now");b.disabled=false;
      toast(r.error?r.error.message:r.data?"Sent "+r.data+" reminder(s) to the bell.":"Nothing new to remind today (each reminder goes once).",r.error?"error":"success");return}
    if(b.dataset.id&&!e.target.closest("button,input")){editDoc(doc(b.dataset.id));return}
  });
  el("search").oninput=renderList;
  el("addBtn").onclick=()=>editDoc(null);
  el("shareSel").onclick=()=>openShare([...sel]);
  (async()=>{
    me=await start();if(!me)return;
    ERPShell.mount({role:me.realRole||me.role,name:me.name,onLogout:async()=>{await client.auth.signOut();location.replace("login.html")},group:"Accounts"});
    await load();
    el("loading").hidden=true;el("page").hidden=false;
    render();
    const h=location.hash.replace("#","");if(h==="add")editDoc(null);
  })();
  </script>
</body>
</html>
