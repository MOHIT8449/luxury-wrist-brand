<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Luxury Wrist Brand ERP</title>
  <script src="erp-date.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="erp-shell.css">
  <script src="erp-shell.js"></script>
  <script src="party-pay.js"></script>
  <script src="brand-filter.js"></script>
  <script src="role-dashboard.js"></script>
  <link rel="stylesheet" href="role-dashboard.css">
  <style>
    .status{text-align:center;padding:80px 20px;font-size:15px;color:#555}
    .welcome{color:var(--erp-muted);font-size:13px;margin:-6px 0 14px}
    .welcome b{color:var(--erp-ink)}
    .dash-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
    .dash-grid>*{min-width:0}
    .quick a{display:flex;align-items:center;gap:12px;padding:10px 14px;text-decoration:none;border-bottom:1px solid #f0f2f4;color:var(--erp-ink)}
    .quick a:last-child{border-bottom:0}
    .quick a:hover{background:var(--erp-red-soft);color:var(--erp-red)}
    .quick .ic{width:34px;height:34px;border-radius:8px;background:#f3f4f6;display:grid;place-items:center;color:var(--erp-red);flex:none}
    .quick .ic svg{width:18px;height:18px}
    .quick small{display:block;color:var(--erp-muted);font-size:11px}
    .side-col{display:grid;gap:16px;min-width:0}
    .verify .cnt{margin-left:auto;background:var(--erp-red);color:#fff;border-radius:12px;padding:2px 9px;font-size:12.5px;font-weight:700;flex:none}
    .verify .ic{background:var(--erp-red-soft)}
    .verify .none{padding:12px 14px;color:var(--erp-muted);font-size:13px}
    .orders td:first-child{font-weight:600;color:var(--erp-blue);white-space:nowrap}
    .hero{margin:calc(-1 * 18px) -22px 0;padding:26px 22px 70px;background:linear-gradient(180deg,#fdeef1 0%,#f8f1f3 100%);text-align:center;border-bottom:1px solid #f1dfe3}
    .hero h2{margin:0 0 14px;font-size:21px;font-weight:600;color:var(--erp-ink)}
    .hero-search{position:relative;max-width:640px;margin:0 auto;text-align:left}
    .hero-search input{width:100%;height:46px;border:1px solid #e6d5da;border-radius:8px;padding:0 14px 0 42px;font:15px inherit;font-family:inherit;background:#fff;outline:none;box-shadow:0 2px 6px rgba(16,24,40,.05)}
    .hero-search input:focus{border-color:var(--erp-red)}
    .hero-search>svg{position:absolute;left:14px;top:14px;width:18px;height:18px;color:var(--erp-red)}
    .hero-results{position:absolute;top:50px;left:0;right:0;background:#fff;border:1px solid var(--erp-line);border-radius:8px;box-shadow:0 12px 30px rgba(16,24,40,.14);max-height:360px;overflow:auto;z-index:20;display:none}
    .hero-results.open{display:block}
    .hero-results a{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;text-decoration:none;border-bottom:1px solid #f0f2f4;color:var(--erp-ink)}
    .hero-results a small{color:var(--erp-muted);font-size:11.5px;white-space:nowrap}
    .hero-results a:hover,.hero-results a.active{background:var(--erp-red-soft)}
    .acc-dash{display:flex;align-items:center;gap:12px;margin:0 0 16px;padding:14px 16px;border-radius:10px;background:#13283f;color:#fff;text-decoration:none}
    .acc-dash[hidden]{display:none}
    .acc-dash .acc-ic{width:40px;height:40px;border-radius:50%;background:#13824a;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex:0 0 auto}
    .acc-dash b{display:block;font-size:16px}.acc-dash small{display:block;color:#c8d6e6;font-size:13px;margin-top:2px}
    .acc-dash .acc-go{margin-left:auto;font-weight:700;white-space:nowrap}
    .kpis{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:-50px 0 20px;position:relative;z-index:2}
    .kpi-group{display:flex;background:#fff;border:1px solid var(--erp-line);border-radius:10px;box-shadow:0 4px 14px rgba(16,24,40,.06);padding:12px 6px}
    .kpi{display:block;min-width:118px;padding:2px 12px;text-decoration:none;color:var(--erp-ink)}
    .kpi+.kpi{border-left:1px solid #eef0f2}
    .kpis:empty{display:none}.hero:has(+.kpis:empty){padding-bottom:26px;margin-bottom:18px}
    .kpi small{display:block;color:var(--erp-muted);font-size:12px}
    .kpi b{display:block;font-size:22px;font-weight:600;margin:4px 0 8px}
    .kpi span{display:block;border-top:1px solid #eef0f2;padding-top:7px;font-size:11.5px;color:#4b5763}
    .kpi:hover b{color:var(--erp-red)}
    .kpi .due{color:var(--erp-red);font-weight:600}
    .focus{margin:0 0 16px;display:grid;gap:8px}
    .focus:empty{display:none}
    .focus-item{display:flex;align-items:flex-start;gap:10px;background:#fff8e1;border:1px solid #f3d27a;border-left:4px solid #e0a100;border-radius:8px;padding:10px 12px}
    .focus-item .ic{font-size:20px;line-height:1.2;flex:none}
    .focus-item .tx{flex:1;min-width:0}
    .focus-item b{display:block;font-size:15px;font-weight:600;color:#3d2c00;overflow-wrap:anywhere}
    .focus-item small{display:block;color:#7a6326;font-size:12px;margin-top:2px}
    .focus-item .x{border:0;background:transparent!important;color:#8a6d1f!important;font-size:13px;cursor:pointer;padding:2px 4px;flex:none}
    .focus-post{display:flex;justify-content:flex-end}
    .focus-post button,.focus-form button{height:34px;padding:0 12px;border-radius:6px;border:1px solid var(--erp-line);background:#fff;color:var(--erp-ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
    .focus-form{display:grid;grid-template-columns:minmax(0,1fr) 180px 140px auto auto;gap:8px;background:#fff;border:1px solid var(--erp-line);border-radius:8px;padding:10px}
    .focus-form input,.focus-form select{height:34px;border:1.5px solid var(--erp-line);border-radius:6px;padding:0 9px;font:inherit;font-size:13.5px;min-width:0;background:#fff}
    .focus-form .send{background:var(--erp-red);border-color:var(--erp-red);color:#fff;font-weight:600}
    @media(max-width:760px){.focus-form{grid-template-columns:1fr 1fr}.focus-form .msg{grid-column:1/-1}}
    [hidden]{display:none!important}
    @media(max-width:1100px){.dash-grid{grid-template-columns:1fr}.side-col{display:contents}#verifyCard{order:-1}}
    @media(max-width:980px){.hero{margin:-14px -12px 0;padding:18px 12px 60px}.hero h2{font-size:18px}
      .kpis{gap:10px;margin-top:-44px}.kpi-group{width:100%;padding:10px 0}.kpi{min-width:0;flex:1;padding:2px 10px}.kpi b{font-size:19px}}

    /* Each metric owns a cell: never squeeze several text columns into one group. */
    body.erp-compact[data-erp-page=dashboard] #kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:0 0 14px}
    body.erp-compact[data-erp-page=dashboard] #kpis:empty{display:none}
    body.erp-compact[data-erp-page=dashboard] #kpis .kpi-group{display:contents}
    body.erp-compact[data-erp-page=dashboard] #kpis .kpi{--tone:#475569;--tint:#f1f5f9;display:flex;flex-direction:column;min-width:0;width:100%;margin:0;padding:12px;background:linear-gradient(135deg,var(--tint),#fff 75%);border:1px solid #dce3eb;border-top:3px solid var(--tone);border-radius:10px;box-shadow:0 1px 2px #172b4d08}
    body.erp-compact[data-erp-page=dashboard] #kpis .kpi[data-tone=green]{--tone:#147d4c;--tint:#eaf7f0}
    body.erp-compact[data-erp-page=dashboard] #kpis .kpi[data-tone=amber]{--tone:#956000;--tint:#fff6df}
    body.erp-compact[data-erp-page=dashboard] #kpis .kpi[data-tone=blue]{--tone:#2362a4;--tint:#edf5ff}
    body.erp-compact[data-erp-page=dashboard] #kpis .kpi[data-tone=red]{--tone:#b3263f;--tint:#fff0f2}
    body.erp-compact[data-erp-page=dashboard] #kpis .kpi small{font-size:12px;line-height:1.35;color:#526174;overflow-wrap:anywhere}
    body.erp-compact[data-erp-page=dashboard] #kpis .kpi b{margin:6px 0 8px;font-size:23px;line-height:1.2;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums;color:var(--tone);overflow-wrap:anywhere;min-width:0}
    body.erp-compact[data-erp-page=dashboard] #kpis .kpi>span{margin-top:auto;padding-top:7px;border-top:1px solid #dce3eb;font-size:11px;line-height:1.4;color:#637184;overflow-wrap:anywhere}
    body.erp-compact[data-erp-page=dashboard] .hero-search input{height:44px;padding:0 12px 0 40px;font-size:16px;box-shadow:none}
    body.erp-compact[data-erp-page=dashboard] .hero-search>svg{left:13px;top:13px;pointer-events:none}
    body.erp-compact[data-erp-page=dashboard] .hero h2{font-size:17px;margin-bottom:8px}
    body.erp-compact[data-erp-page=dashboard] .erp-pagehead{gap:8px;align-items:center;margin-bottom:8px}
    body.erp-compact[data-erp-page=dashboard] .erp-pagehead .time{font-size:12px;color:#6b7785}
    body.erp-compact[data-erp-page=dashboard] .erp-pagehead h1{font-size:18px}
    body.erp-compact[data-erp-page=dashboard] .welcome{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px;font-size:12px}
    .dash-role{padding:3px 8px;border-radius:5px;background:#f7f1de;color:#7a6420;font-size:11px;font-weight:700}
    body.erp-compact[data-erp-page=dashboard] .focus-item{padding:10px;gap:8px;background:#fff9e9;border-color:#ecdba8;border-left-width:3px}
    body.erp-compact[data-erp-page=dashboard] .focus-item b{font-size:14px}
    body.erp-compact[data-erp-page=dashboard] .focus-item small{font-size:11px}
    body.erp-compact[data-erp-page=dashboard] .focus-item .x{font-size:11px;min-height:32px}
    body.erp-compact[data-erp-page=dashboard] .focus-post{margin-bottom:10px}
    body.erp-compact[data-erp-page=dashboard] .erp-pill{font-size:12px;gap:6px;padding:8px 10px;min-width:0}
    @media(max-width:760px){
      body.erp-compact[data-erp-page=dashboard] #kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
      body.erp-compact[data-erp-page=dashboard] #kpis .kpi{min-width:0;padding:10px;min-height:108px}
      body.erp-compact[data-erp-page=dashboard] #kpis .kpi b{font-size:21px}
      body.erp-compact[data-erp-page=dashboard] #kpis .kpi-wide{grid-column:1/-1}
      body.erp-compact[data-erp-page=dashboard] .erp-pagehead #todayText{margin-left:auto;font-size:10px}
      body.erp-compact[data-erp-page=dashboard] .focus-item{flex-wrap:wrap}
      body.erp-compact[data-erp-page=dashboard] .focus-item .tx{flex:1 1 180px}
      body.erp-compact[data-erp-page=dashboard] .focus-item .x{margin-left:auto}
    }
  </style>
</head>
<body>
  <div id="loading" class="status">Checking account access...</div>

  <main id="dashboard" class="erp-main" style="display:none">
    <div class="hero">
      <h2>Search Anything</h2>
      <div class="hero-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="heroSearch" type="search" placeholder="Search Party, PO No. or Module" autocomplete="off" aria-label="Search Anything">
        <div class="hero-results" id="heroResults"></div>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
    <a class="acc-dash" id="accDash" href="accounts-dashboard.html" hidden><span class="acc-ic">₹</span><span><b>Accounts Dashboard</b><small>Today's cash in / cash out, bank deposit, cash handover, bank check</small></span><span class="acc-go">Open →</span></a>
    <div class="focus" id="focus"></div>
    <div class="focus-post" id="focusPost" hidden><button type="button" id="focusOpen">+ Post focus message</button></div>
    <form class="focus-form" id="focusForm" hidden autocomplete="off">
      <input class="msg" id="focusMsg" maxlength="300" placeholder="e.g. 300ml Thums Up stock arrived today, push it" aria-label="Message" required>
      <input id="focusSku" list="focusSkus" placeholder="SKU (optional)" aria-label="SKU">
      <select id="focusTill" aria-label="Show till"><option value="0">Today only</option><option value="2" selected>3 days</option><option value="6">1 week</option><option value="">Until removed</option></select>
      <button type="button" id="focusCancel">Close</button>
      <button type="submit" class="send" id="focusSend">Post to all</button>
      <datalist id="focusSkus"></datalist>
    </form>
    <div id="roleDash" hidden></div>

    <div class="erp-pagehead">
      <h1>Order Status</h1><span class="time" id="clock"></span>
      <button class="erp-iconbtn ghost" type="button" id="refreshBtn" title="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
      <span class="grow"></span>
      <span class="erp-badge" id="todayText"></span>
    </div>
    <p class="welcome" id="welcomeText"></p>

    <div class="erp-pills" id="pills"></div>

    <div class="dash-grid">
      <section class="erp-card" id="ordersCard" hidden>
        <div class="erp-card-head"><h2>Recent Sales Orders</h2><a class="erp-btn ghost" href="warehouse-orders.html" id="allOrdersLink">View all</a></div>
        <div class="erp-scroll"><table class="erp-table orders">
          <thead><tr><th>PO No.</th><th class="hide-sm">Date</th><th>Party</th><th>Status</th><th class="num hide-sm">Qty (CS)</th><th class="num">Amount ₹</th></tr></thead>
          <tbody id="orderRows"><tr><td colspan="6">Loading...</td></tr></tbody>
        </table></div>
      </section>
      <div class="side-col">
        <section class="erp-card quick verify" id="verifyCard" hidden>
          <div class="erp-card-head"><h2>Pending Work</h2></div>
          <div id="verifyList"></div>
        </section>
      </div>
    </div>

  </main>

  <script>

    const SUPABASE_URL =
      "https://txkbhadzdbxpieunfvox.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_W4I3Q5ODf0g17sq5uDml2Q_sLolXYEk";

    const client = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    let currentRole="";
    const fmtINR=n=>Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:0});
    function startClock(){
      const tick=()=>{const d=new Date();document.getElementById("clock").textContent=d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:false});
        document.getElementById("todayText").textContent=d.toLocaleDateString("en-IN",{weekday:"short"})+", "+LWBDate.d(d)};
      tick();setInterval(tick,30000);
    }
    // What this login has to verify / do now (lwb_order_flow_popups_setup.sql). Admin sees every queue.
    const VERIFY_ICON={ORDER_APPROVAL:"check",LOADING:"box",RETURN_APPROVE:"undo",RETURN_RECEIVE:"inbox",TALLY_BILL:"bill",
      DRIVER_PAYMENT:"cash",OFFICE_PAYMENT:"cash",CREDIT_NOTE:"note",SALES_RETURN:"undo",COMPLAINT:"chat",PARTY_CALL:"phone"};
    async function loadVerify(){
      const card=document.getElementById("verifyCard"),list=document.getElementById("verifyList");
      const queue=["admin","manager","accounts","warehouse"].includes(currentRole);
      const [q,cmp,calls]=await Promise.all([queue?client.rpc("lwb_my_verify_queue"):Promise.resolve(null),complaintsDue(),partyCallsDue()]);
      if((!q||q.error)&&!cmp&&!calls){card.hidden=true;return}
      const LABEL={DRIVER_PAYMENT:"Money on the way — receive from driver"};
      const hidden=ERPShell.hiddenPages(),due=(calls?[calls]:[]).concat((q&&!q.error&&q.data)||[]).concat(cmp?[cmp]:[]).filter(r=>Number(r.cnt)>0&&!hidden.includes(r.page));
      if(!queue&&!due.length){card.hidden=true;return}
      list.replaceChildren();
      due.forEach(r=>{
        const a=document.createElement("a");a.href=r.page;
        const ic=document.createElement("span");ic.className="ic";ic.innerHTML=ERPShell.icon(VERIFY_ICON[r.item]||"check");
        const t=document.createElement("span");t.textContent=LABEL[r.item]||r.label;
        if(Number(r.amount)>0){const s=document.createElement("small");s.textContent="₹"+fmtINR(r.amount);t.appendChild(s)}
        const c=document.createElement("span");c.className="cnt";c.textContent=r.cnt;
        a.append(ic,t,c);list.appendChild(a);
      });
      if(!due.length){const n=document.createElement("div");n.className="none";n.textContent="✓ Nothing waiting for you to verify.";list.appendChild(n)}
      card.hidden=false;
    }
    // Complaint Box (lwb_complaint_box_setup.sql): Admin / Sales Head = complaints waiting for a reply;
    // everyone else = his complaints the office has answered.
    async function complaintsDue(){
      const office=["admin","manager"].includes(currentRole);
      let r=client.from("lwb_complaints").select("id",{count:"exact",head:true});
      const {data:{session}}=await client.auth.getSession(),uid=session&&session.user.id;
      r=office?r.eq("status","OPEN").neq("created_by",uid):r.eq("status","ANSWERED");
      const {count,error}=await r;
      if(error||!count)return null;
      return {item:"COMPLAINT",label:office?"Reply to complaints":"Reply on your complaint",cnt:count,amount:0,page:"complaint-box.html"};
    }
    // Party Call List (lwb_party_call_list_setup.sql): parties with no order in their set days.
    // Salesman = his parties; Admin / Sales Head = every party.
    async function partyCallsDue(){
      if(!["admin","manager","sales"].includes(currentRole))return null;
      const {data,error}=await client.rpc("lwb_party_call_due_count");
      if(error||!data)return null;
      return {item:"PARTY_CALL",label:"Call parties: no order in time",cnt:data,amount:0,page:"party-calls.html"};
    }
    const STATUS={
      pending_approval:["Pending Approval","amber","warehouse-orders.html"],approved:["Approved","blue","warehouse-orders.html"],
      transport_allocated:["Driver Assigned","blue","loading-dispatch.html"],loading:["Loading","amber","loading-dispatch.html"],
      loaded:["Loaded","green","loading-dispatch.html"],invoiced:["Billed","green","party-ledger.html"],cancelled:["Cancelled","red","warehouse-orders.html"]
    };
    const ORDER_ROLES=["admin","manager","sales","warehouse","transport","accounts"];
    function pill(label,count,href){
      const a=document.createElement("a");a.className="erp-pill";a.href=href;
      a.append(document.createTextNode(label));
      const n=document.createElement("span");n.className="n";n.textContent=count==null?"—":count;a.appendChild(n);
      return a;
    }
    let searchOrders=[];
    function dayKey(v){const d=new Date(v);return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()}
    function kpi(label,value,foot,href){
      const a=document.createElement(href?"a":"div");a.className="kpi";
      const money=String(value).startsWith("₹");
      a.dataset.tone=money?"green":/Pending/i.test(label)?"amber":/Returns/i.test(label)?"red":/Dispatch|Delivered/i.test(label)?"blue":"slate";
      if(money&&String(value).length>12)a.classList.add("kpi-wide");
      if(href)a.href=href;
      const l=document.createElement("small");l.textContent=label;
      const b=document.createElement("b");b.textContent=value;
      const f=document.createElement("span");
      if(foot&&typeof foot==="object"){f.append(document.createTextNode(foot.text+" "));const d=document.createElement("span");d.className="due";d.style.cssText="display:inline;border:0;padding:0";d.textContent=foot.due;f.appendChild(d)}
      else f.textContent=foot||"";
      a.append(l,b,f);return a;
    }
    function kpiGroup(items){const g=document.createElement("div");g.className="kpi-group";g.append(...items);return g}
    function heroSearch(){
      const input=document.getElementById("heroSearch"),box=document.getElementById("heroResults");
      let hits=[],pos=0;
      const modules=()=>ERPShell.menuForMe(currentRole).flatMap(g=>g.items.map(i=>({t:i.t,s:g.group||"Module",h:i.h})));
      function show(){
        const q=input.value.toLowerCase().trim();box.replaceChildren();hits=[];pos=0;
        if(!q){box.classList.remove("open");return}
        const words=q.split(/\s+/);
        const match=t=>words.every(w=>t.toLowerCase().includes(w));
        hits=modules().filter(m=>match(m.t+" "+m.s)).slice(0,5);
        const seen=new Set();
        searchOrders.forEach(o=>{
          const party=String(o.customer_name||"").trim();
          if(party&&match(party)&&!seen.has(party.toUpperCase())&&seen.size<5&&["admin","manager","sales","accounts"].includes(currentRole)){
            seen.add(party.toUpperCase());hits.push({t:party,s:"Party Ledger",h:"party-ledger.html?party="+encodeURIComponent(party)})}
        });
        searchOrders.filter(o=>match(String(o.order_no||"")+" "+String(o.customer_name||""))).slice(0,6)
          .forEach(o=>hits.push({t:(o.order_no||"—")+" · "+(o.customer_name||""),s:(STATUS[String(o.status||"").toLowerCase()]||[o.status||""])[0],h:(STATUS[String(o.status||"").toLowerCase()]||[,,"warehouse-orders.html"])[2]}));
        hits.forEach((h,n)=>{const a=document.createElement("a");a.href=h.h;if(!n)a.className="active";
          const t=document.createElement("span");t.textContent=h.t;const s=document.createElement("small");s.textContent=h.s;a.append(t,s);box.appendChild(a)});
        if(!hits.length){const a=document.createElement("a");a.textContent="No result found";box.appendChild(a)}
        box.classList.add("open");
      }
      input.addEventListener("input",show);
      input.addEventListener("keydown",e=>{
        if(e.key==="Enter"&&hits[pos])location.href=hits[pos].h;
        if(e.key==="Escape"){input.value="";show()}
        if((e.key==="ArrowDown"||e.key==="ArrowUp")&&hits.length){e.preventDefault();pos=(pos+(e.key==="ArrowDown"?1:hits.length-1))%hits.length;
          [...box.children].forEach((a,n)=>a.classList.toggle("active",n===pos))}
      });
      document.addEventListener("click",e=>{if(!e.target.closest(".hero-search"))box.classList.remove("open")});
    }
    async function loadSummary(){
      const role=currentRole,pills=document.getElementById("pills");
      const jobs=[];
      // Salesman: totals only, from his own orders below (no party-wise order list).
      if(ORDER_ROLES.includes(role)&&role!=="sales")jobs.push(client.from("orders")
        .select("id,order_no,order_date,created_at,customer_name,status,total_qty,total_amount")
        .order("created_at",{ascending:false}).limit(1000));
      else jobs.push(Promise.resolve(null));
      jobs.push(["admin","manager","sales","accounts"].includes(role)?client.from("lwb_payment_collections").select("id").eq("status","PENDING").limit(1000):Promise.resolve(null));
      jobs.push(["admin","accounts","manager","warehouse"].includes(role)?client.rpc("lwb_office_list_driver_returns",{p_status:"PENDING_OFFICE"}):Promise.resolve(null));
      jobs.push(["admin","manager","sales","accounts"].includes(role)?client.rpc("lwb_party_bills"):Promise.resolve(null));
      jobs.push(role==="sales"?client.rpc("lwb_my_orders",{p_days:45}):Promise.resolve(null));
      const [orders,pays,returns,bills,mine]=await Promise.all(jobs.map(j=>Promise.resolve(j).catch(()=>null)));
      pills.replaceChildren();
      const kpis=document.getElementById("kpis");kpis.replaceChildren();
      if(orders&&!orders.error){
        const rows=orders.data||[];searchOrders=rows;
        const now=new Date(),today=dayKey(now),yest=dayKey(new Date(now.getFullYear(),now.getMonth(),now.getDate()-1));
        const on=k=>rows.filter(o=>o.status!=="cancelled"&&dayKey(o.order_date||o.created_at)===k);
        const t=on(today),y=on(yest),sum=a=>a.reduce((n,o)=>n+Number(o.total_amount||0),0),qty=a=>a.reduce((n,o)=>n+Number(o.total_qty||0),0);
        const link=["admin","manager"].includes(role)?"warehouse-orders.html":"";
        kpis.appendChild(kpiGroup([
          kpi("Today's Orders",t.length,"Yesterday: "+y.length,link),
          kpi("Today's Cases",qty(t).toLocaleString("en-IN"),"Yesterday: "+qty(y).toLocaleString("en-IN"),link),
          kpi("Today's Sales","₹"+fmtINR(sum(t)),"Yesterday's total: ₹"+fmtINR(sum(y)),link)]));
        const st=k=>rows.filter(o=>String(o.status||"").toLowerCase()===k).length;
        kpis.appendChild(kpiGroup([
          kpi("Pending Approval",st("pending_approval"),"Approved: "+st("approved"),link),
          kpi("To Dispatch",st("transport_allocated")+st("loading"),"Loaded, to bill: "+st("loaded"),["admin","manager","warehouse"].includes(role)?"loading-dispatch.html":"")]));
      }
      const office=[];
      if(returns&&!returns.error){const r=Array.isArray(returns.data)?returns.data:[];
        office.push(kpi("Driver Returns",r.length,"Value: ₹"+fmtINR(r.reduce((n,x)=>n+Number(x.total_return_amount||0),0)),"driver-returns.html"))}
      if(office.length)kpis.appendChild(kpiGroup(office));
      // Salesman: own orders not yet delivered / delivered this week (My Sales > My Orders).
      if(mine&&!mine.error&&Array.isArray(mine.data)){
        const r=mine.data,off=o=>["cancelled","canceled","rejected"].includes(String(o.status||"").toLowerCase()),done=o=>o.delivery_status==="DELIVERED"||o.delivery_status==="PARTIAL";
        const pend=r.filter(o=>!off(o)&&!done(o)),week=Date.now()-7*864e5;
        const live=r.filter(o=>!off(o)),monthKey=v=>{const d=new Date(v);return d.getFullYear()+"-"+d.getMonth()};
        const t=live.filter(o=>dayKey(o.order_date)===dayKey(new Date())),m=live.filter(o=>monthKey(o.order_date)===monthKey(new Date()));
        const sum=a=>a.reduce((n,o)=>n+Number(o.total_amount||0),0),n=a=>a.length+(a.length===1?" order":" orders");
        kpis.appendChild(kpiGroup([
          kpi("Today's Sales","₹"+fmtINR(sum(t)),n(t)+" today","my-sales.html#orders"),
          kpi("This Month's Sales","₹"+fmtINR(sum(m)),n(m)+" in "+new Date().toLocaleDateString("en-IN",{month:"long"}),"my-sales.html#orders")]));
        kpis.appendChild(kpiGroup([
          kpi("My Orders Not Delivered",pend.length,"Waiting for approval: "+pend.filter(o=>["","pending","submitted","pending_manager","pending_approval","pending_review","new"].includes(String(o.status||"").toLowerCase().trim())).length,"my-sales.html#orders"),
          kpi("Delivered (7 days)",r.filter(o=>done(o)&&Date.parse(o.delivered_at)>=week).length,"Cancelled: "+r.filter(off).length,"my-sales.html#orders")]));
      }
      if(orders&&!orders.error){
        const rows=orders.data||[],count={};
        rows.forEach(o=>{const k=String(o.status||"").toLowerCase();count[k]=(count[k]||0)+1});
        ["pending_approval","approved","transport_allocated","loading","loaded"].forEach(k=>pills.appendChild(pill(STATUS[k][0],count[k]||0,STATUS[k][2])));
        const body=document.getElementById("orderRows");body.replaceChildren();
        if(!rows.length){const td=body.insertRow().insertCell();td.colSpan=6;td.className="erp-empty";td.textContent="No records to display"}
        rows.slice(0,10).forEach(o=>{
          const r=body.insertRow(),st=STATUS[String(o.status||"").toLowerCase()]||[o.status||"—",""];
          r.insertCell().textContent=o.order_no||"—";
          const d=r.insertCell();d.className="hide-sm";d.textContent=LWBDate.d(o.order_date||o.created_at);
          r.insertCell().textContent=o.customer_name||"—";
          const b=document.createElement("span");b.className="erp-badge "+st[1];b.textContent=st[0];r.insertCell().appendChild(b);
          const q=r.insertCell();q.className="num hide-sm";q.textContent=Number(o.total_qty||0).toLocaleString("en-IN");
          const m=r.insertCell();m.className="num";m.textContent=fmtINR(o.total_amount);
        });
        document.getElementById("ordersCard").hidden=false;
        document.getElementById("allOrdersLink").hidden=!["admin","manager"].includes(role);
      }
      if(role==="driver")pills.appendChild(pill("My Deliveries","→","driver-delivery.html"));
    }
    // Focus messages from Admin / Sales Head, shown to every role (lwb_announcements_setup).
    const isHead=()=>["admin","manager"].includes(currentRole);
    const istDay=d=>new Date(d.getTime()+19800000).toISOString().slice(0,10);
    const shortDay=v=>LWBDate.d(v);
    async function loadFocus(){
      const box=document.getElementById("focus");
      const r=await client.from("lwb_announcements").select("id,message,sku_name,valid_until,created_at,active").order("created_at",{ascending:false}).limit(20);
      box.replaceChildren();
      if(r.error)return;
      const today=istDay(new Date());
      (r.data||[]).filter(a=>a.active&&(!a.valid_until||a.valid_until>=today)).forEach(a=>{
        const d=document.createElement("div");d.className="focus-item";
        const ic=document.createElement("span");ic.className="ic";ic.innerHTML=ERPShell.icon("megaphone");
        const tx=document.createElement("div");tx.className="tx";
        const b=document.createElement("b");b.textContent=a.message;
        const m=document.createElement("small");
        m.textContent=[a.sku_name,"Posted "+shortDay(a.created_at),a.valid_until?(a.valid_until===today?"Today only":"Till "+shortDay(a.valid_until)):""].filter(Boolean).join(" · ");
        tx.append(b,m);d.append(ic,tx);
        if(isHead()){const x=document.createElement("button");x.type="button";x.className="x";x.textContent="✕ Remove";x.dataset.remove=a.id;d.append(x)}
        box.appendChild(d);
      });
    }
    function focusSetup(){
      if(!isHead())return;
      const form=document.getElementById("focusForm"),post=document.getElementById("focusPost");
      post.hidden=false;
      document.getElementById("focusOpen").onclick=async()=>{
        post.hidden=true;form.hidden=false;document.getElementById("focusMsg").focus();
        const list=document.getElementById("focusSkus");
        if(!list.children.length){const sk=await client.from("sku_master").select("sku_name").eq("is_active",true).order("sku_name");
          (sk.data||[]).forEach(x=>{const o=document.createElement("option");o.value=x.sku_name;list.appendChild(o)})}
      };
      document.getElementById("focusCancel").onclick=()=>{form.hidden=true;post.hidden=false};
      form.onsubmit=async e=>{
        e.preventDefault();
        const till=document.getElementById("focusTill").value,btn=document.getElementById("focusSend");
        btn.disabled=true;
        const {error}=await client.rpc("lwb_post_announcement",{p_message:document.getElementById("focusMsg").value.trim(),p_sku:document.getElementById("focusSku").value.trim(),
          p_until:till===""?null:istDay(new Date(Date.now()+Number(till)*864e5))});
        btn.disabled=false;
        if(error){await alert("Could not post: "+(/lwb_post_announcement/.test(error.message)?"run lwb_announcements_market_report_setup.sql in Supabase first.":error.message));return}
        form.reset();form.hidden=true;post.hidden=false;
        ERPShell.toast("Posted. Everyone sees it on the Dashboard and gets a 🔔.");
        loadFocus();
      };
      document.getElementById("focus").addEventListener("click",async e=>{
        const x=e.target.closest("[data-remove]");if(!x)return;
        if(!await confirm("Remove this message from everyone's Dashboard?",{danger:true,ok:"Remove"}))return;
        const {error}=await client.rpc("lwb_remove_announcement",{p_id:Number(x.dataset.remove)});
        if(error){await alert(error.message);return}
        loadFocus();
      });
    }
    document.getElementById("refreshBtn").onclick=()=>{loadSummary();loadFocus();loadVerify();if(window.LWBRoleDash)LWBRoleDash.refresh()};
    // Role-wise home (role-dashboard.js): Admin, Sales Head, Accounts, Godown Manager, Salesman.
    // Driver / Transport keep the order-status Dashboard below. Admin can look at another role's view.
    const ROLE_NOTE={admin:"Whole business at one place: sales, money, stock, team.",manager:"PO approval, team target, delivery follow-up.",
      accounts:"Cash, bank, bills to make, outstanding to collect.",warehouse:"Loading, vehicles, stock, returns, damage.",sales:"Today's plan, my target, my orders, my parties."};
    function roleDashboard(role,name,uid,plan){
      if(!window.LWBRoleDash||!LWBRoleDash.has(role))return false;
      const main=document.getElementById("dashboard"),head=main.querySelector(".erp-pagehead"),welcome=document.getElementById("welcomeText");
      main.classList.add("rd-on");
      main.prepend(head,welcome,main.querySelector(".hero"));
      ["kpis","accDash","pills"].forEach(id=>document.getElementById(id).hidden=true);
      document.querySelector(".dash-grid").hidden=true;
      const h=(new Date().getUTCHours()*60+new Date().getUTCMinutes()+330)%1440;
      head.querySelector("h1").textContent=(h<720?"Good morning":h<1020?"Good afternoon":"Good evening")+", "+(String(name||"").trim().split(/\s+/)[0]||"there");
      const note=document.createElement("span");note.className="rd-sub";note.textContent=ROLE_NOTE[role];welcome.appendChild(note);
      const box=document.getElementById("roleDash");box.hidden=false;
      if(role==="admin"){
        const sel=document.createElement("select");sel.className="rd-view";sel.setAttribute("aria-label","See dashboard of");
        [["admin","Admin view"],["manager","Sales Head view"],["accounts","Accounts view"],["warehouse","Godown Manager view"],["sales","Salesman view"]].forEach(([v,t])=>sel.add(new Option(t,v)));
        sel.onchange=()=>LWBRoleDash.start({client,role:sel.value,uid,plan:null,box});
        head.querySelector(".grow").after(sel);
      }
      LWBRoleDash.start({client,role,uid,plan,box});
      return true;
    }


    async function initializeDashboard() {

      try {

        const {
          data: { session },
          error: sessionError
        } = await client.auth.getSession();

        if (sessionError || !session) {
          window.location.replace("login.html");
          return;
        }

        const user = session.user;

        const {
          data: profile,
          error: profileError
        } = await client
          .from("user_profiles")
          .select("full_name, role, active")
          .eq("id", user.id)
          .single();

        if (profileError || !profile) {

          await client.auth.signOut();

          await alert("User profile not found.");

          window.location.replace("login.html");

          return;
        }

        if (profile.active !== true) {

          await client.auth.signOut();

          await alert("Your account is inactive. Please contact administrator.");

          window.location.replace("login.html");

          return;
        }

        const role = String(profile.role || "").toLowerCase();

        if (!["admin", "manager", "accounts", "sales", "warehouse", "transport", "driver"].includes(role)) {

          await client.auth.signOut();

          await alert("You do not have permission to access this dashboard.");

          window.location.replace("login.html");

          return;
        }

        // Salesman: creates today's plan bell (once a day) before the bell loads.
        let plan=null;
        if(role==="sales")plan=await Promise.race([client.rpc("lwb_my_sales_plan").then(r=>r.error?null:r.data),new Promise(r=>setTimeout(r,2500))]).catch(()=>null);

        ERPShell.mount({role,name:profile.full_name||user.email,onLogout:logout});
        startClock();

        const labels={admin:"Admin",manager:"Sales Head",sales:"Salesman",warehouse:"Godown Manager",transport:"Transport",accounts:"Accounts",driver:"Driver"};
        const welcome=document.getElementById("welcomeText");welcome.replaceChildren();
        const hello=document.createElement("b");hello.textContent=profile.full_name||"User";
        const badge=document.createElement("span");badge.className="dash-role";badge.textContent=labels[role]||role;
        welcome.append(hello,badge);
        currentRole=role;
        document.getElementById("accDash").hidden=!["admin","accounts"].includes(role);
        // Dashboard shortcuts live in the searchable menu; no duplicate Quick Access list.
        heroSearch();
        roleDashboard(role,profile.full_name,user.id,plan);
        loadSummary();
        loadVerify();setInterval(()=>{if(!document.hidden)loadVerify()},60000);
        loadFocus();focusSetup();

        document.getElementById("loading").style.display =
          "none";

        document.getElementById("dashboard").style.display =
          "block";

      } catch (error) {

        console.error(error);

        await client.auth.signOut();

        window.location.replace("login.html");

      }

    }

    async function logout() {

      await client.auth.signOut();

      window.location.replace("login.html");

    }

    initializeDashboard();

  </script>

</body>
</html>
