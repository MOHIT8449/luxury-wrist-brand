<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salesman Master | Luxury Wrist Brand ERP</title>
  <script src="erp-date.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="erp-shell.css">
  <link rel="stylesheet" href="sales.css">
  <script src="erp-shell.js"></script>
  <script src="sales-common.js"></script>
  <script src="excel-io.js"></script>
  <script src="master-popup.js"></script>
  <style>
.sm-bar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--erp-line);flex-wrap:nowrap}
.sm-bar h2{margin:0;font-size:16px;white-space:nowrap}.sm-bar input,.sm-bar select{min-width:0;padding:7px 9px;border:1px solid var(--erp-line);border-radius:8px;font:inherit}
.sm-bar input{flex:1;max-width:260px}.sm-bar .grow{flex:1}
.sm-tag{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11.5px;font-weight:700;margin:1px 3px 1px 0;white-space:nowrap}
.sm-tag.cc{background:#fde8e8;color:#b3121b}.sm-tag.rj{background:#fff4dc;color:#8a5a00}.sm-tag.all{background:#e6f4ea;color:#17663a}.sm-tag.off{background:#eef1f5;color:#5b6876}.sm-tag.warn{background:#fff1e0;color:#a14d00}
#smPanel{padding:14px 16px;max-width:620px}#smPanel h2{margin:0 0 10px;font-size:17px}
.sm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}.sm-grid label{display:block;font-size:12px;font-weight:600;color:var(--erp-muted);margin-bottom:3px}
.sm-grid input,.sm-grid select{width:100%;box-sizing:border-box;padding:8px 9px;border:1px solid var(--erp-line);border-radius:8px;font:inherit}.sm-full{grid-column:span 2}
.sm-seg{display:flex;gap:6px}.sm-seg label{flex:1;margin:0;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--erp-line);border-radius:8px;padding:8px 6px;font-size:13.5px;color:inherit;font-weight:600;cursor:pointer;background:#fff}
.sm-seg input{width:auto;margin:0}.sm-seg label:has(input:checked){border-color:#193d65;background:#eaf0f8;color:#193d65}
.sm-hint{font-size:11.5px;color:var(--erp-muted);margin-top:3px}
#card .sm-cards{display:none}
.sm-c{padding:9px 12px;border-bottom:1px solid var(--erp-line);display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:center}
.sm-c.off{opacity:.6}.sm-c b{font-size:14.5px}.sm-c small{color:var(--erp-muted);font-size:12.5px;grid-column:1}.sm-c .sm-tags{grid-column:1}.sm-c button{grid-row:1/4;grid-column:2}
.sm-act{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:nowrap}.sm-act button{white-space:nowrap}
@media(max-width:700px){.sm-bar{flex-wrap:wrap}.sm-bar h2{flex-basis:100%}.sm-bar input{max-width:none;flex:1 1 100%}.sm-bar .grow{display:none}.sm-bar select,.sm-bar .mp-new{flex:1}#card .sm-cards{display:block}#card .sm-tablebox{display:none}.sm-seg label{font-size:13px;padding:8px 4px;gap:4px;white-space:nowrap}#smPanel{max-width:none}.sm-act{position:sticky;bottom:0;background:#fff;padding:8px 0}.sm-act button{flex:1}}
  </style>
</head>
<body>
  <div id="loading" class="status">Checking account access...</div>
  <main id="page" class="erp-main" hidden>
    <div class="erp-pagehead"><h1>Salesman Master</h1><span class="grow"></span><a class="sl-btn ghost" href="sales-tracking.html" style="display:inline-flex;align-items:center;text-decoration:none">Sales Tracking →</a></div>
    <div class="erp-pills" id="tabs"></div>
    <section class="erp-card" id="card"></section>
    <p class="sl-note" id="note"></p>
    <section class="erp-card" id="smPanel">
      <h2 id="smTitle">New Salesman</h2>
      <div class="sm-grid">
        <div><label for="smName">Name *</label><input id="smName" maxlength="80" autocomplete="off"></div>
        <div><label for="smMob">Mobile * <small>(login ID)</small></label><input id="smMob" inputmode="numeric" maxlength="10" autocomplete="off"></div>
        <div class="sm-full"><label>Brands he can sell *</label><div class="sm-seg" id="smBrands"></div><div class="sm-hint">Tick one brand, or both. He sees only the SKUs, rates and orders of the ticked brands.</div></div>
        <div><label>Post</label><div class="sm-seg"><label><input type="radio" name="smPost" value="sales" checked>Salesman</label><label><input type="radio" name="smPost" value="manager">Sales Head</label></div></div>
        <div><label>Type</label><div class="sm-seg"><label><input type="radio" name="smKind" value="FIELD" checked>Field</label><label><input type="radio" name="smKind" value="OFFICE">Office</label></div></div>
        <div><label for="smArea">Area / Route</label><input id="smArea" maxlength="120" placeholder="e.g. Surat city, Bardoli"></div>
        <div id="smPassBox"><label for="smPass">Login password</label><input id="smPass" maxlength="40" autocomplete="off"></div>
        <div><label for="smJoin">Joining date</label><input id="smJoin" type="date"></div>
        <div><label for="smSal">Monthly salary ₹</label><input id="smSal" inputmode="numeric" maxlength="8" placeholder="0"></div>
        <div id="smActBox" hidden><label>Status</label><div class="sm-seg"><label><input type="radio" name="smAct" value="1" checked>Active</label><label><input type="radio" name="smAct" value="0">Inactive</label></div></div>
      </div>
      <div class="sm-act"><button type="button" class="sl-btn ghost" id="smCancel">Cancel</button><button type="button" class="sl-btn" id="smSave">Save Salesman</button></div>
    </section>
  </main>
  <script>
    const S=LWBSales,{client,el,esc,fmt,short,num,key}=S;
    let me=null,tab="team",team=[],parties=[],skus=[],rules=[],targets=[],notes=[],settings={due_after_days:3},setupError="";
    let pf={q:"",sm:"",city:""},picked=new Set(),tMonth=S.isoDay(new Date()).slice(0,7);
    // Every active SALES login and Sales Head (MANAGER), set up or not (the database adds him on the first save).
    const isHead=t=>t.role==="manager";
    const isSales=t=>["sales","salesman","manager"].includes(t.role)&&t.active!==false;
    const salesmen=()=>team.filter(isSales);
    const assignable=salesmen;
    let empNoLogin=[],empAll=[];
    // Brand per salesman (Mohit, 2 Nov 2026): Coca-Cola salesman sells only Coca-Cola, Rajnigandha only Rajnigandha;
    // "All brands" (e.g. the godown Sales Head) gets both. Same data as Companies > Team brands (lwb_user_companies).
    let brands=[],brandOf=new Map();
    const nameOf=id=>(team.find(t=>t.user_id===id)||{}).full_name||"—";
    const TABS=[["team","Salesmen"],["parties","Party Assignment"],["skus","SKU Visibility"],["targets","Monthly Targets"],["plan","Morning Plan"]];

    async function loadAll(){
      setupError="";
      const r=await client.rpc("lwb_sales_team");
      if(r.error){setupError=/lwb_sales_team/.test(r.error.message)?"Run lwb_sales_team_setup.sql in Supabase first.":r.error.message;render();return}
      team=r.data||[];
      const [bc,bt]=await Promise.all([client.from("lwb_companies").select("id,name,active,sort_no").order("sort_no").order("name"),client.rpc("lwb_brand_team")]);
      brands=bc.error?[]:(bc.data||[]).filter(c=>c.active!==false);
      brandOf=new Map(bt.error?[]:(bt.data||[]).map(u=>[u.user_id,u.company_ids||[]]));
      // Employee Master "Salesman" posts that have no ERP login yet (best effort; needs Employee Master access).
      client.rpc("lwb_emp_logins").then(x=>{
        const list=Array.isArray(x.data)?x.data:[];empAll=list;
        empNoLogin=list.filter(e=>e.is_active!==false&&!e.user_id&&/sales|manager|head/i.test(e.designation||""));
        if(tab==="team")render();
      },()=>{});
      const [pa,sk,ru,ta,no,st]=await Promise.all([
        client.rpc("lwb_party_activity"),
        client.from("sku_master").select("sku_name,category,is_active").order("sku_name"),
        client.from("lwb_sku_salesman_rules").select("sku_key,salesman_id,rule"),
        client.from("lwb_sales_targets").select("month,salesman_id,target_amount,target_cases"),
        client.from("lwb_sales_plan_notes").select("id,plan_date,salesman_id,note,created_at").eq("plan_date",S.isoDay(new Date())).order("created_at"),
        client.from("lwb_sales_settings").select("*").eq("id",1).maybeSingle()
      ]);
      parties=pa.data||[];skus=(sk.data||[]).filter(x=>x.is_active!==false);rules=ru.data||[];targets=ta.data||[];notes=no.data||[];
      if(st.data)settings=st.data;
      const err=[pa,sk,ru,ta,no].find(x=>x.error);if(err)setupError=err.error.message;
      render();
    }

    function render(){
      el("tabs").innerHTML=TABS.map(([id,l])=>'<button type="button" class="erp-pill'+(id===tab?" active":"")+'" data-tab="'+id+'">'+esc(l)+"</button>").join("");
      const card=el("card");
      if(setupError){card.innerHTML='<div class="sl-msg">'+esc(setupError)+"</div>";el("note").textContent="";return}
      ({team:renderTeam,parties:renderParties,skus:renderSkus,targets:renderTargets,plan:renderPlan})[tab](card);
      stackTables(card);
    }
    // Phone: tables turn into compact cards; each cell gets its column name as label.
    function stackTables(root){
      root.querySelectorAll("table.erp-table").forEach(t=>{
        t.classList.add("sl-stack");
        const h=[...t.querySelectorAll("thead th")].map(th=>th.textContent.trim());
        t.querySelectorAll("tbody tr,tfoot tr").forEach(tr=>[...tr.children].forEach((td,i)=>{
          if(h[i])td.dataset.label=h[i];
          if((i===0&&h[i])||["Party","Salesmen","Due parties"].includes(h[i]))td.classList.add("sl-wide");
          if((i===0&&h[i])||h[i]==="Party")td.classList.add("sl-first");
          if(!h[i]&&td.querySelector("button"))td.classList.add("sl-act");
          if(!h[i]&&td.querySelector("input[type=checkbox]"))td.classList.add("sl-pick");
        }));
      });
    }

    // ---- Salesman Master (Mohit, 4 Nov 2026): one place to make a salesman. The popup saves the employee
    // (Employee Master), makes his ERP login (Admin), his Field / Office type + area, and the brands he may sell.
    let smF={q:"",brand:""},smEdit=null,smPop=null;
    const brandCls=n=>/coca/i.test(n)?"cc":/rajni/i.test(n)?"rj":"off";
    const brandName=id=>(brands.find(c=>c.id===id)||{}).name||"?";
    function brandTags(ids){
      if(!brands.length)return "—";
      if(!ids||!ids.length||brands.every(c=>ids.includes(c.id)))return '<span class="sm-tag all">All brands</span>';
      return ids.map(i=>'<span class="sm-tag '+brandCls(brandName(i))+'">'+esc(brandName(i))+"</span>").join("");
    }
    function smRows(){
      const staffOf=new Map(empAll.filter(e=>e.user_id).map(e=>[e.user_id,e]));
      const a=team.map(t=>({id:t.user_id,user_id:t.user_id,staff:staffOf.get(t.user_id)||null,name:t.full_name,mobile:t.mobile,role:t.role,active:t.active!==false,kind:t.kind,area:t.area,parties:t.parties,brandIds:brandOf.get(t.user_id)||[],login:true}));
      const b=empNoLogin.map(e=>({id:"e"+e.id,user_id:null,staff:e,name:e.name,mobile:e.mobile,role:/manager|head/i.test(e.designation||"")?"manager":"sales",active:e.is_active!==false,kind:"",area:"",parties:0,brandIds:[],login:false}));
      const q=key(smF.q);
      return a.concat(b).filter(r=>(!q||key(r.name+" "+(r.mobile||"")+" "+(r.area||"")).includes(q))&&
        (!smF.brand||!r.brandIds.length||r.brandIds.includes(smF.brand)));
    }
    function renderTeam(card){
      const list=smRows();
      const rows=list.map(r=>({attr:' data-sm="'+r.id+'"'+(r.active?"":' class="off"'),cells:[
        "<b>"+esc(r.name||"—")+"</b>"+(r.role==="manager"?' <span class="erp-badge">Sales Head</span>':"")+(r.active?"":' <span class="erp-badge">Inactive</span>'),
        esc(r.mobile||"—"),brandTags(r.brandIds),
        r.role==="manager"?"Sales Head":r.kind==="OFFICE"?"Office":r.kind==="FIELD"?"Field":'<span class="sm-tag warn">Not set</span>',
        esc(r.area||"—"),fmt(r.parties||0),
        r.login?'<span class="sm-tag all">✓ Login</span>':'<span class="sm-tag warn">No login</span>',
        '<button type="button" class="sl-btn small" data-sm-edit="'+r.id+'">Edit</button>']}));
      card.innerHTML='<div class="sm-bar"><h2>Salesmen <small style="color:var(--erp-muted);font-weight:400">'+team.filter(isHead).length+" Sales Heads · "+team.filter(t=>!isHead(t)).length+" salesmen</small></h2>"+
        '<input id="sq" type="search" placeholder="Search name / mobile / area" value="'+esc(smF.q)+'" autocomplete="off">'+
        '<select id="sbr" aria-label="Brand"><option value="">All brands</option>'+brands.map(c=>'<option value="'+c.id+'"'+(smF.brand===c.id?" selected":"")+">"+esc(c.name)+"</option>").join("")+"</select>"+
        '<span class="grow"></span><button type="button" class="mp-new" data-sm-new>+ New Salesman</button></div>'+
        (rows.length?'<div class="sl-scroll sm-tablebox">'+S.table(["Salesman","Mobile","Brands","Type","Area / Route","Parties","Login",""],rows,[5])+"</div>"+
        '<div class="sm-cards">'+list.map(r=>'<div class="sm-c'+(r.active?"":" off")+'"><b>'+esc(r.name||"—")+(r.role==="manager"?' <span class="erp-badge">Sales Head</span>':"")+(r.active?"":' <span class="erp-badge">Inactive</span>')+"</b>"+
          '<button type="button" class="sl-btn small" data-sm-edit="'+r.id+'">Edit</button>'+
          "<small>"+esc(r.mobile||"—")+" · "+(r.role==="manager"?"Sales Head":r.kind==="OFFICE"?"Office":r.kind==="FIELD"?"Field":"Type not set")+" · "+esc(r.area||"no area")+" · "+fmt(r.parties||0)+" parties</small>"+
          '<div class="sm-tags">'+brandTags(r.brandIds)+(r.login?"":'<span class="sm-tag warn">No login</span>')+"</div></div>").join("")+"</div>":'<div class="erp-empty">No salesman yet. Press + New Salesman.</div>');
      el("note").textContent="Salesman Master is the one place to add a salesman: name, mobile (login), brands he can sell, Field / Office and area. Employee Master, Manage Users and Company / Brand show the same people. Field salesman sees only his own parties; Office salesman takes orders for every party. A salesman with one brand sees only that brand's SKUs, rates and orders.";
    }
    function smOpen(r){
      smEdit=r||null;const isNew=!r;
      el("smTitle").textContent=isNew?"New Salesman":"Edit · "+(r.name||"");
      el("smName").value=r?r.name||"":"";el("smMob").value=r?r.mobile||"":"";el("smArea").value=r?r.area||"":"";
      el("smJoin").value=r&&r.staff&&r.staff.joining_date||"";el("smSal").value=r&&r.staff&&r.staff.monthly_salary||"";
      const ids=r?r.brandIds:[];
      el("smBrands").innerHTML=brands.map(c=>'<label><input type="checkbox" value="'+c.id+'"'+(!r||!ids.length||ids.includes(c.id)?(r?" checked":""):"")+">"+esc(c.name)+"</label>").join("")||'<span class="sm-hint">No brand in Company / Brand yet.</span>';
      document.querySelector('input[name="smPost"][value="'+(r&&r.role==="manager"?"manager":"sales")+'"]').checked=true;
      document.querySelector('input[name="smKind"][value="'+(r&&r.kind==="OFFICE"?"OFFICE":"FIELD")+'"]').checked=true;
      document.querySelector('input[name="smAct"][value="'+(r&&!r.active?"0":"1")+'"]').checked=true;
      el("smActBox").hidden=isNew;
      const needLogin=!r||!r.login;el("smPassBox").hidden=!needLogin||me.realRole!=="admin";el("smPass").value=needLogin?makePass():"";
      el("smSave").textContent=isNew?"Save Salesman":"Save changes";
      smPop.open();
    }
    function makePass(){const a="abcdefghjkmnpqrstuvwxyz",d="23456789",pick=x=>x[crypto.getRandomValues(new Uint32Array(1))[0]%x.length];
      let p="";for(let i=0;i<4;i++)p+=pick(a);for(let i=0;i<4;i++)p+=pick(d);return p.charAt(0).toUpperCase()+p.slice(1)}
    async function smSave(){
      const r=smEdit,name=el("smName").value.trim().replace(/\s+/g," "),mob=el("smMob").value.replace(/\D/g,"").slice(-10);
      const post=document.querySelector('input[name="smPost"]:checked').value,kind=post==="manager"?"OFFICE":document.querySelector('input[name="smKind"]:checked').value;
      const active=document.querySelector('input[name="smAct"]:checked').value==="1",area=el("smArea").value.trim();
      let ids=[...el("smBrands").querySelectorAll("input:checked")].map(x=>x.value);
      if(name.length<2){await alert("Write the salesman name.");return}
      if(!/^[6-9]\d{9}$/.test(mob)){await alert("Mobile should be 10 digits. It is his login ID.");return}
      if(brands.length&&!ids.length){await alert("Tick at least one brand he can sell.");return}
      if(brands.length&&brands.every(c=>ids.includes(c.id)))ids=[];// every brand = All brands
      const pass=el("smPassBox").hidden?"":el("smPass").value.trim();
      if(!el("smPassBox").hidden&&pass.length<6){await alert("Password must be at least 6 characters.");return}
      const b=el("smSave");b.disabled=true;
      try{
        const {data,error}=await client.rpc("lwb_salesman_save",{p:{user_id:r&&r.user_id||null,staff_id:r&&r.staff?r.staff.id:null,name,mobile:mob,role:post,kind,area,active,
          company_ids:ids,password:pass||null,joining_date:el("smJoin").value||null,monthly_salary:Number(el("smSal").value)||0}});
        if(error)throw error;
        smPop.close();
        if(pass&&data&&data.login_made)await alert("Salesman saved: "+name+"\nWebsite: "+location.origin+"/login.html\nLogin: "+mob+"\nPassword: "+pass+"\n\nShare this with "+name+".");
        else ERPShell.toast("Salesman saved.");
        await loadAll();
      }catch(e){await alert("Could not save: "+(e.message||e))}
      b.disabled=false;
    }

    // ---- Parties
    function ageCell(d){
      if(!d)return '<span class="sl-age never">No order yet</span>';
      const n=S.daysBetween(d,S.isoDay(new Date()));
      return '<span class="sl-age '+(n>=10?"a10":n>=5?"a5":n>=2?"a2":"")+'">'+(n===0?"Today":n+" days")+"</span>";
    }
    function partyList(){
      const q=key(pf.q);
      return parties.filter(p=>(!q||key(p.customer_name+" "+(p.city||"")).includes(q))&&(!pf.city||key(p.city)===pf.city)&&
        (!pf.sm||(pf.sm==="none"?!p.salesman_id:p.salesman_id===pf.sm)));
    }
    function smOptions(sel,withNone){
      return (withNone?'<option value="">Office (no salesman)</option>':"")+assignable().concat(sel&&!assignable().some(t=>t.user_id===sel)?team.filter(t=>t.user_id===sel):[]).map(t=>'<option value="'+t.user_id+'"'+(t.user_id===sel?" selected":"")+">"+esc(t.full_name)+" · "+(t.active===false?"inactive":isHead(t)?"Sales Head":t.kind==="OFFICE"?"Office":"Field")+"</option>").join("");
    }
    function renderParties(card){
      const list=partyList(),cities=[...new Set(parties.map(p=>key(p.city)).filter(Boolean))].sort();
      const unassigned=parties.filter(p=>!p.salesman_id).length;
      const rows=list.slice(0,500).map(p=>({attr:' data-id="'+p.customer_id+'"',cells:[
        '<input type="checkbox" data-pick'+(picked.has(p.customer_id)?" checked":"")+' aria-label="Select party">',esc(p.customer_name),esc(p.city||"—"),
        '<select class="sl-in" data-assign>'+smOptions(p.salesman_id,true)+"</select>",ageCell(p.last_order_date),fmt(p.orders_30d)]}));
      card.innerHTML='<div class="erp-card-head"><h2>Party Assignment</h2><small style="color:var(--erp-muted)">'+fmt(parties.length)+" parties · "+fmt(unassigned)+" with office</small></div>"+
        '<div class="sl-bulk"><div class="sl-filters" style="margin:0;flex:1">'+
        '<div class="grow"><label for="pq">Search party / city</label><input id="pq" type="search" value="'+esc(pf.q)+'" autocomplete="off"></div>'+
        '<div><label for="psm">Salesman</label><select id="psm"><option value="">All</option><option value="none"'+(pf.sm==="none"?" selected":"")+'>Office (unassigned)</option>'+assignable().map(t=>'<option value="'+t.user_id+'"'+(pf.sm===t.user_id?" selected":"")+">"+esc(t.full_name)+"</option>").join("")+"</select></div>"+
        '<div><label for="pcity">City</label><select id="pcity"><option value="">All</option>'+cities.map(c=>'<option'+(pf.city===c?" selected":"")+">"+esc(c)+"</option>").join("")+"</select></div></div></div>"+
        '<div class="sl-bulk"><b id="pickN">'+picked.size+' selected</b><button type="button" class="sl-btn ghost small" data-pick-all>Select all shown</button><button type="button" class="sl-btn ghost small" data-pick-none>Clear</button>'+
        '<span>Assign to</span><select class="sl-in" id="bulkSm" style="width:auto">'+smOptions("",true)+'</select><button type="button" class="sl-btn small" data-bulk>Assign selected</button>'+
        '<span style="flex:1"></span><button type="button" class="sl-btn ghost small" data-xl-exp>⬇ Export Excel</button><label class="sl-btn ghost small" style="display:inline-flex;align-items:center">⬆ Import Excel<input type="file" accept=".xlsx,.xls,.csv" data-xl-imp hidden></label></div>'+
        (assignable().length?"":'<div class="erp-empty">No SALES login yet. Create salesmen in Manage Users with the SALES role.</div>')+
        (rows.length?'<div class="sl-scroll">'+S.table(["","Party","City","Salesman","Last Order","Orders (30 days)"],rows,[5])+"</div>":'<div class="erp-empty">No party matches.</div>');
      el("note").textContent=(list.length>500?"Showing first 500 of "+fmt(list.length)+". Use the filters. ":"")+"Changing the Salesman dropdown saves at once. For many parties: Export Excel, fill the Salesman column, then Import Excel. A party with Office (no salesman) is visible only to Office salesmen, the Sales Head and Admin.";
    }
    async function assign(ids,sm){
      const {data,error}=await client.rpc("lwb_assign_parties",{p_customer_ids:ids,p_salesman_id:sm||null});
      if(error){await alert("Could not assign: "+error.message);return false}
      for(const p of parties)if(ids.includes(p.customer_id)){p.salesman_id=sm||null;p.salesman_name=sm?nameOf(sm):null}
      team.forEach(t=>t.parties=parties.filter(p=>p.salesman_id===t.user_id).length);
      const t=team.find(x=>x.user_id===sm);if(t&&!t.kind)t.kind="FIELD";
      ERPShell.toast(fmt(ids.length)+" "+(ids.length===1?"party":"parties")+" assigned to "+(sm?nameOf(sm):"Office")+".");
      return true;
    }

    const STOCK_ROLES=[["admin","Admin"],["manager","Sales Head"],["warehouse","Godown team"],["sales","Salesmen"],["accounts","Accounts"]];
    // ---- Excel: export Party / City / Salesman, fill the Salesman column, import to assign all at once.
    const XL_COLS=[{h:"Party Name",k:"party",req:true,alias:["Party","Customer Name"]},{h:"City",k:"city"},{h:"Salesman",k:"salesman",alias:["Salesman Name","Sales Person"]}];
    async function xlExport(){
      const rows=[...parties].sort((a,b)=>String(a.customer_name).localeCompare(String(b.customer_name))).map(p=>[p.customer_name,p.city||"",p.salesman_id?nameOf(p.salesman_id):"OFFICE"]);
      const help=[["How to use"],["Fill the Salesman column with the salesman's name (as in this page) or his login mobile. OFFICE = no salesman."],["A blank Salesman cell keeps the party as it is. Party Name must match the ERP; City is only for your reference."],[],["Salesmen"],...assignable().map(t=>[t.full_name,t.mobile||""])];
      try{await LWBExcel.write("Party-Assignment-"+S.isoDay(new Date()),[{name:"Parties",rows:[["Party Name *","City","Salesman"],...rows]},{name:"Help",rows:help}]);
        ERPShell.toast(fmt(rows.length)+" parties exported. Fill the Salesman column and import it back.")}catch(e){await alert(e.message)}
    }
    // Salesman cell -> user id ('' = Office), undefined = blank (keep), null = not found.
    function smFromCell(v){
      const t=key(v);if(!t)return undefined;
      if(/^(OFFICE|NONE|NO SALESMAN|OFFICE \(NO SALESMAN\)|-)$/.test(t))return "";
      const d=t.replace(/\D/g,"").slice(-10);
      const hit=assignable().filter(x=>key(x.full_name)===t||(d.length===10&&String(x.mobile||"").replace(/\D/g,"").slice(-10)===d));
      return hit.length===1?hit[0].user_id:null;
    }
    async function xlImport(f){
      let rows;try{rows=await LWBExcel.read(f,XL_COLS)}catch(e){await alert("Could not read the file: "+e.message);return}
      const byName=new Map(parties.map(p=>[key(p.customer_name),p])),seen=new Set(),errors=[],groups=new Map();let same=0,blank=0;
      for(const r of rows){
        const name=key(r.party),bad=t=>errors.push("Row "+r._row+" ("+(name||"-")+"): "+t);
        if(!name)continue;
        if(seen.has(name)){bad("appears twice");continue}seen.add(name);
        const p=byName.get(name);if(!p){bad("party not found in the ERP");continue}
        const sm=smFromCell(r.salesman);
        if(sm===undefined){blank++;continue}
        if(sm===null){bad('salesman "'+r.salesman+'" not found');continue}
        if((p.salesman_id||"")===sm){same++;continue}
        if(!groups.has(sm))groups.set(sm,[]);groups.get(sm).push(p.customer_id);
      }
      const n=[...groups.values()].reduce((a,x)=>a+x.length,0);
      const summary=fmt(n)+" parties to change · "+fmt(same)+" already the same · "+fmt(blank)+" blank (kept)"+(errors.length?" · "+fmt(errors.length)+" with errors":"")+
        "\n\n"+[...groups].map(([sm,ids])=>(sm?nameOf(sm):"Office")+": "+fmt(ids.length)).join("\n")+(errors.length?"\n\nNot changed:\n"+errors.slice(0,15).join("\n")+(errors.length>15?"\n...":""):"");
      if(!n){await alert("Nothing to change.\n\n"+summary,{kind:errors.length?"error":"info"});return}
      if(!await confirm("Assign "+fmt(n)+" parties from "+f.name+"?\n\n"+summary,{ok:"Assign"}))return;
      const failed=[];let done=0;
      for(const [sm,ids] of groups)for(let i=0;i<ids.length;i+=200){
        const part=ids.slice(i,i+200);
        const {error}=await client.rpc("lwb_assign_parties",{p_customer_ids:part,p_salesman_id:sm||null});
        if(error)failed.push((sm?nameOf(sm):"Office")+" ("+part.length+"): "+error.message);else done+=part.length;
      }
      await loadAll();
      if(failed.length)await alert(fmt(done)+" parties assigned.\n\nNot saved:\n"+failed.join("\n"));
      else ERPShell.toast(fmt(done)+" parties assigned from Excel.");
    }

    // ---- SKU visibility
    function skuRule(name){
      const r=rules.filter(x=>x.sku_key===key(name));
      return {mode:r.length?r[0].rule:"ALL",ids:new Set(r.map(x=>x.salesman_id))};
    }
    function renderSkus(card){
      const q=key(pf.sq||""),list=skus.filter(s=>!q||key(s.sku_name+" "+(s.category||"")).includes(q));
      const limited=skus.filter(s=>skuRule(s.sku_name).mode!=="ALL").length;
      const rows=list.map(s=>{const r=skuRule(s.sku_name);return {attr:' data-sku="'+esc(s.sku_name)+'"',cells:[esc(s.sku_name),esc(s.category||"—"),
        '<select class="sl-in" data-mode><option value="ALL">All salesmen</option><option value="ONLY"'+(r.mode==="ONLY"?" selected":"")+'>Only selected</option><option value="HIDE"'+(r.mode==="HIDE"?" selected":"")+'>Hide for selected</option></select>',
        '<div class="sl-chips"'+(r.mode==="ALL"?" hidden":"")+">"+salesmen().filter(t=>!isHead(t)).concat(team.filter(t=>(!isSales(t)||isHead(t))&&r.ids.has(t.user_id))).map(t=>'<label class="sl-chip'+(r.ids.has(t.user_id)?" on":"")+'"><input type="checkbox" value="'+t.user_id+'"'+(r.ids.has(t.user_id)?" checked":"")+">"+esc(t.full_name)+"</label>").join("")+"</div>",
        '<button type="button" class="sl-btn small" data-save-sku>Save</button>']}});
      card.innerHTML='<div class="erp-card-head"><h2>SKU Visibility per Salesman</h2><small style="color:var(--erp-muted)">'+limited+" SKUs limited</small></div>"+
        '<div class="sl-bulk"><div class="sl-filters" style="margin:0;flex:1"><div class="grow"><label for="sq">Search SKU / category</label><input id="sq" type="search" value="'+esc(pf.sq||"")+'" autocomplete="off"></div></div></div>'+
        (rows.length?'<div class="sl-scroll">'+S.table(["SKU","Category","Who can see it","Salesmen",""],rows)+"</div>":'<div class="erp-empty">No SKU matches.</div>');
      el("note").textContent="Use this when stock is kept for some parties: the SKU disappears from that salesman's PO Entry and SKU list. It applies to SALES logins only; Admin and Sales Head always see every SKU. Live stock is shown only to Admin, Sales Head, Warehouse and Accounts.";
    }
    async function saveSku(tr){
      const mode=tr.querySelector("[data-mode]").value,ids=[...tr.querySelectorAll(".sl-chips input:checked")].map(x=>x.value);
      if(mode!=="ALL"&&!ids.length){await alert("Select at least one salesman.");return}
      const {error}=await client.rpc("lwb_set_sku_visibility",{p_sku_name:tr.dataset.sku,p_mode:mode,p_salesmen:ids});
      if(error){await alert("Could not save: "+error.message);return}
      const k=key(tr.dataset.sku);rules=rules.filter(x=>x.sku_key!==k).concat(mode==="ALL"?[]:ids.map(id=>({sku_key:k,salesman_id:id,rule:mode})));
      ERPShell.toast("SKU visibility saved.");render();
    }

    // ---- Targets
    function targetOf(id){const m=tMonth+"-01";return targets.find(t=>t.month===m&&(t.salesman_id||null)===(id||null))||{target_amount:0,target_cases:0}}
    function renderTargets(card){
      const co=targetOf(null),sm=salesmen().concat(team.filter(t=>!isSales(t)&&num(targetOf(t.user_id).target_amount)));
      const sum=sm.reduce((a,t)=>a+num(targetOf(t.user_id).target_amount),0);
      const row=(id,label,t)=>({attr:' data-id="'+(id||"")+'"',cells:[label,
        '<input class="sl-in" type="number" min="0" step="1000" data-f="amt" value="'+(num(t.target_amount)||"")+'" placeholder="₹ amount"><div class="sl-help">'+(num(t.target_amount)?short(t.target_amount):"&nbsp;")+"</div>",
        '<input class="sl-in" type="number" min="0" step="1" data-f="cases" value="'+(num(t.target_cases)||"")+'" placeholder="Cases (optional)">']});
      card.innerHTML='<div class="erp-card-head"><h2>Monthly Targets</h2><div class="sl-filters" style="margin:0"><div><label for="tm">Month</label><input id="tm" type="month" value="'+tMonth+'"></div><div><label>&nbsp;</label><button type="button" class="sl-btn" data-save-targets>Save Targets</button></div></div></div>'+
        '<div class="sl-scroll">'+S.table(["Target for","Target Amount ₹","Target Cases"],[row(null,"<b>Company target (distributor)</b>",co),...sm.map(t=>row(t.user_id,esc(t.full_name)+' <span class="erp-badge">'+(isHead(t)?"Sales Head":t.kind==="OFFICE"?"Office":"Field")+"</span>",targetOf(t.user_id)))],[],
          ["Salesmen total",short(sum)+(num(co.target_amount)?" of "+short(co.target_amount):""),""])+"</div>";
      el("note").textContent="Enter rupees in full (2 crore = 20000000). Achievement is shown on Sales Tracking and on each salesman's My Sales page.";
    }
    async function saveTargets(){
      const rows=[...el("card").querySelectorAll("tbody tr")].map(tr=>({salesman_id:tr.dataset.id||null,target_amount:num(tr.querySelector('[data-f="amt"]').value),target_cases:num(tr.querySelector('[data-f="cases"]').value)}));
      const {error}=await client.rpc("lwb_save_sales_targets",{p_month:tMonth+"-01",p_rows:rows});
      if(error){await alert("Could not save targets: "+error.message);return}
      ERPShell.toast("Targets saved for "+tMonth+".");await loadAll();
    }

    // ---- Morning plan
    function renderPlan(card){
      const today=S.isoDay(new Date()),due=num(settings.due_after_days)||3;
      const rows=salesmen().map(t=>{
        const mine=parties.filter(p=>p.salesman_id===t.user_id);
        const d=mine.filter(p=>!p.last_order_date||S.daysBetween(p.last_order_date,today)>=due);
        return [esc(t.full_name),isHead(t)?"Sales Head":t.kind==="OFFICE"?"Office":"Field",fmt(mine.length),fmt(d.length),esc(d.slice(0,6).map(p=>p.customer_name).join(", "))+(d.length>6?" …":"")];
      });
      card.innerHTML='<div class="erp-card-head"><h2>Morning Plan Notification</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="sl-btn" data-send="0">Send today\'s plan</button><button type="button" class="sl-btn ghost" data-send="1">Send again with latest notes</button></div></div>'+
        '<div class="erp-card-body"><div class="sl-filters"><div><label for="due">Party is due after (days with no order)</label><input id="due" type="number" min="1" max="60" value="'+due+'" style="width:120px"></div>'+
          (settings.min_order_kg!=null?'<div><label for="minKg">Minimum order weight (KG, 0 = none)</label><input id="minKg" type="number" min="0" max="100000" step="100" value="'+num(settings.min_order_kg)+'" style="width:140px"></div>':'')+
          (settings.kyc_free_orders!=null?'<div><label for="kycFree">Orders allowed while party details are missing</label><input id="kycFree" type="number" min="0" max="50" value="'+num(settings.kyc_free_orders)+'" style="width:120px"></div>':'')+
          '<div><label>&nbsp;</label><button type="button" class="sl-btn ghost" data-save-due>Save</button></div></div>'+
          (settings.stock_view_roles?'<div class="sl-filters" style="align-items:center"><b style="font-size:13px">Live stock on PO Entry visible to:</b>'+STOCK_ROLES.map(([r,t])=>'<label style="display:inline-flex;gap:5px;align-items:center;font-size:13px;margin:0"><input type="checkbox" data-stock-role="'+r+'"'+(r==="admin"?" checked disabled":settings.stock_view_roles.includes(r)?" checked":"")+">"+t+"</label>").join("")+'<button type="button" class="sl-btn ghost small" data-save-stock>Save</button></div>':"")+
        '<div class="sl-filters"><div><label for="nsm">Note for</label><select id="nsm"><option value="">All salesmen</option>'+smOptions("",false)+'</select></div><div class="grow"><label for="ntext">Today\'s note from Sales Head</label><input id="ntext" maxlength="500" placeholder="e.g. Push 2L PET today; collect pending payment from big parties"></div><div><label>&nbsp;</label><button type="button" class="sl-btn" data-add-note>Add note</button></div></div>'+
        (notes.length?'<ul class="sl-plan">'+notes.map(n=>"<li><b>"+esc(n.salesman_id?nameOf(n.salesman_id):"All")+":</b> "+esc(n.note)+' <button type="button" class="sl-btn ghost small" data-del-note="'+n.id+'">Remove</button></li>').join("")+"</ul>":'<p class="sl-help">No note for today.</p>')+
        "</div>"+(rows.length?'<div class="sl-scroll">'+S.table(["Salesman","Type","Parties","Due today","Due parties"],rows,[2,3])+"</div>":"");
      el("note").textContent="Each salesman gets one 🔔 notification a day with his due parties and today's notes. It is sent automatically at 8:30 AM if pg_cron is on in Supabase, otherwise when he first opens the ERP, or when you click Send.";
    }

    (async()=>{
      me=await S.start(["admin","manager"]);if(!me)return;
      try{const t=localStorage.getItem("lwb_sales_team_tab");if(TABS.some(x=>x[0]===t))tab=t}catch(e){}
      document.addEventListener("click",async e=>{
        const t=e.target;
        const tb=t.closest("[data-tab]");if(tb){tab=tb.dataset.tab;try{localStorage.setItem("lwb_sales_team_tab",tab)}catch(x){}render();return}
        if(t.closest("[data-sm-new]"))return smOpen(null);
        const se=t.closest("[data-sm-edit]");if(se){const r=smRows().find(x=>x.id===se.dataset.smEdit);if(r)smOpen(r);return}
        if(t.id==="smSave")return smSave();if(t.id==="smCancel")return smPop.close();
        if(t.closest("[data-save-sku]"))return saveSku(t.closest("tr"));
        if(t.closest("[data-save-targets]"))return saveTargets();
        if(t.matches("[data-pick]")){const id=t.closest("tr").dataset.id;t.checked?picked.add(id):picked.delete(id);el("pickN").textContent=picked.size+" selected";return}
        if(t.closest("[data-pick-all]")){partyList().slice(0,500).forEach(p=>picked.add(p.customer_id));render();return}
        if(t.closest("[data-pick-none]")){picked.clear();render();return}
        if(t.closest("[data-xl-exp]"))return xlExport();
        if(t.closest("[data-bulk]")){
          if(!picked.size){await alert("Select at least one party.");return}
          const sm=el("bulkSm").value;
          if(!await confirm("Assign "+picked.size+" parties to "+(sm?nameOf(sm):"Office (no salesman)")+"?"))return;
          if(await assign([...picked],sm)){picked.clear();render()}return;
        }
        if(t.closest("[data-send]")){
          const {data,error}=await client.rpc("lwb_send_sales_plans",{p_force:t.closest("[data-send]").dataset.send==="1"});
          if(error){await alert("Could not send: "+error.message);return}
          await alert(data?"Plan sent to "+data+" salesmen.":"Nothing new to send. Every salesman already has today's plan (use Send again after adding a note).");return;
        }
        if(t.closest("[data-save-stock]")){
          const roles=[...document.querySelectorAll("[data-stock-role]:checked")].map(x=>x.dataset.stockRole);
          const {data,error}=await client.rpc("lwb_save_stock_view_roles",{p_roles:roles});
          if(error){await alert("Could not save: "+error.message);return}
          settings.stock_view_roles=data||roles;ERPShell.toast("Saved. Stock shows on PO Entry for the ticked roles.");return;
        }
        if(t.closest("[data-save-due]")){
          const {error}=await client.rpc("lwb_save_sales_settings",{p_due_after_days:Math.round(num(el("due").value))});
          if(error){await alert("Could not save: "+error.message);return}
          settings.due_after_days=Math.round(num(el("due").value));
          if(el("minKg")){
            const k=Math.max(0,num(el("minKg").value));
            const {error:e3}=await client.rpc("lwb_save_min_order_kg",{p_kg:k});
            if(e3){await alert("Could not save: "+e3.message);return}
            settings.min_order_kg=k;
          }
          if(el("kycFree")){
            const k=Math.round(num(el("kycFree").value));
            const {error:e2}=await client.rpc("lwb_save_party_detail_limit",{p_orders:k});
            if(e2){await alert("Could not save: "+e2.message);return}
            settings.kyc_free_orders=k;
          }
          ERPShell.toast("Saved.");render();return;
        }
        if(t.closest("[data-add-note]")){
          const note=el("ntext").value.trim();if(!note){await alert("Enter the note.");return}
          const {error}=await client.rpc("lwb_add_sales_plan_note",{p_date:S.isoDay(new Date()),p_salesman_id:el("nsm").value||null,p_note:note});
          if(error){await alert("Could not add note: "+error.message);return}
          await loadAll();return;
        }
        const dn=t.closest("[data-del-note]");
        if(dn){const {error}=await client.rpc("lwb_delete_sales_plan_note",{p_id:Number(dn.dataset.delNote)});if(error){await alert(error.message);return}await loadAll()}
      });
      document.addEventListener("change",async e=>{
        const t=e.target;
        if(t.matches("[data-xl-imp]")){const f=t.files[0];t.value="";if(f)await xlImport(f);return}
        if(t.matches("[data-assign]")){if(!await assign([t.closest("tr").dataset.id],t.value))await loadAll();return}
        if(t.matches("[data-mode]")){const c=t.closest("tr").querySelector(".sl-chips");c.hidden=t.value==="ALL";return}
        if(t.matches(".sl-chips input")){t.closest(".sl-chip").classList.toggle("on",t.checked);return}
        if(t.id==="psm"){pf.sm=t.value;render()}else if(t.id==="pcity"){pf.city=t.value;render()}
        else if(t.id==="tm"&&t.value){tMonth=t.value;render()}
        else if(t.id==="sbr"){smF.brand=t.value;render()}
      });
      let timer;
      document.addEventListener("input",e=>{
        const t=e.target;if(t.id!=="pq"&&t.id!=="sq")return;
        clearTimeout(timer);timer=setTimeout(()=>{if(t.id==="pq")pf.q=t.value;else if(tab==="team")smF.q=t.value;else pf.sq=t.value;render();const f=el(t.id);if(f){f.focus();f.setSelectionRange(f.value.length,f.value.length)}},250);
      });
      smPop=LWBMasterPopup.mount({panel:"smPanel",bar:null});
      el("loading").hidden=true;el("page").hidden=false;
      await loadAll();
    })();
  </script>
</body>
</html>
