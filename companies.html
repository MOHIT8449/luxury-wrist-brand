<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company / Brand | Luxury Wrist Brand ERP</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="erp-date.js"></script>
  <link rel="stylesheet" href="erp-shell.css">
  <script src="erp-shell.js"></script>
  <script src="excel-io.js"></script>
  <script src="brand-filter.js"></script>
  <style>
    .status{text-align:center;padding:80px 20px;font-size:15px;color:#555}
    [hidden]{display:none!important}
    .cb-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}
    .cb-top h1{margin:0;font-size:20px;flex:1 1 auto}
    .cb-btn{height:38px;border-radius:8px;padding:0 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;border:1px solid var(--erp-line);background:#fff;color:var(--erp-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
    .cb-btn.pri{background:#1769d8;border-color:#1769d8;color:#fff}.cb-btn.go{background:#13824a;border-color:#13824a;color:#fff}
    .cb-btn.sm{height:32px;padding:0 10px;font-size:13px}.cb-btn:disabled{opacity:.55;cursor:default}
    .cb-msg{padding:11px 14px;border-radius:8px;margin:0 0 12px;background:#fdf0dc;color:#7a4700;white-space:pre-wrap;font-size:14px}
    .cb-msg.bad{background:#ffebeb;color:#9b2020}.cb-msg.ok{background:#e3f5ec;color:#13824a}
    .cb-card{background:#fff;border:1px solid var(--erp-line);border-radius:10px;padding:12px}
    .cb-tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
    .cb-tabs button{height:36px;border-radius:99px;border:1.5px solid var(--erp-line);background:#fff;color:var(--erp-ink);padding:0 14px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
    .cb-tabs button[aria-pressed=true]{border-color:#14253f;background:#14253f;color:#fff;font-weight:600}
    .cb-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:0 0 12px}
    .cb-bar label,.cb-f label{display:block;font-size:12.5px;font-weight:700;color:#4b5763;margin:0 0 4px}
    .cb-bar input,.cb-bar select,.cb-f input,.cb-f select{height:38px;border:1.5px solid var(--erp-line);border-radius:8px;padding:0 10px;font:inherit;font-size:15px;background:#fff;color:var(--erp-ink);box-sizing:border-box;min-width:0}
    .cb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
    .cb-co{border:1px solid var(--erp-line);border-top:4px solid var(--c);border-radius:10px;padding:12px 14px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 6%,#fff),#fff 60%)}
    .cb-co h3{margin:0 0 8px;font-size:16px;color:var(--c)}
    .cb-co h3 small{display:block;font-size:12px;color:var(--erp-muted);font-weight:600;margin-top:2px}
    .cb-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid #eef1f4;font-size:13.5px}
    .cb-row:first-of-type{border-top:0}.cb-row span{color:#4b5763}.cb-row b{font-variant-numeric:tabular-nums;text-align:right}
    .cb-row b small{display:block;font-size:11.5px;color:var(--erp-muted);font-weight:500}
    .cb-prog{height:8px;border-radius:99px;background:#eef1f5;overflow:hidden;margin:2px 0 4px}.cb-prog i{display:block;height:100%;background:var(--c)}
    .red{color:#b3122b!important}.grn{color:#13824a!important}.amb{color:#9a5b00!important}
    .cb-t{border-collapse:collapse;width:100%;font-size:14px}
    .cb-t th,.cb-t td{border-bottom:1px solid var(--erp-line);padding:8px;text-align:left;vertical-align:middle}
    .cb-t th{background:#f6f7f9;font-size:12.5px;font-weight:700;color:#2b3440;white-space:nowrap}
    .cb-t td.n,.cb-t th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
    .cb-t td small{display:block;color:var(--erp-muted);font-size:12px}
    .cb-t tfoot td{font-weight:700;background:#f6f7f9}
    .cb-t input.num{width:120px;height:34px;border:1.5px solid var(--erp-line);border-radius:7px;padding:0 8px;font:inherit;font-size:15px;text-align:right}
    .cb-t input.days{width:72px}
    .cb-scroll{overflow-x:auto}
    .tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
    .t-red{background:#fdecef;color:#b3122b}.t-amb{background:#fdf0dc;color:#9a5b00}.t-grn{background:#e3f5ec;color:#13824a}.t-blu{background:#e6efff;color:#1d5fbf}.t-gry{background:#eef0f3;color:#3b4652}
    .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:middle}
    .cb-sec{margin:0 0 16px}.cb-sec h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .cb-sec h3 .cb-btn{margin-left:auto}
    .cb-checks{display:flex;gap:6px;flex-wrap:wrap}
    .cb-checks label{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--erp-line);border-radius:99px;padding:4px 10px;font-size:13px;cursor:pointer;font-weight:600}
    .cb-checks label:has(input:checked){border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);color:var(--c)}
    .cb-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;align-items:end;background:#f6f8fa;border-radius:10px;padding:12px;margin:0 0 12px}
    .cb-f input,.cb-f select{width:100%}
    .cb-f input[type=color]{padding:2px 4px;height:38px}
    .cb-note{font-size:13px;color:var(--erp-muted);margin:10px 2px 0;line-height:1.5}
    .cb-empty{padding:22px 10px;text-align:center;color:var(--erp-muted)}
    .lnk{border:0;background:none;color:#1769d8;font:inherit;font-weight:600;cursor:pointer;padding:0;font-size:13px}
    .lnk.red{color:#b3122b}
    @media(max-width:560px){.cb-grid{grid-template-columns:1fr}.cb-bar>div{flex:1 1 140px}.cb-bar input,.cb-bar select{width:100%}
      .cb-t.resp thead{display:none}.cb-t.resp tr{display:grid;grid-template-columns:1fr auto;border-bottom:1px solid var(--erp-line);padding:4px 0}
      .cb-t.resp td{border:0;padding:3px 8px}.cb-t.resp td:first-child{grid-column:1/-1}.cb-t.resp td[data-l]::before{content:attr(data-l) " ";color:var(--erp-muted);font-size:12px}}
  </style>
</head>
<body>
  <div id="loading" class="status">Checking access...</div>
  <main id="page" class="erp-main" hidden>
    <div class="cb-top"><h1>Company / Brand</h1><button type="button" class="cb-btn" id="reload">↻ Refresh</button></div>
    <div id="msg" class="cb-msg" hidden></div>
    <section class="cb-card">
      <div class="cb-tabs" id="tabs">
        <button type="button" data-t="sum">Brand summary</button>
        <button type="button" data-t="tgt" data-r="admin manager">Targets</button>
        <button type="button" data-t="team" data-r="admin manager">Team brands</button>
        <button type="button" data-t="pay" data-r="admin accounts">Pay company</button>
        <button type="button" data-t="udh">Party udhari</button>
        <button type="button" data-t="co" data-r="admin">Companies</button>
      </div>
      <div id="body"></div>
    </section>
    <p class="cb-note" id="note"></p>
  </main>
  <script>
    'use strict';
    const client=supabase.createClient("https://txkbhadzdbxpieunfvox.supabase.co","sb_publishable_W4I3Q5ODf0g17sq5uDml2Q_sLolXYEk");
    const el=id=>document.getElementById(id);
    const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const num=v=>{const n=Number(String(v==null?"":v).replace(/[,₹\s]/g,""));return Number.isFinite(n)?n:0};
    const rs=n=>(num(n)<0?"−":"")+"₹"+Math.abs(Math.round(num(n))).toLocaleString("en-IN");
    const fmt=n=>Math.round(num(n)).toLocaleString("en-IN");
    const dmy=v=>window.LWBDate?LWBDate.d(v):String(v||"");
    const pct=(a,b)=>b>0?Math.round(a/b*100):null;
    const istToday=()=>new Date(Date.now()+19800000).toISOString().slice(0,10);
    const dayDiff=(a,b)=>Math.round((Date.parse(b+"T12:00:00Z")-Date.parse(a+"T12:00:00Z"))/864e5);
    const errText=e=>String((e&&e.message)||e||"Error").replace(/^.*?ERROR:\s*/,"");
    const toast=t=>ERPShell.toast?ERPShell.toast(t):say(t,false,true);
    const MODES={BANK:"Bank / RTGS",UPI:"UPI",CHEQUE:"Cheque",CASH:"Cash",CREDIT_NOTE:"Credit note"};
    let role="",tab="sum",B={companies:[],all:[]},from="",to="",month="",payCo="",cache={};
    function say(t,bad,ok){el("msg").hidden=!t;el("msg").textContent=t||"";el("msg").className="cb-msg"+(bad?" bad":ok?" ok":"")}
    const may=r=>r.split(" ").includes(role);
    const coName=id=>{const c=B.all.find(x=>x.id===id);return c?c.name:"No company"};
    const coColor=id=>{const c=B.all.find(x=>x.id===id);return c?c.color:"#8a94a3"};

    async function load(){
      el("reload").disabled=true;say("");
      try{B=await LWBBrand.load(client,true);
        if(B.missing){el("body").innerHTML='<div class="cb-empty">Company setup is not installed yet (lwb_company_brand_setup.sql). It runs on its own after the update is merged.</div>';return}
        cache={};await render()}
      catch(e){say(errText(e),true)}
      finally{el("reload").disabled=false}
    }
    async function render(){
      el("tabs").querySelectorAll("[data-t]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.t===tab)));
      el("note").textContent="";
      try{await ({sum:renderSum,tgt:renderTgt,team:renderTeam,pay:renderPay,udh:renderUdh,co:renderCo})[tab]()}
      catch(e){el("body").innerHTML='<div class="cb-empty">'+esc(errText(e))+"</div>"}
    }

    /* ---------- Brand summary ---------- */
    async function renderSum(){
      el("body").innerHTML='<div class="cb-bar"><div><label for="sFrom">From</label><input type="date" id="sFrom" value="'+from+'"></div><div><label for="sTo">To</label><input type="date" id="sTo" value="'+to+'" max="'+istToday()+'"></div>'+
        '<button type="button" class="cb-btn sm" data-q="today">Today</button><button type="button" class="cb-btn sm" data-q="month">This month</button><button type="button" class="cb-btn sm" data-q="last">Last month</button><button type="button" class="cb-btn sm" id="sXl">⬇ Excel</button></div><div id="sBox"><div class="cb-empty">Loading…</div></div>';
      const go=()=>{from=el("sFrom").value||from;to=el("sTo").value||to;renderSum()};
      el("sFrom").onchange=go;el("sTo").onchange=go;
      el("body").querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{const t=istToday(),q=b.dataset.q;
        if(q==="today")from=to=t;else if(q==="month"){from=t.slice(0,8)+"01";to=t}
        else{const d=new Date(Date.parse(t.slice(0,8)+"01T12:00:00Z")-864e5).toISOString().slice(0,10);from=d.slice(0,8)+"01";to=d}
        renderSum()});
      const {data:O,error}=await client.rpc("lwb_company_overview",{p_from:from,p_to:to});
      if(error)throw error;
      const ids=O.companies.map(c=>c.id),rows=[];
      if(O.sales&&O.sales.none||O.outstanding&&O.outstanding.none||(!O.limited&&num(O.skus_without_company)))ids.push("none");
      const m=new Date(O.month+"T12:00:00Z").toLocaleDateString("en-IN",{month:"long",year:"numeric",timeZone:"UTC"});
      const html=ids.map(id=>{
        const c=O.companies.find(x=>x.id===id)||{name:"No company",color:"#8a94a3"},S=(O.sales||{})[id]||{},M=(O.month_sales||{})[id]||{},T=(O.targets||{})[id]||{},
          D=O.outstanding?(O.outstanding[id]||{}):null,P=O.payable&&id!=="none"?(O.payable[id]||{}):null,p=pct(num(M.amount),num(T.amount));
        rows.push([c.name,num(S.amount),num(S.cases),num(S.boxes),num(S.orders),num(M.amount),num(T.amount),p==null?"":p+"%",D?num(D.due):"",D?num(D.overdue):"",P?num(P.balance):"",P?num(P.overdue):""]);
        return '<div class="cb-co" style="--c:'+esc(c.color)+'"><h3>'+esc(c.name)+(id!=="none"?"<small>Sells in "+(c.pack_unit==="BOX"?"boxes":"cases")+" · Company credit "+num(c.supplier_credit_days)+" d · Market udhari "+num(c.market_credit_days)+" d</small>":"<small>SKUs without company</small>")+"</h3>"+
          '<div class="cb-row"><span>Sales '+(from===to?dmy(from):dmy(from)+" – "+dmy(to))+"</span><b>"+rs(S.amount)+"<small>"+LWBBrand.qty(S.cases,S.boxes)+" · "+fmt(S.orders)+" orders</small></b></div>"+
          (id!=="none"?'<div class="cb-row" style="display:block"><div style="display:flex;justify-content:space-between"><span>'+m+" target</span><b>"+(num(T.amount)?rs(M.amount)+" / "+rs(T.amount):'<span class="amb">Not set</span>')+"</b></div>"+
            (num(T.amount)?'<div class="cb-prog"><i style="width:'+Math.min(100,p)+'%"></i></div><small style="color:var(--erp-muted)">'+p+"% done"+(num(T.amount)>num(M.amount)?" · "+rs(num(T.amount)-num(M.amount))+" to go":" · target reached 🎉")+"</small>":"")+"</div>":"")+
          (D?'<div class="cb-row"><span>Outstanding (market)</span><b>'+rs(D.due)+"<small>"+fmt(D.parties||0)+(D.parties==1?" party · ":" parties · ")+fmt(D.bills||0)+(D.bills==1?" bill":" bills")+"</small></b></div>"+
            '<div class="cb-row"><span>Over udhari days</span><b class="'+(num(D.overdue)>0?"red":"grn")+'">'+rs(D.overdue)+"</b></div>":"")+
          (P?'<div class="cb-row"><span>To pay company</span><b>'+rs(P.balance)+"<small>"+(P.next_due?"next due "+dmy(P.next_due):num(P.balance)?"":"nothing due")+"</small></b></div>"+
            '<div class="cb-row"><span>Company payment late</span><b class="'+(num(P.overdue)>0?"red":"grn")+'">'+rs(P.overdue)+(num(P.today)?"<small>"+rs(P.today)+" due today</small>":"")+"</b></div>":"")+
          "</div>"}).join("");
      el("sBox").innerHTML=(html?'<div class="cb-grid">'+html+"</div>":'<div class="cb-empty">No company yet.</div>')+
        (!O.limited&&num(O.skus_without_company)?'<p class="cb-msg" style="margin-top:12px">'+fmt(O.skus_without_company)+' active SKU'+(O.skus_without_company==1?" has":"s have")+' no company yet. Set it in <a href="sku-master.html">SKU Master</a>, so their sales count under the right brand.</p>':"")+
        (O.error?'<p class="cb-note">Some figures could not be read: '+esc(O.error)+"</p>":"");
      el("sXl").onclick=()=>LWBExcel.write("brand-summary-"+from+"-"+to,[{name:"Brand summary",rows:[["Company","Sales ₹","Cases","Boxes","Orders","Month sales ₹","Month target ₹","Target %","Outstanding ₹","Over udhari ₹","To pay company ₹","Company payment late ₹"],...rows]}]).catch(e=>say(errText(e),true));
      el("note").textContent="Sales = orders taken (not cancelled), split by SKU company. Outstanding = billed amount still to collect, split by the bill's SKU value; over udhari = bill date + party's udhari days for that company (else company market days) has passed.";
    }

    /* ---------- Targets ---------- */
    async function renderTgt(){
      const [mo,tm]=await Promise.all([client.rpc("lwb_company_month",{p_month:month+"-01"}),cache.team?{data:cache.team}:client.rpc("lwb_brand_team")]);
      if(mo.error)throw mo.error;if(tm.error)throw tm.error;cache.team=tm.data||[];
      const M=mo.data,sales=M.sales||[],T=M.targets||[],sm=cache.team.filter(u=>u.role!=="manager"&&u.active!==false);
      const got=(c,s)=>sales.filter(x=>x.company_id===c&&(s===undefined||x.salesman_id===s)),sumA=l=>l.reduce((a,x)=>a+num(x.amount),0),sumQ=(l,k)=>l.reduce((a,x)=>a+num(x[k]),0);
      const tg=(c,s)=>T.find(x=>x.company_id===c&&(x.salesman_id||null)===(s||null))||{};
      el("body").innerHTML='<div class="cb-bar"><div><label for="tMonth">Month</label><input type="month" id="tMonth" value="'+month+'"></div></div>'+
        B.companies.map(c=>{
          const people=sm.filter(u=>!u.company_ids.length||u.company_ids.includes(c.id)),ct=tg(c.id,null),all=got(c.id);
          // Quantity target in the company's unit: Rajnigandha boxes, Coca-Cola cases.
          const box=c.pack_unit==="BOX",qk=box?"boxes":"cases",U=box?"Boxes":"Cases";
          return '<div class="cb-sec" data-c="'+c.id+'" style="--c:'+esc(c.color)+'"><h3><span class="dot"></span>'+esc(c.name)+'<button type="button" class="cb-btn sm pri" data-save>Save '+esc(c.name)+' targets</button></h3><div class="cb-scroll"><table class="cb-t resp"><thead><tr><th>Who</th><th class="n">Target ₹</th><th class="n">Target '+U.toLowerCase()+'</th><th class="n">Done ₹</th><th class="n">Done '+U.toLowerCase()+'</th><th class="n">%</th></tr></thead><tbody>'+
            '<tr data-s=""><td><b>Company total</b><small>Blank = sum of salesmen</small></td><td class="n" data-l="Target ₹"><input class="num" inputmode="decimal" data-a value="'+(num(ct.target_amount)||"")+'"></td><td class="n" data-l="'+U+'"><input class="num" inputmode="numeric" data-q value="'+(num(ct.target_cases)||"")+'"></td><td class="n" data-l="Done">'+rs(sumA(all))+'</td><td class="n" data-l="'+U+'">'+fmt(sumQ(all,qk))+'</td><td class="n">'+(pct(sumA(all),num(ct.target_amount))??"—")+"%</td></tr>"+
            people.map(u=>{const t=tg(c.id,u.user_id),g=got(c.id,u.user_id),p=pct(sumA(g),num(t.target_amount));
              return '<tr data-s="'+u.user_id+'"><td>'+esc(u.full_name||"—")+"<small>"+(u.company_ids.length?u.company_ids.map(coName).join(", "):"All brands")+'</small></td><td class="n" data-l="Target ₹"><input class="num" inputmode="decimal" data-a value="'+(num(t.target_amount)||"")+'"></td><td class="n" data-l="'+U+'"><input class="num" inputmode="numeric" data-q value="'+(num(t.target_cases)||"")+'"></td><td class="n" data-l="Done">'+rs(sumA(g))+'</td><td class="n" data-l="'+U+'">'+fmt(sumQ(g,qk))+'</td><td class="n'+(p==null?"":p>=75?" grn":p>=50?" amb":" red")+'">'+(p==null?"—":p+"%")+"</td></tr>"}).join("")+
            "</tbody></table></div></div>"}).join("")+(B.companies.length?"":'<div class="cb-empty">No company yet.</div>');
      el("tMonth").onchange=()=>{month=el("tMonth").value||month;renderTgt()};
      el("body").querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{
        const sec=b.closest("[data-c]"),rows=[...sec.querySelectorAll("tr[data-s]")].map(tr=>({salesman_id:tr.dataset.s||null,target_amount:num(tr.querySelector("[data-a]").value),target_cases:num(tr.querySelector("[data-q]").value)}));
        b.disabled=true;const {error}=await client.rpc("lwb_save_company_targets",{p_month:month+"-01",p_company_id:sec.dataset.c,p_rows:rows});b.disabled=false;
        if(error)return ERPShell.alert(errText(error));toast(coName(sec.dataset.c)+" targets saved");renderTgt()});
      el("note").textContent="Done = orders taken this month by that salesman's login, only the SKUs of that company. A blank or 0 target is removed.";
    }

    /* ---------- Team brands ---------- */
    async function renderTeam(){
      const {data,error}=await client.rpc("lwb_brand_team");if(error)throw error;cache.team=data||[];
      const list=cache.team.filter(u=>role==="admin"||u.role!=="manager");
      el("body").innerHTML=list.length?'<div class="cb-scroll"><table class="cb-t"><thead><tr><th>Name</th><th>Role</th><th>Companies (none ticked = all brands)</th><th></th></tr></thead><tbody>'+
        list.map(u=>'<tr data-u="'+u.user_id+'"><td><b>'+esc(u.full_name||"—")+"</b>"+(u.active===false?'<small>Inactive</small>':"")+"</td><td>"+(u.role==="manager"?'<span class="tag t-blu">Sales Head</span>':'<span class="tag t-gry">Salesman</span>')+'</td><td><div class="cb-checks">'+
          B.companies.map(c=>'<label style="--c:'+esc(c.color)+'"><input type="checkbox" value="'+c.id+'"'+(u.company_ids.includes(c.id)?" checked":"")+">"+esc(c.name)+"</label>").join("")+
          '</div></td><td><button type="button" class="cb-btn sm pri" data-save>Save</button></td></tr>').join("")+"</tbody></table></div>":'<div class="cb-empty">No Sales Head or Salesman login yet.</div>';
      el("body").querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{
        const tr=b.closest("tr"),ids=[...tr.querySelectorAll("input:checked")].map(x=>x.value);
        b.disabled=true;const {error}=await client.rpc("lwb_set_user_companies",{p_user_id:tr.dataset.u,p_company_ids:ids});b.disabled=false;
        if(error)return ERPShell.alert(errText(error));toast(ids.length?"Saved: only "+ids.map(coName).join(", "):"Saved: all brands");cache.team=null});
      el("note").textContent="A Sales Head or Salesman with a company ticked sees only that company's SKUs, orders, targets and brand figures. Accounts and Godown Manager always see every company."+(role==="manager"?" Only Admin can change a Sales Head.":"");
    }

    /* ---------- Pay company ---------- */
    async function renderPay(){
      if(!payCo||!B.companies.some(c=>c.id===payCo))payCo=(B.companies[0]||{}).id||"";
      if(!payCo){el("body").innerHTML='<div class="cb-empty">No company yet.</div>';return}
      const {data:P,error}=await client.rpc("lwb_company_payables",{p_company_id:payCo});if(error)throw error;
      const c=B.companies.find(x=>x.id===payCo),t=P.today,bills=P.bills||[],open=bills.filter(b=>num(b.balance)>0.005);
      const total=open.reduce((a,b)=>a+num(b.balance),0),late=open.filter(b=>b.due_date<t).reduce((a,b)=>a+num(b.balance),0);
      const status=b=>num(b.balance)<=0.005?'<span class="tag t-grn">Paid</span>':b.due_date<t?'<span class="tag t-red">Late '+dayDiff(b.due_date,t)+" d</span>":b.due_date===t?'<span class="tag t-amb">Due today</span>':'<span class="tag t-blu">In '+dayDiff(t,b.due_date)+" d</span>";
      el("body").innerHTML='<div class="cb-bar"><div><label for="pCo">Company</label><select id="pCo">'+B.companies.map(x=>'<option value="'+x.id+'"'+(x.id===payCo?" selected":"")+">"+esc(x.name)+"</option>").join("")+"</select></div>"+
        '<div style="margin-left:auto;text-align:right"><small style="color:var(--erp-muted)">To pay '+esc(c.name)+'</small><div style="font-size:22px;font-weight:800">'+rs(total)+'</div><small class="'+(late>0?"red":"grn")+'">'+(late>0?rs(late)+" late":"Nothing late")+"</small></div></div>"+
        (P.error?'<p class="cb-msg bad">'+esc(P.error)+"</p>":"")+
        '<form class="cb-form" id="pForm"><div class="cb-f"><label for="pDate">Paid on</label><input type="date" id="pDate" value="'+t+'" max="'+t+'" required></div>'+
        '<div class="cb-f"><label for="pAmt">Amount ₹</label><input id="pAmt" inputmode="decimal" placeholder="'+(total?Math.round(total):"0")+'" required></div>'+
        '<div class="cb-f"><label for="pMode">Mode</label><select id="pMode">'+Object.entries(MODES).map(([k,v])=>'<option value="'+k+'">'+v+"</option>").join("")+'</select></div>'+
        '<div class="cb-f"><label for="pRef">UTR / Cheque no.</label><input id="pRef" maxlength="80"></div><div class="cb-f"><label for="pNote">Note</label><input id="pNote" maxlength="300"></div>'+
        '<div class="cb-f"><button type="submit" class="cb-btn go" id="pSave">+ Save payment</button></div></form>'+
        '<h3 style="font-size:15px;margin:4px 0 8px">Purchase bills (Goods Inward) — '+esc(c.name)+' SKUs · credit '+num(c.supplier_credit_days)+' days</h3>'+
        (bills.length?'<div class="cb-scroll"><table class="cb-t resp"><thead><tr><th>Invoice</th><th>Bill date</th><th>Pay by</th><th class="n">Bill ₹</th><th class="n">Paid ₹</th><th class="n">Left ₹</th><th>Status</th></tr></thead><tbody>'+
          bills.slice().reverse().map(b=>"<tr><td><b>"+esc(b.invoice_no||"—")+"</b><small>"+esc(b.supplier_name||"")+'</small></td><td data-l="Bill">'+dmy(b.invoice_date)+'</td><td data-l="Pay by">'+dmy(b.due_date)+'</td><td class="n" data-l="Bill ₹">'+fmt(b.amount)+'</td><td class="n" data-l="Paid ₹">'+fmt(b.paid)+'</td><td class="n" data-l="Left ₹"><b>'+fmt(b.balance)+"</b></td><td>"+status(b)+"</td></tr>").join("")+
          "</tbody></table></div>":'<div class="cb-empty">No purchase bill with '+esc(c.name)+' SKUs yet. Set the company of each SKU in SKU Master.</div>')+
        '<h3 style="font-size:15px;margin:16px 0 8px">Payments to '+esc(c.name)+"</h3>"+
        ((P.payments||[]).length?'<div class="cb-scroll"><table class="cb-t resp"><thead><tr><th>Date</th><th class="n">Amount ₹</th><th>Mode</th><th>Ref / note</th><th></th></tr></thead><tbody>'+
          P.payments.map(p=>"<tr"+(p.cancelled?' style="opacity:.55"':"")+"><td>"+dmy(p.pay_date)+(p.by?"<small>"+esc(p.by)+"</small>":"")+'</td><td class="n" data-l="₹"><b>'+fmt(p.amount)+"</b></td><td>"+esc(MODES[p.mode]||p.mode)+"</td><td>"+esc([p.ref_no,p.note].filter(Boolean).join(" · ")||"—")+"</td><td>"+
            (p.cancelled?'<span class="tag t-gry">Cancelled</span>':role==="admin"?'<button type="button" class="lnk red" data-cancel="'+p.id+'">Cancel</button>':"")+"</td></tr>").join("")+"</tbody></table></div>":'<div class="cb-empty">No payment saved yet.</div>');
      el("pCo").onchange=()=>{payCo=el("pCo").value;renderPay()};
      el("pForm").onsubmit=async e=>{e.preventDefault();const amt=num(el("pAmt").value);if(amt<=0)return ERPShell.alert("Enter the amount.");
        if(!await ERPShell.confirm("Save payment to "+c.name+"?\n\n"+rs(amt)+" · "+MODES[el("pMode").value]+" · "+dmy(el("pDate").value)))return;
        el("pSave").disabled=true;const {error}=await client.rpc("lwb_company_pay",{p_company_id:payCo,p_date:el("pDate").value,p_amount:amt,p_mode:el("pMode").value,p_ref:el("pRef").value,p_note:el("pNote").value});
        el("pSave").disabled=false;if(error)return ERPShell.alert(errText(error));toast("Payment saved");renderPay()};
      el("body").querySelectorAll("[data-cancel]").forEach(b=>b.onclick=async()=>{if(!await ERPShell.confirm("Cancel this payment? The bills will show as unpaid again."))return;
        const {error}=await client.rpc("lwb_company_pay_cancel",{p_id:b.dataset.cancel});if(error)return ERPShell.alert(errText(error));toast("Payment cancelled");renderPay()});
      el("note").textContent="Bill amount = Goods Inward invoice total of this company's SKUs. Pay by = bill date + company credit days. A payment clears the oldest bill first. This page does not post to the Accounts Dashboard cash or bank.";
    }

    /* ---------- Party udhari ---------- */
    async function renderUdh(){
      const [pc,pm]=await Promise.all([client.from("lwb_party_company_credit").select("*"),cache.parties?{data:cache.parties}:client.from("lwb_customer_master").select("customer_name,credit_days,is_active").order("customer_name").limit(5000)]);
      if(pc.error)throw pc.error;cache.parties=pm.data||[];
      const list=(pc.data||[]).slice().sort((a,b)=>a.party_key.localeCompare(b.party_key)||coName(a.company_id).localeCompare(coName(b.company_id)));
      const edit=may("admin manager accounts");
      el("body").innerHTML='<div class="cb-grid" style="margin:0 0 14px">'+B.companies.map(c=>'<div class="cb-co" style="--c:'+esc(c.color)+'"><h3>'+esc(c.name)+'</h3><div class="cb-row"><span>Market udhari (all parties)</span><b>'+num(c.market_credit_days)+' days</b></div><div class="cb-row"><span>Company gives us</span><b>'+num(c.supplier_credit_days)+" days</b></div></div>").join("")+"</div>"+
        (edit?'<form class="cb-form" id="uForm"><div class="cb-f" style="grid-column:span 2"><label for="uParty">Party</label><input id="uParty" list="uList" autocomplete="off" placeholder="Type party name" required><datalist id="uList">'+cache.parties.filter(p=>p.is_active!==false).map(p=>'<option value="'+esc(p.customer_name)+'">').join("")+"</datalist></div>"+
          '<div class="cb-f"><label for="uCo">Company</label><select id="uCo">'+B.companies.map(c=>'<option value="'+c.id+'">'+esc(c.name)+"</option>").join("")+'</select></div><div class="cb-f"><label for="uDays">Udhari days</label><input id="uDays" type="number" min="0" max="365" step="1" required></div>'+
          '<div class="cb-f"><button type="submit" class="cb-btn pri">Save</button></div></form>':"")+
        (list.length?'<div class="cb-scroll"><table class="cb-t"><thead><tr><th>Party</th><th>Company</th><th class="n">Udhari days</th><th></th></tr></thead><tbody>'+
          list.map(r=>"<tr><td>"+esc(r.party_key)+'</td><td><span class="dot" style="--c:'+esc(coColor(r.company_id))+'"></span>'+esc(coName(r.company_id))+'</td><td class="n"><b>'+r.credit_days+"</b></td><td>"+(edit?'<button type="button" class="lnk red" data-del="'+esc(r.party_key)+'" data-c="'+r.company_id+'">Remove</button>':"")+"</td></tr>").join("")+"</tbody></table></div>"
          :'<div class="cb-empty">No party has its own udhari yet. Every party gets the company\'s market udhari days above.</div>');
      if(edit){el("uForm").onsubmit=async e=>{e.preventDefault();const d=Number(el("uDays").value);
        if(!Number.isInteger(d)||d<0||d>365)return ERPShell.alert("Udhari days must be 0 to 365.");
        const {error}=await client.rpc("lwb_set_party_company_credit",{p_party:el("uParty").value,p_company_id:el("uCo").value,p_days:d});
        if(error)return ERPShell.alert(errText(error));toast("Saved");renderUdh()};
        el("body").querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{const {error}=await client.rpc("lwb_set_party_company_credit",{p_party:b.dataset.del,p_company_id:b.dataset.c,p_days:null});
          if(error)return ERPShell.alert(errText(error));toast("Removed");renderUdh()})}
      el("note").textContent="Party udhari is used for \"over udhari days\" in Brand summary and the Dashboard: bill date + these days. Market udhari days of a company are changed by Admin in Companies.";
    }

    /* ---------- Companies (Admin) ---------- */
    async function renderCo(){
      const all=B.all||[];
      el("body").innerHTML='<form class="cb-form" id="cForm"><input type="hidden" id="cId"><div class="cb-f"><label for="cName">Company name</label><input id="cName" maxlength="80" required placeholder="e.g. PARLE AGRO"></div>'+
        '<div class="cb-f"><label for="cSup">Company gives us credit (days)</label><input id="cSup" type="number" min="0" max="365" step="1" value="0"></div>'+
        '<div class="cb-f"><label for="cMkt">Market udhari to parties (days)</label><input id="cMkt" type="number" min="0" max="365" step="1" value="0"></div>'+
        '<div class="cb-f"><label for="cUnit">Sells in</label><select id="cUnit"><option value="CASE">Cases</option><option value="BOX">Boxes</option></select></div>'+
        '<div class="cb-f"><label for="cCol">Colour</label><input id="cCol" type="color" value="#2362a4"></div>'+
        '<div class="cb-f"><label for="cAct">Status</label><select id="cAct"><option value="true">Active</option><option value="false">Inactive</option></select></div>'+
        '<div class="cb-f"><button type="submit" class="cb-btn pri" id="cSave">Add company</button> <button type="button" class="lnk" id="cNew" hidden>New</button></div></form>'+
        '<div class="cb-scroll"><table class="cb-t"><thead><tr><th>Company</th><th class="n">Credit from company</th><th class="n">Market udhari</th><th>Sells in</th><th>Status</th><th></th></tr></thead><tbody>'+
        all.map(c=>'<tr><td><span class="dot" style="--c:'+esc(c.color)+'"></span><b>'+esc(c.name)+'</b></td><td class="n">'+c.supplier_credit_days+' days</td><td class="n">'+c.market_credit_days+" days</td><td>"+(c.pack_unit==="BOX"?"Boxes":"Cases")+"</td><td>"+(c.active?'<span class="tag t-grn">Active</span>':'<span class="tag t-gry">Inactive</span>')+'</td><td><button type="button" class="lnk" data-edit="'+c.id+'">Edit</button></td></tr>').join("")+"</tbody></table></div>";
      const reset=()=>{el("cForm").reset();el("cId").value="";el("cSave").textContent="Add company";el("cNew").hidden=true};
      el("cNew").onclick=reset;
      el("body").querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const c=all.find(x=>x.id===b.dataset.edit);
        el("cId").value=c.id;el("cName").value=c.name;el("cSup").value=c.supplier_credit_days;el("cMkt").value=c.market_credit_days;el("cCol").value=c.color;el("cUnit").value=c.pack_unit||"CASE";el("cAct").value=String(c.active);
        el("cSave").textContent="Update "+c.name;el("cNew").hidden=false;el("cName").focus()});
      el("cForm").onsubmit=async e=>{e.preventDefault();
        const p={id:el("cId").value||null,name:el("cName").value,supplier_credit_days:Number(el("cSup").value)||0,market_credit_days:Number(el("cMkt").value)||0,color:el("cCol").value,pack_unit:el("cUnit").value,active:el("cAct").value==="true"};
        el("cSave").disabled=true;const {error}=await client.rpc("lwb_company_save",{p});el("cSave").disabled=false;
        if(error)return ERPShell.alert(errText(error));toast("Company saved");await load()};
      el("note").textContent="Credit from company: days after the purchase bill date by which we must pay the company (Rajnigandha 4). Market udhari: days a party gets to pay us for this company's goods (can be changed per party in Party udhari).";
    }

    el("tabs").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
    el("reload").onclick=load;

    (async()=>{
      const {data:{session}}=await client.auth.getSession();
      if(!session){location.replace("login.html");return}
      const {data:p}=await client.from("user_profiles").select("full_name,role,active").eq("id",session.user.id).single();
      const realRole=String((p&&p.role)||"").toLowerCase().trim();
      role=p?await ERPShell.pageRoleFresh(realRole):realRole;
      if(!p||p.active!==true||!["admin","manager","accounts"].includes(role)){location.replace("dashboard.html");return}
      ERPShell.mount({role:realRole||role,name:p.full_name||session.user.email,onLogout:async()=>{await client.auth.signOut();location.replace("login.html")}});
      el("tabs").querySelectorAll("[data-r]").forEach(b=>{if(!may(b.dataset.r))b.remove()});
      const t=istToday();from=t.slice(0,8)+"01";to=t;month=t.slice(0,7);
      const q=new URLSearchParams(location.search).get("tab");if(q&&el("tabs").querySelector('[data-t="'+q+'"]'))tab=q;
      el("loading").hidden=true;el("page").hidden=false;
      await load();
    })();
  </script>
</body>
</html>
