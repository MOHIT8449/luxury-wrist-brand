# Applies database + Edge Function changes to the live Supabase project
# (txkbhadzdbxpieunfvox) when they are merged to main, so nobody has to paste
# SQL into the Supabase SQL editor by hand any more.
#
# - Root *.sql files added or changed in the push run once, in commit order,
#   with psql (stops on the first error). Files with the line
#   -- lwb:no-auto-run  are skipped (record-only / read-only scripts).
# - Drop table / schema / column and truncate are refused unless the file has
#   -- lwb:allow-destructive  (only after the owner's written OK).
# - Changed supabase/functions/<name>/ folders are deployed.
# - Every applied file is logged in public.lwb_sql_apply_log.
# - Pull requests only get the safety check, nothing touches the database.
# - "Run workflow" (Actions tab) can re-apply one named SQL file by hand, or
#   check the database login with the name  connection-test  (changes nothing).
#
# Secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL        Session pooler connection string with the DB password
#   SUPABASE_ACCESS_TOKEN  personal access token, needed only for Edge Functions
#
# This repo is public, so query output is never printed to the log.
name: Supabase apply

on:
  push:
    branches: [main]
    paths:
      - "*.sql"
      - "supabase/functions/**"
  pull_request:
    paths:
      - "*.sql"
  workflow_dispatch:
    inputs:
      sql_file:
        description: "Root SQL file to apply now (e.g. lwb_party_ledger_setup.sql), or connection-test"
        required: true

concurrency:
  group: supabase-apply
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: txkbhadzdbxpieunfvox

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Safety check changed SQL
        run: |
          files=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- '*.sql' | grep -v / || true)
          [ -z "$files" ] && { echo "No root SQL changes"; exit 0; }
          echo "$files"
          .github/scripts/supabase-sql-check.sh $files

  apply:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out what changed
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          MANUAL_FILE: ${{ inputs.sql_file }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$MANUAL_FILE" = "connection-test" ]; then
              echo "connection-test" > "$RUNNER_TEMP/sql.txt"; : > "$RUNNER_TEMP/functions.txt"
              echo "sql=true" >> "$GITHUB_OUTPUT"; echo "functions=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            case "$MANUAL_FILE" in */*|*..*|"") echo "::error::Give a root .sql file name"; exit 1;; esac
            [ -f "$MANUAL_FILE" ] || { echo "::error::$MANUAL_FILE not found on this branch"; exit 1; }
            printf '%s\n' "$MANUAL_FILE" > "$RUNNER_TEMP/sql.txt"
            : > "$RUNNER_TEMP/functions.txt"
          else
            if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then BEFORE=HEAD~1; fi
            # oldest commit first, each file once, only files that still exist
            git log --reverse --format= --name-only --diff-filter=AM "$BEFORE..HEAD" -- '*.sql' \
              | grep -v / | awk 'NF && !seen[$0]++' | while read -r f; do [ -f "$f" ] && echo "$f"; done > "$RUNNER_TEMP/sql.txt" || true
            git diff --name-only "$BEFORE" HEAD -- supabase/functions \
              | cut -d/ -f3 | awk 'NF && !seen[$0]++' | while read -r fn; do [ -f "supabase/functions/$fn/index.ts" ] && echo "$fn"; done > "$RUNNER_TEMP/functions.txt" || true
          fi
          echo "SQL files:"; cat "$RUNNER_TEMP/sql.txt"
          echo "Functions:"; cat "$RUNNER_TEMP/functions.txt"
          echo "sql=$([ -s "$RUNNER_TEMP/sql.txt" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "functions=$([ -s "$RUNNER_TEMP/functions.txt" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Apply SQL to live database
        if: steps.changes.outputs.sql == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ "$(cat "$RUNNER_TEMP/sql.txt")" = "connection-test" ]; then
            [ -n "$DB_URL" ] || { echo "::error::SUPABASE_DB_URL secret is not set"; exit 1; }
            PGCONNECT_TIMEOUT=20 psql "$DB_URL" -q -v ON_ERROR_STOP=1 -o /dev/null -c "select 1" \
              && echo "Connected to Supabase OK" && echo "- Connection test OK" >> "$GITHUB_STEP_SUMMARY"
            exit
          fi
          mapfile -t files < <(grep -v '^$' "$RUNNER_TEMP/sql.txt")
          run=()
          for f in "${files[@]}"; do
            if grep -qi '^[[:space:]]*--[[:space:]]*lwb:no-auto-run' "$f"; then
              echo "Skipping $f (lwb:no-auto-run)"
            else
              run+=("$f")
            fi
          done
          [ ${#run[@]} -eq 0 ] && { echo "Nothing to apply"; exit 0; }
          .github/scripts/supabase-sql-check.sh "${run[@]}"
          if [ -z "$DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set. Add it, then press 'Re-run jobs' on this run."
            exit 1
          fi
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          export PGCONNECT_TIMEOUT=20
          psql "$DB_URL" -q -v ON_ERROR_STOP=1 -o /dev/null -c "
            create table if not exists public.lwb_sql_apply_log (
              id bigserial primary key,
              file_name text not null,
              git_sha text not null,
              applied_at timestamptz not null default now(),
              run_url text
            );
            alter table public.lwb_sql_apply_log enable row level security;
            revoke all on public.lwb_sql_apply_log from anon, authenticated;"
          for f in "${run[@]}"; do
            echo "::group::Applying $f"
            if ! psql "$DB_URL" -q -v ON_ERROR_STOP=1 -o /dev/null -f "$f" > "$RUNNER_TEMP/psql.log" 2>&1; then
              # errors only, never query results
              grep -E 'ERROR|DETAIL|HINT|LINE|psql:' "$RUNNER_TEMP/psql.log" | head -20
              echo "::error file=$f::Failed. Later files were NOT applied."
              exit 1
            fi
            echo "insert into public.lwb_sql_apply_log(file_name, git_sha, run_url) values (:'file', :'sha', :'url');" \
              | psql "$DB_URL" -q -v ON_ERROR_STOP=1 -o /dev/null \
                  -v file="$f" -v sha="$GITHUB_SHA" -v url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Applied $f"
            echo "::endgroup::"
            echo "- Applied \`$f\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: supabase/setup-cli@v1
        if: steps.changes.outputs.functions == 'true'
        with:
          version: latest

      - name: Deploy Edge Functions
        if: steps.changes.outputs.functions == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set. Add it, then press 'Re-run jobs' on this run."
            exit 1
          fi
          while read -r fn; do
            [ -z "$fn" ] && continue
            echo "Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --use-api
            echo "- Deployed function \`$fn\`" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/functions.txt"
