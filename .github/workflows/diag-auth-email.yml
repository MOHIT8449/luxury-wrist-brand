# Temporary: send one test reset code to the user who last asked for one (address not printed).
name: Diag auth email
on:
  push:
    branches: [diag-forgot-pw]
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      REF: qstgwhbgbznxemajtave
      DB_PASSWORD: ${{ secrets.NEW_SUPABASE_DB_PASSWORD }}
    steps:
      - name: Test send
        run: |
          DB_URL="postgresql://postgres.$REF:$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["DB_PASSWORD"].strip(),safe=""))')@aws-0-ap-south-1.pooler.supabase.com:5432/postgres"
          echo "::add-mask::$DB_URL"
          E=$(psql "$DB_URL" -At -c "select email from auth.users where recovery_sent_at is not null order by recovery_sent_at desc limit 1")
          echo "::add-mask::$E"
          jq -n --arg e "$E" '{email:$e}' > b.json
          curl -s -o r.txt -w 'recover status %{http_code}\n' -X POST "https://$REF.supabase.co/auth/v1/recover" -H "apikey: sb_publishable_YA2Pow327REqgrWPzVCZiA_nw1F32_o" -H "Content-Type: application/json" --data @b.json
          sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g' r.txt | cut -c1-200; echo
