# Temporary: secret NAMES only, and whether the WhatsApp token + template work (no values printed).
name: Diag auth email
on:
  push:
    branches: [diag-forgot-pw]
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - run: |
          curl -s -H "Authorization: Bearer $TOKEN" https://api.supabase.com/v1/projects/qstgwhbgbznxemajtave/secrets | jq -r '.[].name' | sort | tr '\n' ' '; echo
