# Temporary: send one WhatsApp reset code to the admin who last asked for a reset (number not printed).
name: Diag auth email
on:
  push:
    branches: [diag-forgot-pw]
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      REF: qstgwhbgbznxemajtave
      DB_PASSWORD: ${{ secrets.NEW_SUPABASE_DB_PASSWORD }}
    steps:
      - run: |
          DB_URL="postgresql://postgres.$REF:$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["DB_PASSWORD"].strip(),safe=""))')@aws-0-ap-south-1.pooler.supabase.com:5432/postgres"
          echo "::add-mask::$DB_URL"
          M=$(psql "$DB_URL" -At -c "select p.mobile from auth.users u join public.user_profiles p on p.id=u.id where u.recovery_sent_at is not null and p.mobile is not null order by u.recovery_sent_at desc limit 1")
          [ -n "$M" ] && echo "::add-mask::$M"; echo "mobile found: $([ -n "$M" ] && echo yes || echo no)"
          jq -n --arg m "$M" '{action:"send",mobile:$m}' > b.json
          curl -s -w ' [%{http_code}]\n' -X POST https://$REF.supabase.co/functions/v1/lwb-forgot-password-wa -H "apikey: sb_publishable_YA2Pow327REqgrWPzVCZiA_nw1F32_o" -H "Content-Type: application/json" -H "Origin: https://luxurywristbrand.com" --data @b.json | sed -E 's/[0-9]{10}/<mobile>/g'
