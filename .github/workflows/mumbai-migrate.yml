# Copy the live database (Seoul, txkbhadzdbxpieunfvox) to the new Mumbai project (qstgwhbgbznxemajtave).
# Runs only on pushes to the branch claude/mumbai-migrate. The step to run is the first word of
# .github/migrate/step:  test | copy | verify | functions
# The old project is only READ. Everything is written to the new project.
# Only counts, names and errors are printed (public repo): no row data.
name: Mumbai migrate

on:
  push:
    branches: [claude/mumbai-migrate]

concurrency:
  group: mumbai-migrate
  cancel-in-progress: false

env:
  OLD_REF: txkbhadzdbxpieunfvox
  NEW_REF: qstgwhbgbznxemajtave
  OLD_HOST: aws-0-ap-northeast-2.pooler.supabase.com

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Connect
        env:
          OLD_PW: ${{ secrets.SUPABASE_DB_PASSWORD }}
          NEW_PW: ${{ secrets.NEW_SUPABASE_DB_PASSWORD }}
        run: |
          [ -n "$OLD_PW" ] || { echo "::error::SUPABASE_DB_PASSWORD missing"; exit 1; }
          [ -n "$NEW_PW" ] || { echo "::error::NEW_SUPABASE_DB_PASSWORD missing"; exit 1; }
          enc(){ python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1].strip(),safe=""))' "$1"; }
          OLD="postgresql://postgres.$OLD_REF:$(enc "$OLD_PW")@$OLD_HOST:5432/postgres"
          echo "::add-mask::$OLD"
          export PGCONNECT_TIMEOUT=20
          psql "$OLD" -Atqc "select 'old ok', version()" | cut -c1-40
          NEW=""
          for h in aws-0-ap-south-1.pooler.supabase.com aws-1-ap-south-1.pooler.supabase.com; do
            U="postgresql://postgres.$NEW_REF:$(enc "$NEW_PW")@$h:5432/postgres"
            echo "::add-mask::$U"
            if psql "$U" -Atqc "select 1" >/dev/null 2>"$RUNNER_TEMP/e.txt"; then NEW="$U"; echo "new ok via $h"; break; else echo "$h: $(grep -oE 'FATAL.*' "$RUNNER_TEMP/e.txt" | head -1 | cut -c1-120)"; fi
          done
          [ -n "$NEW" ] || { echo "::error::Cannot connect to the new project"; exit 1; }
          psql "$NEW" -Atqc "select 'new', version()" | cut -c1-40
          echo "OLD_URL=$OLD" >> "$GITHUB_ENV"; echo "NEW_URL=$NEW" >> "$GITHUB_ENV"
      - name: Step
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          OLD_KEY: ${{ secrets.OLD_SUPABASE_SECRET_KEY }}
          NEW_KEY: ${{ secrets.NEW_SUPABASE_SECRET_KEY }}
        run: |
          step=$(awk 'NR==1{print $1}' .github/migrate/step)
          echo "Step: $step"
          bash .github/migrate/run.sh "$step"
