<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="erp-fit.js"></script>
  <title>Dial Book | Luxury Wrist Brand ERP</title>
  <script src="erp-date.js"></script><script src="erp-recent.js"></script>
  <script src="vendor/supabase-js-2.119.0.js"></script>
  <link rel="stylesheet" href="erp-shell.css?v=20261127m">
  <link rel="stylesheet" href="sales.css">
  <script src="erp-shell.js?v=20261127m"></script>
  <script src="sales-common.js"></script>
  <script src="vehicle-no.js"></script>
  <script src="dial-book.js"></script>
  <style>
    .db-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
    .db-tab{border:1px solid var(--erp-line);background:#fff;border-radius:16px;padding:5px 11px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--erp-ink)}
    .db-tab b{font-size:11px;background:rgba(0,0,0,.07);border-radius:8px;padding:0 5px;margin-left:3px}
    .db-tab.on{background:var(--erp-red);border-color:var(--erp-red);color:#fff}.db-tab.on b{background:rgba(255,255,255,.22)}
    .db-bar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
    .db-bar input,.db-bar select{height:38px;border:1.5px solid var(--erp-line);border-radius:6px;padding:0 10px;font:inherit;font-size:15px;background:#fff;min-width:0}
    .db-bar input[type=search]{flex:1 1 220px}
    .db-list{background:#fff;border:1px solid var(--erp-line);border-radius:8px}
    .db-row{display:flex;align-items:center;gap:10px;padding:7px 12px;border-top:1px solid var(--erp-line)}
    .db-row:first-child{border-top:0}
    .db-av{width:34px;height:34px;border-radius:50%;background:var(--erp-red-soft);color:var(--erp-red);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
    .db-av.v{background:#fdf3e1;color:#8a5200}.db-av.t{background:#e5f4ec;color:#13824a}
    .db-who{flex:1;min-width:0}.db-who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
    .db-who small{display:block;color:var(--erp-muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .db-bd{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;margin-right:4px;vertical-align:1px;background:#eef1f4;color:#4b5763}
    .db-bd.p{background:var(--erp-red-soft);color:var(--erp-red)}
    button.db-pt{border:1px dashed currentColor;cursor:pointer;font:inherit;font-size:11px!important;font-weight:700;line-height:15px!important;height:auto!important;min-height:0!important;min-width:0!important;padding:0 5px!important;width:auto!important}.db-bd.g{background:#e5f4ec;color:#13824a}.db-bd.a{background:#fdf3e1;color:#8a5200}
    .db-num{color:var(--erp-muted);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
    .db-last{font-size:12px;color:var(--erp-muted);white-space:nowrap;text-align:right;min-width:92px}.db-last b{color:var(--erp-ink)}
    .db-call{background:#13824a;color:#fff;border:0;border-radius:6px;height:36px;padding:0 13px;font:inherit;font-weight:700;white-space:nowrap;cursor:pointer}
    .db-wa{background:#fff;border:1px solid var(--erp-line);border-radius:6px;height:36px;width:38px;font-size:15px;cursor:pointer;flex:none}
    .db-empty{padding:18px;text-align:center;color:var(--erp-muted)}
    .db-more{padding:8px;text-align:center}
    .db-kpis{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
    .db-k{background:#fff;border:1px solid var(--erp-line);border-radius:8px;padding:5px 11px;font-size:12px;color:var(--erp-muted)}.db-k b{display:block;font-size:17px;color:var(--erp-ink)}
    .db-k.bad b{color:var(--erp-danger,#c62828)}
    .db-log{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--erp-line);border-radius:8px;overflow:hidden}
    .db-log th,.db-log td{padding:6px 10px;text-align:left;border-top:1px solid var(--erp-line);font-size:13px;vertical-align:top}
    .db-log th{background:#fafaf8;color:var(--erp-muted);font-size:12px;border-top:0}
    .db-log td small{display:block;color:var(--erp-muted);font-size:11.5px}
    .db-res{display:inline-block;font-size:11.5px;font-weight:700;border-radius:4px;padding:1px 6px;background:#e5f4ec;color:#13824a}
    .db-res.n{background:#fdecec;color:#c62828}.db-res.w{background:#fdf3e1;color:#8a5200}
    .db-note{font-size:12px;color:var(--erp-muted);margin:8px 2px 0}
    @media(max-width:640px){
      .db-num,.db-last,.db-hide{display:none}
      .db-row{padding:7px 10px;gap:8px}
      .db-log th,.db-log td{padding:6px 7px}
    }
  </style>
</head>
<body>
  <div id="loading" class="status">Checking account access...</div>
  <main id="page" class="erp-main" hidden>
    <div class="erp-pagehead"><h1>📞 Dial Book</h1><span class="grow"></span>
      <button type="button" class="sl-btn ghost" id="addVeh" hidden>🚚 + Gaadi driver</button>
      <button type="button" class="sl-btn ghost" id="vcf" hidden title="Admin only: all numbers as a phone contacts file">⬇ Contacts</button>
      <button type="button" class="sl-btn ghost" id="refresh">Refresh</button></div>
    <div class="db-tabs" id="tabs" role="tablist"></div>

    <section id="t_book">
      <div class="db-bar"><input id="q" type="search" placeholder="🔍 Naam, gaadi no., city ya last 4 digit" autocomplete="off"><select id="sm" hidden aria-label="Salesman"></select></div>
      <div class="db-list" id="list">Loading...</div>
    </section>

    <section id="t_log" hidden>
      <div class="db-bar"><input id="lFrom" type="date" aria-label="From"><input id="lTo" type="date" aria-label="To">
        <select id="lBy" aria-label="Caller" hidden></select><select id="lKind" aria-label="Type"><option value="">Sab</option><option value="PARTY">Parties</option><option value="TEAM">Team</option><option value="DRIVER">Drivers</option></select></div>
      <div class="db-kpis" id="lKpis"></div>
      <div id="lBox">Loading...</div>
    </section>
    <p class="db-note" id="note"></p>
  </main>
  <script>
    const S=LWBSales,{client,el,esc,fmt}=S;
    let me=null,B=null,tab="recent",err="",log=[],limit=150;
    const TABS=[["recent","⭐ Recent"],["PARTY","🏪 Parties"],["TEAM","👥 Team"],["DRIVER","🚚 Drivers"],["log","🕘 Call log"]];
    const kindTab=k=>k==="STAFF"?"TEAM":k==="VEHICLE"?"DRIVER":k;
    const RES=Object.fromEntries(LWBDial.RESULTS);
    const resCls=r=>["NO_ANSWER","WRONG"].includes(r)?"n":["BUSY","ON_WAY"].includes(r)?"w":"";
    const today=()=>S.isoDay(new Date());
    const ago=v=>{if(!v)return "";const d=new Date(v),t=today(),day=S.isoDay(d),hm=d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Kolkata"});
      if(day===t)return "Aaj "+hm;const y=S.isoDay(new Date(Date.now()-864e5));if(day===y)return "Kal "+hm;return LWBDate.d(day)};
    const ini=n=>String(n||"?").replace(/[^A-Za-z0-9 ]/g,"").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?";
    const canVeh=()=>["admin","manager","sales","accounts"].includes(me.role);
    const contacts=()=>B?B.contacts:[];
    function drawTabs(){
      const c=k=>contacts().filter(x=>kindTab(x.kind)===k).length;
      el("tabs").innerHTML=TABS.filter(([k])=>k!=="PARTY"||c("PARTY")||["admin","manager","accounts","sales"].includes(me.role)).map(([k,l])=>
        '<button type="button" role="tab" class="db-tab'+(k===tab?" on":"")+'" data-tab="'+k+'">'+esc(l)+(k.length>4&&k!=="recent"?"<b>"+fmt(c(k))+"</b>":"")+"</button>").join("");
      el("t_book").hidden=tab==="log";el("t_log").hidden=tab!=="log";
      el("sm").hidden=!(tab==="PARTY"&&["admin","manager","accounts"].includes(me.role));
    }
    function row(x){
      const v=x.kind==="VEHICLE",party=x.kind==="PARTY";
      const pt=x.tag==="RT"?"RT":"WS",head=["admin","manager"].includes(me.role);
      const tag=party?(head?'<button type="button" class="db-bd p db-pt" data-pt="'+pt+'" title="Wholesale (WS) / Retail (RT): tap to change">'+pt+'</button>':'<span class="db-bd p">'+pt+'</span>'):v?'<span class="db-bd a">Truck driver</span>':x.kind==="DRIVER"?'<span class="db-bd a">Driver</span>':'<span class="db-bd g">'+esc(x.tag||"Team")+"</span>";
      const sub=[x.sub].filter(Boolean).join(" · ");
      const last=x.last_at?'Last call<br><b>'+esc(ago(x.last_at))+"</b>"+(x.last_by?" · "+esc(String(x.last_by).split(/\s+/)[0]):""):"—";
      return '<div class="db-row" data-k="'+esc(x.kind)+'" data-r="'+esc(x.ref)+'"><div class="db-av'+(v||x.kind==="DRIVER"?" v":party?"":" t")+'">'+esc(v?"🚚":ini(x.name))+'</div>'+
        '<div class="db-who"><b>'+esc(x.name)+'</b><small>'+tag+esc(sub)+(x.last_result?' · <span class="db-res '+resCls(x.last_result)+'">'+esc(RES[x.last_result]||x.last_result)+"</span>":"")+'</small></div>'+
        '<div class="db-num">'+esc(x.masked||"")+'</div><div class="db-last">'+last+'</div>'+
        (v&&canVeh()?'<button type="button" class="db-wa" data-loc="'+esc(x.vehicle_no)+'" title="WhatsApp godown location">📍</button>':'<button type="button" class="db-wa" data-wa title="WhatsApp">💬</button>')+
        '<button type="button" class="db-call" data-call>📞 Call</button></div>';
    }
    function drawBook(){
      if(err){el("list").innerHTML='<div class="db-empty">'+esc(err)+"</div>";return}
      const q=el("q").value.trim().toUpperCase(),qd=q.replace(/\D/g,""),qk=LWBVeh.key(q),sm=el("sm").value;
      let L;
      if(tab==="recent"){
        const by=new Map(contacts().map(x=>[x.kind+"|"+x.ref,x]));
        L=(B.recent||[]).map(r=>by.get(r.kind+"|"+r.ref)).filter(Boolean);
        if(!L.length&&!q)L=contacts().filter(x=>x.kind==="VEHICLE").slice(0,10);
      }else L=contacts().filter(x=>kindTab(x.kind)===tab);
      if(q){const src=tab==="recent"?contacts():L;
        L=src.filter(x=>[x.name,x.sub,x.tag].some(v=>String(v||"").toUpperCase().includes(q))||(qd.length>=3&&String(x.last4||"").includes(qd.slice(-4)))||(qk.length>=4&&LWBVeh.key(x.vehicle_no||"").includes(qk)))}
      if(sm&&tab==="PARTY")L=L.filter(x=>String(x.sub||"").includes("Salesman: "+sm));
      if(tab==="DRIVER")L=L.slice().sort((a,b)=>(b.at?Date.parse(b.at):0)-(a.at?Date.parse(a.at):0)||String(a.name).localeCompare(b.name));
      el("list").innerHTML=L.length?L.slice(0,limit).map(row).join("")+(L.length>limit?'<div class="db-more"><button type="button" class="sl-btn ghost" id="more">Aur dikhao ('+fmt(L.length-limit)+")</button></div>":""):
        '<div class="db-empty">'+(tab==="recent"&&!q?"Abhi koi call nahi. Parties / Team / Drivers me se Call dabaiye.":"Koi number nahi mila.")+"</div>";
    }
    async function load(){
      const r=await client.rpc("lwb_dial_book");
      if(r.error){err=/lwb_dial_book|schema cache|does not exist/.test(r.error.message)?"Dial Book is not set up yet (lwb_dial_book_setup.sql).":r.error.message;B={contacts:[],recent:[]}}
      else{err="";B=r.data}
      if(["admin","manager","accounts"].includes(me.role)){
        const sms=[...new Set(contacts().filter(x=>x.kind==="PARTY").map(x=>(String(x.sub||"").match(/Salesman: (.+)$/)||[])[1]).filter(Boolean))].sort();
        const cur=el("sm").value;el("sm").innerHTML='<option value="">Sab salesman</option>'+sms.map(s=>'<option>'+esc(s)+"</option>").join("");el("sm").value=sms.includes(cur)?cur:"";
      }
      el("vcf").hidden=!(B&&B.export);
      drawTabs();drawBook();
    }
    // ---- Call log ----
    async function loadLog(){
      const r=await client.rpc("lwb_dial_log",{p_from:el("lFrom").value||null,p_to:el("lTo").value||null});
      if(r.error){el("lBox").innerHTML='<div class="db-empty">'+esc(r.error.message)+"</div>";log=[];return}
      log=r.data||[];
      if(B&&B.all_log){const ps=[...new Map(log.map(x=>[x.by,x.by_name||"?"])).entries()].sort((a,b)=>String(a[1]).localeCompare(b[1]));
        const cur=el("lBy").value;el("lBy").innerHTML='<option value="">Sab log</option>'+ps.map(([id,n])=>'<option value="'+esc(id)+'">'+esc(n)+"</option>").join("");el("lBy").value=ps.some(p=>p[0]===cur)?cur:"";el("lBy").hidden=false}
      drawLog();
    }
    function drawLog(){
      const by=el("lBy").value,k=el("lKind").value;
      const L=log.filter(x=>(!by||x.by===by)&&(!k||kindTab(x.kind)===k));
      const cnt=f=>L.filter(f).length;
      el("lKpis").innerHTML=[["Calls",L.length,""],["Parties",cnt(x=>x.kind==="PARTY"),""],["Drivers",cnt(x=>kindTab(x.kind)==="DRIVER"),""],["Team",cnt(x=>kindTab(x.kind)==="TEAM"),""],
        ["Bina note",cnt(x=>!x.result&&!x.note),"bad"]].map(([a,b,c])=>'<div class="db-k '+(b&&c||"")+'"><b>'+fmt(b)+"</b>"+a+"</div>").join("");
      const role={admin:"Admin",manager:"Sales Head",sales:"Sales",warehouse:"GM",accounts:"Accounts",cashier:"Cashier",transport:"Transport"};
      el("lBox").innerHTML=L.length?'<table class="db-log"><thead><tr><th>Time</th>'+(B&&B.all_log?"<th>Kisne kiya</th>":"")+'<th>Kisko</th><th class="db-hide">Kahan se</th><th>Note</th></tr></thead><tbody>'+
        L.slice(0,500).map(x=>"<tr><td><b>"+esc(ago(x.at))+"</b></td>"+(B&&B.all_log?"<td>"+esc(x.by_name||"")+"<small>"+esc(role[x.by_role]||x.by_role||"")+"</small></td>":"")+
          "<td><b>"+esc(x.to_name||"")+"</b><small>"+esc(x.masked||"")+'</small></td><td class="db-hide">'+esc(x.source||"")+"</td><td>"+
          (x.result?'<span class="db-res '+resCls(x.result)+'">'+esc(RES[x.result]||x.result)+"</span> ":"")+esc(x.note||"")+(!x.result&&!x.note?'<span style="color:var(--erp-muted)">—</span>':"")+"</td></tr>").join("")+"</tbody></table>":
        '<div class="db-empty">Is din koi call nahi.</div>';
    }
    // ---- Admin: phone contacts file (.vcf) ----
    async function vcf(){
      if(!await confirm("Sab numbers ka contacts file (.vcf) download hoga. Phone me kholte hi sab number save ho jayenge. Yeh sirf Admin kar sakta hai aur iska record rahega."))return;
      const r=await client.rpc("lwb_dial_export");
      if(r.error){ERPShell.toast?.(r.error.message,"error");return}
      const lbl={PARTY:"Party",TEAM:"Team",STAFF:"Staff",DRIVER:"Driver",VEHICLE:"Truck"};
      const v=s=>String(s||"").replace(/[\\,;]/g,m=>"\\"+m).replace(/\n/g," ");
      const txt=(r.data||[]).map(c=>["BEGIN:VCARD","VERSION:3.0","FN:"+v(c.save_as||c.name),"ORG:LWB "+v(lbl[c.kind]),"TEL;TYPE=CELL:+91"+c.mobile,c.sub?"NOTE:"+v(c.sub):"","END:VCARD"].filter(Boolean).join("\r\n")).join("\r\n");
      const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/vcard"}));a.download="lwb-contacts-"+today()+".vcf";document.body.appendChild(a);a.click();a.remove();
      ERPShell.toast?.((r.data||[]).length+" contacts downloaded","success");
    }
    (async()=>{
      me=await S.start(["admin","manager","accounts","sales","warehouse","cashier","transport"]);if(!me)return;
      el("lFrom").value=today();el("lTo").value=today();
      el("addVeh").hidden=!canVeh();
      el("note").textContent="Number aadha chhupa rahega. Call dabate hi record banta hai (kisne, kisko, kab). Website call ki duration ya recording nahi le sakti.";
      document.addEventListener("click",async e=>{
        const t=e.target.closest("[data-tab]");if(t){tab=t.dataset.tab;limit=150;drawTabs();if(tab==="log")loadLog();else drawBook();return}
        if(e.target.id==="more"){limit+=300;drawBook();return}
        const r=e.target.closest(".db-row");if(!r)return;
        const x=contacts().find(c=>c.kind===r.dataset.k&&c.ref===r.dataset.r);if(!x)return;
        const pt=e.target.closest("[data-pt]");
        if(pt){const nt=pt.dataset.pt==="RT"?"WS":"RT";
          if(!await confirm(x.name+"\n\n"+(nt==="RT"?"Retail (RT)":"Wholesale (WS)")+" party banayein? Contacts me naam: … "+nt))return;
          const u=await client.rpc("lwb_set_party_type",{p_customer_ids:[x.ref],p_type:nt});
          if(u.error){ERPShell.toast?.(u.error.message,"error");return}
          x.tag=nt;if(x.save_as)x.save_as=x.save_as.replace(/ (WS|RT)$/," "+nt);drawBook();ERPShell.toast?.("Saved: "+nt,"success");return}
        if(e.target.closest("[data-call]")){await LWBDial.call({client,kind:x.kind,ref:x.ref,source:"Dial Book",name:x.name});return}
        const l=e.target.closest("[data-loc]");if(l){if(await LWBDial.sendLoc({client,vehicle:l.dataset.loc}))load();return}
        if(e.target.closest("[data-wa]")){
          const w=window.open("","_blank");
          const c=await client.rpc("lwb_dial_call",{p_kind:x.kind,p_ref:x.ref,p_source:"Dial Book WhatsApp"});
          if(c.error){w&&w.close();ERPShell.toast?.(c.error.message,"error");return}
          const u="https://wa.me/91"+c.data.mobile;if(w)w.location.href=u;else location.href=u;
        }
      });
      document.addEventListener("lwb-dial-saved",()=>{load();if(tab==="log")loadLog()});
      el("q").addEventListener("input",()=>{limit=150;drawBook()});el("sm").addEventListener("change",drawBook);
      ["lFrom","lTo"].forEach(i=>el(i).addEventListener("change",loadLog));["lBy","lKind"].forEach(i=>el(i).addEventListener("change",drawLog));
      el("refresh").onclick=()=>{load();if(tab==="log")loadLog()};
      el("addVeh").onclick=()=>LWBDial.driverPopup({client,onDone:()=>{tab="DRIVER";load()}});
      el("vcf").onclick=vcf;
      el("loading").hidden=true;el("page").hidden=false;
      const start=location.hash.slice(1);if(TABS.some(t=>t[0]===start))tab=start;
      await load();
      if(tab==="log")loadLog();
      if(/[?&]add=1/.test(location.search)&&canVeh())el("addVeh").click();
    })();
  </script>
</body>
</html>
