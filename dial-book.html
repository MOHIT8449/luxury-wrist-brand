<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="erp-fit.js"></script>

  <script src="erp-date.js"></script><script src="erp-recent.js"></script>

  <style>
    .db-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
    .db-tab{border:1px solid var(--erp-line);background:#fff;border-radius:16px;padding:5px 11px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--erp-ink)}
    .db-tab b{font-size:11px;background:rgba(0,0,0,.07);border-radius:8px;padding:0 5px;margin-left:3px}
    .db-tab.on{background:var(--erp-red);border-color:var(--erp-red);color:#fff}.db-tab.on b{background:rgba(255,255,255,.22)}
    .db-bar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
    .db-bar input,.db-bar select{height:38px;border:1.5px solid var(--erp-line);border-radius:6px;padding:0 10px;font:inherit;font-size:15px;background:#fff;min-width:0}
    .db-bar input[type=search]{flex:1 1 220px}
    .db-list{background:#fff;border:1px solid var(--erp-line);border-radius:8px}
    .db-row{display:flex;align-items:center;gap:10px;padding:7px 12px;border-top:1px solid var(--erp-line)}
    .db-row:first-child{border-top:0}
    .db-av{width:34px;height:34px;border-radius:50%;background:var(--erp-red-soft);color:var(--erp-red);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
    .db-av.v{background:#fdf3e1;color:#8a5200}.db-av.t{background:#e5f4ec;color:#13824a}
    .db-who{flex:1;min-width:0}.db-who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
    .db-who small{display:block;color:var(--erp-muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .db-bd{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;margin-right:4px;vertical-align:1px;background:#eef1f4;color:#4b5763}
    .db-bd.p{background:var(--erp-red-soft);color:var(--erp-red)}
    button.db-pt{border:1px dashed currentColor;cursor:pointer;font:inherit;font-size:11px!important;font-weight:700;line-height:15px!important;height:auto!important;min-height:0!important;min-width:0!important;padding:0 5px!important;width:auto!important}.db-bd.g{background:#e5f4ec;color:#13824a}.db-bd.a{background:#fdf3e1;color:#8a5200}
    .db-num{color:var(--erp-muted);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
    .db-last{font-size:12px;color:var(--erp-muted);white-space:nowrap;text-align:right;min-width:92px}.db-last b{color:var(--erp-ink)}
    .db-call{background:#13824a;color:#fff;border:0;border-radius:6px;height:36px;padding:0 13px;font:inherit;font-weight:700;white-space:nowrap;cursor:pointer}
    .db-wa{background:#fff;border:1px solid var(--erp-line);border-radius:6px;height:36px;width:38px;font-size:15px;cursor:pointer;flex:none}
    .db-empty{padding:18px;text-align:center;color:var(--erp-muted)}
    .db-more{padding:8px;text-align:center}
    .db-kpis{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
    .db-k{background:#fff;border:1px solid var(--erp-line);border-radius:8px;padding:5px 11px;font-size:12px;color:var(--erp-muted)}.db-k b{display:block;font-size:17px;color:var(--erp-ink)}
    .db-k.bad b{color:var(--erp-danger,#c62828)}
    .db-log{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--erp-line);border-radius:8px;overflow:hidden}
    .db-log th,.db-log td{padding:6px 10px;text-align:left;border-top:1px solid var(--erp-line);font-size:13px;vertical-align:top}
    .db-log th{background:#fafaf8;color:var(--erp-muted);font-size:12px;border-top:0}
    .db-log td small{display:block;color:var(--erp-muted);font-size:11.5px}
    .db-res{display:inline-block;font-size:11.5px;font-weight:700;border-radius:4px;padding:1px 6px;background:#e5f4ec;color:#13824a}
    .db-res.n{background:#fdecec;color:#c62828}.db-res.w{background:#fdf3e1;color:#8a5200}
    .db-note{font-size:12px;color:var(--erp-muted);margin:8px 2px 0}
    .db-bd.r{background:#fdecec;color:#c62828}
    .db-plus{display:inline-block;font-size:11px;background:#e6f0f0;color:#00434d;border-radius:8px;padding:0 5px;margin-left:3px}
    .db-dupf{height:38px;border:1px solid #f0c2c2;background:#fff;color:#c62828;border-radius:6px;padding:0 10px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
    .db-dupf.on{background:#c62828;color:#fff}
    .db-back{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:960;display:flex;align-items:flex-start;justify-content:center;padding:8vh 10px}
    .db-sheet{width:min(400px,100%);background:#fff;border-radius:12px;box-shadow:0 24px 60px rgba(15,23,42,.3)}
    .db-sh{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--erp-line)}.db-sh b{flex:1;min-width:0;font-size:15px;overflow-wrap:anywhere}
    .db-x{border:1px solid var(--erp-line);background:#fff;border-radius:6px;width:32px;height:32px;cursor:pointer}
    .db-sb{padding:10px 14px;display:grid;gap:8px}
    .db-pr{display:flex;gap:6px}.db-pr .db-pick{flex:1}
    .db-pick{display:flex;justify-content:space-between;align-items:center;height:46px;border:1.5px solid #13824a;background:#f1faf5;border-radius:8px;padding:0 14px;font:inherit;font-size:15px;cursor:pointer;color:var(--erp-ink)}
    .db-pick b{font-variant-numeric:tabular-nums}.db-pick span{font-weight:600;color:#13824a}
    .db-rm{width:46px;border:1px solid #f0c2c2;background:#fff;color:#c62828;border-radius:8px;cursor:pointer;font-size:15px}
    .db-sb input{height:42px;border:1.5px solid var(--erp-line);border-radius:6px;padding:0 10px;font:inherit;font-size:16px}
    .db-lbls{display:flex;flex-wrap:wrap;gap:6px}.db-lbls button{border:1px solid var(--erp-line);background:#fff;border-radius:15px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
    .db-lbls button.on{background:var(--erp-red);border-color:var(--erp-red);color:#fff}
    .db-sm{font-size:12.5px;color:var(--erp-muted);margin:0}.db-sm.bad{color:#c62828;font-weight:600}.db-sm.warn{background:#fdf3e1;color:#8a5200;padding:7px 9px;border-radius:6px;font-weight:600}
    .db-sf{display:flex;gap:6px}.db-sf .sl-btn{flex:1;height:40px}
    .db-bd.s{background:#eef2ff;color:#3730a3}.db-bd.s.c{background:#fdecef;color:#b42318}.db-bd.s.v{background:#e8f6ee;color:#0d6b36}
    .db-sv{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.db-sv[hidden]{display:none}
    .db-sv button.db-svf{border:1px solid var(--erp-line);background:#fff;color:var(--erp-ink);border-radius:15px;padding:5px 11px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
    .db-sv button.db-svf.on{background:#00434d;border-color:#00434d;color:#fff}.db-sv select{height:32px;border:1px solid var(--erp-line);border-radius:6px;font:inherit;font-size:13px;padding:0 6px;max-width:170px}
    .db-sv .add{margin-left:auto;height:32px}
    .db-g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.db-g3 button{height:38px;border:1px solid var(--erp-line);background:#fff;border-radius:8px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
    .db-g3 button.on{background:#00434d;border-color:#00434d;color:#fff}
    .db-g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.db-g2 label,.db-sb>label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--erp-muted)}
    .db-g2 input{height:40px;border:1.5px solid var(--erp-line);border-radius:6px;padding:0 9px;font:inherit;font-size:15px;min-width:0;text-transform:uppercase}
    .db-sb>label input{text-transform:uppercase}
    .db-sb label input{width:100%;box-sizing:border-box;min-width:0}.db-sb label{min-width:0}.db-sb{min-width:0}
    .db-hb .t{margin-left:2px}
    .db-gm ol{margin:0;padding-left:20px;font-size:13.5px;line-height:1.5}.db-gm code{background:#f1f4f7;padding:1px 5px;border-radius:4px;font-size:12.5px;word-break:break-all}
    .db-gm .st{padding:9px 11px;border-radius:8px;font-size:14px;font-weight:600}.db-gm .st.ok{background:#e4f6e9;color:#0d6b36}.db-gm .st.no{background:#fdf3e1;color:#8a5200}.db-gm .st.bad{background:#fdecef;color:#b42318}
    .db-gm label input{text-transform:none!important}
    @media(max-width:640px){
      .db-num,.db-last,.db-hide{display:none}
      .db-row{padding:7px 10px;gap:8px}
      .db-who small{white-space:normal;overflow:visible}.db-row{gap:6px}.db-wa{width:34px}.db-call{padding:0 10px}.db-call .t{display:none}
      .db-log th,.db-log td{padding:6px 7px}
      .db-hb .t{display:none}.db-hb{min-width:40px;padding:0 10px}
    }
  </style>
</head>
<body>
  <div id="loading" class="status">Checking account access...</div>
  <main id="page" class="erp-main" hidden>
    <div class="erp-pagehead"><h1>📞 Dial Book</h1><span class="grow"></span>
      <button type="button" class="sl-btn ghost db-hb" id="addVeh" hidden title="Gaadi driver">🚚<span class="t"> + Gaadi driver</span></button>
      <button type="button" class="sl-btn ghost db-hb" id="gmail" hidden title="Admin only: numbers save in Gmail by themselves">✉<span class="t"> Gmail sync</span></button>
      <button type="button" class="sl-btn ghost db-hb" id="vcf" hidden title="Admin only: all numbers as a phone contacts file">⬇<span class="t"> Contacts</span></button>
      <button type="button" class="sl-btn ghost db-hb" id="refresh" title="Refresh">↻<span class="t"> Refresh</span></button></div>
    <div class="db-tabs" id="tabs" role="tablist"></div>

    <section id="t_book">
      <div class="db-bar"><input id="q" type="search" placeholder="🔍 Naam, gaadi no., city ya last 4 digit" autocomplete="off"><select id="sm" hidden aria-label="Salesman"></select><button type="button" class="db-dupf" id="dupF" hidden></button></div>
      <div class="db-sv" id="svBar" hidden></div>
      <div class="db-list" id="list">Loading...</div>
    </section>

    <section id="t_log" hidden>
      <div class="db-bar"><input id="lFrom" type="date" aria-label="From"><input id="lTo" type="date" aria-label="To">
        <select id="lBy" aria-label="Caller" hidden></select><select id="lKind" aria-label="Type"><option value="">Sab</option><option value="PARTY">Parties</option><option value="TEAM">Team</option><option value="DRIVER">Drivers</option><option value="SERVICE">Services</option><option value="COMPANY">Company</option></select></div>
      <div class="db-kpis" id="lKpis"></div>
      <div id="lBox">Loading...</div>
    </section>
    <p class="db-note" id="note"></p>
  </main>
  <script>
    const S=LWBSales,{client,el,esc,fmt}=S;
    let me=null,B=null,SV={rows:[]},CO=[],coCo="",coPost="",COMPANIES=[],svGrp="",svCat="",tab="recent",err="",log=[],limit=150,dupOnly=false;
    const TABS=[["recent","⭐ Recent"],["PARTY","🏪 Parties"],["TEAM","👥 Team"],["DRIVER","🚚 Drivers"],["SERVICE","🛠 Services"],["COMPANY","🏢 Company"],["log","🕘 Call log"]];
    // Company people (Mohit, 28 Nov 2026): brand company sales team. Post list = suggestions, any post can be typed.
    const POSTS=["GSM","RSM","ASM","TSM","RTM","SO","SE","ISR","DSM","AE","KAM","JDP","MGR","SALES MANAGER","DISTRIBUTOR MANAGER","LOGISTICS","ACCOUNTS","CUSTOMER CARE"];
    const coShort=f=>/coca/i.test(f||"")?"CC":/rajni/i.test(f||"")?"RG":String(f||"").trim().toUpperCase();
    const coOf=x=>x.kind==="COMPANY"?CO.find(r=>String(r.id)===String(x.ref)):null;
    // Services (Mohit, 27 Nov 2026): Vendor (we buy from / pay), Service (agency), Complaint (when something breaks).
    const GRP=[["VENDOR","Vendor"],["SERVICE","Service"],["COMPLAINT","Complaint"]],GRPN=Object.fromEntries(GRP);
    const CATS={VENDOR:["FORKLIFT","LABOUR CONTRACTOR","PALLET","MACHINE","STATIONERY","PRINTING"],SERVICE:["TRANSPORT","TYRE","MECHANIC","FORKLIFT SERVICE","CCTV","COMPUTER","BATTERY","PUNCTURE"],
      COMPLAINT:["ELECTRICIAN","PLUMBER","WATER","LANDLORD","INTERNET","LIFT","FIRE","CARPENTER"]};
    const svOf=x=>x.kind==="SERVICE"?SV.rows.find(r=>String(r.id)===String(x.ref)):null;
    const kindTab=k=>k==="STAFF"?"TEAM":k==="VEHICLE"?"DRIVER":k;
    const RES=Object.fromEntries(LWBDial.RESULTS);
    const resCls=r=>["NO_ANSWER","WRONG"].includes(r)?"n":["BUSY","ON_WAY"].includes(r)?"w":"";
    const today=()=>S.isoDay(new Date());
    const ago=v=>{if(!v)return "";const d=new Date(v),t=today(),day=S.isoDay(d),hm=d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Kolkata"});
      if(day===t)return "Aaj "+hm;const y=S.isoDay(new Date(Date.now()-864e5));if(day===y)return "Kal "+hm;return LWBDate.d(day)};
    const ini=n=>String(n||"?").replace(/[^A-Za-z0-9 ]/g,"").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?";
    const canVeh=()=>["admin","manager","sales","accounts","warehouse"].includes(me.role);
    const contacts=()=>B?B.contacts:[];
    const isAdm=()=>!!me&&me.role==="admin";
    function drawTabs(){
      const c=k=>contacts().filter(x=>kindTab(x.kind)===k).length;
      // Mohit 28 Nov: Recent + Call log (who called whom, when) only for Admin.
      const T=TABS.filter(([k])=>(k!=="PARTY"||c("PARTY")||["admin","manager","accounts","sales"].includes(me.role))&&(isAdm()||(k!=="recent"&&k!=="log")));
      if(!T.some(([k])=>k===tab))tab=T[0][0];
      el("tabs").innerHTML=T.map(([k,l])=>
        '<button type="button" role="tab" class="db-tab'+(k===tab?" on":"")+'" data-tab="'+k+'">'+esc(l)+(k.length>4&&k!=="recent"?"<b>"+fmt(c(k))+"</b>":"")+"</button>").join("");
      el("t_book").hidden=tab==="log";el("t_log").hidden=tab!=="log";
      el("sm").hidden=!(tab==="PARTY"&&["admin","manager","accounts"].includes(me.role));
      el("svBar").hidden=tab!=="SERVICE"&&tab!=="COMPANY";if(tab==="SERVICE")drawSvBar();if(tab==="COMPANY")drawCoBar();
    }
    function drawSvBar(){
      const rows=SV.rows.filter(r=>!svGrp||r.grp===svGrp),cats=[...new Set(rows.map(r=>r.category))].sort();
      if(svCat&&!cats.includes(svCat))svCat="";
      el("svBar").innerHTML='<button type="button" class="db-svf'+(svGrp?"":" on")+'" data-g="">Sab '+fmt(SV.rows.length)+"</button>"+
        GRP.map(([k,l])=>'<button type="button" class="db-svf'+(svGrp===k?" on":"")+'" data-g="'+k+'">'+l+" "+fmt(SV.rows.filter(r=>r.grp===k).length)+"</button>").join("")+
        (cats.length>1?'<select id="svCat" aria-label="Category"><option value="">Sab category</option>'+cats.map(c=>'<option'+(c===svCat?" selected":"")+">"+esc(c)+"</option>").join("")+"</select>":"")+
        (SV.can_edit?'<button type="button" class="sl-btn add" id="svAdd">+ Number</button>':"");
    }
    function drawCoBar(){
      const cos=[...new Set(CO.map(r=>r.firm))].sort(),posts=[...new Set(CO.filter(r=>!coCo||r.firm===coCo).map(r=>r.category))].sort();
      if(coPost&&!posts.includes(coPost))coPost="";
      el("svBar").innerHTML='<button type="button" class="db-svf'+(coCo?"":" on")+'" data-c="">Sab '+fmt(CO.length)+"</button>"+
        cos.map(c=>'<button type="button" class="db-svf'+(coCo===c?" on":"")+'" data-c="'+esc(c)+'">'+esc(c)+" "+fmt(CO.filter(r=>r.firm===c).length)+"</button>").join("")+
        (posts.length>1?'<select id="coPost" aria-label="Post"><option value="">Sab post</option>'+posts.map(c=>'<option'+(c===coPost?" selected":"")+">"+esc(c)+"</option>").join("")+"</select>":"")+
        (SV.can_edit?'<button type="button" class="sl-btn add" id="coAdd">+ Number</button>':"");
    }
    // Add / edit a company person (saved with the Services numbers, group COMPANY).
    async function coEdit(r){
      r=r||{firm:coCo||""};
      if(!COMPANIES.length){const c=await client.from("lwb_companies").select("name");COMPANIES=(c.data||[]).map(x=>String(x.name||"").toUpperCase()).filter(Boolean)}
      const b=sheet(r.id?"✏️ "+esc(r.name):"🏢 Company ka number",
        '<div class="db-g2"><label>Company *<input id="coF" list="coFs" maxlength="120" value="'+esc(r.firm||"")+'" placeholder="COCA-COLA" autocomplete="off"></label><label>Post *<input id="coC" list="coCs" maxlength="40" value="'+esc(r.category||"")+'" placeholder="GSM, RTM, ASM ..." autocomplete="off"></label></div>'+
        '<datalist id="coFs">'+[...new Set(COMPANIES.concat(CO.map(x=>x.firm)))].sort().map(c=>'<option value="'+esc(c)+'">').join("")+'</datalist>'+
        '<datalist id="coCs">'+[...new Set(POSTS.concat(CO.map(x=>x.category)))].map(c=>'<option value="'+esc(c)+'">').join("")+'</datalist>'+
        '<div class="db-g2"><label>Naam *<input id="coN" maxlength="80" value="'+esc(r.name||"")+'" placeholder="person" autocomplete="off"></label><label>Area<input id="coA" maxlength="60" value="'+esc(r.area||"")+'" placeholder="SURAT" autocomplete="off"></label></div>'+
        '<label>Mobile *<input id="coM" type="tel" inputmode="tel" maxlength="16" placeholder="'+(r.id?"Saved "+esc(r.masked)+" (blank = same)":"10-digit mobile")+'" autocomplete="off" style="text-transform:none"></label>'+
        '<label>Note<input id="coT" maxlength="200" value="'+esc(r.note||"")+'" placeholder="optional (jaise kis area / distributor ka hai)" autocomplete="off" style="text-transform:none"></label>'+
        '<p class="db-sm" id="coName"></p><div id="coMsg" class="db-sm" hidden></div>'+
        '<div class="db-sf">'+(r.id&&SV.can_remove?'<button type="button" class="sl-btn ghost" data-del style="color:#c62828">Remove</button>':'<button type="button" class="sl-btn ghost" data-x>Cancel</button>')+'<button type="button" class="sl-btn" data-save>Save</button></div>');
      const q=s=>b.querySelector(s),msg=q("#coMsg");
      const say=(t,c)=>{msg.hidden=false;msg.className="db-sm "+(c||"");msg.textContent=t};
      const paint=()=>{const nm=[q("#coN").value,coShort(q("#coF").value),q("#coC").value,q("#coA").value].map(v=>String(v).trim()).filter(Boolean).join(" ").toUpperCase().replace(/\s+/g," ");
        q("#coName").innerHTML="Phone / Gmail me naam: <b>"+esc(nm||"RAJESH PATEL CC GSM SURAT")+"</b>"};
      b.addEventListener("input",paint);paint();setTimeout(()=>q(r.firm?"#coC":"#coF").focus(),50);
      b.addEventListener("click",async e=>{
        if(e.target.closest("[data-del]")){if(!await confirm("Remove "+r.name+"?"))return;
          const d=await client.rpc("lwb_dial_service_remove",{p_id:r.id});if(d.error){say(d.error.message,"bad");return}
          b.remove();ERPShell.toast?.("Removed","success");load();return}
        if(!e.target.closest("[data-save]"))return;
        const m=q("#coM").value.replace(/[\s()-]/g,"");
        if(q("#coF").value.trim().length<2){say("Company likhiye (jaise COCA-COLA)","bad");q("#coF").focus();return}
        if(q("#coC").value.trim().length<2){say("Post likhiye (jaise GSM, RTM)","bad");q("#coC").focus();return}
        if(!q("#coN").value.trim()){say("Naam likhiye","bad");q("#coN").focus();return}
        if((m||!r.id)&&!/^(?:\+?91|0)?[6-9]\d{9}$/.test(m)){say("10-digit mobile likhiye","bad");q("#coM").focus();return}
        const x=await client.rpc("lwb_dial_service_save",{p_id:r.id||null,p_grp:"COMPANY",p_category:q("#coC").value,p_name:q("#coN").value,p_firm:q("#coF").value,
          p_area:q("#coA").value,p_mobile:m||null,p_note:q("#coT").value,p_source:"Dial Book"});
        if(x.error){say(String(x.error.message).replace(/^Company: /,""),"bad");return}
        if(!x.data.saved){say("Yeh number pehle se “"+(x.data.owner||"")+"” ke naam pe saved hai. Dobara save nahi kiya.","warn");return}
        b.remove();ERPShell.toast?.("Saved: "+x.data.masked,"success");load();
      });
    }
    // Add / edit a service number. A number already in the ERP is not saved again (only a line says who has it).
    function svEdit(r){
      r=r||{grp:svGrp||"SERVICE"};let grp=r.grp;
      const b=sheet(r.id?"✏️ "+esc(r.name||r.firm):"🛠 New service number",
        '<div class="db-g3">'+GRP.map(([k,l])=>'<button type="button" data-sg="'+k+'" class="'+(k===grp?"on":"")+'">'+l+"</button>").join("")+"</div>"+

          if(x.error){say(x.error.message,"bad");return}b.remove();gmail(["Saved. Ab Connect Gmail dabaiye.","warn"]);return}
        const cn=e.target.closest("[data-gconnect]");
        if(cn){busy(cn,"Google khul raha hai…");const x=await client.functions.invoke(GF,{body:{action:"start"}});
          if(x.error){say(await fnErr(x.error),"bad");cn.disabled=false;cn.textContent="Connect Gmail";return}location.href=x.data.url;return}
        const sy=e.target.closest("[data-gsync]");
        if(sy){busy(sy,"Sync ho raha hai…");const x=await client.functions.invoke(GF,{body:{action:"sync"}});b.remove();
          if(x.error){gmail([await fnErr(x.error),"bad"]);return}gmail(x.data&&x.data.status==="running"?["Sync pehle se chal raha hai. 2 minute baad dekhiye.","warn"]:null);return}
        if(e.target.closest("[data-gdis]")){if(!await confirm("Gmail sync band karein? Gmail me jo contacts hain woh rahenge, bas aage update nahi honge."))return;
          const x=await client.functions.invoke(GF,{body:{action:"disconnect"}});b.remove();if(x.error){gmail([await fnErr(x.error),"bad"]);return}gmail(["Disconnected.","warn"])}
      });
    }
    // Back from the Google page (?code=...&state=...): finish the login, then sync.
    async function gmailBack(){
      const u=new URLSearchParams(location.search),code=u.get("code"),state=u.get("state"),ge=u.get("error");
      if(!code&&!ge)return false;
      history.replaceState(null,"",location.pathname);
      if(ge){gmail(["Google login cancel ho gaya ("+ge+"). Phir se Connect Gmail dabaiye.","bad"]);return true}
      ERPShell.toast?.("Gmail connect ho raha hai, sab number bhej rahe hain…");
      const x=await client.functions.invoke(GF,{body:{action:"callback",code,state}});
      if(x.error){gmail([await fnErr(x.error),"bad"]);return true}
      const r=x.data.result||{};gmail(r.ok?["✓ Gmail connected. "+fmt(r.total)+" contacts Gmail me save ho gaye.","warn"]:["Connected, lekin sync me problem: "+(r.error||""),"bad"]);return true;
    }
    // ---- Admin: phone contacts file (.vcf) ----
    async function vcf(){
      if(!await confirm("Sab numbers ka contacts file (.vcf) download hoga. Phone me kholte hi sab number save ho jayenge. Yeh sirf Admin kar sakta hai aur iska record rahega."))return;
      const r=await client.rpc("lwb_dial_export");
      if(r.error){ERPShell.toast?.(r.error.message,"error");return}
      const lbl={PARTY:"Party",TEAM:"Team",STAFF:"Staff",DRIVER:"Driver",VEHICLE:"Truck",SERVICE:"Service",COMPANY:"Company"};
      const v=s=>String(s||"").replace(/[\\,;]/g,m=>"\\"+m).replace(/\n/g," ");
      const txt=(r.data||[]).map(c=>["BEGIN:VCARD","VERSION:3.0","FN:"+v(c.save_as||c.name),"ORG:LWB "+v(lbl[c.kind]),...(c.numbers&&c.numbers.length?c.numbers:[{mobile:c.mobile,label:"Primary"}]).map(n=>"TEL;TYPE="+(n.label==="Primary"?"CELL":"VOICE")+":+91"+n.mobile),c.sub?"NOTE:"+v(c.sub):"","END:VCARD"].filter(Boolean).join("\r\n")).join("\r\n");
      const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/vcard"}));a.download="lwb-contacts-"+today()+".vcf";document.body.appendChild(a);a.click();a.remove();
      ERPShell.toast?.((r.data||[]).length+" contacts downloaded","success");
    }
    (async()=>{
      me=await S.start(["admin","manager","accounts","sales","warehouse","cashier","transport"]);if(!me)return;
      el("lFrom").value=today();el("lTo").value=today();
      el("addVeh").hidden=!canVeh();
      el("note").textContent="Number aadha chhupa rahega. Call dabate hi record banta hai (kisne, kisko, kab). Website call ki duration ya recording nahi le sakti.";
      document.addEventListener("click",async e=>{
        const t=e.target.closest("[data-tab]");if(t){tab=t.dataset.tab;limit=150;drawTabs();if(tab==="log")loadLog();else drawBook();return}
        if(e.target.id==="more"){limit+=300;drawBook();return}
        if(e.target.id==="dupF"){dupOnly=!dupOnly;drawBook();return}
        const g=e.target.closest("#svBar [data-g]");if(g){svGrp=g.dataset.g;svCat="";drawSvBar();drawBook();return}
        if(e.target.id==="svAdd"){svEdit();return}
        if(e.target.id==="coAdd"){coEdit();return}
        const cb=e.target.closest("#svBar [data-c]");if(cb){coCo=cb.dataset.c;coPost="";drawCoBar();drawBook();return}
        const r=e.target.closest(".db-row");if(!r)return;
        const x=contacts().find(c=>c.kind===r.dataset.k&&c.ref===r.dataset.r);if(!x)return;
        const pt=e.target.closest("[data-pt]");
        if(pt){const nt=pt.dataset.pt==="RT"?"WS":"RT";
          if(!await confirm(x.name+"\n\n"+(nt==="RT"?"Retail (RT)":"Wholesale (WS)")+" party banayein? Contacts me naam: … "+nt))return;
          const u=await client.rpc("lwb_set_party_type",{p_customer_ids:[x.ref],p_type:nt});
          if(u.error){ERPShell.toast?.(u.error.message,"error");return}
          x.tag=nt;if(x.save_as)x.save_as=x.save_as.replace(/ (WS|RT)$/," "+nt);drawBook();ERPShell.toast?.("Saved: "+nt,"success");return}
        if(e.target.closest("[data-addn]")){addNumber(x);return}
        if(e.target.closest("[data-sved]")){if(x.kind==="COMPANY")coEdit(coOf(x));else svEdit(svOf(x));return}
        if(e.target.closest("[data-call]")){if((x.extras||[]).length){pickNumber(x);return}await LWBDial.call({client,kind:x.kind,ref:x.ref,source:"Dial Book",name:x.name});return}
        const l=e.target.closest("[data-loc]");if(l){if(await LWBDial.sendLoc({client,vehicle:l.dataset.loc}))load();return}
        if(e.target.closest("[data-wa]")){
          const w=window.open("","_blank");
          const c=await client.rpc("lwb_dial_call",{p_kind:x.kind,p_ref:x.ref,p_source:"Dial Book WhatsApp"});
          if(c.error){w&&w.close();ERPShell.toast?.(c.error.message,"error");return}
          const u="https://wa.me/91"+c.data.mobile;if(w)w.location.href=u;else location.href=u;
        }
      });
      document.addEventListener("lwb-dial-saved",()=>{load();if(tab==="log")loadLog()});
      el("q").addEventListener("input",()=>{limit=150;drawBook()});
      el("svBar").addEventListener("change",e=>{if(e.target.id==="svCat"){svCat=e.target.value;drawBook()}if(e.target.id==="coPost"){coPost=e.target.value;drawBook()}});el("sm").addEventListener("change",drawBook);
      ["lFrom","lTo"].forEach(i=>el(i).addEventListener("change",loadLog));["lBy","lKind"].forEach(i=>el(i).addEventListener("change",drawLog));
      el("refresh").onclick=()=>{load();if(tab==="log")loadLog()};
      el("addVeh").onclick=()=>LWBDial.driverPopup({client,onDone:()=>{tab="DRIVER";load()}});
      el("vcf").onclick=vcf;el("gmail").onclick=()=>gmail();
      el("loading").hidden=true;el("page").hidden=false;
      const start=location.hash.slice(1);if(TABS.some(t=>t[0]===start))tab=start;
      await load();
      if(tab==="log")loadLog();
      if(me.role==="admin")await gmailBack();
      if(/[?&]add=1/.test(location.search)&&canVeh())el("addVeh").click();
    })();
  </script>
