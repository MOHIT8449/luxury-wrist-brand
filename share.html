<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Documents | Luxury Wrist Brand</title>
  <link rel="icon" href="favicon-32.png">
  <style>
    /* Public page: a party opens the documents sent on WhatsApp (documents.html > Share). No login, no ERP menu. */
    :root{--teal:#002f37;--teal2:#00434d;--ink:#10262b;--mut:#55686c;--line:#e3e6e2;--bg:#f6f5f1}
    *{box-sizing:border-box}
    body{margin:0;font:15px/1.4 "Fira Sans","Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden}
    header{background:var(--teal);color:#fff;text-align:center;padding:12px 10px;font-weight:700;letter-spacing:.06em;font-size:14px}
    header small{display:block;color:#c9b26a;font-size:10.5px;letter-spacing:.1em}
    main{max-width:520px;margin:0 auto;padding:10px}
    .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
    .mut{color:var(--mut);font-size:13px}
    h1{font-size:17px;margin:2px 0}
    .doc{display:flex;gap:10px;align-items:center}
    .doc b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .ic{width:30px;height:30px;border-radius:7px;background:#e6f0f0;display:inline-flex;align-items:center;justify-content:center;flex:none}
    .pv{display:block;width:100%;max-height:420px;object-fit:contain;border:1px solid var(--line);border-radius:8px;margin-top:8px;background:#fbfbf8}
    .btns{display:flex;gap:6px;margin-top:8px}
    .btn{flex:1;height:40px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--teal);font:inherit;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px;text-decoration:none}
    .btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
    .center{text-align:center;padding:40px 14px}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <header>LUXURY WRIST BRAND<small>DOCUMENTS</small></header>
  <main>
    <div id="msg" class="card center mut">Opening documents…</div>
    <div id="top" class="card" hidden><div class="mut">Shared with</div><h1 id="party"></h1><div class="mut" id="meta"></div></div>
    <div id="list"></div>
    <div id="all" class="btns" hidden><button type="button" class="btn pri" id="dlAll">⬇ Download all</button></div>
    <p class="mut" id="foot" style="text-align:center;font-size:12px" hidden>No login needed. This link stops working after the date above.</p>
  </main>
  <script>
  'use strict';
  const FN="https://txkbhadzdbxpieunfvox.supabase.co/functions/v1/lwb-doc-share",KEY="sb_publishable_W4I3Q5ODf0g17sq5uDml2Q_sLolXYEk";
  const el=id=>document.getElementById(id);
  const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const d=s=>{const x=new Date(s);return isNaN(x)?"":x.toLocaleDateString("en-GB",{timeZone:"Asia/Kolkata"})};
  const fileName=f=>String(f.name||"Document").replace(/[\\/:*?"<>|]+/g," ").trim().slice(0,80)+(f.mime==="application/pdf"?".pdf":".jpg");
  let files=[];
  async function save(f){
    try{const r=await fetch(f.url);if(!r.ok)throw 0;const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement("a");
      a.href=u;a.download=fileName(f);document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
    catch(e){window.open(f.url,"_blank","noopener")}
  }
  (async()=>{
    const t=new URLSearchParams(location.search).get("t")||"";
    let r,j;
    try{r=await fetch(FN,{method:"POST",headers:{"content-type":"application/json",apikey:KEY},body:JSON.stringify({token:t})});j=await r.json()}
    catch(e){el("msg").textContent="Could not connect. Check the internet and open the link again.";return}
    if(!r.ok){el("msg").innerHTML="<b>"+esc(j&&j.error||"This link is not valid.")+"</b><br><span class=mut>Please ask Luxury Wrist Brand to send the documents again.</span>";return}
    files=j.files||[];
    el("msg").hidden=true;el("top").hidden=false;el("foot").hidden=false;
    el("party").textContent=j.party_name||"You";
    el("meta").textContent=(j.by_name?"by "+j.by_name+" · ":"")+files.length+" file"+(files.length===1?"":"s")+" · link valid till "+d(j.expires_at);
    el("list").innerHTML=files.map((f,i)=>'<div class="card"><div class="doc"><span class="ic">'+(f.mime==="application/pdf"?"📄":"🖼")+"</span><b>"+esc(f.name)+"</b></div>"+
      (f.mime==="application/pdf"?"":'<img class="pv" alt="" loading="lazy" src="'+esc(f.url)+'">')+
      '<div class="btns"><a class="btn" href="'+esc(f.url)+'" target="_blank" rel="noopener">👁 Open</a><button type="button" class="btn" data-dl="'+i+'">⬇ Download</button></div></div>').join("")||'<div class="card center mut">No files in this link any more.</div>';
    el("all").hidden=files.length<2;
  })();
  document.addEventListener("click",async e=>{
    const b=e.target.closest("button");if(!b)return;
    if(b.dataset.dl)save(files[+b.dataset.dl]);
    if(b.id==="dlAll"){b.disabled=true;for(const f of files){await save(f);await new Promise(r=>setTimeout(r,600))}b.disabled=false}
  });
  </script>
</body>
</html>
