<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No internet | LWB ERP</title>
<meta name="theme-color" content="#c8102e">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f5f7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#222}
  .box{background:#fff;border-radius:14px;padding:28px 24px;max-width:340px;margin:16px;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.08)}
  img{width:72px;height:72px;border-radius:16px}
  h1{font-size:20px;margin:14px 0 6px}
  p{font-size:14px;color:#555;line-height:1.5;margin:0 0 18px}
  button{background:#c8102e;color:#fff;border:0;border-radius:8px;padding:11px 22px;font-size:15px;font-weight:600}
</style>
</head>
<body>
<div class="box">
  <img src="app-icon-192.png" alt="">
  <h1>No internet</h1>
  <p>The ERP needs internet. Turn on mobile data or Wi-Fi, then try again.</p>
  <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
