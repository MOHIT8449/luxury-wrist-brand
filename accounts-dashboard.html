<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accounts Dashboard | Luxury Wrist Brand ERP</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="erp-date.js"></script>
  <link rel="stylesheet" href="erp-shell.css">
  <script src="erp-shell.js"></script>
  <script src="excel-io.js"></script>
  <script src="party-pay.js"></script>
  <style>
    .status{text-align:center;padding:80px 20px;font-size:15px;color:#555}
    [hidden]{display:none!important}
    .acx-msg{padding:11px 14px;border-radius:8px;margin:0 0 12px;background:#fdf0dc;color:#7a4700;white-space:pre-wrap;font-size:14px}
    .acx-msg.bad{background:#ffebeb;color:#9b2020}
    .acx-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}
    .acx-top h1{margin:0;font-size:20px;flex:1 1 auto}
    .acx-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
    .acx-chips button{height:34px;border-radius:99px;border:1.5px solid var(--erp-line);background:#fff;color:var(--erp-ink);padding:0 13px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
    .acx-chips button[aria-pressed=true]{border-color:#1769d8;background:#eaf2ff;color:#123f7a;font-weight:700}
    .acx-chips input{height:34px;border:1.5px solid var(--erp-line);border-radius:8px;padding:0 8px;font:inherit;font-size:14px;background:#fff;max-width:150px}
    .acx-btn{height:38px;border-radius:8px;padding:0 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;border:1px solid var(--erp-line);background:#fff;color:var(--erp-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
    .acx-btn.pri{background:#1769d8;border-color:#1769d8;color:#fff}
    .acx-btn.grn{background:#13824a;border-color:#13824a;color:#fff}
    .acx-btn.red{background:#fff;border-color:#e7b3bd;color:#b3122b}
    .acx-btn.redf{background:#c8102e;border-color:#c8102e;color:#fff}
    .acx-btn:disabled{opacity:.55;cursor:default}
    .acx-banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:10px;margin:0 0 12px;border:1px solid;font-size:14px}
    .acx-banner b{font-size:15px}
    .acx-banner .grow{flex:1 1 220px;min-width:0}
    .acx-banner.blue{background:#eef5ff;border-color:#c7dbfa;color:#123f7a}
    .acx-banner.amb{background:#fff7e8;border-color:#f3d79c;color:#6d4300}
    .acx-banner.grn{background:#ecf8f1;border-color:#bfe5cf;color:#0f5f37}
    .acx-banner input{height:38px;border:1.5px solid #c9d4e2;border-radius:8px;padding:0 10px;font:inherit;font-size:16px;width:150px}

    .acx-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:0 0 10px}
    .acx-kpi{background:#fff;border:1px solid var(--erp-line);border-radius:10px;padding:12px 14px;min-width:0}
    .acx-kpi h3{margin:0 0 3px;font-size:13px;color:#4b5763;font-weight:600;display:flex;align-items:center;gap:6px}
    .acx-kpi .v{font-size:23px;font-weight:800;line-height:1.2;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
    .acx-kpi small{display:block;color:var(--erp-muted);font-size:12.5px;margin-top:3px;line-height:1.35}
    .acx-kpi .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:0 0 auto}
    .acx-kpi.hand{background:#13283f;border-color:#13283f;color:#fff}
    .acx-kpi.hand h3,.acx-kpi.hand small{color:#c8d6e6}
    .acx-kpi.hand .v{font-size:27px}
    .acx-sec{display:flex;gap:4px 10px;flex-wrap:wrap;align-items:baseline;margin:2px 2px 6px}
    .acx-sec b{font-size:14.5px}.acx-sec span{font-size:12.5px;color:var(--erp-muted)}
    .acx-coll{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(2,minmax(0,1fr));gap:10px;margin:0 0 12px}
    .acx-coll>div{background:#fff;border:1px solid var(--erp-line);border-radius:10px;padding:10px 14px;min-width:0;cursor:default}
    .acx-coll>div[data-tab]{cursor:pointer}.acx-coll>div[data-tab]:hover{border-color:#9fb3c8}
    .acx-coll h4{margin:0 0 2px;font-size:13px;color:#4b5763;font-weight:600}
    .acx-coll .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
    .acx-coll small{display:block;color:var(--erp-muted);font-size:12.5px;margin-top:2px;line-height:1.4}
    .acx-coll .modes{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:#3b4652;margin-top:4px}.acx-coll .modes b{color:var(--erp-ink)}
    @media (max-width:760px){.acx-coll{grid-template-columns:1fr 1fr}.acx-coll>div:first-child{grid-column:1/-1}}
    .chq{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
    .chq>div{border:1px solid var(--erp-line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
    .chq>div.late{border-color:#e7a33e;background:#fffaf0}
    .chq .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.chq .top b{font-size:15px;overflow-wrap:anywhere}
    .chq .top small,.chq .det{display:block;color:var(--erp-muted);font-size:12.5px}
    .chq .amt{font-weight:800;font-size:17px;white-space:nowrap;text-align:right}
    .chq .ac{display:flex;gap:6px;flex-wrap:wrap}.chq .ac .acx-btn{height:34px;padding:0 10px;font-size:13.5px}
    .chq .phs span{width:48px;height:48px}
    .acx-actions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:0 0 14px}
    .acx-actions button{height:52px;border-radius:10px;border:0;font:inherit;font-size:15px;font-weight:800;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;gap:7px}
    .acx-actions .in{background:#13824a}.acx-actions .ppay{background:#0b6b3a}.acx-actions .out{background:#c8102e}.acx-actions .dep{background:#1d5fbf}.acx-actions .close{background:#13283f}
    .acx-actions span{font-size:20px;line-height:1}

    .acx-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:0 0 12px}
    .acx-card{background:#fff;border:1px solid var(--erp-line);border-radius:10px;padding:12px 14px;min-width:0}
    .acx-card h2{margin:0 0 8px;font-size:15.5px;display:flex;align-items:center;gap:8px}
    .acx-card h2 small{margin-left:auto;font-weight:400;color:var(--erp-muted);font-size:12.5px}
    .acx-t{border-collapse:collapse;width:100%;font-size:14px}
    .acx-t th,.acx-t td{padding:7px 6px;border-bottom:1px solid var(--erp-line);text-align:left;vertical-align:top}
    .acx-t th{font-size:12.5px;color:#4b5763;font-weight:700;background:#f6f7f9;white-space:nowrap}
    .acx-t .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
    .acx-t tfoot td{font-weight:800;background:#f6f7f9}
    .acx-ledger td{font-size:13.5px}.acx-ledger tbody tr:hover td{background:#f8fafc}
    .acx-t td small{display:block;color:var(--erp-muted);font-size:12px}
    .acx-bars{display:flex;flex-direction:column;gap:7px}
    .acx-bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;font-size:13.5px}
    .acx-bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .acx-bar .track{height:12px;background:#f1f3f6;border-radius:0 4px 4px 0;overflow:hidden}
    .acx-bar .fill{height:100%;background:#c8102e;border-radius:0 4px 4px 0;min-width:2px}
    .acx-bar .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
    .acx-empty{color:var(--erp-muted);font-size:14px;padding:10px 2px}

    .acx-tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px}
    .acx-tabs button{height:36px;border-radius:8px;border:1.5px solid var(--erp-line);background:#fff;font:inherit;font-size:14px;padding:0 12px;cursor:pointer;white-space:nowrap;color:var(--erp-ink)}
    .acx-tabs button[aria-pressed=true]{background:#13283f;border-color:#13283f;color:#fff;font-weight:700}
    .acx-tabs .cnt{display:inline-block;min-width:20px;padding:0 6px;margin-left:5px;border-radius:99px;background:#c8102e;color:#fff;font-size:12px;font-weight:700;line-height:18px}
    .acx-filter{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 8px}
    .acx-filter input[type=search]{flex:1 1 180px;height:36px;border:1.5px solid var(--erp-line);border-radius:8px;padding:0 10px;font:inherit;font-size:15px}
    .acx-rows{display:flex;flex-direction:column}
    .acx-row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--erp-line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;font:inherit;color:inherit;width:100%}
    .acx-row:hover{background:#f8fafc}
    .acx-ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
    .ic-in{background:#e3f5ec;color:#13824a}.ic-out{background:#fdecef;color:#b3122b}.ic-dep{background:#e6efff;color:#1d5fbf}
    .acx-row .t{min-width:0}
    .acx-row .t b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .acx-row .t small{display:block;color:var(--erp-muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .acx-row .a{text-align:right;font-weight:800;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
    .acx-row .a small{display:block;font-weight:600;font-size:11.5px;margin-top:2px}
    .plus{color:#13824a}.minus{color:#b3122b}.neutral{color:#1d5fbf}
    .acx-due{margin:8px 0 0;border:1.5px solid #b9e2c9;background:#f3fbf6;border-radius:10px;padding:10px 12px;display:grid;gap:6px;font-size:13px}
    .acx-due .h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px}
    .acx-due .r{display:flex;justify-content:space-between;gap:8px;border-top:1px dashed #cfe9d9;padding-top:5px}
    .acx-due .r small{display:block;color:var(--erp-muted)}
    .tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
    .t-red{background:#fdecef;color:#b3122b}.t-amb{background:#fdf0dc;color:#9a5b00}.t-grn{background:#e3f5ec;color:#13824a}.t-blu{background:#e6efff;color:#1d5fbf}.t-gry{background:#eef0f3;color:#3b4652}
    .acx-ver{border:1px solid var(--erp-line);border-radius:10px;padding:10px 12px;margin:0 0 8px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
    .acx-ver .amt{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
    .acx-ver .meta{font-size:13px;color:#3b4652;grid-column:1/-1}
    .acx-ver .act{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .acx-ver select{height:38px;border:1.5px solid var(--erp-line);border-radius:8px;padding:0 8px;font:inherit;font-size:14px;flex:1 1 160px;min-width:0;background:#fff}
    .acx-note{font-size:12.5px;color:var(--erp-muted);margin:8px 2px 0;line-height:1.5}

    /* sheet / popup */
    .acx-back{position:fixed;inset:0;background:rgba(15,23,35,.5);z-index:4000;display:flex;align-items:center;justify-content:center;padding:12px}
    .acx-sheet{background:#fff;border-radius:14px;width:min(560px,100%);max-height:calc(100dvh - 24px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25)}
    .acx-sheet header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--erp-line)}
    .acx-sheet header h3{margin:0;font-size:17px;flex:1}
    .acx-sheet header button{border:0;background:#f1f3f6;border-radius:8px;width:36px;height:36px;font-size:18px;cursor:pointer}
    .acx-sheet .body{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
    .acx-sheet footer{padding:12px 16px;border-top:1px solid var(--erp-line);display:flex;gap:8px;justify-content:flex-end}
    .acx-sheet footer .acx-btn{height:44px;min-width:110px}
    .f label{display:block;font-size:13px;font-weight:700;color:#3b4652;margin:0 0 5px}
    .f input,.f select,.f textarea{width:100%;box-sizing:border-box;height:42px;border:1.5px solid #d5dce5;border-radius:8px;padding:0 10px;font:inherit;font-size:16px;background:#fff}
    .f textarea{height:auto;padding:8px 10px;min-height:56px}
    .f .big{height:52px;font-size:24px;font-weight:800}
    .acx-sl td:first-child{white-space:nowrap}.acx-sl td.n{white-space:nowrap}
    .seg.two{grid-template-columns:1fr 1fr;background:#f1f4f8;padding:4px;border-radius:11px;gap:4px}.seg.two button{border-color:transparent;background:transparent;font-size:15px}
    .acx-link{border:0;background:none;color:#1769d8;font:inherit;font-size:14px;font-weight:700;padding:8px 0 0;cursor:pointer}
    .acx-combo{position:relative}
    .acx-clist{position:absolute;left:0;right:0;top:70px;z-index:5;background:#fff;border:1.5px solid #d5dce5;border-radius:10px;box-shadow:0 10px 30px rgba(15,30,50,.16);max-height:260px;overflow:auto}
    .acx-clist button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--erp-line);background:#fff;padding:9px 12px;font:inherit;cursor:pointer}
    .acx-clist button.on,.acx-clist button:hover{background:#eef4ff}
    .acx-clist button b{display:block;font-size:14.5px;overflow-wrap:anywhere}.acx-clist button small{color:var(--erp-muted);font-size:12px}
    .acx-cnone{padding:10px 12px;color:var(--erp-muted);font-size:13.5px}
    .acx-more{border:1.5px dashed #d5dce5;border-radius:10px;padding:10px 12px}
    .acx-more summary{cursor:pointer;font-weight:700;font-size:14px;color:#3b4652}.acx-more[open] summary{margin-bottom:10px}.acx-more summary small{font-weight:400;color:var(--erp-muted)}
    .acx-more .f+.f{margin-top:12px}
    .f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.f2>.f{min-width:0}
    .pills{display:flex;flex-wrap:wrap;gap:6px}
    .pills button{min-height:38px;border-radius:99px;border:1.5px solid #d5dce5;background:#fff;font:inherit;font-size:14px;padding:0 13px;cursor:pointer;color:var(--erp-ink)}
    .pills button[aria-pressed=true]{background:#13283f;border-color:#13283f;color:#fff;font-weight:700}
    .pills .add{border-style:dashed;color:#1769d8}
    .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .seg button{min-height:44px;border-radius:9px;border:1.5px solid #d5dce5;background:#fff;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--erp-ink);padding:2px 4px}
    .seg button[aria-pressed=true].in{background:#13824a;border-color:#13824a;color:#fff}
    .seg button[aria-pressed=true].out{background:#c8102e;border-color:#c8102e;color:#fff}
    .seg button[aria-pressed=true].dep{background:#1d5fbf;border-color:#1d5fbf;color:#fff}
    .notes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .note{display:grid;grid-template-columns:62px 36px 1fr 36px;align-items:center;border:1px solid var(--erp-line);border-radius:9px;padding:5px;gap:4px}
    .note b{font-size:15px;text-align:center}
    .note button{height:36px;border-radius:7px;border:1px solid #d5dce5;background:#f6f7f9;font-size:18px;cursor:pointer}
    .note input{height:36px;border:1px solid #d5dce5;border-radius:7px;text-align:center;font:inherit;font-size:16px;width:100%;box-sizing:border-box;min-width:0}
    .calc{background:#f6f7f9;border-radius:10px;padding:10px 12px;font-size:14px}
    .calc div{display:flex;justify-content:space-between;padding:3px 0}
    .calc .tot{border-top:1px solid #d5dce5;margin-top:4px;padding-top:7px;font-weight:800;font-size:16px}
    .diff{border-radius:9px;padding:9px 12px;font-weight:700;font-size:15px}
    .diff.ok{background:#e3f5ec;color:#13824a}.diff.bad{background:#fdecef;color:#b3122b}
    .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
    .kv span{color:var(--erp-muted)}
    .mlist{display:flex;flex-direction:column;gap:6px}
    .mlist div{display:flex;align-items:center;gap:8px;border:1px solid var(--erp-line);border-radius:8px;padding:6px 10px;font-size:14px}
    .mlist div span{flex:1}
    .dbox{position:relative;display:inline-flex;align-items:center;gap:4px}
    .dbox .dtxt{height:34px;width:116px;border:1.5px solid var(--erp-line);border-radius:8px;padding:0 6px;font:inherit;font-size:15px;background:#fff;font-variant-numeric:tabular-nums}
    .dbox .dcal{height:34px;width:36px;border:1.5px solid var(--erp-line);border-radius:8px;background:#fff;cursor:pointer;font-size:15px;padding:0}
    .dbox .dpick{position:absolute!important;right:0;bottom:0;width:1px!important;height:1px!important;opacity:0;pointer-events:none;border:0!important;padding:0!important}
    .f .dbox{display:flex}.f .dbox .dtxt{flex:1;width:auto;min-width:0;height:42px;font-size:16px;border-color:#d5dce5}.f .dbox .dcal{height:42px;width:44px;border-color:#d5dce5}
    .phs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .phs span{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--erp-line);background:#f6f7f9}
    .phs img{width:100%;height:100%;object-fit:cover;cursor:pointer}
    .phs button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;cursor:pointer;padding:0}
    .chk{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:700;color:#3b4652}
    .chk input{width:20px;height:20px}
    .stf-head{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
    .stf-head b{font-size:15px;margin-right:auto}
    .stf{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
    .stf>div{border:1px solid var(--erp-line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
    .stf .nm{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
    .stf .nm b{font-size:15.5px}.stf .nm small{display:block;color:var(--erp-muted);font-size:12.5px}
    .stf .bal{text-align:right;font-weight:800;font-size:16px;white-space:nowrap}
    .stf .bal small{display:block;font-size:11.5px;font-weight:600}
    .stf .mo{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:12.5px;color:#4b5763;background:#f6f7f9;border-radius:8px;padding:6px 8px}
    .stf .mo b{display:block;color:var(--erp-ink);font-size:14px}
    .vh{display:grid;grid-template-columns:minmax(0,auto) 1fr auto;gap:5px 8px;align-items:center;font-size:13px;background:#f6f7f9;border-radius:8px;padding:7px 9px}
    .vh span{color:#3b4652;overflow-wrap:anywhere}.vh b{text-align:right;font-variant-numeric:tabular-nums}
    .vh i{display:block;height:8px;border-radius:4px;background:#e3e8ee;position:relative;overflow:hidden}
    .vh i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:#c8102e;border-radius:4px}
    .stf .ac{display:flex;gap:6px;flex-wrap:wrap}.stf .ac .acx-btn{height:34px;padding:0 10px;font-size:13.5px}
    .salrow{display:grid;grid-template-columns:1fr 120px;gap:6px 8px;align-items:center;border-bottom:1px solid var(--erp-line);padding:6px 0}
    .salrow small{color:var(--erp-muted)}.salrow input{height:38px;border:1.5px solid #d5dce5;border-radius:8px;padding:0 8px;font:inherit;font-size:16px;width:100%;box-sizing:border-box}
    .salrow .nt{grid-column:1/-1}
    @media(max-width:1100px){.acx-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.acx-grid{grid-template-columns:1fr 1fr}}
    @media(max-width:700px){
      .acx-kpis{grid-template-columns:1fr 1fr;gap:8px}
      .acx-kpi{padding:10px 12px}.acx-kpi .v{font-size:19px}
      .acx-kpi.hand{grid-column:1/-1}.acx-kpi.hand .v{font-size:26px}
      .acx-grid{grid-template-columns:1fr}
      .acx-actions{grid-template-columns:1fr 1fr}.acx-actions .ppay{grid-column:1 / -1}
      .acx-back{align-items:flex-end;padding:0}
      .acx-sheet{border-radius:16px 16px 0 0;max-height:94dvh;width:100%}
      .notes{grid-template-columns:1fr}
      .acx-top h1{font-size:18px;flex-basis:100%}
    }
  </style>
</head>
<body>
  <div id="loading" class="status">Checking account access...</div>
  <main id="page" class="erp-main" hidden>
    <div class="acx-top">
      <h1>Accounts Dashboard</h1>
      <div class="acx-chips" id="period">
        <button type="button" data-p="today">Today</button><button type="button" data-p="yday">Yesterday</button><button type="button" data-p="7">7 days</button><button type="button" data-p="month">This month</button>
        <span id="pDates" style="display:contents"></span>
        <button type="button" id="reload" title="Refresh">↻</button>
      </div>
    </div>
    <div id="msg" class="acx-msg" hidden></div>
    <div id="banners"></div>

    <div class="acx-sec"><b>💵 Cash only (रोकड़)</b><span>Opening + Cash In − Cash Out − Bank deposit = Cash in hand. UPI / Bank / Cheque are not here.</span></div>
    <div class="acx-kpis" id="kpis"></div>
    <div class="acx-coll" id="strip"></div>
    <div class="acx-actions">
      <button type="button" class="ppay" id="ppayBtn"><span>💰</span>Party payment</button>
      <button type="button" class="in" data-new="IN"><span>+</span>Cash In</button>
      <button type="button" class="out" data-new="OUT"><span>−</span>Cash Out</button>
      <button type="button" class="dep" data-new="DEPOSIT"><span>🏦</span>Bank Deposit</button>
      <button type="button" class="close" id="closeBtn"><span>🌙</span>Close Day</button>
    </div>

    <div class="acx-grid">
      <section class="acx-card"><h2>Mode wise <small id="modeNote"></small></h2><div id="modes"></div></section>
      <section class="acx-card"><h2>Expenses by head <small id="expNote"></small></h2><div id="exp"></div></section>
      <section class="acx-card"><h2>Bank wise <small>verified only</small></h2><div id="banks"></div></section>
    </div>

    <section class="acx-card">
      <div class="acx-tabs" id="tabs">
        <button type="button" data-t="book">Day book</button>
        <button type="button" data-t="cheques">Cheques<span class="cnt" id="cCnt" hidden></span></button>
        <button type="button" data-t="verify">Bank check<span class="cnt" id="vCnt" hidden></span></button>
        <button type="button" data-t="out">Party outstanding</button>
        <button type="button" data-t="close">Cash handover</button>
        <button type="button" data-t="staff">Staff ledger</button>
        <button type="button" data-t="veh">Vehicles</button>
        <button type="button" data-t="setup">Heads &amp; Banks</button>
      </div>
      <div id="tabBody"></div>
    </section>
  </main>
  <script>
    'use strict';
    const client=supabase.createClient("https://txkbhadzdbxpieunfvox.supabase.co","sb_publishable_W4I3Q5ODf0g17sq5uDml2Q_sLolXYEk");
    const el=id=>document.getElementById(id);
    const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const r2=n=>Math.round((Number(n)||0)*100)/100;
    const rs=v=>(r2(v)<0?"−":"")+"₹"+Math.abs(r2(v)).toLocaleString("en-IN",{maximumFractionDigits:2});
    const istDay=t=>t?new Date(new Date(t).getTime()+330*60e3).toISOString().slice(0,10):"";
    const todayISO=()=>istDay(Date.now());
    const shift=(d,n)=>{const x=new Date(d+"T12:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
    const dmy=d=>d?String(d).slice(8,10)+"/"+String(d).slice(5,7)+"/"+String(d).slice(0,4):"";
    // Date box: shows and takes DD/MM/YYYY; 📅 opens the phone / browser calendar (value stays YYYY-MM-DD in data-iso).
    function dateBox(id,iso,o){o=o||{};return '<span class="dbox" id="'+id+'" data-iso="'+(iso||"")+'"><input type="text" class="dtxt keep-iso" inputmode="numeric" maxlength="10" placeholder="DD/MM/YYYY" autocomplete="off" value="'+dmy(iso)+'"'+(o.disabled?" disabled":"")+' aria-label="'+esc(o.label||"Date")+'"><button type="button" class="dcal" aria-label="Open calendar"'+(o.disabled?" disabled":"")+'>📅</button><input type="date" class="dpick keep-iso" tabindex="-1" aria-hidden="true" value="'+(iso||"")+'"'+(o.max?' max="'+o.max+'"':"")+'></span>'}
    // what is typed counts even before the box loses focus; a wrong date gives ""
    const dval=id=>{const b=document.getElementById(id);return b?parseDmy(b.querySelector(".dtxt").value):""};
    function dset(b,iso,fire){if(!b)return;b.dataset.iso=iso||"";b.querySelector(".dtxt").value=dmy(iso);b.querySelector(".dpick").value=iso||"";if(fire)b.dispatchEvent(new Event("change",{bubbles:true}))}
    function parseDmy(t){const m=String(t||"").trim().match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})$/);if(!m)return "";
      const y=m[3].length===2?"20"+m[3]:m[3],d=y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0"),x=new Date(d+"T12:00:00Z");
      return isNaN(x)||x.toISOString().slice(0,10)!==d?"":d}
    document.addEventListener("click",e=>{const c=e.target.closest(".dcal");if(!c)return;const p=c.parentElement.querySelector(".dpick");try{p.showPicker()}catch(_){p.focus();p.click()}});
    document.addEventListener("change",e=>{const t=e.target;if(!t.classList)return;
      if(t.classList.contains("dpick"))dset(t.parentElement,t.value,true);
      else if(t.classList.contains("dtxt")){const b=t.parentElement,iso=parseDmy(t.value);if(iso)dset(b,iso,true);else t.value=dmy(b.dataset.iso)}});
    document.addEventListener("input",e=>{const t=e.target;if(!t.classList||!t.classList.contains("dtxt")||(e.inputType||"").startsWith("delete"))return;
      let v=t.value.replace(/\D/g,"").slice(0,8);t.value=v.length>4?v.slice(0,2)+"/"+v.slice(2,4)+"/"+v.slice(4):v.length>2?v.slice(0,2)+"/"+v.slice(2):v});
    const lt=l=>l.x&&l.x.time?hm("2000-01-01T"+l.x.time+":00+05:30"):hm(l.at);
    const hm=t=>t?new Date(t).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:true,timeZone:"Asia/Kolkata"}):"";
    const MODES=["CASH","UPI","BANK","RTGS","CHEQUE"];
    const MODE_NAME={CASH:"Cash",UPI:"UPI",BANK:"Bank / NEFT",RTGS:"RTGS",CHEQUE:"Cheque"};
    const SRC_NAME={ENTRY:"Entered here",PAYMENT:"Party payment (Billing & Outstanding)",DRIVER_CASH:"Driver money",DRIVER_ONLINE:"Driver money",OLD:"Old payment entry"};
    const NOTE_KEYS=["500","200","100","50","20","10"];
    let X={entries:{},staff_heads:[],payees:[]},S=[],V=[],VR={vehicles:[],entries:{}},C=[],piErr=false,D=null,PI=null,per="today",from=todayISO(),to=todayISO(),tab="book",bookF="all",outRows=null,me={id:"",role:""};

    function say(t,bad){el("msg").hidden=!t;el("msg").textContent=t||"";el("msg").className="acx-msg"+(bad?" bad":"")}
    const errText=e=>{const m=String(e&&e.message||e||"Something went wrong");
      if(/function .*lwb_acc|schema cache|does not exist/i.test(m))return "Accounts Dashboard database is not set up yet. It sets itself up when this change is merged (lwb_accounts_dashboard_setup.sql).";
      return m.replace(/^.*?ERROR:\s*/,"")};

    /* ---------- dates ---------- */
    function setPeriod(p){
      per=p;const t=todayISO();
      if(p==="today"){from=to=t}
      else if(p==="yday"){from=to=shift(t,-1)}
      else if(p==="7"){from=shift(t,-6);to=t}
      else if(p==="month"){from=t.slice(0,8)+"01";to=t}
      dset(el("pFrom"),from);dset(el("pTo"),to);
      el("period").querySelectorAll("[data-p]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.p===per)));
    }

    /* ---------- data ---------- */
    async function load(){
      el("reload").disabled=true;
      try{
        const {data,error}=await client.rpc("lwb_acc_dashboard",{p_from:from,p_to:to});
        if(error)throw error;
        D=data;D.lines=D.lines||[];D.pending=D.pending||[];
        const [ex,st,vl,vr,cq]=await Promise.all([client.rpc("lwb_acc_extras",{p_from:from,p_to:to}),client.rpc("lwb_acc_staff_list",{p_month:to}),
          client.rpc("lwb_acc_vehicles"),client.rpc("lwb_acc_vehicle_report",{p_from:from,p_to:to}),client.rpc("lwb_acc_cheque_list")]);
        C=cq.error?[]:(cq.data||[]);
        X=ex.error?{entries:{},staff_heads:[],payees:[]}:ex.data;S=st.error?[]:(st.data||[]);
        V=vl.error?[]:(vl.data||[]);VR=vr.error||!vr.data?{vehicles:[],entries:{}}:vr.data;
        D.lines.forEach(l=>{l.x=l.src==="ENTRY"&&X.entries[l.id]||null;l.veh=l.src==="ENTRY"&&VR.entries[l.id]||null});
        say("");render();
        // bills due / advance per main party (Billing & Outstanding); the dashboard works without it
        LWBPartyPay.load(client).then(i=>{PI=i;piErr=false;renderKpis();if(tab==="out")renderOutstanding()}).catch(()=>{PI=null;piErr=true;renderKpis()});
      }catch(e){say(errText(e),true)}
      finally{el("reload").disabled=false}
    }
    async function rpc(name,args){const {data,error}=await client.rpc(name,args);if(error)throw Error(errText(error));return data}

    /* ---------- figures ---------- */
    function totals(){
      const L=D.lines,t={cashIn:0,cashOut:0,dep:0,wd:0,allIn:0,allOut:0,nonCashIn:0,pendIn:0,byMode:{},exp:new Map(),bank:new Map()};
      MODES.forEach(m=>t.byMode[m]={in:0,out:0});
      for(const l of L){
        const a=Number(l.amount)||0;
        if(l.kind==="IN"){t.allIn+=a;t.byMode[l.mode]&&(t.byMode[l.mode].in+=a);if(l.mode==="CASH")t.cashIn+=a;else{t.nonCashIn+=a;if(l.status==="PENDING")t.pendIn+=a}}
        else if(l.kind==="OUT"){t.allOut+=a;t.byMode[l.mode]&&(t.byMode[l.mode].out+=a);if(l.mode==="CASH")t.cashOut+=a;
          const k=l.category||"Other";t.exp.set(k,(t.exp.get(k)||0)+a)}
        else if(l.kind==="DEPOSIT")t.dep+=a;
        else if(l.kind==="WITHDRAW")t.wd+=a;
        // bank wise, this period
        const bid=l.bank_id||0;
        const counts=l.needs_verify?l.status==="VERIFIED":(l.kind==="WITHDRAW"||(l.kind==="OUT"&&l.mode!=="CASH"));
        if(l.kind!=="IN"||l.mode!=="CASH"){
          if(l.kind==="OUT"&&l.mode==="CASH")continue;
          const b=t.bank.get(bid)||{in:0,out:0,wait:0};
          if(l.needs_verify&&l.status==="PENDING")b.wait+=a;
          else if(counts){if(l.kind==="IN"||l.kind==="DEPOSIT")b.in+=a;else b.out+=a}
          t.bank.set(bid,b);
        }
      }
      return t;
    }

    /* ---------- render ---------- */
    function render(){renderBanners();renderKpis();renderModes();renderExp();renderBanks();renderTab()}
    function bankName(id){const b=(D.banks||[]).find(x=>x.id===id);return b?b.name:""}
    function holderOpen(){return (D.closes||[]).find(c=>c.date===D.last_close&&c.handed_to&&!c.returned_at)}

    function renderBanners(){
      const h=[];
      if(!D.opening_set&&!D.last_close){
        h.push('<div class="acx-banner blue"><div class="grow"><b>Start: how much cash is in hand right now?</b><br>Count the cash once. This is the opening cash; after this the dashboard carries it forward every day.</div>'+
          '<input id="startAmt" type="text" inputmode="decimal" placeholder="₹ cash in hand"><button type="button" class="acx-btn pri" id="startBtn">Set opening cash</button></div>');
      }
      const ho=holderOpen();
      if(ho){
        h.push('<div class="acx-banner amb"><div class="grow"><b>☀ '+rs(ho.counted)+' cash is with '+esc(ho.handed_to_name)+'</b><br>Handed over on '+dmy(ho.date)+' night. When it comes back in the morning, confirm here.</div>'+
          '<button type="button" class="acx-btn grn" data-return="'+ho.id+'">Cash received back</button></div>');
      }
      const pn=D.pending.length,pa=D.pending.reduce((a,p)=>a+Number(p.amount),0);
      if(pn){
        h.push('<div class="acx-banner '+(D.is_admin?"amb":"blue")+'"><div class="grow"><b>'+(D.is_admin?"🔔 Check the bank: ":"⏳ Waiting for Admin's bank check: ")+pn+' entr'+(pn===1?"y":"ies")+' · '+rs(pa)+'</b><br>'+
          (D.is_admin?"UPI / Bank / RTGS / Cheque receipts and cash deposits. Verify the ones you see in the bank.":"They count in the bank after Admin verifies them.")+'</div>'+
          '<button type="button" class="acx-btn'+(D.is_admin?" pri":"")+'" data-tab="verify">'+(D.is_admin?"Verify now":"See list")+'</button></div>');
      }
      const cdue=chequesDue();
      if(cdue.length){const late=cdue.filter(c=>c.status==="IN_HAND").length;
        h.push('<div class="acx-banner amb"><div class="grow"><b>🧾 '+cdue.length+' cheque'+(cdue.length===1?"":"s")+' not in bank yet · '+rs(cdue.reduce((a,c)=>a+Number(c.amount),0))+'</b><br>'+
          (late?late+' to deposit (cheque date reached). ':"")+(cdue.length-late?(cdue.length-late)+' deposited, waiting to come in the bank.':"")+'</div>'+
          '<button type="button" class="acx-btn" data-tab="cheques">Open cheques</button></div>')}
      el("banners").innerHTML=h.join("");
      const sb=el("startBtn");if(sb)sb.onclick=setOpening;
    }

    function kpi(title,val,small,c,cls){return '<div class="acx-kpi'+(cls?" "+cls:"")+'"><h3>'+(c?'<i class="dot" style="--c:'+c+'"></i>':"")+title+'</h3><div class="v">'+val+'</div>'+(small?'<small>'+small+'</small>':"")+'</div>'}
    function renderKpis(){
      const t=totals(),one=from===to,isToday=one&&to===D.today;
      const lastClose=(D.closes||[]).find(c=>c.date===to);
      const handTitle=isToday?"Cash in hand now":one?"Cash in hand at night":"Cash in hand on "+dmy(to);
      let handSmall=lastClose?(lastClose.is_start?"Opening cash set":"Counted at close"+(lastClose.handed_to_name?" · with "+esc(lastClose.handed_to_name):"")):(isToday?"Day not closed yet":"Book balance");
      if(lastClose&&!lastClose.is_start&&Math.abs(lastClose.counted-lastClose.expected)>=1)handSmall+=' · book '+rs(lastClose.expected);
      el("kpis").innerHTML=
        kpi(one?"Opening cash":"Opening on "+dmy(from),D.opening_set?rs(D.opening):"—",D.opening_set?(one?"Brought from last night":""):"Not set yet","#6b7785")+
        kpi("Cash In",'<span class="plus">'+rs(t.cashIn)+'</span>',"Cash received"+(t.wd?" · + "+rs(t.wd)+" taken from bank":""),"#13824a")+
        kpi("Cash Out",'<span class="minus">'+rs(t.cashOut)+'</span>',"Expenses / payments in cash","#c8102e")+
        kpi("Bank deposit",'<span class="neutral">'+rs(t.dep)+'</span>',"Cash put in the bank","#1d5fbf")+
        kpi(handTitle,D.closing_set?rs(D.closing):"—",handSmall,"","hand");
      // Party money of the dates in every mode (cash + UPI + bank + cheque); bills still to collect; cheques not yet in bank
      const coll=D.lines.filter(l=>l.kind==="IN"&&l.src!=="ENTRY"),cm={};coll.forEach(l=>{const m=l.mode==="RTGS"?"BANK":l.mode;cm[m]=(cm[m]||0)+Number(l.amount)});
      const collT=coll.reduce((a,l)=>a+Number(l.amount),0),other=t.allIn-collT;
      const due=PI?[...PI.parties.values()].reduce((a,p)=>a+Math.max(0,p.due-p.advance),0):null;
      const ch=C.filter(c=>c.status==="IN_HAND"),cd=C.filter(c=>c.status==="DEPOSITED"),sum=a=>a.reduce((x,c)=>x+Number(c.amount),0);
      el("strip").innerHTML='<div><h4>💰 Party collection '+(one?(isToday?"today":dmy(to)):"in these dates")+' (all modes)</h4><div class="v plus">'+rs(collT)+'</div>'+
          '<div class="modes">'+["CASH","UPI","BANK","CHEQUE"].map(m=>'<span>'+(m==="BANK"?"Bank / RTGS":MODE_NAME[m])+' <b>'+rs(cm[m]||0)+'</b></span>').join("")+'</div>'+
          '<small>'+(other>0.5?"Other money in: "+rs(other)+" · ":"")+(t.pendIn?rs(t.pendIn)+" UPI / bank / cheque waiting Admin's bank check · ":"")+'All money out: '+rs(t.allOut)+'</small></div>'+
        '<div data-tab="out"><h4>📒 To collect (bills due)</h4><div class="v minus">'+(due==null?(piErr?"—":"…"):rs(due))+'</div><small>All parties, after advance · tap for list</small></div>'+
        '<div data-tab="cheques"><h4>🧾 Cheques not in bank</h4><div class="v">'+rs(sum(ch)+sum(cd))+'</div><small>In hand '+ch.length+' ('+rs(sum(ch))+') · deposited '+cd.length+' ('+rs(sum(cd))+')</small></div>';
    }

    function renderModes(){
      const t=totals();let ti=0,to2=0;
      const rows=MODES.map(m=>{const x=t.byMode[m];ti+=x.in;to2+=x.out;return '<tr><td>'+MODE_NAME[m]+'</td><td class="n plus">'+(x.in?rs(x.in):"–")+'</td><td class="n minus">'+(x.out?rs(x.out):"–")+'</td></tr>'}).join("");
      el("modes").innerHTML='<table class="acx-t"><thead><tr><th>Mode</th><th class="n">In</th><th class="n">Out</th></tr></thead><tbody>'+rows+
        (t.dep?'<tr><td>Cash → Bank deposit</td><td class="n"></td><td class="n neutral">'+rs(t.dep)+'</td></tr>':"")+
        (t.wd?'<tr><td>Bank → Cash</td><td class="n neutral">'+rs(t.wd)+'</td><td class="n"></td></tr>':"")+
        '</tbody><tfoot><tr><td>Total</td><td class="n">'+rs(ti)+'</td><td class="n">'+rs(to2)+'</td></tr></tfoot></table>';
      el("modeNote").textContent=from===to?dmy(from):dmy(from)+" – "+dmy(to);
    }

    function renderExp(){
      const t=totals(),list=[...t.exp.entries()].sort((a,b)=>b[1]-a[1]),max=list.length?list[0][1]:0,sum=list.reduce((a,x)=>a+x[1],0);
      el("expNote").textContent=list.length?"total "+rs(sum):"";
      el("exp").innerHTML=list.length?'<div class="acx-bars">'+list.map(([k,v])=>'<div class="acx-bar" title="'+esc(k)+': '+rs(v)+' ('+Math.round(v*100/sum)+'%)"><span class="lab">'+esc(k)+'</span><span class="track"><span class="fill" style="display:block;width:'+Math.max(1,v*100/max)+'%"></span></span><span class="amt">'+rs(v)+'</span></div>').join("")+'</div>'
        :'<div class="acx-empty">No expense in these dates.</div>';
    }

    function renderBanks(){
      const t=totals(),banks=(D.banks||[]).filter(b=>b.active||t.bank.has(b.id));
      const rows=banks.map(b=>{const x=t.bank.get(b.id)||{in:0,out:0,wait:0};
        return '<tr><td><b>'+esc(b.name)+'</b>'+(b.account_no?'<small>A/c '+esc(b.account_no)+'</small>':"")+'</td><td class="n plus">'+(x.in?rs(x.in):"–")+'</td><td class="n minus">'+(x.out?rs(x.out):"–")+'</td><td class="n">'+rs(b.balance)+(x.wait?'<small class="tag t-amb">+'+rs(x.wait)+' wait</small>':"")+'</td></tr>'}).join("");
      const nb=t.bank.get(0);
      const extra=nb&&(nb.in||nb.out||nb.wait)?'<tr><td>Bank not chosen yet<small>Admin picks the bank while verifying</small></td><td class="n">'+(nb.in?rs(nb.in):"–")+'</td><td class="n">'+(nb.out?rs(nb.out):"–")+'</td><td class="n">'+(nb.wait?'<span class="tag t-amb">'+rs(nb.wait)+' wait</span>':"")+'</td></tr>':"";
      el("banks").innerHTML=banks.length||extra?'<table class="acx-t"><thead><tr><th>Bank</th><th class="n">In</th><th class="n">Out</th><th class="n">Balance</th></tr></thead><tbody>'+rows+extra+'</tbody></table>'
        :'<div class="acx-empty">No bank added yet. Add your bank accounts in <a href="#" data-tab="setup">Heads &amp; Banks</a>.</div>';
    }

    /* ---------- tabs ---------- */
    function renderTab(){
      el("tabs").querySelectorAll("[data-t]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.t===tab)));
      const n=D.pending.length;el("vCnt").hidden=!n;el("vCnt").textContent=n;
      const cn=chequesDue().length;el("cCnt").hidden=!cn;el("cCnt").textContent=cn;
      if(tab==="book")renderBook();else if(tab==="verify")renderVerify();else if(tab==="out")renderOutstanding();else if(tab==="close")renderCloses();else if(tab==="staff")renderStaff();else if(tab==="veh")renderVehicles();else if(tab==="cheques")renderCheques();else renderSetup();
    }
    function statusTag(l){
      if(l.status==="PENDING")return '<span class="tag t-amb">Waiting bank check</span>';
      if(l.status==="VERIFIED")return '<span class="tag t-grn">✓ In bank'+(bankName(l.bank_id)?" · "+esc(bankName(l.bank_id)):"")+'</span>';
      if(l.status==="REJECTED")return '<span class="tag t-red">✗ Not in bank</span>';
      return "";
    }
    function lineIcon(l){return l.kind==="IN"?'<span class="acx-ic ic-in">+</span>':l.kind==="OUT"?'<span class="acx-ic ic-out">−</span>':l.kind==="DEPOSIT"?'<span class="acx-ic ic-dep">🏦</span>':'<span class="acx-ic ic-dep">₹</span>'}
    function lineTitle(l){return l.kind==="DEPOSIT"?"Bank deposit"+(bankName(l.bank_id)?" · "+bankName(l.bank_id):""):l.kind==="WITHDRAW"?"Cash from bank"+(bankName(l.bank_id)?" · "+bankName(l.bank_id):""):(l.party?l.party+" · ":"")+(l.category||"")}
    function marks(l){const x=l.x,v=l.veh?' <span class="tag t-gry">🚚 '+esc(l.veh.vehicle)+'</span>':"";if(!x)return v;return v+(x.gst_bill?' <span class="tag t-blu">GST bill</span>':"")+(x.photos&&x.photos.length?' <span class="tag t-gry">📎 '+x.photos.length+'</span>':"")}
    function sign(l){return l.kind==="IN"||l.kind==="WITHDRAW"?"plus":l.kind==="OUT"?"minus":"neutral"}
    const wide=()=>window.innerWidth>=760;
    // Ledger: oldest first, In / Out columns and the running cash balance (cash lines only move it).
    function ledger(list){
      const all=[...D.lines].sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.at).localeCompare(String(b.at)));
      let bal=Number(D.opening)||0;const run=new Map();all.forEach(l=>{bal=r2(bal+Number(l.cash||0));run.set(l.src+"|"+l.id,bal)});
      const show=new Set(list.map(l=>l.src+"|"+l.id)),rows=all.filter(l=>show.has(l.src+"|"+l.id));
      const tin=rows.filter(l=>l.kind==="IN"||l.kind==="WITHDRAW").reduce((a,l)=>a+Number(l.amount),0),tout=rows.filter(l=>l.kind==="OUT"||l.kind==="DEPOSIT").reduce((a,l)=>a+Number(l.amount),0);
      const part=l=>'<b>'+esc(lineTitle(l))+'</b>'+marks(l)+'<small>'+[l.order_no?"PO "+esc(l.order_no):"",l.ref?"Ref "+esc(l.ref):"",esc(SRC_NAME[l.src]||""),l.remark?esc(l.remark):"",l.by?"by "+esc(l.by):""].filter(Boolean).join(" · ")+'</small>';
      return '<div style="overflow:auto"><table class="acx-t acx-ledger"><thead><tr><th>Date</th><th>Particulars</th><th>Mode</th><th class="n">In (Cr)</th><th class="n">Out (Dr)</th><th class="n">Cash balance</th><th></th></tr></thead><tbody>'+
        (D.opening_set?'<tr><td>'+dmy(from)+'</td><td><b>Opening cash</b></td><td>Cash</td><td class="n"></td><td class="n"></td><td class="n"><b>'+rs(D.opening)+'</b></td><td></td></tr>':"")+
        rows.map(l=>{const inn=l.kind==="IN"||l.kind==="WITHDRAW";
          return '<tr data-line="'+l.src+'|'+l.id+'" style="cursor:pointer"><td>'+dmy(l.date)+'<small>'+lt(l)+'</small></td><td>'+part(l)+'</td><td>'+(l.kind==="DEPOSIT"?"Cash → Bank":l.kind==="WITHDRAW"?"Bank → Cash":MODE_NAME[l.mode])+'</td>'+
          '<td class="n plus">'+(inn?rs(l.amount):"")+'</td><td class="n minus">'+(inn?"":rs(l.amount))+'</td><td class="n">'+(Number(l.cash)?rs(run.get(l.src+"|"+l.id)):'<small>no cash</small>')+'</td><td>'+statusTag(l)+'</td></tr>'}).join("")+
        '</tbody><tfoot><tr><td colspan="3">Total ('+rows.length+')</td><td class="n">'+rs(tin)+'</td><td class="n">'+rs(tout)+'</td><td class="n">'+(D.closing_set&&bookF==="all"&&!(el("bookQ")&&el("bookQ").value)?rs(D.closing):"")+'</td><td></td></tr></tfoot></table></div>';
    }
    function renderBook(){
      const q=(el("bookQ")&&el("bookQ").value||"").toLowerCase();
      const F={all:"All",IN:"Cash In",OUT:"Cash Out",DEPOSIT:"Deposit",PENDING:"Waiting check"};
      const list=D.lines.filter(l=>(bookF==="all"||(bookF==="PENDING"?l.status==="PENDING":bookF==="DEPOSIT"?(l.kind==="DEPOSIT"||l.kind==="WITHDRAW"):l.kind===bookF))&&
        (!q||[l.party,l.category,l.ref,l.remark,l.order_no,l.by,l.mode,String(l.amount)].join(" ").toLowerCase().includes(q)));

      el("tabBody").innerHTML='<div class="acx-filter"><div class="acx-chips" id="bookF">'+Object.entries(F).map(([k,v])=>'<button type="button" data-f="'+k+'" aria-pressed="'+(bookF===k)+'">'+v+'</button>').join("")+'</div>'+
        '<input type="search" id="bookQ" placeholder="Search party, head, ref, PO" autocomplete="off"><button type="button" class="acx-btn" id="bookXl">⬇ Excel</button></div>'+
        (!list.length?'<div class="acx-empty">No money entry in these dates.</div>':wide()?ledger(list):'<div class="acx-rows">'+list.map(l=>'<button type="button" class="acx-row" data-line="'+l.src+'|'+l.id+'">'+lineIcon(l)+
          '<span class="t"><b>'+esc(lineTitle(l))+marks(l)+'</b><small>'+(from!==to?dmy(l.date)+" · ":"")+lt(l)+' · '+MODE_NAME[l.mode]+(l.ref?" · "+esc(l.ref):"")+(l.order_no?" · "+esc(l.order_no):"")+" · "+esc(SRC_NAME[l.src]||"")+(l.remark?" · "+esc(l.remark):"")+'</small></span>'+
          '<span class="a '+sign(l)+'">'+(sign(l)==="plus"?"+":sign(l)==="minus"?"−":"")+rs(l.amount).replace("−","")+'<small>'+statusTag(l)+'</small></span></button>').join("")+'</div>');

      el("bookXl").onclick=()=>LWBExcel.write("accounts-daybook-"+from+"-to-"+to,[{name:"Day book",rows:[["Date","Time","Type","Head","Party","Mode","Amount","Ref","PO","Bank","Bank check","From","Remark","Entered by"],
        ...list.map(l=>[dmy(l.date),lt(l),{IN:"Cash In",OUT:"Cash Out",DEPOSIT:"Bank deposit",WITHDRAW:"Cash from bank"}[l.kind],l.category||"",l.party||"",MODE_NAME[l.mode],r2(l.amount),l.ref||"",l.order_no||"",bankName(l.bank_id),{PENDING:"Waiting",VERIFIED:"Verified",REJECTED:"Not in bank",NA:""}[l.status],SRC_NAME[l.src]||"",l.remark||"",l.by||""])]}]).catch(e=>say(e.message,true));
      el("tabBody").querySelectorAll("[data-line]").forEach(b=>b.onclick=()=>{const [s,i]=b.dataset.line.split("|");showLine(D.lines.find(l=>l.src===s&&l.id===i))});
    }

    function bankOptions(sel,withBlank){return (withBlank?'<option value="">Choose bank…</option>':"")+(D.banks||[]).filter(b=>b.active).map(b=>'<option value="'+b.id+'"'+(String(b.id)===String(sel||"")?" selected":"")+'>'+esc(b.name)+(b.account_no?" · "+esc(b.account_no):"")+'</option>').join("")}
    function renderVerify(){
      const P=D.pending;
      if(!P.length){el("tabBody").innerHTML='<div class="acx-empty">✓ Nothing is waiting for the bank check.</div>';return}
      const total=P.reduce((a,p)=>a+Number(p.amount),0);

        (D.is_admin&&noBank?'<div class="acx-msg">Add your bank accounts first in <a href="#" data-tab="setup">Heads &amp; Banks</a>.</div>':"")+
        P.map(p=>'<div class="acx-ver" data-v="'+p.src+'|'+p.id+'"><div><div class="amt">'+rs(p.amount)+' <span class="tag t-blu">'+(p.kind==="DEPOSIT"?"Cash deposit":MODE_NAME[p.mode])+'</span></div></div><div style="text-align:right;font-size:13px">'+dmy(p.date)+'<br>'+hm(p.at)+'</div>'+
          '<div class="meta">'+esc(p.kind==="DEPOSIT"?"Cash deposited in "+(bankName(p.bank_id)||"bank"):(p.party||p.category||""))+(p.ref?' · Ref <b>'+esc(p.ref)+'</b>':"")+(p.order_no?" · "+esc(p.order_no):"")+' · '+esc(SRC_NAME[p.src]||"")+(p.by?" · by "+esc(p.by):"")+(p.remark?'<br><small>'+esc(p.remark)+'</small>':"")+'</div>'+
          (D.is_admin?'<div class="act"><select aria-label="Bank">'+bankOptions(p.bank_id,!p.bank_id)+'</select><button type="button" class="acx-btn grn" data-ok>✓ In bank</button><button type="button" class="acx-btn red" data-no>✗ Not in bank</button></div>':"")+'</div>').join("");
      el("tabBody").querySelectorAll(".acx-ver").forEach(box=>{
        const [src,id]=box.dataset.v.split("|");
        const ok=box.querySelector("[data-ok]"),no=box.querySelector("[data-no]");
        if(ok)ok.onclick=()=>act(ok,async()=>{const b=box.querySelector("select").value;if(!b)throw Error("Choose the bank where this money came");await rpc("lwb_acc_verify_line",{p_src:src,p_id:id,p_ok:true,p_bank_id:Number(b),p_note:null})});
        if(no)no.onclick=async()=>{const why=await ERPShell.prompt("Why is it not in the bank?","",{title:"Not in bank",placeholder:"e.g. not credited, wrong UTR"});if(why==null)return;
          act(no,()=>rpc("lwb_acc_verify_line",{p_src:src,p_id:id,p_ok:false,p_bank_id:null,p_note:why}))};
      });
    }

    // Party outstanding on the MAIN party (all its bill names), advance taken off (Billing & Outstanding)

    // Cheques: in hand -> deposited -> cleared / bounced. Due = cheque date reached and not yet in bank.

    // Phone photos are large: resize to 1280px JPEG before upload.
    function shrink(file){
      return new Promise((ok,bad)=>{
        const img=new Image(),url=URL.createObjectURL(file);
        img.onload=()=>{const s=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement("canvas");
          c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
          URL.revokeObjectURL(url);c.toBlob(b=>b?ok(b):bad(Error("Photo could not be read")),"image/jpeg",0.8)};
        img.onerror=()=>bad(Error("Photo could not be read"));img.src=url;
      });
    }

    function sheet(title,body,okText,onOk,okCls){
      const back=document.createElement("div");back.className="acx-back";
      back.innerHTML='<div class="acx-sheet" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><header><h3>'+esc(title)+'</h3><button type="button" data-x aria-label="Close">✕</button></header><div class="body">'+body+'</div>'+
        (okText?'<footer><button type="button" class="acx-btn" data-x>Cancel</button><button type="button" class="acx-btn '+(okCls||"pri")+'" data-ok>'+okText+'</button></footer>':"")+'</div>';
      document.body.append(back);document.body.style.overflow="hidden";
      const close=()=>{back.remove();document.body.style.overflow=""};
      back.querySelectorAll("[data-x]").forEach(b=>b.onclick=close);
      back.addEventListener("click",e=>{if(e.target===back)close()});
      const ok=back.querySelector("[data-ok]");
      if(ok)ok.onclick=async()=>{ok.disabled=true;try{if(await onOk(back)!==false)close()}finally{ok.disabled=false}};
      return back;
    }
