      act(null,()=>rpc("lwb_acc_set_opening",{p_date:D.today,p_amount:n,p_note:"Opening cash set again by Admin"}));
    }

    // Short code like the Cashbook: first letter of each word, a dash, first letters of the area. SHREE JAGDISH TRADERS (BARDOLI) -> SJT-B
    function shortCode(full,taken){
      const n=full.replace(/\s+/g," ").trim(),m=n.match(/^(.*)\(([^()]*)\)\s*$/),name=m?m[1]:n,area=m?m[2]:"";
      const ini=t=>(t.match(/[A-Za-z0-9]+/g)||[]).map(w=>/^\d+$/.test(w)||w.toUpperCase()==="RG"?w:w[0]).join("").toUpperCase();
      const base=(ini(name)||"P")+(ini(area)?"-"+ini(area):"");let code=base,k=2;
      while(taken.has(code))code=base+k++;taken.add(code);return code;
    }
    function partyList(){
      const taken=new Set(),seen=new Set(),out=[];
      for(const x of S.filter(x=>x.active)){seen.add(x.name.toLowerCase());out.push({t:"staff",id:x.id,name:x.name,sub:(x.designation?x.designation+" · ":"")+"Staff"})}
      for(const v of V){seen.add(v.no.toLowerCase());out.push({t:"vehicle",id:v.id,name:v.no,sub:[v.type,v.own==="TRANSPORTER"?v.transporter||"Transporter":""].filter(Boolean).concat("Vehicle").join(" · ")})}
      const dueOf=n=>{const p=PI&&PI.parties.get(LWBPartyPay.key(PI.parentOf(n)));return p&&(p.due>0.5||p.advance>0.5)?p:null};
      const pSub=n=>{const p=dueOf(n),m=PI?PI.parentOf(n):n;return (LWBPartyPay.key(m)!==LWBPartyPay.key(n)?"under "+m+" · ":"")+(p?LWBPartyPay.balText(p):"Party Master")};
      const pn=[...(X.parties||[])];if(PI)for(const p of PI.parties.values())if(!pn.some(n=>n.toLowerCase()===p.party.toLowerCase()))pn.push(p.party);
      for(const n of pn){if(seen.has(n.toLowerCase()))continue;seen.add(n.toLowerCase());const p=dueOf(n);out.push({t:"party",name:n,code:shortCode(n,taken),sub:pSub(n),due:p?Math.abs(p.net):0})}
      for(const n of X.payees||[]){if(seen.has(n.toLowerCase()))continue;seen.add(n.toLowerCase());out.push({t:"payee",name:n,sub:"Used before"})}
      return out;
    }
    const nowHM=()=>new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Kolkata"});

    // Add entry: same layout as the Cashbook (Cash In / Cash Out, Date + Time, Party, Amount + Count notes, Remark, Category + Payment mode).
    function newEntry(kind,pre){pre=pre||{};
      const banks=(D.banks||[]).filter(b=>b.active);
      if((kind==="DEPOSIT"||kind==="WITHDRAW")&&!banks.length){ERPShell.alert("Add your bank account first (Heads & Banks).");tab="setup";renderTab();return}
      const io=kind==="IN"||kind==="OUT";
      let st={kind,mode:"CASH",cat:pre.cat||null},files=[],cqFiles=[],pick=null;
      const PL=partyList();
      if(pre.staff){const x=PL.find(p=>p.t==="staff"&&String(p.id)===String(pre.staff));if(x)pick=x}
      if(pre.vehicle){const x=PL.find(p=>p.t==="vehicle"&&p.id===pre.vehicle);if(x)pick=x}
      const def=to<=D.today&&to>=from&&from===to?to:D.today;
      const body=(io?'<div class="seg two" id="eKind"><button type="button" class="in" data-k="IN">+ Cash In</button><button type="button" class="out" data-k="OUT">− Cash Out</button></div>':
          '<div class="seg two" id="eKind"><button type="button" class="dep" data-k="DEPOSIT">🏦 Cash to bank</button><button type="button" class="dep" data-k="WITHDRAW">₹ Cash from bank</button></div>')+
        '<div class="f2"><div class="f"><label>Date</label>'+dateBox("eDate",def,{max:D.today})+'</div><div class="f"><label for="eTime">Time</label><input id="eTime" type="time" value="'+nowHM()+'"></div></div>'+
        '<div class="f acx-combo" id="ePartyBox"><label for="eParty" id="ePartyLab">Party</label><input id="eParty" type="text" maxlength="120" autocomplete="off" placeholder="Type party name or short code" value="'+esc(pick?pick.name:"")+'" role="combobox" aria-expanded="false" aria-controls="ePList"><div class="acx-clist" id="ePList" role="listbox" hidden></div><div class="acx-note" id="eStaffBal" style="margin:4px 0 0"></div><div id="eDue" hidden></div></div>'+
        '<div class="f" id="eBankBox"><label for="eBank" id="eBankLab">Bank</label><select id="eBank">'+bankOptions(banks.length===1?banks[0].id:"",true)+'</select></div>'+
        '<div class="f"><label for="eAmt" id="eAmtLab">Amount (₹)</label><input id="eAmt" class="big" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00">'+
          '<button type="button" class="acx-link" id="eCnt">Count notes</button><div id="eNotes" hidden><div class="notes">'+NOTE_KEYS.map(k=>'<div class="note"><b>₹'+k+'</b><button type="button" data-d="'+k+'" data-s="-1" aria-label="less">−</button><input type="text" inputmode="numeric" data-en="'+k+'" placeholder="0" aria-label="'+k+' notes"><button type="button" data-d="'+k+'" data-s="1" aria-label="more">+</button></div>').join("")+'</div></div></div>'+
        '<div class="f"><label for="eRemark">Remark</label><input id="eRemark" type="text" maxlength="300" autocomplete="off" placeholder="e.g. Paid rent, 16 labour loading"></div>'+
        '<div class="f2" id="eCatRow"><div class="f"><label for="eCat" id="eCatLab">Category</label><select id="eCat"></select></div><div class="f"><label for="eMode">Payment mode</label><select id="eMode">'+MODES.map(m=>'<option value="'+m+'">'+MODE_NAME[m]+'</option>').join("")+'</select></div></div>'+
        '<div class="f" id="eRefBox"><label for="eRef" id="eRefLab">UTR / Ref no.</label><input id="eRef" type="text" maxlength="100" autocomplete="off"></div>'+
        '<div id="eChqBox" class="acx-more" style="border-style:solid"><div class="f2"><div class="f"><label>Cheque date</label>'+dateBox("eCqDate",def,{label:"Cheque date"})+'</div>'+
          '<div class="f"><label for="eCqBank">Party\'s bank</label><input id="eCqBank" type="text" maxlength="80" autocomplete="off" placeholder="e.g. SBI Udhna"></div></div>'+
          '<div class="f" style="margin-top:10px"><label>Cheque photo</label><div class="pills"><button type="button" data-ph="eCqCam">📷 Take photo</button><button type="button" data-ph="eCqGal">🖼 Gallery</button></div>'+
          '<input type="file" id="eCqCam" accept="image/*" capture="environment" hidden><input type="file" id="eCqGal" accept="image/*" multiple hidden><div class="phs" id="eCqPhs"></div></div></div>'+
        '<details class="acx-more" id="eMore"><summary>Bill no. · bill photo · GST bill <small>(optional)</small></summary>'+
          '<div class="f"><label for="eBill">Bill / voucher no.</label><input id="eBill" type="text" maxlength="60" autocomplete="off"></div>'+
          '<div class="f"><label>Bill photo</label><div class="pills"><button type="button" data-ph="eCam">📷 Take photo</button><button type="button" data-ph="eGal">🖼 Gallery</button></div>'+
          '<input type="file" id="eCam" accept="image/*" capture="environment" hidden><input type="file" id="eGal" accept="image/*" multiple hidden><div class="phs" id="ePhs"></div></div>'+
          '<div class="f" id="eGstWrap"><label class="chk"><input type="checkbox" id="eGst"> GST bill (with GST number)</label>'+
          '<div class="f2" id="eGstBox" hidden style="margin-top:8px"><div class="f"><label for="eGstAmt">GST amount ₹</label><input id="eGstAmt" type="text" inputmode="decimal" autocomplete="off"></div>'+
          '<div class="f"><label for="eGstin">Seller GSTIN</label><input id="eGstin" type="text" maxlength="15" autocomplete="off" style="text-transform:uppercase"></div></div></div></details>'+
        '<div id="eHint" class="acx-note" style="margin:0"></div>';
      const box=sheet("Add entry",body,"Save",()=>save(),"grn");
      const q=s=>box.querySelector(s);
      // "Save & add new" sits on the left like in the Cashbook
      const foot=box.querySelector("footer"),again=document.createElement("button");
      again.type="button";again.className="acx-btn";again.textContent="Save & add new";again.style.marginRight="auto";foot.prepend(again);
      again.onclick=async()=>{again.disabled=true;try{if(await save()!==false)reset()}finally{again.disabled=false}};

      const staffOf=()=>{if(pick&&pick.t==="staff"&&pick.name===q("#eParty").value.trim())return pick;
        const v=q("#eParty").value.trim().toLowerCase();return PL.find(p=>p.t==="staff"&&p.name.toLowerCase()===v)||null};
      const vehOf=()=>{if(st.kind!=="OUT")return null;if(pick&&pick.t==="vehicle"&&pick.name===q("#eParty").value.trim())return pick;
        const v=q("#eParty").value.replace(/[\s-]/g,"").toLowerCase();return v?PL.find(p=>p.t==="vehicle"&&p.name.toLowerCase()===v)||null:null};
      const notesTotal=()=>NOTE_KEYS.reduce((a,k)=>a+(Math.floor(num(q('[data-en="'+k+'"]').value))||0)*Number(k),0);
      const readNotes=()=>{const n={};NOTE_KEYS.forEach(k=>{const v=Math.floor(num(q('[data-en="'+k+'"]').value));if(v>0)n[k]=v});return n};

      async function save(){
        const amt=num(q("#eAmt").value),staffOn=io&&isStaffHead(st.cat),stf=staffOn?staffOf():null,veh=staffOn?null:vehOf(),gst=st.kind==="OUT"&&q("#eGst").checked;
        const nonCash=io&&st.mode!=="CASH",utr=nonCash||st.kind==="DEPOSIT"?q("#eRef").value.trim():"",bill=q("#eBill").value.trim();
        const p={date:dval("eDate"),time:q("#eTime").value||null,kind:st.kind,category_id:io?st.cat:null,mode:io?st.mode:"CASH",bank_id:st.kind==="IN"&&st.mode==="CHEQUE"?null:q("#eBank").value||null,amount:amt,
          party:stf||veh?"":q("#eParty").value.trim(),vehicle_id:veh?veh.id:null,ref:[utr,bill&&(utr?"Bill "+bill:bill)].filter(Boolean).join(" · "),remark:q("#eRemark").value,
          staff_id:stf?stf.id:null,gst_bill:gst,gst_amount:gst?num(q("#eGstAmt").value)||null:null,gstin:gst?q("#eGstin").value:null,
          notes:st.mode==="CASH"&&!q("#eNotes").hidden?readNotes():null,photos:[]};
        if(!p.date){await ERPShell.alert("Enter the date as DD/MM/YYYY");return false}
        if(!(amt>0)){await ERPShell.alert("Enter the amount");return false}
        if(st.kind==="IN"&&st.mode==="CHEQUE"&&q("#eCqDate .dtxt").value.trim()&&!dval("eCqDate")){await ERPShell.alert("Enter the cheque date as DD/MM/YYYY");return false}
        if(io&&!st.cat){await ERPShell.alert("Choose the category");return false}
        if(staffOn&&!stf){await ERPShell.alert(S.some(x=>x.active)?"Salary / upad: pick the staff name in Party.":"Add the staff first in Staff ledger.");return false}
        if(st.kind==="OUT"&&st.mode==="CASH"&&D.closing_set&&p.date===D.today&&amt>Number(D.closing)+0.5&&to===D.today){
          if(!await ERPShell.confirm("Cash in hand is only "+rs(D.closing)+". Save "+rs(amt)+" Cash Out anyway?"))return false}
        try{
          for(let i=0;i<files.length&&st.kind!=="IN"&&st.kind!=="WITHDRAW";i++){
            const path=me.id+"/"+Date.now()+"-"+i+".jpg";
            const up=await client.storage.from("lwb-acc-bills").upload(path,await shrink(files[i]),{contentType:"image/jpeg"});
            if(up.error)throw Error("Photo upload failed: "+up.error.message);
            p.photos.push(path);
          }
          const id=await rpc("lwb_acc_add_entry3",{p});
          if(st.kind==="IN"&&st.mode==="CHEQUE"){
            // cheque date / bank / photo go to the cheque register; a failure here does not lose the entry
            try{const photos=[];
              for(let i=0;i<cqFiles.length;i++){const path=me.id+"/chq-"+Date.now()+"-"+i+".jpg";
                const up=await client.storage.from("lwb-acc-bills").upload(path,await shrink(cqFiles[i]),{contentType:"image/jpeg"});
                if(up.error)throw Error("Photo upload failed: "+up.error.message);photos.push(path)}
              await rpc("lwb_acc_save_cheque",{p:{src:"ENTRY",id,cheque_no:utr,cheque_date:dval("eCqDate")||p.date,drawn_on:q("#eCqBank").value,photos}});
            }catch(e){await ERPShell.alert("Entry saved, but cheque details not saved: "+errText(e)+"\nAdd them in the Cheques tab.")}
          }
        }catch(e){await ERPShell.alert(errText(e));return false}
        ERPShell.toast?ERPShell.toast("Saved "+rs(amt)):null;load();
      }
      function reset(){
        ["#eParty","#eAmt","#eRemark","#eRef","#eBill","#eGstAmt","#eGstin","#eCqBank"].forEach(s=>q(s).value="");cqFiles=[];drawCq();
        box.querySelectorAll("[data-en]").forEach(i=>i.value="");q("#eNotes").hidden=true;q("#eCnt").textContent="Count notes";
        pick=null;files=[];drawPhotos();q("#eGst").checked=false;q("#eMore").open=false;q("#eTime").value=nowHM();paint();q("#eParty").focus();
      }
      function fillCats(){
        const cats=(D.categories||[]).filter(c=>c.kind===st.kind&&c.active);
        if(!cats.some(c=>c.id===st.cat))st.cat=null;
        q("#eCat").innerHTML='<option value="">Choose…</option>'+cats.map(c=>'<option value="'+c.id+'"'+(c.id===st.cat?" selected":"")+'>'+esc(c.name)+'</option>').join("")+'<option value="new">+ Add new…</option>';
      }
      function paint(){
        const k=st.kind;
        q("#eKind").querySelectorAll("[data-k]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.k===k)));
        box.querySelector("h3").textContent=io?"Add entry":k==="DEPOSIT"?"Cash deposited in bank":"Cash taken from bank";
        box.querySelector("[data-ok]").className="acx-btn "+(k==="IN"?"grn":k==="OUT"?"redf":"pri");
        if(io)fillCats();
        q("#eCatRow").hidden=!io;q("#ePartyBox").hidden=!io;
        q("#eMode").value=st.mode;
        const nonCash=io&&st.mode!=="CASH";
        q("#eBankBox").hidden=io&&!nonCash||k==="IN"&&st.mode==="CHEQUE";   // a cheque's bank is chosen when it is deposited
        q("#eBankLab").textContent=k==="DEPOSIT"?"Deposited in bank":k==="WITHDRAW"?"Taken from bank":k==="IN"?"Came in bank (Admin can change)":"Paid from bank";
        q("#eRefBox").hidden=!(nonCash||k==="DEPOSIT");
        q("#eRefLab").textContent=st.mode==="CHEQUE"?"Cheque no.":k==="DEPOSIT"?"Deposit slip no.":"UTR / Ref no.";
        q("#eCnt").hidden=io&&nonCash;if(io&&nonCash)q("#eNotes").hidden=true;
        q("#eMore").hidden=k==="IN"||k==="WITHDRAW";q("#eChqBox").hidden=!(k==="IN"&&st.mode==="CHEQUE");q("#eGstWrap").hidden=k!=="OUT";q("#eGstBox").hidden=!q("#eGst").checked;
        q("#eAmtLab").textContent=(k==="IN"?"Amount received":k==="OUT"?"Amount paid":"Amount")+" (₹)";
        q("#ePartyLab").textContent=k==="IN"?"Received from":"Paid to";
        staffBal();
        q("#eHint").textContent=k==="DEPOSIT"?"Cash leaves the cash in hand now; it shows in the bank after Admin checks the bank.":
          k==="IN"?"Money from a party with bills: pick the party and use “Receive against these bills” (or 💰 Party payment), so its bills and outstanding go down."+(nonCash?" Admin gets a bell to check this in the bank.":""):
          isStaffHead(st.cat)?"Pick the staff name in "+q("#ePartyLab").textContent+"; it goes in the staff ledger.":"";
      }
      // Cash In from a party with Tally bills: show what it owes and take the money against its bills
      function partyDue(){
        const box=q("#eDue"),n=st.kind==="IN"&&!isStaffHead(st.cat)?q("#eParty").value.trim():"";
        const p=n&&PI?PI.parties.get(LWBPartyPay.key(PI.parentOf(n))):null;
        if(!p||!(p.due>0.5||p.advance>0.5)){box.hidden=true;return}
        box.hidden=false;
        box.innerHTML='<div class="acx-due"><div class="h"><b>'+esc(p.party)+'</b><span>'+(p.net>0.5?'to collect <b class="minus">'+rs(p.net)+'</b>':p.net<-0.5?'advance <b class="plus">'+rs(-p.net)+'</b>':"settled")+'</span></div>'+
          (p.advance>0.5&&p.bills.length?'<div class="r"><small>Bills '+rs(p.due)+' − paid earlier, not adjusted '+rs(p.advance)+'</small></div>':"")+
          p.bills.slice(0,6).map(b=>'<div class="r"><span>'+esc(b.order_no)+' · '+dmy(b.invoice_date)+'<small>'+esc(LWBPartyPay.billNames(b)).replace(/\n/g,"<br>")+'</small></span><b>'+rs(b.due)+'</b></div>').join("")+
          (p.bills.length>6?'<div class="r"><small>+ '+(p.bills.length-6)+' more bills</small></div>':"")+
          '<button type="button" class="acx-btn grn" id="eDueGo">💰 Receive against these bills →</button></div>';
        q("#eDueGo").onclick=()=>{const amt=num(q("#eAmt").value),mode=["CASH","UPI","BANK","CHEQUE"].includes(st.mode)?st.mode:st.mode==="RTGS"?"BANK":"CASH";
          box.closest(".acx-back")?box.closest(".acx-back").remove():null;document.body.style.overflow="";partyPay(p.party,amt,mode)};
      }
      function staffBal(){partyDue();const p=io&&isStaffHead(st.cat)?staffOf():null,s=p&&S.find(x=>x.id===p.id),v=!p&&!isStaffHead(st.cat)&&vehOf();
        q("#eStaffBal").textContent=s?balText(s.balance)+" · salary "+rs(s.monthly_salary)+"/month":v?"🚚 Vehicle expense: shows in the Vehicles tab. Shop / driver name: write it in Remark.":""}
      // Party box: type a name or short code, pick from staff, Party Master and names used before
      let hi=0,shown=[];
      function drawList(){
        const v=q("#eParty").value.trim().toLowerCase(),staffFirst=isStaffHead(st.cat);
        const vs=v.replace(/[\s-]/g,"");
        shown=PL.filter(p=>!v||p.name.toLowerCase().includes(v)||(p.code&&p.code.toLowerCase().startsWith(v))||(p.t==="vehicle"&&vs&&p.name.toLowerCase().includes(vs)))
          .sort((a,b)=>staffFirst?(a.t==="staff"?0:1)-(b.t==="staff"?0:1):st.kind==="IN"?(b.due||0)-(a.due||0):0).slice(0,40);
        hi=0;const L=q("#ePList");
        L.innerHTML=shown.map((p,i)=>'<button type="button" role="option" data-i="'+i+'"'+(i===hi?' class="on"':"")+'><b>'+esc(p.name)+'</b><small>'+(p.code?esc(p.code)+" · ":"")+esc(p.sub)+'</small></button>').join("")||
          (v?'<div class="acx-cnone">New name: "'+esc(q("#eParty").value.trim())+'"</div>':'<div class="acx-cnone">No names yet</div>');
        L.hidden=false;q("#eParty").setAttribute("aria-expanded","true");
        L.querySelectorAll("[data-i]").forEach(b=>b.onmousedown=e=>{e.preventDefault();choose(shown[Number(b.dataset.i)])});
      }
      function hideList(){q("#ePList").hidden=true;q("#eParty").setAttribute("aria-expanded","false")}
      function choose(p){if(!p)return;pick=p;q("#eParty").value=p.name;hideList();staffBal();q("#eAmt").focus()}
      q("#eParty").onfocus=drawList;q("#eParty").oninput=()=>{pick=null;drawList();staffBal()};
      q("#eParty").onblur=()=>setTimeout(hideList,120);
      q("#eParty").onkeydown=e=>{const L=q("#ePList");if(L.hidden)return;
        if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();hi=Math.max(0,Math.min(shown.length-1,hi+(e.key==="ArrowDown"?1:-1)));
          L.querySelectorAll("[data-i]").forEach((b,i)=>b.classList.toggle("on",i===hi));const c=L.querySelector(".on");if(c)c.scrollIntoView({block:"nearest"})}
        else if(e.key==="Enter"){e.preventDefault();if(shown[hi]&&q("#eParty").value.trim())choose(shown[hi]);else{hideList();q("#eAmt").focus()}}
        else if(e.key==="Escape"){e.stopPropagation();hideList()}};
      q("#eCat").onchange=async()=>{const v=q("#eCat").value;
        if(v==="new"){const id=await addHead(st.kind,true);if(id)st.cat=id;paint();return}
        st.cat=v?Number(v):null;paint()};
      q("#eMode").onchange=()=>{st.mode=q("#eMode").value;paint()};
      // Count notes fills the amount
      q("#eCnt").onclick=()=>{q("#eNotes").hidden=!q("#eNotes").hidden};
      const noteSum=()=>{const t=notesTotal();q("#eCnt").textContent=t?"Note count: "+rs(t):"Count notes";if(t)q("#eAmt").value=t};
      box.querySelectorAll("[data-en]").forEach(i=>i.oninput=noteSum);
      box.querySelectorAll("#eNotes [data-d]").forEach(b=>b.onclick=()=>{const i=q('[data-en="'+b.dataset.d+'"]');i.value=Math.max(0,(Math.floor(num(i.value))||0)+Number(b.dataset.s))||"";noteSum()});
      q("#eGst").onchange=()=>{q("#eGstBox").hidden=!q("#eGst").checked};
      function drawPhotos(){q("#ePhs").innerHTML=files.map((f,i)=>'<span><img alt="bill photo" src="'+URL.createObjectURL(f)+'"><button type="button" data-rm="'+i+'" aria-label="Remove">✕</button></span>').join("");
        q("#ePhs").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{files.splice(Number(b.dataset.rm),1);drawPhotos()})}
      box.querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>q("#"+b.dataset.ph).click());
      function drawCq(){q("#eCqPhs").innerHTML=cqFiles.map((f,i)=>'<span><img alt="cheque photo" src="'+URL.createObjectURL(f)+'"><button type="button" data-rm="'+i+'" aria-label="Remove">✕</button></span>').join("");
        q("#eCqPhs").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{cqFiles.splice(Number(b.dataset.rm),1);drawCq()})}
      ["#eCqCam","#eCqGal"].forEach(id=>q(id).onchange=e=>{for(const f of e.target.files){if(cqFiles.length<5)cqFiles.push(f)}e.target.value="";drawCq()});
      ["#eCam","#eGal"].forEach(id=>q(id).onchange=e=>{for(const f of e.target.files){if(files.length<5)files.push(f)}e.target.value="";drawPhotos()});
      q("#eKind").querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{st.kind=b.dataset.k;paint()});
      paint();if(pre.amount)q("#eAmt").value=r2(pre.amount);
      setTimeout(()=>q(io&&!pick?"#eParty":"#eAmt").focus(),60);
    }

    // Party payment: on the main party, split over its bills (oldest first / by hand), rest advance
    async function partyPay(party,amount,mode){
      try{if(!PI)PI=await LWBPartyPay.load(client)}catch(e){await ERPShell.alert(e.message);return}
      LWBPartyPay.open({client,info:PI,party:party||"",amount,mode,onSaved:r=>{
        ERPShell.toast?ERPShell.toast(rs(r.amount)+" received from "+r.party+" · "+rs(r.split)+" against bills"+(Number(r.advance)>0.5?" · advance "+rs(r.advance):"")):null;
        outRows=null;PI=null;
        load().then(()=>{const c=C.find(x=>x.src==="PAYMENT"&&x.status==="IN_HAND"&&!x.photos.length&&Date.now()-new Date(x.at)<300000);
          if(c)chequeDetails(c)})}});
    }

    async function addHead(kind,returnId){
      const name=await ERPShell.prompt("Name of the new "+(kind==="IN"?"Cash In":"expense")+" head","",{title:"New head",placeholder:kind==="IN"?"e.g. Commission received":"e.g. Gate pass fee"});
      if(!name||!name.trim())return null;
      try{const id=await rpc("lwb_acc_save_category",{p_id:null,p_kind:kind,p_name:name,p_active:true});
        D.categories=(D.categories||[]).filter(c=>c.id!==id).concat([{id,kind,name:name.trim(),active:true}]);
        if(!returnId)load();return id}
      catch(e){await ERPShell.alert(errText(e));return null}
    }

    function editBank(b){
      b=b||{};
      sheet(b.id?"Edit bank":"Add bank",
        '<div class="f"><label for="bName">Bank name</label><input id="bName" type="text" maxlength="80" value="'+esc(b.name||"")+'" placeholder="e.g. HDFC Current"></div>'+
        '<div class="f"><label for="bAcc">Account no. (last digits)</label><input id="bAcc" type="text" maxlength="40" value="'+esc(b.account_no||"")+'"></div>'+
        '<div class="f2"><div class="f"><label for="bOpen">Opening balance ₹</label><input id="bOpen" type="text" inputmode="decimal" value="'+(b.opening_balance!=null?r2(b.opening_balance):"0")+'"'+(b.id&&!D.is_admin?" disabled":"")+'></div>'+
        '<div class="f"><label>Balance as on</label>'+dateBox("bOpenD",b.opening_date||"",{disabled:b.id&&!D.is_admin})+'</div></div>'+
        (b.id&&D.is_admin?'<label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="bAct"'+(b.active!==false?" checked":"")+' style="width:20px;height:20px"> Active</label>':"")+
        '<p class="acx-note" style="margin:0">Bank balance = opening balance + verified money in − bank payments, from the "as on" date.'+(b.id&&!D.is_admin?" Only Admin changes the opening balance.":"")+'</p>',
        "Save",async box=>{
          const v=s=>box.querySelector(s);
          try{await rpc("lwb_acc_save_bank",{p_id:b.id||null,p_name:v("#bName").value,p_account_no:v("#bAcc").value,p_opening:num(v("#bOpen").value)||0,
            p_opening_date:dval("bOpenD")||null,p_active:v("#bAct")?v("#bAct").checked:true})}
          catch(e){await ERPShell.alert(errText(e));return false}
          load();
        });
    }

    function showLine(l){
      if(!l)return;
      const canCancel=l.src==="ENTRY"&&(D.is_admin||(l.mine&&l.status!=="VERIFIED"))&&!(D.last_close&&l.date<=D.last_close);
      const box=sheet({IN:"Cash In",OUT:"Cash Out",DEPOSIT:"Bank deposit",WITHDRAW:"Cash from bank"}[l.kind]+" · "+rs(l.amount),
        '<div class="kv"><span>Date</span><b>'+dmy(l.date)+' · '+lt(l)+'</b><span>Head</span><b>'+esc(l.category||"")+'</b>'+(l.party?'<span>Party</span><b>'+esc(l.party)+'</b>':"")+
        '<span>Mode</span><b>'+MODE_NAME[l.mode]+'</b>'+(l.ref?'<span>Ref</span><b>'+esc(l.ref)+'</b>':"")+(l.order_no?'<span>PO</span><b>'+esc(l.order_no)+'</b>':"")+
        (bankName(l.bank_id)?'<span>Bank</span><b>'+esc(bankName(l.bank_id))+'</b>':"")+(l.needs_verify?'<span>Bank check</span><b>'+statusTag(l)+(l.v_by?' <small>'+esc(l.v_by)+' · '+dmy(istDay(l.v_at))+'</small>':"")+(l.v_note?'<br><small>'+esc(l.v_note)+'</small>':"")+'</b>':"")+
        '<span>From</span><b>'+esc(SRC_NAME[l.src]||"")+'</b>'+(l.by?'<span>By</span><b>'+esc(l.by)+'</b>':"")+(l.remark?'<span>Note</span><b>'+esc(l.remark)+'</b>':"")+
        (l.x&&l.x.staff?'<span>Staff</span><b>'+esc(l.x.staff)+'</b>':"")+(l.veh?'<span>Vehicle</span><b>🚚 '+esc(l.veh.vehicle)+'</b>':"")+(l.x&&l.x.gst_bill?'<span>GST bill</span><b>Yes'+(l.x.gst_amount?" · GST "+rs(l.x.gst_amount):"")+(l.x.gstin?" · "+esc(l.x.gstin):"")+'</b>':"")+
        (l.x&&l.x.notes?'<span>Note count</span><b>'+Object.keys(l.x.notes).sort((a,b)=>b-a).map(k=>"₹"+k+" × "+l.x.notes[k]).join(", ")+'</b>':"")+'</div>'+
        (l.x&&l.x.photos&&l.x.photos.length?'<div class="phs" id="lPhs">'+l.x.photos.map(()=>'<span></span>').join("")+'</div>':"")+
        (l.src!=="ENTRY"?'<p class="acx-note" style="margin:0">This came from '+esc(SRC_NAME[l.src])+'. Change or cancel it there.</p>':"")+
        '<div style="display:flex;gap:8px;flex-wrap:wrap">'+(canCancel?'<button type="button" class="acx-btn red" data-cancel>Cancel this entry</button>':"")+
        (D.is_admin&&l.needs_verify&&l.status!=="PENDING"?'<button type="button" class="acx-btn" data-unv>Back to waiting check</button>':"")+'</div>',
        "",null);
      if(l.x&&l.x.photos&&l.x.photos.length)l.x.photos.forEach(async(pth,i)=>{const r=await client.storage.from("lwb-acc-bills").createSignedUrl(pth,3600);
        const sp=box.querySelectorAll("#lPhs span")[i];if(sp&&r.data)sp.innerHTML='<a href="'+esc(r.data.signedUrl)+'" target="_blank" rel="noopener"><img alt="bill photo" src="'+esc(r.data.signedUrl)+'"></a>'});
      const c=box.querySelector("[data-cancel]");
      if(c)c.onclick=async()=>{const why=await ERPShell.prompt("Why cancel this entry? It stays in the record as cancelled.","",{title:"Cancel entry",placeholder:"e.g. entered twice"});if(why==null)return;
        if(await act(c,()=>rpc("lwb_acc_cancel_entry",{p_id:l.id,p_reason:why})))box.remove(),document.body.style.overflow=""};
      const u=box.querySelector("[data-unv]");
      if(u)u.onclick=async()=>{if(await act(u,()=>rpc("lwb_acc_unverify_line",{p_src:l.src,p_id:l.id})))box.remove(),document.body.style.overflow=""};
    }

    /* ---------- night close ---------- */
    async function closeDay(){
      if(!D.last_close){await ERPShell.alert("Set the opening cash first (box at the top).");return}
      const day=shift(D.last_close,1);
      if(day>D.today){await ERPShell.alert("Today ("+dmy(D.today)+") is already closed.");return}
      let info;
      try{const {data,error}=await client.rpc("lwb_acc_dashboard",{p_from:day,p_to:day});if(error)throw error;info=data}catch(e){await ERPShell.alert(errText(e));return}
      const L=info.lines,sum=f=>L.filter(f).reduce((a,l)=>a+Number(l.amount),0);
      const cin=sum(l=>l.kind==="IN"&&l.mode==="CASH"),cout=sum(l=>l.kind==="OUT"&&l.mode==="CASH"),dep=sum(l=>l.kind==="DEPOSIT"),wd=sum(l=>l.kind==="WITHDRAW");
      const book=r2(Number(info.opening)+cin-cout-dep+wd);
      const holders=info.holders||[];
      const body=(day<D.today?'<div class="acx-msg">'+dmy(day)+' was not closed. Close it first; then close the next day.</div>':"")+
        '<div class="calc"><div><span>Opening cash</span><b>'+rs(info.opening)+'</b></div><div><span>+ Cash In</span><b class="plus">'+rs(cin)+'</b></div><div><span>− Cash Out</span><b class="minus">'+rs(cout)+'</b></div><div><span>− Bank deposit</span><b>'+rs(dep)+'</b></div>'+(wd?'<div><span>+ Cash from bank</span><b>'+rs(wd)+'</b></div>':"")+'<div class="tot"><span>Cash should be</span><span>'+rs(book)+'</span></div></div>'+
        '<div class="f"><label>Count the notes</label><div class="notes">'+NOTE_KEYS.map(k=>'<div class="note"><b>₹'+k+'</b><button type="button" data-d="'+k+'" data-s="-1" aria-label="less">−</button><input type="text" inputmode="numeric" data-n="'+k+'" placeholder="0" aria-label="'+k+' notes"><button type="button" data-d="'+k+'" data-s="1" aria-label="more">+</button></div>').join("")+
        '<div class="note" style="grid-template-columns:62px 1fr"><b>Coins</b><input type="text" inputmode="decimal" data-n="coins" placeholder="₹ 0" aria-label="coins amount"></div></div></div>'+
        '<div class="diff ok" id="cDiff"></div>'+
        '<div class="f"><label>Hand over the cash to</label><div class="pills" id="cTo">'+holders.map(h=>'<button type="button" data-h="'+h.id+'">'+esc(h.name)+' · '+(h.role==="admin"?"Admin":"Sales Head")+'</button>').join("")+'<button type="button" data-h="">Keep in office safe</button></div></div>'+
        '<div class="f"><label for="cNote">Note</label><input id="cNote" type="text" maxlength="300" placeholder="Required if cash is short / extra"></div>';
      let holder=null;
      const box=sheet("Close day "+dmy(day)+" · cash handover",body,"Close day & hand over",async b=>{
        const notes={};b.querySelectorAll("[data-n]").forEach(i=>{const v=num(i.value);if(v>0)notes[i.dataset.n]=i.dataset.n==="coins"?r2(v):Math.floor(v)});
        const counted=calc(),note=b.querySelector("#cNote").value.trim();
        if(holder===null){await ERPShell.alert("Choose who gets the cash (or Keep in office safe)");return false}
        if(Math.abs(counted-book)>=1&&!note){await ERPShell.alert("Cash is "+(counted<book?"short":"extra")+" by "+rs(Math.abs(counted-book))+". Write a note why.");return false}
        const hn=holder?(holders.find(h=>h.id===holder)||{}).name:"office safe";
        if(!await ERPShell.confirm("Close "+dmy(day)+" with "+rs(counted)+" cash, handed to "+hn+"?"))return false;
        try{await rpc("lwb_acc_close_day",{p_date:day,p_notes:notes,p_handed_to:holder||null,p_note:note||null})}catch(e){await ERPShell.alert(errText(e));return false}
        load();
      },"pri");
      function calc(){let t=0;box.querySelectorAll("[data-n]").forEach(i=>{const v=num(i.value);if(v>0)t+=i.dataset.n==="coins"?v:Number(i.dataset.n)*Math.floor(v)});
        t=r2(t);const d=r2(t-book),c=box.querySelector("#cDiff");
        c.className="diff "+(Math.abs(d)<1?"ok":"bad");
        c.textContent="Counted "+rs(t)+(Math.abs(d)<1?" ✓ matches":" · "+(d<0?"short ":"extra ")+rs(Math.abs(d)));return t}
      box.querySelectorAll("[data-n]").forEach(i=>i.oninput=calc);
      box.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const i=box.querySelector('[data-n="'+b.dataset.d+'"]');i.value=Math.max(0,(Math.floor(num(i.value))||0)+Number(b.dataset.s))||"";calc()});
      box.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{holder=b.dataset.h;box.querySelectorAll("[data-h]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)))});
      calc();
    }

    async function cashBack(id){
      const c=(D.closes||[]).find(x=>String(x.id)===String(id));if(!c)return;
      sheet("Cash received back",
        '<p style="margin:0;font-size:15px">'+esc(c.handed_to_name||"")+' had <b>'+rs(c.counted)+'</b> from '+dmy(c.date)+' night.</p>'+
        '<div class="f"><label for="rAmt">Cash received now ₹</label><input id="rAmt" class="big" type="text" inputmode="decimal" value="'+r2(c.counted)+'"></div>'+
        '<div class="f"><label for="rNote">Note</label><input id="rNote" type="text" maxlength="300" placeholder="Required if the amount is different"></div>',
        "Confirm received",async b=>{
          try{await rpc("lwb_acc_cash_returned",{p_close_id:c.id,p_amount:num(b.querySelector("#rAmt").value),p_note:b.querySelector("#rNote").value||null})}
          catch(e){await ERPShell.alert(errText(e));return false}
          load();
        },"grn");
    }

    /* ---------- wiring ---------- */
    document.addEventListener("click",e=>{
      const t=e.target.closest("[data-tab],[data-return],[data-reopen]");if(!t)return;
      if(t.dataset.tab){e.preventDefault();tab=t.dataset.tab;renderTab();el("tabs").scrollIntoView({behavior:"smooth",block:"start"})}
      else if(t.dataset.return)cashBack(t.dataset.return);
      else if(t.dataset.reopen)(async()=>{const why=await ERPShell.prompt("Reopen this day? Cash count and handover are cancelled (kept in record). Write why.","",{title:"Reopen day"});if(why==null)return;act(t,()=>rpc("lwb_acc_reopen_day",{p_close_id:Number(t.dataset.reopen),p_reason:why}))})();
    });
    el("tabs").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;renderTab()});
    el("period").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{setPeriod(b.dataset.p);load()});
    el("pDates").innerHTML=dateBox("pFrom",from,{label:"From date"})+dateBox("pTo",to,{label:"To date"});
    ["pFrom","pTo"].forEach(id=>el(id).addEventListener("change",()=>{
      const f=dval("pFrom"),t=dval("pTo");if(!f||!t)return;
      from=f<=t?f:t;to=f<=t?t:f;per="custom";el("period").querySelectorAll("[data-p]").forEach(b=>b.setAttribute("aria-pressed","false"));load()}));
    el("reload").onclick=()=>{outRows=null;load()};
    el("ppayBtn").onclick=()=>D&&partyPay("");
    document.querySelectorAll("[data-new]").forEach(b=>b.onclick=()=>D&&newEntry(b.dataset.new));
    el("closeBtn").onclick=()=>D&&closeDay();
    let wasWide=wide();
    window.addEventListener("resize",()=>{if(wide()!==wasWide){wasWide=wide();if(D&&tab==="book")renderBook()}});

    (async()=>{
      const {data:{session}}=await client.auth.getSession();
      if(!session){location.replace("login.html");return}
      const {data:p}=await client.from("user_profiles").select("full_name,role,active").eq("id",session.user.id).single();
      const realRole=String((p&&p.role)||"").toLowerCase().trim(),role=p?await ERPShell.pageRoleFresh(realRole):realRole;
      if(!p||p.active!==true||!["admin","accounts"].includes(role)){location.replace("dashboard.html");return}
      me={id:session.user.id,role:realRole};
      ERPShell.mount({role:realRole||role,name:p.full_name||session.user.email,onLogout:async()=>{await client.auth.signOut();location.replace("login.html")}});
      el("loading").hidden=true;el("page").hidden=false;
      if(location.hash==="#verify")tab="verify";if(location.hash==="#cheques")tab="cheques";
      setPeriod("today");
      await load();
    })();
  </script>
</body>
</html>
