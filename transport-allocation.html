<script>
'use strict';
const SUPABASE_URL='https://txkbhadzdbxpieunfvox.supabase.co';
// Browser publishable key, matching the existing login.html configuration.
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_W4I3Q5ODf0g17sq5uDml2Q_sLolXYEk';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let user=null,orders=[],assignments=[],selected=null,busy=false;
// Trips (trip-rent.js + lwb_trip_rent_setup.sql): picked POs go in one trip; Own / Transport / Porter + Porter rent.
let picked=new Set(),targets=[],tripUi=null,tripJoin=null,tripOf=new Map(),myName='';
const $=id=>document.getElementById(id);
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(Number(n)||0);
const number=n=>new Intl.NumberFormat('en-IN',{maximumFractionDigits:2}).format(Number(n)||0);
const date=s=>LWBDate.dt(s,'—');
const status=s=>String(s||'').toLowerCase().trim();
const approvedStatuses=new Set(['approved','approved_next','manager_approved','warehouse_approved']);
const allocatedStatuses=new Set(['transport_allocated','allocated','loading','loaded','invoiced']);
function notice(msg,error=false){$('message').textContent=msg;$('message').className='message show '+(error?'error':'ok');}
function detail(label,value){return `<div class="detail"><small>${safe(label)}</small><b>${safe(value)}</b></div>`;}
async function init(){try{const {data:{user:u},error:e}=await db.auth.getUser();if(e||!u){location.href='login.html';return;}user=u;const {data:profile,error:pe}=await db.from('user_profiles').select('full_name,role,active').eq('id',u.id).maybeSingle();if(pe)throw pe;if(profile)profile.role=await lwbPageRole(profile.role);if(!profile||profile.active===false||!['admin','manager','transport'].includes(String(profile.role).toLowerCase())){notice('Access denied. Admin, Manager or Transport role required.',true);return;}$('username').textContent=profile.full_name||u.email;myName=profile.full_name||'';await loadFleet();await loadGodownManagers();await load();}catch(e){notice('Unable to initialize: '+e.message,true);}}
// Godown Manager (WAREHOUSE login) who loads the vehicle (lwb_loading_workflow_setup.sql); old free text until then.
let godownManagers=null;
async function loadGodownManagers(){const r=await db.rpc('lwb_godown_managers');godownManagers=r.error?null:(r.data||[]);const sel=$('loadingManager'),txt=$('loadingPerson');sel.hidden=!godownManagers;txt.hidden=!!godownManagers;txt.required=!godownManagers;sel.required=!!godownManagers;if(godownManagers)sel.replaceChildren(new Option('Select Godown Manager',''),...godownManagers.map(m=>new Option(m.full_name+(m.mobile?' · '+m.mobile:''),m.user_id)));}
// Drivers from Employee Master (Work / Post = Driver) and Vehicle Master suggestions. Choosing a driver fills the mobile, and the
// default vehicle when the vehicle box is empty. Missing tables (SQL not run yet) are ignored.
let fleetDrivers=[],fleetVehicles=[];
async function loadFleet(){const [d,v]=await Promise.all([db.rpc('lwb_staff_pick',{p_role:'driver'}),db.rpc('lwb_vehicle_pick')]);
let veh=v;if(veh.error)veh=await db.from('lwb_vehicles').select('id,vehicle_no,vehicle_type,transporter_name,ownership').eq('is_active',true).order('vehicle_no');
const trip=x=>x.on_trip&&x.on_trip.length?'On trip: '+x.on_trip.join(', '):('on_trip' in x?'Free':''),freeFirst=(a,b)=>(a.on_trip?1:0)-(b.on_trip?1:0);
fleetDrivers=d.error?[]:(d.data||[]).slice().sort(freeFirst).map(x=>({driver_name:x.name,mobile:x.mobile||'',default_vehicle_id:x.default_vehicle_id,transporter_name:x.transporter_name,status:trip(x)}));fleetVehicles=veh.error?[]:(veh.data||[]).slice().sort(freeFirst).map(x=>({...x,status:trip(x)}));
const opt=(val,label)=>{const o=document.createElement('option');o.value=val;o.label=label;return o;};
$('driverList').replaceChildren(...fleetDrivers.map(x=>opt(x.driver_name,[x.mobile,x.status].filter(Boolean).join(' · '))));
$('vehicleList').replaceChildren(...fleetVehicles.map(x=>opt(x.vehicle_no,[x.status,x.vehicle_type,x.transporter_name].filter(Boolean).join(' · '))));}
function fleetPickDriver(){const n=$('driverName').value.trim().toLowerCase();const hits=fleetDrivers.filter(x=>x.driver_name.trim().toLowerCase()===n);if(hits.length!==1)return;const d=hits[0];$('driverMobile').value=d.mobile;
const v=fleetVehicles.find(x=>x.id===d.default_vehicle_id);if(v&&!$('vehicleNo').value.trim())$('vehicleNo').value=v.vehicle_no;if(d.transporter_name&&!$('transporterName').value.trim())$('transporterName').value=d.transporter_name;}
function fleetPickVehicle(){const k=$('vehicleNo').value.toUpperCase().replace(/[^A-Z0-9]/g,'');const v=fleetVehicles.find(x=>x.vehicle_no===k);if(v&&v.transporter_name&&!$('transporterName').value.trim())$('transporterName').value=v.transporter_name;}
async function load(){try{const o=await db.from('orders').select('*').order('order_date',{ascending:false}).limit(500);if(o.error)throw o.error;orders=ERPRecent.sort(o.data||[]).map((x,i)=>[x,i]).sort((a,b)=>prioRank(a[0])-prioRank(b[0])||a[1]-b[1]).map(p=>p[0]);
// Read assignments only for the listed orders, so old rows beyond any row limit are never missed.
assignments=[];const ids=orders.map(x=>x.id);
for(let i=0;i<ids.length;i+=100){const a=await db.from('dispatch_assignments').select('*').in('order_id',ids.slice(i,i+100));if(a.error)throw a.error;assignments.push(...(a.data||[]));}
if(window.LWBTrip)tripOf=await LWBTrip.ofOrders(db,assignments.filter(a=>a.trip_id).map(a=>a.order_id));
render();if(window.LWBSuggest){await sugLoad();render();}}catch(e){notice('Could not load orders: '+e.message,true);}}
function assignmentFor(id){return assignments.find(a=>a.order_id===id);}
function stage(o){const st=status(o.status);if(allocatedStatuses.has(st))return 'allocated';if(approvedStatuses.has(st))return assignmentFor(o.id)?'allocated':'ready';return 'other';}
const prioOf=o=>['URGENT','HIGH'].includes(String(o.priority||'').toUpperCase())?String(o.priority).toUpperCase():'NORMAL';
const prioRank=o=>({URGENT:0,HIGH:1,NORMAL:2})[prioOf(o)];
const prioBadge=o=>prioOf(o)==='NORMAL'?'':`<span class="prio prio-${prioOf(o)}">${prioOf(o)}</span>`;
function rowHtml(o,extra=''){return `<tr><td class="ck"><input type="checkbox" data-pick="${safe(o.id)}" ${picked.has(o.id)?'checked':''} aria-label="Select ${safe(o.order_no)}"></td><td><b>${safe(o.order_no)}</b>${prioBadge(o)}</td><td>${safe(date(o.order_date))}</td><td>${safe(o.customer_name)}${extra?'<div class="xrow">'+extra+'</div>':''}</td><td>${safe(o.sales_person)}</td><td>${number(o.total_qty)}</td><td>${money(o.total_amount)}</td><td class="nw">${number(o.total_weight)} KG</td><td><span class="pill ${stage(o)==='allocated'?'allocated':''}">${stage(o)==='allocated'?'ALLOCATED':'APPROVED'}</span>${tripTag(o)}</td><td><div class="acts"><button class="primary" data-order="${safe(o.id)}">${stage(o)==='allocated'?'Edit':'Allocate'}</button></div></td></tr>`;}
// One place (Mohit, 7 Nov 2026): 🧩 Merge (small POs, nearby ones in one vehicle) · 🚛 Full load (one PO fills a vehicle)
// · ✓ Assigned (vehicle given, until loading starts) · 🏬 Self Pickup (party takes it from the godown) · All.
const TA_TABS=[['merge','🧩 Merge'],['full','🚛 Full load'],['assigned','✓ Assigned'],['pickup','🏬 Self Pickup'],['all','All']];
let taTab='merge';try{const t=localStorage.getItem('lwbTaTab');if(TA_TABS.some(x=>x[0]===t))taTab=t;}catch(_){}
const isSelfPickupTA=o=>String(o&&o.transportation||'').split('|')[0].trim().toUpperCase()==='SELF PICKUP';
const fullKg=()=>{try{return Number(localStorage.getItem('lwbFullLoadKg'))||3000;}catch(_){return 3000;}};
const isFullTA=o=>(Number(o.total_weight)||0)>=fullKg();
const loadingStarted=o=>['loading','loaded','invoiced'].includes(status(o.status));
function taLists(){const ready=orders.filter(o=>stage(o)==='ready'),alloc=orders.filter(o=>stage(o)==='allocated');
  return {merge:ready.filter(o=>!isSelfPickupTA(o)&&!isFullTA(o)),full:ready.filter(o=>!isSelfPickupTA(o)&&isFullTA(o)),assigned:alloc.filter(o=>!loadingStarted(o)),pickup:ready.filter(isSelfPickupTA),all:[...ready,...alloc]};}

async function saveAllocation(e){
  e.preventDefault();
  if(!selected||busy)return;
  const list=targets.length?targets.slice():[selected];
  const base={
    loading_person:$('loadingPerson').value.trim(),
    driver_name:$('driverName').value.trim(),
    driver_mobile:$('driverMobile').value.trim()||null,
    vehicle_no:$('vehicleNo').value.trim().toUpperCase(),
    transporter_name:$('transporterName').value.trim()||null,
    remarks:$('remarks').value.trim()||null,
    assigned_by:user.id
  };
  if(godownManagers){
    const sel=$('loadingManager'),m=godownManagers.find(x=>x.user_id===sel.value);
    base.loading_manager_id=sel.value||null;
    base.loading_person=m?m.full_name:(sel.value?sel.selectedOptions[0].text.replace(/ \(inactive\)$/,''):'');
  }
  if(!base.loading_person||!base.driver_name||!base.vehicle_no){
    notice('Godown Manager, Driver and Vehicle Number are required.',true);return;
  }
  if(base.driver_mobile){
    // Driver Portal and its notification match this exact mobile, so reject typos.
    const digits=String(base.driver_mobile||'').replace(/\D/g,'');
    if(!(/^[6-9]\d{9}$/.test(digits)||/^91[6-9]\d{9}$/.test(digits))){
      notice('Enter a valid Driver Mobile (10 digits or +91). Driver app and its notification use this number.',true);
      return;
    }
    base.driver_mobile=digits.slice(-10);
  }
  const tk=tripUi?tripUi.get():null;
  busy=true;$('save').disabled=true;$('save').textContent='Saving...';
  const ok=[],failed=[];let trip=null;
  try{
    // 1) the trip (one for all picked POs). Rent of a Porter is optional here.
    if(window.LWBTrip){
      const p={vehicle_no:base.vehicle_no,kind:tk&&tk.kind||'',driver_name:base.driver_name,driver_mobile:base.driver_mobile,owner:base.transporter_name,order_id:String(list[0].id)};
      if(tripJoin&&!$('tripJoin').hidden){if($('tripJoinOn').checked)p.trip_id=tripJoin.id;else p.new=true;}
      else if(list.length>1)p.new=true;
      if(tk&&tk.kind==='PORTER'){p.rent=tk.rent;p.pay_mode=tk.pay_mode;p.paid_by=tk.paid_by;}
      trip=await LWBTrip.open(db,p);
    }
    // 2) every PO gets the same driver / vehicle / trip
    for(const current of list){
      try{
        const existing=assignmentFor(current.id);
        const payload={...base,order_id:current.id};if(trip)payload.trip_id=trip.id;
        const latest=await db.from('orders').select('status').eq('id',current.id).single();
        if(latest.error)throw latest.error;
        const latestStatus=status(latest.data.status);
        if(!['approved','approved_next','manager_approved','warehouse_approved','transport_allocated','allocated'].includes(latestStatus))
          throw Error('no longer available for transport assignment. Loading or billing may have started.');
        let result;
        if(existing){
          result=await db.from('dispatch_assignments').update(payload).eq('id',existing.id).select('id').single();
        }else{
          result=await db.from('dispatch_assignments').insert(payload).select('id').single();
        }
        if(result.error)throw result.error;
        if(latestStatus!=='transport_allocated'){
          const {data:updated,error:orderError}=await db.from('orders')
            .update({status:'transport_allocated'}).eq('id',current.id)
            .eq('status',latest.data.status).select('id');
          if(orderError)throw new Error('assignment saved, but status update failed: '+orderError.message);
          if(!updated?.length)throw Error('assignment saved, but PO status changed. Refresh before retry.');
        }
        ok.push(current.order_no);
      }catch(err){failed.push(current.order_no+': '+err.message);}
    }
    if(!ok.length)throw Error(failed.join(' | '));
    $('overlay').classList.remove('show');
    selected=null;targets=[];picked.clear();
    const tripTxt=trip?' Trip '+trip.trip_no+(list.length>1||tripJoin&&$('tripJoinOn').checked?' (one rent for the trip)':'')+'.':'';
    const rentTxt=trip&&trip.kind==='PORTER'&&!trip.rent?' Porter rent not entered: a reminder will ask for it after 2 hours.':'';
    notice('Vehicle/Driver SAVED for '+ok.join(', ')+'.'+tripTxt+rentTxt+' '+(base.driver_mobile?'Driver and Dispatch team notified in the ERP.':'Dispatch team notified in the ERP. No driver mobile entered, so the driver was not notified.')+(failed.length?' NOT saved: '+failed.join(' | '):''),failed.length>0);
    await load();
  }catch(err){
    notice('Save failed: '+err.message,true);
  }finally{
    busy=false;$('save').disabled=false;$('save').textContent='Save Allocation';
  }
}

    {t:"Driver",v:o=>(assignmentFor(o.id)||{}).driver_name||""},{t:"Vehicle",v:o=>(assignmentFor(o.id)||{}).vehicle_no||""},
    {t:"Cases",v:"total_qty",num:true,sum:true,dec:0},{t:"Weight kg",v:"total_weight",num:true,sum:true,dec:0},{t:"Amount",v:"total_amount",money:true,sum:true}];
  const list=(test,title,sub)=>()=>({title,sub,cols:cols(),rows:orders.filter(o=>test(stage(o))),onRow:o=>openOrder(o.id)});
  ERPList.ids({
    approvedCount:list(s=>s==="ready","Approved Orders","Approved, transport not allocated yet"),
    allocatedCount:list(s=>s==="allocated","Allocated Orders","Driver / vehicle allocated"),
    totalCount:list(s=>s==="ready"||s==="allocated","Total Listed","Approved + allocated orders")
  });
})();
</script>
</body></html>
