<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transport Allocation | Luxury Wrist Brand</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#182230;font:15px Arial,sans-serif}header{background:#111;color:white;padding:20px 4%;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header h2{margin:0;letter-spacing:1px}header small{color:#ccd3df;letter-spacing:2px}main{max-width:1400px;margin:28px auto;padding:0 20px}h1{margin-bottom:5px}p{color:#667085}.panel,.stat{background:white;border:1px solid #e2e6ed;border-radius:12px;padding:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}.stat strong{font-size:29px;display:block;margin-top:10px}.stat span{color:#667085}button,.link{border:0;border-radius:7px;padding:11px 15px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:#1769df;color:white}.green{background:#098345;color:white}.secondary{background:#e9edf3;color:#172033}.danger{background:#ba2633;color:white}.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}input,select,textarea{border:1px solid #cfd5df;border-radius:7px;padding:11px;font:inherit;width:100%;background:white}textarea{min-height:90px;resize:vertical}.toolbar input{flex:1;min-width:220px}.toolbar select{width:210px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:930px}th{background:#f0f2f6;text-align:left;font-size:12px;padding:14px 10px}td{padding:13px 10px;border-top:1px solid #e5e8ee}tr:hover{background:#fafbfc}.pill{border-radius:30px;padding:7px 10px;background:#fff1c9;color:#7b5200;font-size:12px;font-weight:bold;white-space:nowrap}.allocated{background:#d9f7e7;color:#06653a}.message{margin:12px 0;padding:13px;border-radius:8px;display:none}.message.show{display:block}.message.error{background:#ffe5e5;color:#a11320}.message.ok{background:#dcf7e7;color:#075a30}.overlay{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.overlay.show{display:flex}.modal{background:white;width:min(950px,100%);max-height:95vh;overflow:auto;border-radius:12px}.modalhead{background:#111;color:white;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0;font-size:19px}.modalbody{padding:22px}.details{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.detail{border:1px solid #e0e4ea;background:#fafafa;border-radius:8px;padding:12px}.detail small{display:block;color:#667085;margin-bottom:7px}.detail b{overflow-wrap:anywhere}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.field label{font-weight:bold;display:block;margin-bottom:7px}.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}.muted{color:#667085}.empty{text-align:center;padding:45px;color:#667085}@media(max-width:720px){.stats{grid-template-columns:1fr}.details{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:1fr}.full{grid-column:auto}header{padding:18px}main{padding:0 12px}}
</style>
</head>
<body>
<header><div><h2>LUXURY WRIST BRAND</h2><small>TRANSPORT ALLOCATION</small></div><div><span id="username"></span> &nbsp; <a class="link secondary" href="dashboard.html">Dashboard</a> <button class="secondary" id="logout">Logout</button></div></header>
<main>
<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px"><div><h1>Transport Allocation</h1><p>Allocate driver, vehicle and loading person to approved orders.</p></div><button class="primary" id="refresh">Refresh Orders</button></div>
<div id="message" class="message"></div>
<div class="stats"><div class="stat"><span>Approved Orders</span><strong id="approvedCount">0</strong></div><div class="stat"><span>Allocated Orders</span><strong id="allocatedCount">0</strong></div><div class="stat"><span>Total Listed</span><strong id="totalCount">0</strong></div></div>
<div class="panel"><div class="toolbar"><input id="search" placeholder="Search order no, customer, sales person..."><select id="filter"><option value="ready">Ready for Allocation</option><option value="allocated">Allocated</option><option value="all">All Orders</option></select></div><div class="tablewrap"><table><thead><tr><th>ORDER NO</th><th>DATE</th><th>CUSTOMER</th><th>SALES PERSON</th><th>QTY</th><th>AMOUNT</th><th>WEIGHT</th><th>STATUS</th><th>ACTION</th></tr></thead><tbody id="rows"><tr><td colspan="9" class="empty">Loading orders...</td></tr></tbody></table></div></div>
</main>
<div id="overlay" class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalhead"><h2 id="modalTitle">Transport Allocation</h2><button class="secondary" id="closeTop">✕</button></div><div class="modalbody"><div class="details" id="details"></div><form id="allocationForm"><div class="fields"><div class="field"><label for="loadingPerson">Loading Person *</label><input id="loadingPerson" required maxlength="150"></div><div class="field"><label for="driverName">Driver Name *</label><input id="driverName" required maxlength="150"></div><div class="field"><label for="driverMobile">Driver Mobile</label><input id="driverMobile" inputmode="tel" maxlength="20" placeholder="Optional"></div><div class="field"><label for="vehicleNo">Vehicle Number *</label><input id="vehicleNo" required maxlength="40" placeholder="GJ05AB1234"></div><div class="field full"><label for="transporterName">Transporter Name</label><input id="transporterName" maxlength="150"></div><div class="field full"><label for="remarks">Remarks</label><textarea id="remarks" maxlength="1500"></textarea></div></div><div class="actions"><button type="button" class="secondary" id="closeBottom">Close</button><button type="submit" class="green" id="save">Save Allocation</button></div></form></div></section></div>
<script>
'use strict';
const SUPABASE_URL='https://txkbhadzdbxpieunfvox.supabase.co';
// Browser publishable key, matching the existing login.html configuration.
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_W4I3Q5ODf0g17sq5uDml2Q_sLolXYEk';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let user=null,orders=[],assignments=[],selected=null,busy=false;
const $=id=>document.getElementById(id);
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(Number(n)||0);
const number=n=>new Intl.NumberFormat('en-IN',{maximumFractionDigits:2}).format(Number(n)||0);
const date=s=>s?new Date(s).toLocaleString('en-IN'):'—';
const status=s=>String(s||'').toLowerCase().trim();
const approvedStatuses=new Set(['approved','approved_next']);
const allocatedStatuses=new Set(['transport_allocated','allocated','loading','loaded','invoiced']);
function notice(msg,error=false){$('message').textContent=msg;$('message').className='message show '+(error?'error':'ok');}
function detail(label,value){return `<div class="detail"><small>${safe(label)}</small><b>${safe(value)}</b></div>`;}
async function init(){try{const {data:{user:u},error:e}=await db.auth.getUser();if(e||!u){location.href='login.html';return;}user=u;const {data:profile,error:pe}=await db.from('user_profiles').select('full_name,role,active').eq('id',u.id).maybeSingle();if(pe)throw pe;if(!profile||profile.active===false||!['admin','manager','transport'].includes(String(profile.role).toLowerCase())){notice('Access denied. Admin, Manager or Transport role required.',true);return;}$('username').textContent=profile.full_name||u.email;await load();}catch(e){notice('Unable to initialize: '+e.message,true);}}
async function load(){try{const [o,a]=await Promise.all([db.from('orders').select('id,order_no,order_date,customer_name,sales_person,transportation,status,total_qty,total_amount,total_weight').order('order_date',{ascending:false}).limit(500),db.from('dispatch_assignments').select('id,order_id,loading_person,driver_name,driver_mobile,vehicle_no,transporter_name,remarks,assigned_at').limit(500)]);if(o.error)throw o.error;if(a.error)throw a.error;orders=o.data||[];assignments=a.data||[];render();}catch(e){notice('Could not load orders: '+e.message,true);}}
function assignmentFor(id){return assignments.find(a=>a.order_id===id);}
function stage(o){return assignmentFor(o.id)||allocatedStatuses.has(status(o.status))?'allocated':approvedStatuses.has(status(o.status))?'ready':'other';}
function render(){const available=orders.filter(o=>stage(o)==='ready'||stage(o)==='allocated');$('approvedCount').textContent=available.filter(o=>stage(o)==='ready').length;$('allocatedCount').textContent=available.filter(o=>stage(o)==='allocated').length;$('totalCount').textContent=available.length;const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const list=available.filter(o=>(f==='all'||stage(o)===f)&&[o.order_no,o.customer_name,o.sales_person].some(v=>String(v||'').toLowerCase().includes(q)));$('rows').innerHTML=list.length?list.map(o=>`<tr><td><b>${safe(o.order_no)}</b></td><td>${safe(date(o.order_date))}</td><td>${safe(o.customer_name)}</td><td>${safe(o.sales_person)}</td><td>${number(o.total_qty)}</td><td>${money(o.total_amount)}</td><td>${number(o.total_weight)} KG</td><td><span class="pill ${stage(o)==='allocated'?'allocated':''}">${stage(o)==='allocated'?'ALLOCATED':'APPROVED'}</span></td><td><button class="primary" data-order="${safe(o.id)}">${stage(o)==='allocated'?'View / Edit':'Allocate'}</button></td></tr>`).join(''):'<tr><td colspan="9" class="empty">No orders found for this filter.</td></tr>';}
function openOrder(id){const o=orders.find(x=>x.id===id);if(!o)return;selected=o;const a=assignmentFor(id)||{};$('modalTitle').textContent='Transport Allocation - '+(o.order_no||'');$('details').innerHTML=detail('ORDER NO',o.order_no)+detail('CUSTOMER',o.customer_name)+detail('DATE',date(o.order_date))+detail('SALES PERSON',o.sales_person)+detail('QUANTITY',number(o.total_qty))+detail('AMOUNT',money(o.total_amount))+detail('WEIGHT',number(o.total_weight)+' KG')+detail('TRANSPORTATION',o.transportation);$('loadingPerson').value=a.loading_person||'';$('driverName').value=a.driver_name||'';$('driverMobile').value=a.driver_mobile||'';$('vehicleNo').value=a.vehicle_no||'';$('transporterName').value=a.transporter_name||o.transportation||'';$('remarks').value=a.remarks||'';$('overlay').classList.add('show');}
function closeModal(){if(!busy){$('overlay').classList.remove('show');selected=null;}}
async function saveAllocation(e){e.preventDefault();if(!selected||busy)return;const current=selected;const existing=assignmentFor(current.id);const payload={order_id:current.id,loading_person:$('loadingPerson').value.trim(),driver_name:$('driverName').value.trim(),driver_mobile:$('driverMobile').value.trim()||null,vehicle_no:$('vehicleNo').value.trim().toUpperCase(),transporter_name:$('transporterName').value.trim()||null,remarks:$('remarks').value.trim()||null,assigned_by:user.id};if(!payload.loading_person||!payload.driver_name||!payload.vehicle_no){notice('Loading Person, Driver and Vehicle Number are required.',true);return;}busy=true;$('save').disabled=true;$('save').textContent='Saving...';try{let r;if(existing){r=await db.from('dispatch_assignments').update(payload).eq('id',existing.id).select('id').single();}else{r=await db.from('dispatch_assignments').insert(payload).select('id').single();}if(r.error)throw r.error;const {error:oe}=await db.from('orders').update({status:'transport_allocated'}).eq('id',current.id);if(oe)throw new Error('Allocation saved, but order status update failed: '+oe.message);$('overlay').classList.remove('show');selected=null;notice('Transport allocated successfully for '+current.order_no+'.');await load();}catch(err){notice('Save failed: '+err.message,true);}finally{busy=false;$('save').disabled=false;$('save').textContent='Save Allocation';}}
$('rows').addEventListener('click',e=>{const b=e.target.closest('[data-order]');if(b)openOrder(b.dataset.order);});$('refresh').addEventListener('click',load);$('search').addEventListener('input',render);$('filter').addEventListener('change',render);$('closeTop').addEventListener('click',closeModal);$('closeBottom').addEventListener('click',closeModal);$('allocationForm').addEventListener('submit',saveAllocation);$('logout').addEventListener('click',async()=>{await db.auth.signOut();location.href='login.html';});
init();
</script>
</body></html>
