<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaint Box | Luxury Wrist Brand ERP</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="erp-shell.css">
  <link rel="stylesheet" href="sales.css">
  <script src="erp-shell.js"></script>
  <script src="sales-common.js"></script>
  <style>
    .cb-cats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;grid-column:1/-1}
    .cb-cat{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:11px 12px;border-radius:8px;border:1.5px solid var(--erp-line);background:#fff;cursor:pointer;font:inherit;text-align:left;color:var(--erp-ink)}
    .cb-cat .ic{font-size:21px;line-height:1}.cb-cat b{font-size:14px}.cb-cat small{color:var(--erp-muted);font-size:11.5px}
    .cb-cat.on{border-color:var(--erp-red);background:var(--erp-red-soft)}
    .cb-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .cb-form label{display:block;font-size:12px;font-weight:600;color:#4b5763;margin-bottom:4px}
    .cb-form input,.cb-form textarea{width:100%;box-sizing:border-box;height:42px;border:1.5px solid var(--erp-line);border-radius:6px;padding:0 10px;font:inherit;font-size:16px;background:#fff}
    .cb-form textarea{height:86px;padding:8px 10px;resize:vertical}
    .cb-form .wide{grid-column:1/-1}
    .cb-form .row-end{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .cb-form .urgent{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--erp-red);margin:0}
    .cb-form .urgent input{width:auto;height:auto}
    .cb-new{margin-bottom:14px;height:44px;font-size:15px}
    .cb-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .cb-tab{border:1px solid var(--erp-line);background:#fff;border-radius:18px;padding:7px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--erp-ink)}
    .cb-tab span{margin-left:6px;background:#eef0f3;border-radius:10px;padding:1px 7px;font-size:12px}
    .cb-tab.on{border-color:var(--erp-red);background:var(--erp-red);color:#fff}.cb-tab.on span{background:#fff3;color:#fff}
    .cb-list{display:grid;gap:10px}
    .cb-item{background:#fff;border:1px solid var(--erp-line);border-radius:8px;overflow:hidden}
    .cb-item.urgent{border-left:4px solid var(--erp-red)}
    .cb-item.wait{box-shadow:inset 3px 0 0 var(--erp-amber)}
    .cb-head{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:12px 14px;cursor:pointer}
    .cb-head:hover{background:#fafbfc}
    .cb-head .ic{font-size:20px;grid-row:span 2}
    .cb-head b{font-size:14.5px;overflow-wrap:anywhere}
    .cb-head .badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
    .cb-meta{font-size:12.5px;color:var(--erp-muted);grid-column:2/-1}
    .cb-body{border-top:1px solid var(--erp-line);padding:12px 14px;display:grid;gap:10px;background:#fcfcfd}
    .cb-details{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
    .cb-photo{max-width:200px;max-height:150px;border-radius:6px;border:1px solid var(--erp-line);cursor:pointer;object-fit:cover}
    .cb-thread{display:grid;gap:8px}
    .cb-msg{max-width:85%;border-radius:10px;padding:8px 11px;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
    .cb-msg small{display:block;font-size:11.5px;color:var(--erp-muted);margin-bottom:2px;white-space:normal}
    .cb-msg.office{background:#e5eefb;justify-self:start;border-top-left-radius:2px}
    .cb-msg.staff{background:#fff;border:1px solid var(--erp-line);justify-self:end;border-top-right-radius:2px}
    .cb-msg.sys{background:none;justify-self:center;color:var(--erp-muted);font-size:12.5px;padding:2px}
    .cb-reply textarea{width:100%;box-sizing:border-box;min-height:64px;border:1.5px solid var(--erp-line);border-radius:6px;padding:8px 10px;font:inherit;font-size:16px;resize:vertical}
    .cb-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .cb-solved{font-size:13px;background:#e3f4ea;color:var(--erp-green);border-radius:6px;padding:7px 10px;font-weight:600}
    @media(max-width:900px){.cb-cats{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:560px){
      .cb-cats{grid-template-columns:1fr 1fr}.cb-form{grid-template-columns:1fr}
      .cb-new{width:100%}
      .cb-head{grid-template-columns:auto 1fr}.cb-head .badges{grid-column:2;justify-content:flex-start}
      .cb-btns .sl-btn{flex:1 1 auto;height:40px}
      .cb-msg{max-width:92%}
    }
  </style>
</head>
<body>
  <div id="loading" class="status">Checking account access...</div>
  <main id="page" class="erp-main" hidden>
    <div class="erp-pagehead"><h1>📮 Complaint Box</h1><span class="grow"></span><span class="erp-badge blue" id="who"></span></div>
    <p class="sl-sub" id="sub"></p>

    <button type="button" class="sl-btn cb-new" id="newBtn">+ New Complaint / Query</button>

    <section class="erp-card" id="formCard" hidden style="margin-bottom:14px">
      <div class="erp-card-head"><h2>New Complaint / Query</h2><button type="button" class="sl-btn ghost small" id="cancel">Close</button></div>
      <form class="erp-card-body cb-form" id="form" autocomplete="off">
        <div class="wide"><label>What is it about? *</label></div>
        <div class="cb-cats" id="cats"></div>
        <div class="wide"><label for="f_subject">Problem in short *</label><input id="f_subject" maxlength="150" placeholder="e.g. Party says our rate is high" required></div>
        <div class="wide"><label for="f_details">Details</label><textarea id="f_details" maxlength="2000" placeholder="What happened, where, since when"></textarea></div>
        <div><label for="f_order_no">PO No. (if any)</label><input id="f_order_no" placeholder="PO-1234" style="text-transform:uppercase"></div>
        <div><label for="f_party_name">Party (if any)</label><input id="f_party_name" placeholder="Party name"></div>
        <div class="wide"><label for="f_photo">Photo (optional)</label><input id="f_photo" type="file" accept="image/*" style="height:auto;padding:8px"></div>
        <div class="row-end"><label class="urgent"><input type="checkbox" id="f_urgent"> Urgent</label><span style="flex:1"></span><button type="submit" class="sl-btn" id="send">Send to Admin &amp; Sales Head</button></div>
      </form>
    </section>

    <div class="cb-tabs" id="tabs"></div>
    <div class="sl-filters">
      <div><label for="cat">About</label><select id="cat"><option value="">All</option></select></div>
      <div class="grow"><label for="q">Search</label><input id="q" type="search" placeholder="Complaint no., name, party, PO, words"></div>
      <button type="button" class="sl-btn ghost" id="refresh">Refresh</button>
    </div>
    <div class="cb-list" id="list"></div>
  </main>
  <script>
    const S=LWBSales,{client,el,esc}=S;
    let me=null,rows=[],tab="",openId=0,cat="";
    const replies=new Map(),photos=new Map(),drafts=new Map();
    const office=()=>["admin","manager"].includes(me.realRole);
    const CATS=[["MARKET","🏪","Market","Party, rate, competitor"],["GODOWN","🏭","Godown","Stock, loading, damage"],["DRIVER","🚚","Driver / Delivery","Vehicle, delivery, route"],
      ["ACCOUNTS","💰","Accounts / Payment","Bill, payment, ledger"],["OTHER","📝","Other","Anything else"]];
    const CAT=Object.fromEntries(CATS.map(c=>[c[0],c]));
    const STATE={OPEN:["Waiting for office","amber"],ANSWERED:["Answered","blue"],RESOLVED:["Solved","green"]};
    const when=v=>{if(!v)return "";const d=new Date(v),s=(Date.now()-d)/1000;
      if(s<60)return "just now";if(s<3600)return Math.floor(s/60)+" min ago";if(s<86400)return Math.floor(s/3600)+" hr ago";
      return d.toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit",hour12:true,timeZone:"Asia/Kolkata"})};
    const setupMsg=m=>/lwb_complaint/.test(m||"")?"Run lwb_complaint_box_setup.sql in Supabase first.":m;
    const mine=x=>x.created_by===me.user.id;
    // Waiting for this login: office = OPEN from others; staff = office answered his complaint.
    const waiting=x=>office()&&!mine(x)?x.status==="OPEN":x.status==="ANSWERED"&&mine(x);

    function openForm(){
      el("formCard").hidden=false;el("newBtn").hidden=true;
      el("formCard").scrollIntoView({behavior:"smooth",block:"start"});
    }
    function closeForm(){el("form").reset();cat="";drawCats();el("formCard").hidden=true;el("newBtn").hidden=false}
    function drawCats(){
      el("cats").innerHTML=CATS.map(c=>'<button type="button" class="cb-cat'+(cat===c[0]?" on":"")+'" data-cat="'+c[0]+'"><span class="ic">'+c[1]+"</span><b>"+esc(c[2])+"</b><small>"+esc(c[3])+"</small></button>").join("");
    }
    // Phone photos are large: resize to 1280px JPEG before upload.
    function shrink(file){
      return new Promise((ok,bad)=>{
        const img=new Image(),url=URL.createObjectURL(file);
        img.onload=()=>{const s=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement("canvas");
          c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
          URL.revokeObjectURL(url);c.toBlob(b=>b?ok(b):bad(Error("Photo could not be read")),"image/jpeg",0.8)};
        img.onerror=()=>bad(Error("Photo could not be read"));img.src=url;
      });
    }
    async function send(e){
      e.preventDefault();
      const v=id=>String(el("f_"+id).value||"").trim();
      if(!cat){await alert("Please select what the complaint is about (Market, Godown, Driver...).");return}
      if(!v("subject")){await alert("Please enter the problem in short.");return}
      const p={category:cat,subject:v("subject"),details:v("details"),order_no:v("order_no"),party_name:v("party_name"),urgent:el("f_urgent").checked};
      const btn=el("send");btn.disabled=true;btn.textContent="Sending...";
      try{
        const f=el("f_photo").files[0];
        if(f){
          const path=me.user.id+"/"+Date.now()+".jpg";
          const up=await client.storage.from("lwb-complaint-photos").upload(path,await shrink(f),{contentType:"image/jpeg"});
          if(up.error)throw Error("Photo upload failed: "+up.error.message);
          p.photo_path=path;
        }
        const {data,error}=await client.rpc("lwb_complaint_add",{p});
        if(error)throw Error(setupMsg(error.message));
        ERPShell.toast("Complaint CMP-"+data+" sent to Admin and Sales Head.");
        closeForm();tab="";openId=Number(data);await load();
      }catch(err){await alert("Could not send: "+err.message)}
      finally{btn.disabled=false;btn.textContent="Send to Admin & Sales Head"}
    }

    async function load(){
      const r=await client.from("lwb_complaints").select("*").order("last_activity_at",{ascending:false}).limit(500);
      if(r.error){el("list").innerHTML='<div class="sl-msg">'+esc(setupMsg(r.error.message))+"</div>";el("tabs").innerHTML="";return}
      rows=r.data||[];
      if(openId)await loadReplies(openId);
      render();
    }
    async function loadReplies(id){
      const r=await client.from("lwb_complaint_replies").select("*").eq("complaint_id",id).order("created_at");
      replies.set(id,r.error?[]:r.data||[]);
    }
    function render(){
      const q=el("q").value.trim().toLowerCase(),c=el("cat").value;
      const TABS=[["","All"],["WAIT",office()?"Waiting for reply":"New reply for me"],["OPEN","Open"],["ANSWERED","Answered"],["RESOLVED","Solved"]];
      const hit={"":()=>true,WAIT:waiting,OPEN:x=>x.status==="OPEN",ANSWERED:x=>x.status==="ANSWERED",RESOLVED:x=>x.status==="RESOLVED"};
      el("tabs").innerHTML=TABS.map(([k,t])=>'<button type="button" class="cb-tab'+(tab===k?" on":"")+'" data-tab="'+k+'">'+esc(t)+"<span>"+rows.filter(hit[k]).length+"</span></button>").join("");
      const list=rows.filter(x=>hit[tab](x)&&(!c||x.category===c)&&(!q||["CMP-"+x.id,x.subject,x.details,x.created_by_name,x.party_name,x.order_no].join(" ").toLowerCase().includes(q)));
      if(!list.length){el("list").innerHTML='<div class="erp-empty">'+(rows.length?"No complaint here.":office()?"No complaint yet.":"You have not raised any complaint yet. Tap “+ New Complaint / Query”.")+"</div>";return}
      el("list").innerHTML=list.map(item).join("");
      showPhotos();
    }
    function item(x){
      const k=CAT[x.category]||CAT.OTHER,st=STATE[x.status]||["",""],isOpen=openId===x.id;
      const by=mine(x)?"You":esc(x.created_by_name||"Staff")+(x.created_by_role?" ("+esc(x.created_by_role.toUpperCase())+")":"");
      const label=x.status==="OPEN"&&office()&&!mine(x)?["Waiting for your reply","red"]:st;
      let h='<div class="cb-item'+(x.urgent?" urgent":"")+(waiting(x)?" wait":"")+'" id="c'+x.id+'"><div class="cb-head" data-open="'+x.id+'" role="button" tabindex="0" aria-expanded="'+isOpen+'">'+
        '<span class="ic">'+k[1]+"</span><b>"+esc(x.subject)+'</b><span class="badges">'+(x.urgent?'<span class="erp-badge red">Urgent</span>':"")+
        (waiting(x)&&mine(x)?'<span class="erp-badge blue">New reply</span>':'<span class="erp-badge '+label[1]+'">'+esc(label[0])+"</span>")+"</span>"+
        '<span class="cb-meta">CMP-'+x.id+" · "+esc(k[2])+" · "+by+" · "+when(x.created_at)+(x.reply_count?" · 💬 "+x.reply_count:"")+"</span></div>";
      if(isOpen)h+=body(x);
      return h+"</div>";
    }
    function body(x){
      const extra=[x.order_no&&"PO "+esc(x.order_no),x.party_name&&"Party "+esc(x.party_name)].filter(Boolean).join(" · ");
      let h='<div class="cb-body">'+(x.details?'<div class="cb-details">'+esc(x.details)+"</div>":"")+(extra?'<div class="cb-meta">'+extra+"</div>":"")+
        (x.photo_path?'<div><img class="cb-photo" data-photo="'+esc(x.photo_path)+'" alt="Complaint photo"></div>':"");
      const list=replies.get(x.id);
      if(!list)h+='<div class="cb-meta">Loading replies...</div>';
      else if(list.length)h+='<div class="cb-thread">'+list.map(r=>{
        const sys=r.status_after&&/^(Marked solved|Opened again)\.$/.test(r.body);
        if(sys)return '<div class="cb-msg sys">'+(r.status_after==="RESOLVED"?"✅ ":"↺ ")+esc(r.body.replace(/\.$/,""))+" by "+esc(r.by_user===me.user.id?"you":r.by_name||"Office")+" · "+when(r.created_at)+"</div>";
        return '<div class="cb-msg '+(r.by_office?"office":"staff")+'"><small>'+esc(r.by_user===me.user.id?"You":r.by_name||"Office")+(r.by_office?" · Office":"")+" · "+when(r.created_at)+
          (r.status_after==="RESOLVED"?" · ✅ Solved":"")+"</small>"+esc(r.body)+"</div>";
      }).join("")+"</div>";
      else if(!office()||mine(x))h+='<div class="cb-meta">No reply yet. Admin and the Sales Head have been told.</div>';
      if(x.status==="RESOLVED")h+='<div class="cb-solved">✅ Solved'+(x.resolved_by_name?" by "+esc(x.resolved_by===me.user.id?"you":x.resolved_by_name):"")+" · "+when(x.resolved_at)+"</div>";
      const asOffice=office()&&!mine(x),d=esc(drafts.get(x.id)||"");
      h+='<div class="cb-reply"><textarea id="r'+x.id+'" maxlength="2000" placeholder="'+(asOffice?"Write the answer / solution for the staff":x.status==="RESOLVED"?"Still a problem? Write here to open it again":"Write more details or a reply")+'">'+d+'</textarea><div class="cb-btns">';
      if(asOffice){
        h+='<button type="button" class="sl-btn" data-act="ANSWERED" data-id="'+x.id+'">Send reply</button>';
        if(x.status!=="RESOLVED")h+='<button type="button" class="sl-btn ghost" data-act="RESOLVED" data-id="'+x.id+'">✅ Reply &amp; mark solved</button>';
        else h+='<button type="button" class="sl-btn ghost" data-act="OPEN" data-id="'+x.id+'">Open again</button>';
      }else{
        h+='<button type="button" class="sl-btn" data-act="OPEN" data-id="'+x.id+'">'+(x.status==="RESOLVED"?"Not solved — open again":"Send reply")+"</button>";
        if(x.status!=="RESOLVED")h+='<button type="button" class="sl-btn ghost" data-act="RESOLVED" data-id="'+x.id+'">✅ Problem solved</button>';
      }
      return h+"</div></div></div>";
    }
    async function act(b){
      const id=Number(b.dataset.id),x=rows.find(r=>r.id===id),status=b.dataset.act,box=el("r"+id),text=box?box.value.trim():"";
      if(!text&&(status==="ANSWERED"||(status==="OPEN"&&x.status!=="RESOLVED"))){await alert("Please write a reply.");box&&box.focus();return}
      if(status==="RESOLVED"&&!await confirm(office()&&!mine(x)?"Mark CMP-"+id+" as solved?\n\n"+(text?"Your reply is sent with it.":"Tip: write what was done, so the staff knows."):"Is your problem solved?\n\nCMP-"+id+" will be closed.",{ok:"Yes, solved"}))return;
      b.disabled=true;
      const {error}=await client.rpc("lwb_complaint_reply",{p_id:id,p_body:text,p_status:status});
      b.disabled=false;
      if(error){await alert("Could not save: "+setupMsg(error.message));return}
      drafts.delete(id);
      ERPShell.toast(status==="RESOLVED"?"CMP-"+id+" marked solved.":office()&&!mine(x)?"Reply sent. "+(x.created_by_name||"Staff")+" is notified.":"Reply sent to Admin and Sales Head.");
      await load();
    }
    async function toggle(id){
      openId=openId===id?0:id;
      render();
      if(openId){
        await loadReplies(id);render();
        const n=el("c"+id);if(n)n.scrollIntoView({behavior:"smooth",block:"nearest"});
      }
    }
    async function showPhotos(){
      for(const img of document.querySelectorAll("img[data-photo]")){
        const p=img.dataset.photo;
        if(!photos.has(p)){const r=await client.storage.from("lwb-complaint-photos").createSignedUrl(p,3600);photos.set(p,r.data?r.data.signedUrl:"")}
        if(photos.get(p))img.src=photos.get(p);else img.replaceWith(document.createTextNode("Photo not available"));
      }
    }

    (async()=>{
      me=await S.start(["admin","manager","sales","warehouse","transport","accounts","driver"]);if(!me)return;
      el("who").textContent=office()?"Admin / Sales Head · all complaints":"My complaints";
      el("sub").textContent=office()?"Complaints and queries from salesmen, godown, drivers and accounts. Reply here; the staff gets a 🔔 at once. Mark solved when done."
        :"Any problem or query — market, godown, driver, accounts. Admin and the Sales Head get it at once and reply here. You get a 🔔 when they answer.";
      el("cat").innerHTML+=CATS.map(c=>'<option value="'+c[0]+'">'+c[1]+" "+esc(c[2])+"</option>").join("");
      drawCats();
      const qs=new URLSearchParams(location.search),qid=Number(qs.get("id"));
      if(qid)openId=qid;
      // Office opens on what waits for them.
      if(office()&&!qid)tab="WAIT";
      document.addEventListener("click",async e=>{
        const c=e.target.closest("[data-cat]");if(c){cat=c.dataset.cat;drawCats();return}
        const t=e.target.closest("[data-tab]");if(t){tab=t.dataset.tab;render();return}
        const a=e.target.closest("[data-act]");if(a){act(a);return}
        const im=e.target.closest("img[data-photo]");if(im&&im.src){window.open(im.src,"_blank","noopener");return}
        const o=e.target.closest("[data-open]");if(o){toggle(Number(o.dataset.open));return}
      });
      document.addEventListener("keydown",e=>{const o=e.target.closest&&e.target.closest("[data-open]");if(o&&(e.key==="Enter"||e.key===" ")){e.preventDefault();toggle(Number(o.dataset.open))}});
      // Keep a half-written reply when the list redraws.
      document.addEventListener("input",e=>{if(/^r\d+$/.test(e.target.id))drafts.set(Number(e.target.id.slice(1)),e.target.value)});
      el("newBtn").onclick=openForm;el("cancel").onclick=closeForm;
      el("form").addEventListener("submit",send);
      el("cat").addEventListener("change",render);el("q").addEventListener("input",render);
      el("refresh").onclick=load;
      document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!document.activeElement.matches("textarea,input"))load()});
      el("loading").hidden=true;el("page").hidden=false;
      if(qs.get("new")==="1")openForm();
      await load();
      if(!office()&&!rows.length)openForm();
      if(openId){const n=el("c"+openId);if(n)n.scrollIntoView({block:"center"});}
    })();
  </script>
</body>
</html>
