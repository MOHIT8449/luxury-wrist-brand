<!doctype html><html><head><meta charset="utf-8"><title>keys fixture</title>
<style>tr.pick{cursor:pointer}.card{cursor:pointer;padding:8px;border:1px solid #ccc;margin:4px}</style></head>
<body><div class="erp-main">
<input type="search" id="q" placeholder="Search party">
<table><tbody id="tb">
<tr class="pick" onclick="window.opened='A'"><td>A</td></tr>
<tr class="pick" onclick="window.opened='B'"><td>B</td></tr>
<tr class="pick" onclick="window.opened='C'"><td>C</td></tr>
</tbody></table>
<div class="card" id="card" onclick="window.card=1">Sales ₹19 L</div>
<div class="tabs"><button id="t1" onclick="window.tab=1">Today</button><button id="t2" onclick="window.tab=2">7 Days</button><button id="t3" onclick="window.tab=3">30 Days</button></div>
<div id="form1"><input id="f1"><select id="f2"><option>a</option></select><input id="f3" readonly><input id="f4"><textarea id="f5"></textarea>
<button id="cancel">Cancel</button><button id="save" class="pri" onclick="window.saved=(window.saved||0)+1">Save</button></div>
<button id="new" onclick="document.getElementById('pop').hidden=false">+ New Party</button>
<form id="fm" onsubmit="event.preventDefault();window.submitted=1"><input id="g1"><input id="g2"><button type="submit">Save</button></form>
</div>
<div id="pop" hidden role="dialog" style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50"><div style="background:#fff;margin:40px;padding:10px">
<button id="px" onclick="document.getElementById('pop').hidden=true">✕</button><input id="p1"><input id="p2"><button id="psave" onclick="window.psaved=1">Save</button></div></div>
<script src="../../esc-close.js"></script><script src="../../erp-keys.js"></script>
</body></html>
