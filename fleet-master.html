<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle &amp; Employee Master | Luxury Wrist Brand ERP</title>
  <script src="erp-date.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="erp-shell.css">
  <script src="erp-shell.js"></script>
  <script src="erp-recent.js"></script>
  <script src="excel-io.js"></script>
  <script src="erp-docs.js"></script>
  <script src="master-popup.js"></script>
  <style>
    .status{text-align:center;padding:80px 20px;font-size:15px;color:#555}
    .fm-sub{margin:-8px 0 14px;color:var(--erp-muted);font-size:15px}
    .fm-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
    .fm-grid label{display:block;font-size:14px;font-weight:600;color:#4b5763;margin-bottom:5px}
    .fm-grid input,.fm-grid select,.fm-grid textarea{width:100%;height:42px;border:1.5px solid var(--erp-line);border-radius:6px;padding:0 10px;font:inherit;font-size:15px;background:#fff;color:var(--erp-ink)}
    .fm-grid textarea{height:42px;padding:9px 10px;resize:vertical}
    .fm-grid .wide{grid-column:span 2}
    .fm-grid input:disabled,.fm-grid select:disabled,.fm-grid textarea:disabled{background:#f6f7f9}
    .fm-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
    .fm-btn{height:42px;border-radius:6px;padding:0 18px;font-weight:600;font-size:15px;cursor:pointer;border:1px solid var(--erp-red);background:var(--erp-red);color:#fff}
    .fm-btn.light{background:#fff;color:var(--erp-ink);border-color:var(--erp-line)}
    .fm-btn:disabled{opacity:.45;cursor:not-allowed}
    .fm-hint{font-size:14px;color:var(--erp-muted)}
    .fm-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .fm-tools input,.fm-tools select{height:40px;border:1.5px solid var(--erp-line);border-radius:6px;padding:0 10px;font:inherit;font-size:15px}
    .fm-tools input{min-width:260px}
    .fm-table{border-collapse:collapse;width:100%;font-size:15px}
    .fm-table th,.fm-table td{border-bottom:1px solid var(--erp-line);padding:10px 12px;text-align:left;white-space:nowrap;vertical-align:top}
    .fm-table th{background:#f6f7f9;font-size:14px;font-weight:700;color:#2b3440;position:sticky;top:0}
    .fm-table td small{display:block;color:var(--erp-muted);font-size:13px}
    .fm-table tr.off td{opacity:.5}
    .fm-table button{height:32px;padding:0 12px;border-radius:5px;border:1px solid var(--erp-line);background:#fff;color:var(--erp-ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-right:4px}
    .fm-table button.del{color:var(--erp-red);border-color:#f3c2ca}
    .tagx{display:inline-block;padding:3px 9px;border-radius:5px;font-size:13px;font-weight:700;margin:0 4px 3px 0}
    .tagx.ok{background:#e4f6e9;color:#0d6b36}.tagx.bad{background:#fee8e8;color:#9e2525}.tagx.warn{background:#fff3d6;color:#8a5a00}.tagx.info{background:#e8f1ff;color:#194c85}
    .lwb-xl button,.lwb-xl label{font-size:15px}
    .lwb-xl button{height:40px;border-radius:6px;padding:0 14px;font-weight:600;cursor:pointer;border:1px solid var(--erp-line);background:#fff;color:var(--erp-ink)}
    .lwb-xl button[data-a=go]{background:var(--erp-red);color:#fff;border-color:var(--erp-red)}
    .lwb-xl button:disabled{opacity:.45;cursor:not-allowed}
    .lwb-xl .hint{font-size:14px;color:var(--erp-muted)}
    #tabs .erp-pill{font-size:15px;padding:9px 18px}
    @media(max-width:900px){.fm-grid{grid-template-columns:1fr 1fr}}
    @media(max-width:540px){.fm-grid{grid-template-columns:1fr}.fm-grid .wide{grid-column:span 1}.fm-tools input{min-width:0;width:100%}}
    [hidden]{display:none!important}
    /* Hired vehicle: fixed rent (lwb_hired_vehicle_rent_setup.sql) */
    .rent-box{margin-top:12px;border:1.5px dashed #cfd4dc;border-radius:8px;background:#f6f7f9;padding:10px 12px}
    .rent-box>b{display:block;font-size:14px;margin-bottom:8px}
    .rent-seg{display:flex;border:1.5px solid var(--erp-line);border-radius:6px;overflow:hidden;margin-bottom:8px;background:#fff}
    .rent-seg button{flex:1;height:38px;border:0;border-right:1px solid var(--erp-line);background:#fff;font:inherit;font-size:14px;font-weight:600;color:var(--erp-ink);cursor:pointer}
    .rent-seg button:last-child{border-right:0}.rent-seg button[aria-pressed=true]{background:#142033;color:#fff}
    .rent-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 38px;gap:6px;margin-bottom:6px}
    .rent-row input{height:38px;border:1.5px solid var(--erp-line);border-radius:6px;padding:0 10px;font:inherit;font-size:15px;min-width:0}
    .rent-row button,.rent-add{height:38px;border:1px solid var(--erp-line);border-radius:6px;background:#fff;color:var(--erp-ink);font:inherit;font-weight:600;cursor:pointer}
    .rent-add{padding:0 12px;font-size:14px}
    .rent-box .fm-grid{gap:8px 12px}
    .rt-cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:#fdecef;color:#b3122b;font-size:12px;font-weight:800;text-align:center;margin-left:4px}
    .rt-h{display:flex;align-items:center;gap:8px;margin:4px 0 8px;font-size:15px}.rt-h:not(:first-child){margin-top:14px}
    .rt-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px}
    .rt-c{border:1px solid var(--erp-line);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:6px}
    .rt-c.need{background:#fff8e8;border-color:#f1d391}
    .rt-c small{display:block;color:var(--erp-muted);font-size:12.5px}.rt-c .p{font-weight:800;font-size:14px}
    .rt-c .bk{color:#9e2525;font-size:12.5px;font-weight:600}
    .rt-row{display:flex;gap:6px;align-items:center}.rt-row input{flex:1;min-width:0;height:38px;border:1.5px solid var(--erp-line);border-radius:6px;padding:0 10px;font:inherit;font-size:15px}
    .rt-row button{height:38px;border-radius:6px;padding:0 12px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;border:1px solid var(--erp-line);background:#fff;color:var(--erp-ink);white-space:nowrap}
    .rt-row button.go{background:#13824a;border-color:#13824a;color:#fff}.rt-row button.bk{color:#b3122b;border-color:#e7b3bd}
    .rt-v{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:6px 0;border-bottom:1px solid var(--erp-line)}.rt-v:last-child{border:0}.rt-v small{color:var(--erp-muted);font-size:12px}
    .rent-chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin-top:8px}.rent-chk input{width:18px;height:18px;margin:1px 0 0;flex:none}
    @media(max-width:640px){
      .fm-sub{display:none}
      #tabs .erp-pill{font-size:14px;padding:7px 14px}
      .erp-card-head:has(#listTools){flex-wrap:wrap;gap:6px;padding:10px 12px}
      #listTitle{width:100%;font-size:15px}
      #listTools{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;width:100%}
      #listTools #search{grid-column:1/-1;height:38px}
      #listTools select{height:38px;min-width:0;font-size:14px}#listTools .fm-btn,#listTools .mp-new{height:38px;padding:0 10px;font-size:14px}
    }
  </style>
</head>
<body>
  <div id="loading" class="status">Checking account access...</div>
  <main id="page" class="erp-main" hidden>
    <div class="erp-pagehead"><h1 id="pageTitle">Vehicle Master</h1></div>
    <p class="fm-sub" id="pageSub"></p>
    <div class="erp-pills" id="tabs">
      <a class="erp-pill" data-tab="vehicles" href="#vehicles">Vehicle Master</a>
      <a class="erp-pill" data-tab="employees" href="#employees" id="empPill" hidden>Employee Master</a>
      <a class="erp-pill" data-tab="drivers" href="#drivers" id="drvPill" hidden>Drivers</a>
      <a class="erp-pill" data-tab="rates" href="#rates" id="ratePill" hidden>Trip rent to set <span class="rt-cnt" id="rateCnt" hidden></span></a>
    </div>
    <div id="setupMsg" class="erp-card" style="padding:16px;margin-bottom:14px;color:#9b2020;background:#ffebeb" hidden></div>

    <section class="erp-card" id="formCard">
      <div class="erp-card-head"><h2 id="formTitle"></h2><small id="formInfo" style="color:var(--erp-muted)"></small></div>
      <div class="erp-card-body" style="padding:16px">
        <div class="fm-grid" id="form"></div>
        <div class="rent-box" id="rentBox" hidden></div>
        <div id="docsBox" style="margin-top:16px" hidden><div class="ed-title" id="docsTitle">Documents &amp; photos</div><div id="docs"></div></div>
        <div class="fm-actions"><button type="button" class="fm-btn" id="save">Save</button><button type="button" class="fm-btn light" id="clear">New / Clear</button><span class="fm-hint" id="formHint"></span></div>
      </div>
    </section>

    <section class="erp-card" style="margin-top:14px" id="xlCard">
      <div class="erp-card-head"><h2>Excel Import / Export</h2></div>
      <div class="erp-card-body" style="padding:16px" id="xlPanel"></div>
    </section>

    <section class="erp-card" id="rateCard" hidden><div class="erp-card-body" style="padding:12px 14px" id="rateBody"></div></section>
    <section class="erp-card" style="margin-top:14px" id="listCard">
      <div class="erp-card-head"><h2 id="listTitle"></h2>
        <div class="fm-tools" id="listTools"><input id="search" type="search" placeholder="Search"><select id="roleFilter" hidden><option value="">All Work / Post</option></select><select id="filter"><option value="active">Active</option><option value="inactive">Inactive</option><option value="all">All</option><option value="nodocs">Documents missing</option></select><button type="button" class="fm-btn light" id="xlBtn">⬇⬆ Excel</button></div></div>
      <div class="erp-scroll" style="overflow:auto"><table class="fm-table"><thead id="head"></thead><tbody id="list"></tbody></table></div>
    </section>
  </main>
  <script>
    'use strict';
    const client=supabase.createClient("https://txkbhadzdbxpieunfvox.supabase.co","sb_publishable_W4I3Q5ODf0g17sq5uDml2Q_sLolXYEk");
    const el=id=>document.getElementById(id);
    const esc=v=>String(v==null?"":v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    const plate=v=>String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
    const phone=v=>{const d=String(v||"").replace(/\D/g,"");return d.length===12&&d.startsWith("91")?d.slice(2):d.length===11&&d.startsWith("0")?d.slice(1):d};
    const okPhone=v=>/^[6-9]\d{9}$/.test(v);
    const blank=v=>v==null||String(v).trim()==="";
    const today=()=>new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Kolkata"});
    const showDate=d=>LWBDate.d(d);
    const daysTo=d=>Math.round((new Date(d+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5);
    // Excel gives dates as a serial number, dd-mm-yyyy, dd/mm/yyyy or yyyy-mm-dd
    function toDate(v){
      if(blank(v))return null;
      if(typeof v==="number"){const d=new Date(Math.round((v-25569)*864e5));return isNaN(d)?undefined:d.toISOString().slice(0,10)}
      const s=String(v).trim();let m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);
      if(m)return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
      m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/);
      if(m){const y=m[3].length===2?"20"+m[3]:m[3];return y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0")}
      return undefined;
    }
    const status=v=>{if(blank(v))return null;const s=String(v).trim().toLowerCase();return /^(active|yes|haan|y|1|true)$/.test(s)?true:/^(inactive|no|nahi|n|0|false)$/.test(s)?false:undefined};

    const VTYPES=["Tempo","Pickup","Mini truck","407","Eicher","Truck","Container","Other"];
    // Work / Post of an employee. PO Approval & Driver and Transport Assignment list the "Driver" ones by themselves.
    const WORKS=["Driver","Loader","Godown Manager","Manager","Supervisor","Godown helper","Packer","Picker","Salesman","Transport","Office","Accounts","Security","Other"];
    // ERP login roles (lwb_employee_login_link_setup.sql); Tasks, Godown Manager and salesman lists use the login.
    const LOGIN_ROLES=[["driver","Driver"],["warehouse","Godown Manager"],["manager","Manager / Sales Head"],["sales","Salesman"],["accounts","Accounts"],["transport","Transport"],["admin","Admin"]];
    const loginLabel=r=>(LOGIN_ROLES.find(x=>x[0]===r)||["",r||"-"])[1];
    const roleKey=v=>String(v||"").trim().replace(/\s+/g," ").toLowerCase();
    const isDriver=r=>roleKey(r&&r.designation)==="driver";
    const DOCS=[["insurance_expiry","Insurance"],["puc_expiry","PUC"],["fitness_expiry","Fitness"],["permit_expiry","Permit"]];
    const KIND={
      vehicles:{table:"lwb_vehicles",title:"Vehicle Master",one:"Vehicle",
        sub:"Own and transporter vehicles. PO Approval and Transport Assignment pick vehicles from this list. Enter Insurance / PUC / Fitness / Permit dates to see expiry alerts here.",
        fields:[
          {k:"vehicle_no",l:"Vehicle Number *",ph:"GJ05FW9821"},
          {k:"vehicle_type",l:"Vehicle Type",list:VTYPES},
          {k:"capacity_kg",l:"Capacity (KG)",type:"number"},
          {k:"ownership",l:"Ownership",opts:[["OWN","Own"],["TRANSPORTER","Transporter"]]},
          {k:"transporter_name",l:"Transporter / Owner Name"},
          {k:"owner_mobile",l:"Owner Mobile",type:"tel",ph:"10 digit"},
          ...DOCS.map(([k,l])=>({k,l:l+" Expiry",type:"date"})),
          {k:"is_active",l:"Status",opts:[["true","Active"],["false","Inactive"]]},
          {k:"note",l:"Note",wide:1}]},
      // Read-only list for Transport: drivers come from Employee Master (Work / Post = Driver).
      rates:{ro:1,title:"Trip rent to set",one:"Trip rent",fields:[],sub:"Per party vehicles: the first trip to a new party waits here. Manager enters the rent, Admin verifies; next trips to that party add by themselves."},
      drivers:{ro:1,title:"Drivers",one:"Driver",fields:[],
        sub:"Drivers come from Employee Master (Work / Post = Driver)."},
      employees:{rpc:1,title:"Employee Master",one:"Employee",
        sub:"All staff in one place. Work / Post = Driver puts the person in the driver list of PO Approval and Transport Assignment.",
        fields:[
          {k:"emp_code",l:"Employee ID",ph:"Blank = next ID"},
          {k:"name",l:"Employee Name *"},
          {k:"designation",l:"Work / Post *",roles:1},
          {k:"mobile",l:"Mobile",type:"tel",ph:"10 digits"},
          {k:"monthly_salary",l:"Monthly Salary ₹ *",type:"number"},
          {k:"joining_date",l:"Joining Date",dmy:1},
          {k:"is_active",l:"Status",opts:[["true","Working"],["false","Left"]]},
          {k:"alt_mobile",l:"Alternate Mobile",type:"tel",drv:1},
          {k:"license_no",l:"Driving Licence Number",drv:1},
          {k:"license_expiry",l:"Licence Expiry",type:"date",drv:1},
          {k:"default_vehicle_id",l:"Default Vehicle",vehicle:1,drv:1},
          {k:"transporter_name",l:"Transporter Name",drv:1},
          {k:"address",l:"Address",wide:1,drv:1},
          {k:"note",l:"Note",wide:1}]}
    };

    let docPanel=null,docKey="",docSum={vehicles:null,drivers:null,employees:null},avatars=new Map();
    const DOC_ENTITY={vehicles:"VEHICLE",drivers:"STAFF",employees:"STAFF"};
    let hiredOf=new Map(),hiredOk=false,rentSt=null,RL=null;
    let me=null,tab="vehicles",data={vehicles:[],drivers:[],employees:[],rates:[]},empNext="",empMonth="",empErr="",editing=null,busy=false,loginPhones=new Set(),missing=false,tripOf=new Map(),loginOf=new Map(),loginErr=false;
    // Vehicles: Admin / Manager add, edit, delete; Godown (warehouse) add / edit.
    // Employee Master (drivers too): Admin / Manager / Godown add and edit; nobody deletes (mark Left).
    // Drivers tab: read-only list for Transport.
    const head=()=>me&&["admin","manager"].includes(me.role);
    const empRole=()=>!!me&&["admin","manager","warehouse"].includes(me.role);
    const can=()=>tab!=="drivers"&&(head()||(!!me&&tab==="vehicles"&&me.role==="warehouse")||(tab==="employees"&&empRole()));
    const rs=v=>"₹"+Math.round(Number(v)||0).toLocaleString("en-IN");
    const vehicleById=id=>data.vehicles.find(v=>v.id===id);

    async function start(){
      const {data:{session}}=await client.auth.getSession();
      if(!session){location.replace("login.html");return null}
      const {data:p}=await client.from("user_profiles").select("full_name,role,active").eq("id",session.user.id).single();
      const realRole=String((p&&p.role)||"").toLowerCase().trim(),role=p?await ERPShell.pageRoleFresh(realRole):realRole;
      if(!p||p.active!==true||!["admin","manager","transport","warehouse"].includes(role)){location.replace("dashboard.html");return null}
      return {role,realRole,name:p.full_name||session.user.email};
    }
    async function load(){
      // Drivers = working employees with Work / Post "Driver" (lwb_employee_roles_setup.sql).
      const [v,d,l,e,vp,lk]=await Promise.all([
        client.from("lwb_vehicles").select("*").order("vehicle_no"),
        client.rpc("lwb_staff_pick",{p_role:"driver"}),
        ["admin","manager","transport"].includes(me.role)?client.rpc("lwb_sales_head_active_drivers"):Promise.resolve({data:[]}),
        empRole()?client.rpc("lwb_emp_list2"):Promise.resolve({data:null}),
        client.rpc("lwb_vehicle_pick"),
        empRole()?client.rpc("lwb_emp_logins"):Promise.resolve({data:[]})]);
      // Rent setups of hired vehicles: Admin / Manager only (money)
      const hs=head()?await client.rpc("lwb_hired_setups"):{error:true};
      hiredOk=!hs.error;hiredOf=new Map(hiredOk?(hs.data||[]).map(x=>[x.vehicle_id,x]):[]);
      const rl=hiredOk?await client.rpc("lwb_hired_rate_list"):{error:true};RL=rl.error?null:rl.data;
      loginErr=!!lk.error;loginOf=new Map(((lk&&lk.data)||[]).map(x=>[x.id,x]));
      tripOf=new Map(((vp&&vp.data)||[]).filter(x=>x.on_trip&&x.on_trip.length).map(x=>[x.id,x.on_trip]));
      empErr=e.error?"Employee Master is not set up in Supabase yet ("+(e.error.message||"")+").":"";
      if(e.data){data.employees=ERPRecent.sort(e.data.rows||[]);empNext=e.data.next_code||"";empMonth=e.data.month||""}
      missing=!!v.error;
      el("setupMsg").hidden=!missing;
      if(missing)el("setupMsg").textContent="The Vehicle table is not set up in Supabase yet ("+(v.error.message||"")+").";
      data.vehicles=ERPRecent.sort(v.data||[]);data.drivers=d.error?[]:(d.data||[]);
      loginPhones=new Set((l.data||[]).map(x=>phone(x.driver_mobile)).filter(Boolean));
      // Which records have a photo / Aadhaar / licence (lwb_documents_setup.sql). null = not set up yet.
      const [sv,se]=await Promise.all(["VEHICLE",empRole()?"STAFF":null].map(x=>x?ERPDocs.summary(client,x):Promise.resolve(null)));
      docSum={vehicles:sv,drivers:null,employees:se};
    }
    // Small photo next to the name in the list.
    async function loadAvatars(){
      const ent=DOC_ENTITY[tab],sum=docSum[tab];if(!sum)return;
      const want=data[tab].filter(r=>{const t=sum.get(String(r.id));return t&&t.has("PHOTO")&&!avatars.has(ent+r.id)}).map(r=>String(r.id)).slice(0,300);
      if(!want.length)return;
      const got=await ERPDocs.avatars(client,ent,want);
      for(const id of want)avatars.set(ent+id,got.get(id)||"");
      renderList();
    }
    const avatar=r=>{const u=avatars.get(DOC_ENTITY[tab]+r.id);return u?'<img class="ed-av" alt="" src="'+esc(u)+'">':""};
    const docTags=r=>ERPDocs.badge(DOC_ENTITY[tab],docSum[tab]&&(docSum[tab].get(String(r.id))||new Set()));
    // The documents box under the form: new record = files wait until Save; saved record = upload at once.
    function mountDocs(){
      const key=tab+":"+(editing?editing.id:"new");
      if(!docSum[tab]){el("docsBox").hidden=true;docPanel=null;docKey="";return}
      el("docsBox").hidden=false;
      el("docsTitle").textContent=(tab==="vehicles"?"Vehicle photo & papers":"Employee photo, Aadhaar, bank details & driving licence (drivers)")+(editing?"":" (upload when you Save)");
      if(key===docKey&&docPanel)return;
      docKey=key;
      docPanel=ERPDocs.panel({client,mount:el("docs"),entity:DOC_ENTITY[tab],id:editing?editing.id:null,canEdit:can(),info:tab!=="vehicles",
        onChange:async()=>{if(editing){docSum[tab]=await ERPDocs.summary(client,DOC_ENTITY[tab])||docSum[tab];avatars.delete(DOC_ENTITY[tab]+editing.id);renderList();loadAvatars()}}});
    }

    function input(f){
      const id="f_"+f.k,cls=f.wide?' class="wide"':"";
      let h;
      if(f.roles){const cur=editing&&editing[f.k]&&!WORKS.some(w=>roleKey(w)===roleKey(editing[f.k]))?[editing[f.k]]:[];
        h='<select id="'+id+'"><option value="">— Select —</option>'+[...WORKS,...cur].map(w=>'<option value="'+esc(w)+'">'+esc(w)+"</option>").join("")+"</select>"}
      else if(f.opts)h='<select id="'+id+'">'+(f.k==="ownership"&&hiredOk?[...f.opts,["HIRED","Hired · fixed rent"]]:f.opts).map(([v,t])=>'<option value="'+v+'">'+esc(t)+"</option>").join("")+"</select>";
      else if(f.vehicle)h='<select id="'+id+'"><option value="">— None —</option>'+data.vehicles.filter(v=>v.is_active||(editing&&editing.default_vehicle_id===v.id)).map(v=>'<option value="'+v.id+'">'+esc(v.vehicle_no)+(v.vehicle_type?" · "+esc(v.vehicle_type):"")+"</option>").join("")+"</select>";
      else if(f.dmy)h='<input id="'+id+'" type="text" inputmode="numeric" placeholder="DD/MM/YYYY" maxlength="10">';
      else if(f.k==="note"||f.k==="address")h='<textarea id="'+id+'" maxlength="500"></textarea>';

          return '<tr class="'+(r.is_active?"":"off")+'"><td><b>'+esc(r.emp_code||"-")+"</b></td><td>"+avatar(r)+"<b>"+esc(r.name)+"</b>"+(r.note?"<small>"+esc(r.note)+"</small>":"")+"<div>"+docTags(r)+"</div></td><td>"+roleCell(r)+"</td><td>"+loginCell(r)+"</td><td>"+esc(r.mobile||"-")+(r.alt_mobile?"<small>"+esc(r.alt_mobile)+"</small>":"")+"</td><td>"+(Number(r.monthly_salary)?rs(r.monthly_salary):"-")+(cap&&cap!==Number(r.monthly_salary)?"<small>"+esc(mo)+": "+rs(cap)+"</small>":"")+"</td><td>"+rs(up)+(cap?(left<-0.5?'<small><span class="tagx bad">'+rs(-left)+" over</span></small>":"<small>Left "+rs(left)+"</small>"):"")+"</td><td>"+rs(r.month_paid)+"</td><td>"+(showDate(r.joining_date)||"-")+"</td><td>"+(r.is_active?'<span class="tagx ok">Working</span>':'<span class="tagx bad">Left</span>')+"</td><td>"+act(r)+"</td></tr>"}).join("")||'<tr><td colspan="11" class="erp-empty">'+(empErr?esc(empErr):"No employees yet. Add one using the form above or Excel.")+"</td></tr>";
      }else{
        // Transport: read-only list of working drivers from Employee Master.
        el("head").innerHTML="<tr><th>#</th><th>Driver</th><th>Mobile</th><th>Default Vehicle</th><th>Transporter</th><th>Licence</th><th>ERP Login</th></tr>";
        el("list").innerHTML=rows.map((r,i)=>"<tr><td>"+(i+1)+"</td><td><b>"+esc(r.name)+"</b><small>"+esc(r.emp_code||"")+"</small></td><td>"+esc(r.mobile||"-")+(r.alt_mobile?"<small>"+esc(r.alt_mobile)+"</small>":"")+"</td><td>"+esc(r.vehicle_no||"-")+"</td><td>"+esc(r.transporter_name||"-")+"</td><td>"+(r.license_expiry?expiryTags([[r.license_expiry,"Licence"]]):"-")+"</td><td>"+(loginPhones.has(r.mobile)?'<span class="tagx info">Has login</span>':'<span class="fm-hint">No</span>')+"</td></tr>").join("")||'<tr><td colspan="7" class="erp-empty">No working drivers. Admin / Manager / Godown add them in Employee Master with Work / Post = Driver.</td></tr>';
      }
      const sum=docSum[tab],noPhoto=sum&&tab!=="vehicles"?data[tab].filter(r=>r.is_active&&ERPDocs.missingOf(DOC_ENTITY[tab],sum.get(String(r.id))||new Set()).length).length:0;
      el("listTitle").textContent=KIND[tab].one+" List ("+rows.length+" / "+data[tab].length+")"+(noPhoto?" · "+noPhoto+" with documents missing":"");
    }
    // Trip rent to set: per party vehicles' first trips to a new party (lwb_hired_party_rate_setup.sql).
    function renderRates(){
      const G=RL.groups||[],need=G.filter(g=>g.status!=="WAITING"),wait=G.filter(g=>g.status==="WAITING"),ver=(RL.rates||[]).filter(r=>r.status==="VERIFIED"),adm=RL.is_admin;
      const days=g=>g.days+" trip day"+(Number(g.days)===1?"":"s")+" · "+(g.first_date===g.last_date?showDate(g.first_date):showDate(g.first_date)+" – "+showDate(g.last_date));
      const head=(g,cls)=>'<div class="rt-c '+cls+'"><div><b>🚚 '+esc(g.no)+'</b>'+(g.owner?' · '+esc(g.owner):"")+'<div class="p">'+esc(g.party)+'</div><small>'+days(g)+(g.orders&&g.orders.length?' · '+esc(g.orders.join(", ")):"")+'</small>';
      el("rateBody").innerHTML=
        '<div class="rt-h"><b>Rate needed</b><span class="rt-cnt">'+need.length+'</span></div>'+
        (need.length?'<div class="rt-list">'+need.map((g,i)=>head(g,"need")+(g.status==="SENT_BACK"?'<div class="bk">Sent back by Admin: '+esc(g.note||"")+'</div>':"")+'</div>'+
          '<div class="rt-row"><input type="number" min="0" step="any" inputmode="decimal" placeholder="₹ rent for one trip" data-rin="n'+i+'" value="'+(g.rate?Number(g.rate):"")+'"><button type="button" class="go" data-rset="'+i+'">'+(adm?"Save &amp; verify":"Send to Admin")+'</button></div></div>').join("")+'</div>'
          :'<p class="fm-hint">Nothing waiting. A per party vehicle\'s first trip to a new party comes here.</p>')+
        '<div class="rt-h"><b>Waiting for Admin</b><span class="rt-cnt">'+wait.length+'</span></div>'+
        (wait.length?'<div class="rt-list">'+wait.map((g,i)=>head(g,"")+'<small>'+rs(g.rate)+' per trip · by '+esc(g.set_by_name||"-")+'</small></div>'+
          (adm?'<div class="rt-row"><input type="number" min="0" step="any" inputmode="decimal" data-rin="w'+i+'" value="'+Number(g.rate)+'" aria-label="Rent"><button type="button" class="bk" data-rback="'+i+'">Send back</button><button type="button" class="go" data-rok="'+i+'">✓ Verify</button></div>'
            :'<span class="tagx warn" style="align-self:flex-start">Waiting for Admin</span>')+'</div>').join("")+'</div>':'<p class="fm-hint">None.</p>')+
        '<div class="rt-h"><b>Verified party rates</b><span class="rt-cnt" style="background:#e4f6e9;color:#0d6b36">'+ver.length+'</span></div>'+
        (ver.length?'<div>'+ver.map(r=>'<div class="rt-v"><span><b>'+esc(r.no)+'</b> → '+esc(r.party)+'<small> · '+esc(r.verified_by_name||"")+(r.verified_at?" "+showDate(String(r.verified_at).slice(0,10)):"")+'</small></span><b>'+rs(r.rate)+'</b></div>').join("")+'</div>':'<p class="fm-hint">None yet.</p>');
      const val=k=>{const x=el("rateBody").querySelector('[data-rin="'+k+'"]');return x?Number(x.value):NaN};
      const run=async(b,fn,ok)=>{b.disabled=true;try{const r=await fn();if(r.error)throw r.error;ERPShell.toast(ok,"success");await load();render()}catch(e){ERPShell.toast(String(e.message||e).replace(/^.*?ERROR:\s*/,""),"error");b.disabled=false}};
      el("rateBody").querySelectorAll("[data-rset]").forEach(b=>b.onclick=()=>{const g=need[+b.dataset.rset],r=val("n"+b.dataset.rset);
        if(!(r>0)){ERPShell.toast("Enter the rent for one trip.","error");return}
        run(b,()=>client.rpc("lwb_hired_rate_set",{p_vehicle:g.vehicle_id,p_party:g.party,p_rate:r,p_note:null}),adm?"Verified: "+g.party+" "+rs(r):"Sent to Admin: "+g.party+" "+rs(r))});
      el("rateBody").querySelectorAll("[data-rok]").forEach(b=>b.onclick=()=>{const g=wait[+b.dataset.rok],r=val("w"+b.dataset.rok);
        if(!(r>0)){ERPShell.toast("Check the rent.","error");return}
        run(b,()=>client.rpc("lwb_hired_rate_verify",{p_rate_id:g.rate_id,p_ok:true,p_rate:r,p_note:null}),"Verified: "+g.party+" "+rs(r))});
      el("rateBody").querySelectorAll("[data-rback]").forEach(b=>b.onclick=async()=>{const g=wait[+b.dataset.rback];
        const why=await prompt("Send back "+g.no+" → "+g.party+" ("+rs(g.rate)+")? Write why:","");if(why==null)return;
        run(b,()=>client.rpc("lwb_hired_rate_verify",{p_rate_id:g.rate_id,p_ok:false,p_rate:null,p_note:why}),"Sent back")});
    }
    function render(){
      const K=KIND[tab];
      el("pageTitle").textContent=K.title;el("pageSub").textContent=K.sub;document.title=K.title+" | Luxury Wrist Brand ERP";
      document.querySelectorAll("#tabs .erp-pill").forEach(a=>a.classList.toggle("active",a.dataset.tab===tab));
      el("empPill").hidden=!empRole();el("drvPill").hidden=empRole()||me.role!=="transport";
      el("formCard").hidden=!!K.ro;el("xlCard").hidden=!!K.ro||!xlOpen;el("xlBtn").hidden=!!K.ro;const nb=document.querySelector("#listTools .mp-new");if(nb)nb.textContent="+ New "+K.one;el("roleFilter").hidden=tab!=="employees";el("setupMsg").hidden=tab==="employees"?!empErr:!missing;if(tab==="employees"&&empErr)el("setupMsg").textContent=empErr;
      const crumb=document.querySelector(".erp-crumb b");if(crumb)crumb.textContent=K.title;
      el("ratePill").hidden=!RL;el("listCard").hidden=tab==="rates";el("rateCard").hidden=tab!=="rates";
      const rn=RL?RL.groups.filter(g=>RL.is_admin||g.status!=="WAITING").length:0;el("rateCnt").hidden=!rn;el("rateCnt").textContent=rn;
      if(tab==="rates")renderRates();
      document.querySelectorAll(".erp-link").forEach(a=>a.classList.toggle("active",a.getAttribute("href")==="fleet-master.html#"+tab));
      fillForm();renderList();
    }

    /* Excel: one column list per master. Blank cell on an existing row keeps the old value. */
    const XL={
      vehicles:[{h:"Vehicle No",k:"vehicle_no",req:1,sample:"GJ05FW9821",note:"Vehicle number. Spaces / dashes are allowed.",alias:["Vehicle Number","Vehicle"]},
        {h:"Vehicle Type",k:"vehicle_type",sample:"Tempo",note:VTYPES.join(", ")},
        {h:"Capacity KG",k:"capacity_kg",sample:"3000",note:"Load capacity in KG"},
        {h:"Ownership",k:"ownership",sample:"OWN",note:"OWN or TRANSPORTER"},
        {h:"Transporter Name",k:"transporter_name",sample:"",note:"Transporter name, if a transporter vehicle",alias:["Transporter","Owner Name"]},
        {h:"Owner Mobile",k:"owner_mobile",sample:"",note:"10 digit"},
        ...DOCS.map(([k,l])=>({h:l+" Expiry",k,sample:"",note:"Date: dd/mm/yyyy"})),
        {h:"Status",k:"status",sample:"Active",note:"Active / Inactive"},
        {h:"Note",k:"note",sample:""}],
      employees:[{h:"Employee ID",k:"emp_code",sample:"",note:"Blank = the ERP gives the next ID",alias:["Emp ID","ID","Code"]},
        {h:"Employee Name",k:"name",req:1,sample:"Ramesh Patel",alias:["Name","Employee"]},
        {h:"Mobile",k:"mobile",sample:"9876543210",note:"10 digits"},
        {h:"Work / Post",k:"designation",req:1,sample:"Driver",note:WORKS.join(", "),alias:["Work","Post","Designation","Role"]},
        {h:"Monthly Salary",k:"monthly_salary",sample:"15000",note:"Rupees per month",alias:["Salary"]},
        {h:"Joining Date",k:"joining_date",sample:"",note:"Date: dd/mm/yyyy"},
        {h:"Status",k:"status",sample:"Working",note:"Working / Left"},
        {h:"Note",k:"note",sample:""},
        {h:"Alt Mobile",k:"alt_mobile",sample:"",note:"Drivers: 10 digits"},
        {h:"License No",k:"license_no",sample:"",note:"Drivers",alias:["Licence No","DL No"]},
        {h:"License Expiry",k:"license_expiry",sample:"",note:"Drivers. Date: dd/mm/yyyy",alias:["Licence Expiry"]},
        {h:"Default Vehicle",k:"default_vehicle",sample:"",note:"Drivers. Vehicle number exactly as in Vehicle Master"},
        {h:"Transporter Name",k:"transporter_name",sample:"",note:"Drivers",alias:["Transporter"]},
        {h:"Address",k:"address",sample:""}]
    };
    function xlExport(){
      if(tab==="employees")return data.employees.map(r=>({...r,status:r.is_active?"Working":"Left",joining_date:showDate(r.joining_date),license_expiry:showDate(r.license_expiry),default_vehicle:r.vehicle_no||"",monthly_salary:Number(r.monthly_salary)||0}));
      return data[tab].map(r=>{const o={...r,status:r.is_active?"Active":"Inactive"};
        for(const [k] of DOCS)o[k]=showDate(r[k]);return o});
    }
    function xlPlanEmp(rows){
      const p={add:[],update:[],errors:[],same:0},seen=new Set(),cols=XL.employees.map(c=>c.k).filter(k=>k!=="status"&&k!=="default_vehicle");
      for(const r of rows){
        const err=m=>p.errors.push("Row "+r._row+": "+m),o={};
        for(const k of cols){const v=r[k];if(!blank(v))o[k]=typeof v==="string"?v.trim():v}
        if(o.emp_code)o.emp_code=String(o.emp_code).toUpperCase().replace(/\s+/g,"");
        if(o.name)o.name=String(o.name).replace(/\s+/g," ");
        if("mobile" in o)o.mobile=phone(o.mobile);
        if("monthly_salary" in o)o.monthly_salary=LWBExcel.num(o.monthly_salary);
        if("joining_date" in o){const d=toDate(o.joining_date);if(d===undefined){err("Joining date is not valid: "+o.joining_date);continue}o.joining_date=d}
        if("license_expiry" in o){const d=toDate(o.license_expiry);if(d===undefined){err("Licence expiry is not valid: "+o.license_expiry);continue}o.license_expiry=d}
        if("alt_mobile" in o)o.alt_mobile=phone(o.alt_mobile);
        if("license_no" in o)o.license_no=String(o.license_no).toUpperCase();
        if("designation" in o){const w=WORKS.find(x=>roleKey(x)===roleKey(o.designation));if(w)o.designation=w}
        if(!blank(r.default_vehicle)){const v=data.vehicles.find(x=>x.vehicle_no===plate(r.default_vehicle));if(!v){err("Default vehicle "+r.default_vehicle+" is not in Vehicle Master");continue}o.default_vehicle_id=v.id}
        const st=blank(r.status)?null:/^(working|active|yes|y|1|true)$/i.test(String(r.status).trim())?true:/^(left|inactive|no|n|0|false)$/i.test(String(r.status).trim())?false:undefined;
        if(st===undefined){err("Status must be Working or Left");continue}if(st!=null)o.is_active=st;
        const old=data.employees.find(x=>o.emp_code?x.emp_code===o.emp_code:o.name&&x.name.toLowerCase()===o.name.toLowerCase());
        const key=old?"id"+old.id:o.emp_code||String(o.name||"").toLowerCase();
        if(seen.has(key)){err("This employee appears twice in the file");continue}seen.add(key);
        const full=old?{...old,...o}:{is_active:true,monthly_salary:0,...o};
        const msg=check(full,old&&old.id);if(msg){err(msg);continue}
        if(!old){p.add.push(full);continue}
        const ch=Object.keys(o).some(k=>String(o[k]??"")!==String(old[k]??""));
        if(ch)p.update.push({id:old.id,row:full});else p.same++;
      }
      return p;
    }
    async function xlApplyEmp(p,progress){
      const all=[...p.add.map(r=>({...r,id:null})),...p.update.map(u=>({...u.row,id:u.id}))];let n=0;
      for(const r of all){progress("Saving "+(++n)+" / "+all.length);
        const x=await client.rpc("lwb_emp_save2",{p:{id:r.id,emp_code:r.emp_code||null,name:r.name,mobile:r.mobile||null,designation:r.designation||null,monthly_salary:r.monthly_salary||0,joining_date:r.joining_date||null,note:r.note||null,is_active:r.is_active!==false,
          alt_mobile:r.alt_mobile||null,license_no:r.license_no||null,license_expiry:r.license_expiry||null,default_vehicle_id:r.default_vehicle_id||null,transporter_name:r.transporter_name||null,address:r.address||null}});
        if(x.error)throw Error("Stopped at "+(r.emp_code||r.name)+": "+x.error.message)}
      await load();render();
      return p.add.length+" added, "+p.update.length+" updated.";
    }
    function xlPlan(rows){
      if(tab==="employees")return xlPlanEmp(rows);
      const p={add:[],update:[],errors:[],same:0},seen=new Set(),dateKeys=DOCS.map(d=>d[0]);
      for(const r of rows){
        const o={},err=m=>p.errors.push("Row "+r._row+": "+m);let bad=false;
        for(const c of XL[tab]){if(c.k==="status")continue;const v=r[c.k];if(!blank(v))o[c.k]=typeof v==="string"?v.trim():v}
        for(const k of dateKeys)if(k in o){const d=toDate(o[k]);if(d===undefined){err(k.replace("_"," ")+" date is not valid: "+o[k]);bad=true}else o[k]=d}
        const st=status(r.status);if(st===undefined){err("Status must be Active or Inactive");bad=true}else if(st!=null)o.is_active=st;
        o.vehicle_no=plate(r.vehicle_no);
        if("owner_mobile" in o)o.owner_mobile=phone(o.owner_mobile);
        if("capacity_kg" in o){o.capacity_kg=LWBExcel.num(o.capacity_kg);if(!(o.capacity_kg>=0)){err("Capacity is not a number");bad=true}}
        if("ownership" in o){o.ownership=String(o.ownership).toUpperCase().startsWith("T")?"TRANSPORTER":"OWN"}
        if("vehicle_type" in o)o.vehicle_type=String(o.vehicle_type).slice(0,60);
        const key=o.vehicle_no;
        if(seen.has(key)){err("This vehicle appears twice in the file: "+key);continue}
        seen.add(key);
        const old=data.vehicles.find(x=>x.vehicle_no===key);
        const full=old?{...old,...o}:{is_active:true,ownership:"OWN",...o};
        const msg=check(full,old&&old.id);if(msg){err(msg);continue}
        if(bad)continue;
        if(!old){p.add.push(full);continue}
        const ch={};for(const k in o)if(String(o[k]??"")!==String(old[k]??""))ch[k]=o[k];
        if(Object.keys(ch).length)p.update.push({id:old.id,ch});else p.same++;
      }
      return p;
    }
    async function xlApply(p,progress){
      if(tab==="employees")return xlApplyEmp(p,progress);
      const T=KIND[tab].table,cols=KIND[tab].fields.map(f=>f.k);
      if(p.add.length){progress("Saving "+p.add.length+" new records...");
        const rows=p.add.map(r=>Object.fromEntries(cols.filter(k=>r[k]!==undefined).map(k=>[k,r[k]])));
        const r=await client.from(T).insert(rows);if(r.error)throw Error("Add failed: "+r.error.message)}
      let n=0;for(const u of p.update){progress("Update "+(++n)+" / "+p.update.length);const r=await client.from(T).update(u.ch).eq("id",u.id);if(r.error)throw Error("Update stopped ("+n+"): "+r.error.message)}
      await load();render();
      return p.add.length+" added, "+p.update.length+" updated.";
    }
    let xlBox=null;
    function mountXl(){
      if(xlBox)xlBox.remove();xlBox=null;
      if(KIND[tab].ro)return;
      xlBox=LWBExcel.panel({mount:el("xlPanel"),file:KIND[tab].title.replace(" ","-"),columns:XL[tab],exportRows:xlExport,plan:xlPlan,apply:xlApply,canImport:()=>can()&&(tab==="employees"?!empErr:!missing)});
    }

    // #drivers (old Driver Master link): Employee Master showing drivers; Transport gets the read-only list.
    function setTab(){let t=location.hash.replace("#","");
      if(t==="drivers"&&empRole()){t="employees";el("roleFilter").value="driver"}
      tab=KIND[t]&&(t!=="employees"||empRole())&&(t!=="drivers"||me.role==="transport")&&(t!=="rates"||!!RL)?t:"vehicles";editing=null;docKey="";mountXl();render();loadAvatars()}
    document.addEventListener("click",e=>{
      const t=e.target;
      if(t.dataset.edit){editing=data[tab].find(x=>String(x.id)===t.dataset.edit)||null;docKey="";render();if(window.MP)MP.open();else el("formCard").scrollIntoView({behavior:"smooth"});return}
      if(t.dataset.del){remove(t.dataset.del);return}
      if(t.dataset.login){createLogin(t.dataset.login);return}
    });
    el("save").onclick=save;
    // List first; "+ New Vehicle / Employee" and Edit open the form in a popup (master-popup.js). Excel opens on its button.
    let xlOpen=false;
    el("xlBtn").onclick=()=>{xlOpen=!xlOpen;el("xlCard").hidden=!xlOpen;if(xlOpen)el("xlCard").scrollIntoView({behavior:"smooth",block:"nearest"})};
    el("clear").onclick=()=>{editing=null;docKey="";render()};
    el("search").oninput=renderList;el("filter").onchange=renderList;el("roleFilter").onchange=()=>{if(!editing&&!busy)fillForm();renderList()};
    el("roleFilter").append(...WORKS.map(w=>new Option(w,roleKey(w))));
    window.addEventListener("hashchange",setTab);

    (async()=>{
      me=await start();if(!me)return;
      ERPShell.mount({role:me.realRole||me.role,name:me.name,onLogout:async()=>{await client.auth.signOut();location.replace("login.html")},group:"Masters"});
      await load();
      el("loading").hidden=true;el("page").hidden=false;
      el("xlCard").parentNode.appendChild(el("xlCard"));
      window.MP=LWBMasterPopup.mount({panel:"formCard",bar:"listTools",newLabel:"+ New",onNew:()=>{editing=null;docKey="";render()},canNew:()=>!KIND[tab].ro&&can(),cancelAfter:"clear",cards:".fm-table",mainCol:1});
      setTab();
    })();
  </script>
