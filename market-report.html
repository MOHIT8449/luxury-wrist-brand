<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outside Market Stock | Luxury Wrist Brand ERP</title>
  <script src="erp-date.js"></script><script src="erp-recent.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="erp-shell.css">
  <link rel="stylesheet" href="sales.css">
  <script src="erp-shell.js"></script>
<script src="erp-list.js"></script>
  <script src="sales-common.js"></script>
  <style>
    .mk-form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .mk-form label{display:block;font-size:12px;font-weight:600;color:#4b5763;margin-bottom:3px}
    .mk-form input,.mk-form textarea{width:100%;box-sizing:border-box;height:40px;border:1.5px solid var(--erp-line);border-radius:6px;padding:0 10px;font:inherit;background:#fff}
    .mk-form input:focus,.mk-form textarea:focus{outline:none;border-color:var(--erp-red)}
    .mk-form textarea{height:58px;padding:8px 10px;resize:vertical}
    .mk-form .wide{grid-column:1/-1}.mk-form .half{grid-column:span 2}
    .mk-photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .mk-form .mk-shot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:84px;text-align:center;border:1.5px dashed #c9cfd6;border-radius:8px;background:#fafbfc;cursor:pointer;overflow:hidden;font-size:12.5px;font-weight:600;color:#4b5763;margin:0!important}
    .mk-shot .ic{font-size:22px;line-height:1}
    .mk-shot input{position:absolute;inset:0;opacity:0;cursor:pointer;height:100%!important}
    .mk-shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .mk-shot.has{border-style:solid;border-color:var(--erp-red)}
    .mk-shot .tag{position:absolute;left:4px;bottom:4px;background:#000a;color:#fff;font-size:11px;border-radius:4px;padding:1px 5px;z-index:1}
    .mk-shot .clr{position:absolute;right:3px;top:3px;z-index:2;border:0;border-radius:50%;width:22px;height:22px;background:#000a;color:#fff;font-size:12px;cursor:pointer}
    .mk-end{grid-column:1/-1;display:flex;gap:10px;align-items:center}
    .mk-end small{flex:1;color:var(--erp-muted);font-size:12px}
    .mk-list{display:grid;gap:10px}
    .mk-item{background:#fff;border:1px solid var(--erp-line);border-radius:8px;padding:12px 14px;display:grid;gap:6px}
    .mk-item.open{border-left:4px solid var(--erp-red)}
    .mk-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .mk-top b{font-size:14.5px}.mk-top .grow{flex:1}
    .mk-meta{font-size:12.5px;color:var(--erp-muted)}
    .mk-facts{display:flex;gap:6px;flex-wrap:wrap}
    .mk-facts span{background:#f3f4f6;border-radius:5px;padding:2px 8px;font-size:12.5px}
    .mk-note{font-size:13.5px;white-space:pre-wrap}
    .mk-imgs{display:flex;gap:6px;flex-wrap:wrap}
    .mk-imgs img{width:96px;height:72px;border-radius:6px;border:1px solid var(--erp-line);cursor:pointer;object-fit:cover}
    .mk-review{font-size:12.5px;background:#f6f7f9;border-radius:6px;padding:6px 8px}
    .mk-btns{display:flex;gap:8px;flex-wrap:wrap}
    @media(max-width:760px){.mk-form{grid-template-columns:1fr 1fr}.mk-form .half{grid-column:1/-1}}
  </style>
</head>
<body>
  <div id="loading" class="status">Checking account access...</div>
  <main id="page" class="erp-main" hidden>
    <div class="erp-pagehead"><h1>Outside Market Stock</h1><span class="grow"></span><button type="button" class="sl-btn small" id="newBtn" hidden>+ New Report</button></div>
    <p class="sl-sub">Goods coming into your market from outside. Fill what you know, every field is optional. Admin and the Sales Head get it at once.</p>

    <section class="erp-card" id="formCard" style="margin-bottom:14px">
      <form class="erp-card-body mk-form" id="form" autocomplete="off">
        <div class="half"><label for="f_outlet">Outlet Name</label><input id="f_outlet" list="partyList" maxlength="150" placeholder="Shop / party name"></div>
        <div class="half"><label for="f_sku">SKU</label><input id="f_sku" list="skuList" maxlength="150" placeholder="Search SKU"></div>
        <div><label for="f_cases">Cases Lying</label><input id="f_cases" type="number" min="0" step="1" inputmode="numeric" placeholder="CS"></div>
        <div><label for="f_rate">Outside Rate ₹</label><input id="f_rate" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Per case"></div>
        <div class="half"><label for="f_note">Note</label><textarea id="f_note" maxlength="1000" placeholder="Coming from which area / dealer, vehicle no."></textarea></div>
        <div class="wide mk-photos">
          <label class="mk-shot" data-slot="Outlet"><span class="ic">🏪</span>Outlet photo<input type="file" accept="image/*" capture="environment" aria-label="Outlet photo"></label>
          <label class="mk-shot" data-slot="Stock"><span class="ic">📦</span>Stock photo<input type="file" accept="image/*" capture="environment" aria-label="Stock photo"></label>
          <label class="mk-shot" data-slot="Vehicle"><span class="ic">🚚</span>Vehicle photo<input type="file" accept="image/*" capture="environment" aria-label="Vehicle photo"></label>
        </div>
        <div class="mk-end"><small id="formHint">Photos are made smaller before upload.</small><button type="button" class="sl-btn ghost" id="cancel" hidden>Close</button><button type="submit" class="sl-btn" id="send">Send Report</button></div>
      </form>
    </section>

    <div class="sl-filters">
      <div><label for="days">Period</label><select id="days"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option></select></div>
      <div id="stateBox"><label for="state">Status</label><select id="state"><option value="">All</option><option value="OPEN">Not seen</option><option value="SEEN">Seen</option><option value="ACTION_TAKEN">Action taken</option></select></div>
      <div class="grow"><label for="q">Search</label><input id="q" type="search" placeholder="Outlet, SKU, salesman"></div>
    </div>
    <div class="sl-kpis" id="kpis" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))"></div>
    <div class="mk-list" id="list"></div>
  </main>
  <datalist id="skuList"></datalist>
  <datalist id="partyList"></datalist>
  <script>
    const S=LWBSales,{client,el,esc,fmt}=S;
    let me=null,rows=[],names=new Map(),photos=new Map();
    const head=()=>["admin","manager"].includes(me.role);
    const RSTATE={OPEN:["Not seen","red"],SEEN:["Seen","blue"],ACTION_TAKEN:["Action taken","green"]};
    const when=v=>LWBDate.dt(v);
    const setupMsg="Run lwb_announcements_market_report_setup.sql in Supabase first.";

    // Phone photos are large: resize to 1280px JPEG before upload.
    function shrink(file){
      return new Promise((ok,bad)=>{
        const img=new Image(),url=URL.createObjectURL(file);
        img.onload=()=>{const s=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement("canvas");
          c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
          URL.revokeObjectURL(url);c.toBlob(b=>b?ok(b):bad(Error("Photo could not be read")),"image/jpeg",0.8)};
        img.onerror=()=>bad(Error("Photo could not be read"));img.src=url;
      });
    }
    function showShot(shot){
      const f=shot.querySelector("input").files[0];
      shot.querySelectorAll("img,.tag,.clr").forEach(x=>x.remove());
      shot.classList.toggle("has",!!f);
      if(!f)return;
      const img=document.createElement("img");img.alt=shot.dataset.slot+" photo";img.src=URL.createObjectURL(f);
      const tag=document.createElement("span");tag.className="tag";tag.textContent=shot.dataset.slot;
      const clr=document.createElement("button");clr.type="button";clr.className="clr";clr.textContent="✕";clr.title="Remove photo";
      shot.append(img,tag,clr);
    }
    function clearForm(){el("form").reset();document.querySelectorAll(".mk-shot").forEach(showShot)}
    function showForm(on){el("formCard").hidden=!on;el("newBtn").hidden=on||!head();el("cancel").hidden=!head()}

    async function send(e){
      e.preventDefault();
      const v=id=>el(id).value.trim();
      const p={outlet_name:v("f_outlet"),sku_name:v("f_sku"),cases:v("f_cases"),outside_rate:v("f_rate"),note:v("f_note"),photo_paths:[]};
      const files=[...document.querySelectorAll(".mk-shot input")].map(i=>i.files[0]).filter(Boolean);
      if(!p.outlet_name&&!p.sku_name&&!p.cases&&!p.outside_rate&&!p.note&&!files.length){await alert("Fill at least one detail or add a photo.");return}
      if(p.cases&&!/^\d+$/.test(p.cases)){await alert("Enter whole cases.");return}
      const btn=el("send");btn.disabled=true;btn.textContent="Sending...";
      try{
        for(const [n,f] of files.entries()){
          btn.textContent="Photo "+(n+1)+" of "+files.length+"...";
          const path=me.user.id+"/"+Date.now()+"-"+n+".jpg";
          const up=await client.storage.from("lwb-market-photos").upload(path,await shrink(f),{contentType:"image/jpeg"});
          if(up.error)throw Error(/bucket/i.test(up.error.message)?setupMsg:"Photo upload failed: "+up.error.message);
          p.photo_paths.push(path);
        }
        btn.textContent="Sending...";
        const {error}=await client.rpc("lwb_add_market_report",{p});
        if(error)throw Error(/lwb_add_market_report/.test(error.message)?setupMsg:error.message);
        ERPShell.toast("Report sent to Admin and Sales Head.");
        clearForm();if(head())showForm(false);await load();
      }catch(err){await alert("Could not send: "+err.message)}
      finally{btn.disabled=false;btn.textContent="Send Report"}
    }

    async function load(){
      const from=new Date(Date.now()-(Number(el("days").value)-1)*864e5);
      const r=await client.from("lwb_market_reports").select("*").gte("report_date",S.isoDay(from)).order("created_at",{ascending:false}).limit(500);
      if(r.error){el("list").innerHTML='<div class="sl-msg">'+esc(/lwb_market_reports/.test(r.error.message)?setupMsg:r.error.message)+"</div>";el("kpis").innerHTML="";return}
      rows=ERPRecent.sort(r.data||[]);
      const ids=[...new Set(rows.flatMap(x=>[x.created_by,x.reviewed_by]).filter(id=>id&&!names.has(id)))];
      if(ids.length){const u=await client.from("user_profiles").select("id,full_name").in("id",ids);for(const x of u.data||[])names.set(x.id,x.full_name)}
      render();
    }
    function render(){
      const st=el("state").value,q=el("q").value.trim().toLowerCase();
      const list=rows.filter(x=>(!st||x.review_status===st)&&(!q||[x.outlet_name,x.sku_name,x.note,names.get(x.created_by)].join(" ").toLowerCase().includes(q)));
      const open=rows.filter(x=>x.review_status==="OPEN").length;
      el("kpis").innerHTML=[["","Reports",fmt(rows.length),new Set(rows.map(x=>x.outlet_name).filter(Boolean)).size+" outlets"],
        ["","Cases Reported",fmt(rows.reduce((a,x)=>a+Number(x.cases||0),0)),new Set(rows.map(x=>x.sku_name).filter(Boolean)).size+" SKUs"],
        [open?"red":"green","Not Seen Yet",fmt(open),fmt(rows.filter(x=>x.review_status==="ACTION_TAKEN").length)+" action taken"]]
        .map(x=>'<div class="sl-kpi '+x[0]+'"><span>'+esc(x[1])+"</span><b>"+x[2]+"</b><small>"+esc(x[3])+"</small></div>").join("");
      // Count card → list of those reports (erp-list.js)
      if(window.ERPList){const KL=[["Reports",()=>true],["Cases Reported",x=>Number(x.cases||0)>0],["Not Seen Yet",x=>x.review_status==="OPEN"]];
        const MC=[{t:"Date",v:"report_date",date:true},{t:"Outlet",v:"outlet_name"},{t:"SKU",v:"sku_name"},{t:"Cases",v:"cases",num:true,sum:true,dec:0},{t:"Outside rate",v:"outside_rate",money:true,dec:2},
          {t:"By",v:x=>names.get(x.created_by)||""},{t:"Status",v:x=>(RSTATE[x.review_status]||[x.review_status])[0]},{t:"Note",v:"note"}];
        el("kpis").querySelectorAll(".sl-kpi").forEach((c,i)=>ERPList.card(c,()=>({title:KL[i][0],sub:"Last "+el("days").value+" days",rows:rows.filter(KL[i][1]),cols:MC})))}
      if(!list.length){el("list").innerHTML='<div class="erp-empty">No report in this period.</div>';return}
      el("list").innerHTML=list.map(x=>{
        const rs=RSTATE[x.review_status]||["",""];
        const facts=[x.sku_name&&"SKU "+esc(x.sku_name),x.cases!=null&&fmt(x.cases)+" CS",x.outside_rate!=null&&"Outside rate ₹"+Number(x.outside_rate).toLocaleString("en-IN")].filter(Boolean);
        let btns="";
        if(head()&&x.review_status!=="ACTION_TAKEN")btns=(x.review_status==="OPEN"?'<button type="button" class="sl-btn ghost small" data-r="SEEN" data-id="'+x.id+'">Mark seen</button>':"")+'<button type="button" class="sl-btn ghost small" data-r="ACTION_TAKEN" data-id="'+x.id+'">Action taken…</button>';
        return '<div class="mk-item'+(x.review_status==="OPEN"?" open":"")+'"><div class="mk-top"><span>🚩</span><b>'+esc(x.outlet_name||"Outlet not named")+'</b><span class="grow"></span><span class="erp-badge '+rs[1]+'">'+rs[0]+"</span></div>"+
          (facts.length?'<div class="mk-facts">'+facts.map(f=>"<span>"+f+"</span>").join("")+"</div>":"")+
          (x.note?'<div class="mk-note">'+esc(x.note)+"</div>":"")+
          ((x.photo_paths||[]).length?'<div class="mk-imgs">'+x.photo_paths.map(p=>'<img data-photo="'+esc(p)+'" alt="Report photo">').join("")+"</div>":"")+
          '<div class="mk-meta">MKT-'+x.id+" · "+esc(names.get(x.created_by)||"Salesman")+" · "+when(x.created_at)+"</div>"+
          (x.review_status!=="OPEN"?'<div class="mk-review">'+esc(rs[0])+" by "+esc(names.get(x.reviewed_by)||"Sales Head")+(x.reviewed_at?" · "+when(x.reviewed_at):"")+(x.review_note?": "+esc(x.review_note):"")+"</div>":"")+
          (btns?'<div class="mk-btns">'+btns+"</div>":"")+"</div>";
      }).join("");
      showPhotos();
    }
    async function showPhotos(){
      for(const img of document.querySelectorAll("img[data-photo]")){
        const p=img.dataset.photo;
        if(!photos.has(p)){const r=await client.storage.from("lwb-market-photos").createSignedUrl(p,3600);photos.set(p,r.data?r.data.signedUrl:"")}
        if(photos.get(p))img.src=photos.get(p);else img.replaceWith(document.createTextNode("Photo not available"));
      }
    }

    (async()=>{
      me=await S.start(["admin","manager","sales"]);if(!me)return;
      showForm(!head());
      el("stateBox").hidden=!head();
      Promise.all([client.from("sku_master").select("sku_name").eq("is_active",true).order("sku_name"),
        client.from("lwb_customer_master").select("customer_name").eq("is_active",true).order("customer_name").limit(1000)]).then(([sk,pt])=>{
        el("skuList").innerHTML=(sk.data||[]).map(s=>'<option value="'+esc(s.sku_name)+'">').join("");
        el("partyList").innerHTML=(pt.data||[]).map(s=>'<option value="'+esc(s.customer_name)+'">').join("");
      });
      document.querySelectorAll(".mk-shot input").forEach(i=>i.addEventListener("change",()=>showShot(i.closest(".mk-shot"))));
      document.addEventListener("click",async e=>{
        const c=e.target.closest(".clr");if(c){e.preventDefault();const s=c.closest(".mk-shot");s.querySelector("input").value="";showShot(s);return}
        const im=e.target.closest("img[data-photo]");if(im&&im.src){window.open(im.src,"_blank","noopener");return}
        const r=e.target.closest("[data-r]");
        if(r){
          let note="";
          if(r.dataset.r==="ACTION_TAKEN"){note=await prompt("What action was taken? The salesman will see this.","",{placeholder:"e.g. Spoke to the dealer; rate matched for this outlet"});if(note===null)return}
          const {error}=await client.rpc("lwb_review_market_report",{p_id:Number(r.dataset.id),p_status:r.dataset.r,p_note:note});
          if(error){await alert(error.message);return}await load();
        }
      });
      el("newBtn").onclick=()=>{showForm(true);el("f_outlet").focus()};
      el("cancel").onclick=()=>{clearForm();showForm(false)};
      el("form").addEventListener("submit",send);
      el("days").addEventListener("change",load);
      ["state","q"].forEach(id=>el(id).addEventListener("input",render));
      el("loading").hidden=true;el("page").hidden=false;
      await load();
    })();
  </script>
</body>
</html>
