<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="erp-fit.js"></script>
  <title>Party Rate Offer | Luxury Wrist Brand ERP</title>
  <script src="erp-date.js"></script><script src="erp-period.js"></script>
  <script src="vendor/supabase-js-2.119.0.js"></script>
  <link rel="stylesheet" href="erp-shell.css">
  <link rel="stylesheet" href="sales.css">
  <script src="erp-shell.js"></script>
  <script src="sales-common.js"></script>
  <script src="party-list.js"></script>
  <script src="mepd-scheme.js"></script>
  <style>
    /* Party Rate Offer (lwb_party_rate_offer_setup.sql, Mohit 16 Nov 2026): like a PO, party + category / pack + rate per case,
       saved as the rate given to that party, shared as an image; (i) = the rates this party got before. */
    .pr-wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:10px;align-items:start}
    .pr-card{background:#fff;border:1px solid var(--erp-line,#dfe4ea);border-radius:8px;padding:10px 12px;min-width:0}
    .pr-card h2{font-size:14px;margin:0 0 8px;display:flex;align-items:center;gap:6px}
    .pr-top{display:grid;grid-template-columns:minmax(0,1fr) 72px 140px;gap:6px;margin-bottom:8px}
    .pr-top label,.pr-note label{display:block;font-size:11px;color:#556;font-weight:600;margin-bottom:2px}
    .pr-in{width:100%;height:34px;border:1.5px solid #e3e7ec;border-radius:6px;padding:0 8px;font:inherit;font-size:13.5px;box-sizing:border-box;background:#fff}
    .pr-in:focus{border-color:var(--erp-red,#c8102e);outline:none}
    .pr-lines{width:100%;border-collapse:collapse;font-size:13px}
    .pr-lines th{font-size:11.5px;text-align:left;color:#556;font-weight:600;padding:5px 4px;border-bottom:1px solid #e3e7ec;background:#f7f8fa;white-space:nowrap}
    .pr-lines td{padding:3px 4px;border-bottom:1px solid #eef1f4;vertical-align:middle}
    .pr-lines td.no{color:#6b7785;width:22px;text-align:center}
    .pr-lines td.rt{width:110px}.pr-lines td.rt input,.pr-lines td.mg input{text-align:right}
    .pr-lines td.mg{width:90px}.pr-lines td.mg input.neg{border-color:#c8102e;color:#c8102e}
    .pr-lines td.last{width:300px;font-size:12px;color:#4b5563;white-space:nowrap}
    .pr-lines td.act{width:62px;white-space:nowrap;text-align:right}
    .pr-lines small{display:block;font-size:10.5px;color:#6b7785}
    .up{color:#13824a;font-weight:700}.dn{color:#c8102e;font-weight:700}.mut{color:#6b7785;font-size:12px}
    .pr-ib{width:22px;height:22px;border-radius:50%;border:1.5px solid #94a3b8;background:#fff;color:#475569;font:italic 700 12px/1 Georgia,serif;cursor:pointer;padding:0;vertical-align:middle}
    .pr-ib:hover{border-color:#0f766e;color:#0f766e;background:#f0fdfa}
    .pr-x{width:24px;height:24px;border:0;background:none;color:#9aa4b2;font-size:16px;cursor:pointer;padding:0;vertical-align:middle}
    .pr-x:hover{color:#c8102e}
    .pr-add{display:flex;gap:6px;align-items:center;margin:8px 0;flex-wrap:wrap}
    .pr-note{margin:6px 0 8px}
    .pr-row{display:flex;gap:6px;flex-wrap:nowrap;align-items:center}
    .pr-row .sl-btn{flex:1 1 0;min-width:0;padding:0 8px;overflow:hidden;text-overflow:ellipsis}
    .pr-msg{font-size:12.5px;margin:6px 0 0;min-height:16px}
    .pr-msg.bad{color:#c8102e;font-weight:600}.pr-msg.ok{color:#13824a;font-weight:600}
    .pr-list{list-style:none;margin:0;padding:0;max-height:calc(100vh - 230px);overflow:auto}
    .pr-list li{padding:7px 4px;border-bottom:1px solid #eef1f4;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px}
    .pr-list li:hover{background:#f7f8fa}
    .pr-list b{font-size:13px;overflow-wrap:anywhere}.pr-list .r{text-align:right;font-size:12px;color:#4b5563;white-space:nowrap}
    .pr-list .s{font-size:11.5px;color:#6b7785;grid-column:1/-1}
    .pr-list li.cx b{text-decoration:line-through;color:#9aa4b2}
    .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:9px;background:#fdecef;color:#b3263f;margin-left:4px}
    dialog.pr-dlg{border:0;border-radius:10px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 40px);box-shadow:0 12px 40px rgba(0,0,0,.25)}
    dialog.pr-dlg::backdrop{background:rgba(15,23,42,.45)}
    .pr-dh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #eef1f4}
    .pr-dh h3{font-size:14.5px;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
    .pr-db{padding:10px 12px;overflow:auto;max-height:calc(100vh - 180px)}
    .pr-df{padding:8px 12px;border-top:1px solid #eef1f4}
    .pr-hist{width:100%;border-collapse:collapse;font-size:13px}
    .pr-hist th{font-size:11px;text-align:left;color:#556;padding:4px;border-bottom:1px solid #e3e7ec}
    .pr-hist td{padding:5px 4px;border-bottom:1px solid #eef1f4}
    .pr-hist .n{text-align:right;white-space:nowrap}
    .pr-hist td:first-child,.pr-hist td.mut{white-space:nowrap}
    .pr-hist tr.cx td{color:#9aa4b2;text-decoration:line-through}
    .pr-now{background:#fff8e6;border:1px solid #f3d48a;border-radius:6px;padding:6px 8px;font-size:13px;margin-bottom:8px}
    /* Offer type + dates (lwb_party_rate_offer_dates_setup.sql, Mohit 22 Nov 2026) */
    .pr-type{display:flex;gap:6px;align-items:end;margin:-2px 0 8px;flex-wrap:nowrap}
    .pr-seg{display:flex;border:1.5px solid #e3e7ec;border-radius:6px;overflow:hidden;flex:1 1 auto;min-width:0;height:34px}
    .pr-seg button{flex:1 1 0;min-width:0;border:0;background:#fff;font:inherit;font-size:12.5px;font-weight:600;color:#475569;cursor:pointer;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pr-seg button+button{border-left:1.5px solid #e3e7ec}
    .pr-seg button.on{background:#0b3d91;color:#fff}
    .pr-to{flex:0 0 140px}.pr-to[hidden]{display:none}
    .pr-to label{display:block;font-size:11px;color:#556;font-weight:600;margin-bottom:2px}
    .pr-lock{font-size:11.5px;color:#0f5132;background:#e8f6ee;border:1px solid #b7e1c7;border-radius:6px;padding:4px 8px;margin:0 0 8px}
    .pr-chips{display:flex;gap:4px;margin:0 0 6px;flex-wrap:wrap}
    .pr-chips::-webkit-scrollbar{display:none}
    .pr-chips button{flex:none;border:1px solid #dfe4ea;background:#fff;border-radius:14px;font:inherit;font-size:12px;font-weight:600;color:#475569;padding:3px 10px;cursor:pointer}
    .pr-chips button.on{background:#0b3d91;border-color:#0b3d91;color:#fff}
    .pr-chips button small{font-weight:700;opacity:.75;margin-left:3px}
    .st{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:9px;margin-left:4px;vertical-align:1px;white-space:nowrap}
    .st.RUNNING{background:#e3f5ea;color:#13824a}.st.UPCOMING{background:#fff4d6;color:#8a5a00}
    .st.EXPIRED,.st.USED{background:#eef1f4;color:#6b7785}.st.CANCELLED{background:#fdecef;color:#b3263f}
    .ty{font-weight:700;color:#0b3d91}
    .pr-img{max-width:100%;border:1px solid #e3e7ec;border-radius:6px;display:block;margin:0 auto}
    /* ROI per line + report + rate-changed recheck (lwb_party_rate_roi_setup.sql, Mohit 22 Nov 2026) */
    .pr-roi{height:22px;border:1.5px solid #cbd5e1;background:#fff;color:#64748b;border-radius:11px;font:inherit;font-size:11px;font-weight:700;padding:0 7px;cursor:pointer;vertical-align:middle;margin-right:4px;white-space:nowrap}
    .pr-roi.on{background:#13824a;border-color:#13824a;color:#fff}
    .roi-all.on{background:#13824a;border-color:#13824a;color:#fff}
    .pr-card.roi-on{border-color:#13824a;box-shadow:inset 4px 0 0 #13824a}
    .pr-list li.roi{background:#effaf3;box-shadow:inset 4px 0 0 #13824a;padding-left:10px}.pr-list li.roi:hover{background:#e3f5ea}
    .pr-in.dup,.pr-in.dupph{border-color:#c8102e;background:#fff5f5}.pr-in.dupph::placeholder{color:#c8102e;font-weight:600;font-size:12.5px}
    .pr-lines td.roi{width:78px;white-space:nowrap}
    .pr-noroi{font:inherit;font-size:11px;color:#9aa4b2;font-weight:600;white-space:nowrap;border:0;background:none;padding:0;cursor:pointer}
    .pr-lines b.ld{color:#0b3d91}
    .pr-add .sm{display:none}
    .pr-roi.no{border-style:dashed;cursor:default;color:#9aa4b2}
    .roi-btn{cursor:pointer;font-weight:700;color:#13824a;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .st.ROI{background:#13824a;color:#fff}.st.RECHECK{background:#fff1e0;color:#b45309;border:1px solid #f5c48a}
    .pr-warn{background:#fff7ed;border:1px solid #f5c48a;color:#9a4b00;border-radius:6px;padding:5px 8px;font-size:12.5px;font-weight:600;margin:0 0 6px;cursor:pointer}
    .pr-hist tr.rc td{background:#fff7ed}
    .pr-hist .rcn{font-size:11.5px;color:#b45309;font-weight:600}
    .pr-kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 8px}
    .pr-kpi div{border:1px solid #e3e7ec;border-radius:8px;padding:6px 8px;min-width:0}
    .pr-kpi small{display:block;font-size:11px;color:#6b7785;font-weight:600}
    .pr-kpi b{display:block;font-size:18px;line-height:1.25}
    .pr-kpi span{font-size:11px;color:#6b7785}
    .pr-kpi .e b{color:#0b3d91}.pr-kpi .g b{color:#b45309}.pr-kpi .bal b{color:#13824a}.pr-kpi .bal.neg b{color:#c8102e}
    .pr-rhead{display:flex;gap:6px;align-items:center;margin:0 0 8px}
    .pr-rhead input{flex:0 0 150px}
    .pr-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 10px;margin:6px 0}
    .pr-cats label{font-size:13px;display:flex;gap:6px;align-items:center}
    .pr-sub td{font-size:12px;color:#4b5563;padding-left:18px!important}
    .pr-list .r .st{margin:0 0 0 4px}
    @media(max-width:900px){.pr-wrap{grid-template-columns:minmax(0,1fr)}.pr-list{max-height:none}}
    @media(max-width:640px){
      .pr-top{grid-template-columns:minmax(0,1fr) 60px 128px}
      .pr-lines thead{display:none}
      /* Phone (Mohit, 22 Nov 2026: pack name was cut): row 1 = full-width pack name, row 2 = rate + margin, row 3 = ROI / last */
      /* 23 Nov 2026 (phone-friendly): row 2 = Rate · Margin · ROI pill; row 3 = one small muted line (first time / last · List · Landing) */
      .pr-lines tr{display:grid;grid-template-columns:20px minmax(0,1fr) minmax(0,1fr) 68px;gap:4px 6px;align-items:center;padding:6px 0;border-bottom:1px solid #eef1f4}
      .pr-lines td{border:0;padding:0!important;width:auto!important;background:none!important}
      .pr-lines td.no{grid-row:1/4;align-self:start;padding-top:9px!important;font-size:12px}
      .pr-lines td.it{grid-row:1;grid-column:2/4}
      .pr-lines td.act{grid-row:1;grid-column:4;text-align:right}
      .pr-lines td.roi{grid-row:2;grid-column:4;text-align:center}
      .pr-lines td.roi .pr-roi{margin:0;height:30px;width:100%;border-radius:15px;font-size:11.5px;padding:0 4px}
      .pr-lines .pr-in{height:34px}
      .pr-lines td.rt{grid-row:2;grid-column:2}.pr-lines td.mg{grid-row:2;grid-column:3}
      .pr-lines td.last{grid-row:3;grid-column:2/-1;white-space:normal;line-height:1.3;font-size:11.5px}
      .pr-lines td.last small{display:inline;margin-left:4px;font-size:11.5px}
      .pr-lines td.last:empty{display:none}
      .pr-lock{font-size:11px;padding:3px 7px;line-height:1.35}
      .pr-add{flex-wrap:nowrap;gap:5px;margin:6px 0}
      .pr-add .sl-btn{flex:1 1 0;min-width:0;padding:0 4px;height:32px;font-size:12.5px}
      .pr-add .lg,#cnt{display:none}.pr-add .sm{display:inline}
      .pr-row .sl-btn{height:38px}
      .pr-row .sl-btn{font-size:12.5px;padding:0 4px}
      .pr-chips{gap:3px;margin-bottom:5px}.pr-chips button{font-size:11.5px;padding:2px 7px}
      .pr-type{flex-wrap:wrap}.pr-type>div:first-child{flex:1 1 100%}
      .pr-to{flex:1 1 100%;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center}.pr-to label{margin:0}
    }
  </style>
</head>
<body>
  <div id="loading" class="status">Checking account access...</div>
  <main id="page" class="erp-main" hidden>
    <div class="erp-pagehead"><h1>Party Rate Offer<button type="button" class="erp-i" aria-label="Info" title="Info" data-tip="Like making a PO: pick the party, add each category / pack with the rate per case, Save. The rate is kept as given to that party. Tap (i) on a line to see what rate this party got before. ROI: tap ROI on a line when the rate uses the company ROI (landing − ₹5); only marked lines count as ROI (normal rates are landing + margin). Offers and POs with ROI show in green. ROI report = ROI earned on the month's purchase vs ROI given to parties. When a pack's rate changes in Rate & Scheme, its running offers show ⚠ Recheck. Image / WhatsApp sends only party name, category and rate. Offer type: One-time = only the party's next order; Continuous = every order from the start date till cancelled; Date range = every order from start to end date. On those orders the rate fills by itself and the salesman cannot change it; Admin / Sales Head can.">i</button></h1></div>
    <div id="status" class="sl-msg" hidden></div>
    <div class="pr-wrap">
      <section class="pr-card" aria-labelledby="newT">
        <h2 id="newT"><span id="formTitle">New rate offer</span><span id="lastInfo" class="mut"></span></h2>
        <div class="pr-top">
          <div><label for="party">Party</label><input id="party" class="pr-in" data-party-list autocomplete="off" placeholder="Type party name"></div>
          <div><label for="roiBtn">ROI</label><button type="button" id="roiBtn" class="pr-in roi-btn" title="ROI ₹ per case and the categories with no ROI">₹5 ⚙</button></div>
          <div><label for="odate" id="odateL">From</label><input id="odate" class="pr-in" type="date"></div>
        </div>
        <div class="pr-type">
          <div style="flex:1 1 auto;min-width:0"><label style="display:block;font-size:11px;color:#556;font-weight:600;margin-bottom:2px">Offer type</label>
            <div class="pr-seg" id="otype" role="group" aria-label="Offer type">
              <button type="button" data-t="ONE_TIME" title="Only the next order of this party">One-time</button>
              <button type="button" data-t="CONTINUOUS" class="on" title="Every order from the start date, till cancelled">Continuous</button>
              <button type="button" data-t="DATED" title="Every order from the start date to the end date">Date range</button>
            </div></div>
          <div class="pr-to" id="toBox" hidden><label for="vto">To</label><input id="vto" class="pr-in" type="date"></div>
        </div>
        <p class="pr-lock" id="lockNote"></p>
        <table class="pr-lines"><thead><tr><th>#</th><th>Category / pack</th><th>Rate ₹ / case</th><th>Margin ₹</th><th>ROI</th><th>Last given</th><th></th></tr></thead><tbody id="lines"></tbody></table>
        <div class="pr-add">
          <button type="button" class="sl-btn ghost small" id="addLine">+ <span class="lg">Add item</span><span class="sm">Item</span></button>
          <button type="button" class="sl-btn ghost small" id="useLast" disabled>↺ Last rates<span class="lg"> of this party</span></button>
          <button type="button" class="sl-btn ghost small roi-all" id="roiAll" title="Mark every item of this offer as ROI rate (landing − ROI)">ROI<span class="lg"> rate for this party</span><span class="sm"> all</span></button>
          <span id="cnt" class="mut"></span>
        </div>
        <div class="pr-row">
          <button type="button" class="sl-btn" id="save">💾 Save</button>
          <button type="button" class="sl-btn ghost" id="img">🖼 Image</button>
          <button type="button" class="sl-btn ghost" id="wa">WhatsApp</button>
          <button type="button" class="sl-btn ghost" id="clear">New</button>
        </div>
        <p id="msg" class="pr-msg" role="status"></p>
      </section>
      <section class="pr-card" aria-labelledby="listT">
        <h2 id="listT">Rates given<span id="listN" class="mut"></span><button type="button" class="sl-btn ghost small" id="roiRep" style="margin-left:auto">📊 ROI report</button></h2>
        <p class="pr-warn" id="rcWarn" hidden></p>
        <div class="pr-top" style="grid-template-columns:minmax(0,1fr) 96px">
          <input id="q" class="pr-in" type="search" placeholder="Search party / item / RO no." aria-label="Search">
          <select id="days" class="pr-in" aria-label="Days" hidden><option value="30">30 days</option><option value="90" selected>90 days</option><option value="365">1 year</option><option value="3650">All</option></select>
        </div>
        <div class="pr-chips" id="fType" role="group" aria-label="Offer type filter"></div>
        <div class="pr-chips" id="fState" role="group" aria-label="Status filter"></div>
        <ul id="list" class="pr-list"></ul>
      </section>
    </div>
  </main>

  <datalist id="itemList"></datalist>
  <dialog id="dlg" class="pr-dlg" aria-labelledby="dlgT">
    <div class="pr-dh"><h3 id="dlgT"></h3><button type="button" class="pr-x" id="dlgX" aria-label="Close">✕</button></div>
    <div class="pr-db" id="dlgB"></div>
    <div class="pr-df pr-row" id="dlgF"></div>
  </dialog>

  <script>
    const S=LWBSales,{client,el,esc}=S;
    const setupMsg="Run lwb_party_rate_offer_setup.sql first (it runs by itself when the PR is merged).";
    const errText=e=>/lwb_party_rate/.test(e.message||"")&&/function|schema cache/.test(e.message||"")?setupMsg:(e.message||String(e));
    const key=v=>String(v||"").trim().replace(/\s+/g," ").toUpperCase();
    const money=n=>Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
    const today=()=>LWBDate&&LWBDate.today?LWBDate.today():new Date(Date.now()+19800000).toISOString().slice(0,10);
    const dshort=d=>{if(!d)return"";const [y,m,dd]=String(d).slice(0,10).split("-");return dd+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m-1]+" "+y.slice(2)};
    const TYPES={ONE_TIME:"One-time",CONTINUOUS:"Continuous",DATED:"Date range"};
    const STATES={RUNNING:"Running",UPCOMING:"Starts later",EXPIRED:"Ended",USED:"Used",CANCELLED:"Cancelled"};
    let otype="CONTINUOUS",fType="",fState="RUNNING",fFlag="";
    function setType(t){otype=TYPES[t]?t:"CONTINUOUS";el("otype").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.t===otype));
      el("toBox").hidden=otype!=="DATED";el("odateL").textContent=otype==="DATED"?"From":"Start";lockNote()}
    function lockNote(){
      const f=el("odate").value,t=el("vto").value;
      el("lockNote").textContent="🔒 "+(otype==="ONE_TIME"?"Party's next order from "+dshort(f)+" gets these rates, one time only."
        :otype==="DATED"?"Every order "+dshort(f)+(t?" to "+dshort(t):" to the end date")+" gets these rates."
        :"Every order from "+dshort(f)+" gets these rates, till cancelled.")+" Salesman cannot change them; Admin / Sales Head can.";
    }
    // "One-time · till 30 Nov" etc. for the list and popup
    const typeLine=o=>{const t=o.offer_type||"CONTINUOUS",f=o.valid_from||o.offer_date;
      return TYPES[t]+(t==="DATED"?" · "+dshort(f)+" – "+dshort(o.valid_to):" · from "+dshort(f))+(t==="ONE_TIME"&&o.used_order_no?" · used in "+o.used_order_no:"")};
    let me=null,land=new Map(),packs=[],offers=[],last=new Map(),lastParty="",saved=null;

    // ROI (Mohit, 22 Nov 2026): company ROI ₹ / case on every category except the "no ROI" ones (Admin sets them).
    // ROI is used only when marked by hand (Mohit, 22 Nov 2026: normal rates are landing + margin, no ROI): tap ROI on a
    // line, or "ROI rate for this party" for every line.
    let roiSet={roi:5,skip:new Set()},skuCat=new Map(),packCats=new Map();
    const roi=()=>Number(roiSet.roi)||0;
    const itemCats=item=>packCats.get(key(item))||(skuCat.has(key(item))?[skuCat.get(key(item))]:[]);
    const roiOk=item=>roi()>0&&!itemCats(item).some(c=>roiSet.skip.has(c));
    function roiOn(l){return !!l.item&&roiOk(l.item)&&l.tr.dataset.roi==="1"}
    function msg(t,kind){const m=el("msg");m.textContent=t||"";m.className="pr-msg"+(kind?" "+kind:"")}
    function lineRow(it){
      const tr=document.createElement("tr");
      tr.innerHTML='<td class="no"></td><td class="it"><input class="pr-in" data-f="item" list="itemList" maxlength="120" placeholder="e.g. 2.25L" aria-label="Category / pack"></td>'+
        '<td class="rt"><input class="pr-in" data-f="rate" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Rate ₹" aria-label="Rate per case"></td>'+
        '<td class="mg"><input class="pr-in" data-f="mg" type="number" step="0.5" inputmode="decimal" placeholder="± ₹" aria-label="Margin over landing" title="Margin over landing: rate = landing + margin"></td>'+
        '<td class="roi"></td><td class="last"></td><td class="act"><button type="button" class="pr-ib" data-act="hist" aria-label="Past rates" title="Past rates of this party">i</button> <button type="button" class="pr-x" data-act="del" aria-label="Remove line">✕</button></td>';
      tr.querySelector('[data-f=item]').value=it&&it.item||"";

      if(bad)throw Error(bad.item?"Enter the rate for "+bad.item+".":"Write the category / pack on line "+(lines().indexOf(bad)+1)+".");

      const txt=(t,x,y,size,color,bold,align,maxW)=>{g.fillStyle=color;g.textAlign=align||"left";g.textBaseline="middle";let s=size;g.font=FONT(bold,s);while(maxW&&g.measureText(t).width>maxW&&s>10){s--;g.font=FONT(bold,s)}g.fillText(t,x,y)};
      g.fillStyle="#0b3d91";g.fillRect(0,0,W,56);txt(String(o.party_name).toUpperCase(),W/2,28,21,"#fff",true,"center",W-30);

      ls.forEach((l,i)=>{g.fillStyle=i%2?"#f7f9fc":"#fff";g.fillRect(0,y,W,rowH);g.strokeStyle="#dfe4ea";g.beginPath();g.moveTo(0,y+rowH-.5);g.lineTo(W,y+rowH-.5);g.stroke();

      refresh();
    });
    el("lines").addEventListener("click",e=>{
      const b=e.target.closest("button[data-act]");if(!b)return;const tr=b.closest("tr");
      if(b.dataset.act==="del"){tr.remove();if(!el("lines").children.length)addLine();refresh()}
      else if(b.dataset.act==="noroi")msg(b.title,"bad");
      else if(b.dataset.act==="roi"){tr.dataset.roi=b.getAttribute("aria-pressed")==="true"?"0":"1";refresh()}
      else history(tr.querySelector('[data-f=item]').value.trim());
    });
    el("lines").addEventListener("keydown",e=>{
      if(e.key!=="Enter"||e.target.dataset.f!=="rate")return;e.preventDefault();
      const tr=e.target.closest("tr");(tr.nextElementSibling||addLine()).querySelector('[data-f=item]').focus();
    });
    el("addLine").onclick=()=>addLine(null,true);
    el("roiAll").onclick=()=>{const on=!el("roiAll").classList.contains("on");lines().forEach(l=>{if(l.item&&roiOk(l.item))l.tr.dataset.roi=on?"1":"0"});refresh()};
    el("useLast").onclick=()=>{
      const have=new Set(lines().filter(l=>l.item).map(l=>key(l.item)));
      lines().filter(l=>!l.item&&l.rate==="").forEach(l=>l.tr.remove());
      [...last.values()].filter(r=>!have.has(r.item_key)).forEach(r=>addLine({item:r.item,rate:r.rate,roi:r.roi}));
      if(!el("lines").children.length)addLine();refresh();msg("Last rates filled. Change what is new and Save.");
    };
    el("party").addEventListener("change",loadLast);
    el("party").addEventListener("blur",loadLast);
    el("clear").onclick=resetForm;
    el("save").onclick=async()=>{
      let o;try{o=collect()}catch(e){msg(e.message,"bad");return}
      el("save").disabled=true;el("save").textContent="Saving...";
      const {data,error}=await client.rpc("lwb_party_rate_offer_save",{p:o});
      el("save").disabled=false;el("save").textContent="💾 Save";
      if(error){msg(errText(error),"bad");return}
      saved={...o,offer_no:data.offer_no,id:data.id};
      el("formTitle").textContent="Saved "+data.offer_no;
      msg(data.offer_no+" saved for "+o.party_name+" ("+TYPES[o.offer_type]+"). New orders of this party get these rates fixed.","ok");
      lastParty="x";await Promise.all([loadLast(),loadList()]);
    };
    const current=()=>{try{const o=collect();return saved&&JSON.stringify(saved.lines)===JSON.stringify(o.lines)&&saved.party_name===o.party_name?saved:o}catch(e){msg(e.message,"bad");return null}};
    el("img").onclick=async()=>{const o=current();if(!o)return;const t=await shareImage(o);if(t)msg(t,"ok")};
    el("wa").onclick=()=>{const o=current();if(o)openWa(o)};
    el("q").addEventListener("input",drawList);
    el("days").addEventListener("change",loadList);
    if(window.LWBPeriod){LWBPeriod.hide(el("days"));el("days").parentElement.style.gridTemplateColumns="minmax(0,1fr)";LWBPeriod.on(loadList)}
    el("list").addEventListener("click",e=>{const li=e.target.closest("li[data-id]");if(!li)return;const o=offers.find(x=>String(x.id)===li.dataset.id);if(o)viewOffer(o)});

    // ---------- ROI setting (Admin) + ROI report ----------
    function roiLabel(){el("roiBtn").textContent="₹"+money(roi())+" ⚙";el("roiBtn").title="ROI ₹"+money(roi())+" / case"+(roiSet.skip.size?" · no ROI: "+[...roiSet.skip].join(", "):"")}
    async function loadRoi(){
      const {data,error}=await client.from("lwb_party_roi_settings").select("roi_per_case,no_roi_categories").eq("id",1).maybeSingle();
      if(!error&&data)roiSet={roi:Number(data.roi_per_case)||0,skip:new Set((data.no_roi_categories||[]).map(key))};
      roiLabel();refresh();
    }
    function roiSettings(){
      const cats=[...new Set([...skuCat.values(),...roiSet.skip])].sort(),admin=me.role==="admin";
      openDlg("ROI setting",'<div class="pr-top" style="grid-template-columns:140px minmax(0,1fr);align-items:end"><div><label for="roiV">ROI ₹ per case</label><input id="roiV" class="pr-in" type="number" min="0" step="0.5" inputmode="decimal" value="'+roi()+'"'+(admin?"":" disabled")+'></div>'+
        '<p class="mut" style="margin:0 0 6px">Ticked = company gives ROI on this category. Untick the 1-2 categories with no ROI.</p></div>'+
        '<b style="font-size:12.5px">✓ ROI given on</b> <span class="mut" style="font-size:12px">(untick = No ROI)</span><div class="pr-cats">'+(cats.length?cats.map(c=>'<label><input type="checkbox" value="'+esc(c)+'"'+(roiSet.skip.has(c)?"":" checked")+(admin?"":" disabled")+'>'+esc(c)+'</label>').join(""):'<span class="mut">No category in SKU Master.</span>')+'</div>'+
        (admin?"":'<p class="mut">Only Admin can change this.</p>'),
        admin?[["💾 Save",async()=>{
          const v=Number(document.getElementById("roiV").value),c=[...el("dlgB").querySelectorAll(".pr-cats input:not(:checked)")].map(x=>x.value);
          if(!(v>=0)){dlgMsg("Enter ROI ₹ per case.",true);return}
          const {error}=await client.rpc("lwb_party_roi_settings_save",{p_roi:v,p_categories:c});
          if(error){dlgMsg(errText(error),true);return}
          await loadRoi();closeDlg();msg("ROI setting saved.","ok")}],["Close",closeDlg,"ghost"]]:null);
    }
    el("roiBtn").onclick=roiSettings;
    const ym=()=>today().slice(0,7);
    async function roiReport(month){
      month=month||ym();
      openDlg("ROI report",'<p class="mut">Loading...</p>');
      const {data:r,error}=await client.rpc("lwb_party_roi_report",{p_month:month+"-01"});
      if(error){openDlg("ROI report",'<p class="pr-msg bad">'+esc(errText(error))+'</p>');return}
      const bal=Number(r.earned_amount)-Number(r.given_amount),cs=v=>money(Math.round(Number(v)*10)/10);
      const parties=(r.given||[]).map((p,i)=>'<tr data-p="'+i+'" style="cursor:pointer"><td><b>'+esc(p.party)+'</b> <span class="mut">▾</span></td><td class="n">'+cs(p.cases)+'</td><td class="n"><b class="dn">₹'+money(p.amount)+'</b></td></tr>'+
        p.items.map(x=>'<tr class="pr-sub" data-s="'+i+'" hidden><td>'+esc(String(x.item).toUpperCase())+' · ₹'+money(x.roi)+'/cs <span class="mut">'+esc(x.offer_no||"")+'</span></td><td class="n">'+cs(x.cases)+'</td><td class="n">₹'+money(x.amount)+'</td></tr>').join("")).join("");
      const cats=(r.earned||[]).map(c=>'<tr><td>'+esc(c.category)+(c.roi?"":' <span class="st CANCELLED">No ROI</span>')+'</td><td class="n">'+cs(c.cases)+'</td><td class="n">'+(c.roi?'<b class="up">₹'+money(c.amount)+'</b>':'<span class="mut">—</span>')+'</td></tr>').join("");
      openDlg("ROI report · "+new Date(month+"-01T00:00:00").toLocaleDateString("en-IN",{month:"long",year:"numeric"}),
        '<div class="pr-rhead"><input id="roiM" class="pr-in" type="month" value="'+esc(month)+'" max="'+ym()+'" aria-label="Month"><span class="mut">ROI ₹'+money(r.roi_per_case)+' / case · '+r.roi_parties+' parties on ROI rate now</span></div>'+
        '<div class="pr-kpi"><div class="e"><small>ROI earned</small><b>₹'+money(r.earned_amount)+'</b><span>'+cs(r.earned_cases)+' cs purchase</span></div>'+
        '<div class="g"><small>ROI given</small><b>₹'+money(r.given_amount)+'</b><span>'+cs(r.given_cases)+' cs to '+(r.given||[]).length+' parties</span></div>'+
        '<div class="bal'+(bal<0?" neg":"")+'"><small>'+(bal<0?"Given extra":"ROI left")+'</small><b>₹'+money(Math.abs(bal))+'</b><span>'+(Number(r.earned_amount)>0?Math.round(Number(r.given_amount)*100/Number(r.earned_amount))+"% given":"")+'</span></div></div>'+
        '<b style="font-size:12.5px">Parties given ROI rate</b>'+(parties?'<table class="pr-hist" data-cf-off><thead><tr><th>Party</th><th class="n">Cases</th><th class="n">ROI ₹</th></tr></thead><tbody>'+parties+'</tbody></table>':'<p class="mut">No order this month on an ROI rate.</p>')+
        '<details style="margin-top:8px"><summary style="font-size:12.5px;font-weight:700;cursor:pointer">ROI earned by category</summary>'+(cats?'<table class="pr-hist" data-cf-off><thead><tr><th>Category</th><th class="n">Purchase cs</th><th class="n">ROI ₹</th></tr></thead><tbody>'+cats+'</tbody></table>':'<p class="mut">No purchase this month.</p>')+'</details>'+
        '<p class="mut">Given = cases of this month\'s orders on offer lines marked ROI × that line\'s ROI. Earned = this month\'s purchase (goods inward) cases × ROI, no-ROI categories left out.</p>',
        [["Close",closeDlg,"ghost"]]);
      document.getElementById("roiM").onchange=e=>{if(e.target.value)roiReport(e.target.value)};
      el("dlgB").querySelectorAll("tr[data-p]").forEach(t=>t.onclick=()=>el("dlgB").querySelectorAll('tr[data-s="'+t.dataset.p+'"]').forEach(x=>x.hidden=!x.hidden));
    }
    el("roiRep").onclick=()=>roiReport();

    (async()=>{
      me=await S.start(["admin","manager"]);if(!me)return;
      el("loading").hidden=true;el("page").hidden=false;
      el("odate").value=today();setType("CONTINUOUS");for(let i=0;i<3;i++)addLine();
      try{
        // Only Rate List packs in the list (Mohit, 16 Nov 2026: SKU Master categories showed the same pack twice).
        const [pk,st,ln,cm,sc]=await Promise.all([client.from("lwb_rate_packs").select("*").eq("active",true).order("sort_no"),
          client.from("lwb_rate_settings").select("mepd_pct,roi_main").eq("id",1).maybeSingle(),
          client.from("lwb_rate_pack_skus").select("sku_key,pack_id"),
          client.from("sku_master").select("sku_name,category"),
          client.from("lwb_mepd_schemes").select("categories,mepd_pct,valid_from,valid_to,created_at")]);
        packs=pk.error?[]:(pk.data||[]);
        // Landing (excl. ROI) per pack, same formula as Rate & Scheme: today's MEPD scheme of the linked SKUs' category.
        if(!st.error&&st.data){
          const cat=new Map((cm.error?[]:cm.data||[]).filter(x=>x.category).map(x=>[key(x.sku_name),x.category]));
          const schemes=sc.error?[]:(sc.data||[]),links=ln.error?[]:(ln.data||[]);
          // Category of each pack (its linked SKUs) for the ROI "no ROI" check
          cat.forEach((c,k)=>skuCat.set(k,key(c)));
          packs.forEach(p=>{const cs=[...new Set(links.filter(l=>l.pack_id===p.id).map(l=>cat.get(key(l.sku_key))).filter(Boolean).map(key))];if(cs.length)packCats.set(key(p.pack_name),cs)});
          packs.forEach(p=>{let best=null;
            if(window.LWBMepd)links.filter(l=>l.pack_id===p.id).forEach(l=>{const x=LWBMepd.find(schemes,cat.get(key(l.sku_key)));if(x&&(!best||String(x.created_at)>String(best.created_at)))best=x});
            if(Number(p.gr)>0)land.set(key(p.pack_name),Math.round(S.landing(p,st.data,best)*100)/100)});
        }
        const names=new Map();packs.forEach(p=>names.set(key(p.pack_name),[p.pack_name,Number(p.slab3_rate)>0?"List ₹"+money(p.slab3_rate):"Rate List pack"]));
        allItems=[...names.values()];fillItems(null);
      }catch(e){}
      refresh();loadList();loadRoi();
    })();
  </script>
</body>
</html>
